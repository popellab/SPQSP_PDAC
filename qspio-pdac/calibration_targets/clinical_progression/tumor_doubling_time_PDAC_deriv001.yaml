study_interpretation: |
  Ahn et al. retrospectively analyzed 100 patients with histologically proven pancreatic ductal adenocarcinoma who underwent at least two contrast-enhanced multidetector CT scans with no intervening treatment. Tumor diameters and volumes were measured at each CT, and tumor growth rates and tumor volume doubling times (VDTs) were calculated. The reported VDTs (range 20.0 to 976.8 days, mean 132.3 +/- 132.1 days) represent macroscopic primary-tumor growth in situ in the pancreas prior to systemic therapy. For calibration, we interpret these VDTs as reflecting the effective net exponential growth rate of the primary PDAC mass in the tumor.primary compartment, and map them to model predictions by assuming that the number of cancer cells V_T.C1 is proportional to CT-visible tumor volume over the observation window.
key_assumptions:
- |
  Tumor cell number V_T.C1 is approximately proportional to CT-derived tumor volume over the observation interval, so that exponential growth rates and doubling times for cell count and volume are equivalent.
- |
  The reported 'mean, 132.3 +/- 132.1 days' for VDT represents mean +/- SD rather than SEM, based on the sample size (n=100) and consistency with the reported VDT range (20.0-976.8 days).
- |
  Tumor growth over the pre-treatment CT interval can be reasonably approximated as exponential for the purpose of defining a single VDT per patient, despite potential deviations from pure exponential growth.
- |
  The distribution of VDTs across these 100 largely advanced, untreated PDACs can be approximated by a lognormal distribution parameterized by the reported mean and SD on the linear scale, and correlations between VDT and initial tumor size are ignored for this calibration target.
key_study_limitations:
- |
  Single-center retrospective cohort of 100 patients from Korean institutions; external generalizability to broader PDAC populations may be limited.
- |
  The cohort includes a spectrum of tumor sizes (1.0-6.2 cm, mean 2.9 +/- 1.3 cm in diameter) and likely includes unresectable and metastatic disease, rather than being restricted to small, strictly resectable PDAC, so VDTs may differ somewhat from those of screen-detected resectable tumors.
- |
  VDTs were estimated from a limited number of CT timepoints per patient and assume exponential growth between scans; non-exponential growth patterns and measurement error in volumetry are not explicitly modeled.
- |
  The study does not stratify VDTs by resectability status or detailed clinical stage, limiting direct stage-specific calibration.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        import numpy as np
        # Compute a single overall tumor volume doubling time from the
        # first and last simulation timepoints, matching the clinical
        # method of fitting exponential growth between two CT scans.
        t = time
        tumor_cells = species_dict['V_T.C1']
        n = len(t)
        if n < 2 or tumor_cells[0] <= 0 or tumor_cells[-1] <= 0:
            return np.full_like(t, np.nan)
        dt = t[-1] - t[0]
        if dt <= 0:
            return np.full_like(t, np.nan)
        r = (np.log(tumor_cells[-1]) - np.log(tumor_cells[0])) / dt
        if r <= 0:
            # Tumor shrank or was static; VDT undefined for negative growth
            return np.full_like(t, np.nan)
        vdt = np.log(2.0) / r
        # Broadcast scalar VDT over the time vector for consistent interface
        return np.full_like(t, vdt)

  units: day
  species:
  - V_T.C1
  constants: []
  support: positive_unbounded
  mapping_rationale: |
    Clinical tumor volume doubling time from CT is computed by fitting exponential growth between two imaging timepoints: VDT = ln(2) / [(ln V2 - ln V1) / (t2 - t1)]. In the model, V_T.C1 (number of cancer cells in the tumor) is proportional to tumor volume under approximately constant cellularity. The observable computes a single overall VDT from the first and last simulation timepoints over the 90-day clinical_progression scenario (untreated post-diagnosis growth), matching the clinical measurement method. A 1-day baseline snapshot is insufficient because transient immune dynamics dominate the short-term growth rate. The scalar VDT is broadcast over the time vector for interface consistency.
