  assumptions:
  - name: n_mc_samples
    value: 100000.0
    units: dimensionless
    description: |
      Number of Monte Carlo samples used to sample a lognormal distribution for tumor volume doubling time based on the reported mean and SD.
    rationale: |
      100,000 samples provide stable (<1%) Monte Carlo error for median and 95% CI estimates of a moderately skewed lognormal distribution.
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np
        mean_vdt = inputs['mean_vdt'].to('day')
        sd_vdt = inputs['sd_vdt'].to('day')
        n_mc = int(inputs['n_mc_samples'].magnitude)
        m = mean_vdt.magnitude
        s = sd_vdt.magnitude
        # Convert mean and SD on linear scale to lognormal parameters
        sigma2 = np.log(1.0 + (s**2) / (m**2))
        sigma = np.sqrt(sigma2)
        mu = np.log(m) - sigma2 / 2.0
        rng = np.random.default_rng(42)
        samples = rng.lognormal(mu, sigma, n_mc) * ureg.day
        median_obs = np.median(samples)
        ci95_lower = np.percentile(samples, 2.5)
        ci95_upper = np.percentile(samples, 97.5)
        return {
            'median_obs': median_obs,
            'ci95_lower': ci95_lower,
            'ci95_upper': ci95_upper,
        }
