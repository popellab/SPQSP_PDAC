  identifiability_notes: The submodel jointly fits baseline (PBS) and 3CK-induced
    senescent CAF growth curves, inferring a nuisance baseline CAF proliferation rate
    (k_CAF_bulk_prolif) and mapping the effective proliferation of senescent CAFs
    to the QSP parameter k_apCAF_prolif. Because the in vitro cultures lack the stromal
    carrying capacity and stiffness feedback terms present in the full QSP tumor compartment,
    k_apCAF_prolif here represents an effective base proliferation rate under low-density,
    nutrient-replete conditions. In the full model, actual apCAF expansion will be
    further modulated by the stromal saturation term and by interactions with cancer
    cells and ECM. The time courses provide multiple points (days 1-7) for each condition,
    allowing reasonably tight estimation of net exponential growth rates, but they
    cannot disentangle intrinsic cell-cycle kinetics from possible changes in metabolic
    activity affecting OD450 readout. Furthermore, equating 3CK-senescent CAF proliferation
    with apCAF proliferation is a biological assumption; if apCAFs are substantially
    more quiescent than cytokine-induced senescent CAFs, this target will overestimate
    k_apCAF_prolif. These limitations should be considered when interpreting posterior
    estimates and combined with other CAF-related targets via hierarchical priors.
experimental_context:
  species: human
  system: in_vitro_primary_cells
  cell_types:
  - name: cancer-associated fibroblasts
    phenotype: Primary CAFs isolated from human pancreatic cancer tissue
    isolation_method: Isolated from pancreatic cancer surgical specimens and cultured
      according to established protocols
    source: Pancreatic cancer patients undergoing surgery at the First Affiliated
      Hospital of Xi'an Jiaotong University
  culture_conditions:
    substrate: Tissue culture plastic
    serum_concentration: 10.0
    serum_concentration_units: '% FBS'
    oxygen_level: normoxic (5% CO2, atmospheric O2)
    culture_type: 2d_monolayer
    medium: DMEM supplemented with 10% fetal bovine serum and 1% penicillin-streptomycin
    duration: Up to 7 days for long-term CAF growth assays
    notes: CAFs were treated with cytokine cocktail 3CKs (IL-1alpha, IL-1beta, TNF-alpha)
      for 48 h to induce senescence before long-term proliferation assays; OD450 readout
      reflects viable cell number.
  indication: pancreatic ductal adenocarcinoma
study_interpretation: Jiang2024 demonstrates that primary human pancreatic CAFs continue
  to proliferate over 7 days under standard culture conditions, with 3CK-induced senescence
  reducing but not abolishing net growth. Fitting exponential growth to the OD450
  time courses yields effective proliferation rates for baseline and senescent CAFs.
  Given that apCAFs in PDAC are a rare, tolerogenic, and likely slow-cycling CAF subset,
  the senescent CAF proliferation rate provides a conservative upper bound for k_apCAF_prolif
  in the QSP PDAC model. This submodel treats 3CK-senescent CAFs as a proxy for apCAFs
  to constrain k_apCAF_prolif while using baseline CAF proliferation as a nuisance
  parameter to anchor relative growth.
key_assumptions:
- OD450 from the CCK-8/proliferation assay is proportional to viable CAF number over
  the 0-7 day window, without saturation of the colorimetric signal.
- CAF proliferation during the assay can be approximated as exponential growth (constant
  per-day net growth rate), as cell densities remain below strong contact inhibition
  or nutrient limitation.
- The stromal carrying capacity and stiffness-mediated fibroblast activation terms
  that modulate apCAF proliferation in vivo are negligible in this in vitro system,
  so the logistic factor in the full QSP model is approximated as unity.
- 3CK-induced senescent CAFs are used as a biological proxy for apCAFs, assuming that
  apCAFs have proliferation rates comparable to or lower than cytokine-induced senescent
  CAFs.
- "The CAF growth assays are assumed to have been performed in triplicate (n=3), a\
  \ standard practice for OD-based proliferation assays, since Jiang2024 reports mean\
  \ \xB1 SD but does not explicitly state sample size."
- Differences in OD450 between PBS and 3CK conditions primarily reflect changes in
  cell number (proliferation and survival), not large shifts in per-cell metabolic
  activity that would decouple OD from cell count.
key_study_limitations:
- The CAFs studied are bulk CAF populations derived from pancreatic cancer tissue
  and are not sorted into apCAF, iCAF, or myCAF subtypes; mapping senescent CAF kinetics
  to apCAF-specific proliferation requires a proxy assumption.
- The in vitro culture environment lacks the complex tumor microenvironmental cues
  present in PDAC (e.g., dense collagen matrix, mechanical stiffness, hypoxia, immune
  cells), so inferred proliferation rates may differ from in vivo apCAF behavior.
- OD450 is an indirect measure of cell number and can be influenced by cell size and
  metabolic state; senescent CAFs may have altered metabolism, potentially biasing
  effective growth rate estimates.
- The exact number of technical/biological replicates for the growth curves is not
  explicitly reported; assuming n=3 introduces uncertainty into the estimation of
  measurement variability.
- Only a single CAF isolation protocol and limited donor set are used, so inter-patient
  variability in CAF proliferation and senescence response is not captured.
primary_data_source:
  doi: 10.4251/wjgo.v16.i9.3980
  title: Resveratrol inhibits pancreatic cancer proliferation and metastasis by depleting
    senescent tumor-associated fibroblasts
  authors:
  - He Jiang
  - Guo-Tai Wang
  - Zheng Wang
  - Qing-Yong Ma
  - Zhen-Hua Ma
  year: 2024
  source_tag: Jiang2024
  source_relevance:
    indication_match: exact
    indication_match_justification: The study uses primary cancer-associated fibroblasts
      isolated from human pancreatic cancer tissues and investigates their proliferation
      and senescence, directly matching the PDAC indication of the QSP model. Although
      the focus is on senescent CAFs and resveratrol treatment, the baseline and 3CK-induced
      CAF growth kinetics are mechanistically relevant to stromal fibroblast dynamics
      in PDAC.
    species_source: human
    species_target: human
    source_quality: primary_human_in_vitro
    perturbation_type: pharmacological
    perturbation_relevance: CAF proliferation is measured under baseline culture conditions
      and after exposure to a cytokine cocktail (3CKs) that induces senescence, with
      and without resveratrol. For constraining k_apCAF_prolif, we use the 3CK-induced
      senescent CAF condition as a proxy for apCAFs, recognizing that this represents
      cytokine-driven senescence rather than spontaneous in situ apCAF behavior; thus
      inferred rates are treated as approximate upper bounds rather than exact physiological
      values.
    tme_compatibility: moderate
    tme_compatibility_notes: Primary human CAFs are used, preserving some patient-specific
      stromal characteristics, but they are cultured on plastic in 2D without the
      desmoplastic ECM, hypoxia, and immune infiltrate characteristic of PDAC in vivo.
      As a result, mechanical feedback, matrix confinement, and paracrine signaling
      that regulate CAF proliferation in tumors are absent, so in vitro proliferation
      rates are expected to be higher than, or at least different from, in vivo apCAF
      proliferation rates.
    measurement_directness: direct
    temporal_resolution: timecourse
    experimental_system: in_vitro_primary
tags:
- CAF
