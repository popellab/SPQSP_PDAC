- name: CAF_growth_n_replicates
  value: 3.0
  units: dimensionless
  input_type: reference_value
  rationale: "Typical CCK-8/OD450 proliferation assays are performed in triplicate;\
    \ Jiang2024 reports mean \xB1 SD but does not explicitly state n, so n=3 is assumed\
    \ as a conservative estimate of replicate number for bootstrap uncertainty."
  source_ref: Jiang2024
  source_location: CAF long-term growth assay
calibration:
  parameters:
  - name: k_apCAF_prolif
    units: 1/day
    nuisance: false
  - name: k_CAF_bulk_prolif
    units: 1/day
    nuisance: true
    prior:
      distribution: lognormal
      mu: -2.3
      sigma: 0.8
  forward_model:
    data_rationale: Jiang2024 Figure 2D reports 7-day OD450 time courses for primary
      human pancreatic CAFs cultured with PBS (baseline) or 3CKs (IL-1alpha, IL-1beta,
      TNF-alpha) to induce senescence. OD450 is proportional to viable CAF number,
      and over the 0-7 day window the curves show monotonic growth without clear saturation,
      consistent with approximate exponential growth at low density.
    submodel_rationale: In the full QSP PDAC model, apCAFs proliferate with rate k_apCAF_prolif
      modulated by a stromal carrying capacity term that depends on total activated
      PSCs, cancer cell burden, and stiffness-mediated fibroblast activation. The
      Jiang2024 in vitro CAF cultures lack these tissue-level constraints (no tumor
      cells, limited ECM, no stiffness feedback), so the carrying capacity term is
      approximated as unity, reducing apCAF dynamics to simple exponential growth.
      We proxy apCAF proliferation by the effective proliferation of 3CK-induced senescent
      CAFs, assuming apCAFs are a slow-cycling, senescence-like CAF subset. Baseline
      CAF proliferation under PBS is included via a separate nuisance rate k_CAF_bulk_prolif
      to better constrain relative growth and avoid conflating bulk CAF kinetics with
      apCAF-specific proliferation.
    independent_variable:
      name: time
      units: day
      span:
      - 0.0
      - 7.0
    state_variables:
    - name: CAF_pbs
      units: dimensionless
      initial_condition:
        input_ref: CAF_pbs_OD_day0
        rationale: Day 0 OD450 for PBS-treated CAFs from Jiang2024 Figure 2D, used
          as initial viable CAF level for baseline condition.
    - name: CAF_3ck
      units: dimensionless
      initial_condition:
        input_ref: CAF_3ck_OD_day0
        rationale: Day 0 OD450 for 3CK-treated CAFs from Jiang2024 Figure 2D, used
          as initial viable CAF level for senescent condition.
    type: custom_ode
    code: "def ode(t, y, params, inputs):\n    # y[0]: CAF_pbs (baseline CAFs, PBS-treated)\n\
      \    # y[1]: CAF_3ck (senescent CAFs induced by 3CKs)\n    CAF_pbs, CAF_3ck\
      \ = y\n    k_bulk = params['k_CAF_bulk_prolif']\n    k_ap = params['k_apCAF_prolif']\n\
      \    # In the full QSP model, apCAF proliferation follows:\n    # d(apCAF)/dt\
      \ = k_apCAF_prolif * apCAF * (1 - aPSC_total/(f_stroma_max*C_total + K_stiff_niche*H_stiff_fib\
      \ + cell))\n    # In this in vitro assay, CAFs are cultured at low density on\
      \ plastic with ample nutrients\n    # and without stromal saturation or stiffness-mediated\
      \ feedback, so the logistic term is\n    # approximated as ~1. Thus dynamics\
      \ reduce to simple exponential growth with rate k.\n    dCAF_pbs = k_bulk *\
      \ CAF_pbs\n    dCAF_3ck = k_ap * CAF_3ck\n    return [dCAF_pbs, dCAF_3ck]"
  error_model:
  - name: CAF_pbs_day1_OD
    observable:
      type: identity
      state_variables:
      - CAF_pbs
    units: dimensionless
    uses_inputs:
    - CAF_pbs_OD_day1_mean
    - CAF_pbs_OD_day1_sd
    - CAF_growth_n_replicates
    evaluation_points:
    - 1.0
    sample_size_input: CAF_growth_n_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['CAF_pbs_OD_day1_mean']\n    sd =\
      \ inputs['CAF_pbs_OD_day1_sd']\n    cv = sd / mean\n    sigma_ln = np.sqrt(np.log(1.0\
      \ + cv**2))\n    mu_ln = np.log(mean) - sigma_ln**2 / 2.0\n    return rng.lognormal(mu_ln,\
      \ sigma_ln / np.sqrt(sample_size), n_bootstrap)"
    n_bootstrap: 10000
  - name: CAF_pbs_day2_OD
    observable:
      type: identity
      state_variables:
      - CAF_pbs
    units: dimensionless
    uses_inputs:
    - CAF_pbs_OD_day2_mean
    - CAF_pbs_OD_day2_sd
    - CAF_growth_n_replicates
    evaluation_points:
    - 2.0
    sample_size_input: CAF_growth_n_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['CAF_pbs_OD_day2_mean']\n    sd =\
      \ inputs['CAF_pbs_OD_day2_sd']\n    cv = sd / mean\n    sigma_ln = np.sqrt(np.log(1.0\
      \ + cv**2))\n    mu_ln = np.log(mean) - sigma_ln**2 / 2.0\n    return rng.lognormal(mu_ln,\
      \ sigma_ln / np.sqrt(sample_size), n_bootstrap)"
    n_bootstrap: 10000
  - name: CAF_pbs_day3_OD
    observable:
      type: identity
      state_variables:
      - CAF_pbs
    units: dimensionless
    uses_inputs:
    - CAF_pbs_OD_day3_mean
