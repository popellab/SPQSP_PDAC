target_id: k_TGFb_Tsec
inputs:
- name: TGFb_Tcell_stim_mean_pg_per_ml
  value: 152.48
  units: picogram/milliliter
  input_type: direct_measurement
  source_ref: Yang2013
  source_location: Figure 1B, intratumoral T cells + PMA/Ion
  figure_excerpt:
    figure_id: Figure 1B
    value: ~150
    description: Mean TGF-b concentration in supernatants of intratumoral T cells
      stimulated with PMA/ionomycin
    context: TGF-b levels in culture supernatants of freshly-isolated intratumoral
      T cells (n=5) from B-cell NHL patients, treated with PMA/ionomycin and measured
      by ELISA
- name: TGFb_Tcell_stim_sd_pg_per_ml
  value: 48.84
  units: picogram/milliliter
  input_type: direct_measurement
  source_ref: Yang2013
  source_location: Figure 1B, intratumoral T cells + PMA/Ion error bar
  figure_excerpt:
    figure_id: Figure 1B
    value: error bar height ~50
    description: Approximate SD (height of error bar) for TGF-b concentration in supernatants
      of intratumoral T cells with PMA/ionomycin
    context: Error bars represent variability across n=5 intratumoral T cell samples
- name: n_Tcells_TGFb_samples
  value: 5.0
  units: dimensionless
  input_type: direct_measurement
  source_ref: Yang2013
  source_location: Figure 1B legend and Results text
  value_snippet: 'intratumoral T cells (median: 72.7; range from undetectable to 350,
    n = 5)'
- name: n_T_cells_per_culture
  value: 1000000.0
  units: cell
  input_type: reference_value
  rationale: Yang2013 does not state T cell seeding density for ELISA cultures. A
    value of 1e6 intratumoral T cells per mL (typical for primary human T cell cultures
    on anti-CD3-coated plates) is assumed to convert pg/mL measurements to per-cell
    secretion rates. This is treated as an approximate physiological reference rather
    than a direct measurement.
  source_ref: Yang2013
  source_location: Methods (cell culture conditions not explicitly stated)
- name: culture_medium_volume_ml
  value: 1.0
  units: milliliter
  input_type: reference_value
  rationale: Assume 1.0 mL culture medium per well for primary T cell cultures (typical
    of 24-well plate formats) to convert per-mL TGF-b concentrations to total mass
    per culture. Not specified in Yang2013; taken as a standard culture condition.
  source_ref: Yang2013
  source_location: Methods (culture volume not explicitly stated)
- name: TGFb_Tcell_culture_duration_day
  value: 3.0
  units: day
  input_type: reference_value
  rationale: Most T cell differentiation and cytokine production assays in Yang2013
    (e.g., TH17 induction and proliferation assays) use 3-day cultures. We therefore
    assume TGF-b ELISA supernatants in Figure 1B were collected after 3 days of culture,
    providing an approximate accumulation time window.
  source_ref: Yang2013
  source_location: Methods (exact supernatant collection time not explicitly stated)
- name: TGFb1_MW_g_per_mol
  value: 25000.0
  units: gram/mole
  input_type: reference_value
  rationale: Approximate molecular weight of mature dimeric human TGF-b1 is 25 kDa
    (25,000 g/mol), used to convert between moles and mass (pg) in secretion calculations.
  source_ref: Yang2013
  source_location: Not explicitly stated; standard biochemical property of human TGF-b1
calibration:
  parameters:
  - name: k_TGFb_Tsec
    units: nanomole/cell/day
    nuisance: false
  forward_model:
    data_rationale: Yang2013 reports TGF-b concentrations (pg/mL) in culture supernatants
      from freshly isolated human intratumoral T cells from B-cell NHL patients after
      in vitro stimulation with PMA/ionomycin. Under standard culture conditions,
      this is well-approximated as batch accumulation of secreted TGF-b over a fixed
      incubation period in a known medium volume.
    submodel_rationale: 'In the full QSPIO-PDAC model, k_TGFb_Tsec controls the per-cell
      secretion rate of TGF-b by Treg cells in the tumor compartment. The batch_accumulation
      model directly mirrors this usage: total TGF-b secreted equals secretion rate
      per T cell multiplied by the number of intratumoral T cells and culture duration,
      divided by culture volume and converted to pg/mL via molecular weight. Degradation
      during the short in vitro assay is neglected, consistent with the core model
      which treats k_TGFb_Tsec as a net secretion rate parameter.'
    type: batch_accumulation
    secretion_rate: k_TGFb_Tsec
    cell_count:
      input_ref: n_T_cells_per_culture
    incubation_time:
      input_ref: TGFb_Tcell_culture_duration_day
    molecular_weight:
      input_ref: TGFb1_MW_g_per_mol
    medium_volume:
      input_ref: culture_medium_volume_ml
    unit_conversion_factor: '1000.0'
  error_model:
  - name: tgfb_tcell_supernatant_stim
    units: picogram/milliliter
    uses_inputs:
    - TGFb_Tcell_stim_mean_pg_per_ml
    - TGFb_Tcell_stim_sd_pg_per_ml
    - n_Tcells_TGFb_samples
    sample_size_input: n_Tcells_TGFb_samples
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['TGFb_Tcell_stim_mean_pg_per_ml']\n\
      \    sd = inputs['TGFb_Tcell_stim_sd_pg_per_ml']\n    # Assume error bars represent\
      \ SD across patient samples (n = 5)\n    cv = sd / mean\n    sigma_ln = np.sqrt(np.log(1.0\
      \ + cv**2))\n    mu_ln = np.log(mean) - sigma_ln**2 / 2.0\n    # Parametric\
      \ bootstrap of the sample mean under lognormal assumption\n    return rng.lognormal(mu_ln,\
      \ sigma_ln / np.sqrt(sample_size), n_bootstrap)\n"
    n_bootstrap: 10000
  identifiability_notes: This target constrains k_TGFb_Tsec using a single-condition
    batch secretion measurement from bulk intratumoral T cells (mixed CD4+/CD8+/Treg)
    in human B-cell NHL. The observable (TGF-b concentration after culture) is proportional
    to k_TGFb_Tsec times the product of cell_count, incubation_time, and a known conversion
    factor. Because cell_count and incubation_time are not reported explicitly, they
    are treated as fixed reference values based on typical primary T cell culture
    conditions (1e6 cells/mL, 3 days). Consequently, k_TGFb_Tsec is only identifiable
    up to uncertainties in these assumed culture parameters and should be interpreted
    as an order-of-magnitude estimate. Moreover, only a subset of the cultured T cells
    are true Tregs, so the inferred per-cell secretion rate for Tregs in PDAC may
    be higher than the bulk per-T cell rate estimated here. Despite these limitations,
    the target provides a human, tumor-context anchor for T cell-derived TGF-b secretion
    that complements murine infection-based estimates (e.g., Mason2007).
experimental_context:
  species: human
  system: in_vitro_primary_cells
  cell_types:
  - name: intratumoral T cells
    phenotype: mixed CD4+ and CD8+ T cells including regulatory T cells
    isolation_method: positive selection of CD3+, CD4+, CD8+ subsets from B-cell NHL
      lymph node or tissue biopsies using magnetic microbeads
    source: fresh biopsy specimens from patients with B-cell non-Hodgkin lymphoma
  culture_conditions:
    substrate: anti-CD3 antibody-coated plastic plates
    serum_concentration: 10.0
    serum_concentration_units: percent
    oxygen_level: normoxic incubator (5% CO2, 37C)
    culture_type: 2d_monolayer
    medium: RPMI-1640 + 10% fetal calf serum
    supplements: PMA/ionomycin stimulation for T cells as described in Yang2013
    duration: Assumed 3-day culture for TGF-b ELISA based on typical conditions used
      elsewhere in the paper
    notes: Exact T cell seeding density, culture volume, and supernatant collection
      time for the TGF-b ELISA in Figure 1B are not explicitly stated; standard primary
      T cell culture conditions are assumed for rate conversion.
  indication: B-cell non-Hodgkin lymphoma
study_interpretation: Yang2013 demonstrates that freshly isolated human intratumoral
  T cells from B-cell NHL patients secrete measurable amounts of soluble TGF-b when
  stimulated with PMA/ionomycin in short-term culture. By treating this system as
  batch accumulation of TGF-b in a defined culture volume over an assumed 3-day incubation
  period, we convert the reported supernatant concentration (pg/mL) into an approximate
  per-T-cell secretion rate in nmol/cell/day. Although the cultured T cell population
  is mixed and only a fraction are bona fide Tregs, these intratumoral T cells are
  chronically antigen-exposed and provide a human tumor-context benchmark for T cell-derived
  TGF-b production. This informs the QSPIO-PDAC parameter k_TGFb_Tsec by anchoring
  it to empirically observed TGF-b production from human tumor-infiltrating T cells,
  rather than relying solely on murine infection models or stromal-cell secretion
  data.
key_assumptions:
- Supernatant TGF-b levels in Figure 1B arise predominantly from T cell secretion
  during the in vitro culture period, with negligible degradation or consumption over
  3 days.
- The TGF-b ELISA supernatants for intratumoral T cells were collected after approximately
  3 days of culture, consistent with other T cell differentiation and cytokine assays
  in Yang2013.
- An effective seeding density of 1e6 intratumoral T cells per mL in 1.0 mL culture
  medium is assumed, reflecting typical primary human T cell cultures on anti-CD3-coated
  plates; this value is not explicitly reported in Yang2013.
- Error bars in Figure 1B are interpreted as standard deviations across patient samples
  (n = 5), and measurement noise for TGF-b concentrations is modeled as lognormal.
- Bulk intratumoral T cell TGF-b secretion (mixed CD4+/CD8+/Treg) is used as a proxy
  for per-Treg secretion; in the PDAC QSP model k_TGFb_Tsec is interpreted as an effective
  per-Treg rate that may be somewhat higher than the bulk per-T cell rate inferred
  here.
- The molecular weight of mature human TGF-b1 is approximated as 25 kDa for molar-mass
  conversions; isoform differences and latent vs active forms are neglected.
key_study_limitations:
- 'Tumor indication differs: data are from B-cell non-Hodgkin lymphoma rather than
  PDAC, so T cell phenotypes and TGF-b production may differ between indications.'
- The intratumoral T cell population is heterogeneous and not purified for Tregs;
  only a subset of cells secrete TGF-b at high rates, so the per-Treg secretion rate
  in PDAC may be underestimated by this bulk per-T cell estimate.
- Seeding density, culture volume, and exact incubation time for the TGF-b ELISA are
  not reported and are approximated from typical culture conditions, introducing systematic
  uncertainty in the inferred k_TGFb_Tsec.
- Only a single stimulated condition is used to constrain the secretion rate, limiting
  the ability to detect nonlinearity or saturation in TGF-b production with respect
  to activation strength.
- Latent versus active TGF-b fractions are not distinguished; the ELISA uses acid
  activation so total (latent + active) TGF-b is measured, whereas the QSP model may
  implicitly track biologically active TGF-b.
primary_data_source:
  doi: 10.1371/journal.pone.0059456
  title: Soluble and Membrane-Bound TGF-beta-Mediated Regulation of Intratumoral T
    Cell Differentiation and Function in B-Cell Non-Hodgkin Lymphoma
  authors:
  - Yang
  - Grote DM
  - Ziesmer SC
  - Xiu B
  - Yates NR
  - Secreto FJ
  - Hodge LS
  - Witzig TE
  - Novak AJ
  - Ansell SM
  year: 2013
  source_tag: Yang2013
  source_relevance:
    indication_match: proxy
    indication_match_justification: The experimental data are derived from intratumoral
      T cells isolated from patients with B-cell non-Hodgkin lymphoma, whereas the
      QSPIO-PDAC model targets pancreatic ductal adenocarcinoma. Both are human solid-tumor
      or lymphoid malignancies with immunosuppressive microenvironments in which T
      cells encounter chronic antigen and upregulate regulatory programs, including
      TGF-b production. However, the tissue context (lymph node and extranodal sites
      vs pancreas), stromal composition, and myeloid/CAF compartments differ substantially,
      so quantitative TGF-b secretion rates may differ by several-fold between indications.
      We therefore treat this source as a mechanistic proxy rather than an exact match.
    species_source: human
    species_target: human
    source_quality: primary_human_in_vitro
    perturbation_type: pathological_state
    perturbation_relevance: TGF-b secretion is measured from intratumoral T cells
      derived from untreated B-cell NHL biopsies under strong polyclonal stimulation
      (PMA/ionomycin). This reflects the capacity of chronically antigen-exposed human
      tumor-infiltrating T cells to produce TGF-b, but not baseline secretion in the
      absence of stimulation. For the PDAC model, this is interpreted as approximating
      the upper range of Treg-mediated TGF-b secretion under strong activation.
    tme_compatibility: moderate
    tme_compatibility_notes: 'Both B-cell NHL and PDAC feature immunosuppressive tumor
      microenvironments with abundant regulatory cells and inhibitory cytokines, but
      they differ in stromal architecture: PDAC is highly desmoplastic with dense
      fibroblast and ECM networks, whereas B-cell NHL arises in lymphoid tissues with
      different stromal and vascular organization. Because the measured quantity is
      TGF-b secretion from isolated T cells in short-term culture (rather than in
      situ concentrations), these TME differences are expected to introduce moderate,
      but not order-of-magnitude, uncertainty when translating to PDAC Treg secretion
      rates.'
    measurement_directness: single_inversion
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: ex_vivo
