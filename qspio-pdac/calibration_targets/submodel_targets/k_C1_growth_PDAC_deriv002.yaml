calibration:
  parameters:
  - name: k_C1_growth
    units: 1/day
  forward_model:
    type: algebraic
    formula: VDT = ln(2) / k_C1_growth
    data_rationale: 'Jang2015 reports mean VDT for untreated early PDAC lesions imaged serially by MRI.

      The clinical observable is VDT, not the instantaneous proliferation rate; an algebraic

      relationship between k_C1_growth and VDT is appropriate.

      '
    submodel_rationale: 'In the full model, for small tumors (C_total << C_max), growth reduces to exponential

      with VDT = ln(2)/k_C1_growth. The clinical VDT measurements thus provide a

      mechanistically consistent constraint on k_C1_growth.

      '
    code: "def compute(params, inputs):\n    k = params['k_C1_growth']\n    t_double = np.log(2) / k\n    return t_double\n"
  error_model:
  - name: vdt_jang2015
    units: day
    uses_inputs:
    - jang_vdT_mean
    - jang_vdT_min
    - jang_vdT_max
    - jang_n_patients
    sample_size_input: jang_n_patients
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean_vdt\
      \ = inputs['jang_vdT_mean']\n    vdt_min = inputs['jang_vdT_min']\n    vdt_max = inputs['jang_vdT_max']\n    # Approximate\
      \ log-space SD assuming range ~ 95% CI of lognormal\n    log_min = np.log(vdt_min)\n    log_max = np.log(vdt_max)\n\
      \    sd_log = (log_max - log_min) / (2 * 1.96)\n    mu_ln = np.log(mean_vdt) - sd_log**2 / 2\n    return rng.lognormal(mu_ln,\
      \ sd_log, size=n_bootstrap)\n"
  identifiability_notes: 'k_C1_growth is structurally identifiable from VDT via VDT = ln(2)/k. The wide VDT range

    (18.3-417.8 days) reflects substantial inter-patient heterogeneity. This provides a

    complementary constraint to the Ahn2017 target (n=100) with a smaller but independent

    cohort (n=22) using MRI rather than CT.

    '
