study_interpretation: 'Jang2015 provides direct clinical measurements of tumor volume doubling time for untreated

  early PDAC lesions, derived from serial prediagnostic MRI scans in 22 patients. The reported

  mean VDT of 151.7 days (range 18.3-417.8 days) reflects the net growth of viable cancer

  cells in vivo, encompassing intrinsic proliferation, natural cell death, and ongoing host

  immune interactions.

  '
key_assumptions:
- 'Tumor growth between prediagnostic MRIs can be approximated by logistic growth with

  C_total << C_max, so that dC1/dt ~ k_C1_growth * C1 and VDT ~ ln(2)/k_C1_growth.

  '
- 'The reported lesion volume doubling times primarily reflect intrinsic tumor cell kinetics

  under baseline host immunity and stroma, and can be mapped to an effective net

  proliferation rate.

  '
- 'The observed minimum and maximum VDT values (18.3 and 417.8 days) approximate a 95%

  interval of an underlying lognormal distribution across patients.

  '
- 'Early, small PDAC lesions in this cohort have proliferation characteristics representative

  of the PDAC tumors modeled in QSPIO-PDAC.

  '
key_study_limitations:
- 'Single-center retrospective cohort from a Korean tertiary hospital (n=22); patient

  demographics and tumor biology may not fully represent global PDAC populations.

  '
- 'Wide VDT range (18.3-417.8 days) indicates substantial inter-patient heterogeneity

  captured only statistically.

  '
- 'Volume measurements depend on MRI-based lesion segmentation, which may introduce

  measurement errors especially for small tumors.

  '
- 'Growth is characterized only over the prediagnostic imaging interval; very early

  microscopic disease and later advanced stages may exhibit different dynamics.

  '
