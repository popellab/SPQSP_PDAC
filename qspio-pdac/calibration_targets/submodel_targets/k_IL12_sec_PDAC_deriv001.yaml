target_id: k_IL12_sec
inputs:
- name: DC_cells_per_well
  value: 100000.0
  units: cell
  input_type: reference_value
  rationale: Jensen2010 specifies that DCs were set up in 96-well plates with 100.000
    cells/well for ELISA measurements. The value 100000.0 represents the same quantity
    without the thousands separator and is treated as a fixed experimental condition
    rather than a parameter to infer.
  source_ref: Jensen2010
  source_location: Methods, ELISA and PGE2 measurements
  value_snippet: DCs were setup in 96 well plates with 100.000 cells/well and cocktails
    tested in triplicates.
- name: incubation_time_hour
  value: 24.0
  units: hour
  input_type: direct_measurement
  source_ref: Jensen2010
  source_location: Methods, ELISA and PGE2 measurements
  value_snippet: "After 24 h incubation with cocktails, the conditioned media was\
    \ removed from the wells and stored at -80\xB0C until analyses."
- name: culture_volume_mL
  value: 0.2
  units: milliliter
  input_type: reference_value
  rationale: Standard working volume for 96-well round- or flat-bottom tissue culture
    plates is approximately 200 microliters; Jensen2010 specifies 96-well plates but
    not the exact volume, so 0.2 mL is assumed as a typical value.
  source_ref: Jensen2010
  source_location: Methods, ELISA and PGE2 measurements
- name: IL12p70_cock2_mean_ng_per_mL
  value: 20.0
  units: nanogram / milliliter
  input_type: direct_measurement
  source_ref: Jensen2010
  source_location: Figure 1A, cocktail 2
  figure_excerpt:
    figure_id: Figure 1A
    value: ~20
    description: Approximate mean IL-12p70 concentration for cocktail 2 across 15
      donors after 24 h, estimated from bar height and data point distribution.
    context: IL-12p70 secretion from immature DCs treated with optimized cocktails;
      y-axis labeled IL-12p70 (ng/mL).
- name: IL12p70_cock2_variability_factor
  value: 0.5
  units: dimensionless
  input_type: reference_value
  rationale: Visual inspection of donor scatter in Figure 1A for cocktail 2 shows
    IL-12p70 values ranging roughly from ~5 to ~35 ng/mL around a mean near 20 ng/mL,
    corresponding to a coefficient of variation on the order of 50%. This dimensionless
    variability factor (0.5) is used as an approximate relative standard deviation
    for bootstrapping.
  source_ref: Jensen2010
  source_location: Figure 1A, IL-12p70 secretion
- name: n_donors_IL12_cock2
  value: 15.0
  units: dimensionless
  input_type: direct_measurement
  source_ref: Jensen2010
  source_location: Results, Identification of cocktails with the capability to induce
    secretion of the Th-1 promoting cytokines IL-12p70 and TNFa from human dendritic
    cells
  value_snippet: a series of 15 different donor-derived batches of DCs were tested
    for their individual response to the range of optimized cocktails from table 1.
calibration:
  parameters:
  - name: k_IL12_sec
    units: nanomole / cell / day
    nuisance: false
  forward_model:
    data_rationale: Jensen2010 measured IL-12p70 concentrations (ng/mL) in 24 h supernatants
      from 1x10^5 human monocyte-derived DCs cultured in 96-well plates and stimulated
      with various maturation cocktails. For a given cocktail and time, the experiment
      corresponds to simple batch accumulation of secreted IL-12 in a fixed medium
      volume.
    submodel_rationale: 'In the full PDAC QSP model, IL-12 in the tumor compartment
      is produced by mature dendritic cells (mcDC1) via a zero-order secretion term:
      rate = k_IL12_sec * V_T.mcDC1. This is equivalent to a constant per-cell secretion
      rate integrated over time and diluted into the local volume. The batch_accumulation
      submodel maps this per-cell secretion rate to the measured IL-12p70 concentration
      in a defined culture volume over 24 h, matching the mechanistic usage of k_IL12_sec.'
    type: batch_accumulation
    secretion_rate: k_IL12_sec
    cell_count:
      input_ref: DC_cells_per_well
    incubation_time:
      input_ref: incubation_time_hour
    molecular_weight: '70000.0'
    medium_volume:
      input_ref: culture_volume_mL
    unit_conversion_factor: '0.0416666666667'
  error_model:
  - name: IL12p70_cocktail2_24h
    units: nanogram / milliliter
    uses_inputs:
    - IL12p70_cock2_mean_ng_per_mL
    - IL12p70_cock2_variability_factor
    - n_donors_IL12_cock2
    sample_size_input: n_donors_IL12_cock2
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['IL12p70_cock2_mean_ng_per_mL']\n\
      \    cv = inputs['IL12p70_cock2_variability_factor']\n    sd = mean * cv\n \
      \   sigma_ln = np.sqrt(np.log(1.0 + cv**2))\n    mu_ln = np.log(mean) - sigma_ln**2\
      \ / 2.0\n    return rng.lognormal(mu_ln, sigma_ln / np.sqrt(sample_size), n_bootstrap)\n"
    n_bootstrap: 10000
  identifiability_notes: This target uses a single 24 h batch-accumulation measurement
    (mean IL-12p70 concentration across 15 donors for the most IL-12-inducing cocktail)
    to constrain k_IL12_sec. Given fixed cell number, incubation time, and assumed
    well volume, the per-cell secretion rate is structurally identifiable from this
    observable. The main uncertainties arise from (1) the approximate mean concentration
    digitized from a figure, (2) the assumed culture volume of 0.2 mL, and (3) the
    approximate coefficient of variation across donors encoded in the variability
    factor. These dominate over numerical identifiability issues. The inferred k_IL12_sec
    should be interpreted as an upper-bound secretion rate for strongly activated
    human monocyte-derived DCs under Th1-polarizing conditions, rather than a precise
    in vivo tumor-resident cDC1 rate.
experimental_context:
  species: human
  system: in_vitro_primary_cells
  cell_types:
  - name: monocyte-derived dendritic cells
    phenotype: immature human monocyte-derived DCs differentiated with GM-CSF and
      IL-4, then matured with TLR-agonist/cytokine cocktails
    isolation_method: CD14+ monocytes positively selected from PBMC by magnetic beads
    source: Peripheral blood buffy coats from healthy adult donors above age 18
  culture_conditions:
    substrate: 6-well and 96-well plastic tissue culture plates
    serum_concentration: 5.0
    serum_concentration_units: percent
    oxygen_level: normoxic incubator conditions (not explicitly stated, standard 37C,
      5% CO2 assumed)
    culture_type: 2d_monolayer
    medium: RPMI-1640 with 5% FCS, supplemented with GM-CSF (20 ng/mL) and IL-4 (20
      ng/mL) during differentiation
    supplements: 'During differentiation: GM-CSF (20 ng/mL) + IL-4 (20 ng/mL). During
      maturation: various TLR agonists and cytokines as per cocktail 2 (IFNg, poly
      I:C, IL-1b, IFNa).'
    duration: 6 days differentiation to immature DCs, followed by 24 h stimulation
      with maturation cocktails for ELISA readouts.
    notes: After 6 days of culture the immature DCs were replated into 96-well plates
      at 1x10^5 cells/well for cytokine secretion assays.
  indication: autoimmune and inflammatory conditions modeled in vitro as Th1-promoting
    DC maturation; used here as a mechanistic proxy for PDAC tumor-resident DC IL-12
    secretion capacity.
study_interpretation: 'Jensen2010 demonstrates that human monocyte-derived immature
  DCs can be driven into strongly Th1-promoting inflammatory DCs by specific combinations
  of TLR agonists and cytokines. The most potent cocktail (cocktail 2: IFNg + poly
  I:C + IL-1b + IFNa) induces high IL-12p70 secretion over 24 h from a known number
  of DCs in a fixed culture volume. This provides a direct, mechanistically aligned
  estimate of the per-cell IL-12 secretion rate under near-maximal activation. In
  the PDAC QSP model, k_IL12_sec represents the IL-12 secretion rate per mature APC
  (mcDC1) in the tumor compartment; under conditions of strong danger and Th1-polarizing
  signals, tumor-resident cDC1 are expected to approach similar per-cell secretion
  capacities. Thus, the Jensen2010 batch accumulation data are used to calibrate k_IL12_sec
  as an approximate upper bound for IL-12 production by fully activated human DCs.'
key_assumptions:
- Culture volume in 96-well plates for ELISA assays is 0.2 mL per well, consistent
  with standard tissue culture practice but not explicitly reported in Jensen2010.
- All 1x10^5 DCs per well are assumed to be viable and capable of IL-12 secretion
  after 24 h stimulation with cocktail 2; partial maturation or viability losses are
  not explicitly modeled and are effectively absorbed into the inferred k_IL12_sec.
- IL-12p70 secretion over the 24 h incubation is approximated as occurring at a constant
  per-cell rate, so that total accumulated IL-12 is proportional to k_IL12_sec times
  time; any early lag or late saturation phases are neglected.
- The mean IL-12p70 concentration for cocktail 2 (~20 ng/mL) is estimated from Figure
  1A rather than an explicit numeric table, and is treated as an approximate central
  value for calibration.
- An approximate coefficient of variation of 50% for IL-12p70 across donors is used
  based on the spread of points in Figure 1A and typical biological variability, and
  is encoded as a variability factor input.
- Monocyte-derived DCs from healthy donors are used as a proxy for tumor-resident
  cDC1 in PDAC; it is assumed that their maximal IL-12 secretion capacity under strong
  Th1-polarizing stimulation is of similar order of magnitude.
- The specific TLR/cytokine cocktail 2 represents near-maximal physiological activation
  for IL-12 secretion, providing an upper-bound estimate for k_IL12_sec in vivo.
key_study_limitations:
- The DCs in Jensen2010 are monocyte-derived and cultured in vitro from healthy donor
  PBMC, not tissue-resident cDC1 within a PDAC tumor microenvironment; differentiation
  state and transcriptional programs may differ.
- The maturation cocktails (TLR agonists plus high-dose cytokines) represent very
  strong, acute activation conditions that may exceed typical in vivo stimulation
  in human PDAC lesions, potentially overestimating steady-state IL-12 secretion rates.
- The IL-12p70 concentrations used here are estimated visually from a scatter plot
  (Figure 1A) rather than reported numerically, introducing additional uncertainty
  in the exact mean value.
- The working culture volume in 96-well plates is not specified and is assumed to
  be 0.2 mL; if the true volume differs, the inferred k_IL12_sec will scale inversely
  with volume.
- Only a single time point (24 h) is available for IL-12p70 secretion, so potential
  non-linear secretion kinetics (e.g., early bursts or late feedback suppression)
  cannot be resolved.
- The assay measures secreted IL-12 accumulated in supernatant and does not account
  for any receptor-mediated consumption or degradation during the 24 h period, which
  could cause a mild underestimation of true production rates.
- Autoimmune/inflammatory disease contexts modeled in the paper (e.g., Crohns disease,
  psoriasis) differ from PDAC; stromal composition and suppressive factors in PDAC
  may significantly dampen IL-12 production compared to the in vitro system.
primary_data_source:
  doi: 10.1186/1476-9255-7-37
  title: 'Differential induction of inflammatory cytokines by dendritic cells treated
    with novel TLR-agonist and cytokine based cocktails: targeting dendritic cells
    in autoimmunity'
  authors:
  - Simon S Jensen
  - Monika Gad
  year: 2010
  source_tag: Jensen2010
  source_relevance:
    indication_match: proxy
    indication_match_justification: The study investigates DC activation and inflammatory
      cytokine production in the context of autoimmunity-like Th1 and Th17 responses
      using human monocyte-derived DCs from healthy donors. While the target QSP model
      focuses on PDAC, IL-12 secretion is a fundamental DC function that is largely
      conserved across tissue contexts. We therefore treat these data as a mechanistic
      proxy for the maximal IL-12 secretion capacity of tumor-resident human DCs in
      PDAC, acknowledging that the inflammatory milieu and stromal constraints differ
      between autoimmune lesions and PDAC tumors.
    species_source: human
    species_target: human
    source_quality: primary_human_in_vitro
    perturbation_type: pharmacological
    perturbation_relevance: DCs are stimulated with defined combinations of exogenous
      TLR agonists and cytokines (e.g., poly I:C, R848, IFNg, IL-1b, IFNa) that strongly
      polarize them toward a Th1-promoting phenotype. These cocktails likely generate
      near-maximal IL-12 secretion rates compared to typical in vivo stimuli, so the
      inferred k_IL12_sec should be interpreted as an upper bound on physiological
      IL-12 secretion by mature DCs in PDAC.
    tme_compatibility: moderate
    tme_compatibility_notes: The in vitro system lacks the dense desmoplastic stroma,
      hypoxia, and complex immunosuppressive networks (MDSC, Tregs, tumor-derived
      IL-10 and TGFbeta) characteristic of PDAC, which are expected to reduce effective
      IL-12 production in vivo. However, the intrinsic per-cell secretory machinery
      of human DCs should be similar, so these data are moderately compatible as an
      estimate of maximal secretion capacity, with additional uncertainty to account
      for tumor microenvironment differences.
    measurement_directness: direct
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: in_vitro_primary
