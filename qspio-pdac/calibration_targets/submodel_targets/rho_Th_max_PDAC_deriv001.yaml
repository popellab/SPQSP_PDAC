calibration:
  parameters:
  - name: rho_Th_max
    units: cell/milliliter
  forward_model:
    data_rationale: 'IHC provides areal density of CD4+ T cells in PDAC tumor sections. CD4+ includes

      both Th and Treg populations. Using Teff/Treg ratios from Wartenberg2018 to

      estimate the Th fraction, and section thickness for areal-to-volumetric conversion,

      we derive the observed Th volumetric density at diagnosis. Since rho_Th_max is

      the carrying capacity in the logistic growth term, it must exceed the observed

      equilibrium density. The submodel inverts this relationship: given rho_Th_max,

      predict the observed Th density at the carrying-capacity-limited equilibrium.

      '
    submodel_rationale: 'The QSP model''s tumor-local Th proliferation reaction is:

      rate = k_Th_pro_tumor * Th * (1 - Th/(rho_Th_max * V_T))

      At steady state in the tumor, Th density reflects the balance of recruitment,

      local proliferation (capped by rho_Th_max), death, and Th→Treg differentiation.

      For direct parameter calibration, we compare rho_Th_max against the IHC-derived

      Th volumetric density as a lower bound. The observed density is a fraction of

      rho_Th_max, with the ratio depending on death/differentiation rates (typically

      0.3-0.7 of carrying capacity).

      '
    independent_variable: null
    state_variables: null
    type: algebraic
    formula: 'Th_density_volumetric = rho_Th_max * occupancy_fraction

      where occupancy_fraction ∈ [0.3, 0.7] captures the steady-state fraction

      of carrying capacity reached at diagnosis

      '
    code: "def compute(params, inputs):\n    # rho_Th_max is the carrying capacity (cell/mL).\n    # At steady state, Th density\
      \ = rho_Th_max * f, where f is the\n    # occupancy fraction (ratio of equilibrium density to carrying capacity).\n\
      \    # f depends on death, differentiation, and recruitment rates.\n    # We use f = 0.5 as the central estimate (range\
      \ 0.3-0.7).\n    rho = params['rho_Th_max']  # cell/mL\n    f_occupancy = 0.5  # steady-state fraction of carrying capacity\n\
      \    # Return volumetric Th density in cell/mL\n    return rho * f_occupancy\n"
  error_model:
  - name: th_density_karakhanova2015
    observable: null
    units: cell / milliliter
    uses_inputs:
    - cd4_density_median
    - cd3_density_median
    - cd8_density_median
    - section_thickness_karakhanova
    - teff_treg_ratio_escape
    - teff_treg_ratio_rich
    - teff_treg_ratio_exhausted_pdl1
    - teff_treg_ratio_exhausted_msih
    - subtype_fraction_escape
    - subtype_fraction_rich
    - subtype_fraction_exhausted
    - t_cell_diameter
    - ihc_section_volume_5um
    - n_karakhanova
    evaluation_points: null
    sample_size_input: n_karakhanova
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n\n    cd4_areal\
      \ = inputs['cd4_density_median']        # 229 cell/mm^2\n    section_vol = inputs['ihc_section_volume_5um']   # 5e-6\
      \ mL/mm^2\n    t_diam = inputs['t_cell_diameter']               # 7 um\n    section_t = inputs['section_thickness_karakhanova']\
      \  # 5 um\n\n    # Teff/Treg ratios and subtype fractions from Wartenberg2018\n    ratios = [\n        inputs['teff_treg_ratio_escape'],\
      \        # 1.8\n        inputs['teff_treg_ratio_rich'],           # 4.5\n        inputs['teff_treg_ratio_exhausted_pdl1'],\
      \ # 5.5\n        inputs['teff_treg_ratio_exhausted_msih'], # 0.9\n    ]\n    fracs = [\n        inputs['subtype_fraction_escape'],\
      \     # 0.54\n        inputs['subtype_fraction_rich'],        # 0.35\n        inputs['subtype_fraction_exhausted'] /\
      \ 2,  # PD-L1 half\n        inputs['subtype_fraction_exhausted'] / 2,  # MSI-H half\n    ]\n\n    # Bootstrap: for each\
      \ sample, draw a subtype and use its ratio\n    # This propagates the real inter-subtype heterogeneity\n    subtype_probs\
      \ = np.array([f for f in fracs])\n    subtype_probs = subtype_probs / subtype_probs.sum()\n    ratio_arr = np.array(ratios)\n\
      \n    # Draw subtype for each bootstrap sample\n    subtype_idx = rng.choice(len(ratios), size=n_bootstrap, p=subtype_probs)\n\
      \    r_drawn = ratio_arr[subtype_idx]\n\n    # Th fraction = r / (1 + r)\n    th_frac = r_drawn / (1 + r_drawn)\n\n\
      \    # Th areal density\n    th_areal = cd4_areal * th_frac\n\n    # Areal to volumetric conversion\n    th_vol = th_areal\
      \ / section_vol\n\n    # Abercrombie correction: overcounting factor = (t + d) / t\n    # where t = section thickness,\
      \ d = cell diameter\n    abercrombie = section_t / (section_t + t_diam)\n    th_vol_corrected = th_vol * abercrombie\n\
      \n    return th_vol_corrected\n"
  identifiability_notes: 'rho_Th_max is partially confounded with k_Th_pro_tumor (proliferation rate) and

    k_CD4_death (death rate) in determining the equilibrium Th density. At steady state,

    Th_eq = rho_Th_max * (1 - k_CD4_death/k_Th_pro_tumor) approximately, so the

    occupancy fraction absorbs uncertainty in these other parameters. The IHC data

    constrains the product rho_Th_max * f_occupancy rather than rho_Th_max alone.

    However, since rho_Th_max sets the absolute ceiling, the IHC-derived volumetric

    density provides a hard lower bound.

    '
