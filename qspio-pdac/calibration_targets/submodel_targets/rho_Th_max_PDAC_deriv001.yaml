study_interpretation: 'Karakhanova2015 provides IHC quantification of CD4+ T cell density in resected PDAC tumors

  (n=92, CapRI phase III trial). The median CD4+ density was 229 cells/mm² in 5-um paraffin

  sections (surface 0.105 mm² counting fields). CD4+ encompasses both Th and Treg subsets

  (no FOXP3 co-stain). Wartenberg2018 provides Teff/Treg ratios by PDAC immune subtype from

  an independent cohort (n=110), enabling Th fraction estimation: intraepithelial Teff/Treg

  medians range 1.8 (immune-escape, 54% of cases) to 5.5 (immune-exhausted PD-L1+). A

  population-weighted Teff/Treg ratio of ~2 implies Th fraction = Teff/(Teff+Treg) ≈ 0.67.

  Applying this to the Karakhanova CD4+ density gives ~153 Th cells/mm² (range ~100–200).

  Converting from areal (cells/mm²) to volumetric density (cells/mL) using the 5-um section

  thickness yields ~3.1e7 cells/mL as the observed Th density at diagnosis. Since rho_Th_max

  is a carrying capacity (upper bound on density), it must exceed the observed equilibrium

  density. With logistic growth, equilibrium density = rho_Th_max * (1 - death/proliferation),

  so rho_Th_max > observed density. The conversion carries ~3-5x stereological uncertainty

  (Abercrombie correction, non-random sectioning, stromal dilution).

  '
key_assumptions:
- 'CD4+ IHC density from Karakhanova2015 represents the sum of Th + Treg cells in the

  PDAC tumor microenvironment. No FOXP3 co-staining was performed, so Th fraction must

  be estimated from an independent cohort (Wartenberg2018).

  '
- 'The Teff/Treg ratio from Wartenberg2018 (intraepithelial, visual estimation on ngTMA)

  is transferable to the Karakhanova cohort (IHC on whole sections). Both are resected

  PDAC cohorts with similar stage distributions.

  '
- 'Areal-to-volumetric conversion uses section thickness as the effective depth, treating

  the IHC section as a thin slab. This is a standard stereological approximation but

  introduces systematic bias (Abercrombie correction not applied; cells extending beyond

  the section plane are overcounted by ~1.5-2x for 7-um T cells in 5-um sections).

  '
- 'The observed Th density at diagnosis represents a steady-state constrained by the

  carrying capacity. rho_Th_max must exceed the observed density; the ratio depends

  on the balance of proliferation, death, and Th→Treg differentiation.

  '
key_study_limitations:
- 'Karakhanova2015 reports a single median cut-off value (229 CD4+/mm²) for survival

  analysis, not a full distribution. No IQR, SD, or individual patient data is available

  for CD4+ density, limiting uncertainty quantification.

  '
- 'The 0.105 mm² counting field is small relative to PDAC intratumoral heterogeneity.

  Spatial sampling bias may be significant.

  '
- 'Wartenberg2018 Teff/Treg ratios are from visual estimation on ngTMA spots (0.274 mm²),

  not quantitative image analysis. Interobserver variability exists.

  '
- 'No Abercrombie or optical disector correction was applied in either study. For T cells

  (~7 um diameter) in 5-um sections, overcounting bias is ~1.5-2x (cells bisected by

  section planes are counted in both adjacent sections).

  '
- 'Both cohorts are resected (stage I-III) PDAC; immune infiltrate patterns may differ

  in unresectable/metastatic disease.

  '
