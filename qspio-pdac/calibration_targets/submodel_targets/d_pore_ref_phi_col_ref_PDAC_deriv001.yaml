target_id: d_pore_ref_phi_col_ref_PDAC_deriv001
study_interpretation: 'Wolf 2013 Fig 1D provides pore cross-section measurements by confocal reflection microscopy in bovine
  dermal collagen at 4 concentrations (1.7-15 mg/mL). Pore CS scales as inverse of concentration, consistent with fiber network
  theory (CS ~ 1/c, equivalently d_pore ~ c^-0.5). This constrains d_pore_ref (reference pore diameter) and phi_col_ref (reference
  collagen volume fraction) jointly.

  '
key_assumptions:
- Bovine dermal collagen pore architecture is representative of in vivo PDAC collagen
- Pore cross-section scales as inverse of concentration (CS ~ 1/c from fiber network theory)
- Confocal reflection xz cross-sections represent the functionally relevant pore geometry
key_study_limitations:
- In vitro reconstituted collagen vs in vivo tissue (no crosslinking, single collagen type)
- xz plane measurement only; 3D pore geometry is more complex
- Bovine dermal collagen; PDAC stroma has mixed collagen types and HA
experimental_context:
  species: bovine
  system: in_vitro_cell_free
  cell_types: []
  indication: general_biophysics
primary_data_source:
  doi: 10.1083/jcb.201210152
  source_tag: Wolf2013
  title: 'Physical limits of cell migration: Control by ECM space and nuclear deformation and tuning by proteolysis and traction
    force'
  year: 2013
  source_relevance:
    indication_match: proxy
    indication_match_justification: 'Reconstituted bovine dermal collagen gels as proxy for PDAC desmoplastic stroma. Fiber
      network pore-size scaling (CS ~ 1/c) is a fundamental polymer physics relationship that holds across collagen preparations.
      In vivo tissue has additional architecture (crosslinking, mixed ECM, fiber alignment) that may shift absolute pore sizes.

      '
    species_source: bovine
    species_target: human
    source_quality: primary_animal_in_vitro
    perturbation_type: physiological_baseline
    perturbation_relevance: 'No perturbation. Collagen gels polymerized at different concentrations represent a range of physiological
      collagen densities.

      '
    measurement_directness: direct
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: in_vitro_cell_line
    tme_compatibility: moderate
    tme_compatibility_notes: 'Cell-free collagen gel lacks crosslinking, mixed ECM components, and tissue architecture of
      PDAC stroma. Absolute pore sizes may differ but the scaling relationship (d ~ c^-0.5) is expected to hold.

      '
secondary_data_sources: []
