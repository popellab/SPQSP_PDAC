calibration:
  parameters:
  - name: d_pore_ref
    units: micrometer
  - name: phi_col_ref
    units: dimensionless
  forward_model:
    type: power_law
    coefficient: d_pore_ref
    reference_x: phi_col_ref
    exponent: '-0.5'
    data_rationale: 'Confocal reflection microscopy pore cross-sections in bovine dermal collagen at 4 concentrations (1.7,
      6.6, 10, 15 mg/mL; Fig 1D). All 4 points are used as error model entries. Pore size scales as c^-0.5 from fiber network
      theory. Phi inputs pre-convert collagen concentration to volume fraction for direct use with phi_col_ref.

      '
    submodel_rationale: 'The QSP model uses d_pore = d_pore_ref * (phi_col_ref/phi_collagen)^0.5. The power_law formula y
      = coefficient * (x/reference_x)^exponent gives d_pore = d_pore_ref * (phi/phi_col_ref)^(-0.5) = d_pore_ref * (phi_col_ref/phi)^0.5,
      matching the model equation exactly.

      '
  error_model:
  - name: pore_diameter_at_15_mgml
    units: micrometer
    x_input: phi_at_15
    uses_inputs:
    - pore_cs_at_15
    - pore_cs_at_15_log_sd
    - n_measurements
    sample_size_input: n_measurements
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    median_cs\
      \ = inputs['pore_cs_at_15']\n    log_sd = inputs['pore_cs_at_15_log_sd']\n    n = int(inputs['n_measurements'])\n  \
      \  bootstrap = np.zeros(n_bootstrap)\n    for i in range(n_bootstrap):\n        cs_sample = np.exp(rng.normal(np.log(median_cs),\
      \ log_sd / np.sqrt(n)))\n        bootstrap[i] = 2 * np.sqrt(cs_sample / np.pi)\n    return bootstrap\n"
  - name: pore_diameter_at_10_mgml
    units: micrometer
    x_input: phi_at_10
    uses_inputs:
    - pore_cs_at_10
    - pore_cs_at_10_log_sd
    - n_measurements
    sample_size_input: n_measurements
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    median_cs\
      \ = inputs['pore_cs_at_10']\n    log_sd = inputs['pore_cs_at_10_log_sd']\n    n = int(inputs['n_measurements'])\n  \
      \  bootstrap = np.zeros(n_bootstrap)\n    for i in range(n_bootstrap):\n        cs_sample = np.exp(rng.normal(np.log(median_cs),\
      \ log_sd / np.sqrt(n)))\n        bootstrap[i] = 2 * np.sqrt(cs_sample / np.pi)\n    return bootstrap\n"
  - name: pore_diameter_at_6p6_mgml
    units: micrometer
    x_input: phi_at_6p6
    uses_inputs:
    - pore_cs_at_6p6
    - pore_cs_at_6p6_log_sd
    - n_measurements
    sample_size_input: n_measurements
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    median_cs\
      \ = inputs['pore_cs_at_6p6']\n    log_sd = inputs['pore_cs_at_6p6_log_sd']\n    n = int(inputs['n_measurements'])\n\
      \    bootstrap = np.zeros(n_bootstrap)\n    for i in range(n_bootstrap):\n        cs_sample = np.exp(rng.normal(np.log(median_cs),\
      \ log_sd / np.sqrt(n)))\n        bootstrap[i] = 2 * np.sqrt(cs_sample / np.pi)\n    return bootstrap\n"
  - name: pore_diameter_at_1p7_mgml
    units: micrometer
    x_input: phi_at_1p7
    uses_inputs:
    - pore_cs_at_1p7
    - pore_cs_at_1p7_log_sd
    - n_measurements
    sample_size_input: n_measurements
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    median_cs\
      \ = inputs['pore_cs_at_1p7']\n    log_sd = inputs['pore_cs_at_1p7_log_sd']\n    n = int(inputs['n_measurements'])\n\
      \    bootstrap = np.zeros(n_bootstrap)\n    for i in range(n_bootstrap):\n        cs_sample = np.exp(rng.normal(np.log(median_cs),\
      \ log_sd / np.sqrt(n)))\n        bootstrap[i] = 2 * np.sqrt(cs_sample / np.pi)\n    return bootstrap\n"
  identifiability_notes: '2 parameters (d_pore_ref, phi_col_ref) with a degeneracy in the power law: doubling d_pore_ref while
    quadrupling phi_col_ref gives the same prediction. All 4 concentration points (1.7, 6.6, 10, 15 mg/mL) are included as
    separate error model entries to maximally constrain the power-law fit. Prior information on phi_col_ref (~0.12, normal
    pancreas) from pdac_priors.csv helps resolve the remaining degeneracy.

    '
