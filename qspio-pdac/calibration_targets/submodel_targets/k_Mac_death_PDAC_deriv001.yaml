study_interpretation: "Yang2022 demonstrates that a substantial fraction (~6\u2013\
  8% per day) of tumor-infiltrating F4/80+ macrophages in murine PDAC (Panc02 and\
  \ KPC tumors) incorporate BrdU over a 24 h pulse, indicating ongoing local proliferation\
  \ of TAMs. Assuming that TAM numbers in established tumors are approximately at\
  \ steady state, this daily proliferation rate should balance the intrinsic death\
  \ rate of macrophages in the tumor compartment. The BrdU fraction can therefore\
  \ be used to infer the first-order macrophage death rate k_Mac_death used in the\
  \ QSPIO-PDAC model, implying a macrophage half-life on the order of 8\u201312 days,\
  \ consistent with literature expectations for tissue-resident macrophages in inflammatory\
  \ settings."
key_assumptions:
- BrdU labeling over the 24 h pulse is effectively saturating, so the measured percentage
  of BrdU+ F4/80+ cells closely approximates the fraction of TAMs that entered S-phase
  during that interval.
- "Tumor-associated macrophage numbers in established subcutaneous Panc02 and KPC\
  \ tumors are approximately at dynamic steady state (birth \u2248 death), so the\
  \ per-capita proliferation rate inferred from BrdU equals the per-capita death rate\
  \ k_Mac_death."
- Additional sources of TAM gain and loss (e.g., monocyte recruitment, emigration,
  clodronate-induced depletion) are small over a 24 h window in the control liposome
  groups used here and can be neglected for estimating the baseline turnover rate.
- Per-capita death rates are similar for M1-like and M2-like F4/80+ macrophages, justifying
  the use of a single k_Mac_death for both Mac_M1 and Mac_M2 in the QSP model.
- Mouse subcutaneous PDAC models (Panc02 and KPC) provide a reasonable quantitative
  proxy for macrophage turnover kinetics in human PDAC tumors, despite species and
  anatomical differences.
- The BrdU+ fraction is modeled as arising from a simple Poisson process of S-phase
  entry, leading to BrdU_percent_24h = 100*(1-exp(-k*T)); more complex cell cycle
  structure is neglected.
key_study_limitations:
- The BrdU labeling experiment provides only a single 24 h timepoint in each model,
  so dynamic changes in TAM proliferation over tumor progression or in response to
  therapy cannot be resolved.
- Subcutaneous murine PDAC tumors differ from human pancreatic tumors in stromal architecture,
  vascularization, and immune contexture, which may alter TAM turnover rates; species
  translation uncertainty is non-trivial.
- The assumption that TAM numbers are at steady state may be violated in rapidly growing
  or regressing tumors, potentially biasing the inferred k_Mac_death if net expansion
  or contraction is substantial.
- BrdU incorporation measures proliferation but not death directly; equating proliferation
  and death relies on steady-state and ignores contributions from monocyte recruitment
  and clodronate-sensitive cell loss.
- Flow cytometry gating (CD45+CD11b+F4/80+) aggregates heterogeneous macrophage subsets
  with potentially different turnover rates; the inferred k_Mac_death represents an
  average over these populations.
- The exact number of mice contributing to the BrdU flow cytometry data for each group
  is inferred from methods (n = 7 per group) rather than explicitly stated in the
  figure legend for Figure 4C.
