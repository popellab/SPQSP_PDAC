calibration:
  parameters:
  - name: k_Mac_death
    units: 1/day
    nuisance: false
  forward_model:
    data_rationale: Yang2022 quantified the percentage of BrdU+ F4/80+ tumor-associated
      macrophages in Panc02 and KPC murine PDAC tumors after a 24 h BrdU pulse (three
      injections over 24 h, then analysis). This provides the fraction of TAMs that
      entered S-phase over a 1-day window, which is directly related to the per-capita
      proliferation rate under a simple Poisson process model.
    submodel_rationale: In the full QSPIO-PDAC model, k_Mac_death is a first-order
      death rate applied identically to tumor M1 and M2 macrophages (Mac_M1 and Mac_M2).
      In established tumors where TAM numbers are approximately at dynamic steady
      state, the per-capita proliferation rate of tissue-resident tumor-infiltrating
      macrophages should balance the per-capita death rate (plus slower recruitment
      and clearance terms). By equating the BrdU-inferred daily proliferation rate
      with k_Mac_death, this algebraic submodel links the observed 24 h BrdU labeling
      fraction to the macrophage death rate via BrdU_percent_24h = 100*(1-exp(-k_Mac_death*T_pulse_days)).
    type: algebraic
    formula: BrdU_percent_24h = 100 * (1 - exp(-k_Mac_death * T_pulse_days))
    code: "def compute(params, inputs):\n    import numpy as np\n    k = params['k_Mac_death']\
      \  # 1/day\n    T = inputs['T_pulse_days']  # day\n    # Predicted percentage\
      \ of TAMs incorporating BrdU over the 24 h pulse\n    brdu_percent = 100.0 *\
      \ (1.0 - np.exp(-k * T))\n    return brdu_percent\n"
  error_model:
  - name: brdu_panc02_24h
    units: percent
    uses_inputs:
    - brdu_percent_panc02_mean_24h
    - brdu_percent_panc02_sem_24h
    - n_mice_panc02_brdu
    sample_size_input: n_mice_panc02_brdu
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['brdu_percent_panc02_mean_24h'] \
      \      # percent\n    sem = inputs['brdu_percent_panc02_sem_24h']         #\
      \ percent\n    n = int(inputs['n_mice_panc02_brdu'])\n    sd = sem * np.sqrt(n)\n\
      \    # BrdU+ percentage is positive; use lognormal bootstrap\n    cv = sd /\
      \ mean\n    sigma_ln = np.sqrt(np.log(1.0 + cv**2))\n    mu_ln = np.log(mean)\
      \ - sigma_ln**2 / 2.0\n    return rng.lognormal(mu_ln, sigma_ln / np.sqrt(sample_size),\
      \ n_bootstrap)\n"
    n_bootstrap: 10000
  - name: brdu_kpc_24h
    units: percent
    uses_inputs:
    - brdu_percent_kpc_mean_24h
    - brdu_percent_kpc_sem_24h
    - n_mice_kpc_brdu
    sample_size_input: n_mice_kpc_brdu
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['brdu_percent_kpc_mean_24h']    \
      \   # percent\n    sem = inputs['brdu_percent_kpc_sem_24h']         # percent\n\
      \    n = int(inputs['n_mice_kpc_brdu'])\n    sd = sem * np.sqrt(n)\n    # BrdU+\
      \ percentage is positive; use lognormal bootstrap\n    cv = sd / mean\n    sigma_ln\
      \ = np.sqrt(np.log(1.0 + cv**2))\n    mu_ln = np.log(mean) - sigma_ln**2 / 2.0\n\
      \    return rng.lognormal(mu_ln, sigma_ln / np.sqrt(sample_size), n_bootstrap)\n"
    n_bootstrap: 10000
  identifiability_notes: "Single-timepoint BrdU labeling from two PDAC models (Panc02\
    \ and KPC) constrains k_Mac_death through the relationship BrdU_percent_24h =\
    \ 100*(1-exp(-k*T)). For the observed small fractions (~6\u20138%/day), this is\
    \ nearly linear (BrdU% \u2248 100*k), so k_Mac_death is effectively identified\
    \ as the BrdU fraction per day with modest uncertainty from SEM and inter-model\
    \ variation. The model assumes that TAM numbers are close to steady state so that\
    \ proliferation approximates death; deviations from steady state (e.g., net TAM\
    \ expansion or regression) are not separately identifiable from this dataset and\
    \ will be absorbed into the effective k_Mac_death estimate."
