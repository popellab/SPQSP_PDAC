  doi: 10.3390/cancers14061474
  title: Targeting Proliferating Tumor-Infiltrating Macrophages Facilitates Spatial
    Redistribution of CD8+ T Cells in Pancreatic Cancer
  authors:
  - Yang
  - Lin
  - Wang
  - Xu
  year: 2022
  source_tag: Yang2022
  source_relevance:
    indication_match: exact
    indication_match_justification: The study uses murine pancreatic ductal adenocarcinoma
      models (Panc02 and KPC cell lines implanted into C57BL/6 mice) to investigate
      tumor-infiltrating macrophages, directly matching the PDAC indication of the
      QSPIO-PDAC model. The tumor type, microenvironmental features, and immune contexture
      are therefore highly relevant to parameterizing macrophage turnover in PDAC.
    species_source: mouse
    species_target: human
    source_quality: primary_animal_in_vivo
    perturbation_type: pathological_state
    perturbation_relevance: Measurements are made in untreated PDAC-bearing mice (control
      liposome groups) that reflect the pathological tumor state without additional
      pharmacologic perturbation of macrophages beyond the tumor-driven environment.
      These baseline TAM proliferation rates are intended to represent the intrinsic
      turnover of tumor-infiltrating macrophages in PDAC.
    tme_compatibility: moderate
    tme_compatibility_notes: Subcutaneous Panc02 and KPC tumors in C57BL/6 mice recapitulate
      important features of PDAC, including dense macrophage infiltration and an immunosuppressive
      microenvironment, but differ from human pancreatic tumors in anatomical site,
      stromal composition, and vascularization. These differences may modestly alter
      TAM turnover rates, so moderate translation uncertainty is expected when mapping
      to human PDAC.
    measurement_directness: steady_state_inversion
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: animal_in_vivo
