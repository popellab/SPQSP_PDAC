calibration:
  parameters:
  - name: f_stroma_max
    units: dimensionless
  - name: cancer_density_per_mm2
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 8.853665
      sigma: 0.3
  - name: caf_density_per_mm2
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 7.600902
      sigma: 0.3
  forward_model:
    type: algebraic
    formula: |
      Predicted CAF proportion (ACTA2 + FAP) of desmoplastic elements =
        (CAF_area_in_tumor) / (CAF_area + collagen_area_in_tumor)

      where:
        CAF_area_per_mm2_tumor = (CAF_count / cancer_count) * cancer_area_per_mm2_tumor
                              = (f_stroma_max * caf_density / cancer_density) * cancer_area_per_mm2_tumor

        cancer_area_per_mm2_tumor is normalized to 1 (relative units).
        collagen_area_in_tumor / cancer_area_in_tumor is fixed at the
        Ogawa-anchored 53.4% / (33.4% + 13%) = 1.15 ratio.

      Predicted (ACTA2 + FAP) proportion =
        (f_stroma_max * caf/cancer_density_ratio) /
        (f_stroma_max * caf/cancer_density_ratio + 1.15)
    code: |
      def compute(params, inputs):
          import numpy as np
          fs = params['f_stroma_max']
          cancer_d = params['cancer_density_per_mm2']
          caf_d = params['caf_density_per_mm2']
          # CAF area fraction relative to cancer area:
          # caf_count = fs * cancer_count
          # caf_area / cancer_area = (caf_count / caf_density) / (cancer_count / cancer_density)
          #                        = fs * cancer_density / caf_density (same convention as the densities are per mm^2)
          # Wait - per mm^2 area we have density cells, area_per_cell = 1/density
          # caf_area_per_mm2 = caf_count * (1/caf_d)... but that gives area per total mm^2 of tissue,
          # not area per mm^2 of "tumor area."
          # Ratio: (caf_count / caf_d) / (cancer_count / cancer_d) = (fs * cancer_count / caf_d) / (cancer_count / cancer_d)
          #      = fs * cancer_d / caf_d
          caf_to_cancer_area = fs * cancer_d / caf_d
          # Collagen area / cancer area, anchored to Ogawa median:
          # 53.4% collagen / (33.4 + 13.0)% CAF = 1.151. We're computing
          # the CAF proportion among (CAF + collagen) which ignores the
          # cancer area in the denominator — this matches Ogawa's
          # "proportion of desmoplastic elements" definition.
          col_to_cancer_area = 1.151
          # Predicted ACTA2+FAP proportion of (CAF + collagen):
          predicted_caf_proportion_pct = 100.0 * caf_to_cancer_area / (caf_to_cancer_area + col_to_cancer_area)
          return predicted_caf_proportion_pct
    data_rationale: |
      Ogawa reports "proportions of desmoplastic elements" — a ratio
      of CAF area fraction to (CAF + collagen) area fraction. By
      treating the cancer-cell density and CAF-cell density as
      nuisance parameters with literature-anchored priors, we can
      back out the count-ratio f_stroma_max from the area-ratio
      data. The collagen/cancer area ratio is fixed at the Ogawa-
      anchored 1.15 value (since collagen has its own submodel
      target via Valderrama).
    submodel_rationale: |
      The QSP model's f_stroma_max is the saturation count ratio
      aPSC_total / C_total. Mapping to area requires nuclear-density
      reference values, treated here as nuisance parameters. Joint
      inference with the ECM anchor targets (rho_collagen,
      phi_col_ref) produces a coherent posterior on the cancer
      compartment composition.
  error_model:
  - name: total_caf_proportion_pct
    units: dimensionless
    uses_inputs:
    - caf_acta2_proportion_mean
    - caf_fap_proportion_mean
    - caf_acta2_iqr_lower_pct
    - caf_acta2_iqr_upper_pct
    - caf_fap_iqr_lower_pct
    - caf_fap_iqr_upper_pct
    - n_pdac_tumors
    - iqr_to_sd_factor
    sample_size_input: n_pdac_tumors
    observation_code: |
      def derive_observation(inputs, sample_size, rng, n_bootstrap):
          import numpy as np
          acta2_iqr = inputs['caf_acta2_iqr_upper_pct'] - inputs['caf_acta2_iqr_lower_pct']
          fap_iqr = inputs['caf_fap_iqr_upper_pct'] - inputs['caf_fap_iqr_lower_pct']
          factor = inputs['iqr_to_sd_factor']
          acta2_sd = acta2_iqr / factor
          fap_sd = fap_iqr / factor
          acta2_mean = inputs['caf_acta2_proportion_mean']
          fap_mean = inputs['caf_fap_proportion_mean']
          n = int(inputs['n_pdac_tumors'])
          acta2_samples = rng.normal(acta2_mean, acta2_sd / np.sqrt(n), n_bootstrap)
          fap_samples = rng.normal(fap_mean, fap_sd / np.sqrt(n), n_bootstrap)
          return acta2_samples + fap_samples
  identifiability_notes: |
    One QSP parameter (f_stroma_max), one observable (combined ACTA2 +
    FAP proportion of desmoplastic elements). The two density
    nuisances (cancer_density_per_mm2, caf_density_per_mm2) are
    structurally degenerate with f_stroma_max — only the product
    f_stroma_max * cancer_density / caf_density is identified.
    The lognormal nuisance priors with sigma 0.3 (typical 30%
    uncertainty in nuclear-density estimates) absorb the absolute
    cancer/CAF density variation. Joint inference with the
    Bengtsson stromal_fraction calibration target (which constrains
    cellularity = cancer_count * vol_cell / V_T) breaks the degeneracy.
