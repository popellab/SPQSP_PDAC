target_id: f_stroma_max_ogawa2021_PDAC_deriv001
study_interpretation: |
  Ogawa et al. 2021 quantified fibroblast subpopulations and collagen
  in 215 treatment-naive resected PDACs from 212 patients via whole-
  slide multiplex IHC (ACTA2 + FAP + van Gieson collagen) with naive
  Bayes pixel classifiers. Reported "proportions of desmoplastic
  elements" (computed as occupancy_rate / sum_of_desmoplastic_occupancies):

    Element                       Mean    Median   IQR
    Collagen                       53.4%   54.1%   45.6-62.2%
    ACTA2-dominant fibroblasts     33.4%   30.6%   24.2-41.1%
    FAP-dominant fibroblasts       13.0%   12.1%   8.2-17.4%
    ACTA2/FAP overlap              0.2%    0.1%    0.05-0.2%

  In the QSP-IO PDAC model, f_stroma_max is the maximum CAF:cancer
  count ratio in the carrying-capacity rule:

    K_CAF = f_stroma_max * C_total + K_stiff_niche * H_stiff_fib
    CAF_growth ~ k_X_prolif * V_T.X * (1 - aPSC_total / K_CAF)

  Ogawa reports CAF area fractions (ACTA2 + FAP) within the
  desmoplastic compartment of "tumor area" — but does NOT report
  cancer-cell area directly. To convert area fraction to count
  ratio, this target uses standard PDAC nuclear-density references
  (cancer ~7000 cells/mm^2, CAF ~2000 cells/mm^2) as nuisance
  parameters with literature-anchored priors.

  The forward model maps the QSP count ratio f_stroma_max
  (= aPSC_total / C_total at saturation) to Ogawa's observed
  CAF area fraction via:

    CAF_area_fraction = (f_stroma_max * cancer_density / caf_density) /
                        (1 + f_stroma_max * cancer_density / caf_density + collagen_area_ratio)

  where collagen_area_ratio is the collagen area fraction relative
  to cancer area, anchored from the same Ogawa data and the
  rho_collagen submodel target.
key_assumptions:
- |
  PDAC at diagnosis is at near-saturation of both cancer and CAF
  carrying capacities, so the count ratio matches f_stroma_max.
  Supported by the Ogawa cohort being treatment-naive resected
  primary tumors at typical 2-3 cm diameter (well past growth-
  phase transients).
- |
  ACTA2 + FAP captures the activated CAF population (iCAF + myCAF +
  apCAF) for QSP comparison purposes. The 0.2% ACTA2/FAP overlap is
  small and folded into the sum.
- |
  Cancer cell nuclear density in PDAC is approximately 7000
  cells/mm^2 (ductal epithelium typically 5000-10000 cells/mm^2,
  averaged over densely cellular and desmoplastic regions). Treated
  as a nuisance parameter with broad lognormal prior.
- |
  CAF nuclear density is approximately 2000 cells/mm^2 (myofibroblast-
  rich stroma typically 1500-3000 cells/mm^2). Treated as a nuisance
  parameter with broad lognormal prior.
- |
  Collagen area fraction is anchored against the same Ogawa data
  (median 54.1% of desmoplastic elements). It is not separately
  fit here; the f_stroma_max signal comes from CAF / cancer area
  ratio after collagen is accounted for.
key_study_limitations:
- |
  Ogawa reports "proportions of desmoplastic elements" (collagen +
  CAFs sum to ~100% by construction), not absolute CAF area in
  total tumor area. Conversion to count ratio requires a separate
  cancer-cell-area assumption.
- |
  The cancer-cell density and CAF-cell density nuisance parameters
  introduce ~30% additional uncertainty in the count-ratio
  conversion. The submodel target therefore has a wider posterior
  than the underlying area data alone.
- |
  Single-institution cohort (Keio University) may not represent
  worldwide PDAC heterogeneity; subtype distributions (collagen-rich
  vs. ACTA2- vs. FAP-dominant) shift across cohorts.
