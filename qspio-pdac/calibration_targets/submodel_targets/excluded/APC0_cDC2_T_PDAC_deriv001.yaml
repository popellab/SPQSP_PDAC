  year: 2022
  source_tag: Plesca2022
  source_relevance:
    indication_match: exact
    indication_match_justification: The study analyzes tumor-infiltrating dendritic
      cell subsets directly in human pancreatic ductal adenocarcinoma (PDAC) surgical
      specimens, which matches the indication of the PDAC QSP model. The tumors are
      primary PDACs resected at a specialized center, providing disease-contextual
      immune cell densities that are directly applicable to calibrating tumor-resident
      dendritic cell parameters.
    species_source: human
    species_target: human
    source_quality: primary_human_clinical
    perturbation_type: pathological_state
    perturbation_relevance: Patients had established PDAC at the time of surgical
      resection, and dendritic cell densities were measured in untreated tumor tissue
      blocks. Although some patients received neoadjuvant chemotherapy, the authors
      report that neoadjuvant treatment did not significantly influence cDC densities,
      so the measured values are interpreted as characteristic of the PDAC pathological
      state rather than acute drug-induced perturbations.
    tme_compatibility: high
    tme_compatibility_notes: The source tumors are human PDAC with characteristic
      desmoplastic stroma and immunosuppressive microenvironment, closely matching
      the modeled tumor microenvironment. While there may be patient-to-patient variation
      in stromal content and immune infiltration, the overall architecture and immune
      contexture are representative of PDAC, making translation uncertainty modest.
    measurement_directness: direct
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: clinical_in_vivo
