calibration:
  parameters:
  - name: APC0_cDC2_T
    units: cell / milliliter
    nuisance: false
  forward_model:
    data_rationale: Plesca2022 reports mean densities of CD1c+CLEC10A+ cDC2s in PDAC
      whole tumor area as cells per mm^2 from thin FFPE sections of known thickness.
      Assuming these resected PDAC tumors are in a quasi-steady state with respect
      to dendritic cell infiltration and death, the measured surface density can be
      treated as an equilibrium volumetric density projected onto a 2D section.
    submodel_rationale: In the full QSP model, APC0_cDC2_T sets the homeostatic volumetric
      density of cDC2s in the tumor compartment via a source term k_APC_death * APC0_cDC2_T
      * V_T * (1 - H_pore_APC) balanced by first-order death. At steady state and
      for dendritic cells, which are assumed to experience minimal pore-size exclusion
      (H_pore_APC approximately 0 in baseline PDAC), the tumor cDC2 density equals
      APC0_cDC2_T. The algebraic forward model maps this volumetric density to the
      experimentally measured surface density by Abercrombie-corrected geometric
      projection, accounting for FFPE-section overcounting of cells whose diameter
      exceeds the section thickness (cells_per_mm^2 = APC0_cDC2_T * (t + d)). This
      preserves the mechanistic interpretation of APC0_cDC2_T as a homeostatic tumor
      cDC2 density and is consistent with the APC0_cDC1_T target convention.
    type: algebraic
    formula: 'predicted_cells_per_mm2 = APC0_cDC2_T * (t + d) / 1e6, where t is the
      FFPE section thickness (micrometer) and d is the cDC2 cell diameter (micrometer).
      The (t + d) factor combines the section volume (t / 1e6 mL per mm^2) with the
      Abercrombie overcounting correction ((t + d) / t), simplifying to (t + d) / 1e6.
      Matches the APC0_cDC1_T submodel target convention.'
    code: "def compute(params, inputs):\n    # Homeostatic tumor cDC2 density in the\
      \ QSP model (cells per mL == cells per cm^3)\n    rho_cdc2 = params['APC0_cDC2_T']\n\
      \    # Mean FFPE section thickness (micrometer) and DC diameter (micrometer)\n\
      \    t_um = inputs['section_thickness_um_mean']\n    d_um = inputs['dc_diameter']\n\
      \    # Abercrombie-corrected 2D->3D projection: counted_cells/mm^2 =\n    #\
      \ (cells/V_T) * (t + d), with t and d in micrometer the per-mm^2 prefactor is\n\
      \    # 1/1e6 (since 1 mm^2 * 1 micrometer = 1e-6 cm^3 and rho is in cells/cm^3).\n\
      \    density_mm2 = rho_cdc2 * (t_um + d_um) / 1e6\n    return density_mm2\n"
  error_model:
  - name: cDC2_WTA_density_Plesca2022
    units: cell / millimeter ** 2
    uses_inputs:
    - cDC2_WTA_mean_mm2
    - cDC2_WTA_sem_mm2
    - n_patients_cDC
    - ln_lognormal_bias_half
    sample_size_input: n_patients_cDC
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['cDC2_WTA_mean_mm2']\n    sem = inputs['cDC2_WTA_sem_mm2']\n\
      \    n = int(inputs['n_patients_cDC'])\n    half = inputs['ln_lognormal_bias_half']\n\
      \    # Convert SEM to SD across patients\n    sd = sem * np.sqrt(n)\n    # Use\
      \ a lognormal bootstrap for positive cell densities\n    cv = sd / mean\n  \
      \  sigma_ln = np.sqrt(np.log(1.0 + cv**2))\n    mu_ln = np.log(mean) - half\
      \ * sigma_ln**2\n    # Bootstrap distribution of the sample mean across n patients\n\
      \    return rng.lognormal(mu_ln, sigma_ln / np.sqrt(sample_size), n_bootstrap)\n"
    n_bootstrap: 10000
  identifiability_notes: This target provides a single steady-state measurement of
    mean tumor cDC2 surface density, which constrains the overall scale of APC0_cDC2_T
    but cannot separately identify contributions from pore-size exclusion (H_pore_APC)
    or cDC2 death and maturation dynamics. We assume that, for dendritic cells in
    established PDAC, pore exclusion is minimal (H_pore_APC ~ 0) and that steady-state
    between constant source and death holds, so that the measured density effectively
    equals APC0_cDC2_T projected into 2D. Under these assumptions APC0_cDC2_T is identifiable
    up to the geometric uncertainty in section thickness and inter-patient biological
    variability captured by the lognormal bootstrap. Additional data on DC trafficking
    or comparison across tumors with different stromal densities would be required
    to disentangle APC0_cDC2_T from pore-exclusion effects and to refine this estimate.
experimental_context:
  species: human
  system: clinical_in_vivo
  indication: pancreatic ductal adenocarcinoma
study_interpretation: "Plesca2022 used multiplex immunohistochemistry on FFPE sections\
  \ from 40 resected human PDAC specimens to quantify CD1c+CLEC10A+ conventional dendritic\
  \ cells type 2 (cDC2s) as absolute densities in the whole tumor area, intraepithelial\
  \ tumor, and tumor stroma. The reported mean whole-tumor-area cDC2 density of 2.98\
  \ cells/mm^2, measured from thin (3\u20135 micrometer) sections, reflects a quasi-steady-state\
  \ balance between cDC2 recruitment, maturation, and death in established PDAC. By\
  \ converting this 2D density to an equivalent volumetric density using the section\
  \ thickness, we map it to the QSP model parameter APC0_cDC2_T, interpreted as the\
  \ homeostatic tumor cDC2 density in PDAC."
key_assumptions:
- Resected PDAC tumors in Plesca2022 represent a quasi-steady state with respect to
  dendritic cell infiltration and loss, so that the average cDC2 density is time-independent
  on the scale of interest.
- The reported whole tumor area cDC2 density (cells/mm^2) is representative of the
  average density over the entire tumor volume in the QSP model, despite spatial heterogeneity
  between intraepithelial and stromal regions.
- "Thin FFPE sections have a uniform effective thickness that can be approximated\
  \ by the midpoint (4 micrometers) of the reported 3\u20135 micrometer range for\
  \ purposes of 2D-to-3D geometric conversion."
- "Plesca2022 reports raw mIHC counts without Abercrombie or optical-disector correction;\
  \ the forward model therefore inflates the volumetric density by (t + d) where d\
  \ is the dendritic cell diameter (~13 micrometer), matching the APC0_cDC1_T submodel\
  \ target convention."
- Dendritic cells are sufficiently deformable that pore-size-based exclusion in PDAC
  (H_pore_APC) is modest at baseline; thus, the effective steady-state tumor cDC2
  density approximates APC0_cDC2_T without needing an explicit correction for stromal
  exclusion in this target.
- Neoadjuvant chemotherapy, which was given to a subset of patients in Plesca2022,
  does not substantially alter average tumor cDC2 density, consistent with the authors'
  finding that cDC2 frequencies did not significantly differ between neoadjuvant and
  primary resection groups.
- "Inter-patient variability in cDC2 densities can be reasonably modeled as lognormal,\
  \ and the reported mean \xB1 SEM across 40 patients adequately summarizes this distribution\
  \ for Bayesian calibration."
key_study_limitations:
- Single-center retrospective cohort of 58 PDAC patients, with cDC2 density quantified
  in 40 cases, may not fully capture population-level variability in dendritic cell
  infiltration across all PDAC patients.
- "Quantification is based on 2D FFPE sections that sample 25\u201350% of tumor-containing\
  \ areas; through-plane heterogeneity and unsampled regions of the tumor are not\
  \ directly measured."
- "Section thickness is reported as a range (3\u20135 micrometers) rather than a precise\
  \ value for each specimen, introducing geometric uncertainty when converting from\
  \ surface to volumetric densities."
- Some patients received neoadjuvant chemotherapy, which might subtly modulate DC
  infiltration despite the lack of statistically significant differences reported
  by the authors.
- The analysis does not distinguish between functional states of cDC2s beyond their
  lineage markers, so APC0_cDC2_T inferred from these data reflects total immature
  cDC2 density rather than the subset actively presenting antigen to T cells.
