target_id: q_CD8_T_in_Boissonnas2007_OT1_EG7_timecourse
tags:
- ai-generated
- t-cell-module
extraction_model: claude-opus-4-6
study_interpretation: 'Boissonnas et al. (2007) quantified OT1-GFP CD8+ T cell infiltration

  into subcutaneous EG7 (OVA+) thymomas in C57BL/6 mice after adoptive

  transfer of 10^7 naive OT1-GFP cells. Density (cells/mm^2) was measured

  on 5 um frozen sections at two time points: early phase (day 3-4,

  mean 102 +/- 32 cells/mm^2, n=6) and late phase (day 5-6, mean 336 +/-

  149 cells/mm^2, n=8). The two-time-point accumulation curve constrains

  both the extravasation rate (q_CD8_T_in) and the effective loss rate

  (k_CD8_death) via a saturation ODE model.

  '
key_assumptions:
- 'OT1 accumulation in EG7 tumors follows dN/dt = influx - k_death * N,

  approaching steady state. With two time points, the rising phase and

  near-plateau separately constrain influx rate and loss rate.

  '
- 'The effective circulating OT1 pool is treated as approximately constant

  over the day 3-6 window. Expansion in draining lymph nodes occurs by

  day 3, and the effective pool is a nuisance parameter.

  '
- 'In EG7 with large cancer burden and no CXCL12 barrier, the recruitment

  Hill term C^2/(C^2+K_C2_recruit) is approximately 1 and CXCL12 exclusion

  (1-H_CXCL12_Texcl) is approximately 1.

  '
- '2D density from 5 um sections converts to 3D density by dividing by

  section thickness, assuming uniform distribution within the section.

  '
- 'Early phase is centered at day 3.5, late phase at day 5.5 after

  adoptive transfer.

  '
key_study_limitations:
- 'EG7 thymoma is highly T cell-permissive with strong model antigen,

  unlike PDAC. The inferred q_CD8_T_in represents baseline extravasation;

  PDAC-specific barriers are modeled separately.

  '
- 'Adoptive transfer of 10^7 monoclonal OT1 cells creates artificially

  high precursor frequency not representative of endogenous responses.

  '
- 'The exact timing of early vs late measurements spans day 3-4 and day

  5-6 respectively; we use midpoints (3.5 and 5.5 days) with uncertainty

  absorbed into the observation noise.

  '
- 'n=6 (early) and n=8 (late) data points may include multiple tumors per

  experiment (paper reports n=5 independent experiments).

  '
experimental_context:
  species: mouse
  system: in_vivo_syngeneic_tumor_model
  cell_lines:
  - name: EG7
    species: mouse
    tissue_origin: thymoma
    cell_type: OVA-expressing EL4 thymoma
  cell_types:
  - name: CD8+ T cell
    phenotype: 'Naive OT1-GFP transgenic CD8+ T cells specific for OVA257-264,

      activated in vivo after adoptive transfer.

      '
    isolation_method: 'CD8+ magnetic selection from OT1-GFP mice, 96% purity.

      10^7 cells transferred retroorbitally.

      '
  culture_conditions: null
  indication: murine thymoma (solid tumor proxy)
primary_data_source:
  doi: 10.1084/jem.20061890
  title: 'In vivo imaging of cytotoxic T cell infiltration and elimination

    of a solid tumor

    '
  authors:
  - Boissonnas
  - Fetler
  - Zeelenberg
  - Hugues
  - Amigorena
  year: 2007
  source_tag: Boissonnas2007
  source_relevance:
    indication_match: proxy
    indication_match_justification: 'EG7 thymoma provides quantitative in vivo data on CD8+ T cell

      extravasation into an established solid tumor. The baseline

      extravasation machinery (diapedesis) is conserved across solid tumors.

      PDAC-specific barriers are handled by separate model terms.

      '
    species_source: mouse
    species_target: human
    source_quality: primary_animal_in_vivo
    perturbation_type: pathological_state
    perturbation_relevance: 'Adoptive transfer into tumor-bearing mice. The observed T cell

      accumulation reflects physiological extravasation kinetics in the

      context of an established solid tumor with active immune rejection.

      '
    tme_compatibility: low
    tme_compatibility_notes: 'EG7 thymoma is highly T cell-permissive with strong model antigen.

      PDAC has dense desmoplastic stroma and CXCL12-mediated exclusion.

      The inferred q_CD8_T_in represents baseline extravasation capacity.

      '
    measurement_directness: single_inversion
