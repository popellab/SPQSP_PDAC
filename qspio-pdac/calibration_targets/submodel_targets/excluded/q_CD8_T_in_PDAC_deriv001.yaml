  - ot1_transferred_exponent
  formula: 10 ** ot1_transferred_exponent
  rationale: Convert 10^7 notation to absolute cell count
  source_ref: Boissonnas2007
  source_location: Materials and Methods
- name: section_thickness
  value: 5.0
  units: micrometer
  input_type: direct_measurement
  source_ref: Boissonnas2007
  source_location: Materials and Methods, Histological tumor analysis
  value_snippet: 'sectioned (5 um) with a cryostat (Leica)

    '
- name: cell_diameter
  value: 7.0
  units: micrometer
  input_type: reference_value
  source_ref: Boissonnas2007
  source_location: Standard cell-biology reference (Bufi 2015 PMID 26775433);
    applied here because Boissonnas2007 reports raw cryostat-section IHC counts
    without Abercrombie or optical-disector correction.
  rationale: 'Resting T lymphocyte diameter ~7 micrometer (Bufi 2015). Used as
    the Abercrombie overcounting term `d` in the 2D->3D projection: a cell whose
    center lies anywhere within a slab of thickness (t + d) intersects the
    section, so the effective counting volume scales with (t + d), not t.
    Without this correction, MCMC infers q_CD8_T_in/k_death roughly (t+d)/t ~2.4x
    larger than the true volumetric density, which then over-predicts CD8 density
    in the full model after the density-observable formula adopted the Abercrombie
    convention (PR #96).'
  value_snippet: 'sectioned (5 um) with a cryostat (Leica)'
- name: t_early
  value: 3.5
  units: day
  input_type: reference_value
  source_ref: Boissonnas2007
  source_location: Results, page 346
  rationale: Midpoint of early phase (day 3-4 after adoptive transfer)
  value_snippet: 'Early phase (day 3-4) after adoptive transfer

    '
- name: t_late
  value: 5.5
  units: day
  input_type: reference_value
  source_ref: Boissonnas2007
  source_location: Results, page 346
  rationale: Midpoint of late phase (day 5-6 after adoptive transfer)
  value_snippet: 'late phase (day 5-6)

    '
calibration:
  parameters:
  - name: q_CD8_T_in
    units: 1/(centimeter**3*minute)
  - name: k_CD8_death
    units: 1/day
    nuisance: true
    prior:
      distribution: lognormal
      mu: -1.5
      sigma: 0.7
  - name: eff_circulating_cd8
    units: cell
    nuisance: true
    prior:
      distribution: lognormal
      mu: 16.1
      sigma: 0.5
  forward_model:
    type: algebraic
    formula: 'density_2D(t) = (q * CD8_C / k_death) * (1 - exp(-k_death * t))
      * (section_thickness + cell_diameter). The (t + d) factor is the Abercrombie
      effective slab — every cell whose center is within (t + d) of the section
      intersects it and gets counted. Matches the convention used by the
      APC0_cDC1_T / APC0_cDC2_T submodel targets and the V_T-based density
      observables under PR #96.

      where q = q_CD8_T_in (converted to match units)

      '
    code: "def compute(params, inputs):\n    \"\"\"\n    Predict OT1 2D density at early and late time points.\n\n    ODE:\
      \ dN_3d/dt = q_CD8_T_in * CD8_C - k_death * N_3d\n    Solution: N_3d(t) = (q*CD8_C/k_death) * (1 - exp(-k_death*t))\n\
      \    density_2D = N_3d * (section_thickness + cell_diameter)  (um -> mm)\n\
      \n    The Abercrombie-corrected 2D density uses the effective slab\n    (t + d) — every cell whose center is within\
      \ (t + d) of the section\n    intersects and gets counted. Boissonnas2007 reports raw cryostat-section\n    IHC counts\
      \ without correction, so the forward model uses the inflated\n    (t + d) factor to match the observed counts.\n\n \
      \   Units:\n      q_CD8_T_in: 1/(cm^3*min) -> need to convert cm^3->mm^3 and min->day\n      k_death: 1/day\n      CD8_C:\
      \ cells\n      thickness, diameter: um -> mm\n    \"\"\"\n    import numpy as np\n\n    q = params['q_CD8_T_in']    \
      \        # 1/(cm^3*min)\n    k_death = params['k_CD8_death']      # 1/day\n    cd8_c = params['eff_circulating_cd8']\
      \ # cells\n\n    # Convert q from 1/(cm^3*min) to 1/(mm^3*day)\n    # 1 cm^3 = 1000 mm^3, so /cm^3 = /1000mm^3 = 0.001/mm^3\n\
      \    # 1 day = 1440 min\n    q_mm3_day = q * 1440 / 1000  # 1/(mm^3*day)\n\n    # Abercrombie-corrected effective slab\
      \ thickness, mm:\n    # (section thickness + cell diameter), um -> mm\n    effective_thickness_mm = (inputs['section_thickness']\
      \ + inputs['cell_diameter']) / 1000\n\n    # Steady-state 3D density\n    ss_3d = q_mm3_day * cd8_c / k_death  # cells/mm^3\n\
      \n    t_early = inputs['t_early']  # day\n    t_late = inputs['t_late']    # day\n\n    # Saturation dynamics\n    d3d_early\
      \ = ss_3d * (1 - np.exp(-k_death * t_early))\n    d3d_late = ss_3d * (1 - np.exp(-k_death * t_late))\n\n    # Convert\
      \ to 2D density using Abercrombie effective slab\n    d2d_early = d3d_early * effective_thickness_mm\n    d2d_late =\
      \ d3d_late * effective_thickness_mm\n\n    return {\n        'early': d2d_early,\n        'late': d2d_late,\n    }\n"
    data_rationale: 'Two-time-point OT1 density in EG7 tumors (day 3-4: 102 +/- 32;

      day 5-6: 327 +/- 50 cells/mm^2) constrains both the extravasation

      rate and effective loss rate via saturation dynamics. The ~3x

      increase from early to late indicates the system has not yet

      reached steady state, providing dynamic information beyond a

      single equilibrium measurement.

      '
    submodel_rationale: "In the full QSP model, CD8 flux into tumor is:\n  rate = q_CD8_T_in * V_T * V_C.CD8 * (C^2/(C^2+K_C2_recruit))\
      \ * (1-H_CXCL12)\nFor EG7 (large tumor, no CXCL12), simplifies to q * V_T * CD8_C.\nThe per-volume accumulation follows\
      \ dN_3d/dt = q*CD8_C - k_death*N_3d,\na saturation ODE with analytical solution.\n"
  error_model:
  - name: density_early
    units: cell / millimeter**2
    uses_inputs:
    - eg7_early_mean
    - eg7_early_sd
    - n_early
    sample_size_input: n_early
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['eg7_early_mean']\n    sd = inputs['eg7_early_sd']\n    cv = sd / mean\n    return rng.lognormal(np.log(mean),\
      \ cv / np.sqrt(sample_size), n_bootstrap)\n"
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['early']\n"
  - name: density_late
    units: cell / millimeter**2
    uses_inputs:
    - eg7_late_mean
    - eg7_late_sd
    - n_late
    sample_size_input: n_late
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['eg7_late_mean']\n    sd = inputs['eg7_late_sd']\n    cv = sd / mean\n    return rng.lognormal(np.log(mean),\
      \ cv / np.sqrt(sample_size), n_bootstrap)\n"
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['late']\n"
  identifiability_notes: 'Two time points from a saturation curve jointly constrain the

    steady-state level (q*CD8_C/k_death) and the approach rate (k_death).

    The early-to-late ratio (~3.2x) provides dynamic information: if the

    system were already at steady state by day 3.5, the ratio would be ~1.

    The observed 3.2x increase constrains k_death to be on the order of

    0.3-0.5/day (half-life 1.5-2.5 days), consistent with effector CD8

    contraction kinetics. q_CD8_T_in and eff_circulating_cd8 remain

    partially degenerate (their product enters), but the nuisance prior

    on eff_circulating_cd8 breaks this.

    '
