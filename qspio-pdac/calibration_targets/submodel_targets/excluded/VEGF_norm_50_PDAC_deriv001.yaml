      The molecular weight of VEGF-A165 is, however, a general biochemical property
      and is expected to be identical in PDAC and the systems discussed in the review.
    species_source: human
    species_target: human
    source_quality: review_article
    perturbation_type: physiological_baseline
    perturbation_relevance: The review summarizes biochemical characterization of
      recombinant and native VEGF-A165 under baseline conditions without pharmacologic
      perturbation; the reported molecular mass is an intrinsic property of the protein.
    tme_compatibility: high
    tme_compatibility_notes: The molecular weight of VEGF-A165 does not depend on
      the tumor microenvironment, so differences between the systems discussed in
      Ferrara1996 and PDAC vasculature do not meaningfully affect the applicability
      of this parameter.
    measurement_directness: direct
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: in_vitro_cell_line
