calibration:
  parameters:
  - name: f_stroma_max
    units: dimensionless
  forward_model:
    type: algebraic
    formula: 'stroma_epithelium_ratio = f_stroma_max

      The parameter directly represents the maximum stroma:epithelium ratio.

      TSD data is converted to ratio in the observation code.

      '
    data_rationale: 'Automated TSD quantification provides the stromal area fraction in

      treatment-naive PDAC. Converting TSD to stroma:epithelium ratio

      (TSD/(1-TSD)) gives a direct proxy for the model''s f_stroma_max.

      The stroma:epithelium ratio overestimates the CAF:cancer cell ratio

      because stroma includes acellular ECM; this is captured by the

      translation sigma.

      '
    submodel_rationale: 'f_stroma_max appears in the logistic growth term for CAF proliferation:

      (1 - aPSC_total/(f_stroma_max * C_total)). It sets the carrying capacity

      for activated CAFs relative to cancer cells. The observed TSD distribution

      constrains this ratio.

      '
    code: "def compute(params, inputs):\n    return params['f_stroma_max']\n"
  error_model:
  - name: stroma_ratio_torphy2018
    units: dimensionless
    uses_inputs:
    - tsd_median
    - tsd_range_low
    - tsd_range_high
    - n_denmark
    sample_size_input: n_denmark
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n\n    median_tsd\
      \ = inputs['tsd_median']        # 0.60\n    range_low = inputs['tsd_range_low']       # 0.09\n    range_high = inputs['tsd_range_high']\
      \      # 0.95\n    n = int(inputs['n_denmark'])                # 123\n\n    # Model TSD distribution as logit-normal\n\
      \    # logit(TSD) ~ Normal(mu, sigma)\n    logit_median = np.log(median_tsd / (1 - median_tsd))\n    logit_low = np.log(range_low\
      \ / (1 - range_low))\n    logit_high = np.log(range_high / (1 - range_high))\n\n    # Estimate sigma from range using\
      \ order statistics\n    # For n samples from normal, range ~ 2 * sqrt(2 * ln(n)) * sigma\n    range_factor = 2 * np.sqrt(2\
      \ * np.log(n))\n    sigma_logit = (logit_high - logit_low) / range_factor\n\n    # Bootstrap: sample logit(TSD), convert\
      \ to stroma:epithelium ratio\n    logit_samples = rng.normal(logit_median, sigma_logit, size=n_bootstrap)\n    ratio_samples\
      \ = np.exp(logit_samples)  # exp(logit(TSD)) = TSD/(1-TSD)\n\n    return ratio_samples\n"
  identifiability_notes: 'f_stroma_max is well-identified from the TSD distribution if we assume the

    system is near carrying capacity at diagnosis. However, TSD measures total

    stroma (including ECM, immune, vasculature), not just CAFs. The derived

    stroma:epithelium ratio is an upper bound on the CAF:cancer cell ratio.

    The translation sigma accounts for this systematic overestimation.

    Additionally, the logistic occupancy fraction (how close to carrying

    capacity the actual CAF:cancer ratio is) introduces further uncertainty

    in the relationship between observed ratio and f_stroma_max.

    '
