extraction_model: claude-opus-4-6
extraction_reasoning_effort: high
study_interpretation: 'Torphy et al. 2018 provides automated quantification of tumor stroma density

  (TSD = stroma area / total tumor area) in two independent PDAC cohorts. The

  Denmark cohort (n=123, treatment-naive) had median TSD = 0.60 (range 0.09-0.95).

  The rapid autopsy primary tumors (n=12) had median TSD = 0.74 (range 0.50-0.97).


  The model parameter f_stroma_max is the maximum CAF:cancer cell count ratio in

  the logistic term (1 - aPSC_total/(f_stroma_max * C_total)). TSD measures the

  stromal AREA fraction, which includes CAFs, ECM, immune cells, and vasculature

  -- not just CAFs. Converting TSD to stroma:epithelium ratio (TSD/(1-TSD)) gives

  an upper bound on the CAF:cancer ratio since stroma includes substantial

  acellular ECM.


  Denmark cohort median ratio = 0.60/0.40 = 1.5. The rapid autopsy median ratio =

  0.74/0.26 = 2.85. Upper end (TSD=0.95) gives ratio=19, but this includes ECM.

  Since CAFs comprise ~25-40% of stromal area in PDAC (remainder is ECM, immune,

  vasculature), the effective CAF:cancer ratio is roughly 0.3x the stroma:epithelium

  ratio: median ~0.5-0.9, max ~5-7.


  The current f_stroma_max=3.0 is consistent with this data. The main value of this

  target is to tighten the prior sigma from 0.7 to a data-informed value.

  '
key_assumptions:
- 'TSD (stromal area fraction) is used as a proxy for the stroma:epithelium ratio.

  This overestimates the CAF:cancer cell count ratio because stroma includes

  acellular ECM (~40-60% of stromal area in PDAC) plus immune and vascular cells.

  '
- 'The Denmark cohort (n=123, no adjuvant/neoadjuvant therapy) best represents the

  model''s diagnosis state. Used as primary data source.

  '
- 'The TSD distribution is modeled as logit-normal, with parameters derived from

  the reported median and range. The range of n=123 samples constrains the

  population SD via order statistics.

  '
- 'Stroma:epithelium ratio = TSD/(1-TSD) is used as the observable. The forward

  model returns f_stroma_max directly (identity), meaning the prior derivation

  will set f_stroma_max to the observed ratio distribution. Since stroma includes

  non-CAF components, the derived prior will be somewhat higher than the true

  CAF:cancer ratio -- this is addressed by the translation sigma.

  '
key_study_limitations:
- 'TSD measures total stromal area, not CAF cell counts specifically. The acellular

  ECM component of PDAC stroma is substantial (collagen area fraction ~60-74%,

  Whatcott 2015), so TSD significantly overestimates the cellular CAF:cancer ratio.

  '
- 'Area-based quantification may not reflect cell count ratios due to size

  differences between CAFs and cancer cells, and the large acellular ECM

  contribution to stromal area.

  '
- 'Automated segmentation into "tumor epithelium" and "tumor desmoplasia" was

  validated against manual assessment (rho=0.65, P<0.001), but the two categories

  are coarse -- desmoplasia includes all non-epithelial tissue.

  '
- 'Denmark cohort is resected PDAC from 1978-2008. Diagnostic and staging practices

  may differ from contemporary cohorts.

  '
