study_interpretation: 'Bhat2007 provides single-cell time-lapse microscopy data showing IL-2-activated human NK cells

  kill approximately 4 targets per 16 hours (~6/day) against 721.221 cells. Choi2013 confirms

  serial killing capacity of ~4 targets per 6 hours in burst kinetics. In the QSP model,

  k_NK_kill is a mass-action rate constant modulated by a Michaelis-Menten term

  NK/(NK + K_NK_C*C_total) and immunosuppressive Hill functions (IL-10, TGFb, MDSC). The

  effective per-cell killing rate depends on the E:T ratio and suppressive factors. In the

  immunosuppressive PDAC TME, with dense stroma, high TGFb, and low NK infiltration, the

  effective rate is substantially below the in vitro maximum. The in vitro serial killing rate

  (~6 kills/NK/day) represents an upper bound on the intrinsic capacity; the current model

  value of 0.15/day is conservative, reflecting the gap between in vitro and in vivo conditions.

  '
key_assumptions:
- 'NK cell serial killing in vitro (activated with IL-2) represents an upper bound on the

  intrinsic killing capacity parameter k_NK_kill, since immunosuppressive factors are modeled

  separately through Hill functions.

  '
- 'In vitro killing rates against 721.221 (MHC class I-negative B cell line) are transferable

  to the cancer cell killing context modeled by k_NK_kill, with differences in target

  susceptibility absorbed into the translation uncertainty.

  '
- 'The in vitro serial killing rate at saturating E:T ratio maps to the model''s maximal

  killing rate parameter, since the Michaelis-Menten term approaches 1 at high E:T.

  '
key_study_limitations:
- 'Bhat2007 uses 721.221 cells (MHC-I negative, highly NK-susceptible), which may overestimate

  killing rates against PDAC cells that express MHC-I and inhibitory ligands.

  '
- 'NK cells were pre-activated with IL-2 for 18-22 days, representing maximally activated NK

  cells rather than the mixed activation states in vivo.

  '
- 'Single-cell assays measure serial killing capacity, not the mass-action rate constant

  directly. Converting to k_NK_kill requires assumptions about cell contact geometry.

  '
- 'No PDAC-specific NK killing data available; all data is from hematological targets.

  '
