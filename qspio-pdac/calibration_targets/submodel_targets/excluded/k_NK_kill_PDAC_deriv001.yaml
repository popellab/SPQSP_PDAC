calibration:
  parameters:
  - name: k_NK_kill
    units: 1/day
  forward_model:
    data_rationale: 'Single-cell microscopy provides direct measurements of NK serial killing rate. Converting

      from kills/cell/time to the ODE rate constant requires accounting for the Michaelis-Menten

      term and suppressive factors that are modeled separately. The measured rate represents the

      maximal intrinsic killing capacity under optimal conditions.

      '
    submodel_rationale: 'The QSP model''s NK killing reaction is:

      rate = k_NK_kill * C1 * NK/(NK + K_NK_C*C_total) * (1-H_IL10_NK) * (1-H_TGFb_NK) * (1-H_MDSC)

      At high E:T ratio with no suppression, this reduces to k_NK_kill * C1, making k_NK_kill

      the maximal per-target killing rate. The in vitro serial killing rate (at high E:T, no

      suppression) provides an upper bound on this parameter.

      '
    independent_variable: null
    state_variables: null
    type: algebraic
    formula: kills_per_16h = k_NK_kill * (16/24)
    code: "def compute(params, inputs):\n    # k_NK_kill is the mass-action rate constant (1/day).\n    # At saturating E:T\
      \ ratio (in vitro assay conditions), the per-NK-cell\n    # kill rate ≈ k_NK_kill. Convert to kills per 16h for comparison.\n\
      \    k = params['k_NK_kill']  # 1/day\n    return k * (16.0 / 24.0)  # kills per 16h\n"
  error_model:
  - name: serial_killing_bhat2007
    observable: null
    units: dimensionless
    uses_inputs:
    - kills_per_nk_16h
    - kills_per_nk_16h_range_low
    - kills_per_nk_16h_range_high
    evaluation_points: null
    sample_size_input: n_bhat2007_donors
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    # Mean killing frequency ~4 kills/NK/16h\
      \ from Bhat2007\n    # Gamma bootstrap: continuous, positive, Poisson-like variance\n    mean_kills = inputs['kills_per_nk_16h']\n\
      \    return rng.gamma(shape=mean_kills, scale=1.0, size=n_bootstrap)\n"
  identifiability_notes: 'k_NK_kill is partially confounded with K_NK_C (half-maximal target density) in the

    Michaelis-Menten killing term. Serial killing assays at saturating E:T ratios constrain

    k_NK_kill independently of K_NK_C (since the MM term ≈ 1). However, the large translation

    uncertainty from in vitro to in vivo limits the practical identifiability gain.

    '
