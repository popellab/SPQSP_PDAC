calibration:
  parameters:
  - name: k_C1_growth
    units: 1/day
  - name: k_death_2d_culture
    units: 1/day
    nuisance: true
    prior:
      distribution: lognormal
      mu: -3.912
      sigma: 0.7
  forward_model:
    type: algebraic
    formula: PDT_h = ln(2) / (k_C1_growth - k_death_2d_culture) * 24
    code: |
      def compute(params, inputs):
          import numpy as np
          k_growth = params['k_C1_growth']
          k_death = params['k_death_2d_culture']
          k_eff = k_growth - k_death
          k_eff_safe = np.maximum(k_eff, 1e-6)
          pdt_h = np.log(2) / k_eff_safe * 24.0
          return pdt_h
    data_rationale: |
      Population doubling time measured by MTT in 2D monolayer culture for 7 days at sub-
      confluent densities reflects the log-phase exponential growth phase, where viable cell
      number C(t) follows dC/dt = (k_growth - k_death_2d_culture) * C. The doubling time of
      the population is then PDT = ln(2) / (k_growth - k_death_2d_culture).
    submodel_rationale: |
      In the QSP model, viable cancer cells expand via dC1/dt = k_C1_growth * C1 *
      (1 - C_total/C_max) - k_C1_death * C1. For C_total << C_max (sub-confluent in vitro),
      this reduces to dC1/dt = (k_C1_growth - k_C1_death) * C1. Because the in-tumour
      k_C1_death captures stroma-, hypoxia-, and immune-mediated death whereas 2D-culture
      death is dominated only by spontaneous apoptosis/anoikis, we use a nuisance
      k_death_2d_culture distinct from the QSP k_C1_death. This isolates the constraint on
      k_C1_growth as the cell-cycle-only intrinsic rate.
  error_model:
  - name: pdt_population
    units: hour
    uses_inputs:
    - pdt_AMCPAC01_h
    - pdt_AMCPAC02_h
    - pdt_AMCPAC03_h
    - pdt_AMCPAC04_h
    - pdt_AMCPAC05_h
    - pdt_AMCPAC06_h
    - n_cell_lines
    sample_size_input: n_cell_lines
    observation_code: |
      def derive_observation(inputs, sample_size, rng, n_bootstrap):
          import numpy as np
          pdts = np.array([
              inputs['pdt_AMCPAC01_h'],
              inputs['pdt_AMCPAC02_h'],
              inputs['pdt_AMCPAC03_h'],
              inputs['pdt_AMCPAC04_h'],
              inputs['pdt_AMCPAC05_h'],
              inputs['pdt_AMCPAC06_h'],
          ])
          # Bootstrap mean PDT across the 6 cell lines, sampling with replacement
          # at the reported sample size to capture inter-line biological variability.
          n = int(sample_size)
          samples = rng.choice(pdts, size=(n_bootstrap, n), replace=True).mean(axis=1)
          return samples
  identifiability_notes: |
    Single-condition population mean PDT yields a tight constraint on the difference
    (k_C1_growth - k_death_2d_culture). The two are individually identified only via
    the nuisance prior on k_death_2d_culture. Because k_death_2d_culture has a weakly-
    informative lognormal prior centered well below typical k_C1_growth, the resulting
    posterior on k_C1_growth is dominated by the data with a small (~5-10%) downward
    correction for baseline 2D-culture death.
