extraction_model: claude-opus-4-7
study_interpretation: |
  Kim et al. established 6 novel patient-derived primary PDAC cell lines (AMCPAC01-06) from
  surgically resected tumours of Korean PDAC patients and characterised their in vitro growth.
  Population doubling time (PDT) was measured by MTT assay in 96-well plates seeded at 1e4
  cells/well, with optical density at 570 nm read at 24-h intervals over 7 consecutive days.
  Cells at passage 15 were used and each cell line was assayed in 2 independent experiments
  with technical triplicates (n=6 wells per line). Reported PDTs ranged from 48 h (AMCPAC04)
  to 87 h (AMCPAC02). These 2D-monolayer PDTs are direct measurements of intrinsic cell-cycle-
  driven proliferation under high-nutrient/oxygen culture conditions in the absence of
  desmoplastic stroma, hypoxia, immune killing, or therapy. They thus constrain the upper
  envelope of the QSP model parameter k_C1_growth, which represents the same intrinsic
  per-cell birth rate before tumour-microenvironment-mediated suppression. Existing submodel
  targets for k_C1_growth (Ahn2017, Jang2015) use clinical CT/MRI tumour volume doubling times;
  those measurements conflate cancer cell proliferation with desmoplastic stromal accumulation
  and are therefore biased toward slower net growth, leaving k_C1_growth at a posterior median
  of ~0.009/day (cell-doubling time ~75 days) — implausibly slow for an actively cycling
  pancreatic adenocarcinoma cell. This 2D-cell-line target adds an upper-bound anchor at the
  cell-cycle-only end of the spectrum.
key_assumptions:
- |
  Population doubling time measured by MTT in 96-well plates over 7 days approximates the
  intrinsic per-cell-cycle proliferation rate when cell density is below the contact-inhibition
  threshold; cells were seeded at 1e4/well to remain in log-phase growth during the assay window.
- |
  Baseline cell death (apoptosis, anoikis) in 2D culture under standard medium and high oxygen
  is small but non-zero. We model this as a nuisance parameter k_death_2d_culture with a
  weakly-informative lognormal prior centered at 0.02/day, distinct from the in-tumour
  k_C1_death which the QSP model uses for stroma-, hypoxia-, and immune-driven death.
- |
  Inter-cell-line biological variability across 6 patient-derived primary lines approximates
  the population spread of intrinsic proliferation rates among PDAC patients; we bootstrap
  PDT across these 6 lines to derive the calibration target distribution.
- |
  Optical density at 570 nm is proportional to viable cell number across the assay range,
  so PDT extracted from the MTT growth curve equals the true population doubling time. This
  is standard for PDAC cell lines below confluence and is implicit in Kim et al.'s analysis.
key_study_limitations:
- |
  Cells were passaged 15 times before assay; long-term passaging may select for fast-growing
  subclones and shift PDT toward the lower (faster) end of patient-level variability.
- |
  2D monolayer culture lacks the desmoplastic ECM, hypoxia gradients, nutrient limitation,
  and immune effectors that constrain in-vivo PDAC proliferation. The PDT distribution
  therefore reflects an upper bound on the effective intrinsic growth rate observed in an
  intact tumour microenvironment.
- |
  Only point estimates of PDT are reported per cell line; technical replicate variability
  (n=6 wells per line) is not provided. We attribute all observed spread to inter-cell-line
  biology, which is the relevant axis for population-level model calibration but ignores
  measurement noise per estimate.
- |
  All 6 lines are from Korean patients at a single tertiary centre; ethnic and selection
  biases may affect generalisability of the proliferation distribution to other PDAC cohorts.
