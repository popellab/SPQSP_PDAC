study_interpretation: 'Plesca et al. 2022 provides mIHC quantification of CLEC9A+ cDC1 density in

  resected PDAC tissue (n=40, Vectra 3 automated imaging + inForm analysis).

  WTA (whole tumor area) cDC1 density was 9.84 +/- 1.16 cells/mm2 (mean +/- SEM).

  cDC1s were preferentially located in tumor stroma (TS: 12.6 +/- 1.62) vs

  intraepithelial tumor (IET: 0.679 +/- 0.179). Neoadjuvant chemotherapy (36% of

  cohort) did not significantly affect cDC1 density (p=0.27), so the full cohort

  is used.


  The model parameter APC0_cDC1_T represents the homeostatic cDC1 density in the

  tumor compartment (cell/mL). At steady state with ECM inhibition of APC migration,

  actual cDC1 density = APC0_cDC1_T * (1 - H_ECM_APC_mig). The IHC measurement

  gives the actual density at diagnosis, so APC0_cDC1_T > observed. The forward

  model accounts for this via an ECM occupancy factor.


  The WTA measurement is used because it represents the entire tumor region

  (stroma + epithelium), matching the model''s V_T compartment.

  '
key_assumptions:
- 'WTA (whole tumor area) density is used as the relevant measurement for the

  model''s V_T compartment, which includes both stroma and tumor epithelium.

  '
- 'Areal-to-volumetric conversion uses section thickness (3-5 um) as the effective

  depth. Abercrombie correction applied for overcounting: correction = t/(t+d)

  where t = section thickness, d = DC diameter (~13 um).

  '
- 'ECM occupancy factor of 0.6 accounts for the steady-state reduction of cDC1

  density by ECM-mediated migration inhibition at diagnosis. With current model

  parameters (f_ECM_50_APC_mig=0.15, ECM_max=100, ECM_level~10 at diagnosis),

  H_ECM ~0.4, giving occupancy ~0.6. Range 0.3-0.8 captures parameter uncertainty.

  '
- 'Results reported as mean +/- SEM. SD = SEM * sqrt(n) = 1.16 * sqrt(40) = 7.33.

  This represents inter-patient variability in cDC1 density.

  '
- 'CLEC9A is a specific marker for cDC1 (conventional DCs type 1). The mIHC panel

  also included CD1c (cDC2), CLEC10A (cDC2), and PanCK (tumor cells).

  '
key_study_limitations:
- 'Mixed cohort: 36% received neoadjuvant chemotherapy. Although neoadjuvant

  treatment did not significantly change cDC1 density (p=0.27), the power to

  detect a moderate effect with n=40 is limited.

  '
- 'Section thickness reported as a range (3-5 um) rather than a single value.

  This introduces ~40% uncertainty in the areal-to-volumetric conversion.

  '
- 'No Abercrombie or optical disector correction applied in the original study.

  DCs (~13 um diameter) in 3-5 um sections are overcounted by factor

  (t+d)/t = (4+13)/4 ~ 4.25x. The correction factor has substantial uncertainty.

  '
- 'Resected PDAC only (UICC stage I-II). Immune infiltrate may differ in

  unresectable/metastatic disease.

  '
- '25-50% of tumor-containing regions were scanned at x200. Sampling bias

  may affect density estimates in heterogeneous tumors.

  '
