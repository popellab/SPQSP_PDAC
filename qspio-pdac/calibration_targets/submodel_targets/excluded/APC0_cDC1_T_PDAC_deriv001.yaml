calibration:
  parameters:
  - name: APC0_cDC1_T
    units: cell/milliliter
  forward_model:
    type: algebraic
    formula: 'predicted_cells_per_mm2 = APC0_cDC1_T * (t + d) / 1e6

      where t = section thickness (um), d = DC diameter (um).

      Combines section volume (t/1e6 mL per mm2) with Abercrombie

      overcounting ((t+d)/t), simplifying to (t+d)/1e6.

      '
    data_rationale: 'mIHC provides areal density of CLEC9A+ cDC1 cells (cells/mm2) in PDAC

      tumor sections. The forward model predicts this areal density from the

      volumetric parameter APC0_cDC1_T using section thickness and Abercrombie

      overcounting correction for DCs.

      '
    submodel_rationale: 'The QSP model''s cDC1 recruitment rate is:

      k_APC_death * APC0_cDC1_T * V_T * (1 - H_ECM_APC_mig)

      At steady state: cDC1 = APC0_cDC1_T * (1 - H_ECM_APC_mig).

      ECM exclusion is omitted here; the submodel constrains the observed

      cDC1 density at diagnosis. SBI will resolve the APC0_cDC1_T vs

      f_ECM_50_APC_mig degeneracy during full-model calibration.

      '
    code: "def compute(params, inputs):\n    # Predict IHC areal density (cells/mm2) from volumetric APC0_cDC1_T\n    # svf\
      \ = (t + d) / 1e6 where t = section thickness, d = DC diameter (um)\n    # Uses midpoint section thickness (4 um) for\
      \ forward prediction\n    t = (inputs['section_thickness_low'] + inputs['section_thickness_high']) / 2\n    d = inputs['dc_diameter']\n\
      \    svf = (t + d) / 1e6\n    return params['APC0_cDC1_T'] * svf\n"
  error_model:
  - name: cdc1_density_plesca2022
    units: cell / millimeter**2
    uses_inputs:
    - cdc1_wta_density_mean
    - cdc1_wta_density_sem
    - n_mihc_patients
    - section_thickness_low
    - section_thickness_high
    - dc_diameter
    sample_size_input: n_mihc_patients
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n\n    # cDC1\
      \ WTA areal density (mean +/- SEM, n=40)\n    mean_areal = inputs['cdc1_wta_density_mean']  # 9.84 cells/mm2\n    sem\
      \ = inputs['cdc1_wta_density_sem']            # 1.16 cells/mm2\n    n = int(inputs['n_mihc_patients'])             \
      \  # 40\n    sd_areal = sem * np.sqrt(n)                      # ~7.33\n\n    # Convert normal mean+SD to lognormal parameters\n\
      \    # Cell densities are positive and right-skewed; lognormal is the\n    # natural distribution. CV = 0.74 means normal\
      \ draws go negative.\n    cv = sd_areal / mean_areal\n    sigma_ln = np.sqrt(np.log(1 + cv**2))\n    mu_ln = np.log(mean_areal)\
      \ - sigma_ln**2 / 2\n\n    # Bootstrap from lognormal inter-patient distribution\n    samples = rng.lognormal(mu_ln,\
      \ sigma_ln, size=n_bootstrap)\n\n    return samples\n"
  identifiability_notes: 'APC0_cDC1_T is partially confounded with f_ECM_50_APC_mig in the full

    model (observed density = APC0_cDC1_T * (1 - H_ECM)). Setting excl=0

    in this submodel target means the prior derivation constrains the

    OBSERVED cDC1 density at diagnosis rather than the homeostatic density.

    During SBI, the joint posterior of APC0_cDC1_T and f_ECM_50_APC_mig

    will resolve this degeneracy. The section volume factor (1.7e-5)

    carries ~30% uncertainty from the 3-5 um section thickness range,

    absorbed into the translation sigma.

    '
