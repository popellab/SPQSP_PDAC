    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['cxcl10_dose3']\n"
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['cxcl10_mean_3']\n    sem = inputs['cxcl10_sem_3']\n    sd = sem * np.sqrt(sample_size)\n    return rng.normal(mean,\
      \ sd / np.sqrt(sample_size), n_bootstrap)\n"
  - name: cxcl10_10000U
    units: dimensionless
    uses_inputs:
    - cxcl10_mean_4
    - cxcl10_sem_4
    - n_preparations
    sample_size_input: n_preparations
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['cxcl10_dose4']\n"
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['cxcl10_mean_4']\n    sem = inputs['cxcl10_sem_4']\n    sd = sem * np.sqrt(sample_size)\n    return rng.normal(mean,\
      \ sd / np.sqrt(sample_size), n_bootstrap)\n"
  identifiability_notes: 'IFNg_50_CXCL9 is constrained by the dose-response shape across 500-10000 U/mL for both CXCL9 and
    CXCL10 (8 data points total). The EC50 and specific activity are partially confounded (both affect the effective nM concentration
    at which response saturates), but the prior on SA from R&D Systems specifications provides an informative anchor. The
    two independent maxima (CXCL9 vs CXCL10) are well-identified from the plateau levels. CXCL9 appears nearly saturated by
    5000 U/mL while CXCL10 is still rising at 10000 U/mL, providing differential information about the EC50-SA relationship.

    '
experimental_context:
  species: human
  system: in_vitro_primary_cells
  cell_lines:
  - name: primary thyrocytes
    source: Normal thyroid tissue from 5 patients (3 parathyroidectomy, 2 laryngeal intervention)
  cell_types:
  - name: thyroid follicular cell
    source: primary cultures from normal human thyroid tissue
  culture_conditions:
    medium: RPMI 1640 + 10% FBS + 2 mM glutamine + 50 mg/l penicillin/streptomycin
    notes: '3000 cells seeded onto 96-well plates. After 24h, growth medium removed,

      cells washed in PBS, incubated in phenol red and serum-free medium with

      IFNgamma (R&D Systems) for 24h. CXCL9 and CXCL10 measured by ELISA

      (R&D Systems kits). All experiments repeated 3 times with 3 cell preparations.

      '
study_interpretation: 'IFNgamma dose-dependently induces CXCL9 and CXCL10 secretion from primary human thyrocytes. CXCL9 reaches
  near-saturation by 5000 U/mL while CXCL10 is still rising at 10000 U/mL, suggesting either differential sensitivity or different
  maximal induction capacities. The dose-response shape constrains IFNg_50_CXCL9 via the Hill function, with the U/mL to nM
  conversion (specific activity) treated as a nuisance parameter to absorb lot-to-lot variability. IFNgamma was the most potent
  stimulus compared to IFNalpha and IFNbeta for both CXCL9 and CXCL10.

  '
key_assumptions:
- JAK-STAT1 pathway EC50 for CXCL9/10 induction is conserved across cell types
- CXCL9 and CXCL10 share the same IFNg EC50 (both induced via JAK-STAT1)
- Specific activity of R&D Systems IFNg is approximately 2e7 U/mg (lognormal prior, sigma=0.5)
- IFNg MW = 17 kDa (monomer) used for U/mL to nM conversion
- 24h incubation is sufficient for steady-state secretion
key_study_limitations:
- Thyrocytes, not PDAC TME cell types (tumor cells, macrophages, DCs)
- All tested doses likely well above EC50; curve is mostly in the saturated range
- U/mL to nM conversion depends on IFNg specific activity (lot-dependent, not reported)
- SEM reported with n=3 cell preparations; small sample size
- Serum-free conditions may alter receptor expression or signaling
primary_data_source:
  doi: 10.1016/j.cyto.2010.01.009
  source_tag: Antonelli2010
  title: 'Interferon-alpha, -beta and -gamma induce CXCL9 and CXCL10 secretion by human thyrocytes: Modulation by peroxisome
    proliferator-activated receptor-gamma agonists'
  authors:
  - Antonelli
  - Ferrari SM
  - Fallahi P
  - Ghiri E
  - Crescioli C
  - Romagnani P
  - Vitti P
  - Serio M
  - Ferrannini E
  year: 2010
  source_relevance:
    indication_match: proxy
    indication_match_justification: 'Primary human thyrocytes used as a model for IFNg-induced CXCL9/10 secretion. The JAK-STAT1
      signaling pathway mediating IFNg -> CXCL9/10 induction is conserved across epithelial and stromal cell types. In the
      PDAC model, CXCL9/10 is produced by tumor cells, M1 macrophages, and cDC1s — all of which use the same IFNg receptor
      and JAK-STAT1 pathway. The EC50 for IFNg-induced CXCL9/10 reflects receptor-proximal signaling and is expected to be
      similar across cell types expressing comparable IFNgR densities.

      '
    species_source: human
    species_target: human
    source_quality: primary_human_in_vitro
    perturbation_type: pharmacological
    perturbation_relevance: 'Exogenous recombinant IFNg at graded concentrations (500-10000 U/mL).

      This is a standard dose-response design measuring the intrinsic

      IFNg -> CXCL9/10 secretion pathway. The pharmacological doses span

      a physiologically relevant range and the dose-response shape directly

      constrains the EC50 parameter.

      '
    tme_compatibility: moderate
    tme_compatibility_notes: 'In vitro thyrocyte monoculture lacks TME context (no immune cells, ECM, or competing cytokines).
      IFNg receptor density and downstream signaling may differ between thyrocytes and PDAC TME cell types. However, the JAK-STAT1
      pathway is highly conserved and the EC50 is primarily determined by receptor affinity and signaling threshold, not cell-type-specific
      factors.

      '
    measurement_directness: single_inversion
    temporal_resolution: endpoint_pair
    experimental_system: in_vitro_primary
