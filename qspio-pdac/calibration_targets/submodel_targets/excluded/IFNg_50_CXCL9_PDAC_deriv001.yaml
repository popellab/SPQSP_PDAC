    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['cxcl9_mean_2']\n    sem = inputs['cxcl9_sem_2']\n    sd = sem * np.sqrt(sample_size)\n    return rng.normal(mean,\
      \ sd / np.sqrt(sample_size), n_bootstrap)\n"
