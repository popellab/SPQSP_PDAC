      \ inputs['cxcl10_mean_1']\n    sem = inputs['cxcl10_sem_1']\n    sd = sem * np.sqrt(sample_size)\n    return rng.normal(mean,\
      \ sd / np.sqrt(sample_size), n_bootstrap)\n"
