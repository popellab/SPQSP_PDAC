calibration:
  parameters:
  - name: IFNg_50_CXCL9
    units: nanomolarity
  - name: ifng_specific_activity
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 16.81
      sigma: 0.5
  - name: cxcl9_maximum
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 5.55
      sigma: 0.3
  - name: cxcl10_maximum
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 5.0
      sigma: 0.5
  forward_model:
    type: algebraic
    formula: 'CXCL9_output = cxcl9_max * IFNg_nM / (IFNg_50_CXCL9 + IFNg_nM)

      CXCL10_output = cxcl10_max * IFNg_nM / (IFNg_50_CXCL9 + IFNg_nM)

      where IFNg_nM = dose_U_per_mL / (SA_U_per_mg * MW_kDa)

      '
    code: "def compute(params, inputs):\n    ec50 = params['IFNg_50_CXCL9']\n    sa = params['ifng_specific_activity']\n \
      \   cxcl9_max = params['cxcl9_maximum']\n    cxcl10_max = params['cxcl10_maximum']\n\n    # Convert U/mL to nM: (U/mL)\
      \ / (U/mg) = mg/mL = g/L; then / MW(g/mol) = mol/L; * 1e9 = nM\n    # Equivalently: nM = dose / (sa * MW_kDa) * 1e6\n\
      \    mw_ifng_kda = 17.0\n\n    def dose_to_nM(dose_u_per_ml):\n        return\
      \ dose_u_per_ml / (sa * mw_ifng_kda) * 1e6\n\n    def hill(dose_u_per_ml, maximum):\n        conc_nM = dose_to_nM(dose_u_per_ml)\n\
      \        return maximum * conc_nM / (ec50 + conc_nM)\n\n    return {\n        'cxcl9_dose1': hill(inputs['ifng_dose_1'],\
      \ cxcl9_max),\n        'cxcl9_dose2': hill(inputs['ifng_dose_2'], cxcl9_max),\n        'cxcl9_dose3': hill(inputs['ifng_dose_3'],\
      \ cxcl9_max),\n        'cxcl9_dose4': hill(inputs['ifng_dose_4'], cxcl9_max),\n        'cxcl10_dose1': hill(inputs['ifng_dose_1'],\
      \ cxcl10_max),\n        'cxcl10_dose2': hill(inputs['ifng_dose_2'], cxcl10_max),\n        'cxcl10_dose3': hill(inputs['ifng_dose_3'],\
      \ cxcl10_max),\n        'cxcl10_dose4': hill(inputs['ifng_dose_4'], cxcl10_max),\n    }\n"
    data_rationale: IFNg dose-response for CXCL9 and CXCL10 secretion measured by ELISA. Both chemokines are induced via the
      same JAK-STAT1 pathway and share the IFNg EC50 parameter in the QSP model. Using both chemokines from the same experiment
      doubles the data constraining IFNg_50_CXCL9.
    submodel_rationale: The QSP model uses H_IFNg_CXCL9 = IFNg/(IFNg_50_CXCL9 + IFNg) to gate CXCL9/10 production. The forward
      model replicates this Hill function with a unit conversion (U/mL -> nM via specific activity) as a nuisance parameter.
      CXCL9 and CXCL10 share the EC50 but have independent maxima.
  error_model:
  - name: cxcl9_500U
    units: dimensionless
    uses_inputs:
    - cxcl9_mean_1
    - cxcl9_sem_1
    - n_preparations
    sample_size_input: n_preparations
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['cxcl9_dose1']\n"
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['cxcl9_mean_1']\n    sem = inputs['cxcl9_sem_1']\n    sd = sem * np.sqrt(sample_size)\n    return rng.normal(mean,\
      \ sd / np.sqrt(sample_size), n_bootstrap)\n"
  - name: cxcl9_1000U
    units: dimensionless
    uses_inputs:
    - cxcl9_mean_2
    - cxcl9_sem_2
    - n_preparations
    sample_size_input: n_preparations
