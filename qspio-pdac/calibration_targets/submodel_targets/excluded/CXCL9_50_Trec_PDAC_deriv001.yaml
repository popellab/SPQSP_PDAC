calibration:
  parameters:
  - name: CXCL9_50_Trec
    units: nanomolarity
  - name: mig_baseline
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 2.7
      sigma: 0.5
  - name: mig_maximum
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 5.5
      sigma: 0.3
  forward_model:
    type: algebraic
    formula: Hill function for chemotaxis dose-response + EC50 = Kd identity
    code: "def compute(params, inputs):\n    ec50 = params['CXCL9_50_Trec']\n    baseline = params['mig_baseline']\n    maximum\
      \ = params['mig_maximum']\n\n    def hill(x):\n        return baseline + (maximum - baseline) * x / (ec50 + x)\n\n \
      \   return {\n        'chemotaxis_0p01nM': hill(inputs['conc_mig_1']),\n        'chemotaxis_0p1nM': hill(inputs['conc_mig_2']),\n\
      \        'chemotaxis_1nM': hill(inputs['conc_mig_3']),\n        'chemotaxis_16nM': hill(inputs['conc_mig_4']),\n   \
      \     'chemotaxis_180nM': hill(inputs['conc_mig_5']),\n        'binding_kd': ec50,\n    }\n"
    data_rationale: Transwell chemotaxis dose-response directly measures the concentration dependence of CXCR3-mediated cell
      migration, which is the biological process modeled by H_CXCL9_Trec in the QSP model. Binding Kd provides an independent
      physicochemical constraint (EC50 = Kd for receptor occupancy-driven responses).
    submodel_rationale: The QSP Hill function H_CXCL9_Trec = CXCL9/(CXCL9_50_Trec + CXCL9) is a standard receptor occupancy
      model. The ascending limb of the bell-shaped chemotaxis curve is used (high-concentration desensitization excluded).
      The binding Kd from the same paper provides an independent constraint on EC50.
  error_model:
  - name: chemotaxis_0p01nM
    units: dimensionless
    uses_inputs:
    - migrated_mig_1
    - sd_mig_1
    - n_wells
    sample_size_input: n_wells
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['chemotaxis_0p01nM']\n"
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['migrated_mig_1']\n    sd = inputs['sd_mig_1']\n    return rng.normal(mean, sd / np.sqrt(sample_size), n_bootstrap)\n"
  - name: chemotaxis_0p1nM
    units: dimensionless
    uses_inputs:
    - migrated_mig_2
    - sd_mig_2
    - n_wells
    sample_size_input: n_wells
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['chemotaxis_0p1nM']\n"
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['migrated_mig_2']\n    sd = inputs['sd_mig_2']\n    return rng.normal(mean, sd / np.sqrt(sample_size), n_bootstrap)\n"
  - name: chemotaxis_1nM
    units: dimensionless
    uses_inputs:
    - migrated_mig_3
    - sd_mig_3
    - n_wells
    sample_size_input: n_wells
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['chemotaxis_1nM']\n"
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['migrated_mig_3']\n    sd = inputs['sd_mig_3']\n    return rng.normal(mean, sd / np.sqrt(sample_size), n_bootstrap)\n"
  - name: chemotaxis_16nM
    units: dimensionless
    uses_inputs:
    - migrated_mig_4
    - sd_mig_4
    - n_wells
    sample_size_input: n_wells
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['chemotaxis_16nM']\n"
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['migrated_mig_4']\n    sd = inputs['sd_mig_4']\n    return rng.normal(mean, sd / np.sqrt(sample_size), n_bootstrap)\n"
  - name: chemotaxis_180nM
    units: dimensionless
    uses_inputs:
    - migrated_mig_5
    - sd_mig_5
    - n_wells
    sample_size_input: n_wells
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['chemotaxis_180nM']\n"
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['migrated_mig_5']\n    sd = inputs['sd_mig_5']\n    return rng.normal(mean, sd / np.sqrt(sample_size), n_bootstrap)\n"
  - name: binding_kd
    units: nanomolarity
    uses_inputs:
    - kd_mig_midpoint
    - kd_mig_halfrange
    - n_binding_experiments
    sample_size_input: n_binding_experiments
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['binding_kd']\n"
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    kd_mid\
      \ = inputs['kd_mig_midpoint']\n    kd_half = inputs['kd_mig_halfrange']\n    sd = kd_half\n    return rng.lognormal(np.log(kd_mid),\
      \ sd / kd_mid / np.sqrt(sample_size), n_bootstrap)\n"
  identifiability_notes: 'CXCL9_50_Trec is well-identified from the 5-point ascending chemotaxis curve spanning 0.01-180 nM.
    The binding Kd (0.9-1.2 nM) provides an independent constraint. Nuisance parameters (baseline, maximum) are identifiable
    from the curve endpoints. The descending limb (1409 nM desensitization point) is excluded because the QSP model does not
    capture GPCR desensitization.

    '
experimental_context:
  species: human
  system: in_vitro_cell_line
  cell_lines:
  - name: 300-19
    source: Theodor-Kocher Institute, University of Bern
  cell_types:
  - name: pre-B cell
    source: murine pre-B cell line stably transfected with human CXCR3
  culture_conditions:
    medium: RPMI 1640 + 0.25% BSA
    notes: 'Transwell migration assay (24-well Costar plates, 5-um polycarbonate membrane).

      Cells loaded onto inserts at 0.5e6/100uL. Chemokine in lower compartment.

      120 min incubation at 37C, 5% CO2. Migrated cells counted by hemocytometer.

      '
study_interpretation: 'Mig (CXCL9) induces concentration-dependent chemotaxis of CXCR3-expressing cells with a bell-shaped
  dose-response (ascending limb EC50 ~3-5 nM, peak at ~100-200 nM, desensitization above 1000 nM). The binding Kd of 0.9-1.2
  nM provides an independent physicochemical anchor. Together these data constrain CXCL9_50_Trec to the low-nanomolar range,
  consistent with the current model default of 1.0 nM.

  '
key_assumptions:
- Ascending limb of chemotaxis bell-curve maps to the QSP Hill function (desensitization not modeled)
- Chemotaxis EC50 approximates binding Kd for GPCR-driven migration (receptor occupancy model)
- CXCR3 binding and signaling properties are cell-type independent (validated in paper)
- CXCL9 species in model represents pooled CXCR3 ligands; Mig data is used as the primary CXCL9-specific constraint
key_study_limitations:
- CXCR3-transfected pre-B cells, not primary T cells (though paper validates equivalent responses)
- In vitro transwell assay lacks ECM barriers and competing chemokine gradients present in PDAC TME
- Bell-shaped chemotaxis curve suggests desensitization at high concentrations not captured by model
- Only 3 triplicate wells per condition; data representative of 3 independent experiments but only 1 shown
primary_data_source:
  doi: 10.1002/(SICI)1521-4141(199811)28:11<3696::AID-IMMU3696>3.0.CO;2-W
  source_tag: Loetscher1998
  title: 'Lymphocyte-specific chemokine receptor CXCR3: regulation, chemokine binding and gene localization'
  authors:
  - Loetscher
  - Loetscher P
  - Brass N
  - Meese E
  - Moser B
  year: 1998
  source_relevance:
    indication_match: proxy
    indication_match_justification: 'CXCR3-transfected pre-B cells used as a model system for CXCR3-mediated chemotaxis. CXCR3
      is the same receptor expressed on tumor-infiltrating CD8+ T cells and NK cells in PDAC. The receptor-ligand binding
      affinity and Hill function EC50 are receptor-intrinsic properties independent of cell type, so the binding Kd and chemotaxis
      EC50 translate directly. The pre-B cell system was validated by the same group to give identical responses to primary
      T lymphocytes for IP10 and Mig.

      '
    species_source: human
    species_target: human
    source_quality: primary_human_in_vitro
    perturbation_type: physiological_baseline
    perturbation_relevance: 'No pharmacological perturbation. Chemotaxis measured in response to

      exogenous recombinant Mig (CXCL9) at graded concentrations. Reflects

      intrinsic CXCR3-mediated migration dose-response under standard

      in vitro conditions.

      '
    tme_compatibility: moderate
    tme_compatibility_notes: 'In vitro chemotaxis assay measures intrinsic CXCR3 signaling without TME factors (ECM barriers,
      competing chemokines, receptor desensitization from chronic exposure). In vivo EC50 may differ due to GAG-mediated chemokine
      presentation and gradient formation. However, the receptor binding Kd is an intrinsic property that anchors the EC50
      estimate.

      '
    measurement_directness: single_inversion
    temporal_resolution: endpoint_pair
    experimental_system: in_vitro_cell_line
