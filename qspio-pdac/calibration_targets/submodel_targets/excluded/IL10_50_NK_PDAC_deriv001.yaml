      \    import numpy as np\n    mean = inputs['IFNg_IL10_100_mean_pgml']\n    sd\
      \ = inputs['IFNg_IL10_100_sd_pgml']\n    cv = sd / mean\n    sigma_ln = np.sqrt(np.log(1.0\
      \ + cv ** 2))\n    mu_ln = np.log(mean) - sigma_ln ** 2 / 2.0\n    return rng.lognormal(mu_ln,\
      \ sigma_ln / np.sqrt(sample_size), n_bootstrap)"
    n_bootstrap: 10000
  identifiability_notes: 'Eight dose-response measurements (four IL-10 doses for NK
    cytotoxicity and four for IFN-gamma secretion) constrain four QSP parameters:
    the shared IL-10 EC50 (IL10_50_NK), Hill coefficient (n_IL10_NK), and separate
    maximal fold-changes for cytotoxicity and IFN-gamma. Cytotoxicity and cytokine
    data jointly reduce uncertainty on IL10_50_NK and n_IL10_NK, while amplitudes
    (NK_cytotox_max_foldchange, NK_IFNg_max_foldchange) may remain partially correlated
    with the Hill coefficient. Baseline responses at 0 ng/ml IL-10 are treated as
    fixed inputs, so absolute baseline levels are not inferred here; the target instead
    constrains relative IL-10 sensitivity and maximal enhancement. Because data are
    from in vitro expanded blood NK cells in the absence of a PDAC tumor microenvironment,
    additional in vivo data would be needed to fully characterize IL-10 effects on
    tumor-infiltrating NK cells in PDAC.'
experimental_context:
  species: human
  system: in_vitro_primary_cells
  cell_types:
  - name: NK cells
    phenotype: CD56+ CD3- human peripheral blood NK cells, ex vivo expanded
    isolation_method: Negative selection from PBMCs followed by co-culture with irradiated
      K562 feeder cells expressing membrane-bound IL-15, IL-21 and 4-1BBL
    source: Peripheral blood from healthy donors
  culture_conditions:
    substrate: Plastic culture plates (standard tissue culture-treated)
    serum_concentration: 10.0
    serum_concentration_units: percent
    oxygen_level: normoxic (5% CO2 incubator)
    culture_type: 2d_monolayer
    medium: BIOTARGET medium supplemented with 10% fetal bovine serum
    supplements: Human recombinant IL-2 (50 IU/ml) during expansion phase; recombinant
      human IL-10 at 0, 5, 20, 50, 100 ng/ml during 16 h stimulation
    duration: 14 days ex vivo expansion with K562 feeders followed by 16 h IL-10 stimulation
      and 1.5 h co-culture with K562 targets for cytotoxicity assay
    notes: Cytotoxicity measured against CellTrace Violet-labeled K562 leukemia cells
      at 1.5:1 effector:target ratio for ex vivo expanded NK cells.
  indication: Pancreatic ductal adenocarcinoma (PDAC) model parameterization using
    human blood NK cell data as a mechanistic proxy
study_interpretation: Wang2021 demonstrates that recombinant human IL-10 dose-dependently
  enhances effector functions of ex vivo expanded human NK cells. Over 0 to 100 ng/ml
  IL-10, both K562 killing and IFN-gamma secretion increase with a sigmoidal, saturating
  profile that is well captured by a Hill function with EC50 in the low tens of ng/ml.
  By fitting a shared Hill curve to the cytotoxicity and IFN-gamma dose-responses,
  this submodel constrains the PDAC QSP parameter IL10_50_NK (half-maximal IL-10 sensitivity
  of NK effector functions) together with the Hill coefficient and maximal fold-change
  amplitudes for cytotoxicity and IFN-gamma.
key_assumptions:
- Ex vivo expanded human peripheral blood NK cells have similar intrinsic IL-10 sensitivity
  to tumor-infiltrating NK cells in PDAC, even though the PDAC tumor microenvironment
  is more immunosuppressive and desmoplastic.
- The 16 h IL-10 stimulation used by Wang2021 yields near-steady-state changes in
  NK effector capacity, so a static Hill-type algebraic model is an appropriate summary
  of the dose-response.
- IL-10 modulates NK effector functions primarily through changing per-cell cytotoxic
  potency and IFN-gamma secretion rates, which can be represented as multiplicative
  fold-changes relative to baseline (0 ng/ml IL-10).
- The same IL-10 EC50 (IL10_50_NK) and Hill coefficient (n_IL10_NK) control both NK
  cytotoxicity and IFN-gamma secretion, with only the maximal fold-change differing
  between readouts.
- Measurement errors for different IL-10 doses and for cytotoxicity versus IFN-gamma
  are independent and approximately lognormal, given the strictly positive nature
  and roughly multiplicative variability of the readouts.
- Baseline (no IL-10) NK cytotoxicity and IFN-gamma levels from Wang2021 are representative
  for scaling the fold-change but do not themselves require explicit parameterization
  in the QSP model.
key_study_limitations:
- Experiments were performed in vitro with ex vivo expanded NK cells from healthy
  donors, not with tumor-infiltrating NK cells from PDAC patients; stromal barriers,
  chronic cytokine exposure and suppressive myeloid cells present in PDAC are absent.
- IL-10 acts as a stimulatory cytokine for NK cells in this system, whereas in many
  tumor settings IL-10 is associated with immunosuppression; the QSP model must encode
  the direction of IL-10 effects separately from this EC50 calibration.
- Sample size for the IL-10 dose-response panels (Figure 1L,M) is small (n = 2), leading
  to substantial statistical uncertainty in Hill parameter estimates.
- Cytotoxicity is measured against K562 leukemia targets at a single E:T ratio and
  time point, which may not directly reflect NK killing efficiency against PDAC cells
  in vivo.
- IL-10 concentrations used (up to 100 ng/ml) are supraphysiologic compared with typical
  serum levels in patients; local intratumoral IL-10 concentrations in PDAC are not
  measured here.
- Potential contributions of other cytokines (such as residual IL-2 from expansion)
  and feeder-cell-induced activation state on IL-10 responsiveness are not explicitly
  quantified.
