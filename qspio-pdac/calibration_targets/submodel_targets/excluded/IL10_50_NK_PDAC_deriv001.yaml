      \ + cv ** 2))\n    mu_ln = np.log(mean) - sigma_ln ** 2 / 2.0\n    return rng.lognormal(mu_ln,\
      \ sigma_ln / np.sqrt(sample_size), n_bootstrap)"
    n_bootstrap: 10000
  - name: IFNg_IL10_100
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['IFNg_pgml_100']\n"
