      \  sd = inputs['NK_kill_IL10_100_sd_pct']\n    cv = sd / mean\n    sigma_ln\
      \ = np.sqrt(np.log(1.0 + cv ** 2))\n    mu_ln = np.log(mean) - sigma_ln ** 2\
      \ / 2.0\n    return rng.lognormal(mu_ln, sigma_ln / np.sqrt(sample_size), n_bootstrap)"
    n_bootstrap: 10000
  - name: IFNg_IL10_5
