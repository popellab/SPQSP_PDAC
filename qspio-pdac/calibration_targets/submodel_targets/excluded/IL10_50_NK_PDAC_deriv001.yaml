calibration:
  parameters:
  - name: IL10_50_NK
    units: nanogram / milliliter
    nuisance: false
  - name: n_IL10_NK
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 0.0
      sigma: 0.5
  - name: NK_cytotox_max_foldchange
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 0.0
      sigma: 0.7
  - name: NK_IFNg_max_foldchange
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 0.0
      sigma: 0.7
  forward_model:
    data_rationale: Wang2021 reports IL-10 dose-responses (0, 5, 20, 50, 100 ng/ml)
      for ex vivo expanded human NK cells, measuring percent killing of K562 targets
      and IFN-gamma secretion after 16 h IL-10 pre-treatment. The experimental design
      corresponds to steady-state effector function vs cytokine concentration and
      is appropriately summarized by a Hill-type algebraic response curve.
    submodel_rationale: 'In the PDAC QSP model, IL10_50_NK and a Hill coefficient
      n_IL10_NK gate IL-10 modulation of NK effector functions (killing and IFN-gamma
      production) via multiplicative Hill terms. This algebraic submodel reproduces
      that gating: both cytotoxicity and IFN-gamma are scaled from their baseline
      (no IL-10) values by Hill functions of IL-10 with shared EC50 and Hill coefficient
      and separate maximal fold-change parameters (NK_cytotox_max_foldchange, NK_IFNg_max_foldchange).'
    type: algebraic
    formula: NK cytotoxicity (%) and IFN-gamma secretion (pg/ml) increase with IL-10
      concentration via a shared Hill function with EC50 IL10_50_NK and Hill coefficient
      n_IL10_NK, scaling baseline responses by maximal fold-change parameters for
      cytotoxicity and IFN-gamma.
    code: "def compute(params, inputs):\n    import numpy as np\n\n    def hill_il10(dose):\n\
      \        ec50 = params['IL10_50_NK']\n        n_h = params['n_IL10_NK']\n  \
      \      if dose <= 0.0:\n            return 0.0\n        return 1.0 / (1.0 +\
      \ (ec50 / dose) ** n_h)\n\n    base_kill = inputs['NK_kill_IL10_0_mean_pct']\n\
      \    base_ifng = inputs['IFNg_IL10_0_mean_pgml']\n\n    fmax_kill = params['NK_cytotox_max_foldchange']\n\
      \    fmax_ifng = params['NK_IFNg_max_foldchange']\n\n    result = {}\n    for\
      \ label in ['5', '20', '50', '100']:\n        dose = inputs['IL10_dose_' + label\
      \ + '_ngml']\n        h = hill_il10(dose)\n        result['kill_pct_' + label]\
      \ = base_kill * (1.0 + (fmax_kill - 1.0) * h)\n        result['IFNg_pgml_' +\
      \ label] = base_ifng * (1.0 + (fmax_ifng - 1.0) * h)\n    return result\n"
  error_model:
  - name: NK_kill_IL10_5
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['kill_pct_5']\n"
    units: percent
    uses_inputs:
    - NK_kill_IL10_5_mean_pct
    - NK_kill_IL10_5_sd_pct
    - NK_dose_response_n
    sample_size_input: NK_dose_response_n
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['NK_kill_IL10_5_mean_pct']\n    sd\
      \ = inputs['NK_kill_IL10_5_sd_pct']\n    cv = sd / mean\n    sigma_ln = np.sqrt(np.log(1.0\
      \ + cv ** 2))\n    mu_ln = np.log(mean) - sigma_ln ** 2 / 2.0\n    return rng.lognormal(mu_ln,\
      \ sigma_ln / np.sqrt(sample_size), n_bootstrap)"
    n_bootstrap: 10000
  - name: NK_kill_IL10_20
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['kill_pct_20']\n"
    units: percent
    uses_inputs:
    - NK_kill_IL10_20_mean_pct
    - NK_kill_IL10_20_sd_pct
    - NK_dose_response_n
    sample_size_input: NK_dose_response_n
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['NK_kill_IL10_20_mean_pct']\n   \
      \ sd = inputs['NK_kill_IL10_20_sd_pct']\n    cv = sd / mean\n    sigma_ln =\
      \ np.sqrt(np.log(1.0 + cv ** 2))\n    mu_ln = np.log(mean) - sigma_ln ** 2 /\
      \ 2.0\n    return rng.lognormal(mu_ln, sigma_ln / np.sqrt(sample_size), n_bootstrap)"
    n_bootstrap: 10000
  - name: NK_kill_IL10_50
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['kill_pct_50']\n"
    units: percent
    uses_inputs:
    - NK_kill_IL10_50_mean_pct
