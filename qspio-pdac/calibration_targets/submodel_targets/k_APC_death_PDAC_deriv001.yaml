  identifiability_notes: >
    k_APC_death is the primary QSP parameter, representing the cDC2 (CD8-) baseline
    turnover rate. The nuisance parameter r_cDC1_turnover absorbs the ~1.9x faster
    turnover of cDC1 (CD8+) DCs documented by Kamath2002 (half-life ~1.5d for CD8+
    vs ~3d for CD8- in spleen). With 6 CD8+ and 6 CD8- time points across two
    tissues, both parameters are well-identified. Residual tissue differences
    (spleen vs mesLN) are absorbed into observational noise — adding a tissue
    nuisance parameter would leave only 3 points per group, risking overfitting.
    The QSP model uses a single k_APC_death for both cDC1 and cDC2; the posterior
    for k_APC_death from this target should be interpreted as the cDC2-anchored
    rate, with cDC1 turnover implicitly ~1.9x faster in the data but not
    distinguished in the QSP model.
experimental_context:
  species: mouse
  system: animal_in_vivo
  cell_types:
  - name: Conventional dendritic cells (CD11c+ MHC class IIhi)
    phenotype: 'Splenic and mesenteric lymph node DC subtypes: CD8+ DEC-205+ (cDC1-like)
      and CD8- DEC-205+ (cDC2-like)'
    isolation_method: Collagenase-DNase digestion of spleen or LN fragments, Nycodenz
      gradient, and immunomagnetic depletion of non-DC lineages, followed by flow
      cytometric gating on CD11c+ MHC class IIhi cells
    source: "Healthy adult C57BL/6J WEHI mice, 6\u20139 weeks old"
  indication: Healthy lymphoid organs (spleen and mesenteric lymph nodes) in steady-state
    mice; used as a proxy for APC turnover in human PDAC tumor and draining lymph
    node.
study_interpretation: "Kamath2002 performed continuous BrdU labeling in healthy C57BL/6\
  \ mice and quantified the kinetics of BrdU incorporation into phenotypically defined\
  \ dendritic cell subtypes in spleen and lymph nodes. Because mature DCs are nondividing\
  \ end cells, BrdU first labels their dividing precursors and then appears in mature\
  \ DCs as unlabeled cells are lost and replaced. For a DC population at homeostasis\
  \ with first-order loss and replacement from BrdU-labeled precursors, the fraction\
  \ of unlabeled cells should decay as U(t) = U0 * exp(-k * t), where k is the turnover/death\
  \ rate. By fitting this exponential decay of the unlabeled fraction across CD8+\
  \ DEC-205+ and CD8- DEC-205+ DCs in spleen and mesenteric LNs, we obtain an effective\
  \ k_APC_death that is mechanistically aligned with the QSP model\u2019s first-order\
  \ APC death term. This k_APC_death represents a composite murine lymphoid-organ\
  \ DC turnover rate on the order of 0.3\u20130.5 day^-1 (half-life 1.5\u20133 days),\
  \ consistent with Kamath\u2019s reported subtype-specific half-lives, and is used\
  \ as a proxy for immature cDC1/cDC2 death in human PDAC tumor and draining LN compartments."
key_assumptions:
- DC turnover in healthy mouse spleen and mesenteric lymph nodes is representative,
  at the order-of-magnitude level, of immature cDC1/cDC2 death rates in human PDAC
  tumor and draining lymph node compartments.
- BrdU-labeled precursors supply new DCs rapidly relative to the DC lifespan, so the
  inflow of new DCs can be treated as fully labeled and the unlabeled fraction of
  mature DCs decays approximately exponentially.
- CD8+ DEC-205+ (cDC1-like) DCs turn over faster than CD8- DEC-205+ (cDC2-like) DCs
  by a factor of ~1.9x (Kamath2002). The nuisance parameter r_cDC1_turnover absorbs
  this subtype difference. Tissue-specific differences (spleen vs mesLN) are absorbed
  by observational noise. The QSP model uses a single k_APC_death for both subtypes.
- "Error bars in Figure 4 are treated as approximations to standard deviations rather\
  \ than standard errors; an effective sample size of 6 mice per time point is assumed\
  \ based on the reported range of 4\u20138 animals per group."
- Effects of microbial products or strong antigenic stimulation, which Kamath2002
  shows can further accelerate DC turnover, are neglected; we interpret the data as
  steady-state physiological baseline turnover.
key_study_limitations:
- The data are from healthy young adult C57BL/6 mice rather than from PDAC-bearing
  animals or human patients; inflammatory and tumor microenvironmental signals in
  PDAC may alter APC lifespans.
- DC subtypes are defined by murine markers (CD8, DEC-205) and include both resident
  and potentially migratory populations; mapping to human cDC1 and cDC2 is approximate.
- Spleen and mesenteric LN environments differ from desmoplastic PDAC tumors; tumor-resident
  DCs might experience additional death signals (e.g., hypoxia, cytokines) or survival
  cues not captured here.
- BrdU labeling and ethanol fixation could slightly perturb DC survival, and the computational
  background subtraction used by Kamath2002 may introduce small systematic biases
  in the estimated labeled fractions.
- Error bars from the figure were digitized and interpreted as SD; the original paper
  does not unambiguously state whether they represent SD or SEM, adding uncertainty
  to the variance estimates.
primary_data_source:
  pmid: '12200352'
  title: Developmental kinetics and lifespan of dendritic cells in mouse lymphoid
    organs
  authors:
  - Kamath AT
  - Henri S
  - Battye F
  - Tough DF
  - Shortman K
  year: 2002
  source_tag: Kamath2002
  source_relevance:
    indication_match: proxy
    indication_match_justification: The study examines dendritic cell turnover in
      healthy mouse spleen and lymph nodes, whereas the QSP model targets APC dynamics
      in human pancreatic ductal adenocarcinoma tumors and draining lymph nodes. We
      treat these healthy lymphoid-organ measurements as a mechanistic proxy for baseline
      APC death rates, acknowledging that PDAC-associated inflammation and desmoplasia
