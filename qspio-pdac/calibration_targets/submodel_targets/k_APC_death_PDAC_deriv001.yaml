calibration:
  parameters:
  - name: k_APC_death
    units: 1/day
    nuisance: false
  - name: r_cDC1_turnover
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 0.64
      sigma: 0.3
  forward_model:
    data_rationale: Kamath2002 measured BrdU-labeling kinetics of nondividing dendritic
      cell subtypes in spleen and mesenteric lymph nodes of healthy mice under continuous
      BrdU administration. In steady state, mature DCs are continually lost and replaced
      from BrdU-labeled precursors, so the fraction of unlabeled DCs decays approximately
      exponentially with an organ- and subtype-specific first-order turnover rate.
      CD8+ DEC-205+ DCs (cDC1-like) turn over ~1.9x faster than CD8- DEC-205+
      DCs (cDC2-like) across both tissues. A nuisance ratio parameter r_cDC1_turnover
      absorbs this subtype difference, allowing k_APC_death to represent the
      cDC2 baseline rate while cDC1 observables see k_APC_death * r_cDC1_turnover.
    submodel_rationale: In the QSP PDAC model, k_APC_death is the first-order death/removal
      rate constant for immature cDC1 and cDC2 in tumor and lymph node compartments,
      with matching source terms that maintain a homeostatic density. Under continuous
      labeling of upstream precursors, the same first-order death/turnover process
      governs the decay of the unlabeled DC fraction in lymphoid organs. The two
      state variables (U_cd8p, U_cd8m) track unlabeled fractions for each DC subtype
      independently, with k_APC_death * r_cDC1_turnover governing cDC1 decay and
      k_APC_death governing cDC2 decay.
    independent_variable:
      name: time
      units: day
      span:
      - 0.0
      - 7.0
    state_variables:
    - name: U_cd8p
      units: percent
      initial_condition:
        input_ref: Kamath02_unlabeled_initial_pct
        rationale: Before BrdU administration, essentially all CD8+ DCs are unlabeled.
    - name: U_cd8m
      units: percent
      initial_condition:
        input_ref: Kamath02_unlabeled_initial_pct
        rationale: Before BrdU administration, essentially all CD8- DCs are unlabeled.
    type: custom_ode
    code: "def ode(t, y, params, inputs):\n    U_cd8p, U_cd8m = y\n    k = params['k_APC_death']\n\
      \    r = params['r_cDC1_turnover']\n    dU_cd8p = -k * r * U_cd8p\n    dU_cd8m\
      \ = -k * U_cd8m\n    return [dU_cd8p, dU_cd8m]\n"
  error_model:
  - name: Kamath02_spleen_cd8p_t1_unlabeled
    observable:
      type: identity
      state_variables:
      - U_cd8p
    units: percent
    uses_inputs:
