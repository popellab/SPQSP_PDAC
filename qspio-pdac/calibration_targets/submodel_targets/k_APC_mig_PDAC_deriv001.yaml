calibration:
  parameters:
  - name: k_APC_mig
    units: 1/day
    nuisance: false
  - name: k_mAPC_death
    units: 1/day
    nuisance: false
  forward_model:
    data_rationale: Hayes2019 provides model-based estimates of dendritic cell migration
      rates from skin to draining lymph node and their half-life within the lymph
      node. We map the basal and peak alum/LPS-induced migration rates (mu0 and mu_alum_max)
      to a plausible bracket for APC migration from tumor to draining LN (k_APC_mig),
      and use the alum/LPS LN half-life to constrain the common DC loss rate k_mAPC_death.
    submodel_rationale: In the full QSPIO-PDAC model, k_APC_mig multiplies mature
      DC populations in the tumor compartment to drive their first-order migration
      to the draining LN, while k_mAPC_death controls first-order loss of mature DCs
      in both tumor and LN. Hayes2019 models DC egress from skin with a first-order
      per-cell rate mu(t) and DC loss from LN with a first-order rate deltaY. Identifying
      an effective constant mu_eff with k_APC_mig and deltaY with k_mAPC_death preserves
      the mechanistic role of these parameters as first-order migration and loss rates
      between tissue and LN, differing only in anatomical context (skin vs PDAC tumor).
    type: algebraic
    formula: k_APC_mig is identified with an effective first-order egress rate mu_eff
      for mature DCs/APCs leaving tissue for the draining lymph node; k_mAPC_death
      controls the first-order loss (death/egress) rate of migrated DCs in the lymph
      node via t_half = ln(2)/k_mAPC_death.
    code: "def compute(params, inputs):\n    import numpy as np\n    k_mig = params['k_APC_mig']\n\
      \    k_death = params['k_mAPC_death']\n    t_half_LN_alum = np.log(2.0) / k_death\n\
      \    return {\n        'k_APC_mig': k_mig,\n        't_half_LN_alum': t_half_LN_alum,\n\
      \    }\n"
  error_model:
  - name: k_APC_mig_bracket_Hayes2019
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['k_APC_mig']\n"
    units: 1/day
    uses_inputs:
    - k_APC_mig_lower_per_day
    - k_APC_mig_upper_per_day
    - n_effective_k_APC_mig
    sample_size_input: n_effective_k_APC_mig
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    L = inputs['k_APC_mig_lower_per_day']\n    U =\
      \ inputs['k_APC_mig_upper_per_day']\n    sigma_ln = (np.log(U) - np.log(L))\
      \ / (2.0 * 1.96)\n    mu_ln = (np.log(L) + np.log(U)) / 2.0\n    return rng.lognormal(mu_ln,\
      \ sigma_ln, n_bootstrap)\n"
    n_bootstrap: 10000
  - name: LN_half_life_alum_Hayes2019
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['t_half_LN_alum']\n"
    units: day
    uses_inputs:
    - t_half_LN_alum_low_day
    - t_half_LN_alum_high_day
    - n_effective_t_half
    sample_size_input: n_effective_t_half
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    L = inputs['t_half_LN_alum_low_day']\n    U = inputs['t_half_LN_alum_high_day']\n\
      \    sigma_ln = (np.log(U) - np.log(L)) / (2.0 * 1.96)\n    mu_ln = (np.log(L)\
      \ + np.log(U)) / 2.0\n    return rng.lognormal(mu_ln, sigma_ln, n_bootstrap)\n"
    n_bootstrap: 10000
  identifiability_notes: This algebraic submodel constrains k_APC_mig to lie within
    a broad lognormal band whose 95% interval is anchored between the basal DC migration
    rate from non-inflamed skin (mu0) and the peak rate under alum/LPS-induced inflammation
    (mu_alum_max) in Hayes2019. This reflects the expectation that intrinsic APC migration
    capacity from tumor lies between quiescent and maximally inflamed skin, with additional
    PDAC-specific modulation handled by H_pore_APC and cytokine Hill factors in the
    full QSP model. The same Hayes2019 model provides a relatively well-constrained
    half-life for migrated DCs in the LN under alum/LPS, which is mapped to t_half
    = ln(2)/k_mAPC_death, giving a direct constraint on k_mAPC_death. Because both
    observables are positive and treated with lognormal likelihoods derived from wide
    brackets, k_APC_mig and k_mAPC_death are individually identifiable but with substantial
    uncertainty dominated by cross-indication and cross-tissue translation. Correlation
    between them is weak in this target (they enter distinct observables), but they
    will correlate with other targets that use k_mAPC_death or APC migration-dependent
    quantities.
experimental_context:
  species: mouse
  system: animal_in_vivo
  cell_types:
  - name: conventional dendritic cells (skin-derived)
    phenotype: CD11c+ MHCII+ migratory DCs from mouse footpad skin
    isolation_method: Endogenous DCs tracked in situ using Kaede photo-convertible
      reporter and enzymatic tissue digestion
    source: Footpad skin and draining popliteal lymph node of Kaede transgenic mice
      after alum/LPS or saline injection
  indication: acute skin inflammation induced by alum/LPS (vaccine adjuvant)
study_interpretation: Hayes2019 used Kaede transgenic mice and mathematical modeling
  to quantify dendritic cell migration from injected skin to the draining popliteal
  lymph node. Their best-fitting model yields a basal skin residence time of approximately
  5.5 days (mu0 around 0.18 day^-1), a peak migration rate under alum/LPS of approximately
  1.7 day^-1 (9.5-fold amplification over basal), and a lymph node half-life of approximately
  9.5 h under alum/LPS. We interpret mu0 and mu_alum_max as lower and upper bounds
  on the intrinsic first-order migration rate of mature APCs from peripheral tissue
  to draining LN, and use their geometric span to define a broad lognormal constraint
  on k_APC_mig. The LN half-life under alum/LPS is mapped to t_half = ln(2)/k_mAPC_death,
  providing a direct estimate of the APC loss rate in the LN that is reused in the
  PDAC QSP model. Although the anatomical site (skin) and inflammatory stimulus (alum/LPS)
  differ from PDAC, the basic lymphatic trafficking and LN residence processes are
  conserved, making these data informative upper bounds on APC trafficking kinetics
  that are subsequently modulated by PDAC-specific factors such as desmoplastic stroma
  (H_pore_APC) and immunosuppressive cytokines.
key_assumptions:
- Dendritic cell migration from skin to draining lymph node in Hayes2019 is mechanistically
  similar to migration of mature APCs from PDAC tumor to tumor-draining LN, differing
  mainly in magnitude due to tissue architecture and inflammatory milieu.
- The basal migration rate from non-inflamed skin (mu0) and the peak rate under alum/LPS
  (mu_alum_max) bracket the plausible intrinsic range of APC migration rates relevant
  for PDAC; k_APC_mig is assumed to lie between these values with a lognormal spread.
- PDAC tumors are chronically inflamed but embedded in dense desmoplastic stroma;
  intrinsic APC motility is closer to alum/LPS-activated DCs, while effective migration
  is further reduced in the full QSP model by H_pore_APC and inhibitory cytokine Hill
  terms.
- The lymph node half-life of migrated DCs under alum/LPS (9.5 h) in Hayes2019 is
  representative of mature APC survival/loss in human PDAC-draining LNs and can be
  mapped directly to k_mAPC_death via first-order kinetics.
- Context-specific variability between mouse skin and human PDAC TME (for example,
  chemokine gradients and vascularity) is captured as increased observational uncertainty
  via broad lognormal likelihoods rather than explicit rescaling of rate constants.
- cDC1 and cDC2 subsets in the PDAC model share the same migration and loss rate parameters
  (k_APC_mig, k_mAPC_death) as the bulk CD11c+MHCII+ migratory DC population modeled
  in Hayes2019.
key_study_limitations:
- The study is performed in mouse footpad skin with acute alum/LPS-induced inflammation
  rather than in pancreatic tumors or PDAC patients, so both tissue architecture and
  inflammatory context differ substantially from the PDAC tumor microenvironment.
- Hayes2019 reports parameter estimates from a phenomenological two-compartment model
  fit to Kaede tracking data; migration and loss rates are not measured directly but
  inferred, and confidence intervals rely on model assumptions.
- The alum/LPS stimulus produces a transient, strong inflammatory response with peak
  DC migration around 26 h post-challenge, whereas PDAC represents chronic, often
  immunosuppressed inflammation; extrapolating from acute skin to chronic tumor adds
  translation uncertainty.
- The mathematical model assumes a fixed transit time between skin and LN and homogeneous
  first-order kinetics across DC subsets, whereas the QSP model distinguishes cDC1
  and cDC2 and includes additional regulation by cytokines and ECM, which are not
  resolved in Hayes2019.
- Species differences (mouse to human) and anatomical differences (footpad skin to
  pancreas and its draining LNs) may alter absolute trafficking rates, even if qualitative
  kinetics are conserved.
primary_data_source:
  doi: 10.3389/fimmu.2019.00598
  title: Spatiotemporal Modeling of the Key Migratory Events During the Initiation
    of Adaptive Immunity
  authors:
  - Hayes
  - Rane
  - Scales
  - Meehan
  - Benson
  - Maroof
  - Schroeder
  - Tomura
  - Gozzard
  - Yates
  - Garside
  - Brewer
  year: 2019
  source_tag: Hayes2019
  source_relevance:
    indication_match: proxy
    indication_match_justification: The source study investigates dendritic cell migration
      from mouse skin to draining lymph nodes during acute alum/LPS-induced inflammation,
      whereas the QSP target is APC migration from pancreatic ductal adenocarcinoma
      (PDAC) tumors to tumor-draining lymph nodes. Both contexts involve CCR7-driven
      migration of mature DCs through afferent lymphatics to regional LNs, but differ
      in tissue architecture, chronicity of inflammation, and tumor-specific immunosuppression.
      We therefore treat Hayes2019 as a mechanistic proxy providing upper and lower
      bounds on APC migration rates rather than a direct PDAC measurement.
    species_source: mouse
    species_target: human
    source_quality: primary_animal_in_vivo
    perturbation_type: pharmacological
    perturbation_relevance: Alum/LPS is a strong adjuvant combination that induces
      acute local inflammation and robust DC maturation and migration, likely yielding
      near-maximal physiological migration rates. These values are interpreted as
      upper bounds on intrinsic APC migration capability; effective migration in PDAC
      is expected to be lower due to stromal barriers and immunosuppression and is
      handled via uncertainty and additional inhibitory terms in the full model.
    tme_compatibility: low
    tme_compatibility_notes: Mouse footpad skin under alum/LPS challenge has a relatively
      loose extracellular matrix and is highly permissive to leukocyte trafficking,
      whereas human PDAC is characterized by dense desmoplastic stroma, abnormal vasculature,
      and layered immunosuppression. As a result, absolute APC migration rates inferred
      from Hayes2019 likely overestimate rates in PDAC by up to an order of magnitude;
      this is reflected by using the basal and peak skin migration rates only as a
      broad bracket for k_APC_mig and by assigning wide lognormal uncertainty.
    measurement_directness: single_inversion
    temporal_resolution: timecourse
    experimental_system: animal_in_vivo
