calibration:
  parameters:
  - name: TGFb_50
    units: nanomolarity
    nuisance: false
  - name: Foxp3_baseline
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: -3.2
      sigma: 0.7
  - name: Foxp3_max
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: -0.3
      sigma: 0.7
  forward_model:
    data_rationale: Chen2003 Figure 4D reports a graded TGF-beta1 dose-response for
      Foxp3/HPRT mRNA expression in murine CD4+CD25- naive T cells stimulated with
      anti-CD3 plus anti-CD28. The relationship between TGF-beta concentration and
      normalized Foxp3 expression is naturally described by a sigmoidal Hill-type
      curve, enabling estimation of the half-maximal effective concentration (EC50).
    submodel_rationale: In the QSPIO-PDAC model, TGFb_50 controls the sensitivity
      of TGF-beta-mediated differentiation of Th cells into Tregs and polarization
      of M1 to M2 macrophages via Hill fractions of the form TGFb/(TGFb+TGFb_50).
      The direct_fit Hill model uses the same EC50 structure (ec50 = TGFb_50) to map
      extracellular TGF-beta concentration to Foxp3 induction, providing a mechanistically
      consistent estimate of TGFb_50 from T cell differentiation data.
    type: direct_fit
    curve: hill
    ec50: TGFb_50
    n_hill: '1.0'
    baseline: Foxp3_baseline
    maximum: Foxp3_max
    intercept: '0.0'
  error_model:
  - name: Foxp3_TGFb0
    units: dimensionless
    uses_inputs:
    - Chen2003_Foxp3_rel_expr_TGFb0
    - Chen2003_n_observations_Foxp3
    x_input: Chen2003_TGFb_dose0_nM
    sample_size_input: Chen2003_n_observations_Foxp3
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['Chen2003_Foxp3_rel_expr_TGFb0']\n\
      \    return np.full(n_bootstrap, mean)\n"
    n_bootstrap: 10000
  - name: Foxp3_TGFb0p02
    units: dimensionless
    uses_inputs:
    - Chen2003_Foxp3_rel_expr_TGFb0p02
    - Chen2003_n_observations_Foxp3
    x_input: Chen2003_TGFb_dose1_nM
    sample_size_input: Chen2003_n_observations_Foxp3
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['Chen2003_Foxp3_rel_expr_TGFb0p02']\n\
      \    return np.full(n_bootstrap, mean)\n"
    n_bootstrap: 10000
  - name: Foxp3_TGFb0p2
    units: dimensionless
    uses_inputs:
    - Chen2003_Foxp3_rel_expr_TGFb0p2
    - Chen2003_n_observations_Foxp3
    x_input: Chen2003_TGFb_dose2_nM
    sample_size_input: Chen2003_n_observations_Foxp3
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['Chen2003_Foxp3_rel_expr_TGFb0p2']\n\
      \    return np.full(n_bootstrap, mean)\n"
    n_bootstrap: 10000
  - name: Foxp3_TGFb2
    units: dimensionless
    uses_inputs:
    - Chen2003_Foxp3_rel_expr_TGFb2
    - Chen2003_n_observations_Foxp3
    x_input: Chen2003_TGFb_dose3_nM
    sample_size_input: Chen2003_n_observations_Foxp3
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['Chen2003_Foxp3_rel_expr_TGFb2']\n\
      \    return np.full(n_bootstrap, mean)\n"
    n_bootstrap: 10000
  - name: Foxp3_TGFb20
    units: dimensionless
    uses_inputs:
    - Chen2003_Foxp3_rel_expr_TGFb20
    - Chen2003_n_observations_Foxp3
    x_input: Chen2003_TGFb_dose4_nM
    sample_size_input: Chen2003_n_observations_Foxp3
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['Chen2003_Foxp3_rel_expr_TGFb20']\n\
      \    return np.full(n_bootstrap, mean)\n"
    n_bootstrap: 10000
  identifiability_notes: "The Hill-type direct_fit model uses five data points (Foxp3/HPRT\
    \ at 0, 0.0008, 0.008, 0.08, and 0.8 nM TGF-beta1) to constrain three parameters:\
    \ TGFb_50 (shared with the full QSP model) and two nuisance parameters (Foxp3_baseline,\
    \ Foxp3_max). Hill coefficient is fixed at 1.0 (single TGFbRII binding site, no\
    \ cooperativity). The EC50 is primarily constrained by the strong increase between\
    \ 0.0008 and 0.08 nM and the near-plateau at 0.08\u20130.8 nM. No replicate-level\
    \ uncertainty is reported; observation noise is handled by translation sigma in\
    \ the inference framework."
experimental_context:
  species: mouse
  system: in_vitro_primary_cells
  cell_types:
  - name: CD4+CD25- naive T cells
    phenotype: Splenic CD4+CD25- naive/responder T cells
    isolation_method: Negative selection on CD4+ T cell columns followed by depletion
      of CD25+ cells using anti-CD25 antibody and cell sorting
    source: Spleens of normal C57BL/6 mice
  culture_conditions:
    substrate: Tissue culture plastic
    serum_concentration: 10.0
    serum_concentration_units: '% FBS'
    oxygen_level: normoxic
    culture_type: 2d_monolayer
    medium: Complete DMEM with 10% FBS
    supplements: Stimulation with platebound anti-CD3 and soluble anti-CD28 in the
      presence or absence of recombinant human TGF-beta1
    duration: Foxp3 expression measured after 3 days of stimulation in most experiments;
      dose-response panel reflects 72 h culture
    notes: Cultures performed at 37 degC and 5% CO2 as described in Materials and
      Methods.
  indication: General T cell immunoregulation; no tumor present
study_interpretation: "Chen2003 demonstrates that costimulation of murine CD4+CD25-\
  \ naive T cells with TCR (anti-CD3 plus anti-CD28) and TGF-beta1 induces Foxp3 expression\
  \ in a graded, dose-dependent manner, converting them toward a CD4+CD25+ anergic/suppressor\
  \ phenotype. The digitized Foxp3/HPRT dose-response (0\u201320 ng/ml TGF-beta1)\
  \ can be fit with a Hill curve to estimate the half-maximal TGF-beta concentration\
  \ required for Foxp3 induction, providing a mechanistically relevant EC50 scale\
  \ for TGFb_50 in the PDAC QSP model, which governs TGF-beta-dependent Th-to-Treg\
  \ differentiation and, by extension, contributes to immunosuppressive programming\
  \ such as M1-to-M2 polarization."
key_assumptions:
- Foxp3/HPRT mRNA ratio is taken as a proxy for the fraction of CD4+ T cells committing
  to a Treg-like regulatory phenotype under TGF-beta1 stimulation, allowing its use
  as a Hill-type readout for Th-to-Treg differentiation.
- The molecular weight of active TGF-beta1 is approximated as 25 kDa (dimer), so that
  1 ng/ml corresponds to approximately 0.04 nM; this conversion is used to express
  TGFb_50 in nanomolar units consistent with the QSP model.
- Because Chen2003 does not report replicate-level SD/SEM for Figure 4D, a variability
  factor of 0.3 is introduced (as input Chen2003_Foxp3_rel_expr_varfactor) in the
  error model to represent typical coefficient of variation in qRT-PCR-based relative
  expression, and each digitized bar is treated as a single composite observation
  (n=1).
- The TGF-beta sensitivity of murine splenic CD4+CD25- naive T cells in vitro is assumed
  to be broadly representative of human Th-to-Treg differentiation sensitivity in
  the PDAC tumor-draining lymph node and tumor microenvironment, after accounting
  for translation uncertainty in later stages.
- The same EC50 scale for TGF-beta signaling that drives Foxp3 induction in naive
  CD4 T cells is assumed to be informative for TGF-beta-mediated polarization of macrophages
  (M1 to M2) in the QSP model, although cell-type differences may shift the exact
  effective concentration.
key_study_limitations:
- The experiment uses murine C57BL/6 CD4+CD25- naive splenic T cells in vitro, whereas
  the QSP model targets human PDAC T cells and macrophages in vivo; species and context
  differences may shift the true TGF-beta EC50.
- Foxp3/HPRT is a relative mRNA expression measure in bulk CD4+ T cells, not a direct
  fraction of Foxp3+ cells or functional suppression readout, so mapping from expression
  level to effective Treg fraction is approximate.
- Figure 4D provides only a single bar per dose without explicit SD/SEM values, requiring
  an introduced variability factor to construct an uncertainty model.
- TGF-beta1 is provided as recombinant cytokine at discrete doses under strong TCR
  stimulation with anti-CD3 plus anti-CD28, which may not fully capture the complex
  presentation and activation of latent TGF-beta in the PDAC tumor microenvironment.
- The calibrated TGFb_50 from T cell data may not perfectly match the optimal EC50
  for macrophage polarization, so this target should be interpreted as primarily constraining
  the Th-to-Treg differentiation component of TGFb_50, with macrophage-focused data
  used later for validation or adjustment.
primary_data_source:
  doi: 10.1084/jem.20030152
  title: Conversion of Peripheral CD4+CD25- Naive T Cells to CD4+CD25+ Regulatory
    T Cells by TGF-beta Induction of Transcription Factor Foxp3
  authors:
  - WanJun Chen
  - Wenwen Jin
  - Neil Hardegen
  - Ke-jian Lei
  - Li Li
  - Nancy Marinos
  - George McGrady
  - Sharon M. Wahl
  year: 2003
  source_tag: Chen2003
  source_relevance:
    indication_match: proxy
    indication_match_justification: The study investigates TGF-beta1-driven Foxp3
      induction and acquisition of a regulatory phenotype in murine splenic CD4+CD25-
      naive T cells under anti-CD3/anti-CD28 stimulation, whereas the QSPIO-PDAC model
      represents human pancreatic ductal adenocarcinoma, where TGF-beta modulates
      Th-to-Treg differentiation and M1-to-M2 macrophage polarization in the tumor
      microenvironment. Although both contexts involve TGF-beta-dependent immunoregulation
      of CD4 T cells, there is no direct PDAC tumor present and species differ, so
      the data serve as a mechanistic proxy rather than an exact indication match.
    species_source: mouse
    species_target: human
    source_quality: primary_animal_in_vitro
    perturbation_type: pharmacological
    perturbation_relevance: "Recombinant human TGF-beta1 is added exogenously at graded\
      \ concentrations (0.02\u201320 ng/ml) to strongly TCR-stimulated murine CD4+CD25-\
      \ naive T cells, creating a controlled pharmacologic dose-response for Foxp3\
      \ induction. These conditions likely span from subphysiologic to supraphysiologic\
      \ TGF-beta exposure, so the inferred EC50 should be interpreted as an intrinsic\
      \ sensitivity of the TGF-beta/Foxp3 pathway rather than an in situ concentration\
      \ in PDAC tumors."
    tme_compatibility: low
    tme_compatibility_notes: Experiments are performed in simple 2D culture of splenic
      naive CD4+ T cells activated with anti-CD3 and anti-CD28, without tumor cells,
      stromal cells, myeloid cells, or extracellular matrix. The PDAC tumor microenvironment
      is highly desmoplastic, immunosuppressive, and spatially structured, with latent
      TGF-beta activation and complex cytokine networks. As a result, the absolute
      TGF-beta concentration experienced by T cells and macrophages in PDAC may differ
      substantially from the in vitro doses used here, and translation uncertainty
      of at least an order of magnitude should be expected.
    measurement_directness: direct
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: in_vitro_primary
    validation_warnings: []
