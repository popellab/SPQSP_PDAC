study_interpretation: 'Rubiano et al. 2018 measured steady-state modulus (SSM) of resected human pancreatic

  tissue by mesoscale indentation. Normal pancreas SSM was 1.06 +/- 0.25 kPa (mean +/- SD,

  Fig 6A). The model parameter E_ref represents tissue stiffness at the reference collagen

  volume fraction phi_col_ref (normal pancreas). Since E_ref is defined as the stiffness

  at the reference state, normal pancreas SSM directly constrains E_ref via identity.

  '
key_assumptions:
- 'Normal pancreas SSM (1.06 kPa) corresponds to the model''s reference stiffness E_ref.

  E_ref is dimensionless in the model but scaled to kPa (1.0 dimensionless = 1.0 kPa).

  '
- 'The reported SD (0.25 kPa) represents inter-patient variability across the normal

  tissue samples, not measurement error.

  '
- '"Normal" tissue was histologically confirmed absent of pancreatitis or malignancy,

  though it was resected from patients undergoing surgery for pancreatic conditions.

  '
key_study_limitations:
- 'Normal tissue was obtained adjacent to pathology during surgery. Proximity to disease

  may cause subclinical changes in tissue mechanics.

  '
- 'Custom cantilever-based indenter with Hertz contact model. Different indentation methods

  yield systematically different moduli (Fig 1 shows 3 orders of magnitude variation).

  '
- 'Limited sample size (approximately 8 patients based on Fig 6A scatter points).

  '
