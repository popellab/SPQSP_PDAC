calibration:
  parameters:
  - name: E_ref
    units: dimensionless
  forward_model:
    type: algebraic
    formula: E_ref_kPa = E_ref (identity, dimensionless kPa-scaled)
    data_rationale: 'Normal pancreas SSM directly measures the tissue stiffness at the reference

      collagen volume fraction. Since E_ref is defined as stiffness at phi_col_ref

      (normal pancreas), this is a direct identity constraint.

      '
    submodel_rationale: 'E_ref appears in stiffness = E_ref * (phi_collagen / phi_col_ref)^n_stiff.

      At phi = phi_col_ref (normal pancreas), stiffness = E_ref. The parameter is

      dimensionless but kPa-scaled (1.0 = 1.0 kPa).

      '
    code: "def compute(params, inputs):\n    return params['E_ref']\n"
  error_model:
  - name: ssm_normal_tissue
    units: kilopascal
    uses_inputs:
    - ssm_normal_mean
    - ssm_normal_sd
    - n_normal
    sample_size_input: n_normal
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean_ssm\
      \ = inputs['ssm_normal_mean']\n    sd = inputs['ssm_normal_sd']\n    cv = sd / mean_ssm\n    sigma_ln = np.sqrt(np.log(1\
      \ + cv**2))\n    mu_ln = np.log(mean_ssm) - sigma_ln**2 / 2\n    return rng.lognormal(mu_ln, sigma_ln, size=n_bootstrap)\n"
  identifiability_notes: 'E_ref is uniquely identified from normal pancreas SSM via identity. The only

    uncertainty is inter-patient variability (SD 0.25 kPa on mean 1.06 kPa, CV=24%)

    and systematic measurement bias from the Hertz contact model assumptions.

    '
