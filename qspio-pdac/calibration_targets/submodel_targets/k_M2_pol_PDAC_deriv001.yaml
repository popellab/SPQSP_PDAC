target_id: k_M2_pol
inputs:
- name: n_donors_unuvarpurcu2022
  value: 3.0
  units: dimensionless
  input_type: direct_measurement
  source_ref: UnuvarPurcu2022
  source_location: Figure legends (Fig. 1, Fig. 2, Fig. 3, S4)
  value_snippet: "are mean \xB1 SEM of biological replicates of 3 independent donors."
- name: n_effective_unuvarpurcu2022
  value: 1.0
  units: dimensionless
  input_type: reference_value
  rationale: Error bars in UnuvarPurcu2022 are reported as mean +/- SEM over n = 3
    donors, and the per-readout rel_error inputs are computed as (mean+error -
    mean)/mean = SEM/mean. The error model uses these relative SEM magnitudes
    directly to build sigma_ln for the bootstrap distribution of the mean, so
    sample_size is set to 1 to avoid a second sqrt(n) division that would
    double-count the n_donors averaging. True between-donor SDs would be a
    factor of sqrt(n_donors) wider than the digitized SEMs and are carried by
    translation_sigma during joint calibration rather than imputed here.
  source_ref: UnuvarPurcu2022
  source_location: Error-model choice; see identifiability_notes.
