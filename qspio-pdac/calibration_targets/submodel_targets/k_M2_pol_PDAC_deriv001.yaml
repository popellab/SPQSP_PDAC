    data_rationale: "UnuvarPurcu2022 reports time courses of IL-10\u2013driven M2c\
      \ polarization markers (IL-10 and CD163 mRNA, CD163 surface expression, and\
      \ IL-10/TGFbeta secretion) in human monocyte-derived macrophages over 0\u2013\
      72 h. Under saturating IL-10, the fraction of macrophages that have polarized\
      \ to an M2c-like state is expected to increase monotonically toward a plateau\
      \ on a characteristic 24\u201348 h timescale, consistent with a first-order\
      \ approach to saturation."
    submodel_rationale: In the full QSP model, k_M2_pol multiplies the Mac_M1->Mac_M2
      transition rate under cytokine drive via a gating term that approaches unity
      for saturating IL-10/TGFbeta and absent IL-6. In the IL-10 polarization experiments
      of UnuvarPurcu2022, IL-10 is applied at a high, constant dose and IL-6 is not
      added, so the effective gating term is approximately 1. The fraction of macrophages
      in the M2c-like state therefore follows f_M2c(t) = 1 - exp(-k_M2_pol * t) when
      recruitment and death are negligible. Modeling a single dimensionless state
      variable with dy/dt = k_M2_pol * (1 - y) and y(0)=0 reproduces this mechanistic
      usage while remaining a valid reduction of the Mac_M1->Mac_M2 reaction.
    independent_variable:
      name: time
      units: day
      span:
      - 0.0
      - 3.0
    state_variables:
    - name: f_M2c
      units: dimensionless
      initial_condition:
        value: 0.0
        rationale: Cultures are differentiated with M-CSF but not pre-polarized to
          M2c before IL-10 addition, so the initial fraction of M2c-like macrophages
          is approximated as zero.
    type: saturation
    rate_constant: k_M2_pol
