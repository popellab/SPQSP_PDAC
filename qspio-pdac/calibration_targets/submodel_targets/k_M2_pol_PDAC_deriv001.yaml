  identifiability_notes: "This target infers a single rate constant k_M2_pol from\
    \ multiple normalized readouts of IL-10\u2013driven M2c polarization (IL-10 and\
    \ CD163 mRNA, CD163 surface expression, and IL-10/TGFbeta secretion) measured\
    \ in the same experimental system. All observables are mapped to the same latent\
    \ fraction of M2c-like macrophages, modeled as a first-order approach to saturation\
    \ with time constant 1/k_M2_pol. The forward model constrains f_M2c(t) \u2264\
    \ 1, but several readouts overshoot the 72 h reference at 24 h (notably CD163\
    \ mRNA norm \u2248 1.32 and CD163 MFI norm \u2248 1.18); these overshoots and\
    \ marker-specific transcriptional/translational delays cannot be reproduced by\
    \ the one-state first-order model and will be absorbed into the residuals. The\
    \ fitted k_M2_pol should therefore be interpreted as an effective compromise\
    \ polarization timescale rather than a detailed transcriptional kinetic\
    \ parameter. Error bars in UnuvarPurcu2022 are reported as mean +/- SEM over\
    \ n = 3 donors; the per-readout rel_error inputs encode SEM/mean on the mean,\
    \ and the error model uses sample_size = 1 so sigma_ln is not further divided\
    \ by sqrt(n_donors) (which would double-count the averaging and artificially\
    \ tighten this target). Between-donor biological variability beyond the SEM\
    \ and the in vitro-to-PDAC gap are carried by translation_sigma rather than\
    \ imputed here. The parameter is reasonably well-identified because the data\
    \ span from near-baseline (24 h for IL-10/TGFbeta) to near-plateau (48\u2013\
    72 h) over a 3-day window. No additional QSP parameters are included, so this\
    \ target constrains only the magnitude of k_M2_pol under saturating\
    \ IL-10/TGFbeta-like drive; its value under weaker or fluctuating cytokine\
    \ conditions is set by the full QSP gating functions."
experimental_context:
  species: human
  system: in_vitro_primary_cells
  cell_types:
  - name: monocyte-derived macrophage
    phenotype: M0 at baseline, polarized to M2c with IL-10
    isolation_method: Peripheral blood monocytes isolated from healthy donors and
      differentiated with M-CSF
    source: Peripheral blood from healthy human donors
  culture_conditions:
    substrate: standard tissue culture plastic
    serum_concentration: 10.0
    serum_concentration_units: percent
    oxygen_level: normoxic
    culture_type: 2d_monolayer
    medium: RPMI-1640 or similar with 10% FBS and M-CSF during differentiation
    supplements: IL-10 (20 ng/mL) added at t = 0 h to induce M2c polarization
    duration: "7 days differentiation with M-CSF followed by 0\u201372 h IL-10 polarization"
    notes: No exogenous IL-6 or TGFbeta was added; TGFbeta arises from macrophage
      secretion over time.
  indication: pancreatic ductal adenocarcinoma
study_interpretation: "Time courses of IL-10\u2013driven M2c polarization in human\
  \ monocyte-derived macrophages provide a mechanistically relevant proxy for the\
  \ Mac_M1->Mac_M2 transition in the PDAC QSP model under strong IL-10/TGFbeta drive.\
  \ The observed 24\u201348 h window for near-maximal upregulation of CD163 and accumulation\
  \ of IL-10/TGFbeta secretion supports an effective first-order polarization rate\
  \ constant k_M2_pol on the order of 0.5\u20131 /day, faster than the current prior\
  \ median of 0.1 /day but still within an order of magnitude. Normalizing multiple\
  \ markers to a common 0\u20131 scale and fitting them to a shared first-order saturation\
  \ model ties k_M2_pol directly to the experimentally observed timescale of acquiring\
  \ an M2c/TAM-like phenotype."
key_assumptions:
- M0-to-M2c polarization kinetics under saturating IL-10 approximate the kinetics
  of Mac_M1-to-Mac_M2 polarization under maximal IL-10/TGFbeta drive in PDAC tumors.
- "Macrophage recruitment and death are negligible over the 0\u201372 h in vitro polarization\
  \ window, so changes in marker expression primarily reflect state transitions rather\
  \ than changes in total macrophage number."
- Normalized IL-10 and CD163 mRNA, CD163 surface MFI, and IL-10/TGFbeta secretion
  are proportional (up to noise and modest delays) to the underlying fraction of M2c-like
  macrophages.
- The IL-10 concentration used in vitro is sufficiently high that the QSP gating term
  for IL-10/TGFbeta-driven M2 polarization is effectively saturated (value ~1), so
  the measured timescale maps directly to k_M2_pol.
- "Error bars in UnuvarPurcu2022 represent SEM; relative errors estimated from a representative\
  \ time point per marker are treated as applicable across the 24\u201372 h window.\
  \ The tip-to-mean rel_error is used directly as the relative SEM on the bootstrap\
  \ mean with sample_size = 1, to avoid double-dividing by sqrt(n_donors); broader\
  \ between-donor variability is carried by translation_sigma."
- "Markers exhibit distinct temporal patterns (CD163 mRNA and CD163 MFI overshoot\
  \ the 72 h reference at 24 h, IL-10/TGFbeta secretion lag behind mRNA), and the\
  \ one-state first-order forward model cannot reproduce overshoots or reconcile\
  \ marker-specific delays; these are absorbed as residuals and k_M2_pol is\
  \ interpreted as an effective ensemble polarization timescale rather than a\
  \ marker-specific rate."
key_study_limitations:
- The experiments measure M0-to-M2c polarization rather than explicit M1-to-M2 transitions,
  so context-dependent differences in plasticity after prior M1 activation are not
  captured.
- Cytokine stimulation occurs in a simplified 2D culture without stromal or tumor
  signals, whereas PDAC TAMs experience a complex, desmoplastic microenvironment that
  may slow polarization.
- Different markers exhibit distinct temporal patterns (e.g., CD163 mRNA overshoot),
  so a single first-order rate cannot perfectly capture all readouts; the inferred
  k_M2_pol should be interpreted as an effective timescale.
- The IL-10 dose is pharmacologically high and constant, potentially representing
  an upper bound on polarization speed compared with in vivo cytokine exposures.
- "Sample size is modest (n\u22483 donors), and digitization of figure-based data\
  \ introduces additional uncertainty in exact mean and SEM values."
primary_data_source:
  doi: 10.1371/journal.pone.0265196
  year: 2022
  source_tag: UnuvarPurcu2022
  source_relevance:
    indication_match: proxy
    indication_match_justification: The study uses human monocyte-derived macrophages
      from healthy donors polarized to M2c with IL-10 in vitro, whereas the target
      model describes tumor-associated macrophages in human PDAC. M2c macrophages
      share key IL-10/TGFbeta-driven, immunosuppressive features with PDAC TAMs, so
      their polarization kinetics provide a mechanistic proxy but not a disease-matched
      measurement.
    species_source: human
    species_target: human
    source_quality: primary_human_in_vitro
    perturbation_type: pharmacological
    perturbation_relevance: Macrophages are exposed to a high, constant concentration
      of exogenous IL-10, which likely produces near-maximal M2c polarization rates.
      As such, the inferred k_M2_pol should be interpreted as an upper bound on polarization
      speed under strong IL-10/TGFbeta drive and may overestimate rates under physiological
      cytokine levels in PDAC.
    tme_compatibility: moderate
    tme_compatibility_notes: The in vitro system lacks the dense desmoplastic stroma,
      hypoxia, and complex cytokine milieu of PDAC tumors, but it does capture direct
      IL-10/TGFbeta-like signaling to human macrophages. The absence of competing
      pro-inflammatory cues and stromal barriers likely makes polarization somewhat
      faster than in vivo, introducing moderate translation uncertainty.
    measurement_directness: single_inversion
    temporal_resolution: timecourse
    experimental_system: in_vitro_primary
