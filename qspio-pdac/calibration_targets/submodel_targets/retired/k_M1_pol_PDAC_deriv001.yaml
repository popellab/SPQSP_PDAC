target_id: k_M1_pol_k_M2_pol_ratio_Gu2023_PDAC_IHC

tags:
- ai-generated
- macrophage-module

extraction_model: claude-opus-4-6

study_interpretation: |
  Gu et al. (2023) performed immunohistochemistry for CD86 (M1 marker) and
  CD163 (M2 marker) on 42 primary PDAC tumors. Medians and ranges of positive
  cell counts per high-power field (x400) were reported: CD86+ median 11.6
  (range 2-31.2), CD163+ median 27.1 (range 7.6-38.2). The M2:M1 ratio of
  ~2.3 constrains the balance of polarization rates k_M2_pol and k_M1_pol in
  the QSP model at the pathological steady state. Using the ratio eliminates
  the need to convert HPF counts to volumetric densities.

key_assumptions:
- |
  CD86+ cells represent M1-like macrophages and CD163+ cells represent M2-like
  macrophages, consistent with the Mac_M1 and Mac_M2 compartments in the QSP
  model.
- |
  Primary PDAC tumors at surgical resection approximate a quasi-steady state
  for macrophage polarization, so the observed M2:M1 ratio reflects the
  equilibrium set by polarization, recruitment, and death rates.
- |
  At steady state, the M2:M1 ratio is primarily governed by the effective
  polarization rates (k_M2_pol * H_anti_inflammatory) / (k_M1_pol *
  H_pro_inflammatory), with recruitment and death rates affecting both
  subtypes. The model recruits only M1, so k_Mac_rec enters the denominator.
- |
  The cytokine-dependent Hill function terms (TGFb, IL-10, IL-6 for M1->M2;
  IL-12, IFNg for M2->M1) are at their pathological PDAC steady-state values,
  which are treated as nuisance parameters representing the immunosuppressive
  TME.

key_study_limitations:
- |
  Medians and ranges are reported rather than means and SDs. We bootstrap
  from the range endpoints and median to approximate the patient-level
  distribution.
- |
  CD86 and CD163 are imperfectly specific for M1/M2 phenotypes. Some
  macrophages may co-express both markers or fall outside this binary
  classification.
- |
  Counts are from five representative x100 spots per slide with x400 HPF
  counting, which may over-represent macrophage-rich regions.
- |
  Single-center Chinese cohort (n=42 primary tumors) may not fully capture
  global PDAC heterogeneity.
- |
  Cross-sectional at resection; does not capture temporal dynamics.

