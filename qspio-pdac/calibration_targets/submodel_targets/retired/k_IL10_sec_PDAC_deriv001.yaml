  units: dimensionless
  input_type: direct_measurement
  source_ref: Katakura2004
  source_location: Methods, Determination of soluble factors from AAMphi
  value_snippet: "AAMphi were cultured at the cell density of 1 \xD7 10^6 cells/ml\
    \ for 24"
- name: AAM_cell_density_per_mL
  value: 1000000.0
  units: cell/mL
  input_type: derived_arithmetic
  rationale: "Convert the reported density of 1 \xD7 10^6 cells/ml into an explicit\
    \ numeric cell density by raising 10 to the reported exponent."
  source_ref: Katakura2004
  source_location: Methods, Determination of soluble factors from AAMphi
  source_inputs:
  - AAM_cell_density_exponent
  formula: 10 ** AAM_cell_density_exponent
- name: AAM_incubation_time_hr
  value: 24.0
  units: hour
  input_type: direct_measurement
  source_ref: Katakura2004
  source_location: Results, Fig. 2 legend and Methods, Determination of soluble factors
    from AAMphi
  value_snippet: "AAMphi were cultured without any stimulation for 24\u201348 h, and\
    \ the culture fluids harvested were assayed for IL-10 using ELISA."
- name: IL10_AAM_24h_mean_ng_per_mL
  value: 0.6
  units: ng/mL
  input_type: direct_measurement
  source_ref: Katakura2004
  source_location: Results, Fig. 2F
  figure_excerpt:
    figure_id: Figure 2F
    value: ~0.6
    description: "IL-10 concentration in culture supernatants from AAMphi at 24 h\
