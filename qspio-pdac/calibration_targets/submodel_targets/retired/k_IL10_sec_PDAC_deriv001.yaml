- name: n_replicates_IL10_AAM
  value: 3.0
  units: dimensionless
  input_type: reference_value
  rationale: "Sample size for ELISA cultures is not explicitly stated, but immunology\
    \ experiments in this paper are typically performed in triplicate; we take n=3\
