      weight for unit conversion. While not specific to PDAC, the molecular mass of
      IFN-gamma is invariant across indications, so this serves as a generic biophysical
      reference.
    species_source: human
    species_target: human
    source_quality: textbook
    perturbation_type: physiological_baseline
    perturbation_relevance: The molecular weight reported reflects the native cytokine
      and is not tied to any particular perturbation; it is used only for stoichiometric
      unit conversion.
    tme_compatibility: high
    tme_compatibility_notes: The molecular weight of interferon-gamma is a fundamental
      biochemical property and does not depend on the tumor microenvironment; thus,
      TME compatibility is effectively complete for the purpose of unit conversion.
    measurement_directness: direct
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: in_vitro_cell_line
