target_id: n_CD4_clones
inputs:
- name: clones_min_analytical
  value: 200.0
  units: dimensionless
  input_type: direct_measurement
  source_ref: Kwok2012
  source_location: Discussion, p. 2542 (right column) and text around Table IV
  value_snippet: "\"...epitope-specific naive CD4+ T cells for a specific MHC/peptide\
    \ complex can be expected to consist of 200\u20131000 distinct TCR clonotypes\
    \ for the average and more abundant epitopes.\""
- name: clones_max_analytical
  value: 1000.0
  units: dimensionless
  input_type: direct_measurement
  source_ref: Kwok2012
  source_location: Discussion, p. 2542 (right column)
  value_snippet: "\"...epitope-specific naive CD4+ T cells for a specific MHC/peptide\
    \ complex can be expected to consist of 200\u20131000 distinct TCR clonotypes\
    \ for the average and more abundant epitopes.\""
- name: n_epitopes_PA
  value: 3.0
  units: dimensionless
  input_type: direct_measurement
  source_ref: Kwok2012
  source_location: "Results, Table I and text pp. 2538\u20132539"
  value_snippet: "\"Based on these results, all subsequent experiments focused on\
    \ PA401\u2013420, PA505\u2013524, and PA713\u2013732.\""
- name: naive_cells_per_TCR_clonotype
  value: 1000.0
  units: dimensionless
  input_type: direct_measurement
  source_ref: Kwok2012
  source_location: Discussion, p. 2542 (left column)
  value_snippet: "\"...it follows that there are \u223C1000 naive T cells per TCR\
    \ clonotype.\""
- name: uniform_mean_coeff
  value: 0.5
  units: dimensionless
  input_type: unit_conversion
  rationale: "Coefficient used to compute the mean of a continuous uniform distribution\
    \ as (a + b) * 0.5 when approximating the analytically reported 200\u20131000\
    \ clonotype range as a uniform distribution."
  source_ref: Kwok2012
  source_location: "Mathematical identity applied to the 200\u20131000 clonotype range;\
    \ not explicitly given in the text."
- name: uniform_var_denominator
  value: 12.0
  units: dimensionless
  input_type: unit_conversion
  rationale: "Denominator used to compute the variance of a continuous uniform distribution\
    \ as (b - a)^2 / 12 when approximating the analytically reported 200\u20131000\
    \ clonotype range as a uniform distribution."
  source_ref: Kwok2012
  source_location: "Mathematical identity applied to the 200\u20131000 clonotype range;\
    \ not explicitly given in the text."
calibration:
  parameters:
  - name: n_CD4_clones
    units: dimensionless
    nuisance: false
  forward_model:
    data_rationale: "Kwok2012 uses tetramer enrichment to measure frequencies of epitope-specific\
      \ naive CD4+ T cells for three Bacillus anthracis protective antigen epitopes\
      \ in DRB1*01:01+ humans and combines these with estimates of total naive CD4+\
      \ T cell numbers and TCR diversity to derive an analytical estimate that a typical\
      \ epitope is recognized by 200\u20131000 distinct CD4+ T cell clonotypes. This\
      \ is directly the same quantity as the QSP parameter n_CD4_clones (number of\
      \ self-antigen-specific CD4+ T cell clones per epitope), so an algebraic forward\
      \ model equating n_CD4_clones to the observed clone count is appropriate."
    submodel_rationale: "In the full PDAC QSP model, n_CD4_clones is a dimensionless\
      \ scaling factor that multiplies the naive CD4+ T cell pool (V_LN.nCD4) in the\
      \ activation fluxes to aTreg and aTh and in the generation of P0 antigen from\
      \ cancer cell death. Mechanistically, this factor represents the number of distinct\
      \ self-antigen-specific CD4+ T cell clones per relevant epitope that are available\
      \ in the naive repertoire to be activated. Kwok2012 provides a direct estimate\
      \ of the number of distinct CD4+ T cell clonotypes per peptide\u2013MHC epitope\
      \ in humans; therefore, equating the model parameter n_CD4_clones to the empirically\
      \ estimated clone count preserves the mechanistic role of this parameter in\
      \ the QSP reactions (as a multiplier on naive CD4+ T cells and antigen production)\
      \ without altering its underlying biological meaning."
    type: algebraic
    formula: n_clones = n_CD4_clones
    code: "def compute(params, inputs):\n    # Forward model: the QSP parameter n_CD4_clones\
      \ is defined as the\n    # number of distinct self-antigen-specific CD4+ T cell\
      \ clones per\n    # peptide\u2013MHC epitope. Kwok2012 directly estimates this\
      \ quantity\n    # (200\u20131000 clonotypes per epitope) from human naive repertoire\
      \ data.\n    # We therefore take the model prediction for the observable\n \
      \   # \"n_clones\" to be exactly n_CD4_clones.\n    return params['n_CD4_clones']\n"
  error_model:
  - name: clone_count_estimate
    units: dimensionless
    uses_inputs:
    - clones_min_analytical
    - clones_max_analytical
    - n_epitopes_PA
    - uniform_mean_coeff
    - uniform_var_denominator
    sample_size_input: n_epitopes_PA
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    # Kwok2012 provides an analytical range of 200\u2013\
      1000 distinct\n    # clonotypes per epitope for the average and more abundant\n\
      \    # epitopes, rather than a single mean and SD. We approximate\n    # this\
      \ as a uniform distribution between the reported minimum\n    # and maximum\
      \ and match its mean and variance with a normal\n    # distribution for parametric\
      \ bootstrap.\n    clones_min = inputs['clones_min_analytical']\n    clones_max\
      \ = inputs['clones_max_analytical']\n    mean_coeff = inputs['uniform_mean_coeff']\n\
      \    var_den = inputs['uniform_var_denominator']\n    # Mean and SD of a continuous\
      \ uniform(a,b)\n    mean = mean_coeff * (clones_min + clones_max)\n    sd =\
      \ (clones_max - clones_min) / np.sqrt(var_den)\n    # Treat the three PA epitopes\
      \ analyzed (PA401\u2013420, PA505\u2013524,\n    # PA713\u2013732) as independent\
      \ samples from this distribution.\n    # The standard error of the mean scales\
      \ with sqrt(sample_size).\n    return rng.normal(mean, sd / np.sqrt(sample_size),\
      \ n_bootstrap)\n"
    n_bootstrap: 10000
  identifiability_notes: "This target directly constrains n_CD4_clones by matching\
    \ it to the analytically derived range of 200\u20131000 distinct naive CD4+ T\
    \ cell clonotypes per epitope reported in Kwok2012. Because the forward model\
    \ is algebraic (identity mapping) and the observation encodes only a fairly broad\
    \ range, the posterior for n_CD4_clones will remain wide but centered near the\
    \ geometric mean of this range (~450). The target does not involve any additional\
    \ QSP parameters, so n_CD4_clones is statistically identifiable but only weakly\
    \ constrained within roughly one order of magnitude, which is appropriate for\
    \ this kind of repertoire-level estimate."
experimental_context:
  species: human
  system: ex_vivo
  cell_types:
  - name: CD4+ T cells
    phenotype: naive and memory CD4+ T cells specific for Bacillus anthracis protective
      antigen epitopes
    isolation_method: Tetramer-based magnetic enrichment of DRB1*01:01-restricted
      PA-specific CD4+ T cells from peripheral blood
    source: Peripheral blood from healthy adult donors (AVA vaccinees and nonvaccinees)
  indication: Anthrax vaccination model antigen (protective antigen of Bacillus anthracis)
study_interpretation: "Kwok2012 uses MHC class II tetramer enrichment to enumerate\
  \ naive and memory CD4+ T cells specific for three DRB1*01:01-restricted epitopes\
  \ from Bacillus anthracis protective antigen in humans. By combining measured naive\
  \ epitope-specific frequencies (~2 per 10^6 naive CD4+ T cells for a typical epitope)\
  \ with independent estimates of the total naive CD4+ T cell pool and TCR diversity,\
  \ the authors infer that a typical peptide\u2013MHC epitope is recognized by approximately\
  \ 200\u20131000 distinct CD4+ T cell clonotypes. This analytical estimate directly\
  \ informs the QSP parameter n_CD4_clones, which represents the number of self-antigen-specific\
  \ CD4+ T cell clones per epitope that participate in activation and antigen processing\
  \ in the model."
key_assumptions:
- Self-antigen-specific naive CD4+ T cell clones in human PDAC patients are present
  at similar frequencies and repertoire diversity as foreign-epitope-specific naive
  CD4+ T cells in healthy DRB1*01:01+ donors studied by Kwok2012, as supported qualitatively
  by Su2013 for self epitopes.
- "The analytical range of 200\u20131000 distinct clonotypes per epitope reported\
  \ in Kwok2012 adequately captures both the biological variability across epitopes\
  \ and individuals and the uncertainty arising from combining frequency measurements\
  \ with repertoire size estimates."
- n_CD4_clones in the QSP model corresponds to the number of distinct clonotypes per
  relevant self/tumor-associated epitope, not the total number of epitope-specific
  cells, so it is appropriate to equate this parameter directly to the clonotype count
  estimated in Kwok2012.
- Differences between anthrax PA epitopes and PDAC-associated self/tumor antigens
  (e.g., central tolerance, thymic deletion) do not change the order-of-magnitude
  of the number of distinct naive clonotypes per epitope, but may modestly shift values
  toward the lower end of the reported range, which is naturally reflected by the
  broad uncertainty encoded in the observation model.
- "The DRB1*01:01 restriction in Kwok2012 is taken as representative of a typical\
  \ human class II allele; inter-allelic differences in repertoire breadth are assumed\
  \ to be small compared to the overall uncertainty captured by the 200\u20131000\
  \ clonotype range."
key_study_limitations:
- The study focuses on foreign epitopes from Bacillus anthracis protective antigen
  in HLA-DRB1*01:01+ individuals, not on self or tumor antigens in PDAC, so translation
  to self-antigen-specific clonotypes relies on the assumption that self and foreign
  epitope-specific naive frequencies are similar.
- "The estimate of 200\u20131000 distinct clonotypes per epitope is not a direct experimental\
  \ count of clonotypes but an analytical derivation that combines naive frequency\
  \ measurements with independent estimates of total naive CD4+ T cell numbers and\
  \ TCR diversity, introducing additional model-based uncertainty."
- "Only three epitopes (PA401\u2013420, PA505\u2013524, PA713\u2013732) and a limited\
  \ number of donors were analyzed, so the reported range may not capture the full\
  \ inter-individual or inter-epitope variability in naive clonotype numbers."
- The donors in Kwok2012 are generally healthy adults with or without anthrax vaccination,
  whereas PDAC patients may have age-related immunosenescence or disease-related lymphopenia
  that could reduce naive repertoire size; this is partially mitigated by the broad
  range used in the observation model.
- Clonotype diversity was assessed primarily via Vbeta usage and limited TCR sequencing,
  so rare clonotypes may be undercounted, again contributing to uncertainty that is
  not fully quantifiable from the published data.
primary_data_source:
  doi: 10.4049/jimmunol.1102190
  title: Frequency of Epitope-Specific Naive CD4+ T Cells Correlates with Immunodominance
    in the Human Memory Repertoire
  authors:
  - Kwok
  - Tan V
  - Gillette L
  - Littell CT
  - Soltis MA
  - LaFond RB
  - Yang J
  - James EA
  - DeLong JH
  year: 2012
  source_tag: Kwok2012
  source_relevance:
    indication_match: proxy
    indication_match_justification: "The source study analyzes naive and memory CD4+\
      \ T cell repertoires specific for Bacillus anthracis protective antigen epitopes\
      \ in generally healthy HLA-DRB1*01:01+ adults, whereas the QSP model targets\
      \ self/tumor antigens in PDAC. However, the parameter of interest (number of\
      \ distinct naive CD4+ T cell clonotypes per peptide\u2013MHC epitope) reflects\
      \ fundamental properties of the human TCR repertoire that are expected to be\
      \ broadly similar across indications. Therefore, PA-specific clonotype counts\
      \ are used as a mechanistic proxy for self-antigen-specific clonotype numbers,\
      \ acknowledging that central tolerance for self antigens may reduce naive clone\
      \ counts modestly relative to the foreign-epitope case."
    species_source: human
    species_target: human
    source_quality: primary_human_clinical
    perturbation_type: physiological_baseline
    perturbation_relevance: The key quantities used (naive epitope-specific frequencies,
      total naive CD4+ T cell counts, and TCR diversity estimates) describe the baseline
      human immune repertoire. Although some donors received anthrax vaccine, the
      analytical estimate of clonotype numbers relies primarily on naive frequencies
      in unvaccinated subjects and on global repertoire properties, so it is taken
      as representative of physiological baseline rather than a pharmacologically
      perturbed state.
    tme_compatibility: high
    tme_compatibility_notes: The parameter n_CD4_clones characterizes systemic naive
      CD4+ T cell repertoire diversity per epitope, which is largely determined in
      the thymus and peripheral lymphoid organs and is not directly shaped by the
      tumor microenvironment. Thus, although the source study does not involve PDAC
      or a desmoplastic TME, the compatibility is considered high for this systemic
      immunological quantity.
    measurement_directness: single_inversion
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: ex_vivo
