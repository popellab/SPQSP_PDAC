calibration:
  parameters:
  - name: k_vas_Csec
    units: picogram/cell/day
    nuisance: false
  forward_model:
    data_rationale: Hotz2005 reports cumulative VEGF protein produced into culture
      supernatant over 72 h, normalized as pg per 10^6 PDAC cells (AsPC-1 or HPAF-2).
      This directly constrains the average per-cell secretion rate by relating total
      mass produced over a known time interval to the number of producing cells.
    submodel_rationale: 'In the full QSPIO-PDAC model, k_vas_Csec is the per-cancer-cell
      VEGF secretion rate (pg/cell/day) contributing to tumor VEGF levels via the
      reaction null -> V_T.VEGF with rate k_vas_Csec * C_total. Here we model the
      same process in a simplified in vitro setting: a homogeneous population of PDAC
      cells secreting VEGF into culture medium over 72 h with negligible clearance,
      so accumulated mass per 10^6 cells over 72 h equals k_vas_Csec times time and
      cell number.'
    type: algebraic
    formula: VEGF mass per 10^6 cells accumulated over the 72 h culture equals k_vas_Csec
      (pg/cell/day) times the effective culture duration in days and the normalization
      cell number (10^6 cells).
    code: "def compute(params, inputs):\n    import numpy as np\n    k = params['k_vas_Csec']\
      \  # pg/cell/day\n    norm_cells = inputs['vegf_invitro_norm_cells']\n    t_h\
      \ = inputs['vegf_invitro_incubation_time_h']\n    h_per_day = inputs['vegf_invitro_hours_per_day']\n\
      \    t_day = t_h / h_per_day\n    mass_per_1e6 = k * norm_cells * t_day\n  \
      \  # Same underlying secretion rate assumed for both PDAC lines; differences\
      \ reflect biological variability\n    return {\n        'aspc1_vegf_72h_pg_per_1e6':\
      \ mass_per_1e6,\n        'hpaf2_vegf_72h_pg_per_1e6': mass_per_1e6,\n    }"
  error_model:
  - name: aspc1_vegf_72h_pg_per_1e6
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['aspc1_vegf_72h_pg_per_1e6']"
    units: picogram/10^6 cell
    uses_inputs:
    - aspc1_vegf_72h_mean_pg_per_1e6
    - aspc1_vegf_72h_sem_pg_per_1e6
    - vegf_invitro_n_replicates
    sample_size_input: vegf_invitro_n_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['aspc1_vegf_72h_mean_pg_per_1e6']\n\
      \    sem = inputs['aspc1_vegf_72h_sem_pg_per_1e6']\n    # Paper reports mean\
      \ +/- SEM; convert SEM to SD using sample size\n    sd = sem * np.sqrt(sample_size)\n\
      \    cv = sd / mean\n    # Lognormal bootstrap for positive secreted mass\n\
      \    sigma_ln = np.sqrt(np.log(1 + cv**2))\n    mu_ln = np.log(mean) - sigma_ln**2\
      \ / 2\n    return rng.lognormal(mu_ln, sigma_ln / np.sqrt(sample_size), n_bootstrap)"
    n_bootstrap: 10000
  - name: hpaf2_vegf_72h_pg_per_1e6
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['hpaf2_vegf_72h_pg_per_1e6']"
    units: picogram/10^6 cell
    uses_inputs:
    - hpaf2_vegf_72h_mean_pg_per_1e6
    - hpaf2_vegf_72h_sem_pg_per_1e6
    - vegf_invitro_n_replicates
    sample_size_input: vegf_invitro_n_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['hpaf2_vegf_72h_mean_pg_per_1e6']\n\
      \    sem = inputs['hpaf2_vegf_72h_sem_pg_per_1e6']\n    sd = sem * np.sqrt(sample_size)\n\
      \    cv = sd / mean\n    sigma_ln = np.sqrt(np.log(1 + cv**2))\n    mu_ln\
      \ = np.log(mean) - sigma_ln**2 / 2\n    return rng.lognormal(mu_ln, sigma_ln\
      \ / np.sqrt(sample_size), n_bootstrap)"
    n_bootstrap: 10000
  identifiability_notes: This target uses two independent PDAC cell lines (AsPC-1
    and HPAF-2) that report VEGF secretion as pg per 10^6 cells over 72 h. Under the
    assumption of a common underlying per-cell VEGF secretion rate (k_vas_Csec) across
    lines, these two measurements provide partially independent constraints on the
    same parameter. The model is structurally identifiable for k_vas_Csec given known
    incubation time and normalization factor. Line-to-line biological variability
    and in vitro vs in vivo context are absorbed into the observation noise and translation
    sigma; no attempt is made to separately identify cell-line-specific secretion
    rates from the shared k_vas_Csec.
experimental_context:
  species: human
  system: in_vitro_immortalized
  cell_lines:
  - name: AsPC-1
    species: human
    tissue_origin: pancreas
    cell_type: poorly differentiated pancreatic adenocarcinoma
    source: American Type Culture Collection (ATCC)
  - name: HPAF-2
    species: human
    tissue_origin: pancreas
    cell_type: moderately differentiated pancreatic adenocarcinoma
    source: American Type Culture Collection (ATCC)
  culture_conditions:
    substrate: tissue culture plastic (6-well plates)
    serum_concentration: 10.0
    serum_concentration_units: percent FBS
    oxygen_level: normoxic (5% CO2 in humidified air)
    culture_type: 2d_monolayer
    medium: 'AsPC-1: RPMI-1640 + 10% FBS; HPAF-2: MEM + 10% FBS'
    supplements: penicillin G (100 U/mL), streptomycin (100 ug/mL)
    duration: Medium changed on day 1; VEGF accumulation measured over the following
      72 h (day 1 to day 4).
    notes: Cells were seeded at 2 x 10^5 per well in 2 mL medium; VEGF secretion normalized
      as pg per 10^6 cells at the end of the 72 h accumulation period.
  indication: pancreatic ductal adenocarcinoma
study_interpretation: Hotz2005 measured VEGF protein secreted into culture supernatant
  by two human PDAC cell lines (AsPC-1 and HPAF-2) over a 72 h period and reported
  the results as pg per 10^6 cells. Assuming a constant per-cell secretion rate and
  negligible VEGF degradation in culture over 72 h, these measurements map directly
  to the QSP model parameter k_vas_Csec (pg/cell/day), which describes VEGF secretion
  by viable cancer cells into the tumor compartment. Treating the two cell lines as
  independent realizations of the same underlying PDAC secretion rate provides a PDAC-specific
  estimate and plausible variability range for k_vas_Csec.
key_assumptions:
- VEGF degradation or uptake in culture medium over 72 h is negligible compared with
  production, so accumulated VEGF mass is proportional to secretion rate times time
  and cell number.
- Per-cell VEGF secretion rate is approximately constant over the 72 h accumulation
  window, despite potential cell proliferation or density-dependent effects.
- Normalization to pg per 10^6 cells removes dependence on the exact final cell count,
  allowing a direct mapping from accumulated mass per 10^6 cells and time to k_vas_Csec.
- AsPC-1 and HPAF-2 share a common underlying PDAC VEGF secretion rate, with observed
  differences treated as biological variability around k_vas_Csec rather than distinct
  parameters.
- In vitro 2D monolayer culture under high-serum, normoxic conditions provides an
  upper-bound estimate for in vivo PDAC tumor-cell VEGF secretion in the desmoplastic
  tumor microenvironment.
key_study_limitations:
- Only two PDAC cell lines were assayed, which may not capture the full heterogeneity
  of VEGF secretion across patient tumors.
- Experiments were performed in 2D monolayer culture with high serum and normoxia,
  which differ substantially from the hypoxic, nutrient-poor PDAC tumor microenvironment.
- VEGF secretion was measured at a single accumulation interval (72 h), providing
  no time-course information to separate secretion from potential degradation in the
  medium.
- The paper reports mean +/- SEM, and the exact distribution of replicate measurements
  is not shown; uncertainty must be reconstructed assuming lognormal variability and
  using SEM to estimate SD.
- Assuming a single shared k_vas_Csec for AsPC-1 and HPAF-2 ignores possible stable
  cell-line-specific differences in VEGF secretion mechanisms.
