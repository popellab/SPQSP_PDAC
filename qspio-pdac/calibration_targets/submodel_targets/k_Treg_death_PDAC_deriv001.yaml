calibration:
  parameters:
  - name: k_Treg_death
    units: 1/day
    nuisance: false
  forward_model:
    data_rationale: Vukmanovic-Stejic et al. (2006) quantified the disappearance rate constant d* for human circulating CD4+CD45RO+CD25hiFoxp3+
      regulatory T cells using in vivo deuterium labeling and kinetic modeling. The reported d* is already a first-order loss
      rate (per day), matching the QSP parameter k_Treg_death, so an algebraic relationship between the parameter and the
      observable is appropriate.
    submodel_rationale: In the full QSPIO-PDAC model, k_Treg_death governs first-order death of Tregs in blood, peripheral
      tissues, lymph node, and tumor compartments. At homeostasis, the effective net loss rate of circulating memory-phenotype
      Tregs should be comparable to the death rate used in the model. We therefore equate the QSP parameter k_Treg_death to
      the experimentally inferred disappearance rate constant d* for human blood memory Tregs.
    type: algebraic
    formula: dstar = k_Treg_death
    code: "import numpy as np\n\ndef compute(params, inputs):\n    return params['k_Treg_death']\n"
  error_model:
  - name: human_Treg_disappearance_rate
    units: 1/day
    uses_inputs:
    - dstar_Treg_mean_1_per_day
    - dstar_Treg_SD_1_per_day
    sample_size_input: dstar_Treg_sample_size
    observation_code: "import numpy as np\n\ndef derive_observation(inputs, sample_size, rng, n_bootstrap):\n    mean_val\
      \ = inputs['dstar_Treg_mean_1_per_day']\n    sd_val = inputs['dstar_Treg_SD_1_per_day']\n    sem = sd_val / np.sqrt(sample_size)\n\
      \    samples = rng.normal(mean_val, sem, size=n_bootstrap)\n    return samples\n"
    n_bootstrap: 10000
  identifiability_notes: This target constrains the baseline first-order death rate k_Treg_death for systemic memory-phenotype
    Tregs to be near the experimentally inferred disappearance rate d* from human peripheral blood (~0.066 1/day, t1/2 ~11
    days). Because the observable is directly equated to the parameter, the data provide a strong constraint on the marginal
    distribution of k_Treg_death assuming the measurement error is correctly characterized. However, in the full PDAC QSP
    model, the effective turnover of Tregs in each compartment also depends on trafficking and local proliferation parameters
    (q_Treg_* and k_Treg_pro, k_Treg_pro_tumor). As a result, only the systemic component of Treg loss is directly informed
    by this target. The experimental d* includes both true cell death and other loss processes such as migration out of blood
    or phenotype changes, so k_Treg_death inferred here effectively represents an apparent first-order loss rate of circulating
    memory Tregs rather than a pure apoptosis rate. Additional tissue- and tumor-specific data (e.g., Ki-67 or BrdU labeling
    in tumor-infiltrating Tregs) would be needed to refine compartment-specific Treg death or turnover rates.
