study_interpretation: Vukmanovic-Stejic et al. (2006) used in vivo deuterium-labeled glucose to quantify proliferation and
  disappearance rates of different human CD4+ T cell subsets, including CD4+CD45RO+CD25hiFoxp3+ regulatory T cells, under
  homeostatic conditions. By fitting a kinetic model to the time course of label incorporation and decay in sorted subsets,
  they reported a disappearance rate constant d* of approximately 6.58% per day (SD 3.83%/day) for memory-phenotype Tregs
  across eight adult donors, corresponding to a half-life of about 11 days. This d* is a first-order loss rate from the circulating
  Treg pool, encompassing true cell death plus loss via migration and phenotype changes. For the QSPIO-PDAC model, we interpret
  this as an apparent first-order death/turnover rate for systemic memory Tregs, and equate it to the model parameter k_Treg_death.
  This provides a human in vivo anchor for Treg lifespan against which other processes (recruitment to tumor, local proliferation,
  and depletion by therapies) operate.
key_assumptions:
- The disappearance rate constant d* for CD4+CD45RO+CD25hiFoxp3+ Tregs in peripheral blood is a suitable proxy for the intrinsic
  first-order death rate k_Treg_death used for Tregs across compartments in the QSPIO-PDAC model.
- Loss of labeled Tregs from the blood compartment in the deuterium study is dominated by true cell death rather than by long-term
  sequestration in tissues or stable phenotype switches, so that d* approximates a death/turnover rate.
- Homeostatic Treg turnover rates in healthy adults are representative of baseline Treg death rates in PDAC patients prior
  to treatment, acknowledging that inflammation, therapy, and tumor burden may modulate survival somewhat.
- The uncertainty in the pooled estimate of d* across eight subjects can be approximated by a normal distribution for the
  mean, using the reported standard deviation and sample size.
- Potential differences between circulating and tissue-resident or tumor-infiltrating Tregs (e.g., altered survival signals
  in the PDAC microenvironment) are handled elsewhere in the model via compartment-specific proliferation and depletion terms
  rather than by changing k_Treg_death.
key_study_limitations:
- The disappearance rate d* reflects net loss from the labeled blood Treg pool and conflates true apoptosis with migration
  to tissues and possible phenotype conversion, so it may overestimate the pure death rate.
- Measurements were made in healthy volunteers without cancer; systemic inflammation, chemotherapy, and PDAC-associated immunosuppression
  could alter Treg survival in patients.
- The study focused on circulating memory-phenotype CD4+CD45RO+CD25hi Tregs and did not characterize tissue-resident or tumor-infiltrating
  Treg populations, which may have different lifespans.
- Sample size was modest (n = 8), and inter-individual variability in d* was relatively large (SD ~60% of the mean), which
  increases uncertainty in the true population-average death rate.
- The kinetic model used to infer p and d* assumes homogeneous subpopulations and steady-state conditions, which may not hold
  perfectly in vivo and could bias rate estimates.
primary_data_source:
  doi: 10.1172/JCI28941
  title: Human CD4+CD25hiFoxp3+ regulatory T cells are derived by rapid turnover of memory populations in vivo
  authors:
  - Milica Vukmanovic-Stejic
  - Yan Zhang
  - Joanne E. Cook
  - Jean M. Fletcher
  - Arthur McQuaid
  - Joanne E. Masters
  - Malcolm H.A. Rustin
  - Leonie S. Taams
  - Peter C.L. Beverley
  - Derek C. Macallan
  - Arne N. Akbar
  year: 2006
  source_tag: VukmanovicStejic2006
  source_relevance:
    indication_match: proxy
    indication_match_justification: The source study measured turnover of circulating CD4+CD45RO+CD25hiFoxp3+ regulatory T
      cells in healthy adult humans, whereas the QSPIO-PDAC model focuses on Treg dynamics in pancreatic ductal adenocarcinoma
      patients. Although there is no tumor present in the study subjects, the basic homeostatic lifespan of human memory-phenotype
      Tregs in blood is expected to be similar in cancer patients, so these data can serve as a mechanistic proxy for systemic
      Treg death rates in PDAC.
    species_source: human
    species_target: human
    source_quality: primary_human_clinical
    perturbation_type: physiological_baseline
    perturbation_relevance: Deuterium-labeled glucose administration is a minimally perturbative tracer technique used to
      quantify cell turnover under near-steady-state physiological conditions. The inferred disappearance rate d* therefore
      reflects baseline homeostatic loss of circulating memory Tregs rather than drug-induced killing, making it suitable
      to inform an unperturbed k_Treg_death parameter.
    tme_compatibility: moderate
    tme_compatibility_notes: The measurements are from peripheral blood in healthy volunteers and do not directly probe the
      pancreatic tumor microenvironment, which is highly immunosuppressive and stromalized in PDAC. However, the basic lifespan
      of memory-phenotype Tregs is largely determined by intrinsic survival programs and systemic cytokine/IL-2 availability,
      so the blood-based disappearance rate is a reasonable starting point for systemic Treg death, with the understanding
      that local tumor Treg survival may differ.
    measurement_directness: single_inversion
    temporal_resolution: timecourse
    experimental_system: clinical_in_vivo
