study_interpretation: 'Meng et al. 2023 provide a PDAC-specific quantification of tumor-reactive CD8 T cell

  receptor clonotypes by combining single-cell transcriptomics with functional validation

  of TCRs against autologous tumor cells. They report 93 tumor-reactive TCR clonotypes

  across 3 genetically unstable and 6 genetically stable human PDAC tumors, indicating

  that individual tumors harbor multiple distinct tumor-reactive CD8 T cell clones.

  Treating these as independent clones, the data imply an average of ~10 tumor-reactive

  CD8 T cell clones per PDAC tumor.

  '
key_assumptions:
- 'Each functionally validated tumor-reactive TCR clonotype corresponds to one effective

  tumor-specific CD8 T cell clone in the QSP model.

  '
- 'The 9 PDAC tumors analyzed (3 genetically unstable, 6 genetically stable) are

  representative of the broader PDAC population modeled in QSPIO-PDAC.

  '
- 'Tumor-reactive CD8 T cell clones identified ex vivo from resected tumors reflect

  the steady-state number of functional tumor-specific clones participating in the

  in vivo response.

  '
- 'Clonotypes not recovered or not functionally tested contribute a relatively small

  fraction, so the identified set provides a lower-bound but informative estimate.

  '
key_study_limitations:
- 'Only 9 PDAC tumors profiled; number of tumor-reactive clonotypes per tumor is not

  reported explicitly — the total of 93 across all tumors is used to derive an average.

  '
- 'Detection depends on T cell viability, capture efficiency, and functional assay panel;

  low-frequency or weakly reactive clones are likely undercounted (lower bound).

  '
- 'Genetically unstable tumors have higher frequencies of tumor-reactive clones than

  stable ones; this submodel uses a single average without genotype stratification.

  '
- 'In vitro tumor reactivity may not perfectly match in vivo efficacy due to exhaustion,

  metabolic constraints, and spatial exclusion by stroma.

  '
