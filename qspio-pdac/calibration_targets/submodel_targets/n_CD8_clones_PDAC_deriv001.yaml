calibration:
  parameters:
  - name: n_CD8_clones
    units: dimensionless
  forward_model:
    type: algebraic
    formula: total_clonotypes = n_CD8_clones * n_tumors
    data_rationale: 'Meng et al. 2023 used single-cell transcriptomics combined with functional TCR

      testing to identify 93 tumor-reactive CD8 T cell receptor clonotypes across 9 PDAC

      tumors. This directly constrains the typical number of distinct tumor-reactive

      CD8 clonotypes per PDAC tumor.

      '
    submodel_rationale: 'In the full model, n_CD8_clones multiplies the rate of antigen-specific CD8 T cell

      activation and the amount of free tumor antigen P1 generated per cancer cell. Each

      experimentally identified tumor-reactive TCR clonotype corresponds to one such

      functional clone.

      '
    code: "def compute(params, inputs):\n    n_clones = params['n_CD8_clones']\n    n_tumors = inputs['n_tumors_unstable']\
      \ + inputs['n_tumors_stable']\n    return n_clones * n_tumors\n"
  error_model:
  - name: tumor_reactive_clones_total
    units: dimensionless
    uses_inputs:
    - total_TR_clonotypes
    - n_tumors_unstable
    - n_tumors_stable
    sample_size_input: n_tumors_unstable
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    total_tr\
      \ = inputs['total_TR_clonotypes']\n    # Poisson counting statistics: CV = 1/sqrt(count)\n    cv = 1 / np.sqrt(total_tr)\n\
      \    sigma_ln = np.sqrt(np.log(1 + cv**2))\n    mu_ln = np.log(total_tr) - sigma_ln**2 / 2\n    return rng.lognormal(mu_ln,\
      \ sigma_ln, size=n_bootstrap)\n"
  identifiability_notes: 'n_CD8_clones is identified from 93 total clonotypes / 9 tumors ~ 10 per tumor.

    Moderate constraint due to small sample (9 tumors) and detection limits (lower bound).

    In the full model, n_CD8_clones correlates with P1_C1, k_T_activation_per_APC, and

    n_T_expansion_burst.

    '
