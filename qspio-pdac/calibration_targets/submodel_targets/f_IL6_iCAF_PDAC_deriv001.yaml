      \    import numpy as np\n    mu_den = inputs['alphaSMA_protein_EtOH_IL6ab_mean']\n\
      \    sd_den = inputs['alphaSMA_protein_EtOH_IL6ab_sd']\n    mu_num = inputs['alphaSMA_protein_EtOH_IgG_mean']\n\
