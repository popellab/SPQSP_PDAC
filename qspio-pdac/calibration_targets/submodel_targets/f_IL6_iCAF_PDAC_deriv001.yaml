calibration:
  parameters:
  - name: f_IL6_iCAF
    units: dimensionless
    nuisance: false
  - name: H_IL6_culture_EtOH
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: -0.7
      sigma: 1.0
  - name: H_IL6_culture_LPS
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: -0.7
      sigma: 1.0
  forward_model:
    data_rationale: Zheng2021 Figure 4 reports alpha-SMA and Col1a1 mRNA and protein
      levels in HP-1 human pancreatic stellate cells stimulated with EtOH or LPS in
      the presence of anti-IL-6 antibody or control IgG. The fold-change in activation
      markers between IL-6-neutralized and IL-6-competent conditions quantifies how
      much IL-6 autocrine signaling amplifies PSC activation. We model these measurements
      as ratios of activation marker levels that depend on the IL-6 autocrine amplification
      factor.
    submodel_rationale: In the full QSPIO-PDAC model, IL-6 autocrine feedback on inflammatory
      CAF (iCAF) formation multiplies the IL-1-driven activation rate as (1 + f_IL6_iCAF
      * H_IL6_iCAF). Under IL-6 neutralization, H_IL6_iCAF -> 0 so the factor is 1;
      under IL-6-competent conditions it is 1 + f_IL6_iCAF * H_IL6_context. The algebraic
      forward model directly maps this structure to the experimentally observed fold-change
      in activation marker levels between anti-IL-6 and IgG control for EtOH and LPS
      stimulation. Context-specific IL-6 Hill terms H_IL6_culture_EtOH and H_IL6_culture_LPS
      are treated as nuisance parameters representing the effective value of the IL-6
      Hill function in these in vitro cultures.
    type: algebraic
    formula: ratio = 1 + f_IL6_iCAF * H_IL6_context
    code: "def compute(params, inputs):\n    import numpy as np\n    f = params['f_IL6_iCAF']\n\
      \    H_EtOH = params['H_IL6_culture_EtOH']\n    H_LPS = params['H_IL6_culture_LPS']\n\
      \    ratio_EtOH = 1.0 + f * H_EtOH\n    ratio_LPS = 1.0 + f * H_LPS\n    return\
      \ {\n        'ratio_EtOH': ratio_EtOH,\n        'ratio_LPS': ratio_LPS,\n  \
      \  }\n"
  error_model:
  - name: ratio_EtOH_alphaSMA_mRNA
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['ratio_EtOH']\n"
    units: dimensionless
    uses_inputs:
    - alphaSMA_mRNA_EtOH_IL6ab_mean
    - alphaSMA_mRNA_EtOH_IL6ab_sd
    - alphaSMA_mRNA_EtOH_IgG_mean
    - alphaSMA_mRNA_EtOH_IgG_sd
    - n_reps_HP1_Fig4
    sample_size_input: n_reps_HP1_Fig4
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mu_den = inputs['alphaSMA_mRNA_EtOH_IL6ab_mean']\n\
      \    sd_den = inputs['alphaSMA_mRNA_EtOH_IL6ab_sd']\n    mu_num = inputs['alphaSMA_mRNA_EtOH_IgG_mean']\n\
      \    sd_num = inputs['alphaSMA_mRNA_EtOH_IgG_sd']\n    n = int(sample_size)\n\
      \    sd_den_mean = sd_den / np.sqrt(n)\n    sd_num_mean = sd_num / np.sqrt(n)\n\
      \    mean_den = rng.normal(mu_den, sd_den_mean, n_bootstrap)\n    mean_num =\
      \ rng.normal(mu_num, sd_num_mean, n_bootstrap)\n    ratio = mean_num / mean_den\n\
      \    return ratio\n"
    n_bootstrap: 10000
  - name: ratio_EtOH_alphaSMA_protein
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['ratio_EtOH']\n"
    units: dimensionless
    uses_inputs:
