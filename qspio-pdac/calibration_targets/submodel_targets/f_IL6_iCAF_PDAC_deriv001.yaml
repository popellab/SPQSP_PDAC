  identifiability_notes: All eight measurements (alpha-SMA and Col1a1 mRNA and protein
    under EtOH or LPS, with IL-6 antibody vs IgG) constrain the fold-change in PSC
    activation between IL-6-neutralized and IL-6-competent conditions. In this submodel,
    that fold-change is 1 + f_IL6_iCAF * H_IL6_context, where H_IL6_context is the
    effective IL-6 Hill term in the specific culture (EtOH or LPS). Because H_IL6_culture_EtOH
    and H_IL6_culture_LPS are nuisance parameters bounded implicitly by their priors,
    the data primarily constrain the products f_IL6_iCAF * H_IL6_culture_EtOH and
    f_IL6_iCAF * H_IL6_culture_LPS. This yields a lower bound on f_IL6_iCAF (since
    H <= O(1)) but does not fully separate f_IL6_iCAF from H in a likelihood-identifiable
    way. Including both EtOH and LPS contexts provides two independent products, modestly
    improving identifiability. The use of multiple markers (alpha-SMA and Col1a1,
    mRNA and protein) adds redundancy and helps stabilize inference but does not introduce
    new independent mechanistic structure, since all are modeled as responding to
    the same fold-change factor in activation rate.
experimental_context:
  species: human
  system: in_vitro_cell_line
  cell_lines:
  - name: HP-1
    species: human
    tissue_origin: pancreas
    cell_type: pancreatic stellate cell line
    source: Sun et al., Int J Med Sci. 2020;17:137-144.
  cell_types:
  - name: monocyte-derived macrophage
    phenotype: human peripheral blood monocytes differentiated with M-CSF
    isolation_method: CD14 magnetic bead selection from PBMCs
    source: Buffy coat preparations from healthy donors
  culture_conditions:
    substrate: tissue culture plastic
    serum_concentration: 10.0
    serum_concentration_units: percent
    oxygen_level: normoxic
    culture_type: 2d_monolayer
    medium: DMEM for HP-1; RPMI with 10% FBS and M-CSF for macrophages
    supplements: M-CSF 10 ng/mL for macrophage differentiation
    duration: HP-1 serum-starved to 0.5% FBS for 12 h, then stimulated with EtOH or
      LPS for 24 h (mRNA) or 48 h (protein)
    notes: Ethanol 50 mM or LPS 100 ng/mL was added to mimic alcohol-induced or endotoxin-triggered
      activation; some conditions included neutralizing anti-IL-6 antibody (5 ug/mL)
      or control IgG.
  indication: alcoholic chronic pancreatitis
study_interpretation: Zheng2021 demonstrates that IL-6 produced by human pancreatic
  stellate cells and macrophages contributes significantly to PSC activation and collagen
  I synthesis in alcoholic chronic pancreatitis. In HP-1 human PSCs, ethanol or LPS
  stimulation increases alpha-SMA and Col1a1 mRNA and protein, and neutralizing IL-6
  with antibody partially reverses these increases, indicating that IL-6 autocrine
  signaling amplifies an underlying IL-1/TGFbeta-driven activation program. By comparing
  activation marker levels in EtOH or LPS conditions with and without IL-6 antibody,
  we estimate the fold-change in effective PSC activation attributable to IL-6 autocrine
  feedback, which maps directly onto the multiplicative factor (1 + f_IL6_iCAF * H_IL6_iCAF)
  used for iCAF formation in the QSPIO-PDAC model. Although the markers measured are
  myofibroblastic (alpha-SMA, collagen I), the magnitude of IL-6-dependent amplification
  is taken as a proxy for IL-6-driven enhancement of inflammatory CAF formation in
  PDAC.
key_assumptions:
- Alpha-SMA and Col1a1 mRNA and protein levels in HP-1 cells are proportional to the
  fraction or activity of activated pancreatic stellate cells, so the ratio of these
  markers with and without IL-6 blockade reflects the fold-change in effective activation
  rate.
- IL-6 antibody effectively eliminates IL-6 autocrine signaling in HP-1 cultures,
  such that residual activation in the presence of antibody corresponds to IL-6-independent,
  primarily IL-1/TGFbeta-driven activation (i.e., H_IL6_iCAF approximately 0).
- Control IgG does not affect PSC activation, so EtOH/LPS + IgG accurately reflects
  IL-6-competent conditions and can be compared directly to EtOH/LPS + IL-6 antibody.
- The effective IL-6 Hill terms under EtOH and LPS stimulation (H_IL6_culture_EtOH
  and H_IL6_culture_LPS) can be treated as constant, context-specific nuisance parameters
  that summarize the IL-6 concentration and EC50 relationship in these cultures.
- The magnitude of IL-6 autocrine amplification of PSC activation in alcoholic chronic
  pancreatitis is comparable to IL-6 feedback on iCAF formation in PDAC stroma, after
  accounting for translation uncertainty in the hierarchical prior.
- Measurement errors for qRT-PCR and ELISA-derived bar graphs are approximately normal
  around the reported means, and error bar heights in Figure 4 represent standard
  deviations across 6 replicates.
key_study_limitations:
- The experimental system uses an immortalized human pancreatic stellate cell line
  (HP-1) and monocyte-derived macrophages from non-cancer donors in the context of
  alcoholic chronic pancreatitis, not PDAC; the tumor-derived signals and full PDAC
  microenvironment are absent.
- The readouts used here (alpha-SMA and collagen I) primarily mark myofibroblastic
  activation rather than the IL-6high, alpha-SMAlow iCAF phenotype characterized in
  PDAC, so we assume that the fractional IL-6 contribution to activation is similar
  across PSC/CAF subtypes.
- Ethanol and LPS are pharmacologic triggers that may induce supraphysiologic IL-6
  and TGFbeta levels compared to PDAC tumors, potentially altering the apparent strength
  of IL-6 feedback relative to in vivo conditions.
- Figure-based digitization of bar heights and error bars introduces additional numerical
  uncertainty beyond the experimental variability reported by the authors.
- The submodel does not explicitly include STAT3 or TGFbeta/Smad dynamics, instead
  collapsing these into a single fold-change in activation, which may neglect kinetic
  nuances such as delayed responses and pathway saturation.
primary_data_source:
  doi: 10.1016/j.cyto.2021.155536
  title: Interleukin-6 participates in human pancreatic stellate cell activation and
    collagen I production via TGF-beta1/Smad pathway
  authors:
  - Meifang Zheng
  - Hongyan Li
  - Li Sun
  - David R Brigstock
  - Runping Gao
  year: 2021
  source_tag: Zheng2021
  source_relevance:
    indication_match: related
    indication_match_justification: The study investigates human pancreatic stellate
      cells and macrophages in the context of alcoholic chronic pancreatitis, which
      shares fibrogenic stellate cell biology and IL-6/TGFbeta signaling with PDAC
      but lacks malignant epithelial cells. Thus it is a related pancreatic fibrotic
      indication rather than PDAC itself.
    species_source: human
    species_target: human
    source_quality: primary_human_in_vitro
    perturbation_type: pharmacological
    perturbation_relevance: Ethanol (50 mM), LPS (100 ng/mL), exogenous IL-6 (100
      ng/mL), and pathway inhibitors (anti-IL-6 antibody, STAT3 inhibitor, si-IL-6R,
      si-TGFbeta1) are pharmacologic or genetic perturbations that may not match physiological
      concentrations. Here they are used to establish and quantify the causal contribution
      of IL-6 signaling to PSC activation; the inferred fold-change in activation
      is interpreted as an approximate upper bound on IL-6 autocrine amplification
      under strong stimulation, with additional uncertainty carried in the prior when
      translating to PDAC iCAF formation.
    tme_compatibility: moderate
    tme_compatibility_notes: The in vitro system captures key aspects of pancreatic
      fibrogenesis (activated stellate cells, IL-6/STAT3 and TGFbeta/Smad signaling)
      but lacks the full PDAC tumor microenvironment, including malignant epithelial
      cells, complex immune infiltrates, and desmoplastic architecture. Chronic pancreatitis
      stroma is inflamed and fibrotic but not malignant; IL-6 feedback on PSC activation
      is likely similar in magnitude but may differ quantitatively from IL-6 feedback
      on CAF subsets in PDAC.
    measurement_directness: proxy_observable
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: in_vitro_cell_line
