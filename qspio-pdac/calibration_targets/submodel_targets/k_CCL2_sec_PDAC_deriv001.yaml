calibration:
  parameters:
  - name: k_CCL2_sec
    units: nanomole/cell/day
    nuisance: false
  forward_model:
    data_rationale: Dixit2022 measured CCL2 protein by ELISA in 24-hour culture
      supernatants from 3 primary KPC carcinoma cell lines. The batch accumulation
      over 24h with known cell number gives the per-cell secretion rate.
    submodel_rationale: In the QSP model, k_CCL2_sec is the per-cancer-cell CCL2
      secretion rate (nmol/cell/day). The batch accumulation model converts ELISA
      concentration to secretion rate via conc = k * cells * time / (vol * MW) * 1e6
      (pg to ng scaling).
    type: algebraic
    formula: "CCL2_pgml = k_CCL2_sec * cells * t_days * MW * 1e6 / vol"
    code: "def compute(params, inputs):\n    import numpy as np\n    k = params['k_CCL2_sec']\
      \  # nmol/cell/day\n    cells = inputs['cells_per_well']\n    vol = inputs['well_volume_mL']\n\
      \    t_h = inputs['incubation_time_hours']\n    hpd = inputs['hours_per_day']\n\
      \    MW = inputs['CCL2_MW_gmol']\n    t_days = t_h / hpd\n    # k (nmol/cell/day)\
      \ * cells * t_days = total nmol produced\n    # conc (pg/mL) = total_nmol * MW\
      \ (g/mol) * 1e6 (nmol->pg conversion: 1 nmol = MW ng = MW*1000 pg)\n    # Actually:\
      \ nmol * MW(g/mol) = nmol * (g/mol) = µg. Then µg/mL * 1e6 = pg/mL.\n    # Simpler:\
      \ pg/mL = k * cells * t * MW * 1e3 / vol\n    # (nmol * g/mol = µg; µg/mL *\
      \ 1e6 = pg/mL; but we have nmol not mol)\n    # k (nmol/cell/day) * cells * t(day)\
      \ = total nmol\n    # total_nmol * MW(g/mol) * 1e-9(mol/nmol) * 1e12(pg/g) =\
      \ total_pg\n    # = total_nmol * MW * 1e3 pg\n    # conc = total_pg / vol(mL)\
      \ = k * cells * t * MW * 1e3 / vol\n    conc_pgml = k * cells * t_days * MW *\
      \ 1e3 / vol\n    return conc_pgml\n"
  error_model:
  - name: CCL2_primary_mean
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y"
    units: picogram/milliliter
    uses_inputs:
    - CCL2_primary_1_pgml
    - CCL2_primary_2_pgml
    - CCL2_primary_3_pgml
    - n_primary_cell_lines
    sample_size_input: n_primary_cell_lines
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    vals = np.array([\n        inputs['CCL2_primary_1_pgml'],\n\
      \        inputs['CCL2_primary_2_pgml'],\n        inputs['CCL2_primary_3_pgml'],\n\
      \    ])\n    mean = np.mean(vals)\n    sd = np.std(vals, ddof=1)\n    cv = sd\
      \ / mean\n    sigma_ln = np.sqrt(np.log(1 + cv**2))\n    mu_ln = np.log(mean)\
      \ - sigma_ln**2 / 2\n    return rng.lognormal(mu_ln, sigma_ln / np.sqrt(sample_size),\
      \ n_bootstrap)\n"
    n_bootstrap: 10000
  identifiability_notes: k_CCL2_sec is directly identifiable from the batch
    accumulation model — predicted concentration is linearly proportional to k.
    The main uncertainties are the assumed cell number and volume (not reported),
    and the large inter-cell-line variability (10x range across 3 lines).
experimental_context:
  species: mouse
  system: in_vitro_cell_line
  cell_lines:
  - name: KPC primary carcinoma cells
    species: mouse
    tissue_origin: pancreas
    cell_type: pancreatic ductal adenocarcinoma carcinoma cells
    source: KPC (KrasLSL-G12D/+;Trp53LSL-R172H/+;Pdx1-Cre) mouse tumors
  culture_conditions:
    serum_concentration: 10.0
    serum_concentration_units: percent
    culture_type: 2d_monolayer
    medium: DMEM with 10% FBS
    duration: 24 hours
  indication: pancreatic ductal adenocarcinoma
study_interpretation: Dixit2022 measured CCL2 secretion from 3 matched primary
  KPC carcinoma cell lines by ELISA after 24h culture. The wide range (29-300
  pg/mL) reflects inter-cell-line heterogeneity. Converting to per-cell secretion
  rate with assumed culture geometry provides an order-of-magnitude anchor for
  k_CCL2_sec in the QSP model.
key_assumptions:
- Negligible CCL2 degradation over 24h in culture medium.
- Seeding density of ~1e5 cells/well and 1 mL medium volume (standard 24-well
  plate conditions, not explicitly stated in Dixit2022).
- All cells are actively secreting at a constant rate over 24h.
- Murine KPC carcinoma CCL2 secretion is representative of human PDAC tumor
  cell CCL2 production.
key_study_limitations:
- Only 3 primary cell lines, with 10x variability between them.
- Cell number and medium volume are assumed, not reported.
- KPC mouse carcinoma cells may differ from human PDAC in CCL2 secretion rates.
- CAFs are likely a major CCL2 source in PDAC in vivo; this target only captures
  tumor cell contribution.
