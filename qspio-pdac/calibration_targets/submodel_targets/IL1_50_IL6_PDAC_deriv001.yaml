  - Woest
  - Reynaert
  - Heijink
  - Spierings
  - Brandsma
  - Konigshoff
  - Gosens
  year: 2023
  source_relevance:
    indication_match: proxy
    indication_match_justification: 'MRC-5 human lung fibroblasts used as proxy for PDAC CAFs. IL-1R1 is the same receptor
      across fibroblast types, so the binding EC50 should be similar. However, downstream NF-kB signaling amplification and
      IL-6 transcriptional response may differ between lung fibroblasts and pancreatic stellate cells.

      '
    species_source: human
    species_target: human
    source_quality: primary_human_in_vitro
    perturbation_type: pharmacological
    perturbation_relevance: 'Recombinant IL-1beta treatment at defined concentrations. This directly measures the dose-response
      of IL-1 receptor signaling, applicable to any cell type expressing IL-1R1.

      '
    tme_compatibility: moderate
    tme_compatibility_notes: 'In vitro monoculture lacks TME components. No TGFbeta co-treatment means we measure basal IL1_50,
      not the effective EC50 in the TGFbeta-rich PDAC TME (which is modeled separately by TGFb_50_IL1R1).

      '
    measurement_directness: single_inversion
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: in_vitro_cell_line
