calibration:
  parameters:
  - name: rho_Treg_max
    units: cell/milliliter
    nuisance: false
  forward_model:
    data_rationale: "Brouwer2022 reports FOXP3+ Treg densities per mm^2 across 122\
      \ treatment-naive human PDAC tumors, with known section thickness (4 \xB5m).\
      \ Converting the maximum observed Treg density from cells/mm^2 to cells/mL yields\
      \ an empirical upper bound on tumor-local Treg density without requiring time-course\
      \ information."
    submodel_rationale: In the full QSP model, rho_Treg_max is the carrying capacity
      for local logistic proliferation of tumor-resident Tregs (null -> V_T.Treg with
      factor (1 - V_T.Treg/(rho_Treg_max*V_T + cell))). At steady state in highly
      Treg-infiltrated tumors, the resident Treg density should approach this carrying
      capacity. Therefore, the maximal observed volumetric Treg density across many
      PDAC tumors provides a direct empirical estimate of rho_Treg_max.
    type: algebraic
    formula: Treg_max_density = rho_Treg_max
    code: "def compute(params, inputs):\n    # Carrying capacity rho_Treg_max is interpreted\
      \ as the maximal steady-state\n    # tumor-local Treg density in the PDAC TME.\
      \ For cross-sectional data where\n    # the highest observed Treg density reflects\
      \ near-saturation, the predicted\n    # observable is taken directly as rho_Treg_max.\n\
      \    return params['rho_Treg_max']\n"
  error_model:
  - name: treg_max_density_tumor
    units: cell/milliliter
    uses_inputs:
    - treg_density_max_mL
    - treg_density_q75_mL
    - n_patients
    sample_size_input: n_patients
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['treg_density_max_mL']\n    # Estimate\
      \ an effective CV for upper-tail densities from q75 vs max\n    q75 = inputs['treg_density_q75_mL']\n\
      \    cv = 1.0 - q75 / mean\n    sigma = np.sqrt(np.log(1.0 + cv**2))\n    mu\
      \ = np.log(mean)\n    return rng.lognormal(mu, sigma, n_bootstrap)\n"
    n_bootstrap: 10000
  identifiability_notes: This target equates the predicted maximal tumor-local Treg
    density (rho_Treg_max) with the empirically observed upper-tail Treg density in
    a cohort of 122 treatment-naive PDAC tumors. Because only a single scalar observable
    (an approximate sample maximum) constrains rho_Treg_max, the posterior will primarily
    reflect translation and measurement uncertainty rather than sharp contraction.
    The approach assumes that at least one tumor in the cohort has Treg densities
    close to the carrying capacity implied by the logistic proliferation term in the
    full model; deviations from this assumption (e.g., if all tumors are well below
    saturation due to recruitment limitations) would bias rho_Treg_max downward. No
    additional QSP parameters enter this submodel, so identifiability issues are limited
    to the mapping between observed maximum and true carrying capacity, which is captured
    in the observation uncertainty.
experimental_context:
  species: human
  system: clinical_in_vivo
  indication: pancreatic ductal adenocarcinoma
study_interpretation: "Brouwer2022 quantified FOXP3+ Treg infiltration in a relatively\
  \ large cohort of treatment-naive human PDAC tumors using multispectral immunofluorescence\
  \ on full 4-\xB5m sections, reporting cell densities per mm^2. The digitized distribution\
  \ of Treg densities shows a median of ~36 cells/mm^2, a 75th percentile of ~55 cells/mm^2,\
  \ and a maximum of ~175 cells/mm^2. Converting these 2D densities to volumetric\
  \ densities using the known section thickness yields an estimated maximal Treg density\
  \ of ~4.4e7 cells/mL in the most heavily infiltrated tumors, with typical values\
  \ around 1e7 cells/mL. Interpreting this upper-tail volumetric density as the steady-state\
  \ limit for tumor-local Treg accumulation in PDAC provides a mechanistically consistent\
  \ estimate for the carrying capacity parameter rho_Treg_max in the QSP model."
key_assumptions:
- "FOXP3+ CD3+CD8\u2212 cells identified by multispectral immunofluorescence correspond\
  \ predominantly to bona fide regulatory T cells; contributions from other FOXP3+\
  \ lymphocyte subsets are negligible for density estimation."
- "The tumor microenvironment is approximately homogeneous in the axial (z) dimension\
  \ over the 4-\xB5m section thickness, so converting cells/mm^2 to cells/mm^3 by\
  \ dividing by section thickness is valid."
- One or more tumors in the 122-patient cohort have Treg densities close to the logistic
  carrying capacity implied by rho_Treg_max, so the observed maximum is a reasonable
  proxy for the true maximal steady-state density.
- Treg densities are interpreted as volumetric densities within the combined tumor-stromal
  compartment; no further correction is applied for predominantly stromal vs intraepithelial
  localization.
- Inter-patient heterogeneity in Treg infiltration dominates over technical counting
  noise, allowing uncertainty in the effective upper bound to be approximated from
  the spread between the 75th percentile and maximum densities.
- FOXP3 expression in a subset of cancer cells (reported in ~20% of tumors) has a
  minor impact on the area-normalized Treg density estimates and does not materially
  bias the upper-tail Treg density used for rho_Treg_max.
key_study_limitations:
- The use of a single cross-sectional maximum Treg density to approximate a logistic
  carrying capacity neglects dynamic aspects of recruitment, proliferation, and death
  that may prevent tumors from reaching saturation in vivo.
- Treg densities are measured on 2D sections and converted to 3D volumetric densities
  under an assumption of axial homogeneity; local clustering or stratification in
  the z-dimension is not captured.
- A minority of tumors show FOXP3 expression in cancer cells, which may slightly inflate
  FOXP3+ cell counts relative to pure Treg densities.
- Patients in this cohort underwent surgical resection and may not represent the full
  PDAC population, particularly those with unresectable or metastatic disease where
  immune contexture could differ.
- The estimation of uncertainty for the maximal Treg density relies on distributional
  assumptions (lognormality and CV derived from quantiles) rather than directly reported
  SD/SEM values.
- Spatial heterogeneity within tumors (e.g., peritumoral vs central regions) is averaged
  over a limited number of regions of interest per case, potentially underestimating
  local peak Treg densities.
