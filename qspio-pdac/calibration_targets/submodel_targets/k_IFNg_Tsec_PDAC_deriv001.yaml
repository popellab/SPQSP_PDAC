target_id: k_ifng_tsec_biller2001
inputs:
- name: cell_density_coeff
  value: 3
  units: dimensionless
  input_type: direct_measurement
  source_ref: Biller2001
  source_location: Methods, Cell culture and stimulation
  value_snippet: CD8+ T lymphocytes (3 x 10^6 cells/ml)
- name: cell_density
  value: 3000000
  units: cell/milliliter
  input_type: derived_arithmetic
  source_inputs:
  - cell_density_coeff
  formula: cell_density_coeff * 1000000
  rationale: 3 x 10^6 cells/mL expressed as integer
  source_ref: Biller2001
  source_location: Methods, Cell culture and stimulation
- name: culture_time
  value: 1.0
  units: day
  input_type: direct_measurement
  source_ref: Biller2001
  source_location: Methods, Cell culture and stimulation
  value_snippet: CD8+ T lymphocytes (3 x 10^6 cells/ml) or unseparated PBMCs (3 x 10^6 cells/ml) were cultured for 24 h
- name: ifng_healthy_anticd3_mean
  value: 151
  units: dimensionless
  input_type: direct_measurement
  source_ref: Biller2001
  source_location: Results, page 201
  value_snippet: IFN-g levels in supernatant fluids of CD8+ T lymphocytes from peripheral blood of healthy control subjects
    (359 +/- 51 pg/ml versus 151 +/- 79 pg/ml)
- name: ifng_healthy_anticd3_sem
  value: 79
  units: dimensionless
  input_type: direct_measurement
  source_ref: Biller2001
  source_location: Results, page 201
  value_snippet: IFN-g levels in supernatant fluids of CD8+ T lymphocytes from peripheral blood of healthy control subjects
    (359 +/- 51 pg/ml versus 151 +/- 79 pg/ml)
- name: n_healthy
  value: 7
  units: dimensionless
  input_type: direct_measurement
  source_ref: Biller2001
  source_location: Figure 3 legend
  value_snippet: healthy volunteers (n = 7)
- name: ifng_healthy_pma_mean
  value: 352
  units: dimensionless
  input_type: direct_measurement
  source_ref: Biller2001
  source_location: Results, page 201
  value_snippet: the mean concentration of IFN-g in culture supernatant fluids of CD8+ T lymphocytes of healthy volunteers
    was twice as high as in patients with allergic asthma (352 +/- 104 pg/ml versus 163 +/- 19 pg/ml)
- name: ifng_healthy_pma_sem
  value: 104
  units: dimensionless
  input_type: direct_measurement
  source_ref: Biller2001
  source_location: Results, page 201
  value_snippet: the mean concentration of IFN-g in culture supernatant fluids of CD8+ T lymphocytes of healthy volunteers
    was twice as high as in patients with allergic asthma (352 +/- 104 pg/ml versus 163 +/- 19 pg/ml)
- name: ifng_mw_pg_per_nmol
  value: 17000000
  units: dimensionless
  input_type: reference_value
  rationale: IFNg homodimer MW = 34 kDa, monomer = 17 kDa. ELISA detects monomeric IFNg. 1 nmol = 17,000 ng = 17,000,000 pg.
  source_ref: Biller2001
  source_location: Methods
  value_snippet: Release of IFN-g in culture supernatant fluids was detected by ELISA (pg/ml).
calibration:
  parameters:
  - name: k_IFNg_Tsec
    units: nanomole/cell/day
  forward_model:
    type: algebraic
    formula: IFNg_pg_per_mL = k_IFNg_Tsec * cell_density * culture_time * ifng_mw_pg_per_nmol
    code: "def compute(params, inputs):\n    k = params['k_IFNg_Tsec']\n    density = inputs['cell_density']\n    t = inputs['culture_time']\n\
      \    mw = inputs['ifng_mw_pg_per_nmol']\n    # predicted IFNg concentration in pg/mL\n    # k (nmol/cell/day) * density\
      \ (cells/mL) * t (day) * MW (pg/nmol)\n    pred = k * density * t * mw\n    return {\n        'ifng_anticd3': pred,\n\
      \        'ifng_pma': pred,\n    }\n"
    data_rationale: Purified CD8+ T cells cultured at known density for 24h with anti-CD3 or PMA/ionophore stimulation. IFNg
      in supernatant measured by ELISA. The batch accumulation model (k * density * time * MW) directly predicts pg/mL from
      k_IFNg_Tsec, independent of absolute culture volume.
    submodel_rationale: 'k_IFNg_Tsec in the QSP model is the per-cell IFNg secretion rate by activated CD8 T cells. The Biller
      batch culture system directly measures this: isolated CD8+ cells, known density, 24h accumulation, ELISA readout. Anti-CD3
      stimulation mimics TCR activation.'
  error_model:
  - name: ifng_healthy_anticd3
    units: dimensionless
    uses_inputs:
    - ifng_healthy_anticd3_mean
    - ifng_healthy_anticd3_sem
    - n_healthy
    sample_size_input: n_healthy
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['ifng_anticd3']\n"
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['ifng_healthy_anticd3_mean']\n    sem = inputs['ifng_healthy_anticd3_sem']\n    sd = sem * np.sqrt(sample_size)\n\
      \    return rng.lognormal(np.log(mean), sd / mean / np.sqrt(sample_size), n_bootstrap)\n"
  - name: ifng_healthy_pma
    units: dimensionless
    uses_inputs:
    - ifng_healthy_pma_mean
    - ifng_healthy_pma_sem
    - n_healthy
    sample_size_input: n_healthy
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['ifng_pma']\n"
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['ifng_healthy_pma_mean']\n    sem = inputs['ifng_healthy_pma_sem']\n    sd = sem * np.sqrt(sample_size)\n \
      \   return rng.lognormal(np.log(mean), sd / mean / np.sqrt(sample_size), n_bootstrap)\n"
  identifiability_notes: 'k_IFNg_Tsec is the only free parameter. Two independent stimulation conditions (anti-CD3 and PMA/ionophore)
    provide two data points constraining the same parameter. Anti-CD3 gives 151 pg/mL (k ~ 3.0e-12) and PMA/iono gives 352
    pg/mL (k ~ 6.9e-12). The posterior will reflect this 2-fold range, indicating stimulus-dependent variation. Anti-CD3 is
    more physiologically relevant (TCR-like); PMA/iono represents maximal stimulation.

    '
experimental_context:
  species: human
  system: in_vitro_primary_cells
  cell_lines:
  - name: primary CD8+ T lymphocytes
    source: Peripheral blood from healthy volunteers (n=7), negatively selected by MACS
  cell_types:
  - name: CD8+ T lymphocyte
    source: MACS-sorted, 85 +/- 7% CD8+ purity
  culture_conditions:
    medium: RPMI 1640 + 10% heat-inactivated FCS + 2 mM L-glutamine + 100 IU/ml penicillin + 100 ug/ml streptomycin
    notes: '3e6 cells/mL cultured 24h at 37C, 5% CO2. Anti-CD3: plates coated with

      OKT3 (20 ug/ml) overnight at 4C. PMA/ionophore: PMA (10^-8 M) + calcium

      ionophore A23187 (10^-6 M). Supernatants stored at -70C until ELISA.

      '
study_interpretation: 'Purified human CD8+ T cells secrete 151 +/- 79 pg/mL IFNg in 24h with anti-CD3 stimulation (3e6 cells/mL).
  This corresponds to k ~ 3.0e-12 nmol/cell/day, consistent with the model default of 4e-12. PMA/ionophore stimulation yields
  2x higher secretion (352 pg/mL, k ~ 6.9e-12), representing maximal capacity. The model value sits between these two conditions.

  '
key_assumptions:
- Per-mL batch accumulation model is volume-independent (density x rate x time x MW)
- 24h is sufficient for quasi-linear IFNg accumulation (no significant degradation in culture)
- Anti-CD3 stimulation approximates TCR-driven activation in the TME
- ELISA detects monomeric IFNg (MW = 17 kDa)
- No significant cell death or proliferation during 24h culture (constant cell count)
key_study_limitations:
- Healthy donors, not cancer patients — T cell IFNg capacity may differ in tumor-bearing hosts
- Anti-CD3 is a supraphysiological stimulus compared to peptide-MHC in vivo
- 85% CD8+ purity means ~15% contaminating cells (CD4-CD8- double negatives) may contribute
- SEM with n=7 gives large uncertainty (CV ~52% for anti-CD3 condition)
- Culture volume not explicitly stated — batch_accumulation uses per-mL formulation to avoid this
primary_data_source:
  doi: 10.1046/j.1365-2249.2001.01666.x
  source_tag: Biller2001
  title: 'Interferon-gamma secretion of peripheral blood CD8+ T lymphocytes in patients with bronchial asthma: In vitro stimulus
    determines cytokine production'
  authors:
  - Biller
  - Bade B
  - Matthys H
  - Luttmann W
  - Virchow JC
  year: 2001
  source_relevance:
    indication_match: proxy
    indication_match_justification: 'Healthy human donor CD8+ T cells used to measure IFNg secretion rate. IFNg production
      capacity is an intrinsic T cell property determined by activation state and TCR signal strength, not by tumor indication.
      The per-cell secretion rate from anti-CD3-stimulated healthy donor cells provides a baseline estimate applicable to
      activated CD8 effectors in any solid tumor TME including PDAC.

      '
    species_source: human
    species_target: human
    source_quality: primary_human_in_vitro
    perturbation_type: pharmacological
    perturbation_relevance: 'Anti-CD3 (OKT3) stimulation mimics TCR crosslinking and is a standard

      surrogate for antigen-driven T cell activation. PMA/ionophore bypasses

      the TCR and directly activates PKC/calcium pathways, representing

      maximal stimulation capacity. Both are pharmacological but model

      physiologically relevant activation states.

      '
    tme_compatibility: moderate
    tme_compatibility_notes: 'In vitro monoculture lacks immunosuppressive TME factors (TGFb, IL-10, PD-1, hypoxia) that reduce
      IFNg production in vivo. The measured rate likely represents an upper bound for TME effector T cells. However, the model''s
      k_IFNg_Tsec is the maximal per-cell rate before Hill function modulation by immunosuppressive signals, so the in vitro
      measurement is the correct comparator.

      '
    measurement_directness: direct
    temporal_resolution: endpoint_pair
    experimental_system: in_vitro_primary
tags:
- IFNg
