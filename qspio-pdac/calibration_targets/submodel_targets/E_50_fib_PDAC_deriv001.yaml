calibration:
  parameters:
  - name: E_50_fib
    units: dimensionless
  - name: n_fib
    units: dimensionless
  - name: YAP_max
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 2.565
      sigma: 0.3
  forward_model:
    type: direct_fit
    curve: hill
    ec50: E_50_fib
    n_hill: n_fib
    baseline: '0.0'
    maximum: YAP_max
    data_rationale: 'YAP nuclear/cytoplasmic ratio in PDAC CAFs increases with substrate stiffness in a graded dose-response
      across 3-51 kPa (Young''s modulus). This directly constrains the half-maximal stiffness for fibroblast mechanotransduction
      (E_50_fib) and the Hill coefficient (n_fib) in the QSP model.

      '
    submodel_rationale: 'The QSP model uses H_stiff_fib = stiffness^n_fib / (E_50_fib^n_fib + stiffness^n_fib) to gate fibroblast
      activation via YAP/TAZ mechanotransduction. The model stiffness is dimensionless but kPa-scaled (E_ref ~ 1.0 kPa). The
      experimental G'' values are converted to Young''s modulus E = 3*G'' for incompressible hydrogels. YAP nuclear localization
      is the upstream readout of the mechanotransduction pathway that H_stiff_fib represents.

      '
  error_model:
  - name: YAP_at_soft
    units: dimensionless
    x_input: E_soft_kPa
    uses_inputs:
    - YAP_mean_soft
    - YAP_sd_soft
    - n_obs_soft
    sample_size_input: n_obs_soft
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['YAP_mean_soft']\n    sd = inputs['YAP_sd_soft']\n    return rng.normal(mean, sd / np.sqrt(sample_size), n_bootstrap)\n"
  - name: YAP_at_medium
    units: dimensionless
    x_input: E_medium_kPa
    uses_inputs:
    - YAP_mean_medium
    - YAP_sd_medium
    - n_obs_medium
    sample_size_input: n_obs_medium
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['YAP_mean_medium']\n    sd = inputs['YAP_sd_medium']\n    return rng.normal(mean, sd / np.sqrt(sample_size),\
      \ n_bootstrap)\n"
  - name: YAP_at_stiff
    units: dimensionless
    x_input: E_stiff_kPa
    uses_inputs:
    - YAP_mean_stiff
    - YAP_sd_stiff
    - n_obs_stiff
    sample_size_input: n_obs_stiff
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['YAP_mean_stiff']\n    sd = inputs['YAP_sd_stiff']\n    return rng.normal(mean, sd / np.sqrt(sample_size),\
      \ n_bootstrap)\n"
  identifiability_notes: 'E_50_fib and n_fib are jointly constrained by 3 stiffness conditions spanning a 17-fold range in
    G'' (1-17 kPa, or 3-51 kPa in Young''s modulus). YAP_max is a nuisance parameter with an informative prior (median ~13,
    sigma=0.3) based on qualitative glass control images showing saturated nuclear YAP. This pins the saturation level, allowing
    the 3 data points to identify E_50_fib and n_fib.

    '
experimental_context:
  species: human
  system: in_vitro_cell_line
  cell_types:
  - name: CAF3 (patient-derived PDAC CAF line)
    source: human PDAC tumor (Fishel lab, Indiana University)
    isolation_method: 'Patient-derived CAF line expressing high hyaluronidase levels (HYAL-1, 2, 3).

      GFP-transfected (1303-GFP-49-hT). Cultured in DMEM/high glucose + 10% FBS.

      '
  culture_conditions:
    medium: DMEM/high glucose + 10% FBS
    duration: 7 days on PEG-iEDDA click hydrogels with CRGDS peptide (5 mM)
  indication: pancreatic_ductal_adenocarcinoma
study_interpretation: 'Substrate stiffness drives YAP nuclear translocation in PDAC CAFs in a graded manner across the physiologically
  relevant stiffness range (G'' 1-17 kPa). By D7, all CAFs show nuclear YAP but the degree of activation scales with stiffness.
  Glass controls (D2) show saturated nuclear YAP, confirming the response plateaus above ~50 kPa. This constrains E_50_fib
  and n_fib for the QSP model''s stiffness-mediated fibroblast activation Hill function.

  '
key_assumptions:
- YAP nuc/cyt ratio is a valid proxy for H_stiff_fib (fibroblast mechanical activation)
- D7 approximates steady-state YAP localization (supported by temporal data showing stabilization)
- E = 3*G' conversion valid for incompressible PEG hydrogels (Poisson ratio ~0.5)
- YAP_max ~13 based on qualitative glass control images at D2
- CAF3 cell line mechanosensing is representative of primary PDAC CAFs
key_study_limitations:
- Only 3 stiffness conditions on hydrogels (no glass quantification in bar chart)
- Small n per condition (2 ROIs x 2 gels = 4, only 2 dots digitized)
- Single CAF cell line (CAF3) -- may not represent all CAF subtypes
- 2D hydrogel surface, not 3D encapsulation
- G' to E conversion assumes ideal incompressible hydrogel
primary_data_source:
  doi: 10.1002/cbic.202400955
  source_tag: Chang2025
  title: Click Hydrogels to Assess Stiffness-Induced Activation of Pancreatic Cancer-Associated Fibroblasts and Its Impact
    on Cancer Cell Spreading
  authors:
  - Chang
  - Lin
  year: 2025
  source_relevance:
    indication_match: exact
    indication_match_justification: 'Patient-derived PDAC CAF line (CAF3) cultured on defined-stiffness hydrogels. Directly
      measures YAP mechanotransduction in pancreatic CAFs.

      '
    species_source: human
    species_target: human
    source_quality: primary_human_in_vitro
    perturbation_type: physiological_baseline
    perturbation_relevance: 'Substrate stiffness range (G'' 1-17 kPa, E 3-51 kPa) spans the physiological range from normal
      pancreas (~1-3 kPa) to PDAC stroma (~10-50 kPa).

      '
    tme_compatibility: moderate
    tme_compatibility_notes: '2D PEG hydrogel with CRGDS peptide. Lacks 3D architecture, collagen/HA composition, paracrine
      signals from cancer cells, and other stromal cells. However, YAP mechanotransduction is primarily cell-autonomous (integrin-actin-
      YAP axis), so the EC50 should translate to 3D in vivo conditions.

      '
    measurement_directness: direct
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: in_vitro_cell_line
