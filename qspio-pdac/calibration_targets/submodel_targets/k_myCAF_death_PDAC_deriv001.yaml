calibration:
  parameters:
  - name: k_myCAF_death
    units: 1/day
  forward_model:
    type: algebraic
    formula: "total_HSC_recovery = (total_HSC_fibrosis - alpha_SMA_fibrosis)\n                     + alpha_SMA_fibrosis *\
      \ exp(-k_myCAF_death * t_recovery)\n"
    data_rationale: 'Total HSC fraction at recovery = non-MFB HSCs (assumed constant over 30

      days) + remaining MFBs after exponential decay. The non-MFB fraction is

      total_HSC_fibrosis - alpha_SMA_fibrosis = qHSCs + other non-activated

      stellate cells. The MFB fraction decays at rate k_myCAF_death.

      '
    submodel_rationale: 'In the full PDAC model, k_myCAF_death governs first-order clearance of

      myofibroblastic CAFs: d(myCAF)/dt = ... - k_myCAF_death * myCAF. The

      Kisseleva recovery data constrains the effective rate at which activated

      myofibroblasts are removed from the tissue after the fibrogenic stimulus

      (TGFbeta) is withdrawn.

      '
    code: "def compute(params, inputs):\n    k = params['k_myCAF_death']\n    t = inputs['t_recovery']\n    total_fib = inputs['total_hsc_fibrosis']\n\
      \    asma_fib = inputs['alpha_sma_fibrosis']\n    non_mfb = total_fib - asma_fib\n    mfb_remaining = asma_fib * np.exp(-k\
      \ * t)\n    return non_mfb + mfb_remaining\n"
  error_model:
  - name: total_hsc_at_recovery
    units: percent
    uses_inputs:
    - total_hsc_recovery
    - total_hsc_recovery_sd
    - total_hsc_fibrosis
    - total_hsc_fibrosis_sd
    - alpha_sma_fibrosis
    - alpha_sma_fibrosis_sd
    - n_mice_recovery
    sample_size_input: n_mice_recovery
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    # Bootstrap\
      \ from the recovery total HSC measurement\n    mean_rec = inputs['total_hsc_recovery']\n    sd_rec = inputs['total_hsc_recovery_sd']\n\
      \    # Also propagate uncertainty in the fibrosis starting values\n    # which affect the forward model prediction\n\
      \    mean_fib = inputs['total_hsc_fibrosis']\n    sd_fib = inputs['total_hsc_fibrosis_sd']\n    mean_asma = inputs['alpha_sma_fibrosis']\n\
      \    sd_asma = inputs['alpha_sma_fibrosis_sd']\n    # Draw recovery observations from normal(mean, sd)\n    # truncated\
      \ at 0 (can't have negative % of liver cells)\n    samples = rng.normal(mean_rec, sd_rec, size=n_bootstrap)\n    return\
      \ np.maximum(samples, 0)\n"
  identifiability_notes: 'k_myCAF_death is identified from the drop in total HSC fraction during

    recovery, attributed to MFB elimination. The forward model prediction

    depends on the starting MFB fraction (alpha-SMA at fibrosis, 8+/-1.5%)

    and the non-MFB fraction (6.3% = 14.3 - 8.0). The main degeneracy is

    between k_myCAF_death and any slow change in the non-MFB population, but

    over 30 days this is small. The effective k absorbs both apoptosis and

    inactivation pathways. The paper''s separate data on iHSC persistence

    (38+/-8% of HSCs) and apoptosis (2.6+/-0.7% caspase-3+ at day 7) could

    further decompose this rate but are not used in this target.

    '
