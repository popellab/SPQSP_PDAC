extraction_model: claude-opus-4-6
extraction_reasoning_effort: high
study_interpretation: 'Kisseleva et al. (2012) used genetic labeling (Col-alpha1(I)-GFP reporter

  mice and Cre-loxP fate mapping) to track the fate of hepatic stellate cells

  (HSCs) during CCl4-induced liver fibrosis and subsequent recovery. After 2

  months of CCl4 treatment, 98+/-2% of HSCs were activated (alpha-SMA+) and

  total HSCs increased from 10.6+/-0.8% to 14.3+/-1.5% of liver cells. After

  1 month of recovery (CCl4 cessation), alpha-SMA+ myofibroblasts completely

  disappeared, while total HSCs dropped to 5.6+/-1.8%. A fraction of former

  MFBs persisted as inactivated HSCs (iHSCs, 38+/-8% of Desmin+ cells).


  The disappearance of alpha-SMA+ cells during recovery constrains the

  effective elimination rate of activated myofibroblasts. In our model,

  k_myCAF_death governs the death/clearance of activated CAFs. The forward

  model predicts total HSC fraction at recovery as a function of MFB decay

  rate, attributing the excess HSC loss beyond baseline to MFB elimination.

  '
key_assumptions:
- 'Hepatic stellate cell dynamics during fibrosis recovery are representative

  of CAF dynamics after tumor eradication or therapy-induced stroma remodeling

  in PDAC. HSCs and PSCs share activation/deactivation biology.

  '
- 'During the 30-day recovery period, the non-MFB HSC population (quiescent

  HSCs + newly formed iHSCs) remains approximately constant. This is

  reasonable because qHSC renewal is slow (half-life ~75 days per Bougueon)

  and iHSC generation partially compensates for qHSC turnover.

  '
- 'The alpha-SMA+ fraction at fibrosis (8+/-1.5% of liver cells) represents

  the initial MFB pool that decays during recovery. The decay follows

  first-order kinetics with rate constant k_myCAF_death.

  '
- 'k_myCAF_death in our model absorbs both true apoptosis and inactivation

  (MFB -> iHSC), since the model does not have a separate iHSC state.

  The effective rate captures total removal from the alpha-SMA+ pool.

  '
key_study_limitations:
- 'Mouse liver fibrosis (CCl4 model), not human PDAC. The recovery dynamics

  after CCl4 cessation may differ from CAF dynamics in a tumor-bearing host

  where residual paracrine signals persist.

  '
- 'The "completely disappeared" description for alpha-SMA at recovery is

  qualitative. The actual residual MFB fraction is not quantified with a

  detection limit, introducing uncertainty in the endpoint observation.

  '
- 'The 30-day recovery period captures the combined effect of apoptosis,

  senescence, and inactivation. These processes have different kinetics but

  cannot be separated from the total HSC count data alone.

  '
- 'CCl4 cessation abruptly removes the fibrogenic stimulus. In PDAC, CAF

  elimination occurs in the presence of ongoing (though potentially reduced)

  tumor-derived signals, which may slow CAF clearance.

  '
