calibration:
  parameters:
  - name: k_mAPC_death
    units: 1/day
    nuisance: false
  forward_model:
    data_rationale: Tomura2014 photoconverted all cells in the inguinal lymph node
      of KikGR mice and tracked the decay of photoconverted (KikGR-red) skin-derived
      DCs and subsets over time. Exponential fits to these decay curves yielded T50,
      T90, and T95 values, which directly report the in situ residence time (lifespan)
      of mature migratory skin-derived DCs within the LN under steady-state conditions.
    submodel_rationale: In the QSPIO-PDAC model, k_mAPC_death is a first-order death
      rate applied uniformly to all mature APC species (mcDC1 and mcDC2) in tumor
      and LN compartments. Under steady state in the LN with negligible egress of
      migratory DCs to downstream nodes (as shown in Tomura2014), the disappearance
      of photoconverted mature DCs is governed primarily by first-order death. Therefore,
      the reported T90 values for skin-derived DCs in the LN can be mapped to k_mAPC_death
      via the analytic relationship T90 = ln(10)/k_mAPC_death.
    type: algebraic
    formula: T90 = ln(10) / k_mAPC_death (time for 90% replacement of mature migratory
      DCs under first-order loss); outputs in hours to match Tomura2014.
    code: "def compute(params, inputs):\n    import numpy as np\n    k = params['k_mAPC_death']\
      \  # 1/day\n    # First-order loss: fraction remaining f = exp(-k * t). T90\
      \ is when f = 0.1.\n    # Solve 0.1 = exp(-k * T90_day) -> T90_day = ln(10)/k.\n\
      \    T90_day = np.log(10.0) / k\n    T90_h = 24.0 * T90_day\n    # In the full\
      \ QSP model, the same k_mAPC_death applies to all mature APC subsets\n    #\
      \ (mcDC1 and mcDC2 in tumor and LN). Here we treat Tomura2014's total skin-derived\n\
      \    # DCs and CD103- dermal DCs as two noisy measurements of a common underlying\n\
      \    # mature APC death rate, so they share the same predicted T90.\n    return\
      \ {\n        'T90_total': T90_h,\n        'T90_CD103neg': T90_h,\n    }\n"
  error_model:
  - name: T90_total_skin_derived_DCs
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    # y is the dict returned by the algebraic\
        \ forward model.\n    return y['T90_total']\n"
    units: hour
    uses_inputs:
    - T90_total_skin_derived_DCs_h
    - n_T90_total_skin_derived_DCs
    - T90_error_scale_skin_derived_DCs
    sample_size_input: n_T90_total_skin_derived_DCs
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean_h = inputs['T90_total_skin_derived_DCs_h']\n\
      \    n = int(sample_size)\n    cv = inputs['T90_error_scale_skin_derived_DCs']\n\
      \    sigma_ln = np.sqrt(np.log(1.0 + cv**2))\n    mu_ln = np.log(mean_h) - (sigma_ln**2)\
      \ / 2.0\n    return rng.lognormal(mu_ln, sigma_ln / np.sqrt(n), n_bootstrap)\n"
    n_bootstrap: 10000
  - name: T90_CD103neg_DDCs
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['T90_CD103neg']\n"
    units: hour
    uses_inputs:
    - T90_CD103neg_DDCs_h
    - n_T90_CD103neg_DDCs
    - T90_error_scale_skin_derived_DCs
    sample_size_input: n_T90_CD103neg_DDCs
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean_h = inputs['T90_CD103neg_DDCs_h']\n    n =\
      \ int(sample_size)\n    cv = inputs['T90_error_scale_skin_derived_DCs']\n  \
      \  sigma_ln = np.sqrt(np.log(1.0 + cv**2))\n    mu_ln = np.log(mean_h) - (sigma_ln**2)\
      \ / 2.0\n    return rng.lognormal(mu_ln, sigma_ln / np.sqrt(n), n_bootstrap)\n"
    n_bootstrap: 10000
  identifiability_notes: "This target constrains k_mAPC_death using two related measurements\
    \ of mature migratory DC lifespan in murine skin-draining LNs: T90 for total skin-derived\
    \ DCs (~66 h) and for CD103\u2212 dermal DCs (~53 h). Under the assumption of\
    \ first-order loss dominated by apoptosis and negligible egress, both observables\
    \ are algebraically linked to a single parameter via T90 = ln(10)/k_mAPC_death.\
    \ The two T90 estimates are treated as noisy measurements of the same underlying\
    \ quantity, so they jointly refine the posterior for k_mAPC_death but cannot distinguish\
    \ potential heterogeneity between DC subsets. The main structural uncertainty\
    \ is the possible contribution of non-apoptotic loss (e.g., rare onward migration),\
    \ which is implicitly absorbed into the effective death rate. Additional time-resolved\
    \ counts or independent measurements of DC egress from LNs would be required to\
    \ separately identify death vs. migration components."
experimental_context:
  species: mouse
  system: animal_in_vivo
  cell_types:
  - name: skin-derived dendritic cells
    phenotype: "CD11c+ MHC IIhigh migratory DCs from skin (including CD103\u2212 dermal\
      \ DCs, CD103+ DCs, and Langerhans cells) present in skin-draining lymph nodes"
    isolation_method: Endogenous LN-resident DCs tracked in situ using KikGR photoconversion;
      analyzed by flow cytometry from inguinal LNs.
    source: C57BL/6 background KikGR knock-in mice (ROSA26-loxP-stop-loxP-KikGR crossed
      with CAG-Cre).
  indication: normal skin-draining lymph node (no tumor)
study_interpretation: "Tomura2014 used KikGR knock-in mice to photoconvert all cells\
  \ within the inguinal lymph node and then quantified the decay of photoconverted\
  \ (KikGR-red) skin-derived dendritic cells over time. Exponential fits to the decline\
  \ in KikGR-red fractions yielded T50, T90, and T95 values interpreted as replacement\
  \ times (lifespans) of mature migratory DCs within the LN. They further demonstrated\
  \ that these cells do not appreciably migrate to downstream LNs and instead undergo\
  \ apoptosis in situ, especially CD103\u2212 dermal DCs. Under these conditions,\
  \ the replacement time T90 directly reflects a first-order death process for mature\
  \ migratory DCs. Mapping T90_total \u2248 66 h and T90_CD103\u2212 \u2248 53 h onto\
  \ the QSP model via T90 = ln(10)/k_mAPC_death provides a physiologically grounded\
  \ estimate of the mature APC death rate that applies to both mcDC1 and mcDC2 in\
  \ the tumor-draining LN, and by extension to tumor-resident mature APCs in the absence\
  \ of better data."
key_assumptions:
- Loss of photoconverted skin-derived DCs from the inguinal LN is dominated by apoptosis
  rather than by recirculation or onward migration, so the exponential replacement
  time reflects an effective death rate.
- Mature skin-derived DCs in murine skin-draining LNs have similar first-order death
  kinetics to mature cDC1/cDC2 in human PDAC-draining LNs and tumor tissue, up to
  species and tissue-context differences captured via increased uncertainty.
- First-order kinetics (single exponential decay) provide an adequate description
  of mature DC loss within the LN, as assumed in Tomura2014 when fitting T50/T90/T95.
- The reported T90 values are treated as point estimates with an approximate 30% relative
  error scale to capture biological and fitting variability in the absence of explicit
  SD/SEM.
- "The common QSP parameter k_mAPC_death reasonably approximates the average death\
  \ rate across skin-derived DC subsets, even though Tomura2014 observed somewhat\
  \ different lifespans for CD103\u2212 DDCs, CD103+ DDCs, and LCs."
key_study_limitations:
- Data are from murine skin-draining lymph nodes under homeostatic conditions, whereas
  the QSP model targets human PDAC tumor-draining nodes and tumor-resident APCs; stromal
  and inflammatory context may alter DC lifespan.
- Tomura2014 focuses on migratory skin-derived DCs (Langerhans cells and dermal DCs)
  rather than classical LN-resident DC subsets; the QSP model lumps all mature APCs
  under a single death rate parameter.
- T90 values are derived from exponential fits to pooled time-course data and reported
  without dispersion measures, so uncertainty must be approximated rather than directly
  extracted.
- The mapping assumes negligible egress of mature migratory DCs from the photoconverted
  LN; while Tomura2014 shows minimal recirculation to downstream LNs, rare non-apoptotic
  loss cannot be completely excluded.
- Skin-derived DC dynamics in cutaneous LNs may differ quantitatively from those in
  PDAC-draining LNs exposed to chronic tumor antigens and systemic therapy, so the
  inferred k_mAPC_death may over- or underestimate death rates in the PDAC setting.
primary_data_source:
  doi: 10.1038/srep06030
  title: Tracking and quantification of dendritic cell migration and antigen trafficking
    between the skin and lymph nodes
  authors:
  - Tomura
  year: 2014
  source_tag: Tomura2014
  source_relevance:
    indication_match: proxy
    indication_match_justification: The study examines skin-derived dendritic cells
      in murine skin-draining lymph nodes, not APCs in human PDAC-draining nodes or
      tumors. However, the basic first-order kinetics of mature migratory DC loss
      within lymph nodes are expected to be similar across tissues and disease contexts,
      so these data can serve as a mechanistic proxy for mature APC death rates in
      PDAC.
    species_source: mouse
    species_target: human
    source_quality: primary_animal_in_vivo
    perturbation_type: physiological_baseline
    perturbation_relevance: The T90 measurements used here are obtained from steady-state
      photoconversion experiments without exogenous pharmacologic perturbations, reflecting
      near-physiological turnover of mature migratory DCs in vivo.
    tme_compatibility: moderate
    tme_compatibility_notes: Skin-draining lymph nodes in healthy mice differ from
      PDAC tumor-draining nodes in terms of chronic antigen load, systemic inflammation,
      and stromal remodeling, but the microenvironment within the LN parenchyma where
      mature DCs reside and die is still broadly comparable. We therefore expect some
      quantitative differences in death rates but not order-of-magnitude shifts.
    measurement_directness: single_inversion
    temporal_resolution: timecourse
    experimental_system: animal_in_vivo
