target_id: k_stroma_support_hwang2008_PDAC_deriv001
study_interpretation: |
  Hwang et al. 2008 performed orthotopic co-injection experiments
  combining BxPC3 PDAC cells and human pancreatic stellate cells
  (HPSCs) at varying tumor:stroma ratios, measuring tumor mass at
  8 weeks (Fig 6C). At a fixed cancer cell input of 0.5e6 BxPC3, varying
  HPSC content from 0 to 5x the cancer cell number produced a clear
  dose-response in pancreatic mass:

    cancer:stroma  HPSC count   pancreas weight (g, mean +/- SE)
    1:0            0            0.22 +/- 0.01    (baseline pancreas, 0% tumor formation)
    1:1            0.5e6        0.46 +/- 0.18    (57% tumor formation)
    1:5            2.5e6        0.82 +/- 0.22    (100% tumor formation)

  In the QSP-IO PDAC model, k_stroma_support is the per-CAF
  contribution to cancer carrying capacity:

    C_max = (V_T.K + k_stroma_support * aPSC_total) * (1 - phi/(phi+phi_50))

  In an orthotopic model with no pre-existing vasculature
  (V_T.K_eff ~ 0; supported by the 0% tumor incidence at 0.5e6 BxPC3
  alone) and minimal initial collagen accumulation (ECM saturation
  factor ~ 1), C_max simplifies to k_stroma_support * HPSC_count.
  Hwang's tumor-mass dose-response therefore directly anchors the
  product (k_stroma_support * tissue_density_per_cell) — combined
  with the standard cancer cell volume and tumor tissue density,
  this constrains k_stroma_support.
key_assumptions:
- |
  Cancer cells reach carrying capacity by 8 weeks. BxPC3 doubling
  time in vitro is ~30 h; in 56 days, even with 50%-of-in-vitro
  effective doubling time and ECM constraints, multiple doublings
  occur. Pancreatic mass plateauing at ~0.5-0.8 g consistent with
  a saturated carrying-cap regime.
- |
  V_T.K_eff = 0 in this orthotopic model. Supported by 0% tumor
  formation at 0.5e6 BxPC3 alone; cancer requires HPSC support to
  establish in nude mouse pancreas. (At 1.0e6 BxPC3 alone, 43%
  formation suggests V_T.K_eff scales with cancer cell number, but
  the dominant signal at 0.5e6 BxPC3 is HPSC-mediated.)
- |
  Initial collagen mass is negligible at injection time (no ECM in
  cell suspension), so phi_collagen << phi_col_50_Kmax for the
  early growth phase. By 8 weeks, ECM has accumulated, so the
  ECM-saturation factor (1 - phi/(phi+phi_50)) attenuates C_max.
  Assumed factor 0.75 (geometric mean from a model phi range 0.3-0.7
  saturating against phi_col_50_Kmax ~ 2.0).
- |
  Tumor mass is dominated by cell + ECM volume; assume tissue density
  ~1.0 g/mL. Cancer cell volume = 2.572e-9 mL (17 um diameter sphere).
  CAF cell volume averaged over subtypes ~3000 um^3 = 3e-9 mL.
- |
  HPSC count is preserved from injection to endpoint. HPSCs are
  generally non-proliferative in the model (k_X_prolif rates are
  bounded by carrying caps that themselves depend on cancer count);
  in the early orthotopic phase, HPSC count ~ HPSC_injected.
- |
  Standard error converts to standard deviation via SD = SE * sqrt(n).
  Sample size per arm not exhaustively reported in main text;
  Methods describe ~14 mice per group based on figure scatter.
key_study_limitations:
- |
  BxPC3 is a poorly differentiated PDAC line; growth dynamics may
  differ from primary PDAC. Cell-line tumors are typically more
  aggressive than patient-derived equivalents.
- |
  HPSCs are immortalized via SV40 + hTERT for repeated passaging;
  the immortalized cells may differ from primary CAFs in stromal
  support function. Hwang noted similar in vitro behavior but in
  vivo equivalence is not formally established.
- |
  Pancreas weight includes pre-existing pancreatic tissue (host
  parenchyma); the 0.22 g baseline subtracts approximately for this
  but the orthotopic technique doesn't allow exact tumor-only mass.
- |
  Two informative data points (1:1 and 1:5) — supports a single-parameter
  fit but cannot resolve nonlinearity (Hwang shows sublinear scaling
  consistent with carrying-cap saturation, but the QSP model's linear
  C_max formula will be biased under joint inference with other targets).
experimental_context:
  species: mouse
  system: animal_in_vivo
  cell_lines:
  - name: BxPC3
    source: ATCC
  - name: HPSC (human pancreatic stellate cells)
    source: resected human PDAC primary tissue, immortalized with SV40 + hTERT
  cell_types:
  - name: BxPC3 (cancer)
    source: ATCC
    isolation_method: in vitro adherent culture
  - name: HPSC (stromal)
    source: human PDAC explants, immortalized
    isolation_method: outgrowth + immortalization
  culture_conditions:
    medium: DMEM + 10% FCS for HPSC; standard for BxPC3
    duration: 8 weeks orthotopic in nude mice (athymic)
  indication: PDAC
primary_data_source:
  doi: 10.1158/0008-5472.CAN-07-5714
  source_tag: Hwang2008
  title: |
    Cancer-Associated Stromal Fibroblasts Promote Pancreatic Tumor
    Progression
  authors:
  - Hwang
  year: 2008
  source_relevance:
    indication_match: proxy
    indication_match_justification: |
      Mouse orthotopic xenograft of human PDAC cells + HPSCs; closest
      experimental design available for measuring cancer-cell
      carrying-capacity dependence on CAF abundance with controlled
      ratios. Translates to PDAC mechanism but inherits in vivo / in
      vitro / cell-line differences from primary human PDAC.
    species_source: mouse
    species_target: human
    source_quality: primary_animal_in_vivo
    perturbation_type: physiological_baseline
    perturbation_relevance: |
      No drug perturbation. Engineered tumor:stroma ratio is a
      physiological gradient probing the carrying-capacity dependence
      that the model parameter encodes.
    tme_compatibility: moderate
    tme_compatibility_notes: |
      Nude mouse orthotopic xenograft lacks adaptive immune component
      that's present in primary human PDAC. The cancer carrying-cap
      dependence on CAF abundance is the parameter being probed and
      is preserved in this setting; immune-mediated effects on cancer
      are confounded but secondary for k_stroma_support magnitude.
    measurement_directness: single_inversion
    temporal_resolution: endpoint_pair
    experimental_system: animal_in_vivo
