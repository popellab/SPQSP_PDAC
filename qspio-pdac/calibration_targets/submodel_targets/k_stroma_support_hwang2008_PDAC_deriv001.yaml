calibration:
  parameters:
  - name: k_stroma_support
    units: dimensionless
  - name: alpha_endpoint_mass
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 0.0
      sigma: 0.7
  forward_model:
    type: algebraic
    formula: |
      Tumor weight (g) at 8 weeks =
        pancreas_weight_basal +
        alpha_endpoint_mass *
          (k_stroma_support * HPSC_count + bxpc3_count_initial) *
          cancer_cell_volume_mL * tissue_density_g_per_mL *
          ecm_saturation_factor +
        HPSC_count * caf_cell_volume_mL * tissue_density_g_per_mL
    code: |
      def compute(params, inputs):
          import numpy as np
          k_ss = params['k_stroma_support']
          alpha = params['alpha_endpoint_mass']
          v_c = inputs['cancer_cell_volume_mL']
          v_caf = inputs['caf_cell_volume_mL']
          ecm = inputs['ecm_saturation_factor']
          rho = inputs['tissue_density_g_per_mL']
          w_basal = inputs['pancreas_weight_basal']
          hpsc_1to1 = inputs['hpsc_count_1to1']
          hpsc_1to5 = inputs['hpsc_count_1to5']
          bxpc3 = inputs['bxpc3_count_initial']
          # Cancer cell endpoint count: alpha * C_max where
          #   C_max = (V_T.K_eff + k_stroma_support * HPSC_count) * ECM_factor
          # alpha captures the fraction of carrying capacity actually
          # reached at 8 weeks (lumps growth-rate-vs-time efficiency).
          # In orthotopic without prior vasculature, V_T.K_eff ~ 0;
          # bxpc3 contributes a small floor via its initial seeding.
          c_max_1to1 = (k_ss * hpsc_1to1 + bxpc3) * ecm
          c_max_1to5 = (k_ss * hpsc_1to5 + bxpc3) * ecm
          # Tumor weight = basal + cancer mass + HPSC mass
          w_1to1 = w_basal + alpha * c_max_1to1 * v_c * rho + hpsc_1to1 * v_caf * rho
          w_1to5 = w_basal + alpha * c_max_1to5 * v_c * rho + hpsc_1to5 * v_caf * rho
          return {
              'pancreas_weight_1to1': w_1to1,
              'pancreas_weight_1to5': w_1to5,
          }
    data_rationale: |
      The Hwang dose-response data informs the linear scaling of cancer
      carrying capacity with CAF count. With two data points (1:1 and
      1:5 ratios at fixed cancer cell input), the parameter pair
      (k_stroma_support, alpha_endpoint_mass) is identifiable: the
      slope (W_1to5 - W_1to1)/(HPSC_1to5 - HPSC_1to1) sets the
      product alpha * k_stroma_support, and the intercept conditions
      alpha against the cancer-only seeding via the bxpc3_count_initial
      term.
    submodel_rationale: |
      The QSP model's cancer carrying capacity formula
      C_max = (V_T.K + k_stroma_support * aPSC_total) * (1 - phi/(phi+phi_50))
      reduces to k_stroma_support * aPSC_total in this orthotopic
      setting (no pre-existing vasculature, ECM saturation absorbed
      into the assumed factor). The Hwang dose-response is the cleanest
      direct probe of this term's slope. alpha_endpoint_mass is a
      nuisance lumping growth-rate-to-saturation efficiency at 8 weeks.
  error_model:
  - name: pancreas_weight_1to1
    units: gram
    uses_inputs:
    - pancreas_weight_1to1
    - pancreas_weight_1to1_se
    sample_size_input: stroma_ratio_1to1
    observable:
      type: custom
      code: |
        def compute(t, y, y_start):
            return y['pancreas_weight_1to1']
    observation_code: |
      def derive_observation(inputs, sample_size, rng, n_bootstrap):
          import numpy as np
          mean = inputs['pancreas_weight_1to1']
          se = inputs['pancreas_weight_1to1_se']
          # SE is the standard error of the population mean — directly
          # the spread we want to bootstrap. Lognormal because tumor
          # mass is positive and CV (~0.4) is in the regime where
          # the lognormal correction matters.
          cv = se / mean
          sigma_ln = np.sqrt(np.log(1 + cv**2))
          mu_ln = np.log(mean) - sigma_ln**2 / 2
          return rng.lognormal(mu_ln, sigma_ln, n_bootstrap)
  - name: pancreas_weight_1to5
    units: gram
    uses_inputs:
    - pancreas_weight_1to5
    - pancreas_weight_1to5_se
    sample_size_input: stroma_ratio_1to5
    observable:
      type: custom
      code: |
        def compute(t, y, y_start):
            return y['pancreas_weight_1to5']
    observation_code: |
      def derive_observation(inputs, sample_size, rng, n_bootstrap):
          import numpy as np
          mean = inputs['pancreas_weight_1to5']
          se = inputs['pancreas_weight_1to5_se']
          cv = se / mean
          sigma_ln = np.sqrt(np.log(1 + cv**2))
          mu_ln = np.log(mean) - sigma_ln**2 / 2
          return rng.lognormal(mu_ln, sigma_ln, n_bootstrap)
  identifiability_notes: |
    Two QSP/nuisance parameters (k_stroma_support, alpha_endpoint_mass),
    two error model entries. Identifiable by construction: the slope
    (W_1to5 - W_1to1) constrains the product alpha * k_stroma_support,
    and the intercept (relative to bxpc3-only seeding mass) breaks the
    degeneracy. Joint inference with f_stroma_max submodel target on
    Ogawa 2021 area data sharpens the cancer:CAF coupling further.
