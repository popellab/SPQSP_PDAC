target_id: rho_collagen_valderrama1991_PDAC_deriv001
study_interpretation: |
  Valderrama et al. 1991 (Int J Pancreatol 10:23-29) measured collagen
  content in n=11 control human pancreas specimens (postmortem from
  non-alcoholic adults with no pancreatic pathology). Their colorimetric
  method uses Sirius red F3B + Fast green FCF on paraffin-embedded
  sections, with absorbance read spectrophotometrically and converted to
  collagen mass using the Lopez de Leon-Rojkind 1985 calibration
  (37 OD/mg collagen for Sirius red, 3 OD/mg protein for Fast green).
  Reported control-group collagen content: 89.1 +/- 11.6 ug collagen /
  mg total protein (mean +/- SD, n=11).

  In the QSP-IO PDAC model, rho_collagen [g/mL] is the mass-to-volume
  conversion for collagen contribution to V_T: phi_collagen =
  V_T.collagen / (V_T * rho_collagen). It defines the "scaffold-equivalent
  packing density" — the implicit collagen mass density of the volume
  region phi_collagen represents in V_T. Combined with phi_col_ref
  (the normal-pancreas reference fraction), they jointly determine the
  predicted collagen-mass density in normal pancreas tissue.

  Valderrama's colorimetric measurement constrains the joint product
  phi_col_ref * rho_collagen / protein_per_wet_volume. Joint inference
  with the existing phi_col_ref-constraining targets (Wolf 2013 for
  d_pore_ref, Rubiano 2018 for E_ref+n_stiff, Grizzi 2019 for
  Sirius-red area) breaks the degeneracy and produces a posterior on
  rho_collagen.
key_assumptions:
- |
  Valderrama specimens are representative of normal human pancreas
  in vivo. Postmortem fixation may alter water content but not the
  protein-mass measurements (Sirius red binds collagen protein
  irrespective of hydration state).
- |
  Pancreas total protein per wet tissue volume is treated as a
  nuisance parameter with a literature-anchored prior. Pancreatic
  tissue is ~75% water (Noblet 2018, in reference_values.yaml) with
  the remaining ~25% solids being roughly half protein, giving
  protein-per-wet-mass ~0.10-0.15 and (with wet density ~1.04 g/mL)
  protein-per-wet-volume ~0.10-0.16 g/mL.
- |
  The QSP convention is "scaffold-equivalent including void" (V_T
  collagen volume = total collagen mass / fibrillar packing density).
  Valderrama's Sirius-red colorimetric is a direct mass measurement
  of collagen protein, so it is independent of packing convention —
  it constrains the product phi_col_ref * rho_collagen, with the
  individual values resolved by the morphometric / pore / stiffness
  joint inference.
- |
  Morphometric arm of Valderrama (Masson trichrome) is NOT used as
  a second observable here because Masson trichrome captures broader
  connective tissue (collagen + reticular fibers + basement membrane),
  not Sirius-red-specific fibrillar collagen. The Sirius-red-specific
  morphometric anchor lives in the separate Grizzi 2019 phi_col_ref
  submodel target (2.23 +/- 0.28% normal). Mixing conventions in one
  target would introduce a method-factor nuisance that is not
  literature-anchored.
key_study_limitations:
- |
  n=11 control specimens. Population-level uncertainty is limited
  by patient count.
- |
  Postmortem material rather than fresh-frozen surgical resection.
  Sirius-red colorimetry is robust to fixation, but absolute collagen
  values can shift +/- 10% with paraffin embedding artifacts.
- |
  Inter-assay CV of 7% reported (intra-assay 4.7%) — methodological
  variability is much smaller than between-patient biological
  variability (CV = 11.6/89.1 = 13%), so reported SD is dominated
  by biology, which is the right denominator for prior calibration.
