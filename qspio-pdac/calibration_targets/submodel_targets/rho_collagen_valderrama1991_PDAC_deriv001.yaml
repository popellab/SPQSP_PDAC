calibration:
  parameters:
  - name: phi_col_ref
    units: dimensionless
  - name: rho_collagen
    units: gram/milliliter
  - name: protein_per_wet_volume_pancreas
    units: gram/milliliter
    nuisance: true
    prior:
      distribution: lognormal
      mu: -1.966112856372833
      sigma: 0.5
  forward_model:
    type: algebraic
    formula: |
      c_mass [ug collagen / mg total protein] = (phi_col_ref * rho_collagen) /
                                                 protein_per_wet_volume_pancreas * 1000
    code: |
      def compute(params, inputs):
          # Predicted Valderrama colorimetric reading: ug collagen / mg total protein.
          # Reasoning:
          #   collagen_mass_per_V_T_volume = phi_col_ref * rho_collagen [g/mL]
          #   protein_mass_per_V_T_volume = protein_per_wet_volume_pancreas [g/mL]
          #   ratio (mg/mg, dimensionless) = collagen_per_V / protein_per_V
          #   convert mg/mg -> ug/mg: multiply by 1000
          phi = params['phi_col_ref']
          rho = params['rho_collagen']
          ppwv = params['protein_per_wet_volume_pancreas']
          return phi * rho / ppwv * 1000.0
    data_rationale: |
      The Sirius-red colorimetric reading is the ratio of collagen
      protein mass to total protein mass per unit tissue. In the QSP
      model, that ratio = (phi_col_ref * rho_collagen) /
      protein_per_wet_volume_pancreas. The 1000 factor converts
      mg/mg to ug/mg to match the Valderrama units.
    submodel_rationale: |
      rho_collagen and phi_col_ref both appear in the model's V_T
      volume rule. Their product determines the implied collagen-mass
      density in V_T per unit volume; Valderrama's data anchors this
      product. Joint inference with phi_col_ref-constraining targets
      (Wolf 2013, Rubiano 2018, Grizzi 2019) resolves the individual
      values.
  error_model:
  - name: c_mass_normal_pancreas
    units: dimensionless
    uses_inputs:
    - c_mass_normal_mean
    - c_mass_normal_sd
    - n_normal_specimens
    sample_size_input: n_normal_specimens
    observation_code: |
      def derive_observation(inputs, sample_size, rng, n_bootstrap):
          import numpy as np
          mean = inputs['c_mass_normal_mean']
          sd = inputs['c_mass_normal_sd']
          # Population-level mean of ug collagen / mg total protein
          # in normal pancreas. CV = 11.6/89.1 ~ 13% (biology-dominated;
          # methodological CV is 4.7-7%). Lognormal bootstrap because
          # the quantity is positive and CV sits in the regime where
          # the lognormal correction matters.
          cv = sd / mean
          sigma_ln = np.sqrt(np.log(1 + cv**2))
          mu_ln = np.log(mean) - sigma_ln**2 / 2
          return rng.lognormal(mu_ln, sigma_ln / np.sqrt(sample_size), n_bootstrap)
  identifiability_notes: |
    Single observable (c_mass_normal) constrains the product
    phi_col_ref * rho_collagen / protein_per_wet_volume_pancreas.
    The nuisance prior on protein_per_wet_volume_pancreas (lognormal,
    mu=log(0.14), sigma=0.25, anchored to pancreas total-protein
    fraction ~0.10-0.18 g/mL via Noblet 2018 dry-fraction + standard
    pancreatic protein composition) breaks one dimension of the
    degeneracy. The product phi_col_ref * rho_collagen is then
    constrained, with individual values disentangled by the
    phi_col_ref-only targets (Wolf 2013, Rubiano 2018, Grizzi 2019)
    in joint inference.
