  year: 2019
  source_tag: Biffi2019
  contribution: Provides mouse PSC/CAF data showing robust induction of iCAF markers
    at 0.1–1 ng/mL IL-1α, supporting the assumption that these doses are near-saturating
    for iCAF differentiation and helping to shape the high-dose portion of the IL-1α
    Hill response.
  source_relevance:
    indication_match: exact
    indication_match_justification: The study focuses on CAF heterogeneity in pancreatic
      ductal adenocarcinoma, using KPC (Kras;Trp53;Pdx1-Cre) mouse models and human
      PDAC specimens, so the disease context matches PDAC even though much of the
      quantitative in vitro data come from mouse PSCs.
    species_source: mouse
    species_target: human
    source_quality: primary_animal_in_vivo
    perturbation_type: pharmacological
    perturbation_relevance: Recombinant mouse IL-1α is added to primary mouse PSCs
      at 0.1 and 1 ng/mL to drive iCAF differentiation in vitro, providing dose–response
      information on IL-1α potency. These are experimental perturbations rather than
      physiological levels, but the relative responses across doses inform the shape
      and saturation of the IL-1α Hill curve.
    tme_compatibility: moderate
    tme_compatibility_notes: Mouse PSCs are cultured in Matrigel and often co-cultured
      with KPC tumor organoids, providing a desmoplastic, cytokine-rich environment
