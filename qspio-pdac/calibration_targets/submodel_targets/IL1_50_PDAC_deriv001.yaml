calibration:
  parameters:
  - name: IL1_50
    units: nanomolar
    nuisance: false
  - name: n_IL1_iCAF
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 0.0
      sigma: 0.5
  - name: max_iCAF_induction
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 3.0
      sigma: 0.7
  forward_model:
    data_rationale: Both Tjomsland2011 (human CAFs) and Biffi2019 (mouse PSCs) report
      steady-state iCAF-like inflammatory marker induction after several days of culture
      at fixed IL-1α doses, without time courses. Treating marker fold-change as proportional
      to the fraction of CAFs in an iCAF-like state supports using a static Hill-type
      dose–response relating IL-1α concentration to normalized fold-change.
    submodel_rationale: In the full QSPIO-PDAC model, IL1_50 controls the potency
      of IL-1α-driven iCAF differentiation via a Hill function of IL-1 concentration.
      This algebraic submodel explicitly reproduces that Hill dependency, using max_iCAF_induction
      as the asymptotic fold-change and n_IL1_iCAF as the Hill coefficient, so that
      the inferred IL1_50 is directly reusable in the full model without rescaling.
    type: algebraic
    formula: 'Fold-change in iCAF proxy marker expression as a Hill function of IL-1α
      concentration: R(c) = 1 + (max_iCAF_induction - 1) * ( (c/IL1_50)^n_IL1_iCAF
      / (1 + (c/IL1_50)^n_IL1_iCAF ) ).'
    code: "def compute(params, inputs):\n    import numpy as np\n    IL1_50 = params['IL1_50']\
      \  # nanomolar\n    n_hill = params['n_IL1_iCAF']\n    max_fc = params['max_iCAF_induction']\n\
      \n    def hill_response(c_nM):\n        # c_nM and IL1_50 are in the same units\
      \ (nanomolar)\n        x = (c_nM / IL1_50) ** n_hill\n        h = x / (1.0 +\
      \ x)\n        return 1.0 + (max_fc - 1.0) * h\n\n    return {\n        'Tjomsland_10pg':\
      \ hill_response(inputs['IL1_conc_Tj_nM']),\n        'Biffi_0p1ng': hill_response(inputs['IL1_conc_Biffi_0p1_nM']),\n\
      \        'Biffi_1ng': hill_response(inputs['IL1_conc_Biffi_1_nM']),\n    }"
  error_model:
  - name: Tjomsland_10pg_iCAFproxy
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['Tjomsland_10pg']"
    units: dimensionless
    uses_inputs:
    - iCAF_proxy_fold_mean_Tj
    - iCAF_proxy_fold_sd_Tj
    - n_effective_Tj
    sample_size_input: n_effective_Tj
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean_fc = inputs['iCAF_proxy_fold_mean_Tj']\n \
      \   sd_fc = inputs['iCAF_proxy_fold_sd_Tj']\n    # Lognormal bootstrap for positive\
      \ fold-changes, treating IL-6 and CXCL8 as two proxy replicates\n    cv = sd_fc\
      \ / mean_fc\n    sigma_ln = np.sqrt(np.log(1.0 + cv**2))\n    mu_ln = np.log(mean_fc)\
      \ - (sigma_ln**2) / 2.0\n    return rng.lognormal(mu_ln, sigma_ln / np.sqrt(sample_size),\
      \ n_bootstrap)"
    n_bootstrap: 10000
  - name: Biffi_0p1ng_IL6
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['Biffi_0p1ng']"
    units: dimensionless
    uses_inputs:
    - IL6_fold_Biffi_0p1_mean
    - IL6_fold_Biffi_0p1_sd
    - n_effective_Biffi
    sample_size_input: n_effective_Biffi
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean_fc = inputs['IL6_fold_Biffi_0p1_mean']\n \
      \   sd_fc = inputs['IL6_fold_Biffi_0p1_sd']\n    cv = sd_fc / mean_fc\n    sigma_ln\
      \ = np.sqrt(np.log(1.0 + cv**2))\n    mu_ln = np.log(mean_fc) - (sigma_ln**2)\
      \ / 2.0\n    return rng.lognormal(mu_ln, sigma_ln / np.sqrt(sample_size), n_bootstrap)"
    n_bootstrap: 10000
  - name: Biffi_1ng_IL6
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['Biffi_1ng']"
    units: dimensionless
    uses_inputs:
    - IL6_fold_Biffi_1_mean
    - IL6_fold_Biffi_1_sd
    - n_effective_Biffi
    sample_size_input: n_effective_Biffi
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean_fc = inputs['IL6_fold_Biffi_1_mean']\n   \
      \ sd_fc = inputs['IL6_fold_Biffi_1_sd']\n    cv = sd_fc / mean_fc\n    sigma_ln\
      \ = np.sqrt(np.log(1.0 + cv**2))\n    mu_ln = np.log(mean_fc) - (sigma_ln**2)\
      \ / 2.0\n    return rng.lognormal(mu_ln, sigma_ln / np.sqrt(sample_size), n_bootstrap)"
    n_bootstrap: 10000
  identifiability_notes: 'The algebraic Hill model shares the same functional form
    as the full QSP model’s IL-1-driven iCAF differentiation term, so IL1_50 is structurally
    identifiable given a dense dose–response. However, available PDAC data provide
    only three effective concentrations (0.000588 nM in human CAFs, 0.00588 and 0.0588
    nM in mouse PSCs) and readouts are proxy markers (IL-6 and CXCL8 mRNA fold-changes).
    As a result, IL1_50 is only weakly identified and mainly upper-bounded (it must
    lie well below ~0.006–0.06 nM to reproduce strong responses at these doses). The
    maximal fold-change max_iCAF_induction and Hill coefficient n_IL1_iCAF are also
    correlated: higher n allows a larger IL1_50 at fixed low-dose response, while
    higher max_iCAF_induction can compensate for smaller n. Including both human (Tjomsland2011)
    and mouse (Biffi2019) data helps decouple these to some extent by adding two higher-dose
    points that appear close to saturation, but the posterior will still show substantial
    uncertainty and parameter correlations. Additional IL-1α titration data in human
    CAFs (especially below 10 pg/mL) or direct quantification of the iCAF fraction
    versus IL-1α concentration would be required to tighten IL1_50 and n_IL1_iCAF
    estimates.'
experimental_context:
  species: human
  system: in_vitro_primary_cells
  cell_types:
  - name: cancer-associated fibroblasts
    phenotype: myofibroblastic / inflammatory CAFs derived from human PDAC tissue
    isolation_method: CD326-negative fraction from collagenase-digested PDAC surgical
      specimens
    source: Primary CAF lines from PDAC patients, e.g., CAF039 (Tjomsland2011).
  culture_conditions:
    substrate: 2D tissue-culture plastic (Tjomsland2011 CAFs) or Matrigel-embedded
      3D culture (Biffi2019 PSCs)
    serum_concentration: 10.0
    serum_concentration_units: percent FBS
    oxygen_level: normoxic
    culture_type: mixed_2d_3d
    medium: RPMI-1640 or DMEM with 10% fetal calf serum, antibiotics
    supplements: Recombinant IL-1α at specified doses; no TGFbeta added in the key
      conditions used here
    duration: 5 days (Tjomsland2011) or 4 days (Biffi2019) of IL-1α treatment before
      qPCR readout
    notes: Tjomsland2011 used human CAFs in 2D culture; Biffi2019 used primarily mouse
      PSCs embedded in Matrigel co-cultured with tumor organoids or treated with exogenous
      IL-1α. Both systems report steady-state inflammatory marker induction after
      several days of stimulation.
  indication: pancreatic ductal adenocarcinoma (PDAC)
study_interpretation: Tjomsland2011 demonstrated that very low concentrations of IL-1α
  (10 pg/mL ≈ 0.0006 nM) strongly induce inflammatory genes (IL-6, CXCL8, COX-2) in
  human PDAC CAFs, while higher IL-1α doses produced by tumor cells further maintain
  a chronic inflammatory milieu. Biffi2019 showed that in mouse PSCs/CAFs, 0.1–1 ng/mL
  IL-1α (≈0.006–0.06 nM) robustly induces iCAF markers (Il6, Lif, Cxcl1, Csf3) and
  suppresses myofibroblastic markers, consistent with near-maximal iCAF differentiation
  in this dose range. Using IL-6 and CXCL8 (human) and IL-6 (mouse) fold-changes as
  proxies for the iCAF fraction, these studies jointly indicate that the EC50 IL1_50
  for IL-1α-driven iCAF formation must lie well below ~0.01 nM, since strong activation
  is already evident at 0.0006–0.006 nM. The Hill-type submodel encodes this relationship
  directly, allowing Bayesian inference to refine IL1_50, the Hill coefficient n_IL1_iCAF,
  and the maximal iCAF induction consistent with both human and mouse data.
key_assumptions:
- Inflammatory gene expression (especially IL-6 and CXCL8) is proportional to the
  fraction of CAFs in an iCAF-like state, so fold-change in these markers can be treated
  as a proxy for iCAF differentiation.
- Tjomsland2011 IL-6 and CXCL8 responses at 10 pg/mL IL-1α represent near-saturating
  iCAF activation in human CAFs, based on their large (>15–20-fold) induction and
  on Biffi2019 data showing little additional gain between 0.1 and 1 ng/mL in mouse
  PSCs.
- Mouse PSC responses to IL-1α in Biffi2019 are mechanistically similar in potency
  to human PDAC CAF responses and can be used, with added translation uncertainty,
  to help shape the Hill curve at higher IL-1α doses.
- The molecular weight of IL-1α is approximated as 17 kDa for converting ng/mL to
  nanomolar; small errors in this value have negligible impact on EC50 on a log scale.
- Marker-level variability (between IL-6 and CXCL8, and across replicates) can be
  approximated by a lognormal distribution with SD inferred from the spread between
  markers (Tjomsland2011) or from approximate error-bar heights (Biffi2019), recognising
  that this likely underestimates true biological heterogeneity.
- Culture conditions (2D vs 3D, presence of tumor organoids) mainly affect the maximal
  attainable iCAF fraction and background activation, not the intrinsic IL-1α potency
  captured by IL1_50, which is assumed to be relatively robust across these systems.
key_study_limitations:
- Neither Tjomsland2011 nor Biffi2019 reports a full IL-1α concentration–response
  curve for iCAF formation; only one very low dose in human CAFs (10 pg/mL) and two
  higher doses in mouse PSCs (0.1 and 1 ng/mL) are available, which weakly constrain
  IL1_50 and leave strong correlations with the Hill exponent and maximal response.
- The primary readouts are inflammatory mRNA levels (IL-6, CXCL8, etc.), not direct
  measurements of the fraction of CAFs in an iCAF state; using these as proxies assumes
  proportionality between marker expression and iCAF abundance, which may not hold
  exactly, especially at high doses where per-cell expression could saturate before
  differentiation does.
- Mouse PSCs in Biffi2019 differ from human PDAC CAFs in species and differentiation
  state, and they are embedded in Matrigel and often co-cultured with tumor organoids;
  these differences introduce translation uncertainty for IL1_50 that is not fully
  captured by the limited data.
- Approximate fold-change values from Biffi2019 Supplementary Figure S2A were estimated
  from digitized bar charts and may deviate modestly from the true means and SDs;
  this affects the inferred shape of the high-dose portion of the Hill curve but is
  unlikely to change the conclusion that IL1_50 lies well below 0.01 nM.
- Because only steady-state endpoints are available and potential autocrine loops
  (e.g., IL-1-induced LIF, IL-6) are not explicitly modelled here, the submodel may
  effectively capture an apparent IL-1α potency that integrates these downstream amplifications
  rather than the pure IL-1R1 binding EC50.
- The TME context in vitro (absence of immune cells, altered ECM, supraphysiologic
  serum) differs substantially from in vivo PDAC, so IL1_50 inferred here may still
  require adjustment when embedded in the full QSP model, particularly if in vivo
  IL-1α levels are spatially heterogeneous.
primary_data_source:
  doi: 10.1593/neo.11332
  title: Interleukin 1α Sustains the Expression of Inflammatory Factors in Human Pancreatic
    Cancer Microenvironment by Targeting Cancer-Associated Fibroblasts
  authors:
  - Tjomsland
  - Spangeus
  - Valila
  - Sandstrom
  - Borch
  - Druid
  - Falkmer
  - Falkmer
  - Messmer
  - Larsson
  year: 2011
  source_tag: Tjomsland2011
  source_relevance:
    indication_match: exact
    indication_match_justification: The study uses primary human pancreatic ductal
      adenocarcinoma (PDAC) tissues and derived cancer-associated fibroblasts (CAFs)
      to examine IL-1α-driven stromal inflammation, directly matching the PDAC indication
      in the QSPIO-PDAC model.
    species_source: human
    species_target: human
    source_quality: primary_human_in_vitro
    perturbation_type: pharmacological
    perturbation_relevance: Exogenous recombinant IL-1α at 10 pg/mL is applied to
      human PDAC CAFs to mimic tumor-derived IL-1α and probe its ability to induce
      inflammatory CAF activation. While this is a supraphysiologic but still low
      concentration relative to typical in vitro cytokine studies, it is used here
      to estimate the potency range of IL-1α for driving CAF activation rather than
      to represent exact in vivo concentrations.
    tme_compatibility: moderate
    tme_compatibility_notes: Primary CAFs are cultured in 2D in serum-containing medium
      without immune cells, vasculature, or the full desmoplastic matrix, so the microenvironment
      is less complex and less mechanically constrained than in PDAC in vivo. However,
      the CAFs are derived from PDAC stroma and retain key inflammatory and myofibroblastic
      features, making them a reasonable but simplified model of stromal IL-1α responses.
    measurement_directness: proxy_observable
    temporal_resolution: endpoint_pair
    experimental_system: in_vitro_primary
