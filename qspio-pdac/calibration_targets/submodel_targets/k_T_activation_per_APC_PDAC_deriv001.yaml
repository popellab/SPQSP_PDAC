calibration:
  parameters:
  - name: k_T_activation_per_APC
    units: 1/(day*cell)
    nuisance: false
  - name: N_DC_experiment
    units: cell
    nuisance: true
    prior:
      distribution: lognormal
      mu: 8.01
      sigma: 0.5
  forward_model:
    data_rationale: "Bousso2003 measured, at 20 h after transfer into mice containing\
      \ 1 \xB5M gp33-pulsed DCs, the fraction of antigen-specific P14 CD8+ T cells\
      \ that were interacting with DCs in the draining lymph node. Interactions that\
      \ persisted over the imaging window were long-lived (order of hours). This fraction\
      \ provides a snapshot of how many cognate naive CD8+ T cells have been captured\
      \ into long-lived T\u2013DC conjugates by a given time for a plausible range\
      \ of DC numbers in the lymph node."
    submodel_rationale: "In the full QSP model, naive CD8+ T cell activation in the\
      \ lymph node proceeds via a mass-action reaction with rate k_T_activation_per_APC\
      \ * mcDC1 * H_P1 * nCD8. Under saturating antigen (H_P1 \u2248 1), this reduces\
      \ to a per-APC-per-T-cell first-order conversion from naive to activated state.\
      \ Approximating activation as equivalent to formation of a long-lived T\u2013\
      DC conjugate, the submodel uses an analytical solution of dT_free/dt = -k_T_activation_per_APC\
      \ * N_DC_experiment * T_free to predict the engaged fraction at 20 h, thereby\
      \ directly constraining k_T_activation_per_APC with the same mechanistic dependence\
      \ on APC number as in the full model. The actual DC number in the experiment\
      \ is treated as a nuisance parameter with a lognormal prior centered on the\
      \ reported 10^3\u201310^4 range."
    type: algebraic
    formula: f_engaged_20h = 1 - exp(-k_T_activation_per_APC * N_DC_experiment * t_20h_days)
    code: "def compute(params, inputs):\n    import numpy as np\n    k = params['k_T_activation_per_APC']\n\
      \    N_DC = params['N_DC_experiment']\n    t_days = inputs['t_20h_days']\n \
      \   # Fraction of cognate naive CD8+ T cells that have formed long-lived contacts\
      \ with antigen-bearing DCs by 20 h\n    return 1.0 - np.exp(-k * N_DC * t_days)\n"
  error_model:
  - name: engaged_fraction_20h_highAg
    units: dimensionless
    uses_inputs:
    - P14_frac_interacting_highAg_mean
    - engaged_fraction_rel_sd_ref
    - n_P14_tracked_highAg
    sample_size_input: n_P14_tracked_highAg
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['P14_frac_interacting_highAg_mean']\n\
      \    rel_sd = inputs['engaged_fraction_rel_sd_ref']\n    sd = mean * rel_sd\n\
      \    # Parametric bootstrap for the sample mean assuming normal errors\n   \
      \ return rng.normal(mean, sd / np.sqrt(sample_size), n_bootstrap)\n"
    n_bootstrap: 10000
  identifiability_notes: "This target provides one effective data point (fraction\
    \ of P14 CD8+ T cells engaged with high-density antigen-bearing DCs at a single\
    \ 20 h time point) to constrain k_T_activation_per_APC jointly with a nuisance\
    \ parameter N_DC_experiment representing the number of DCs in the draining lymph\
    \ node. Under the assumption of saturating antigen (H_P1 \u2248 1) and homogeneous\
    \ mixing, the algebraic model is structurally identifiable for the product k_T_activation_per_APC\
    \ * N_DC_experiment, but not for each factor separately. The nuisance parameter\
    \ is therefore given a lognormal prior centered on the experimentally reported\
    \ range of 10^3\u201310^4 migrated DCs per node, so that the posterior for k_T_activation_per_APC\
    \ reflects both the engagement data and prior knowledge of DC numbers. Because\
    \ there is only a single time point and the interacting fraction is approximated\
    \ from a bar graph with heuristic uncertainty encoded as a reference value, k_T_activation_per_APC\
    \ will be constrained primarily at the order-of-magnitude level, serving as a\
    \ consistency check and modest refinement of the existing prior rather than a\
    \ tight new estimate."
experimental_context:
  species: mouse
  system: animal_in_vivo
  cell_types:
  - name: CD8+ T cells (P14 TCR transgenic)
    phenotype: naive gp33-specific CD8+ T cells from P14 TCR Rag2-/- mice
    isolation_method: Isolated from spleen and lymph nodes using standard lymphocyte
      isolation and enrichment
    source: P14 TCR Rag2-/- donor mice
  - name: splenic dendritic cells
    phenotype: CD11c+ DCs that mature during migration to draining lymph node (high
      MHC class II and B7.2)
    isolation_method: Collagenase digestion of spleens followed by CD11c+ magnetic
      bead selection
    source: C57BL/6 (Ly5.2) donor mice
  indication: acute antiviral-like priming in draining lymph node after peptide-pulsed
    DC immunization
study_interpretation: "Bousso2003 used two-photon imaging of intact mouse lymph nodes\
  \ to quantify how efficiently antigen-bearing dendritic cells recruit antigen-specific\
  \ CD8+ T cells into long-lived contacts. Approximately 7.3 new T cells per minute\
  \ came into close contact with each DC in the absence of antigen, and when DCs were\
  \ pulsed with 1 \xB5M gp33 peptide, more than half of the transferred P14 CD8+ T\
  \ cells were found interacting with DCs 20 h after transfer. The observed interactions\
  \ were long-lived (order of hours). Interpreting these stable contacts as the functional\
  \ equivalent of naive-to-activated conversion in the QSP model, the submodel treats\
  \ the engaged fraction at 20 h as 1 - exp(-k_T_activation_per_APC * N_DC_experiment\
  \ * t). A nuisance parameter with a prior reflecting the experimentally reported\
  \ 10^3\u201310^4 migrated DCs per node captures uncertainty in DC number, while\
  \ the observed interacting fraction constrains the effective per-APC activation\
  \ rate under high antigen density in a way that is mechanistically consistent with\
  \ the full QSP reaction V_LN.nCD8 -> V_LN.aCD8 driven by k_T_activation_per_APC\
  \ * V_LN.mcDC1 * H_P1 * V_LN.nCD8."
key_assumptions:
- "High-dose (1 \xB5M) gp33 peptide pulsing produces near-saturating pMHC density\
  \ on DCs such that the Hill function H_P1 in the QSP model can be approximated as\
  \ 1 for this experiment."
- "Formation of a long-lived T\u2013DC conjugate that persists over the imaging window\
  \ is taken as a proxy for successful activation of a naive CD8+ T cell, consistent\
  \ with hours-long contacts being associated with productive priming."
- "The number of DCs in the draining lymph node during imaging lies within the reported\
  \ range of 10^3\u201310^4 migrated DCs, which is encoded as a lognormal prior on\
  \ the nuisance parameter N_DC_experiment."
- Transferred P14 T cells are treated as a homogeneous naive cognate population; heterogeneity
  in arrival times into the lymph node and in their previous contact history with
  DCs is ignored when modeling the 20 h snapshot.
- The interacting fraction estimated from Fig. 3b (~55%) is sufficiently accurate
  for constraining k_T_activation_per_APC at the order-of-magnitude level; in the
  absence of numerical SD reporting, a relative SD of ~20% is used as a typical biological
  variability for such fractions when only graphical information is available.
- Mouse gp33-specific priming dynamics in this immunization model are assumed to be
  a reasonable proxy for naive CD8+ T cell priming by tumor antigen-bearing DCs in
  PDAC-draining lymph nodes, up to species- and indication-related scaling factors
  handled elsewhere in the QSP prior.
key_study_limitations:
- The experiment uses splenic DCs pulsed with a viral peptide (gp33) and adoptively
  transferred P14 TCR transgenic CD8+ T cells in young mice, which differs substantially
  from endogenous human PDAC tumor antigen presentation and naive T cell precursor
  frequencies.
- "The number of migrated DCs per draining lymph node is only reported as a broad\
  \ range (10^3\u201310^4); in the submodel this is represented by a relatively broad\
  \ lognormal prior on N_DC_experiment rather than a direct measurement, so residual\
  \ uncertainty about DC numbers contributes to uncertainty in k_T_activation_per_APC."
- The engaging fraction at 20 h is extracted approximately from a bar graph (Fig.
  3b) rather than numerically tabulated, and the SD across movies must be approximated,
  introducing additional uncertainty.
- Only a single time point (20 h) and a single high antigen density condition are
  used quantitatively; the time course of engagement and the dependence on lower antigen
  densities (e.g., 30 pM) are not directly fit in this target.
- "The mapping from long-lived T\u2013DC contact to full activation and clonal expansion\
  \ is assumed but not directly validated, although day-3 proliferation data qualitatively\
  \ support near-complete activation under these conditions."
- Lymph node physiology in young, non-tumor-bearing mice immunized with peptide-pulsed
  DCs may differ in vascularization, chemokine gradients, and stromal composition
  from PDAC tumor-draining lymph nodes, potentially altering effective activation
  rates per APC.
primary_data_source:
  doi: 10.1038/ni928
  title: Dynamics of CD8+ T cell priming by dendritic cells in intact lymph nodes
  authors:
  - Bousso
  - Robey
  year: 2003
  source_tag: Bousso2003
  source_relevance:
    indication_match: proxy
    indication_match_justification: The study investigates CD8+ T cell priming by
      peptide-pulsed dendritic cells in draining lymph nodes of healthy mice, whereas
      the QSP model targets human pancreatic ductal adenocarcinoma (PDAC). Nevertheless,
      the basic cellular processes of naive CD8+ T cell scanning, engagement, and
      activation by mature DCs in lymph nodes are expected to be qualitatively conserved
      across indications, so these data serve as a mechanistic proxy for naive T cell
      priming kinetics in PDAC-draining lymph nodes, with additional uncertainty for
      tumor-specific immunosuppressive effects handled via the model priors.
    species_source: mouse
    species_target: human
    source_quality: primary_animal_in_vivo
    perturbation_type: pharmacological
    perturbation_relevance: CD8+ T cell priming is induced by subcutaneous injection
      of peptide-pulsed splenic DCs and intravenous transfer of large numbers of P14
      TCR transgenic T cells, representing an immunization-like perturbation with
      high antigen density and elevated precursor frequency. The resulting activation
      rate per APC therefore reflects an upper-bound, high-efficiency priming scenario
      that will tend to overestimate activation rates in endogenous PDAC, but is still
      informative for setting the scale of k_T_activation_per_APC.
    tme_compatibility: moderate
    tme_compatibility_notes: "The experiments are done in tumor-free, relatively normal\
      \ lymph nodes, whereas PDAC-draining lymph nodes may experience chronic antigen\
      \ exposure and systemic immunosuppression. However, the local microanatomy and\
      \ DC\u2013T cell scanning dynamics of lymph nodes are broadly similar, so differences\
      \ are expected to shift effective activation rates by a modest factor (e.g.,\
      \ via altered DC maturation states or T cell motility) rather than changing\
      \ the underlying qualitative mechanism."
    measurement_directness: single_inversion
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: animal_in_vivo
