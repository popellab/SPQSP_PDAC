- name: delta_texterm_mean_percent
  value: 1.6
  units: percent
  input_type: derived_arithmetic
  rationale: Mean incremental Texterm fraction attributable to PD-L1 signaling, estimated
    as the difference between PD-L1+ EV and PD-L1KO EV mean percentages after the
    same 3-day exposure.
  source_ref: Fang2026
  source_location: Figure 7B, Texterm panel (PD-L1+ EVs minus PD-L1KO EVs)
  figure_excerpt:
    figure_id: Figure 7B
    value: ~1.6 percentage point increase
    description: Difference in Texterm percentage between PD-L1+ EV and PD-L1KO EV
      conditions, computed from digitized replicate pairs.
    context: Each pair of PD-L1+ EV and PD-L1KO EV bars at the same replicate index
      was subtracted to obtain per-replicate differences; these were averaged to get
      the mean increase in Texterm cells attributable to PD-L1 on EVs.
  source_inputs:
  - texterm_pdl1plus_mean_percent
  - texterm_pdl1ko_mean_percent
  formula: texterm_pdl1plus_mean_percent - texterm_pdl1ko_mean_percent
- name: delta_texterm_sd_percent
  value: 1.4
  units: percent
  input_type: direct_measurement
  source_ref: Fang2026
  source_location: Figure 7B, Texterm panel (PD-L1+ EVs minus PD-L1KO EVs)
  figure_excerpt:
