target_id: n_T_expansion_burst_Butz1998
inputs:
- name: N_divisions_mean
  value: 15.0
  units: dimensionless
  input_type: direct_measurement
  source_ref: Butz1998
  source_location: Results, section 'An Estimate of Precursor Frequency', p.172
  value_snippet: about 15 divisions over the 8 days of infection, or 1 division every
    13 hr
- name: N_divisions_sd
  value: 3.0
  units: dimensionless
  input_type: reference_value
  rationale: Standard deviation of the effective number of binary divisions was not
    reported; a value of 3 divisions is chosen as a moderate uncertainty (~20% of
    the mean) to avoid overconfidence in the aggregate estimate.
  source_ref: Butz1998
  source_location: Not explicitly reported; modeling assumption for calibration uncertainty.
- name: division_time_hours_mean
  value: 13.0
  units: hour
  input_type: direct_measurement
  source_ref: Butz1998
  source_location: Results, section 'An Estimate of Precursor Frequency', p.172
  value_snippet: This would necessitate about 15 divisions over the 8 days of infection,
    or 1 division every 13 hr.
- name: division_time_hours_sd
  value: 3.0
  units: hour
  input_type: reference_value
  rationale: Standard deviation of the 13 hr interdivision time was not reported;
    a value of 3 hours is chosen as a moderate uncertainty to reflect biological and
    inferential variability.
  source_ref: Butz1998
  source_location: Not explicitly reported; modeling assumption for calibration uncertainty.
- name: infection_duration_days
  value: 8.0
  units: day
  input_type: direct_measurement
  source_ref: Butz1998
  source_location: Results, section 'An Estimate of Precursor Frequency', p.172
  value_snippet: This would necessitate about 15 divisions over the 8 days of infection,
    or 1 division every 13 hr.
- name: n_mice_divisions
  value: 3.0
  units: dimensionless
  input_type: direct_measurement
  source_ref: Butz1998
  source_location: Results, first paragraph, p.167
  value_snippet: A group of three C57Bl/6 mice was intravenously infected with 10^5
    plaque-forming units (pfu) of LCMV.
- name: n_mice_division_time
  value: 3.0
  units: dimensionless
  input_type: direct_measurement
  source_ref: Butz1998
  source_location: Results, first paragraph, p.167
  value_snippet: A group of three C57Bl/6 mice was intravenously infected with 10^5
    plaque-forming units (pfu) of LCMV.
- name: hours_per_day
  value: 24.0
  units: hour/day
  input_type: reference_value
  rationale: Unit-conversion constant used to convert proliferation rate in 1/day
    to division time in hours.
  source_ref: Butz1998
  source_location: Not reported in paper; physical constant for unit conversion.
calibration:
  parameters:
  - name: n_T_expansion_burst
    units: dimensionless
    nuisance: false
  - name: N_aT
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 1.0986
      sigma: 0.7
  - name: k_CD8_pro
    units: 1/day
    nuisance: false
  forward_model:
    data_rationale: Butz1998 estimates that LCMV-specific CD8 T cells undergo about
      15 doublings over 8 days of acute infection, corresponding to a large clonal
      burst per naive virus-specific CD8 T cell, and that the implied division time
      is about 13 hours. These two summary quantities constrain (1) the effective
      fold-expansion per naive clone and (2) the mean proliferation rate during the
      expansion phase.
    submodel_rationale: 'In the full QSP model, activation of naive CD8 T cells in
      the lymph node creates V_LN.aCD8 with a multiplicative burst factor n_T_expansion_burst
      and an explicit number of activated T cell generations N_aT that proliferate
      at rate k_CD8_pro. The algebraic submodel maps these QSP parameters to the experimentally
      accessible observables: the total effective number of binary divisions per naive
      clone (log2_fold) and the average interdivision time (division_time_hours),
      without altering the underlying mechanistic parameterization used in the complete
      model.'
    type: algebraic
    formula: log2_fold = log2(n_T_expansion_burst) + N_aT; division_time_hours = (ln
      2 / k_CD8_pro) * hours_per_day
    code: "def compute(params, inputs):\n    import numpy as np\n    # Total effective\
      \ number of binary divisions experienced by a naive CD8 clone\n    # is the\
      \ sum of explicit activated-generation count N_aT and any additional\n    #\
      \ burst captured by n_T_expansion_burst.\n    log2_fold = np.log2(params['n_T_expansion_burst'])\
      \ + params['N_aT']\n    # Mean inter-division time (hours) implied by the CD8\
      \ proliferation rate\n    division_time_hours = np.log(2) / params['k_CD8_pro']\
      \ * inputs['hours_per_day']\n    return {\n        'log2_fold': log2_fold,\n\
      \        'division_time_hours': division_time_hours,\n    }"
  error_model:
  - name: effective_binary_divisions
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    # y is the dict returned by the algebraic\
        \ forward model\n    return y['log2_fold']\n"
    units: dimensionless
    uses_inputs:
    - N_divisions_mean
    - N_divisions_sd
    sample_size_input: n_mice_divisions
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['N_divisions_mean']\n    sd = inputs['N_divisions_sd']\n\
      \    return rng.normal(mean, sd / np.sqrt(sample_size), n_bootstrap)\n"
    n_bootstrap: 10000
  - name: division_time_hours
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['division_time_hours']\n"
    units: hour
    uses_inputs:
    - division_time_hours_mean
    - division_time_hours_sd
    sample_size_input: n_mice_division_time
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['division_time_hours_mean']\n   \
      \ sd = inputs['division_time_hours_sd']\n    return rng.normal(mean, sd / np.sqrt(sample_size),\
      \ n_bootstrap)\n"
    n_bootstrap: 10000
  identifiability_notes: The Butz1998 data constrain two combinations of T cell expansion
    parameters. First, the observed effective number of binary divisions (about 15)
    constrains the sum log2(n_T_expansion_burst) + N_aT; without additional data,
    n_T_expansion_burst and N_aT remain partially confounded and will rely on their
    priors and on information from other calibration targets to be individually resolved.
    Second, the reported interdivision time (~13 h) directly constrains the proliferation
    rate k_CD8_pro under the assumption of exponential growth with constant doubling
    time. Because these measurements are taken in an acute systemic viral infection
    (LCMV) in mice, they are expected to represent an upper bound on CD8 clonal expansion
    compared with the immunosuppressed PDAC tumor context; this biological translation
    uncertainty is handled at the source-relevance level rather than by modifying
    the forward model. No direct information is available here on the number of distinct
    tumor-specific CD8 clones (n_CD8_clones), so that parameter is not included in
    this submodel and remains constrained only by its prior and other targets.
experimental_context:
  species: mouse
  system: animal_in_vivo
  cell_types:
  - name: CD8 T cell
    phenotype: naive and virus-specific effector CD8+ T cells responding to LCMV gp33,
      np396, and gp276 epitopes
    isolation_method: splenocytes and lymph node cells from C57Bl/6 or Thy1-congenic
      B6.PL mice
    source: In vivo LCMV-infected C57Bl/6 and B6.PL mice
  indication: acute systemic LCMV infection (used as mechanistic proxy for PDAC T
    cell clonal expansion)
study_interpretation: "Butz1998 shows that during acute LCMV infection in C57Bl/6\
  \ mice, the pool of virus-specific CD8 T cells expands from a few thousand naive\
  \ precursors to roughly 10^8 effector cells in about 8 days. From adoptive transfer\
  \ experiments and precursor-frequency estimates, the authors infer that this corresponds\
  \ to approximately 15 effective binary divisions per naive precursor, i.e., a clonal\
  \ burst of order 10^4\u201310^5 per clone, with an average division time of about\
  \ 13 hours. In the QSPIO-PDAC model, these observations inform the generic clonal\
  \ burst size parameter n_T_expansion_burst and the proliferation rate k_CD8_pro\
  \ governing activated CD8 expansion in lymph nodes. Because PDAC priming is expected\
  \ to be weaker and more suppressed than acute viral infection, these values are\
  \ interpreted as upper bounds on the intrinsic expansion capacity of tumor-specific\
  \ CD8 T cells, with model-based downscaling mediated through other immunosuppressive\
  \ processes (e.g., Treg, MDSC, and CAF effects)."
key_assumptions:
- The effective number of divisions (15) reported by Butz1998 accurately summarizes
  the net fold-expansion per naive virus-specific CD8 T cell at the peak of the response,
  despite underlying uncertainties in precursor counts and exact effector numbers.
- CD8 T cell proliferation during the expansion phase of acute LCMV infection can
  be approximated as exponential with a roughly constant division time, allowing the
  interdivision time to be related to the proliferation rate k_CD8_pro via t_div =
  ln(2)/k_CD8_pro.
- The structure of CD8 clonal expansion in acute infection (naive precursors primed
  by mature APCs in lymphoid tissue, followed by several generations of proliferation)
  is mechanistically similar to tumor-specific CD8 priming in PDAC, so that the same
  parameters n_T_expansion_burst, N_aT, and k_CD8_pro are applicable after appropriate
  adjustment for the immunosuppressive tumor microenvironment.
- The standard deviations of 3 divisions and 3 hours around the reported mean values
  represent moderate biological and inferential variability, chosen to avoid overconfidence
  in these aggregate estimates while still providing useful constraints.
- Differences between mouse and human CD8 T cell dynamics and between acute viral
  infection and PDAC will be accounted for statistically via increased translation
  uncertainty rather than by altering the mechanistic form of the submodel.
key_study_limitations:
- The data come from acute systemic LCMV infection in young C57Bl/6 mice, which is
  immunologically more permissive than human PDAC; true clonal bursts in PDAC are
  therefore likely smaller than those inferred here.
- The estimated 15 divisions and 13 hr division time are not directly measured at
  the single-cell level but are inferred from bulk precursor and effector counts,
  introducing additional model-dependent uncertainty.
- The precursor-frequency estimates are clearest for the gp33 epitope, and the assumption
  that precursors for np396 and gp276 are present at similar frequencies may not hold
  exactly.
- The study reports aggregate virus-specific CD8 expansion across multiple epitopes
  and compartments; mapping this to a single generic clonal burst parameter in the
  PDAC QSP model assumes that per-clone burst sizes are similar across epitopes and
  tissues.
- Species differences (mouse vs human) and the lack of a desmoplastic, immunosuppressive
  tumor microenvironment in the LCMV model limit direct quantitative translation to
  PDAC without additional scaling by other model components.
primary_data_source:
  pmid: '9491993'
  title: Massive Expansion of Antigen-Specific CD8+ T Cells during an Acute Virus
    Infection
  authors:
  - Butz EA
  - Bevan MJ
  year: 1998
  source_tag: Butz1998
  source_relevance:
    indication_match: proxy
    indication_match_justification: The source study analyzes CD8 T cell clonal expansion
      during acute systemic LCMV infection in mice, whereas the QSPIO-PDAC model targets
      tumor-specific CD8 expansion in human pancreatic ductal adenocarcinoma. Acute
      viral infection provides a mechanistic upper bound on naive CD8 clonal burst
      size, but lacks the chronic antigen exposure and strong immunosuppression characteristic
      of PDAC, so considerable translation uncertainty is expected.
    species_source: mouse
    species_target: human
    source_quality: primary_animal_in_vivo
    perturbation_type: pathological_state
    perturbation_relevance: The measurements are made in the context of an acute viral
      infection without pharmacological or genetic perturbations; they reflect the
      intrinsic expansion capacity of naive CD8 T cells responding to strong antigenic
      stimulation and inflammatory cues, serving as an upper bound for tumor-specific
      responses.
    tme_compatibility: low
    tme_compatibility_notes: Acute LCMV infection occurs in lymphoid organs and systemic
      tissues with robust T cell activation and little physical barrier, whereas PDAC
      is characterized by a dense desmoplastic stroma, immune exclusion, and multiple
      overlapping immunosuppressive mechanisms. As a result, the observed clonal burst
      sizes and proliferation rates in LCMV are likely higher than those achievable
      in PDAC, and substantial downscaling through other model processes is anticipated.
    measurement_directness: single_inversion
    temporal_resolution: timecourse
    experimental_system: animal_in_vivo
