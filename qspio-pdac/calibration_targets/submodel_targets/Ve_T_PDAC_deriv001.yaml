target_id: Ve_T_PDAC_wang2023_deriv001
study_interpretation: |
  Wang et al. 2023 used a multitasking dynamic contrast-enhanced MRI
  (DCE-MRI) protocol with extended Tofts model fitting to differentiate
  PDAC from chronic pancreatitis and normal pancreas in vivo. Table 2
  reports the extracellular extravascular volume fraction (ve, the
  EES fraction) for six tissue types. The PDAC tumor-mass ROI
  (the tumor core, which corresponds mechanistically to the QSP model's
  V_T compartment) has ve = 0.61 +/- 0.11 (mean +/- SD, n=14 patients).

  The QSP-IO PDAC model parameter Ve_T is the INTRACELLULAR volume
  fraction (per simbio_init.m line 95: 'Intracellular fraction of the
  tumor'), used in the V_T volume rule as cells*vol_cell/Ve_T. By
  conservation of volume in tumor tissue (cells + ECM/interstitium ~= 1):
  Ve_T = 1 - ve_DCE. So this measurement implies Ve_T = 0.39 +/- 0.11.

  This is a primary in vivo human PDAC measurement and replaces the
  prior Finley 2012 PMID 22547351 citation (verified to be a
  VEGF compartment-modeling paper that simply inherits Ve_T from
  upstream parameter tables, NOT a primary measurement source).
key_assumptions:
- |
  Conservation of volume: ve_DCE (extracellular extravascular fraction
  measured by DCE-MRI) plus the intracellular fraction (Ve_T) sum to 1
  for tissue volume that excludes the vascular plasma compartment (vp,
  reported separately). The vp contribution is 0.09 +/- 0.05 in PDAC
  mass and is small relative to ve, so the (1 - ve) approximation for
  intracellular fraction has at most ~10% relative error. A more
  rigorous mapping would be Ve_T = 1 - ve - vp, but the QSP model
  does not separately partition vascular volume in V_T.
- |
  PDAC tumor-mass ROI is the correct mapping for V_T. The paper also
  reports 'PDAC whole pancreas' (ve = 0.41) and 'upstream / downstream'
  ROIs — those are non-tumor regions of the affected pancreas and do
  not correspond to V_T. The 'PDAC mass' ROI is explicitly the tumor
  core (lower Fp, higher ve; reflects the dense desmoplastic stroma).
- |
  DCE-MRI ve in heavily fibrotic PDAC may overestimate true cellular
  EES because slow-exchanging extravascular contrast accumulates in
  collagen-rich stroma. This biases ve_DCE upward, biasing Ve_T downward
  (i.e., true intracellular fraction may be SOMEWHAT higher than 0.39).
  The translation sigma absorbs this systematic bias.
key_study_limitations:
- |
  Extended Tofts model assumes a well-mixed plasma compartment and
  fast water exchange, which can be violated in stroma-rich PDAC.
  Test-retest CoV for ve in PDAC is ~19% (Klauss 2018 PMID 29476781);
  the Wang sample SD (0.11 / 0.61 = 18% CV) is consistent with this
  intra-subject variability + cohort heterogeneity.
- |
  n=14 PDAC patients is moderate. Sample size determines the standard
  error of the mean (~0.029) — the population variability (SD = 0.11)
  is the relevant quantity for prior calibration, not the SE.
