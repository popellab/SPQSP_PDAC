calibration:
  parameters:
  - name: Ve_T
    units: dimensionless
  forward_model:
    type: algebraic
    formula: ve_DCE = 1 - Ve_T (volume conservation in tumor tissue)
    code: |
      def compute(params, inputs):
          return 1.0 - params['Ve_T']
    data_rationale: |
      DCE-MRI extended Tofts model directly measures the
      extracellular extravascular volume fraction (ve). By volume
      conservation in tumor tissue (intracellular + extracellular ~= 1
      after accounting for the small plasma volume vp), the
      intracellular fraction is 1 - ve.
    submodel_rationale: |
      The QSP model parameter Ve_T is the intracellular volume fraction
      (per simbio_init.m: 'Intracellular fraction of the tumor'),
      appearing in the V_T volume rule as cells*vol_cell/Ve_T. So
      the predicted DCE-MRI observable ve_DCE = 1 - Ve_T.
  error_model:
  - name: ve_dce_pdac_mass
    units: dimensionless
    uses_inputs:
    - ve_dce_pdac_mass_mean
    - ve_dce_pdac_mass_sd
    - n_pdac_patients
    sample_size_input: n_pdac_patients
    observation_code: |
      def derive_observation(inputs, sample_size, rng, n_bootstrap):
          import numpy as np
          mean = inputs['ve_dce_pdac_mass_mean']
          sd = inputs['ve_dce_pdac_mass_sd']
          # Population-level mean of ve in PDAC tumor-mass ROIs.
          # Normal bootstrap for the population mean (CV ~18%, well
          # within the regime where normal approximation is fine and
          # mass above 1 / below 0 is negligible).
          return rng.normal(mean, sd / np.sqrt(sample_size), n_bootstrap)
  identifiability_notes: |
    Single parameter (Ve_T), single measurement (ve_dce_pdac_mass).
    Algebraic identity Ve_T = 1 - ve_DCE is fully identified.
    Translation sigma is small (high-quality direct human PDAC
    in vivo measurement).
