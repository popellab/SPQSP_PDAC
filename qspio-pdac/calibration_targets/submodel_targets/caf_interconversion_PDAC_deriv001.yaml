calibration:
  parameters:
  - name: k_iCAF_to_myCAF
    units: 1/day
  - name: k_myCAF_to_iCAF
    units: 1/day
  - name: TGFb_50_CAF_act
    units: nanomolarity
  - name: IL1_50
    units: nanomolarity
  - name: TGFb_50_IL1R1
    units: nanomolarity
  - name: k_iCAF_prolif
    units: 1/day
  - name: k_myCAF_prolif
    units: 1/day
  - name: k_qPSC_prolif
    units: 1/day
    nuisance: true
    prior:
      distribution: lognormal
      mu: -2.3
      sigma: 1.0
  - name: K_well
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 14.0
      sigma: 1.0
  - name: n_logistic
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 1.1
      sigma: 0.5
  - name: IL1_conc_CM
    units: nanomolarity
    nuisance: true
    prior:
      distribution: lognormal
      mu: -2.8
      sigma: 0.7
  forward_model:
    type: custom_ode
    data_rationale: 'Three proliferation curves from the same culture system under different

      signaling conditions. The control curve constrains quiescent growth. The

      CM curve constrains iCAF proliferation. The CM+TGFb curve is a two-state

      system where iCAFs convert to myCAFs (which proliferate faster), and the

      total cell count (iCAF + myCAF) is observed. The gap between CM and

      CM+TGFb directly constrains the interconversion rate.

      '
    submodel_rationale: "The ODE replicates the QSP model's iCAF<->myCAF interconversion reactions:\n  iCAF->myCAF: k_iCAF_to_myCAF\
      \ * iCAF * TGFb/(TGFb_50_CAF_act + TGFb)\n  myCAF->iCAF: k_myCAF_to_iCAF * myCAF * H_IL1_eff\nwhere H_IL1_eff = IL1/(IL1_50\
      \ * (1 + TGFb/TGFb_50_IL1R1) + IL1) captures\nTGFb antagonism of IL-1 signaling via IL-1R1 downregulation. The IL-6\n\
      autocrine feedback term is omitted for tractability.\n\nThe control and CM conditions serve as internal calibration:\
      \ they constrain\nthe proliferation rates independently, so the CM+TGFb curve isolates the\ninterconversion dynamics.\n"
    code: "def ode(t, y, params, inputs):\n    q, i_pure, i_mix, m_mix = y\n    k_q = params['k_qPSC_prolif']\n    k_i = params['k_iCAF_prolif']\n\
      \    k_m = params['k_myCAF_prolif']\n    k_im = params['k_iCAF_to_myCAF']\n    k_mi = params['k_myCAF_to_iCAF']\n  \
      \  ec50_tgfb = params['TGFb_50_CAF_act']\n    ec50_il1 = params['IL1_50']\n    ec50_il1r1 = params['TGFb_50_IL1R1']\n\
      \    K = params['K_well']\n    n = params['n_logistic']\n    il1 = params['IL1_conc_CM']\n    tgfb = inputs['TGFb_conc_nM']\n\
      \n    # Hill functions\n    H_TGFb = tgfb / (ec50_tgfb + tgfb)\n    H_IL1_eff = il1 / (ec50_il1 * (1 + tgfb / ec50_il1r1)\
      \ + il1)\n\n    # Control: quiescent logistic growth\n    dq = k_q * q * (1 - (q / K) ** n)\n\n    # CM: pure iCAF logistic\
      \ growth (no TGFb -> no interconversion)\n    di_pure = k_i * i_pure * (1 - (i_pure / K) ** n)\n\n    # CM+TGFb: two-state\
      \ interconversion + logistic growth\n    N_mix = i_mix + m_mix\n    logistic_mix = 1 - (N_mix / K) ** n\n    interconv_fwd\
      \ = k_im * H_TGFb * i_mix\n    interconv_rev = k_mi * H_IL1_eff * m_mix\n    di_mix = -interconv_fwd + interconv_rev\
      \ + k_i * i_mix * logistic_mix\n    dm_mix = interconv_fwd - interconv_rev + k_m * m_mix * logistic_mix\n\n    return\
      \ [dq, di_pure, di_mix, dm_mix]\n"
    state_variables:
    - name: q
      units: dimensionless
      initial_condition:
        input_ref: ctrl_day1_mean
        rationale: Day 1 luminescence for control media condition
    - name: i_pure
      units: dimensionless
      initial_condition:
        input_ref: CM_day1_mean
        rationale: Day 1 luminescence for conditioned media condition
    - name: i_mix
      units: dimensionless
      initial_condition:
        input_ref: CMT_day1_mean
        rationale: Day 1 luminescence for CM+TGFb condition (all iCAFs initially)
    - name: m_mix
      units: dimensionless
      initial_condition:
        value: 0.0
        rationale: No myCAFs at day 1 — all cells start as iCAFs in CM+TGFb
    independent_variable:
      name: time
      units: day
      span:
      - 1
      - 5
  error_model:
  - name: ctrl_day2
    units: dimensionless
    uses_inputs:
    - ctrl_day2_mean
    - ctrl_day2_sd
    - n_tech_replicates
    evaluation_points:
    - 2
    sample_size_input: n_tech_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['ctrl_day2_mean']\n    sd = inputs['ctrl_day2_sd']\n    return rng.lognormal(np.log(mean), sd / mean / np.sqrt(sample_size),\
      \ n_bootstrap)\n"
    observable:
      type: identity
      state_variables:
      - q
  - name: ctrl_day3
    units: dimensionless
    uses_inputs:
    - ctrl_day3_mean
    - ctrl_day3_sd
    - n_tech_replicates
    evaluation_points:
    - 3
    sample_size_input: n_tech_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['ctrl_day3_mean']\n    sd = inputs['ctrl_day3_sd']\n    return rng.lognormal(np.log(mean), sd / mean / np.sqrt(sample_size),\
      \ n_bootstrap)\n"
    observable:
      type: identity
      state_variables:
      - q
  # ctrl_day4 removed: same Matrigel settling dip as psc_activation target
  # (66.6k < day 3's 78k). Monotonic logistic cannot capture transient decline.
  - name: ctrl_day5
    units: dimensionless
    uses_inputs:
    - ctrl_day5_mean
    - ctrl_day5_sd
    - n_tech_replicates
    evaluation_points:
    - 5
    sample_size_input: n_tech_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['ctrl_day5_mean']\n    sd = inputs['ctrl_day5_sd']\n    return rng.lognormal(np.log(mean), sd / mean / np.sqrt(sample_size),\
      \ n_bootstrap)\n"
    observable:
      type: identity
      state_variables:
      - q
  - name: CM_day2
    units: dimensionless
    uses_inputs:
    - CM_day2_mean
    - CM_day2_sd
    - n_tech_replicates
    evaluation_points:
    - 2
    sample_size_input: n_tech_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
