  identifiability_notes: 'k_iCAF_to_myCAF is the primary target, constrained by the gap between CM

    and CM+TGFb curves. At 0.8 nM TGFb (near-saturating), H_TGFb ~ 0.92,

    so k_iCAF_to_myCAF is nearly directly observable.


    TGFb_50_CAF_act is weakly constrained because TGFb is near-saturating

    (H_TGFb varies only 0.76-0.98 across the prior range). A dose-response

    with sub-saturating TGFb concentrations would be needed for tight constraint.


    k_myCAF_to_iCAF is weakly constrained because the reverse direction is

    suppressed by TGFb antagonism of IL-1R1. IL1_50 and TGFb_50_IL1R1 are

    similarly weakly constrained but included to match QSP model structure.


    k_iCAF_prolif and k_myCAF_prolif are shared with the S6K target. The CM

    curve provides redundant constraint on k_iCAF_prolif. The myCAF rate is

    constrained indirectly via the CM+TGFb curve shape.


    Potential degeneracy: a fast k_iCAF_to_myCAF with slow k_myCAF_prolif

    could produce similar total growth as slow interconversion with fast myCAF

    proliferation. The S6K target breaks this degeneracy by independently

    constraining k_myCAF_prolif.

    '
