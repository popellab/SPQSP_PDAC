target_id: caf_interconversion_biffi2019
tags:
- ai-generated
- fibroblast-module
extraction_model: claude-opus-4-6
study_interpretation: 'Biffi et al. (2019) measured proliferation of mouse PSCs cultured in Matrigel

  under three conditions: control media (quiescent), tumor organoid-conditioned

  media (iCAFs), and conditioned media + 20 ng/mL TGFb (iCAF->myCAF conversion).

  CellTiter-Glo luminescence was measured every 24h for 5 days (n=5 tech reps).


  The CM+TGFb curve grows ~46% faster than the CM-only curve (k=0.46 vs 0.36/day).

  Since CellTiter-Glo measures total cells (iCAF + myCAF), the excess growth in

  CM+TGFb reflects iCAF->myCAF interconversion: TGFb drives iCAFs to convert to

  myCAFs, which proliferate faster. The gap between the curves directly constrains

  the interconversion rate k_iCAF_to_myCAF.


  TGFb also antagonizes IL-1 signaling by downregulating IL-1R1, which suppresses

  the reverse (myCAF->iCAF) conversion. At 20 ng/mL TGFb (0.8 nM), the effective

  IL-1 EC50 is shifted ~12x higher, substantially reducing reverse interconversion.

  '
key_assumptions:
- 'All cells start as iCAFs in the CM and CM+TGFb conditions. The conditioned

  media maintains the iCAF phenotype via IL-1alpha from tumor organoids; TGFb

  addition drives interconversion of a fraction to myCAFs.

  '
- 'CellTiter-Glo luminescence is proportional to total cell count. The ATP per

  cell is assumed similar between iCAFs and myCAFs (both are metabolically

  active fibroblast subtypes). Any difference would be a systematic bias in

  the inferred interconversion rate.

  '
- 'The conditioned media provides a fixed IL-1 concentration throughout the

  experiment (pre-collected, not replenished by live organoids). The IL-1

  concentration is treated as a nuisance parameter.

  '
- 'IL-6 autocrine feedback on iCAF formation is neglected. In the full QSP

  model, myCAF->iCAF interconversion includes a (1 + f_IL6_iCAF * H_IL6_iCAF)

  amplification term. Omitting this is conservative — it means k_myCAF_to_iCAF

  absorbs any IL-6 effect and may be slightly overestimated.

  '
- 'TGFb concentration is constant at 0.8 nM throughout the experiment (exogenous

  addition, no significant depletion over 5 days at these cell densities).

  '
key_study_limitations:
- 'Technical replicates only (n=5 wells), not biological replicates. Cannot

  assess inter-isolate variability in interconversion rates.

  '
- 'Mouse PSCs, not human. Interconversion kinetics may differ between species.

  '
- 'In vitro Matrigel culture lacks the spatial gradients of IL-1 and TGFb that

  define the iCAF/myCAF niche in vivo. In the tumor, TGFb acts locally on

  tumor-proximal cells while IL-1 diffuses further. Here both signals are

  uniformly distributed.

  '
- 'The observable (total luminescence) cannot distinguish iCAF from myCAF

  fractions. The interconversion rate is inferred indirectly from the total

  growth curve shape.

  '
experimental_context:
  species: mouse
  system: in_vitro_primary_cells
  cell_types:
  - name: PSCs (iCAFs and myCAFs)
    source: mouse pancreas (KPC model)
    isolation_method: 'PSCs embedded in Matrigel and cultured with tumor organoid-conditioned

      media to establish iCAF phenotype. TGFb addition drives interconversion

      to myCAF state.

      '
  culture_conditions:
    medium: DMEM with 5% FBS; conditioned media from KPC tumor organoids cultured 3-4 days
    duration: 5 days, measurements every 24 hours
  indication: PDAC
primary_data_source:
  doi: 10.1158/2159-8290.CD-18-0710
  title: 'IL-1-induced JAK/STAT signaling is antagonized by TGF-beta to shape CAF

    heterogeneity in pancreatic ductal adenocarcinoma

    '
  authors:
  - Biffi
  - Oni
  - Spielman
  - Hao
  - Elyada
  - Park
  - Preall
  - Tuveson
  year: 2019
  source_tag: Biffi2019
  source_relevance:
    indication_match: exact
    indication_match_justification: 'Mouse KPC pancreatic stellate cells with PDAC tumor organoid-conditioned

      media. The iCAF and myCAF phenotypes are validated by transcriptomics

      against in vivo single-cell RNA-seq from KPC tumors. This is the definitive

      in vitro model for PDAC CAF interconversion biology.

      '
    species_source: mouse
    species_target: human
    source_quality: primary_animal_in_vitro
    perturbation_type: pharmacological
    perturbation_relevance: 'TGFb addition at 20 ng/mL (near-saturating) drives iCAF->myCAF conversion.

      This is a supraphysiological concentration that maximally activates the

      TGFb/SMAD pathway. In vivo, TGFb concentrations vary spatially (highest

      near tumor cells). The measured interconversion rate represents the maximal

      rate at saturating TGFb, providing an upper bound.

      '
    tme_compatibility: moderate
    tme_compatibility_notes: 'In vitro Matrigel culture with pre-collected conditioned media. Lacks spatial

      gradients, immune cell interactions, and ECM stiffness cues present in PDAC

      TME. The uniform TGFb exposure differs from the in vivo gradient where only

      tumor-proximal CAFs experience high TGFb.

      '
    measurement_directness: single_inversion
    temporal_resolution: timecourse
    experimental_system: in_vitro_primary
secondary_data_sources: []
