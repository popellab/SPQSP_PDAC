calibration:
  parameters:
  - name: E_50_Texh
    units: dimensionless
  - name: n_Texh
    units: dimensionless
  - name: TNFa_max
    units: picogram/milliliter
    nuisance: true
    prior:
      distribution: lognormal
      mu: 5.86
      sigma: 0.7
  forward_model:
    type: direct_fit
    curve: hill
    ec50: E_50_Texh
    n_hill: n_Texh
    baseline: '0.0'
    maximum: TNFa_max
    data_rationale: 'TNFalpha production by TCR-stimulated CD4+ T cells increases with substrate stiffness in a graded dose-response
      across 0.5-100 kPa. This provides an independent observable constraining the same mechanosensing EC50 and Hill coefficient
      as the IFNgamma target.

      '
    submodel_rationale: 'Same mechanosensing Hill function as IFNgamma target: H_stiff_Texh = stiffness^n / (E_50_Texh^n +
      stiffness^n). TNFalpha is a second cytokine readout of the same mechanotransduction event, providing independent constraint
      on the shared EC50 and n parameters.

      '
  error_model:
  - name: TNFa_at_0p5_kPa
    units: picogram/milliliter
    x_input: stiffness_0p5_kPa
    uses_inputs:
    - TNFa_mean_0p5
    - TNFa_sd_0p5
    - n_donors_TNFa_0p5
    sample_size_input: n_donors_TNFa_0p5
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['TNFa_mean_0p5']\n    sd = inputs['TNFa_sd_0p5']\n    return rng.normal(mean, sd / np.sqrt(sample_size), n_bootstrap)\n"
  - name: TNFa_at_6p4_kPa
    units: picogram/milliliter
    x_input: stiffness_6p4_kPa
    uses_inputs:
    - TNFa_mean_6p4
    - TNFa_sd_6p4
    - n_donors_TNFa_6p4
    sample_size_input: n_donors_TNFa_6p4
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['TNFa_mean_6p4']\n    sd = inputs['TNFa_sd_6p4']\n    return rng.normal(mean, sd / np.sqrt(sample_size), n_bootstrap)\n"
  - name: TNFa_at_100_kPa
    units: picogram/milliliter
    x_input: stiffness_100_kPa
    uses_inputs:
    - TNFa_mean_100
    - TNFa_sd_100
    - n_donors_TNFa_100
    sample_size_input: n_donors_TNFa_100
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['TNFa_mean_100']\n    sd = inputs['TNFa_sd_100']\n    return rng.normal(mean, sd / np.sqrt(sample_size), n_bootstrap)\n"
  identifiability_notes: 'Same parameter pair (E_50_Texh, n_Texh) as the IFNgamma target. TNFalpha provides an independent
    cytokine readout of the same mechanosensing event. Joint inference across both targets will tighten the posterior on E_50_Texh
    and n_Texh. TNFa_max (nuisance) absorbs the absolute cytokine scale.

    '
experimental_context:
  species: human
  system: in_vitro_primary_cells
  cell_types:
  - name: CD4+ T lymphoblasts
    source: human peripheral blood
    isolation_method: 'CD4+ isolation kit (Miltenyi), expanded as lymphoblastoid effector T cells

      with aCD3/aCD28 + IL-2 (20 U/mL) for 6 days on plastic.

      '
  culture_conditions:
    medium: RPMI with 10% FCS, IL-2 (20 U/mL)
    duration: 24 hour culture on PA-gels
study_interpretation: 'TNFalpha production shows the same graded stiffness response as IFNgamma, confirming that the mechanosensing
  effect is a general feature of TCR signaling potentiation, not specific to a single cytokine pathway.

  '
key_assumptions:
- Same mechanosensing EC50 for IFNgamma and TNFalpha production
- Same assumptions as IFNgamma target regarding model mapping
key_study_limitations:
- Same limitations as IFNgamma target
- Slightly fewer donors digitized (9-10 vs 12-13) due to overlapping dots near zero
primary_data_source:
  doi: 10.7554/eLife.23190
  source_tag: Saitakis2017
  title: Different TCR-induced T lymphocyte responses are potentiated by stiffness with variable sensitivity
  authors:
  - Saitakis
  - Dogniaux
  - Goudot
  - Bufi
  - Asnacios
  - Maurin
  - Randriamampita
  - Asnacios
  - Hivroz
  year: 2017
  source_relevance:
    indication_match: proxy
    indication_match_justification: 'Healthy donor CD4+ T cells used as mechanistic proxy for tumor-infiltrating T cells in
      PDAC. The TCR mechanosensing apparatus is conserved across T cell subsets and disease contexts. TNFalpha production
      via TCR mechanosensing uses the same upstream pathway as IFNgamma, providing a corroborating readout.

      '
    species_source: human
    species_target: human
    source_quality: primary_human_in_vitro
    perturbation_type: physiological_baseline
    perturbation_relevance: 'Anti-CD3/CD28 stimulation on PA-gels isolates the stiffness-dependent component of TCR signaling.

      '
    tme_compatibility: low
    tme_compatibility_notes: 'Same caveats as IFNgamma target: in vitro PA-gel lacks TME components. Mechanosensing EC50 should
      translate but functional context differs.

      '
    measurement_directness: single_inversion
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: in_vitro_primary
