calibration:
  parameters:
  - name: k_PSC_to_myCAF
    units: 1/day
  - name: TGFb_50_CAF_act
    units: nanomolarity
  - name: k_myCAF_prolif
    units: 1/day
  - name: k_qPSC_prolif
    units: 1/day
    nuisance: true
    prior:
      distribution: lognormal
      mu: -2.3
      sigma: 1.0
  - name: K_well
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 13.5
      sigma: 0.5
  - name: n_logistic
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 1.1
      sigma: 0.5
  forward_model:
    type: custom_ode
    data_rationale: 'Two proliferation curves from quiescent PSCs +/- TGFb over 6 days.

      Without TGFb, PSCs remain quiescent and barely grow. With TGFb, PSCs

      activate to myCAFs which proliferate faster. The accelerating growth

      curve in the TGFb condition directly constrains the activation rate

      k_PSC_to_myCAF: early timepoints reflect qPSC growth (most

      cells still quiescent), later timepoints reflect myCAF growth (most

      cells converted).

      '
    submodel_rationale: "Replicates the QSP model reaction:\n  qPSC -> myCAF at rate k_PSC_to_myCAF * qPSC * TGFb/(TGFb_50_CAF_act\
      \ + TGFb)\nIn control media with no organoid CM, there is no IL-1, so no iCAF\nformation occurs. The activation is purely\
      \ TGFb-driven (confirmed by\nS6A qPCR). No reverse conversion is modeled since TGFb is continuously\npresent at saturating\
      \ levels.\n"
    code: "def ode(t, y, params, inputs):\n    q_ctrl, q_act, m_act = y\n    k_q = params['k_qPSC_prolif']\n    k_act = params['k_PSC_to_myCAF']\n\
      \    k_m = params['k_myCAF_prolif']\n    ec50 = params['TGFb_50_CAF_act']\n    K = params['K_well']\n    n = params['n_logistic']\n\
      \    tgfb = inputs['TGFb_conc_nM']\n\n    H_TGFb = tgfb / (ec50 + tgfb)\n\n    # Control: quiescent logistic growth\
      \ (no TGFb)\n    dq_ctrl = k_q * q_ctrl * (1 - (q_ctrl / K) ** n)\n\n    # With TGFb: activation + proliferation\n \
      \   N_act = q_act + m_act\n    logistic_act = 1 - (N_act / K) ** n\n    activation = k_act * H_TGFb * q_act\n\n    dq_act\
      \ = -activation + k_q * q_act * logistic_act\n    dm_act = activation + k_m * m_act * logistic_act\n\n    return [dq_ctrl,\
      \ dq_act, dm_act]\n"
    state_variables:
    - name: q_ctrl
      units: dimensionless
      initial_condition:
        input_ref: ctrl_day1_mean
        rationale: Day 1 luminescence for control (no TGFb) condition
    - name: q_act
      units: dimensionless
      initial_condition:
        input_ref: tgfb_day1_mean
        rationale: Day 1 luminescence for TGFb condition (all qPSCs initially)
    - name: m_act
      units: dimensionless
      initial_condition:
        value: 0.0
        rationale: No myCAFs at day 1 — all cells start as quiescent PSCs
    independent_variable:
      name: time
      units: day
      span:
      - 1
      - 6
  # ctrl_day2, ctrl_day3, ctrl_day4 removed from error model:
  # Biffi2019 control arm shows flat/declining luminescence in days 1-4
  # (85k → 82k → 84k → 80k) due to Matrigel settling/adaptation artifact.
  # Monotonic logistic growth structurally cannot capture this transient dip.
  # Days 5-6 (growth phase) are retained to constrain k_qPSC_prolif.
  error_model:
  - name: ctrl_day5
    units: dimensionless
    uses_inputs:
    - ctrl_day5_mean
    - ctrl_day5_sd
    - n_tech_replicates
    evaluation_points:
    - 5
    sample_size_input: n_tech_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['ctrl_day5_mean']\n    sd = inputs['ctrl_day5_sd']\n    return rng.lognormal(np.log(mean), sd / mean / np.sqrt(sample_size),\
      \ n_bootstrap)\n"
    observable:
      type: identity
      state_variables:
      - q_ctrl
  - name: ctrl_day6
    units: dimensionless
    uses_inputs:
    - ctrl_day6_mean
    - ctrl_day6_sd
    - n_tech_replicates
    evaluation_points:
    - 6
    sample_size_input: n_tech_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['ctrl_day6_mean']\n    sd = inputs['ctrl_day6_sd']\n    return rng.lognormal(np.log(mean), sd / mean / np.sqrt(sample_size),\
      \ n_bootstrap)\n"
    observable:
      type: identity
      state_variables:
      - q_ctrl
  - name: tgfb_day2
    units: dimensionless
    uses_inputs:
    - tgfb_day2_mean
    - tgfb_day2_sd
    - n_tech_replicates
    evaluation_points:
    - 2
    sample_size_input: n_tech_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['tgfb_day2_mean']\n    sd = inputs['tgfb_day2_sd']\n    return rng.lognormal(np.log(mean), sd / mean / np.sqrt(sample_size),\
      \ n_bootstrap)\n"
    observable:
      type: custom
      code: 'def compute(t, y, y_start): return y[1] + y[2]'
      state_variables:
      - q_act
      - m_act
  - name: tgfb_day3
    units: dimensionless
    uses_inputs:
    - tgfb_day3_mean
    - tgfb_day3_sd
    - n_tech_replicates
    evaluation_points:
    - 3
    sample_size_input: n_tech_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['tgfb_day3_mean']\n    sd = inputs['tgfb_day3_sd']\n    return rng.lognormal(np.log(mean), sd / mean / np.sqrt(sample_size),\
      \ n_bootstrap)\n"
    observable:
      type: custom
      code: 'def compute(t, y, y_start): return y[1] + y[2]'
      state_variables:
      - q_act
      - m_act
  - name: tgfb_day4
    units: dimensionless
    uses_inputs:
    - tgfb_day4_mean
    - tgfb_day4_sd
    - n_tech_replicates
    evaluation_points:
    - 4
    sample_size_input: n_tech_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['tgfb_day4_mean']\n    sd = inputs['tgfb_day4_sd']\n    return rng.lognormal(np.log(mean), sd / mean / np.sqrt(sample_size),\
      \ n_bootstrap)\n"
    observable:
      type: custom
      code: 'def compute(t, y, y_start): return y[1] + y[2]'
      state_variables:
      - q_act
      - m_act
  - name: tgfb_day5
    units: dimensionless
    uses_inputs:
    - tgfb_day5_mean
    - tgfb_day5_sd
    - n_tech_replicates
    evaluation_points:
    - 5
    sample_size_input: n_tech_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['tgfb_day5_mean']\n    sd = inputs['tgfb_day5_sd']\n    return rng.lognormal(np.log(mean), sd / mean / np.sqrt(sample_size),\
      \ n_bootstrap)\n"
    observable:
      type: custom
      code: 'def compute(t, y, y_start): return y[1] + y[2]'
      state_variables:
      - q_act
      - m_act
  - name: tgfb_day6
    units: dimensionless
    uses_inputs:
    - tgfb_day6_mean
    - tgfb_day6_sd
    - n_tech_replicates
    evaluation_points:
    - 6
    sample_size_input: n_tech_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['tgfb_day6_mean']\n    sd = inputs['tgfb_day6_sd']\n    return rng.lognormal(np.log(mean), sd / mean / np.sqrt(sample_size),\
      \ n_bootstrap)\n"
    observable:
      type: custom
      code: 'def compute(t, y, y_start): return y[1] + y[2]'
      state_variables:
      - q_act
      - m_act
  identifiability_notes: 'k_PSC_to_myCAF is the primary target, constrained by the divergence

    between control and TGFb curves. The activation rate determines the timescale

    of the qPSC->myCAF transition: fast activation gives early divergence, slow

    activation gives late divergence. At 0.8 nM TGFb (H_TGFb ~ 0.92), the

    effective activation rate is approximately k_PSC_to_myCAF * 0.92.


    TGFb_50_CAF_act is weakly constrained (same issue as Fig 5H — TGFb is

    near-saturating). Shared with the interconversion target for joint constraint.


    k_myCAF_prolif is constrained by the late-timepoint growth rate (days 5-6)

    when most cells have converted to myCAFs. Shared with S6K and 5H targets.


    k_qPSC_prolif (nuisance) is constrained by the control curve.


    Potential degeneracy: fast activation + slow myCAF proliferation vs slow

    activation + fast myCAF proliferation. The S6K target breaks this by

    independently constraining k_myCAF_prolif.

    '
