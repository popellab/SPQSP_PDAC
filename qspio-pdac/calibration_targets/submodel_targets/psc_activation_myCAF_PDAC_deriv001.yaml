target_id: psc_activation_myCAF_biffi2019
tags:
- ai-generated
- fibroblast-module
extraction_model: claude-opus-4-6
study_interpretation: 'Biffi et al. (2019) measured proliferation of mouse PSCs cultured in Matrigel

  with control media (quiescent) or control media + 20 ng/mL TGFb (driving

  myofibroblast activation). CellTiter-Glo luminescence measured every 24h for

  6 days (n=5 tech reps). The Supplementary Figure S6A qPCR confirmed TGFb

  induces myCAF markers (Ctgf, Col1a1) without inducing iCAF markers.


  The with-TGFb curve grows 3.2x over 6 days (k=0.23/day) while quiescent PSCs

  barely grow (1.2x, k=0.04/day). The accelerating growth in the TGFb condition

  reflects PSCs activating to myCAFs, which proliferate faster. Early timepoints

  are dominated by qPSC growth (most cells still quiescent); later timepoints

  by myCAF growth (most cells have converted). The transition timescale directly

  constrains k_PSC_to_myCAF.


  Importantly, this uses control media (no organoid CM), so there is no IL-1

  present. The activation is purely TGFb-driven, matching the QSP model reaction:

  qPSC -> myCAF at rate k_PSC_to_myCAF * qPSC * TGFb/(TGFb_50_CAF_act + TGFb).

  '
key_assumptions:
- 'All cells start as quiescent PSCs. TGFb drives activation to myCAFs but not

  to iCAFs (confirmed by S6A qPCR showing no iCAF marker induction). No

  reverse conversion (myCAF->qPSC) is modeled since TGFb is continuously

  present at saturating levels.

  '
- 'CellTiter-Glo luminescence is proportional to total cell count, with the

  proportionality constant assumed similar between qPSCs and myCAFs.

  '
- 'TGFb concentration is constant at 0.8 nM (20 ng/mL) throughout the experiment.

  No significant depletion by cells.

  '
- 'The control condition (no TGFb) has negligible activation — PSCs remain

  quiescent throughout. This is supported by the near-flat growth curve and

  the absence of myCAF markers (S6A qPCR).

  '
key_study_limitations:
- 'Technical replicates only (n=5 wells), not biological replicates.

  '
- 'Mouse PSCs, not human. Activation kinetics may differ between species.

  '
- 'Control media contains 5% FBS which provides some TGFb (~0.1-0.5 ng/mL).

  This could contribute to low-level activation in the control condition,

  though the near-flat growth curve suggests this is negligible.

  '
- '2D Matrigel culture lacks the mechanical cues (stiffness) that contribute

  to myCAF activation in vivo. However, TGFb is the dominant chemical

  activator and is provided exogenously.

  '
experimental_context:
  species: mouse
  system: in_vitro_primary_cells
  cell_types:
  - name: quiescent PSCs
    source: mouse pancreas (KPC model)
    isolation_method: 'PSCs embedded in Matrigel and cultured in DMEM with 5% FBS (control media)

      with or without 20 ng/mL mouse TGFb. No organoid-conditioned media.

      '
  culture_conditions:
    medium: DMEM with 5% FBS, +/- 20 ng/mL mouse TGF-beta1
    duration: 6 days (digitized), measurements every 24 hours. 6,000 PSCs per well in 52 uL Matrigel, white 96-well plates,
      readout by CellTiter-Glo.
  indication: PDAC
primary_data_source:
  doi: 10.1158/2159-8290.CD-18-0710
  title: 'IL-1-induced JAK/STAT signaling is antagonized by TGF-beta to shape CAF

    heterogeneity in pancreatic ductal adenocarcinoma

    '
  authors:
  - Biffi
  - Oni
  - Spielman
  - Hao
  - Elyada
  - Park
  - Preall
  - Tuveson
  year: 2019
  source_tag: Biffi2019
  source_relevance:
    indication_match: exact
    indication_match_justification: 'Mouse KPC pancreatic stellate cells with exogenous TGFb. The activation

      of quiescent PSCs to myCAFs by TGFb is the defining mechanism of myCAF

      formation in PDAC (Biffi 2019, Ohlund 2017).

      '
    species_source: mouse
    species_target: human
    source_quality: primary_animal_in_vitro
    perturbation_type: pharmacological
    perturbation_relevance: 'TGFb at 20 ng/mL (0.8 nM) is supraphysiological but within the range

      observed in PDAC stroma. The saturating concentration means the measured

      activation rate represents the maximal rate, providing an upper bound

      for in vivo activation at sub-saturating local TGFb concentrations.

      '
    tme_compatibility: moderate
    tme_compatibility_notes: 'In vitro Matrigel culture with exogenous TGFb. Lacks spatial gradients,

      mechanical cues, and co-culture interactions present in PDAC TME. The

      activation rate may differ in vivo due to ECM stiffness-mediated

      mechanotransduction (YAP/TAZ) that enhances myCAF differentiation.

      '
    measurement_directness: single_inversion
    temporal_resolution: timecourse
    experimental_system: in_vitro_primary
secondary_data_sources: []
