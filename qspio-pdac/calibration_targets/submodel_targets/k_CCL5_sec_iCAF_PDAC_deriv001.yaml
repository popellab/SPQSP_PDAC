  identifiability_notes: 'Two parameters (k_CCL5_sec_iCAF, k_CCL5_deg_invitro) from 6 time points.

    The rising phase (6-48h) constrains the secretion rate. The plateau

    (72-96h) constrains the ratio k_sec/k_deg (steady state). Together these

    identify both parameters. k_deg_invitro is nuisance — it captures in vitro

    degradation (thermal, protease-free) which differs from in vivo clearance.

    The QSP parameter k_CCL5_deg is not constrained by this target.

    '
