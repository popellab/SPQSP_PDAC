target_id: k_CCL5_sec_iCAF_kawka2014
tags:
- ai-generated
extraction_model: claude-opus-4-6
study_interpretation: 'Kawka et al. (2014) measured CCL5 protein secretion by ELISA (DuoSet R&D

  Systems, sensitivity 5 pg/mL) in human peritoneal fibroblast (HPFB) cultures

  stimulated with TNF-alpha (1000 pg/mL) or IL-1beta (1000 pg/mL). Figure 1a

  shows a time course (6-96h, n=6 donors) of CCL5 accumulation in pg/10^4 cells

  for control, IL-1beta, and TNF-alpha conditions. TNF-alpha produced the

  strongest response, reaching ~230 pg/10^4 cells at 96h with a plateau

  beginning ~72h, consistent with secretion-degradation steady state.


  The TNF-alpha-stimulated condition is the relevant proxy for iCAF-like

  inflammatory fibroblasts (NF-kB-driven secretory program). The time course

  constrains both the secretion rate (rising phase) and the in vitro

  degradation rate (plateau).

  '
key_assumptions:
- 'Cell count remains approximately constant over the 96h experiment. HPFB were

  rendered quiescent (0.1% FCS for 48h) before stimulation. At 0.1% FCS,

  proliferation is minimal.

  '
- 'CCL5 accumulation follows dC/dt = k_sec - k_deg*C, reaching steady state

  C_ss = k_sec / k_deg. The plateau at 72-96h confirms this.

  '
- 'The TNF-alpha-activated HPFB phenotype (NF-kB-driven, CCL5-secreting) is

  functionally analogous to the iCAF inflammatory program driven by IL-1/NF-kB

  in PDAC. Both converge on NF-kB activation of CCL5 transcription.

  '
- 'CCL5 MW = 8 kDa (68 amino acids, mature form).

  '
key_study_limitations:
- 'Human peritoneal fibroblasts, not pancreatic stellate cells. Peritoneal

  fibroblasts are mesenchymal cells that share activation biology with PSCs

  but may differ in baseline secretory capacity.

  '
- 'TNF-alpha stimulation is a proxy for the IL-1/NF-kB axis that drives iCAF

  identity. The paper also shows IL-1beta data (weaker response) which could

  provide a second constraint.

  '
- 'Data normalized to 10^4 cells — actual cell count per well not stated.

  This is advantageous (eliminates volume/count uncertainty) but means we

  cannot cross-check against absolute concentrations.

  '
- 'Error bars are SD from n=6 donors. Inter-donor variability is high

  (CV ~25-40% at later time points), reflecting biological heterogeneity.

  '
experimental_context:
  species: human
  system: in_vitro_primary_cells
  cell_types:
  - name: human peritoneal fibroblast (HPFB)
    source: omentum from elective abdominal surgery
    isolation_method: 'Isolated from apparently normal omentum, digested with trypsin,

      identified by spindle-shape and FSP-1 positivity. Propagated in

      Ham''s F12 + 10% FCS. Rendered quiescent at 0.1% FCS for 48h

      before stimulation with TNF-alpha 1000 pg/mL.

      '
  culture_conditions:
    medium: Ham's F12, 0.1% FCS + TNF-alpha 1000 pg/mL
    duration: 6-96h time course
  indication: peritonitis
primary_data_source:
  doi: 10.1155/2014/590654
  title: 'Regulation of Chemokine CCL5 Synthesis in Human Peritoneal Fibroblasts:

    A Key Role of IFN-gamma

    '
  authors:
  - Kawka
  - Witowski
  - Fouqet
  - Tayama
  - Bender
  - Catar
  - Dragun
  - Jorres
  year: 2014
  source_tag: Kawka2014
  source_relevance:
    indication_match: proxy
    indication_match_justification: 'Human peritoneal fibroblasts as proxy for PDAC iCAFs. Both are mesenchymal

      cells that produce CCL5 under NF-kB-driven inflammatory stimulation.

      Peritoneal fibroblasts from omentum share key features with pancreatic

      stellate cells (mesenchymal origin, cytokine responsiveness, chemokine

      production). The TNF-alpha stimulation recapitulates the NF-kB activation

      that drives iCAF identity in PDAC.

      '
    species_source: human
    species_target: human
    source_quality: primary_human_in_vitro
    perturbation_type: pharmacological
    perturbation_relevance: 'TNF-alpha (1000 pg/mL = ~58 pM) activates NF-kB signaling to drive CCL5

      production. This is a proxy for the IL-1alpha/NF-kB axis that maintains

      iCAF identity in PDAC. The concentration used is in the physiological range

      for inflamed tissue.

      '
    tme_compatibility: moderate
    tme_compatibility_notes: 'In vitro 2D culture on plastic in 0.1% FCS. Lacks 3D ECM, cancer cell

      paracrine signals, and immune cell interactions. TNF-alpha stimulation

      partially recapitulates the inflammatory milieu but the actual iCAF

      program involves IL-1alpha from cancer cells and LIF/JAK-STAT signaling.

      '
    measurement_directness: single_inversion
    temporal_resolution: timecourse
    experimental_system: in_vitro_primary
