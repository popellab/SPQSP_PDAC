      \ inputs['tnfa_24h_mean']\n    sd = inputs['tnfa_24h_sd']\n    cv = sd / mean\n    return rng.lognormal(np.log(mean),\
      \ cv / np.sqrt(sample_size), n_bootstrap)\n"
    observable:
