calibration:
  parameters:
  - name: k_CCL5_sec_iCAF
    units: nanomole/cell/day
  - name: k_CCL5_deg_invitro
    units: 1/day
    nuisance: true
    prior:
      distribution: lognormal
      mu: -2.0
      sigma: 1.0
  forward_model:
    type: algebraic
    formula: 'C(t) = k_sec_pg * (1 - exp(-k_deg_hr * t)) / k_deg_hr

      where k_sec_pg = k_CCL5_sec_iCAF (nmol/cell/day) * 1e4 (cells) * MW (kDa) * 1e6 (pg/nmol) / 24 (hr/day)

      and k_deg_hr = k_CCL5_deg_invitro / 24

      Units: pg per 10^4 cells, time in hours.

      '
    data_rationale: 'Time course of CCL5 accumulation in culture supernatant normalized to

      10^4 cells. The saturation curve constrains both the secretion rate

      (rising phase slope) and in vitro degradation rate (plateau level).

      '
    submodel_rationale: 'Maps to CCL5 secretion in fibroblast_module_enhanced.m:

      null -> V_T.CCL5 at rate k_CCL5_sec_iCAF * V_T.iCAF. The in vitro

      degradation rate is nuisance (in vivo degradation includes receptor-

      mediated clearance and protease activity not present in culture).

      '
    code: "def compute(params, inputs):\n    k_sec = params['k_CCL5_sec_iCAF']\n    k_deg_day = params['k_CCL5_deg_invitro']\n\
      \    MW = inputs['CCL5_MW_kDa']\n\n    # Convert k_sec from nmol/(cell*day) to pg/(10^4 cells * hour)\n    # 1 nmol\
      \ = MW_kDa * 1e6 pg\n    # Per 10^4 cells, per hour: * 1e4 / 24\n    k_sec_pg_hr = k_sec * MW * 1e6 * 1e4 / 24\n\n \
      \   # Degradation in 1/hour\n    k_deg_hr = k_deg_day / 24\n\n    # C(t) = k_sec_pg_hr / k_deg_hr * (1 - exp(-k_deg_hr\
      \ * t))\n    ratio = k_sec_pg_hr / k_deg_hr\n    return {\n        't6': ratio * (1 - np.exp(-k_deg_hr * 6)),\n    \
      \    't12': ratio * (1 - np.exp(-k_deg_hr * 12)),\n        't24': ratio * (1 - np.exp(-k_deg_hr * 24)),\n        't48':\
      \ ratio * (1 - np.exp(-k_deg_hr * 48)),\n        't72': ratio * (1 - np.exp(-k_deg_hr * 72)),\n        't96': ratio\
      \ * (1 - np.exp(-k_deg_hr * 96)),\n    }\n"
  error_model:
  - name: CCL5_6h
    units: picogram
    uses_inputs:
    - tnfa_6h_mean
    - tnfa_6h_sd
    - n_donors
    sample_size_input: n_donors
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['tnfa_6h_mean']\n    sd = inputs['tnfa_6h_sd']\n    cv = sd / mean\n    return rng.lognormal(np.log(mean),\
      \ cv / np.sqrt(sample_size), n_bootstrap)\n"
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['t6']\n"
  - name: CCL5_12h
    units: picogram
    uses_inputs:
    - tnfa_12h_mean
    - tnfa_12h_sd
    - n_donors
    sample_size_input: n_donors
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['tnfa_12h_mean']\n    sd = inputs['tnfa_12h_sd']\n    cv = sd / mean\n    return rng.lognormal(np.log(mean),\
      \ cv / np.sqrt(sample_size), n_bootstrap)\n"
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['t12']\n"
