calibration:
  parameters:
  - name: IL6_50_MDSC
    units: nanomolarity
    nuisance: false
  - name: Emax_IL6_MDSC
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 0.0
      sigma: 0.7
  - name: k_MDSC_gen_baseline
    units: cell
    nuisance: true
    prior:
      distribution: lognormal
      mu: 10.49
      sigma: 0.5
  forward_model:
    data_rationale: Hsieh2019 cultured murine bone marrow cells with GM-CSF (8 ng/mL)
      for 5 days in the absence or presence of recombinant mouse IL-6 (10 ng/mL) and
      quantified CD11b+Gr-1+ MDSCs per well. This provides baseline vs IL-6-stimulated
      MDSC output under otherwise identical conditions, plus an IL-6-neutralized arm
      to confirm specificity.
    submodel_rationale: In the full QSP PDAC model, IL-6 enhances MDSC recruitment/generation
      via a Hill-type factor with EC50 IL6_50_MDSC and maximal fold-change Emax_IL6_MDSC
      acting on a baseline rate k_MDSC_gen_baseline. The algebraic submodel reproduces
      this Hill gating on IL-6 concentration and maps directly to the observed final
      MDSC counts after a fixed 5-day culture, without introducing additional kinetics
      that would absorb the Hill term into an effective rate constant.
    type: algebraic
    formula: MDSC_count = k_MDSC_gen_baseline * (1 + Emax_IL6_MDSC * IL6_nM / (IL6_50_MDSC
      + IL6_nM))
    code: "def compute(params, inputs):\n    import numpy as np\n\n    # QSP parameters\n\
      \    ec50 = params['IL6_50_MDSC']           # EC50 for IL-6 effect on MDSC generation\
      \ (nM)\n    emax = params['Emax_IL6_MDSC']        # Maximal fold-increase above\
      \ baseline (dimensionless)\n    k_base = params['k_MDSC_gen_baseline']  # Baseline\
      \ MDSC generation/output scale (cells)\n\n    # Experimental IL-6 concentrations\
      \ (ng/mL)\n    il6_none_ng_ml = inputs['IL6_none_ng_ml']   # GM-CSF only and\
      \ IL-6+anti-IL-6 conditions\n    il6_high_ng_ml = inputs['IL6_high_ng_ml'] \
      \  # GM-CSF + IL-6 10 ng/mL condition\n\n    # Convert ng/mL to nM using the\
      \ IL-6 molecular weight in kDa.\n    # 1 ng/mL corresponds to (1 / MW_kDa) nM.\n\
      \    mw_kda = inputs['IL6_MW_kDa']\n    conv_ngml_to_nM = 1.0 / mw_kda\n\n \
      \   il6_none_nM = il6_none_ng_ml * conv_ngml_to_nM\n    il6_high_nM = il6_high_ng_ml\
      \ * conv_ngml_to_nM\n\n    # Hill-type activation by IL-6, matching the QSP\
      \ formulation\n    def hill(il6_nM):\n        return il6_nM / (ec50 + il6_nM)\n\
      \n    h_none = hill(il6_none_nM)\n    h_high = hill(il6_high_nM)\n\n    # Predicted\
      \ MDSC outputs (cells per well after 5 days)\n    m_none = k_base * (1.0 + emax\
      \ * h_none)\n    m_high = k_base * (1.0 + emax * h_high)\n\n    # Anti-IL-6\
      \ condition is modeled as effectively blocking IL-6, so it shares h_none.\n\
      \    m_ab = k_base * (1.0 + emax * h_none)\n\n    return {\n        'MDSC_none':\
      \ m_none,\n        'MDSC_IL6': m_high,\n        'MDSC_IL6ab': m_ab,\n    }\n"
  error_model:
  - name: MDSC_none_count
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['MDSC_none']\n"
    units: cell
    uses_inputs:
    - MDSC_none_mean
    - MDSC_none_sd
    - n_replicates
    sample_size_input: n_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['MDSC_none_mean']\n    sd = inputs['MDSC_none_sd']\n\
      \    cv = sd / mean\n    sigma_ln = np.sqrt(np.log(1.0 + cv**2))\n    mu_ln\
      \ = np.log(mean) - sigma_ln**2 / 2.0\n    # Bootstrap the mean of n replicates\
      \ from a lognormal parent\n    return rng.lognormal(mu_ln, sigma_ln / np.sqrt(sample_size),\
      \ n_bootstrap)\n"
    n_bootstrap: 10000
  - name: MDSC_IL6_count
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['MDSC_IL6']\n"
    units: cell
    uses_inputs:
    - MDSC_IL6_mean
    - MDSC_IL6_sd
    - n_replicates
    sample_size_input: n_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['MDSC_IL6_mean']\n    sd = inputs['MDSC_IL6_sd']\n\
      \    cv = sd / mean\n    sigma_ln = np.sqrt(np.log(1.0 + cv**2))\n    mu_ln\
      \ = np.log(mean) - sigma_ln**2 / 2.0\n    return rng.lognormal(mu_ln, sigma_ln\
      \ / np.sqrt(sample_size), n_bootstrap)\n"
    n_bootstrap: 10000
  - name: MDSC_IL6ab_count
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['MDSC_IL6ab']\n"
    units: cell
    uses_inputs:
    - MDSC_IL6ab_mean
    - MDSC_IL6ab_sd
    - n_replicates
    sample_size_input: n_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['MDSC_IL6ab_mean']\n    sd = inputs['MDSC_IL6ab_sd']\n\
      \    cv = sd / mean\n    sigma_ln = np.sqrt(np.log(1.0 + cv**2))\n    mu_ln\
      \ = np.log(mean) - sigma_ln**2 / 2.0\n    return rng.lognormal(mu_ln, sigma_ln\
      \ / np.sqrt(sample_size), n_bootstrap)\n"
    n_bootstrap: 10000
  identifiability_notes: 'Only a single supraphysiologic IL-6 concentration (10 ng/mL
    ≈ 0.48 nM) is tested versus baseline (0 ng/mL). As a result, IL6_50_MDSC is constrained
    mainly from above: the data require that EC50 lie well below ~0.5 nM to produce
    the observed ~1.7-fold increase in MDSC counts at 10 ng/mL, assuming Emax_IL6_MDSC
    is not extremely large. The baseline scale parameter k_MDSC_gen_baseline and the
    Emax_IL6_MDSC amplitude are strongly correlated, since rescaling both can preserve
    the same absolute bar heights. The anti-IL-6 condition effectively provides a
    second noisy measurement of the baseline response, tightening k_MDSC_gen_baseline
    but adding little new information on IL6_50_MDSC. Overall, this target should
    be treated as providing a weak inequality-bound on IL6_50_MDSC (EC50 << 10 ng/mL)
    rather than a precise estimate, and its posterior should remain close to the prior
    median unless combined with additional IL-6 titration data from other studies.'
experimental_context:
  species: mouse
  system: in_vitro_primary_cells
  cell_types:
  - name: bone marrow cells
    phenotype: mixed immature myeloid cells from C57BL/6 mouse tibias and femurs
    isolation_method: flushing tibias and femurs followed by red cell lysis
    source: male C57BL/6 mice; National Laboratory Animal Center, Taiwan
  culture_conditions:
    substrate: plastic tissue culture plates
    serum_concentration: 10.0
    serum_concentration_units: percent
    oxygen_level: normoxic (5% CO2 / 95% air)
    culture_type: 2d_monolayer
    medium: RPMI-1640 + 10% fetal calf serum
    supplements: GM-CSF 8 ng/mL with or without recombinant mouse IL-6 10 ng/mL and
      anti-IL-6 antibody 10 µg/mL
    duration: 5-day culture for MDSC differentiation
    notes: Hepatic stellate cells and hepatocellular carcinoma cells are used in other
      experiments in the paper, but the IL-6 titration data used here come from BM
      cultures without added tumor cells.
  indication: hepatocellular carcinoma model context (murine Hepa 1-6) for some experiments,
    but the IL-6 titration data used here are from tumor-free BM cultures.
study_interpretation: Hsieh2019 shows that adding 10 ng/mL recombinant IL-6 to GM-CSF-driven
  murine BM cultures nearly doubles the output of CD11b+Gr-1+ MDSCs relative to GM-CSF
  alone, while neutralizing IL-6 largely reverses this effect. Modeling this with
  the same Hill-type IL-6 gating used in the PDAC QSP model constrains the EC50 parameter
  IL6_50_MDSC to be substantially below the 10 ng/mL dose (≈0.5 nM) and provides a
  weak quantitative bound consistent with the existing prior that places IL6_50_MDSC
  on the order of 0.05–0.1 nM.
key_assumptions:
- GM-CSF concentration (8 ng/mL) is sufficiently high and constant across conditions
  that differences in MDSC output primarily reflect IL-6-dependent modulation rather
  than changes in baseline myelopoiesis.
- Final CD11b+Gr-1+ cell counts after 5 days are approximately proportional to the
  IL-6-modulated MDSC generation rate, so a static Hill-type algebraic model is adequate
  and explicit proliferation/death kinetics can be absorbed into the scale parameter
  k_MDSC_gen_baseline.
- The molecular weight of mouse IL-6 is approximated as 21 kDa for converting ng/mL
  to nM; modest uncertainty in this value has negligible impact on an EC50 that is
  only weakly constrained from a single high dose.
- Anti-IL-6 antibody at 10 µg/mL is assumed to fully neutralize exogenous IL-6 in
  this system, so the IL-6+anti-IL-6 condition is modeled as effectively having zero
  IL-6 activity, providing a second measurement of the baseline response.
- IL-6-driven enhancement of murine BM-derived CD11b+Gr-1+ MDSCs in this GM-CSF culture
  reflects the same IL-6→MDSC potency that operates in the PDAC tumor microenvironment,
  despite differences between liver and pancreatic stromal contexts.
key_study_limitations:
- Only a single IL-6 concentration (10 ng/mL) is tested, so the data cannot define
  a full dose–response curve; IL6_50_MDSC is constrained mainly as an upper bound
  and remains strongly informed by the prior.
- The experiment uses mouse bone marrow cells in vitro without a tumor present, whereas
  the QSP parameter targets human PDAC tumor-associated MDSCs in vivo; species and
  context differences introduce substantial translation uncertainty.
- GM-CSF is present in all conditions at 8 ng/mL and may interact nonlinearly with
  IL-6 in governing MDSC output, but this interaction is not resolved with the available
  data and is implicitly absorbed into the scale and Emax parameters.
- Absolute MDSC numbers are derived from digitized bar heights rather than tabulated
  values, adding small additional measurement error beyond the reported SDs.
- The in vitro culture represents an early differentiation phase over 5 days, not
  steady-state trafficking and survival of MDSCs in a tumor microenvironment, so the
  mapping from cell counts to in vivo recruitment rates is approximate.
primary_data_source:
  doi: 10.3390/ijms20205079
  title: Hepatic Stellate Cells Enhance Liver Cancer Progression by Inducing Myeloid-Derived
    Suppressor Cells through Interleukin-6 Signaling
  authors:
  - Hsieh
  year: 2019
  source_tag: Hsieh2019
  source_relevance:
    indication_match: proxy
    indication_match_justification: The study investigates IL-6–mediated MDSC generation
      primarily in the context of murine hepatocellular carcinoma, whereas the QSP
      model targets human pancreatic ductal adenocarcinoma. Both are solid tumors
      with chronic inflammation and myeloid-driven immunosuppression, and IL-6–STAT3
      signaling is a shared pathway for MDSC expansion, but organ-specific stroma
      and cytokine milieus differ substantially.
    species_source: mouse
    species_target: human
    source_quality: primary_animal_in_vitro
    perturbation_type: pharmacological
    perturbation_relevance: Recombinant mouse IL-6 at 10 ng/mL is added exogenously
      to GM-CSF-driven BM cultures, producing a supraphysiologic IL-6 signal that
      likely represents near-maximal stimulation of the IL-6→MDSC pathway. This should
      be interpreted as providing an upper-bound constraint on the EC50 (IL6_50_MDSC)
      rather than a direct measure of in vivo potency.
    tme_compatibility: moderate
    tme_compatibility_notes: The GM-CSF+IL-6 BM culture captures IL-6-driven myeloid
      differentiation but lacks the complex desmoplastic and hypoxic microenvironment
      of PDAC. However, IL-6 receptor expression and downstream STAT3/JAK signaling
      in immature myeloid cells are expected to be similar across tumor types, so
      the main difference is in background cytokine levels and stromal architecture
      rather than intrinsic IL-6 potency.
    measurement_directness: direct
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: in_vitro_primary
    validation_warnings: []
