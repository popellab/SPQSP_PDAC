  indication: PDAC
study_interpretation: This target uses short-term in vitro co-culture data to constrain
  the macrophage-mediated phagocytic killing parameters in the IO-PDAC QSP model.
  Ma2025 provides CCK-8 killing ratios for several carcinoma cell lines (LLC, Hepa1-6,
  Huh7) co-cultured with macrophages at multiple effector:target ratios, enabling
  calibration of the saturation constant K_M1_phago and the effective killing rate
  k_M1_phago through the shared r/(r + K_M1_phago) dependence present in the full
  model. Song2020 provides PDAC-specific phagocytic indices for macrophages engulfing
  Panc02 cells with and without anti-CD47 treatment, which primarily constrain the
  checkpoint gating factor H_Mac_C by quantifying how much phagocytosis increases
  when the CD47 "don't eat me" signal is blocked. Together, these data support a generic
  macrophage-tumor association constant applicable across carcinomas, while anchoring
  the magnitude of CD47-dependent checkpoint inhibition in the PDAC context.
key_assumptions:
- Macrophage-mediated tumor cell killing over 24 h in Ma2025 can be approximated as
  an exponential survival process with a constant per-cell killing rate proportional
  to r/(r + K_M1_phago), where r is the effector:target ratio.
- Short-term CCK-8 killing ratios primarily reflect phagocytic killing by macrophages
  rather than alternative cytotoxic mechanisms, so they can be mapped directly to
  the phagocytosis reaction in the QSP model.
- The association constant K_M1_phago and the intrinsic killing rate k_M1_phago are
  approximately conserved across the carcinoma models used (LLC, Hepa1-6, Huh7), so
  a single pair of parameters can explain the combined E:T-dependence of all three
  datasets.
- IL-10-mediated inhibition of phagocytosis (H_IL10_phago) is negligible in these
  short-term in vitro assays and is therefore set to zero in the submodel.
- Song2020 PDAC phagocytic indices over 2 h are proportional to the effective phagocytic
  rate times the checkpoint gating factor (1 - H_Mac_C); differences between IgG and
  anti-CD47 conditions arise predominantly from changes in H_Mac_C, not from changes
  in intrinsic macrophage killing machinery.
- Anti-CD47 treatment in Song2020 is assumed to fully relieve CD47-mediated inhibition
  of macrophage phagocytosis (H_Mac_C -> 0 in the assay), so the fold-change in phagocytic
  index between IgG and anti-CD47 directly constrains H_Mac_C.
key_study_limitations:
- Ma2025 uses mouse BMDMs, Kupffer cells, and human THP1-derived macrophages co-cultured
  with non-PDAC carcinoma lines (LLC, Hepa1-6, Huh7), so translation of the inferred
  K_M1_phago and k_M1_phago to human PDAC TAMs introduces uncertainty related to species
  and tumor-type differences.
- The CCK-8 assay readout integrates all forms of tumor cell death over 24 h, which
  may include non-phagocytic mechanisms; mapping this to a pure phagocytic killing
  rate assumes that phagocytosis dominates under the conditions studied.
- The model assumes a single shared k_M1_phago and K_M1_phago across three different
  tumor lines; any genuine line-specific differences in susceptibility to macrophage
  killing are absorbed into residual variability rather than modeled explicitly.
- Song2020 phagocytic indices are measured at a single effector:target ratio and short
  time (2 h), so they constrain only the relative checkpoint gating (H_Mac_C) and
  not the full saturation curve with respect to macrophage density.
- The number of replicates for Song2020 phagocytic assays is inferred (n≈3) based
  on typical practice and error-bar sizes, as explicit sample-size text is not available
  in the provided excerpt, introducing some uncertainty in the estimated observational
  variance.
- In vitro coculture systems lack the complex PDAC tumor microenvironment (dense stroma,
  hypoxia, cytokine gradients) that can modulate macrophage function in vivo, so the
  calibrated parameters may represent upper bounds on phagocytic efficiency in tumors.
primary_data_source:
  doi: 10.1136/jitc-2025-013425
  title: TIPE2 deficiency enhances macrophage phagocytosis of tumor cells
  authors:
  - Zelong Ma
  - Yingyue Wang
  - Yanlei Dong
  - Hong Yuan
  - Ruoxuan Yang
  - Ying Xiao
  - Chun Guo
  - Ruirui Wang
  - Jianing Wang
  - Xiaoyan Wang
  - Faliang Zhu
  - Lining Zhang
  - Yuchen Fan
  - Yongyu Shi
  year: 2025
  source_tag: Ma2025
  source_relevance:
    indication_match: proxy
    indication_match_justification: Ma2025 studies macrophage phagocytosis against
      multiple murine and human carcinoma cell lines (LLC, Hepa1-6, MC38, B16-F10,
      Huh7, Hep3B) rather than PDAC specifically. However, the underlying mechanism
      of antibody-independent phagocytic killing and its saturation with effector:target
      ratio is expected to be similar across solid epithelial tumors, so these data
      can serve as a mechanistic proxy for PDAC while acknowledging possible quantitative
      differences in susceptibility and checkpoint expression.
    species_source: mouse
    species_target: human
    source_quality: primary_animal_in_vitro
    perturbation_type: genetic_perturbation
    perturbation_relevance: The study focuses on TIPE2-deficient vs wild-type macrophages
      to reveal regulatory mechanisms of phagocytosis. For calibration of K_M1_phago
      and k_M1_phago, only the wild-type (or shNC) arms of the effector:target titrations
      are used, treating them as approximations to physiological baseline phagocytic
      function. TIPE2-deficient data are not used directly for parameter estimation
      but support the mechanistic interpretation that intrinsic phagocytic capacity
      can vary without altering the form of the r/(r+K) saturation.
    tme_compatibility: moderate
    tme_compatibility_notes: The experiments are performed in 2D co-culture without
      the desmoplastic stroma, hypoxia, and complex immune contexture characteristic
      of PDAC, which likely leads to higher effective phagocytic efficiencies than
      in vivo PDAC tumors. Nevertheless, the basic dependence of killing on effector:target
      ratio should be preserved, making the data moderately compatible for inferring
      K_M1_phago while expecting that absolute k_M1_phago may be an upper bound.
    measurement_directness: single_inversion
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: in_vitro_primary
secondary_data_sources:
- doi: 10.3892/etm.2020.9054
  title: Targeting cluster of differentiation 47 improves the efficacy of anti-cytotoxic
    T-lymphocyte associated protein 4 treatment via antigen presentation enhancement
    in pancreatic ductal adenocarcinoma
  authors:
  - Xifu Song
  - Zenghong Lu
  - Jianqing Xu
  year: 2020
  source_tag: Song2020
  contribution: Provides PDAC-specific quantitative phagocytic indices for macrophages
    engulfing Panc02 cells with and without anti-CD47 treatment, constraining the
    checkpoint gating factor H_Mac_C in the macrophage phagocytosis term.
  source_relevance:
    indication_match: exact
    indication_match_justification: Song2020 directly studies pancreatic ductal adenocarcinoma
      using the murine Panc02 PDAC cell line, including analyses of CD47 expression
      and macrophage/dendritic-cell phagocytosis, making it highly indication-matched
      to the IO-PDAC model.
    species_source: mouse
    species_target: human
    source_quality: primary_animal_in_vitro
    perturbation_type: pharmacological
    perturbation_relevance: Anti-CD47 monoclonal antibody is used to block the CD47–SIRPalpha
      axis, thereby relieving a key phagocytosis checkpoint. In the QSP model, this
      is interpreted as setting the checkpoint gating term H_Mac_C toward zero under
      saturating anti-CD47 exposure. The fold-increase in phagocytosis with anti-CD47
      thus informs the baseline value of H_Mac_C in untreated PDAC.
    tme_compatibility: moderate
    tme_compatibility_notes: The phagocytosis assays are performed in 2D co-culture
      of murine peritoneal macrophages with Panc02 cells, lacking the dense stroma
      and immunosuppressive milieu of PDAC tumors in vivo. While the overall magnitude
      of phagocytosis may be overestimated relative to in-tumor conditions, the relative
      effect of CD47 blockade on macrophage phagocytic efficiency is expected to translate
      qualitatively to the PDAC tumor microenvironment.
    measurement_directness: single_inversion
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: in_vitro_primary
