calibration:
  parameters:
  - name: K_M1_phago
    units: dimensionless
    nuisance: false
  - name: k_M1_phago
    units: 1/day
    nuisance: false
  - name: logit_H_Mac_C
    units: dimensionless
    nuisance: true
    prior:
      distribution: normal
      mu: 0.3
      sigma: 1.0
  - name: beta_pdac_phago
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 0.0
      sigma: 1.0
  - name: alpha_Hepa
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 0.0
      sigma: 0.5
  - name: alpha_Huh7
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 0.0
      sigma: 0.5
  forward_model:
    data_rationale: Ma2025 reports CCK-8-based killing ratios (%) of carcinoma cells
      by macrophages over 24 h at multiple effector:target ratios (1:1, 3:1, 5:1).
      These data constrain how the 24 h killing fraction saturates with effector:target
      ratio, allowing estimation of the association constant K_M1_phago and the per-day
      phagocytic killing rate k_M1_phago. Song2020 reports PDAC-specific phagocytic
      indices for macrophages engulfing Panc02 cells with and without anti-CD47 treatment
      at a single effector:target ratio over 2 h, which primarily constrain the checkpoint
      gating term H_Mac_C through the fold-change in phagocytosis.
    submodel_rationale: In the full QSP IO-PDAC model, M1 macrophage-mediated killing
      of cancer cells is parameterized as k_M1_phago * C1 * Mac_M1 / (Mac_M1 + K_M1_phago
      * C_total + cell) * (1 - H_Mac_C) * (1 - H_IL10_phago). For fixed total tumor
      cell number, this implies an effective rate proportional to r/(r + K_M1_phago)
      where r is the effector:target ratio Mac_M1/C_total. The algebraic submodel
      uses the same r/(r + K_M1_phago) dependence to map k_M1_phago and K_M1_phago
      to an integrated 24 h killing fraction, while Song2020 data constrain the checkpoint
      gating factor (1 - H_Mac_C) via relative phagocytic indices with and without
      CD47 blockade. IL-10-mediated inhibition is absent in these short-term in vitro
      assays and is therefore omitted (set to zero) in this submodel.
    type: algebraic
    formula: 'Killing over 24h: kill_frac = 1 - exp(-k_M1_phago * r/(r + K_M1_phago)
      * T_24h). PDAC phagocytic index ~ beta_pdac_phago * (1 - H_Mac_C) with anti-CD47
      setting H_Mac_C -> 0. H_Mac_C = sigmoid(logit_H_Mac_C) to ensure H in (0,1).'
    code: "def compute(params, inputs):\n    import numpy as np\n    k = params['k_M1_phago']\n\
      \    K = params['K_M1_phago']\n    # Logit-normal reparameterization: H_Mac_C = sigmoid(logit_H_Mac_C)\n\
      \    # Ensures H in (0,1), eliminating the likelihood cliff at H=1\n\
      \    # that caused 2094 MCMC divergences with the old lognormal(0,0.7) prior.\n\
      \    H = 1.0 / (1.0 + np.exp(-params['logit_H_Mac_C']))\n    beta = params['beta_pdac_phago']\n\
      \    a_hepa = params['alpha_Hepa']\n    a_huh7 = params['alpha_Huh7']\n\
      \    # Effector:target ratios\n    r1 = inputs['ET_1_1']\n    r3 = inputs['ET_3_1']\n\
      \    r5 = inputs['ET_5_1']\n    T24 = inputs['T_24h_unit']\n\n    def kill24(r, alpha=1.0):\n\
      \        return 1.0 - np.exp(-k * alpha * r / (r + K) * T24)\n\n    preds = {}\n\
      \    # Ma2025 CCK-8 killing ratios (fractions 0-1)\n    # LLC = reference cell line (alpha=1)\n\
      \    preds['LLC_ET1'] = kill24(r1)\n    preds['LLC_ET3'] = kill24(r3)\n\
      \    preds['LLC_ET5'] = kill24(r5)\n    preds['Hepa_ET1'] = kill24(r1, a_hepa)\n\
      \    preds['Hepa_ET3'] = kill24(r3, a_hepa)\n    preds['Hepa_ET5'] = kill24(r5, a_hepa)\n\
      \    preds['Huh7_ET1'] = kill24(r1, a_huh7)\n    preds['Huh7_ET3'] = kill24(r3, a_huh7)\n\
      \    preds['Huh7_ET5'] = kill24(r5, a_huh7)\n    # Song2020 PDAC phagocytic index\n\
      \    preds['PDAC_IgG'] = beta * (1.0 - H)\n    preds['PDAC_aCD47'] = beta * 1.0\n\
      \    return preds\n"
  error_model:
  - name: LLC_ET1_killing
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['LLC_ET1']\n"
    units: dimensionless
    uses_inputs:
    - kill_LLC_ET1_mean_percent
    - kill_LLC_ET1_sd_percent
    - percent_to_fraction
    sample_size_input: n_reps_Ma_kill
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean_percent = inputs['kill_LLC_ET1_mean_percent']\n\
      \    sd_percent = inputs['kill_LLC_ET1_sd_percent']\n    ptf = inputs['percent_to_fraction']\n\
      \    mean = mean_percent * ptf\n    sd = sd_percent * ptf\n    cv = sd / mean\n\
      \    sigma_ln = np.sqrt(np.log(1.0 + cv**2))\n    mu_ln = np.log(mean) - sigma_ln**2\
      \ / 2.0\n    return rng.lognormal(mu_ln, sigma_ln / np.sqrt(sample_size), n_bootstrap)\n"
    n_bootstrap: 10000
  - name: LLC_ET3_killing
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['LLC_ET3']\n"
    units: dimensionless
    uses_inputs:
    - kill_LLC_ET3_mean_percent
    - kill_LLC_ET3_sd_percent
    - percent_to_fraction
    sample_size_input: n_reps_Ma_kill
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean_percent = inputs['kill_LLC_ET3_mean_percent']\n\
      \    sd_percent = inputs['kill_LLC_ET3_sd_percent']\n    ptf = inputs['percent_to_fraction']\n\
      \    mean = mean_percent * ptf\n    sd = sd_percent * ptf\n    cv = sd / mean\n\
      \    sigma_ln = np.sqrt(np.log(1.0 + cv**2))\n    mu_ln = np.log(mean) - sigma_ln**2\
      \ / 2.0\n    return rng.lognormal(mu_ln, sigma_ln / np.sqrt(sample_size), n_bootstrap)\n"
    n_bootstrap: 10000
  - name: LLC_ET5_killing
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['LLC_ET5']\n"
    units: dimensionless
    uses_inputs:
    - kill_LLC_ET5_mean_percent
    - kill_LLC_ET5_sd_percent
    - percent_to_fraction
    sample_size_input: n_reps_Ma_kill
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean_percent = inputs['kill_LLC_ET5_mean_percent']\n\
      \    sd_percent = inputs['kill_LLC_ET5_sd_percent']\n    ptf = inputs['percent_to_fraction']\n\
      \    mean = mean_percent * ptf\n    sd = sd_percent * ptf\n    cv = sd / mean\n\
      \    sigma_ln = np.sqrt(np.log(1.0 + cv**2))\n    mu_ln = np.log(mean) - sigma_ln**2\
      \ / 2.0\n    return rng.lognormal(mu_ln, sigma_ln / np.sqrt(sample_size), n_bootstrap)\n"
    n_bootstrap: 10000
  - name: Hepa_ET1_killing
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['Hepa_ET1']\n"
    units: dimensionless
