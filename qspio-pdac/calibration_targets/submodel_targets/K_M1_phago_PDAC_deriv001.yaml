  identifiability_notes: The Ma2025 CCK-8 killing data at three effector:target ratios
    and across three tumor cell lines (LLC, Hepa1-6, Huh7) constrain the shape of
    the dependence of 24 h killing fraction on effector:target ratio. Under the assumption
    of a shared k_M1_phago and K_M1_phago across these in vitro systems, K_M1_phago
    is primarily informed by the curvature of killing vs E:T across 1:1, 3:1, 5:1,
    while k_M1_phago is informed by the overall scale of the killing fractions. These
    parameters will be correlated (larger k_M1_phago can partially compensate for
    larger K_M1_phago), but the use of multiple E:T values and multiple cell lines
    provides enough structure to keep them reasonably identifiable. The Song2020 PDAC
    phagocytic indices do not inform K_M1_phago directly (single E:T) but strongly
    constrain H_Mac_C through the ratio of phagocytosis with and without anti-CD47
    treatment, which is independent of the nuisance beta_pdac_phago. Beta_pdac_phago
    is non-identifiable in absolute terms but acts only as a nuisance scaling factor
    for PDAC phagocytic indices and does not affect the posterior of K_M1_phago. Overall,
    the target provides direct constraints on K_M1_phago and H_Mac_C and moderate
    constraints on k_M1_phago, with expected correlations between k_M1_phago and K_M1_phago
    that will be resolved further by other targets sharing k_M1_phago in the full
    joint inference.
