calibration:
  parameters:
  - name: k_nTreg_death
    units: 1/day
    nuisance: false
  forward_model:
    data_rationale: denBraber2012 provide an absolute daily turnover fraction for
      the total human naive CD4+ T cell pool, while Silva2016 show that naive Tregs
      have a much higher cycling (Ki-67+) fraction than naive conventional CD4 T cells.
      Under steady-state homeostasis, turnover (division) approximately balances loss
      (death plus differentiation). The product of the naive CD4 turnover rate and
      the naive-Treg-to-naive-Tconv cycling ratio therefore yields an empirical naive
      Treg death/turnover rate. The algebraic forward model simply maps the QSP death-rate
      parameter k_nTreg_death to this observable for comparison with the empirically
      derived value.
    submodel_rationale: In the full QSPIO-PDAC model, k_nTreg_death is the compartment-agnostic
      first-order loss rate for naive Tregs in blood, peripheral tissues, and lymph
      nodes. Under homeostatic conditions without strong antigenic activation, naive
      Treg numbers are approximately steady, so their per-cell division rate matches
      their per-cell loss rate. The empirical naive Treg turnover rate inferred from
      human data (baseline naive CD4 turnover scaled by the naive Treg vs naive Tconv
      cycling ratio) should therefore equal k_nTreg_death. Using an algebraic identity
      between k_nTreg_death and the observable maintains exact mechanistic consistency
      with the first-order death reactions in the full model.
    type: algebraic
    formula: k_nTreg_death_obs = k_nTreg_death
    code: "def compute(params, inputs):\n    # For this target, the observable is\
      \ simply the naive Treg death rate\n    # because the empirical value derived\
      \ from the data already represents\n    # a per-day first-order loss rate under\
      \ homeostatic conditions.\n    return params['k_nTreg_death']"
  error_model:
  - name: k_nTreg_death_inferred_from_turnover_and_Ki67
    units: 1/day
    uses_inputs:
    - naiveCD4_turnover_per_day
    - naiveCD4_turnover_lognormal_width
    - naiveTreg_to_naiveTconv_ki67_ratio
    - ki67_ratio_lognormal_width
    - n_effective_turnover_ratio
    sample_size_input: n_effective_turnover_ratio
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    # Baseline naive CD4+ T cell turnover rate (fraction\
      \ of pool renewed per day)\n    t_mean = inputs['naiveCD4_turnover_per_day']\
      \  # already in 1/day\n    width_t = inputs['naiveCD4_turnover_lognormal_width']\n\
      \    mu_t = np.log(t_mean) - (width_t**2) / 2.0\n    \n    # Naive Treg vs naive\
      \ Tconv cycling (Ki-67+) ratio\n    r_mean = inputs['naiveTreg_to_naiveTconv_ki67_ratio']\n\
      \    width_r = inputs['ki67_ratio_lognormal_width']\n    mu_r = np.log(r_mean)\
      \ - (width_r**2) / 2.0\n    \n    # Draw bootstrap samples for the study-level\
      \ means of turnover and ratio\n    # sample_size reflects the effective number\
      \ of independent observations\n    t_samples = rng.lognormal(mu_t, width_t /\
      \ np.sqrt(sample_size), n_bootstrap)\n    r_samples = rng.lognormal(mu_r, width_r\
      \ / np.sqrt(sample_size), n_bootstrap)\n    \n    # Empirical naive Treg death/turnover\
      \ rate is approximated as\n    # k_nTreg_death_data = naiveCD4_turnover * (Ki67_Treg\
      \ / Ki67_Tconv)\n    k_samples = t_samples * r_samples\n    return k_samples"
    n_bootstrap: 10000
  identifiability_notes: 'This target constrains k_nTreg_death by anchoring it to
    two human data sources: (1) the overall naive CD4+ T cell turnover fraction per
    day from denBraber2012, and (2) the fold-increase in cycling (Ki-67+) naive Tregs
    relative to naive conventional CD4 T cells from Silva2016. Under the assumption
    of near-steady-state homeostasis, per-cell division balances per-cell loss, so
    the naive Treg death rate is approximated as the product of the baseline naive
    CD4 turnover rate and the naive-Treg-to-naive-Tconv cycling ratio. The lognormal
    width parameters for each constituent measurement are treated as conservative
    reference values to introduce realistic uncertainty. The resulting posterior for
    k_nTreg_death should move the prior toward values on the order of 10x the naive
    CD4 turnover rate (i.e., lifespans of a few months rather than many years), while
    still allowing for substantial uncertainty.'
experimental_context:
  species: human
  system: clinical_in_vivo
  indication: systemic_naive_T_cell_homeostasis
study_interpretation: denBraber2012 quantified that in adult humans roughly 0.05%
  of the naive CD4+ T cell pool is renewed each day, corresponding to an average lifespan
  of several years under homeostatic conditions. Silva2016 demonstrated that naive
  FoxP3+ regulatory T cells have a markedly higher homeostatic cycling fraction than
  naive conventional CD4 T cells (roughly 10-15-fold higher Ki-67+ and EdU+ proportions),
  yet their overall naive Treg pool size is preserved even in thymectomized adults,
  implying that increased peripheral proliferation is balanced by increased loss.
  Combining these findings under a steady-state assumption allows estimation of a
  naive Treg-specific first-order loss (death) rate as the product of the baseline
  naive CD4 turnover rate and the naive-Treg-to-naive-Tconv cycling ratio. This composite
  human-based estimate directly maps to the QSP model parameter k_nTreg_death, which
  governs naive Treg loss in blood, peripheral tissues, and lymph nodes in the PDAC
  model.
key_assumptions:
- Human naive CD4+ T cell turnover measured by denBraber2012 (0.05% of the pool renewed
  per day) reflects a near-steady-state balance of division and loss under physiological
  conditions.
- Naive Tregs in healthy adults are also at approximate steady state, so their per-cell
  division rate equals their per-cell loss rate (death plus differentiation), allowing
  cycling (Ki-67+/EdU+) fractions to be used as a proxy for relative turnover rates.
- The ratio of Ki-67+ naive Tregs to Ki-67+ naive Tconvs reported by Silva2016 approximates
  the fold-difference in their per-cell turnover rates, and this ratio can scale the
  bulk naive CD4 turnover rate to a naive Treg-specific rate.
- Differences between healthy/thymectomized adult donors (Silva2016, denBraber2012)
  and PDAC patients primarily affect activation and effector compartments rather than
  the baseline homeostatic naive Treg death rate, so these healthy-donor measurements
  are acceptable proxies.
- Approximate log-space width parameters for the naive CD4 turnover rate and Ki-67
  ratio are treated as conservative reference values to encode uncertainty without
  overfitting limited cohort data.
key_study_limitations:
- Neither Silva2016 nor denBraber2012 directly measure naive Treg death rates; the
  parameter is inferred indirectly by combining naive CD4 turnover with relative cycling
  fractions, which depends on steady-state and proportionality assumptions.
- Silva2016 studies healthy young adults and adults thymectomized in infancy, while
  denBraber2012 examines healthy adults; neither cohort includes PDAC patients, so
  systemic inflammation or treatment effects in PDAC may alter naive Treg homeostasis.
- Ki-67 and EdU are markers of cells in or recently having passed through the cell
  cycle, not direct measures of per-cell division or death rates, and their relationship
  to long-term turnover may be nonlinear.
- denBraber2012 uses deuterium labeling and mathematical modeling to infer turnover
  rates and lifespans; any model misspecification or cohort-specific effects propagate
  into the naive CD4 turnover estimate used here.
- The lognormal width parameters for turnover and Ki-67 ratio are approximate reference
  values rather than directly measured uncertainties, so the resulting constraint
  on k_nTreg_death should be interpreted as order-of-magnitude rather than highly
  precise.
primary_data_source:
  doi: 10.18632/oncotarget.7707
  year: 2016
  source_tag: Silva2016
  source_relevance:
    indication_match: proxy
    indication_match_justification: Silva2016 investigates naive regulatory and conventional
      CD4 T-cell homeostasis in healthy adults and adults thymectomized in infancy,
      not in PDAC patients. However, the parameter of interest (naive Treg death/turnover
      rate) describes systemic homeostatic dynamics in blood and secondary lymphoid
      organs, which are expected to be similar in otherwise immunocompetent adults
      and to provide a reasonable proxy for baseline naive Treg loss in PDAC patients
      before strong therapy-driven perturbations.
    species_source: human
    species_target: human
    source_quality: primary_human_clinical
    perturbation_type: physiological_baseline
    perturbation_relevance: The main Ki-67 and EdU measurements used here are made
      ex vivo on circulating and tonsillar T cells from otherwise healthy or stable
      thymectomized individuals, representing near-physiological homeostasis without
      pharmacological or genetic perturbations; they therefore approximate baseline
      human naive Treg proliferation dynamics.
    tme_compatibility: moderate
    tme_compatibility_notes: Measurements are made in blood, thymus, and tonsils rather
      than in the PDAC tumor microenvironment. While the QSP parameter k_nTreg_death
      governs naive Treg loss in systemic compartments (central, peripheral, lymph
      node), PDAC-associated systemic inflammation, prior therapies, or age-related
      changes could alter naive Treg turnover compared with the healthy adult donors
      in Silva2016.
    measurement_directness: proxy_observable
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: clinical_in_vivo
