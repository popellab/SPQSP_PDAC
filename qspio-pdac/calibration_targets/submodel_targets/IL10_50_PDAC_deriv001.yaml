  year: 2023
  source_tag: UniProt_IL10
  contribution: Provided the molecular weight of mature human IL-10 used to convert
    IC50 values from pg/mL to picomolar units for parameter IL10_50 calibration.
  source_relevance:
    indication_match: exact
    indication_match_justification: The UniProt IL10_HUMAN entry provides sequence-derived
      physicochemical properties (including molecular weight) for human interleukin-10,
      independent of disease indication. This is directly applicable to any human
      IL-10 biology, including PDAC, because the amino acid sequence and molecular
      weight of IL-10 do not depend on indication.
    species_source: human
    species_target: human
    source_quality: textbook
    perturbation_type: physiological_baseline
    perturbation_relevance: The molecular weight is a fixed physicochemical property
      of the IL-10 protein and is not altered by pharmacological or genetic perturbations
      in the cited experimental systems. It is used purely for unit conversion between
      mass and molar concentration.
    tme_compatibility: high
    tme_compatibility_notes: Protein molecular weight is independent of tumor microenvironment;
      thus, there is effectively no translation uncertainty from this source when
      applying the value to PDAC.
    measurement_directness: direct
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: in_vitro_primary
