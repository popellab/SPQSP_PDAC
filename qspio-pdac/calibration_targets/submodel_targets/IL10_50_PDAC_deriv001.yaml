calibration:
  parameters:
  - name: IL10_50
    units: picomolarity
    nuisance: false
  forward_model:
    data_rationale: Seldon1998 reports an IC50 for recombinant human IL-10 inhibition
      of LPS-induced TNF-alpha secretion from human peripheral blood monocytes (124.1
      +/- 27.2 pg/mL). This is a direct pharmacodynamic potency measurement for IL-10
      signaling on human myeloid cells. By converting this IC50 to picomolar units,
      we obtain a quantitative estimate for the half-maximal IL-10 concentration that
      suppresses pro-inflammatory macrophage function, which maps to IL10_50 in the
      QSP model.
    submodel_rationale: In the full QSP PDAC model, IL10_50 is the half-maximal IL-10
      level in the Hill term IL10/(IL10+IL10_50) that gates M1 to M2 macrophage polarization
      and related immunosuppressive functions. The experimental IC50 for IL-10-mediated
      inhibition of TNF-alpha production from human monocytes reflects a closely related
      IL-10 receptor signaling potency on myeloid cells. Assuming similar IL-10 receptor
      affinity and signaling thresholds between circulating monocytes and tumor-associated
      macrophages, we equate the IC50 (in pM) to IL10_50 for use in the macrophage
      polarization reaction.
    type: algebraic
    formula: IC50_IL10_pM = IL10_50
    code: "def compute(params, inputs):\n    # IL10_50 is defined in the QSP model\
      \ as the half-maximal IL-10 concentration (pM)\n    # for macrophage functional\
      \ modulation (e.g., M1 to M2 polarization).\n    # Here we equate the experimentally\
      \ measured IL-10 IC50 (in pM) for inhibition of\n    # LPS-induced TNF-alpha\
      \ secretion from human monocytes directly to IL10_50.\n    return params['IL10_50']\n"
  error_model:
  - name: IL10_IC50_TNFalpha_inhibition
    units: picomolarity
    uses_inputs:
    - il10_ic50_mean_pgml
    - il10_ic50_sem_pgml
    - n_ic50_experiments
    - pgml_to_pM_factor
    sample_size_input: n_ic50_experiments
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    # Extract IC50 mean and SEM in pg/mL from the paper\n\
      \    mean_pg = inputs['il10_ic50_mean_pgml']\n    sem_pg = inputs['il10_ic50_sem_pgml']\n\
      \    # Conversion factor from pg/mL to pM for IL-10\n    factor = inputs['pgml_to_pM_factor']\n\
      \    # Convert mean and SEM to pM\n    mean_pM = mean_pg * factor\n    sem_pM\
      \ = sem_pg * factor\n    # The paper reports mean +/- SEM based on n experiments;\
      \ convert SEM to SD\n    n = float(sample_size)\n    sd_pM = sem_pM * np.sqrt(n)\n\
      \    # Use a lognormal distribution for the positive IC50 value\n    cv = sd_pM\
      \ / mean_pM\n    sigma_ln = np.sqrt(np.log(1 + cv**2))\n    mu_ln = np.log(mean_pM)\
      \ - sigma_ln**2 / 2\n    return rng.lognormal(mu_ln, sigma_ln / np.sqrt(n),\
      \ n_bootstrap)\n"
    n_bootstrap: 10000
  identifiability_notes: This target uses a single experimentally reported IC50 value
    (with SEM) for IL-10 inhibition of TNF-alpha secretion from human monocytes. After
    converting to picomolar units, the observable is essentially the IC50 in pM, which
    is directly equated to the QSP parameter IL10_50 via an identity algebraic model.
    As a result, IL10_50 is well constrained around the experimental value (on the
    order of 5-10 pM), with uncertainty dominated by experimental variability and
    translation from circulating monocytes to tumor-associated macrophages. No additional
    QSP parameters are included here, so there are no internal parameter correlations
    in this target; correlations will arise only through shared hierarchical priors
    across other targets that involve IL10_50.
experimental_context:
  species: human
  system: in_vitro_primary_cells
  cell_types:
  - name: peripheral blood monocytes
    phenotype: adherent CD14+ monocytes isolated from healthy donors
    isolation_method: Percoll density gradient separation of leukocyte-rich plasma
      followed by adherence purification (>90% purity)
    source: Peripheral blood from normal healthy individuals (antecubital venepuncture)
  culture_conditions:
    substrate: plastic tissue culture-treated 24-well plates
    serum_concentration: 10.0
    serum_concentration_units: percent
    oxygen_level: normoxic (5% CO2 in air)
    culture_type: 2d_monolayer
    medium: Dutch modified RPMI-1640 supplemented with 10% FCS, 2 mM L-glutamine,
      100 U/mL penicillin, 100 ug/mL streptomycin
    supplements: None beyond LPS (3 ng/mL) and recombinant human IL-10 dose-response
      (1 pg/mL to 30 ng/mL)
    duration: Monocytes adhered for 90 min, then cultured for 18 h with LPS +/- IL-10
      for IC50 measurement
    notes: Monocytes were seeded at 5 x 10^5 cells per well (10^6 cells/mL) unless
      otherwise stated; LPS concentration for IC50 experiment was 3 ng/mL (EC90).
  indication: healthy donors (used as mechanistic proxy for PDAC tumor-associated
    macrophages)
study_interpretation: Seldon1998 demonstrates that recombinant human IL-10 potently
  and concentration-dependently inhibits LPS-induced TNF-alpha secretion from primary
  human peripheral blood monocytes, with a fitted IC50 of 124.1 +/- 27.2 pg/mL at
  18 h. After conversion based on the IL-10 molecular weight, this corresponds to
  an IL-10 potency of roughly 6-7 pM for functional suppression of pro-inflammatory
  cytokine production by human myeloid cells. In the QSP PDAC model, IL10_50 controls
  the IL-10 Hill term that drives M1 to M2 macrophage polarization and related immunosuppressive
  functions. Assuming that the IL-10 receptor signaling threshold for suppressing
  TNF-alpha production in circulating monocytes is comparable to that for inducing
  M2-like behavior in tumor-associated macrophages, this IC50 provides a direct quantitative
  constraint on IL10_50 in human PDAC.
key_assumptions:
- The IL-10 concentration that yields half-maximal inhibition of TNF-alpha secretion
  from LPS-activated human peripheral blood monocytes (ex vivo) is a good proxy for
  the IL-10 concentration that yields half-maximal promotion of M2-like phenotype
  and immunosuppressive function in tumor-associated macrophages in PDAC.
- IL-10 receptor binding affinity and downstream signaling potency (STAT3/STAT6-related
  pathways) are similar between circulating monocytes from healthy donors and macrophages
  within the human PDAC tumor microenvironment.
- The reported IC50 (124.1 +/- 27.2 pg/mL) is well approximated by a lognormal distribution,
  and the quoted uncertainty represents SEM over four independent donors, allowing
  conversion to SD via SD = SEM * sqrt(n).
- Any additional modulation of TNF-alpha secretion by cAMP-elevating drugs in Seldon1998
  does not substantially alter the intrinsic IL-10 potency parameter inferred from
  the IL-10-only concentration-response curve.
- Differences between TNF-alpha secretion readouts and actual macrophage polarization
  state (M1 vs M2 markers) do not significantly affect the characteristic IL-10 concentration
  scale (on the order of a few pM).
key_study_limitations:
- The experiments use peripheral blood monocytes from healthy donors stimulated acutely
  with LPS, whereas the QSP model parameter IL10_50 pertains to tumor-associated macrophages
  chronically exposed to complex PDAC tumor microenvironmental signals (e.g., hypoxia,
  stromal factors, other cytokines).
- The readout is inhibition of TNF-alpha secretion at a single 18 h timepoint rather
  than direct measurement of M1-to-M2 polarization fraction or marker expression,
  so the mapping from IL-10 potency on cytokine secretion to IL-10 potency on polarization
  is assumed rather than demonstrated.
- Only one IC50 value (with SEM from four preparations) is reported, so the statistical
  characterization of variability is limited and relies on assuming approximate lognormal
  behavior of the IC50 estimate.
- IL-10 molecular weight is not specified in Seldon1998 and must be taken from an
  external protein reference (UniProt), introducing a small but non-zero source of
  uncertainty into the pg/mL to pM conversion.
- In vitro culture conditions (2D adherence, high serum, supraphysiologic LPS) may
  shift apparent IL-10 sensitivity relative to in vivo PDAC TAMs, although receptor-level
  binding affinity is expected to be conserved.
primary_data_source:
  pmid: Seldon1998_placeholder
  title: Interleukin-10 does not mediate the inhibitory effect of PDE-4 inhibitors
    and other cAMP-elevating drugs on lipopolysaccharide-induced tumor necrosis factor-alpha
    generation from human peripheral blood monocytes
  authors:
  - Seldon PM
  - Barnes PJ
  - Giembycz MA
  year: 1998
  source_tag: Seldon1998
  source_relevance:
    indication_match: proxy
    indication_match_justification: The target QSP model describes pancreatic ductal
      adenocarcinoma (PDAC) tumor-associated macrophages, whereas Seldon1998 studies
      LPS-stimulated peripheral blood monocytes from healthy human donors. These monocytes
      are used as a mechanistic proxy for human myeloid cells expressing IL-10 receptors.
      While the tissue context and activation state differ from PDAC TAMs, IL-10 receptor
      binding affinity and proximal signaling are expected to be similar, so the IL-10
      IC50 for suppressing TNF-alpha secretion provides a reasonable proxy for the
      IL-10 potency parameter IL10_50 in the PDAC model, with additional translation
      uncertainty.
    species_source: human
    species_target: human
    source_quality: primary_human_in_vitro
    perturbation_type: pharmacological
    perturbation_relevance: Exogenous recombinant human IL-10 was applied over a wide
      concentration range to LPS-activated monocytes. The resulting IC50 reflects
      pharmacological receptor occupancy and signaling potency. Because IL10_50 in
      the QSP model represents the half-maximal IL-10 concentration controlling macrophage
      polarization, this pharmacological IC50 is interpreted as the effective concentration
      at which IL-10 receptor signaling reaches half of its maximal functional effect
      on myeloid cells.
    tme_compatibility: moderate
    tme_compatibility_notes: Peripheral blood monocytes in 2D culture lack the desmoplastic
      stroma, hypoxia, and chronic cytokine milieu of PDAC, but they share core IL-10
      receptor expression and JAK-STAT signaling pathways with tumor-associated macrophages.
      Thus, the absolute IL-10 potency is likely similar, though local ligand availability
      and receptor expression levels in PDAC may differ. We therefore treat this as
      a mechanistically relevant but context-shifted estimate, adding moderate translation
      uncertainty.
    measurement_directness: single_inversion
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: in_vitro_primary
