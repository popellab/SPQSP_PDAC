- name: t_culture_hours
  value: 48.0
  units: hour
  input_type: direct_measurement
  source_ref: Zhang2024
  source_location: Methods, T cell chronic restimulation on PDMS
  value_snippet: for 48 h
- name: hours_per_day
  value: 24.0
  units: hour/day
  input_type: unit_conversion
  source_ref: Zhang2024
  source_location: unit conversion
  rationale: Convert culture time from hours to days to match k_stiff_CD8_exh units
