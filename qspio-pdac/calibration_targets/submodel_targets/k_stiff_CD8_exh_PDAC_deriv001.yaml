calibration:
  parameters:
  - name: k_stiff_CD8_exh
    units: 1/day
    nuisance: false
  - name: E_50_Texh
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 1.3863
      sigma: 0.7
  - name: n_Texh
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 0.0
      sigma: 0.7
  forward_model:
    data_rationale: Zhang2024 chronically restimulated pre-activated murine CD8+ T
      cells on PDMS substrates of 3 stiffnesses (~5, ~40, ~200 kPa) for 48h and measured
      the fraction of PD-1+TIM-3+ exhausted CD8+ T cells by flow cytometry. The monotonic
      increase in exhaustion fraction with stiffness provides a dose-response curve
      that constrains the rate of stiffness-driven exhaustion.
    submodel_rationale: In the QSP model, stiffness-mediated CD8 exhaustion follows
      the rate law k_stiff_CD8_exh * CD8 * H_stiff_Texh where H_stiff_Texh = stiffness^n_Texh
      / (E_50_Texh^n_Texh + stiffness^n_Texh). At quasi-steady state during the 48h
      culture, the fraction of exhausted cells is approximately f_exh = k*H*t / (1
      + k*H*t) where t is the culture duration. The PDMS stiffness in kPa maps directly
      to the model dimensionless stiffness (kPa-scaled).
    type: algebraic
    formula: f_exh_pct = 100 * k_stiff_CD8_exh * H_stiff(E, E_50, n) * t / (1 + k_stiff_CD8_exh
      * H_stiff(E, E_50, n) * t)
    code: "def compute(params, inputs):\n    import numpy as np\n    k = params['k_stiff_CD8_exh']\n\
      \    E_50 = params['E_50_Texh']\n    n = params['n_Texh']\n    t = inputs['t_culture_hours']\
      \ / inputs['hours_per_day']\n    E_soft = inputs['stiffness_soft_kPa']\n   \
      \ E_med = inputs['stiffness_medium_kPa']\n    E_stiff = inputs['stiffness_stiff_kPa']\n\
      \    def f_exh(E):\n        H = E**n / (E_50**n + E**n)\n        return 100.0\
      \ * k * H * t / (1.0 + k * H * t)\n    return {\n        'exh_pct_soft': f_exh(E_soft),\n\
      \        'exh_pct_medium': f_exh(E_med),\n        'exh_pct_stiff': f_exh(E_stiff),\n\
      \    }\n"
  error_model:
  - name: exh_fraction_soft
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['exh_pct_soft']"
    units: percent
    uses_inputs:
    - PD1_TIM3_soft_mean_pct
    - PD1_TIM3_soft_sd_pct
    - n_replicates
    sample_size_input: n_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['PD1_TIM3_soft_mean_pct']\n    sd\
      \ = inputs['PD1_TIM3_soft_sd_pct']\n    cv = sd / mean\n    sigma_ln = np.sqrt(np.log(1\
      \ + cv**2))\n    mu_ln = np.log(mean) - sigma_ln**2 / 2\n    return rng.lognormal(mu_ln,\
      \ sigma_ln / np.sqrt(sample_size), n_bootstrap)\n"
    n_bootstrap: 10000
  - name: exh_fraction_medium
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['exh_pct_medium']"
    units: percent
    uses_inputs:
    - PD1_TIM3_medium_mean_pct
    - PD1_TIM3_medium_sd_pct
    - n_replicates
    sample_size_input: n_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['PD1_TIM3_medium_mean_pct']\n   \
      \ sd = inputs['PD1_TIM3_medium_sd_pct']\n    cv = sd / mean\n    sigma_ln =\
      \ np.sqrt(np.log(1 + cv**2))\n    mu_ln = np.log(mean) - sigma_ln**2 / 2\n \
      \   return rng.lognormal(mu_ln, sigma_ln / np.sqrt(sample_size), n_bootstrap)\n"
    n_bootstrap: 10000
  - name: exh_fraction_stiff
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['exh_pct_stiff']"
    units: percent
    uses_inputs:
    - PD1_TIM3_stiff_mean_pct
    - PD1_TIM3_stiff_sd_pct
    - n_replicates
    sample_size_input: n_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['PD1_TIM3_stiff_mean_pct']\n    sd\
      \ = inputs['PD1_TIM3_stiff_sd_pct']\n    cv = sd / mean\n    sigma_ln = np.sqrt(np.log(1\
      \ + cv**2))\n    mu_ln = np.log(mean) - sigma_ln**2 / 2\n    return rng.lognormal(mu_ln,\
      \ sigma_ln / np.sqrt(sample_size), n_bootstrap)\n"
    n_bootstrap: 10000
  identifiability_notes: k_stiff_CD8_exh is the primary parameter, constrained by
    the overall magnitude of stiffness-dependent exhaustion. E_50_Texh and n_Texh
    (nuisance) control the shape of the dose-response curve. With 3 stiffness conditions
    spanning a 40-fold range, E_50_Texh is reasonably identified if n_Texh is near
    1. The product k*H(E)*t determines the predicted exhaustion fraction, so k and
    H are partially correlated, but the multi-point dose-response helps separate them.
    Additional constraint on E_50_Texh and n_Texh comes from the Saitakis2017 IFNg
    and TNFa targets in the joint inference.
experimental_context:
  species: mouse
  system: in_vitro_primary_cells
  cell_types:
  - name: CD8+ T cells
    phenotype: pre-activated murine CD8+ T cells, chronically restimulated on PDMS
    isolation_method: Splenic CD8+ T cells activated with anti-CD3/CD28 for 2 days,
      then transferred to PDMS gels for 48h chronic restimulation
    source: C57BL/6 mice
  culture_conditions:
    substrate: PDMS gels of defined stiffness (~5, ~40, ~200 kPa)
    culture_type: 2d_monolayer
    medium: Complete T cell medium with anti-CD3 restimulation
    duration: 48 hours chronic restimulation on PDMS
  indication: healthy (non-tumor-bearing)
study_interpretation: Zhang2024 shows that CD8+ T cell exhaustion (PD-1+TIM-3+ fraction)
  increases monotonically with substrate stiffness from ~5% on soft (5 kPa) to ~17%
  on stiff (200 kPa) PDMS over 48h of chronic restimulation. This stiffness-dependent
  exhaustion phenotype is mediated by Osr2, a mechanosensitive transcription factor.
  The in vitro dose-response constrains the rate k_stiff_CD8_exh via a Hill function
  mapping stiffness to exhaustion probability. In the PDAC model, this mechanism contributes
  to immune exclusion in the stiff desmoplastic stroma.
key_assumptions:
- The quasi-steady-state approximation f_exh = k*H*t/(1+k*H*t) is valid over the 48h
  culture period.
- PDMS substrate stiffness is a reasonable proxy for ECM stiffness in the PDAC tumor
  microenvironment, and the mechanotransduction pathway (Osr2/YAP) is conserved.
- PD-1+TIM-3+ co-expression is a reliable marker of functional exhaustion consistent
  with the QSP model definition.
- Mouse CD8+ T cell mechanosensing is quantitatively similar to human CD8+ T cells
  for the purpose of estimating the rate constant.
key_study_limitations:
- In vitro PDMS substrates lack the complex ECM composition, dimensionality, and cellular
  interactions of PDAC stroma.
- Chronic restimulation with anti-CD3 is a simplified model of TCR-driven exhaustion
  that does not capture tumor-antigen-specific dynamics.
- Only 3 stiffness levels were tested, limiting the resolution of the dose-response
  curve.
- Mouse-to-human translation introduces additional uncertainty not captured in the
  submodel.
primary_data_source:
  doi: 10.1016/j.cell.2024.04.023
  title: Osr2 functions as a biomechanical checkpoint of CD8+ T cell exhaustion in
    the tumor microenvironment
  authors:
  - Jianfeng Zhang
  year: 2024
  source_tag: Zhang2024
  source_relevance:
    indication_match: proxy
    indication_match_justification: The study uses in vitro PDMS substrates with murine
      CD8+ T cells, not PDAC tumors. However, the mechanotransduction pathway (Osr2/YAP)
      is relevant to PDAC desmoplasia where tissue stiffness is elevated.
    species_source: mouse
    species_target: human
    source_quality: primary_animal_in_vitro
    perturbation_type: physiological_baseline
    perturbation_relevance: Chronic anti-CD3 restimulation on stiff substrates mimics
      persistent antigen stimulation in a mechanically stiff environment, analogous
      to T cell exhaustion in desmoplastic PDAC stroma.
    tme_compatibility: moderate
    tme_compatibility_notes: PDMS substrates capture mechanical stiffness but lack
      the full complexity of PDAC stroma (collagen composition, hypoxia, cytokine
      milieu). The stiffness range (5-200 kPa) covers the range observed in PDAC.
    measurement_directness: direct
    temporal_resolution: endpoint_pair
    experimental_system: in_vitro_primary
tags:
- stiffness
- CD8_exhaustion
- mechanotransduction
- PD1_TIM3
- k_stiff_CD8_exh
