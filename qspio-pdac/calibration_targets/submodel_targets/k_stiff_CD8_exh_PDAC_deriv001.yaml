target_id: k_stiff_CD8_exh
inputs:
- name: stiffness_soft_kPa
  value: 5.0
  units: kilopascal
  input_type: direct_measurement
  source_ref: Zhang2024
  source_location: Figure 1E, Methods
  value_snippet: 5 kPa
- name: stiffness_medium_kPa
  value: 40.0
  units: kilopascal
  input_type: direct_measurement
  source_ref: Zhang2024
  source_location: Figure 1E, Methods
  value_snippet: 40 kPa
- name: stiffness_stiff_kPa
  value: 200.0
  units: kilopascal
  input_type: direct_measurement
  source_ref: Zhang2024
  source_location: Figure 1E, Methods
  value_snippet: 200 kPa
- name: PD1_TIM3_soft_mean_pct
  value: 4.56
  units: percent
  input_type: direct_measurement
  source_ref: Zhang2024
  source_location: Figure 1E
  figure_excerpt:
    figure_id: Figure 1E
    value: 'individual points: 3.1, 4.0, 3.7, 4.9, 7.2'
    description: PD-1+TIM-3+ fraction of CD8+ T cells on soft (~5 kPa) PDMS after
