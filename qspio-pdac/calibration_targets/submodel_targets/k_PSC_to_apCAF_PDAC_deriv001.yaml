  - Brekken
  year: 2022
  source_tag: Huang2022
  source_relevance:
    indication_match: exact
    indication_match_justification: The study uses genetically engineered and orthotopic
      mouse models of pancreatic ductal adenocarcinoma (KIC, KPC, KPfC, and KPC-derived
      cell lines), which closely recapitulate PDAC in terms of tissue of origin, oncogenic
      drivers (mutant Kras and Trp53), and the characteristic desmoplastic stroma.
      Thus, although the species is mouse, the indication at the organ and disease
      level matches the human PDAC QSP model.
    species_source: mouse
    species_target: human
    source_quality: primary_animal_in_vivo
    perturbation_type: physiological_baseline
    perturbation_relevance: "The key quantitative measurements used here\u2014CAF\
      \ subtype fractions and mesothelial-lineage expansion in untreated tumors\u2014\
      are obtained under baseline tumor-bearing conditions without therapeutic perturbation\
      \ (apart from lineage-labeling tamoxifen). They are interpreted as reflecting\
      \ endogenous PSC/mesothelial activation kinetics in PDAC rather than drug-modified\
      \ behavior."
    tme_compatibility: high
    tme_compatibility_notes: KPfC and related Kras/Trp53-driven mouse PDAC models
      develop a dense, collagen-rich, immune-excluded tumor microenvironment that
      is highly similar to human PDAC in terms of CAF abundance, mesothelial coverage,
      and immune suppression. While quantitative differences in stromal cell turnover
      and cytokine levels likely exist between mouse and human tumors, the qualitative
      desmoplastic features and mesothelial contribution are well matched, supporting
      high TME compatibility.
    measurement_directness: steady_state_inversion
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: animal_in_vivo
