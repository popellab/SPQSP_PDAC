calibration:
  parameters:
  - name: k_PSC_to_apCAF
    units: 1/day
    nuisance: false
  - name: k_PSC_to_iCAF
    units: 1/day
    nuisance: false
  - name: k_PSC_to_myCAF
    units: 1/day
    nuisance: false
  forward_model:
    data_rationale: Huang2022 provides (1) flow-cytometric fractions of apCAFs among
      PDPN+ CAFs in three KPfC tumors (Figure 2A) and (2) a mesothelial-lineage tracing
      experiment (Figure 3H) that quantifies the fold expansion of mesothelial-derived
      stromal cells over a known 21-day interval in orthotopic PDA. Under the assumption
      that CAF subtypes arise from a common quiescent PSC/mesothelial precursor with
      first-order conversion rates, the steady-state apCAF fraction reflects the branching
      ratio of PSC-to-apCAF vs PSC-to-iCAF/myCAF, while the mesothelial-lineage expansion
      rate constrains the sum of all PSC activation rates.
    submodel_rationale: In the full QSP model, quiescent PSCs (qPSC) convert to apCAFs,
      iCAFs, and myCAFs via first-order reactions with rate constants k_PSC_to_apCAF,
      k_PSC_to_iCAF, and k_PSC_to_myCAF, all drawing from the same precursor pool.
      If loss and proliferation rates of the three CAF subtypes are comparable on
      the timescale of interest, the long-term fraction of activated PSCs that are
      apCAFs approximates k_PSC_to_apCAF divided by the sum of all three activation
      rates. Likewise, the total mesothelial/PSC activation flux into the stroma is
      proportional to k_PSC_to_apCAF + k_PSC_to_iCAF + k_PSC_to_myCAF. The algebraic
      forward model encodes these mechanistic relationships without introducing additional
      dynamical assumptions that are not present in the QSP structure.
    type: algebraic
    formula: f_apCAF = k_PSC_to_apCAF / (k_PSC_to_apCAF + k_PSC_to_iCAF + k_PSC_to_myCAF);
      k_PSC_total = k_PSC_to_apCAF + k_PSC_to_iCAF + k_PSC_to_myCAF
    code: "def compute(params, inputs):\n    import numpy as np\n    k_ap = params['k_PSC_to_apCAF']\n\
      \    k_i = params['k_PSC_to_iCAF']\n    k_m = params['k_PSC_to_myCAF']\n   \
      \ k_total = k_ap + k_i + k_m\n    f_ap = k_ap / k_total\n    return {\n        'f_apCAF': f_ap,\n   \
      \     'k_PSC_total': k_total,\n    }\n"
  error_model:
  - name: apCAF_fraction_kpfc_flow
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    # y is the dict returned by the algebraic\
        \ forward model.\n    return y['f_apCAF']\n"
    units: dimensionless
    uses_inputs:
    - apCAF_frac_mean_kpfc
    - apCAF_frac_sd_kpfc
    - n_kpfc_pda_tumors
    sample_size_input: n_kpfc_pda_tumors
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['apCAF_frac_mean_kpfc']\n    sd =\
      \ inputs['apCAF_frac_sd_kpfc']\n    # Treat reported SD as variability of individual-tumor\
      \ fractions.\n    # Uncertainty on the mean scales as SD/sqrt(n).\n    se_mean\
      \ = sd / np.sqrt(sample_size)\n    return rng.normal(mean, se_mean, n_bootstrap)\n"
    n_bootstrap: 10000
  - name: mesothelial_lineage_activation_rate
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['k_PSC_total']\n"
    units: 1/day
    uses_inputs:
    - k_mes_lineage_eff_mean
    - k_mes_lineage_eff_sd
    - n_lineage_mice
    sample_size_input: n_lineage_mice
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['k_mes_lineage_eff_mean']\n    sd\
      \ = inputs['k_mes_lineage_eff_sd']\n    se_mean = sd / np.sqrt(sample_size)\n\
      \    # Rates are positive and CV is modest, so a normal approximation\n    #\
      \ around the mean is adequate here.\n    return rng.normal(mean, se_mean, n_bootstrap)\n"
    n_bootstrap: 10000
  identifiability_notes: Two independent observables constrain three activation rates
    (k_PSC_to_apCAF, k_PSC_to_iCAF, k_PSC_to_myCAF). The mesothelial-lineage tracing-derived
    effective rate primarily fixes the sum k_PSC_total = k_PSC_to_apCAF + k_PSC_to_iCAF
    + k_PSC_to_myCAF, while the apCAF fraction at late time constrains the branching
    ratio k_PSC_to_apCAF / k_PSC_total. As a result, k_PSC_to_apCAF is reasonably
    well constrained in magnitude and relative to the other two rates, but the individual
    decomposition of k_PSC_to_iCAF vs k_PSC_to_myCAF remains partially non-identifiable
    and will be influenced by their priors and any additional targets. The model also
    assumes that CAF subtype death/proliferation rates are similar enough that steady-state
    subtype fractions primarily reflect branching rates, and that mesothelial-derived
    stromal expansion over 21 days is governed by net first-order activation kinetics;
    violations of these assumptions would broaden the true uncertainty on k_PSC_to_apCAF
    beyond what is captured here.
experimental_context:
  species: mouse
  system: animal_in_vivo
  indication: PDAC
study_interpretation: Huang2022 demonstrates that apCAFs in PDAC arise from mesothelial
  cells/PSCs and provides quantitative measurements of apCAF fractions among CAFs
  and the expansion of mesothelial-derived stromal cells over time. Interpreting CAF
  subtype proportions as the outcome of competing first-order activation pathways
  from a common qPSC/mesothelial pool, and treating the mesothelial-lineage tracing
  as an effective activation rate into the stromal compartment, allows estimation
  of both the total PSC activation rate and the fraction of that flux leading specifically
  to apCAFs. This, in turn, constrains k_PSC_to_apCAF within the QSP model.
key_assumptions:
- apCAFs, iCAFs, and myCAFs comprise the dominant PDPN+ CAF populations in late-stage
  KPfC tumors, and their proportions in Figure 2A approximate the true steady-state
  subtype fractions among activated PSC-derived fibroblasts.
- "All three CAF subtypes have comparable net loss (death plus egress) and proliferation\
  \ rates on the 2\u20134 week timescale, so that steady-state subtype fractions primarily\
  \ reflect differences in PSC-to-subtype activation rates rather than subtype-specific\
  \ survival."
- The effective mesothelial-lineage expansion rate inferred from tdTomato+ fractions
  in orthotopic BMFA3 tumors over 21 days is a reasonable proxy for the total PSC/mesothelial
  activation rate into CAF lineages (k_PSC_to_apCAF + k_PSC_to_iCAF + k_PSC_to_myCAF)
  in the QSP tumor compartment.
- Mouse KPfC and orthotopic KPC/BMFA3 tumor models recapitulate key stromal and mesothelial
  biology of human PDAC closely enough that PSC activation kinetics can be translated
  to the human QSP model within a modest uncertainty factor.
- Non-mesothelial sources of CAFs (e.g., resident fibroblasts) make a smaller contribution
  to the PDPN+ CAF pool in these models than mesothelial/PSC-derived cells on the
  timescale probed, so that mesothelial activation dominates k_PSC_total.
key_study_limitations:
- The CAF subtype fractions in Figure 2A are derived from only three tumors and show
  notable inter-tumor variability, particularly for apCAFs in PDA3; this limits precision
  on the branching ratio and may bias the inferred k_PSC_to_apCAF if these tumors
  are not representative.
- The mesothelial lineage-tracing experiment in Figure 3H measures total tdTomato+
  mesothelial-derived stromal cells rather than apCAFs specifically, so mapping the
  effective expansion rate to the sum of PSC activation rates assumes that most tdTomato+
  stromal cells are CAFs and that other mesothelial-derived lineages are minor.
- The 21-day interval used to infer the effective activation rate includes both initial
  PSC-to-CAF conversion and subsequent proliferation of lineage-traced CAFs; attributing
  the entire rate to activation into CAFs likely overestimates the true k_PSC_total.
- Both datasets are from mouse models (KPfC GEMM and orthotopic KPC-derived tumors),
  which, while highly desmoplastic, may not fully capture human PDAC stromal kinetics
  or mesothelial behavior; species- and model-specific differences are not explicitly
  modeled here.
- The algebraic steady-state approximation neglects potential time-dependent changes
  in cytokine drivers (IL-1, TGFbeta) and mechanical cues that could differentially
  modulate PSC activation into the three CAF subtypes during tumor progression.
primary_data_source:
  doi: 10.1016/j.ccell.2022.04.011
  title: Mesothelial cell-derived antigen-presenting cancer-associated fibroblasts
    induce expansion of regulatory T cells in pancreatic cancer
  authors:
  - Huang
  - Wang
  - Zhang
  - Pradhan
  - Ganguly
  - Chandra
  - Murimwa
  - Wright
  - Gu
  - Maddipati
  - Muller
