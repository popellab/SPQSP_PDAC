extraction_model: claude-opus-4-6
study_interpretation: 'De Simoni et al. (2023) performed IHC on tissue microarrays from 38

  resectable PDAC patients for iNOS (M1 marker) and CD163 (M2 marker).

  The mean iNOS+ TAM count was 5 per HPF and the mean CD163+ count was

  92 per HPF in intra- and peri-tumoral compartments, giving a CD163:iNOS

  ratio of ~18:1. This strong M2 skew provides a second independent PDAC

  cohort (complementing Gu 2023) constraining k_M2_pol/k_M1_pol.


  Figure 5A shows individual patient iNOS+ counts as a scatter plot

  (n=43 data points across both survival groups), from which we digitized

  the full patient-level distribution (mean=6.6, SD=6.1). The CD163:iNOS

  ratio is bootstrapped using individual iNOS values against the reported

  CD163 population mean.


  The higher ratio (18:1) compared to Gu 2023 (2.3:1) likely reflects

  the different M1 markers used: iNOS is a stricter M1 marker than CD86

  (which is also expressed by activated DCs and B cells). This marker

  difference is absorbed by the nuisance Hill terms in the forward model.

  '
key_assumptions:
- 'iNOS+ cells represent M1-like macrophages and CD163+ cells represent

  M2-like macrophages in the PDAC tumor microenvironment.

  '
- 'Resectable PDAC at surgery approximates a quasi-steady state for

  macrophage polarization.

  '
- 'The ratio of CD163:iNOS counts is proportional to the M2:M1 population

  ratio, with any systematic bias from marker specificity absorbed by the

  nuisance Hill function terms.

  '
- 'Individual patient iNOS data from Figure 5A (both survival groups

  pooled) reflects the population distribution of M1 macrophage density

  in untreated resectable PDAC.

  '
- 'The CD163 mean (92/HPF) is representative of the same population,

  and its patient-level variability is secondary to the iNOS variability

  (CV~0.92) in determining ratio uncertainty.

  '
key_study_limitations:
- 'iNOS is a stricter M1 marker than CD86 (used in Gu 2023). Some

  CD86+ macrophages would not be iNOS+, explaining the higher M2:M1

  ratio here. The nuisance Hill terms partially absorb this.

  '
- 'CD163 count (92/HPF) is reported only as a population mean without

  SD. Patient-level CD163 variability is not captured in the bootstrap.

  The ratio uncertainty is driven primarily by iNOS variability.

  '
- 'Small single-center Italian cohort (n=38). All patients received

  adjuvant chemotherapy after surgery; the IHC reflects pre-treatment

  TME but patient selection may differ from unselected PDAC.

  '
- 'TMA-based counting (1.0 mm punch, 4 cores per tumor) may not

  capture full intra-tumoral heterogeneity. Section thickness for

  IHC cuts is not explicitly stated.

  '
- 'Digitization of Figure 5A yielded 43 points (vs expected 38

  patients), suggesting some overlapping points or dual counting.

  '
