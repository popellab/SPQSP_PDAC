calibration:
  parameters:
  - name: k_M1_pol
    units: 1/day
  - name: k_M2_pol
    units: 1/day
  - name: k_Mac_death
    units: 1/day
  - name: k_Mac_rec
    units: cell/(milliliter*day)
  - name: H_anti_inflam_eff
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: -0.36
      sigma: 0.5
  - name: H_pro_inflam_eff
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: -2.3
      sigma: 0.7
  forward_model:
    type: algebraic
    formula: 'M2/M1 = (k_M2_pol * H_anti) / (k_M1_pol * H_pro + k_Mac_death)

      '
    code: "def compute(params, inputs):\n    \"\"\"\n    Predict steady-state M2:M1 ratio.\n\n    Same mechanistic model as\
      \ the Gu2023 target. At steady state:\n    dM2/dt = k_M2_pol * H_anti * M1 - k_M1_pol * H_pro * M2 - k_Mac_death * M2\
      \ = 0\n    => M2/M1 = (k_M2_pol * H_anti) / (k_M1_pol * H_pro + k_Mac_death)\n\n    The nuisance H terms absorb the\
      \ difference in M1/M2 marker\n    definitions (iNOS/CD163 here vs CD86/CD163 in Gu2023).\n    \"\"\"\n    k_M2 = params['k_M2_pol']\n\
      \    k_M1 = params['k_M1_pol']\n    k_death = params['k_Mac_death']\n    k_rec = params['k_Mac_rec']\n    H_anti = params['H_anti_inflam_eff']\n\
      \    H_pro = params['H_pro_inflam_eff']\n    _ = k_rec\n    return (k_M2 * H_anti) / (k_M1 * H_pro + k_death)\n"
    data_rationale: 'De Simoni et al. report iNOS+ (M1) mean 5/HPF and CD163+ (M2) mean

      92/HPF in PDAC tumors. The CD163:iNOS ratio of ~18:1 constrains the

      M2-to-M1 polarization rate balance. Individual iNOS patient data from

      Figure 5A provides the uncertainty distribution.

      '
    submodel_rationale: 'Same steady-state polarization model as k_M1_pol_PDAC_deriv001

      (Gu2023). The nuisance Hill terms absorb marker-specific differences

      between iNOS/CD163 (this target) and CD86/CD163 (Gu2023). Joint

      inference with both targets constrains the QSP polarization rates

      from two independent PDAC cohorts with complementary M1 markers.

      '
  error_model:
  - name: cd163_inos_ratio
    units: dimensionless
    uses_inputs:
    - inos_digitized_mean
    - inos_digitized_sd
    - n_inos_digitized
    - cd163_mean
    - n_patients
    sample_size_input: n_patients
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    \"\"\"\n    Bootstrap M2:M1 ratio\
      \ from digitized iNOS scatter and CD163 mean.\n\n    Individual patient iNOS values are sampled from the empirical\n\
      \    distribution (lognormal fit to digitized scatter), then divided\n    into the CD163 population mean. The ratio\
      \ uncertainty is driven\n    by the large iNOS variability (CV ~0.92).\n    \"\"\"\n    import numpy as np\n\n    inos_mean\
      \ = inputs['inos_digitized_mean']\n    inos_sd = inputs['inos_digitized_sd']\n    cd163_mean = inputs['cd163_mean']\n\
      \    n = int(inputs['n_patients'])\n\n    # Sample patient-level iNOS from lognormal\n    cv = inos_sd / inos_mean\n\
      \    sigma_log = np.sqrt(np.log(1 + cv**2))\n    mu_log = np.log(inos_mean) - sigma_log**2 / 2\n\n    # Bootstrap: sample\
      \ n patients, compute mean ratio\n    inos_samples = rng.lognormal(mu_log, sigma_log, n_bootstrap)\n    ratio_samples\
      \ = cd163_mean / inos_samples\n\n    # Scale to population mean precision\n    log_ratio = np.log(ratio_samples)\n \
      \   mean_lr = np.mean(log_ratio)\n    sd_lr = np.std(log_ratio)\n\n    return rng.lognormal(mean_lr, sd_lr / np.sqrt(n),\
      \ n_bootstrap)\n"
  identifiability_notes: 'Same structure as the Gu2023 ratio target: constrains

    (k_M2_pol * H_anti) / (k_M1_pol * H_pro + k_Mac_death).

    The higher ratio here (18:1 vs 2.3:1 in Gu2023) is expected

    due to the stricter M1 marker (iNOS vs CD86). The nuisance Hill

    terms adapt to absorb this difference in joint inference. With

    both targets, the QSP polarization rates are constrained by two

    independent PDAC cohorts, reducing sensitivity to any single

    marker definition.

    '
