  year: 2020
  source_tag: Bernard2020
  source_relevance:
    indication_match: exact
    indication_match_justification: The study analyzes immune infiltration in human
      pancreatic ductal adenocarcinoma (PDAC) using quantitative IHC and RNA-Seq on
      resected tumors from PDAC patients at the same indication as the QSPIO-PDAC
      model. Thus, the tumor type, anatomical site, and disease context match the
      target model directly.
    species_source: human
    species_target: human
    source_quality: primary_human_clinical
    perturbation_type: physiological_baseline
    perturbation_relevance: Patients were treatment-naive with respect to systemic
      immunotherapy at the time of resection (neoadjuvant-treated cases were excluded
      from the RNA-Seq/IHC-matched subset), so the measured CD8+ T-cell densities
      reflect baseline PDAC immune infiltration rather than drug-perturbed extremes.
      This is appropriate for informing the intrinsic CD8 carrying capacity parameter
      rho_CD8_max.
    tme_compatibility: high
    tme_compatibility_notes: Tumors are primary human PDAC resections with characteristic
      desmoplastic stroma and low-to-moderate immune infiltration, closely matching
      the tumor microenvironment represented in the QSPIO-PDAC model. While surgical
      samples may be biased toward operable disease and peripheral tumor regions,
      their stromal architecture and immune composition are representative of clinically
      relevant PDAC.
    measurement_directness: proxy_observable
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: clinical_in_vivo
