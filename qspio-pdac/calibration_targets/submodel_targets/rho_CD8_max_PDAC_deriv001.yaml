target_id: rho_CD8_max
inputs:
- name: cd8_hi_group_n_patients
  value: 35.0
  units: dimensionless
  input_type: direct_measurement
  source_ref: Bernard2020
  source_location: Figure 1a(ii), CD8+ T cell infiltrate
  value_snippet: iii) CD8+ T cell infiltrate ... High 35 Low 34
- name: cd8_hi_density_p95_cells_per_mm2
  value: 200.0
  units: cell/millimeter**2
  input_type: direct_measurement
  source_ref: Bernard2020
  source_location: Figure 1a(ii), CD8+ T cell infiltrate
  figure_excerpt:
    figure_id: Figure 1a(ii)
    value: ~200
    description: "Approximate upper-tail (around 90th\u201395th percentile) CD8+ T\
      \ cell density among PDAC tumors in the CD8-high group, read from the scatter/boxplot\
      \ of CD8+ cells per mm2."
    context: CD8+ T cell infiltrate (cells/mm2) for resected PDAC patients; points
      and boxplot showing distribution with upper whisker near 200 cells/mm2.
- name: section_thickness_mm
  value: 0.004
  units: millimeter
  input_type: reference_value
  rationale: "Typical thickness for FFPE IHC sections in surgical pathology is 4 micrometers\
    \ (0.004 mm). Bernard2020 used standard whole-slide IHC on FFPE pancreatic resections,\
    \ so we approximate section thickness as 4 \xB5m for volume conversion from cells/mm2\
    \ to cells/mL."
  source_ref: Bernard2020
  source_location: Methods, Quantitative immunohistology for infiltrating immune cells
    in pancreatic cancer
- name: rho_CD8_hi_cell_per_mL
  value: 50000000.0
  units: cell/milliliter
  input_type: derived_arithmetic
  rationale: "Convert an upper-tail CD8+ T cell density of 200 cells/mm2 (approximate\
    \ 90th\u201395th percentile in CD8-high PDAC tumors) into a volumetric density\
    \ using a 4 \xB5m (0.004 mm) section thickness: cells/mm3 = cells/mm2 / thickness_mm;\
    \ cells/mL = cells/mm3 * 1e3. Thus 200 / 0.004 * 1e3 = 5e7 cells/mL."
  source_ref: Bernard2020
  source_location: Figure 1a(ii) and Methods
  source_inputs:
  - cd8_hi_density_p95_cells_per_mm2
  - section_thickness_mm
  formula: cd8_hi_density_p95_cells_per_mm2 / section_thickness_mm * 1000.0
- name: rho_CD8_hi_spread_factor
  value: 0.4
  units: dimensionless
  input_type: reference_value
  rationale: "Approximate relative spread of upper-tail CD8+ T cell densities among\
    \ CD8-high PDAC tumors in Bernard2020, estimated visually from the spread of data\
    \ points in Figure 1a(ii), where values in the high group range roughly from ~100\
    \ to ~200 cells/mm2 around a central tendency near 140\u2013150 cells/mm2 (relative\
    \ spread on the order of 30\u201340%). We conservatively use 0.4 to capture this\
    \ variability in the lognormal bootstrap."
  source_ref: Bernard2020
  source_location: Figure 1a(ii), CD8+ T cell infiltrate
calibration:
  parameters:
  - name: rho_CD8_max
    units: cell/milliliter
    nuisance: false
  forward_model:
    data_rationale: "Bernard2020 provides cross-sectional quantitative IHC measurements\
      \ of intratumoral CD8+ T-cell densities (cells/mm2) in untreated resected PDAC.\
      \ The upper-tail (roughly 90th\u201395th percentile) CD8 density among CD8-high\
      \ tumors is used as an empirical proxy for the maximal CD8 density that PDAC\
      \ tumors tend to support in vivo."
    submodel_rationale: In the full QSP model, rho_CD8_max is the carrying capacity
      for local CD8 effector proliferation in the tumor, appearing in the logistic
      term k_CD8_T_pro * CD8 * (1 - CD8/(rho_CD8_max * V_T + cell)). In chronically
      inflamed, highly infiltrated PDAC tumors, CD8 densities are expected to approach
      but not greatly exceed this carrying capacity. Equating the observed upper-tail
      volumetric CD8 density to rho_CD8_max provides an algebraic constraint on this
      parameter without modeling explicit time-course dynamics.
    type: algebraic
    formula: rho_obs = rho_CD8_max
    code: "def compute(params, inputs):\n    # Algebraic mapping: identify the model's\
      \ maximal CD8 carrying capacity in tumor (rho_CD8_max)\n    # with an empirical\
      \ upper-tail volumetric CD8 density inferred from quantitative IHC in PDAC.\n\
      \    # The observable is simply rho_CD8_max itself.\n    return params['rho_CD8_max']\n"
  error_model:
  - name: rho_CD8_max_upper_tail_constraint
    units: cell/milliliter
    uses_inputs:
    - rho_CD8_hi_cell_per_mL
    - rho_CD8_hi_spread_factor
    sample_size_input: cd8_hi_group_n_patients
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['rho_CD8_hi_cell_per_mL']\n    spread\
      \ = inputs['rho_CD8_hi_spread_factor']\n    # Treat the upper-tail estimate\
      \ as a lognormal quantity with relative spread\n    # derived from the variability\
      \ of CD8-high tumors in Bernard2020 Figure 1a(ii).\n    sigma_ln = np.sqrt(np.log(1.0\
      \ + spread**2))\n    mu_ln = np.log(mean) - sigma_ln**2 / 2.0\n    return rng.lognormal(mu_ln,\
      \ sigma_ln / np.sqrt(sample_size), n_bootstrap)\n"
    n_bootstrap: 10000
  identifiability_notes: 'This target provides a single algebraic constraint on rho_CD8_max
    by equating it to an empirically estimated upper-tail CD8+ T-cell density in untreated
    resected PDAC. Because no additional parameters enter the forward model, rho_CD8_max
    is statistically identifiable from this observable alone, but the biological interpretation
    is limited by: (1) cross-sectional rather than dynamic data (we do not observe
    true logistic saturation), (2) potential underestimation if even the most inflamed
    PDAC tumors have not reached the true carrying capacity, and (3) uncertainty in
    section thickness and percentile estimation from Figure 1a(ii). Consequently,
    this target should be interpreted as setting the correct order of magnitude and
    an approximate upper bound for rho_CD8_max rather than a very tight constraint;
    additional targets (e.g., from vaccine-inflamed PDAC or longitudinal imaging)
    would further refine this parameter.'
experimental_context:
  species: human
  system: clinical_in_vivo
  cell_types:
  - name: CD8+ T cell
    phenotype: Tumor-infiltrating effector CD8+ T lymphocytes in resected PDAC
    isolation_method: Quantified in situ by IHC and automated digital image analysis
      on FFPE tumor sections
    source: Treatment-naive PDAC surgical resections from Providence Portland Medical
      Center
  indication: pancreatic ductal adenocarcinoma
study_interpretation: "Quantitative IHC in Bernard2020 shows that treatment-naive\
  \ resected PDAC tumors exhibit a wide range of CD8+ T-cell infiltration, with a\
  \ subset of CD8-high tumors reaching on the order of 10^2 cells/mm2 in cross-sectional\
  \ density. Converting an approximate 90th\u201395th percentile density (~200 cells/mm2)\
  \ to a volumetric scale using a standard 4 \xB5m section thickness yields ~5\xD7\
  10^7 CD8 cells/mL, which is interpreted as an empirical upper-tail estimate of the\
  \ tumor CD8 carrying capacity in PDAC and mapped to rho_CD8_max in the QSP model."
key_assumptions:
- "Bernard2020 IHC sections used a thickness close to 4 \xB5m, consistent with standard\
  \ FFPE IHC practice, so 0.004 mm is an appropriate value for volumetric conversion."
- "The most CD8-high PDAC tumors in Bernard2020 (upper ~5\u201310% of CD8 densities)\
  \ are near, but not greatly exceeding, the effective carrying capacity for intratumoral\
  \ CD8 effector proliferation under baseline clinical conditions."
- "The approximate upper-tail CD8 density (~200 cells/mm2) read from Figure 1a(ii)\
  \ is representative of the 90th\u201395th percentile among CD8-high tumors and is\
  \ not strongly biased by outliers or sampling noise."
- Tumor tissue is approximated as having uniform cellular density through the section
  thickness, so dividing areal density by section thickness and multiplying by 1e3
  (mm3 per mL) yields a reasonable estimate of volumetric cell density.
- Biological and inter-patient variability in upper-tail CD8 densities can be summarized
  by a lognormal relative spread of ~0.4, inferred qualitatively from the spread of
  points in the CD8-high group in Figure 1a(ii).
- "Cross-target cohort consistency: the companion k_CD8_T_pro target uses
  Blessin2021_Prognostic, which reports a mean intratumoural CD8 density of 288
  cells/mm² (SD 482, n=451 pancreatic cancer cores) — a mean that exceeds the ~200
  cells/mm² P95 read here from Bernard2020. The two cohorts likely differ in TMA-core
  selection (Blessin) vs whole-section (Bernard) sampling and possibly in patient
  selection. Blessin densities are kept as inputs only (not used in any error model)
  to avoid imposing a logistic inconsistency where baseline mean CD8 density would
  exceed the carrying capacity rho_CD8_max. If Blessin densities are ever promoted
  to observables in a later target, rho_CD8_max should be re-evaluated against the
  highest cohort mean+1SD (~770 cells/mm² → ~1.9e8 cell/mL at 4 µm), or a
  CAF-fraction-of-stroma-style explicit area-vs-volume conversion should mediate the
  comparison. Section thickness (4 µm) is held consistent across both targets as the
  conversion key."
key_study_limitations:
- The data are cross-sectional CD8+ T-cell densities from resected tumors, not longitudinal
  measurements showing approach to a true logistic carrying capacity; the inferred
  rho_CD8_max may therefore underestimate the theoretical maximum if tumors rarely
  saturate.
- CD8 densities are estimated visually from Figure 1a(ii) rather than taken directly
  from the machine-readable S1 Table, introducing digitization and reading uncertainty
  in the upper-tail estimate.
- "Section thickness for IHC is not explicitly stated in the excerpted methods; using\
  \ 4 \xB5m follows standard practice but may deviate modestly from the actual thickness\
  \ used, directly scaling the inferred volumetric density."
- Only untreated, resectable PDAC tumors from a single institution are represented;
  more inflamed or advanced disease states (or post-immunotherapy tumors) might reach
  higher CD8 densities than observed here.
- Spatial heterogeneity within tumors (hot vs cold regions) is averaged over whole-slide
  analyses; local microregions could have higher CD8 densities than the whole-tumor
  mean, again implying that the inferred rho_CD8_max is a conservative estimate.
