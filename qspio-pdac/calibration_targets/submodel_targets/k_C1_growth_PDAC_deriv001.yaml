calibration:
  parameters:
  - name: k_C1_growth
    units: 1/day
  forward_model:
    type: algebraic
    formula: VDT = ln(2) / k_C1_growth
    data_rationale: 'Ahn et al. followed 100 patients with untreated PDAC using serial multi-detector CT

      and computed tumor volume doubling times (VDT) assuming exponential tumor growth.

      The published mean +/- SD VDT directly characterizes net tumor expansion kinetics.

      '
    submodel_rationale: 'In the full model, viable cancer cells grow via dC1/dt = k_C1_growth * C1 * (1 - C_total/C_max).

      For small tumors (C_total << C_max), this reduces to exponential growth with

      VDT = ln(2) / k_C1_growth. The clinical VDT measurements thus provide a mechanistically

      consistent way to infer k_C1_growth during early-to-intermediate tumor growth.

      '
    code: "def compute(params, inputs):\n    k = params['k_C1_growth']\n    vdt = np.log(2) / k\n    return vdt\n"
  error_model:
  - name: vdt_observation
    units: day
    uses_inputs:
    - vdtime_mean
    - vdtime_sd
    - n_patients_ahn
    sample_size_input: n_patients_ahn
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    vdt_mean\
      \ = inputs['vdtime_mean']\n    vdt_sd = inputs['vdtime_sd']\n    # CV ~1.0 indicates high inter-patient variability\n\
      \    cv = vdt_sd / vdt_mean\n    sigma_ln = np.sqrt(np.log(1 + cv**2))\n    mu_ln = np.log(vdt_mean) - sigma_ln**2 /\
      \ 2\n    return rng.lognormal(mu_ln, sigma_ln, size=n_bootstrap)\n"
  identifiability_notes: 'k_C1_growth is structurally identifiable from VDT via VDT = ln(2)/k. The large CV (~100%)

    reflects substantial inter-patient heterogeneity. In the full model, k_C1_growth will be

    correlated with death and immune-killing parameters; this target constrains the effective

    net growth rate only.

    '
