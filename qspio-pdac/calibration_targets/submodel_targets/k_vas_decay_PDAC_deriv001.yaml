calibration:
  parameters:
  - name: k_vas_decay
    units: 1/day
    nuisance: false
  forward_model:
    data_rationale: Control-group longitudinal DCE-CT data in Cao2014 report fractional
      changes in fractional plasma volume (Fp) over 3 weeks in untreated BxPC-3 pancreatic
      tumor xenografts. Fp reflects the intratumoral plasma volume fraction and serves
      as a proxy for functional vascular volume/carrying capacity. The modest net
      decline in control Fp over 21 days is well approximated by a slow first-order
      decay process.
    submodel_rationale: In the full QSP PDAC model, tumor carrying capacity K (vasculature-dependent)
      experiences a first-order loss term proportional to k_vas_decay * K and scaled
      by tumor size^(2/3). Here we approximate the size-dependent factor as quasi-constant
      over the 3-week observation window and map relative Fp (Fp/Fp0) to relative
      carrying capacity (K/K0). Under this approximation, K_rel and thus Fp_rel obey
      first-order decay with effective rate k_vas_decay. The submodel therefore uses
      the same mechanistic role of k_vas_decay as a first-order loss of vascular capacity,
      but evaluated in the baseline (no anti-angiogenic therapy) control tumors.
    independent_variable:
      name: time
      units: day
      span:
      - 0.0
      - 21.0
    state_variables:
    - name: K_rel
      units: dimensionless
      initial_condition:
        value: 1.0
        rationale: Relative carrying capacity (or Fp) is normalized to 1.0 at baseline;
          Cao2014 reports subsequent values as fractional changes relative to this
          baseline.
    type: first_order_decay
    rate_constant: k_vas_decay
  error_model:
  - name: Fp_rel_control_day3
    observable:
      type: identity
      state_variables:
      - K_rel
    units: dimensionless
    uses_inputs:
    - Fp_change_control_day3_mean
    - Fp_change_control_day3_sd
    - n_control_DCE
    evaluation_points:
    - 3.0
    sample_size_input: n_control_DCE
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    frac_mean = inputs['Fp_change_control_day3_mean']\n\
      \    frac_sd = inputs['Fp_change_control_day3_sd']\n    # Bootstrap mean fractional\
      \ change assuming normal errors on the mean\n    frac_samples = rng.normal(frac_mean,\
      \ frac_sd / np.sqrt(sample_size), n_bootstrap)\n    # Convert fractional change\
      \ F = (Qi - Q0)/Qi to relative Fp: Qi/Q0 = 1/(1 - F)\n    fp_rel_samples = 1.0\
      \ / (1.0 - frac_samples)\n    return fp_rel_samples\n"
    n_bootstrap: 10000
  - name: Fp_rel_control_day7
    observable:
      type: identity
      state_variables:
      - K_rel
    units: dimensionless
    uses_inputs:
    - Fp_change_control_day7_mean
    - Fp_change_control_day7_sd
    - n_control_DCE
    evaluation_points:
    - 7.0
    sample_size_input: n_control_DCE
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    frac_mean = inputs['Fp_change_control_day7_mean']\n\
      \    frac_sd = inputs['Fp_change_control_day7_sd']\n    frac_samples = rng.normal(frac_mean,\
      \ frac_sd / np.sqrt(sample_size), n_bootstrap)\n    fp_rel_samples = 1.0 / (1.0\
      \ - frac_samples)\n    return fp_rel_samples\n"
    n_bootstrap: 10000
  - name: Fp_rel_control_day14
    observable:
      type: identity
      state_variables:
      - K_rel
    units: dimensionless
    uses_inputs:
    - Fp_change_control_day14_mean
    - Fp_change_control_day14_sd
    - n_control_DCE
    evaluation_points:
    - 14.0
    sample_size_input: n_control_DCE
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    frac_mean = inputs['Fp_change_control_day14_mean']\n\
      \    frac_sd = inputs['Fp_change_control_day14_sd']\n    frac_samples = rng.normal(frac_mean,\
      \ frac_sd / np.sqrt(sample_size), n_bootstrap)\n    fp_rel_samples = 1.0 / (1.0\
      \ - frac_samples)\n    return fp_rel_samples\n"
    n_bootstrap: 10000
  - name: Fp_rel_control_day21
    observable:
      type: identity
      state_variables:
      - K_rel
    units: dimensionless
    uses_inputs:
    - Fp_change_control_day21_mean
    - Fp_change_control_day21_sd
    - n_control_DCE
    evaluation_points:
    - 21.0
    sample_size_input: n_control_DCE
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    frac_mean = inputs['Fp_change_control_day21_mean']\n\
      \    frac_sd = inputs['Fp_change_control_day21_sd']\n    frac_samples = rng.normal(frac_mean,\
      \ frac_sd / np.sqrt(sample_size), n_bootstrap)\n    fp_rel_samples = 1.0 / (1.0\
      \ - frac_samples)\n    return fp_rel_samples\n"
    n_bootstrap: 10000
  identifiability_notes: This target uses only the control-group Fp time course from
    Cao2014 to constrain k_vas_decay as a slow, baseline vascular decay rate in PDAC
    xenografts. With four post-baseline time points and a single first-order decay
    parameter, k_vas_decay is structurally identifiable in this submodel. However,
    the observed changes in Fp are modest (<~10% over 3 weeks) with substantial inter-mouse
    variability, so the posterior will primarily provide an upper bound on the decay
    rate rather than a sharply peaked estimate. Tumor-size-dependent scaling of the
    decay term present in the full QSP model is absorbed into k_vas_decay here by
    approximating tumor size as quasi-constant over the imaging window; this introduces
    some conflation between intrinsic vascular fragility and geometric scaling, which
    should be interpreted as an effective decay rate for small PDAC tumors. DC101-treated
    arms in Cao2014 exhibit much faster, partially reversible Fp declines, reflecting
    pharmacologic VEGFR2 blockade; these are intentionally excluded from this baseline
    target to avoid biasing k_vas_decay upward toward therapy-induced regression rates.
    Additional targets using anti-angiogenic studies (e.g., Inai2004, Matsumoto2011)
    can be used separately to bound therapy-specific vascular decay parameters or
    modulation of k_vas_decay under treatment.
experimental_context:
  species: mouse
  system: animal_in_vivo
  cell_lines:
  - name: BxPC-3
    species: human
    tissue_origin: pancreas
    cell_type: pancreatic ductal adenocarcinoma
    source: ATCC
  indication: PDAC xenograft
study_interpretation: "Cao2014 used DCE-CT to follow vascular physiology in BxPC-3\
  \ pancreatic tumor xenografts over three weeks, reporting group-averaged fractional\
  \ changes in fractional plasma volume (Fp) and perfusion. In the untreated control\
  \ group, Fp exhibited a modest overall decline (~5\u201310%) with substantial variability\
  \ but without the rapid, large-magnitude changes seen under VEGFR2 blockade (DC101).\
  \ Treating Fp as a proxy for functional vascular volume/carrying capacity, these\
  \ control data support modeling baseline PDAC vasculature loss as a very slow first-order\
  \ decay process on the timescale of weeks, consistent with a small positive k_vas_decay\
  \ in the QSP model. The absence of strong monotonic decay indicates that intrinsic\
  \ vessel regression is nearly balanced by ongoing angiogenesis in these small xenografts,\
  \ so this target mainly constrains an upper bound on k_vas_decay compatible with\
  \ <~10% net loss over three weeks."
key_assumptions:
- Fractional plasma volume (Fp) from DCE-CT is proportional to the vasculature-dependent
  carrying capacity K in the QSP model, so relative changes in Fp approximate relative
  changes in K.
- Tumor size-dependent scaling of the k_vas_decay term in the full model (proportional
  to C_total^(2/3)) varies slowly over the 3-week window for these small xenografts
  and can be treated as approximately constant, allowing an effective first-order
  decay in K_rel.
- Error bars in Figure 1B represent standard deviation across mice, as stated by Cao2014,
  so SD can be converted to uncertainty in the group mean using n=11 control animals.
- Longitudinal scans are treated as independent across time points for the purpose
  of bootstrap uncertainty, ignoring within-mouse correlation; this slightly underestimates
  covariance between time points but has limited impact on a single-parameter decay
  fit.
- Other physiological processes that affect Fp (e.g., necrosis, edema) are assumed
  to be small or to project primarily onto the effective decay rate over this limited
  time window.
key_study_limitations:
- The data come from subcutaneous BxPC-3 xenografts in athymic nude mice rather than
  spontaneous or orthotopic human PDAC, so vascular structure and desmoplasia differ
  from the clinical setting.
- Fp is a functional imaging surrogate of vascular plasma volume and not a direct
  structural measure of vessel density or carrying capacity; changes may also reflect
  perfusion and permeability alterations.
- Control-group Fp changes are small relative to the reported SD, leading to considerable
  statistical uncertainty and limiting the precision with which k_vas_decay can be
  estimated.
- "Tumor-size-dependent scaling of vascular loss is not explicitly modeled here; instead\
  \ it is absorbed into an effective first-order decay rate, so the inferred k_vas_decay\
  \ should be interpreted as applicable to small PDAC tumors in the size range studied\
  \ (7\u201311 mm)."
- Longitudinal measurements on the same animals introduce correlations between time
  points that are not captured in the simple bootstrap treatment, which assumes independent
  group means at each time.
primary_data_source:
  doi: 10.1016/j.ijrobp.2013.11.002
  title: Monitoring the Effects of Anti-angiogenesis on the Radiation Sensitivity
    of Pancreatic Cancer Xenografts Using Dynamic Contrast-Enhanced CT
  year: 2014
  source_tag: Cao2014
  source_relevance:
    indication_match: exact
    indication_match_justification: The study uses human BxPC-3 pancreatic carcinoma
      xenografts in mice, which are a standard preclinical model of pancreatic ductal
      adenocarcinoma and are being used here specifically to study vascular physiology
      and radiation response in pancreatic tumors. While the tumors are subcutaneous
      rather than orthotopic, the indication (PDAC) matches the QSP model target.
    species_source: mouse
    species_target: human
    source_quality: primary_animal_in_vivo
    perturbation_type: physiological_baseline
    perturbation_relevance: Only the untreated control-group DCE-CT data (no DC101
      or radiation) are used to inform baseline vascular decay. These represent spontaneous
      vascular dynamics in growing PDAC xenografts without pharmacologic perturbation
      and are thus appropriate for estimating an intrinsic decay rate parameter.
    tme_compatibility: moderate
    tme_compatibility_notes: BxPC-3 xenografts in nude mice lack the full immune and
      stromal complexity of human PDAC, including the highly desmoplastic stroma and
      chronic inflammation of clinical tumors. Nevertheless, they exhibit abnormal
      and heterogeneous vasculature characteristic of pancreatic tumors, so the vascular
      decay dynamics are expected to be qualitatively similar but may differ quantitatively
      by a factor of a few.
    measurement_directness: proxy_observable
    temporal_resolution: timecourse
    experimental_system: animal_in_vivo
