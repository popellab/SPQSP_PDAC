      \    s = inputs['tgfb_asma_day11_sd']\n    return rng.normal(m, s, size=n_bootstrap)\n"
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['treat_11']\n"
  - name: tgfb_asma_day16
    units: dimensionless
    uses_inputs:
    - tgfb_asma_day16_mean
    - tgfb_asma_day16_sd
    - n_experiments
    sample_size_input: n_experiments
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    m = inputs['tgfb_asma_day16_mean']\n\
      \    s = inputs['tgfb_asma_day16_sd']\n    return rng.normal(m, s, size=n_bootstrap)\n"
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['treat_16']\n"
  identifiability_notes: 'Two parameters jointly identified from 8 observations (4 time points x 2

    conditions). k_PSC_to_myCAF is primarily constrained by the control

    curve shape (activation rate under basal TGFbeta). TGFb_50_CAF_act is

    constrained by the fold-acceleration in the TGFbeta1 condition — the ratio

    of Hill(basal+0.04)/Hill(basal) determines how much faster activation

    proceeds. With basal TGFbeta ~ 0.001 nM and exogenous 0.04 nM, the Hill

    ratio is sensitive to TGFb_50_CAF_act in the 0.01-1 nM range. The paired

    design breaks the degeneracy between k_act and EC50.

    '
