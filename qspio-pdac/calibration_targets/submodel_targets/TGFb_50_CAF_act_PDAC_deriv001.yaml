    - tgfb_asma_day7_mean
    - tgfb_asma_day7_sd
    - n_experiments
    sample_size_input: n_experiments
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    m = inputs['tgfb_asma_day7_mean']\n\
      \    s = inputs['tgfb_asma_day7_sd']\n    return rng.normal(m, s, size=n_bootstrap)\n"
    observable:
