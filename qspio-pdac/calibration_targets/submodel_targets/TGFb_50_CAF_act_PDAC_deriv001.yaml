calibration:
  parameters:
  - name: k_PSC_to_myCAF
    units: 1/day
  - name: TGFb_50_CAF_act
    units: nanomolarity
  - name: tgfb_basal_culture
    units: nanomolarity
    nuisance: true
    prior:
      distribution: lognormal
      mu: -6.9
      sigma: 1.5
  forward_model:
    type: algebraic
    formula: 'alpha_SMA_fraction(t, condition) = 1 - exp(-k_act * H_TGFb(condition) * t)

      where H_TGFb = TGFb / (EC50 + TGFb), with TGFb = basal (ctrl) or basal + exogenous (treat).

      Analytical solution of dQ/dt = -k*H*Q with Q+A = const (no death/proliferation).

      '
    data_rationale: 'Paired time courses (control vs +TGFbeta1) of alpha-SMA% during stellate

      cell activation. Pure first-order Q->A conversion: the activated fraction

      is 1 - exp(-k*H*t). Analytical solution replaces the ODE for faster inference.

      '
    submodel_rationale: 'Matches the full QSP model''s activation reaction:

      rate = k_act * TGFb/(TGFb_50_CAF_act + TGFb)

      PDGF was removed from the model (matrix-bound, not freely diffusing;

      see DEVLOG 2026-03-20). Basal TGFb in 10% FCS is a nuisance parameter.

      '
    code: "def compute(params, inputs):\n    k_act = params['k_PSC_to_myCAF']\n    ec50 = params['TGFb_50_CAF_act']\n    tgfb_basal\
      \ = params['tgfb_basal_culture']\n    tgfb_exog = inputs['tgfb1_conc_exogenous']\n    h_ctrl = tgfb_basal / (ec50 +\
      \ tgfb_basal)\n    h_treat = (tgfb_basal + tgfb_exog) / (ec50 + tgfb_basal + tgfb_exog)\n    # Return all 8 predictions\
      \ as a dict keyed by condition_day\n    return {\n        'ctrl_4': 1 - np.exp(-k_act * h_ctrl * 4),\n        'ctrl_7':\
      \ 1 - np.exp(-k_act * h_ctrl * 7),\n        'ctrl_11': 1 - np.exp(-k_act * h_ctrl * 11),\n        'ctrl_16': 1 - np.exp(-k_act\
      \ * h_ctrl * 16),\n        'treat_4': 1 - np.exp(-k_act * h_treat * 4),\n        'treat_7': 1 - np.exp(-k_act * h_treat\
      \ * 7),\n        'treat_11': 1 - np.exp(-k_act * h_treat * 11),\n        'treat_16': 1 - np.exp(-k_act * h_treat * 16),\n\
      \    }\n"
  error_model:
  - name: ctrl_asma_day4
    units: dimensionless
    uses_inputs:
    - ctrl_asma_day4_mean
    - ctrl_asma_day4_sd
    - n_experiments
    sample_size_input: n_experiments
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    m = inputs['ctrl_asma_day4_mean']\n\
      \    s = inputs['ctrl_asma_day4_sd']\n    return rng.normal(m, s, size=n_bootstrap)\n"
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['ctrl_4']\n"
  - name: ctrl_asma_day7
    units: dimensionless
    uses_inputs:
    - ctrl_asma_day7_mean
    - ctrl_asma_day7_sd
    - n_experiments
    sample_size_input: n_experiments
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    m = inputs['ctrl_asma_day7_mean']\n\
      \    s = inputs['ctrl_asma_day7_sd']\n    return rng.normal(m, s, size=n_bootstrap)\n"
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['ctrl_7']\n"
  - name: ctrl_asma_day11
    units: dimensionless
    uses_inputs:
    - ctrl_asma_day11_mean
    - ctrl_asma_day11_sd
    - n_experiments
    sample_size_input: n_experiments
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    m = inputs['ctrl_asma_day11_mean']\n\
      \    s = inputs['ctrl_asma_day11_sd']\n    return rng.normal(m, s, size=n_bootstrap)\n"
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['ctrl_11']\n"
  - name: ctrl_asma_day16
    units: dimensionless
    uses_inputs:
    - ctrl_asma_day16_mean
    - ctrl_asma_day16_sd
    - n_experiments
    sample_size_input: n_experiments
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    m = inputs['ctrl_asma_day16_mean']\n\
      \    s = inputs['ctrl_asma_day16_sd']\n    return rng.normal(m, s, size=n_bootstrap)\n"
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['ctrl_16']\n"
  - name: tgfb_asma_day4
    units: dimensionless
    uses_inputs:
    - tgfb_asma_day4_mean
    - tgfb_asma_day4_sd
    - n_experiments
    sample_size_input: n_experiments
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    m = inputs['tgfb_asma_day4_mean']\n\
      \    s = inputs['tgfb_asma_day4_sd']\n    return rng.normal(m, s, size=n_bootstrap)\n"
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['treat_4']\n"
  - name: tgfb_asma_day7
    units: dimensionless
