target_id: TGFb_50_CAF_act_bachem1992
tags:
- ai-generated
extraction_model: claude-opus-4-6
extraction_reasoning_effort: high
study_interpretation: 'Bachem et al. (1992) measured alpha-SMA expression (% positive cells) over

  time in primary rat liver perisinusoidal lipocyte cultures treated with or

  without 1 ng/ml TGFbeta1. Figure 7b shows alpha-SMA% at days 4, 7, 11, 16

  for control (10% FCS only) and TGFbeta1 (1 ng/ml added on day 2). TGFbeta1

  substantially accelerated activation: at day 11, 80% of TGFbeta1-treated

  cells were alpha-SMA+ versus 23% in controls. At day 16, 85% vs 45%.


  The paired time courses (control vs +TGFbeta1) jointly constrain

  k_PSC_to_myCAF (base activation rate from the control curve) and

  TGFb_50_CAF_act (EC50 for TGFbeta-driven activation from the fold-

  acceleration in the TGFbeta1 condition). The forward model runs the same

  ODE for both conditions, with TGFbeta modulating the activation rate via

  a Hill function.

  '
key_assumptions:
- 'The activation rate in the model is k_PSC_to_myCAF * TGFb/(TGFb_50_CAF_act + TGFb).

  In the control condition, basal TGFbeta from serum and autocrine production

  provides a non-zero Hill function value. In the +TGFbeta1 condition, the

  exogenous 1 ng/ml adds to this baseline.

  '
- '1 ng/ml TGFbeta1 = 0.04 nM (MW ~25 kDa for mature homodimer). This is

  the exogenous concentration added; the effective concentration includes

  basal TGFbeta from 10% FCS and autocrine production.

  '
- 'The basal TGFbeta level in 10% FCS culture is estimated at ~0.01 nM based

  on typical serum TGFbeta1 levels (~1-2 ng/ml total, ~10% active = 0.1-0.2

  ng/ml, diluted to 10% = 0.01-0.02 ng/ml = ~0.001 nM). This is small

  relative to the exogenous 0.04 nM addition.

  '
- 'Rat hepatic stellate cell TGFbeta responsiveness is representative of

  pancreatic stellate cell / CAF TGFbeta responsiveness.

  '
key_study_limitations:
- 'Rat hepatic stellate cells on 2D plastic, not human PDAC CAFs in vivo.

  '
- 'Only one TGFbeta1 concentration tested (1 ng/ml). A full dose-response

  would better constrain the EC50. The EC50 is identified from the magnitude

  of acceleration at this single dose relative to control.

  '
- 'The basal TGFbeta level in the culture is not measured and must be

  estimated. This introduces uncertainty in the Hill function calculation

  for the control condition.

  '
- 'TGFbeta1 was added on day 2 along with the conditioned media treatment.

  The effective concentration may change over the culture period due to

  consumption, degradation, and autocrine production.

  '
experimental_context:
  species: rat
  system: in_vitro_primary_cells
  cell_types:
  - name: perisinusoidal lipocyte / hepatic stellate cell
    source: rat liver
    isolation_method: 'Nycodenz density gradient from rat liver, seeded at 0.08 x 10^5

      cells/cm^2 on 6-well plates in DME with 10% FCS. TGFbeta1 (1 ng/ml)

      or control media added from day 2.

      '
  culture_conditions:
    medium: DME with 10% FCS +/- 1 ng/ml TGFbeta1
    duration: 16 days primary culture, sampled at days 4, 7, 11, 16
  indication: liver_fibrosis
primary_data_source:
  doi: 10.1172/JCI115561
  title: 'Activation of rat liver perisinusoidal lipocytes by transforming growth

    factors derived from myofibroblastlike cells. A potential mechanism of

    self perpetuation in liver fibrogenesis

    '
  authors:
  - Bachem
  - Meyer
  - Melchior
  - Sell
  - Gressner
  year: 1992
  source_tag: Bachem1992
  source_relevance:
    indication_match: proxy
    indication_match_justification: 'Rat hepatic stellate cell TGFbeta dose-response as proxy for PDAC CAF

      TGFbeta-driven activation. TGFbeta/SMAD signaling is the canonical

      activation pathway conserved between HSCs and PSCs.

      '
    species_source: rat
    species_target: human
    source_quality: primary_animal_in_vitro
    perturbation_type: pharmacological
    perturbation_relevance: 'Exogenous TGFbeta1 at 1 ng/ml (0.04 nM) added to primary stellate cell

      cultures. This directly probes the TGFbeta dose-response axis relevant

      to the model''s Hill function parameterization.

      '
    tme_compatibility: moderate
    tme_compatibility_notes: 'In vitro 2D culture. TGFbeta signaling dynamics (receptor availability,

      SMAD activation kinetics) may differ in 3D PDAC stroma.

      '
    measurement_directness: direct
    temporal_resolution: timecourse
    experimental_system: in_vitro_primary
