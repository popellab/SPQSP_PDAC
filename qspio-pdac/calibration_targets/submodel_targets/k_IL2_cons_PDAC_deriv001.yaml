calibration:
  parameters:
  - name: k_IL2_cons
    units: nanomole/cell/hour
    nuisance: false
  - name: IL2_50_Treg
    units: nanomolarity
    nuisance: false
  - name: f_cd25hi
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 0.47
      sigma: 0.5
  forward_model:
    data_rationale: Feinerman2010 measured IL-2 depletion from 4 pM starting concentration
      in 150 µL cultures containing known numbers of mouse Treg cells with either high
      (CD25hi, pre-exposed to IL-2) or basal (CD25lo, PBS-treated) IL-2Rα levels. The four
      endpoint IL-2 concentrations at ~28 h encode the per-cell consumption rate scaled by
      cell number and IL-2Rα expression. Since IL-2 concentrations (0-4 pM) are far below
      IL2_50_Treg (~320 pM), the Michaelis-Menten consumption is in its linear regime,
      giving first-order decay with analytical solution.
    submodel_rationale: "In the QSP model, Treg IL-2 consumption follows Michaelis-Menten\
      \ kinetics: rate = w_IL2_Treg × k_IL2_cons × Treg × IL2/(IL2_50_Treg + IL2). In the\
      \ Feinerman2010 experiment, IL2 (≤4 pM = 0.004 nM) ≪ IL2_50_Treg (0.32 nM), so\
      \ IL2/(IL2_50_Treg + IL2) ≈ IL2/IL2_50_Treg and the system reduces to first-order\
      \ decay: C(t) = C₀ × exp(−k_IL2_cons × f × N/(V × IL2_50_Treg) × t). The nuisance\
      \ parameter f_cd25hi captures the fold-increase in per-cell consumption for CD25hi\
      \ Tregs (reported as 1.6±0.3× in the paper). Only the ratio k_IL2_cons/IL2_50_Treg\
      \ is identifiable from this data; including both parameters lets the prior for IL2_50_Treg\
      \ (from separate targets) resolve the degeneracy."
    type: algebraic
    formula: "log(C_final/C₀) = −k_IL2_cons × f × N × t / (V × IL2_50_Treg), where f =\
      \ f_cd25hi for CD25hi conditions and f = 1 for CD25lo conditions."
    code: "def compute(params, inputs):\n    import numpy as np\n    k = params['k_IL2_cons']\
      \  # nmol/cell/hr\n    K_m = params['IL2_50_Treg']  # nM\n    f_hi = params['f_cd25hi']\n\
      \    V = inputs['culture_volume_uL'] * 1e-6  # uL -> L\n    t = inputs['t_endpoint_hr']\n\
      \    results = {}\n    for suffix, n_key, f in [\n        ('80000_cd25hi', 'N_80000_cd25hi',\
      \ f_hi),\n        ('62000_cd25lo', 'N_62000_cd25lo', 1.0),\n        ('27000_cd25hi',\
      \ 'N_27000_cd25hi', f_hi),\n        ('21000_cd25lo', 'N_21000_cd25lo', 1.0),\n   \
      \ ]:\n        N = inputs[n_key]\n        k_eff = k * f * N / (V * K_m)\n        log_ratio\
      \ = -k_eff * t\n        results[f'log_frac_{suffix}'] = np.maximum(log_ratio, -50.0)\n\
      \    return results\n"
  error_model:
  - name: depletion_80000_cd25hi
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['log_frac_80000_cd25hi']\n"
    units: dimensionless
    uses_inputs:
    - IL2_t0_80000_cd25hi_pM
    - IL2_final_80000_cd25hi_pM
    - IL2_t0_62000_cd25lo_pM
    - IL2_t0_27000_cd25hi_pM
    - IL2_t0_21000_cd25lo_pM
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    C0 = inputs['IL2_t0_80000_cd25hi_pM']\n    Cf = inputs['IL2_final_80000_cd25hi_pM']\n\
      \    # Empirical ELISA sigma from spread of t=0 readings (all nominal 4 pM)\n\
      \    t0_vals = np.array([inputs['IL2_t0_80000_cd25hi_pM'], inputs['IL2_t0_62000_cd25lo_pM'],\n\
      \        inputs['IL2_t0_27000_cd25hi_pM'], inputs['IL2_t0_21000_cd25lo_pM']])\n\
      \    sigma_log = np.std(np.log(t0_vals), ddof=1)\n    mu_log = np.log(Cf / C0)\n\
      \    # Propagate for ratio: sigma_ratio = sqrt(2) * sigma_single\n    return rng.normal(mu_log,\
      \ np.sqrt(2.0) * sigma_log, n_bootstrap)\n"
    sample_size_input: n_depletion_replicates
    n_bootstrap: 10000
  - name: depletion_62000_cd25lo
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['log_frac_62000_cd25lo']\n"
    units: dimensionless
    uses_inputs:
    - IL2_t0_62000_cd25lo_pM
    - IL2_final_62000_cd25lo_pM
    - IL2_t0_80000_cd25hi_pM
    - IL2_t0_27000_cd25hi_pM
    - IL2_t0_21000_cd25lo_pM
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    C0 = inputs['IL2_t0_62000_cd25lo_pM']\n    Cf = inputs['IL2_final_62000_cd25lo_pM']\n\
      \    t0_vals = np.array([inputs['IL2_t0_80000_cd25hi_pM'], inputs['IL2_t0_62000_cd25lo_pM'],\n\
      \        inputs['IL2_t0_27000_cd25hi_pM'], inputs['IL2_t0_21000_cd25lo_pM']])\n\
      \    sigma_log = np.std(np.log(t0_vals), ddof=1)\n    mu_log = np.log(Cf / C0)\n\
      \    return rng.normal(mu_log, np.sqrt(2.0) * sigma_log, n_bootstrap)\n"
    sample_size_input: n_depletion_replicates
    n_bootstrap: 10000
  - name: depletion_27000_cd25hi
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['log_frac_27000_cd25hi']\n"
    units: dimensionless
    uses_inputs:
    - IL2_t0_27000_cd25hi_pM
    - IL2_final_27000_cd25hi_pM
    - IL2_t0_80000_cd25hi_pM
    - IL2_t0_62000_cd25lo_pM
    - IL2_t0_21000_cd25lo_pM
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    C0 = inputs['IL2_t0_27000_cd25hi_pM']\n    Cf = inputs['IL2_final_27000_cd25hi_pM']\n\
      \    t0_vals = np.array([inputs['IL2_t0_80000_cd25hi_pM'], inputs['IL2_t0_62000_cd25lo_pM'],\n\
      \        inputs['IL2_t0_27000_cd25hi_pM'], inputs['IL2_t0_21000_cd25lo_pM']])\n\
      \    sigma_log = np.std(np.log(t0_vals), ddof=1)\n    mu_log = np.log(Cf / C0)\n\
      \    return rng.normal(mu_log, np.sqrt(2.0) * sigma_log, n_bootstrap)\n"
    sample_size_input: n_depletion_replicates
    n_bootstrap: 10000
  - name: depletion_21000_cd25lo
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['log_frac_21000_cd25lo']\n"
    units: dimensionless
    uses_inputs:
    - IL2_t0_21000_cd25lo_pM
    - IL2_final_21000_cd25lo_pM
    - IL2_t0_80000_cd25hi_pM
    - IL2_t0_62000_cd25lo_pM
    - IL2_t0_27000_cd25hi_pM
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    C0 = inputs['IL2_t0_21000_cd25lo_pM']\n    Cf = inputs['IL2_final_21000_cd25lo_pM']\n\
      \    t0_vals = np.array([inputs['IL2_t0_80000_cd25hi_pM'], inputs['IL2_t0_62000_cd25lo_pM'],\n\
      \        inputs['IL2_t0_27000_cd25hi_pM'], inputs['IL2_t0_21000_cd25lo_pM']])\n\
      \    sigma_log = np.std(np.log(t0_vals), ddof=1)\n    mu_log = np.log(Cf / C0)\n\
      \    return rng.normal(mu_log, np.sqrt(2.0) * sigma_log, n_bootstrap)\n"
    sample_size_input: n_depletion_replicates
    n_bootstrap: 10000
  identifiability_notes: "Only the ratio k_IL2_cons/IL2_50_Treg is identifiable from\
    \ this data because IL-2 concentrations (≤4 pM) are far below IL2_50_Treg (~320 pM),\
    \ placing the system in the linear (first-order) regime where the Michaelis-Menten\
    \ saturating term is never engaged. Including both parameters allows the separate\
    \ IL2_50_Treg prior (from other targets) to break the degeneracy. The nuisance\
    \ parameter f_cd25hi is identified from comparing CD25hi vs CD25lo conditions at\
    \ similar cell numbers. Note: the current prior for k_IL2_cons (centered at 6e-6\
    \ nmol/cell/hr from Lotze1985 systemic PK) predicts near-instantaneous IL-2 depletion\
    \ at the cell densities in this experiment; the data supports a value ~5 orders of\
    \ magnitude lower (~1e-11 nmol/cell/hr), suggesting the Lotze1985-derived value\
    \ conflates renal clearance with receptor-mediated consumption."
experimental_context:
  species: mouse
  system: in_vitro_primary_cells
  cell_lines: null
  cell_types:
  - name: regulatory T cell (Treg)
    phenotype: CD4+CD25+ Foxp3+ from B10.A spleen and lymph nodes
    isolation_method: MACS Treg cell isolation kit (Miltenyi Biotec)
    source: B10.A mouse spleen and lymph nodes
  culture_conditions:
    substrate: 96-well plate
    serum_concentration: 10.0
    serum_concentration_units: percent
    oxygen_level: normoxic (5% CO2, 37°C)
    culture_type: 2d_monolayer
    medium: complemented RPMI 1640 with 10% heat-inactivated FBS
    duration: ~28 h IL-2 depletion assay
    notes: "Tregs were pre-exposed to IL-2 (CD25hi) or PBS (CD25lo) to obtain\
      \ different IL-2Rα expression levels. CD25hi cells have ~2.7×10^4 IL-2R\u03B1\
      \ molecules/cell; CD25lo have ~10^4."
  indication: autoimmunity_immunology (used as proxy for PDAC T cell IL-2 dynamics)
study_interpretation: "Feinerman2010 quantified IL-2 depletion from culture medium\
  \ by known numbers of mouse Tregs with characterized IL-2Rα expression levels.\
  \ Starting from 4 pM IL-2 in 150 µL wells, four conditions (varying cell number\
  \ and CD25 level) showed graded depletion over 28 h, with 80000 CD25hi Tregs\
  \ depleting IL-2 to ~0.13 pM while 21000 CD25lo Tregs left ~2.4 pM. Since\
  \ the IL-2 concentrations are far below IL2_50_Treg, the system is in the first-order\
  \ regime where consumption rate ∝ k_IL2_cons × N × [IL2] / IL2_50_Treg.\
  \ The four endpoint measurements constrain the ratio k_IL2_cons/IL2_50_Treg\
  \ and the CD25hi/lo fold-difference (reported as 1.6±0.3× in the paper)."
key_assumptions:
- IL-2 depletion in the 96-well culture follows first-order kinetics (valid when
  IL-2 ≪ IL2_50_Treg, i.e., 4 pM ≪ 320 pM).
- Treg cell numbers remain approximately constant over the 28 h assay (no
  significant proliferation or death at these low IL-2 concentrations).
- The difference in per-cell consumption between CD25hi and CD25lo Tregs is
  captured by a single fold-factor (f_cd25hi), reflecting the ~2.7-fold difference
  in IL-2Rα surface expression.
- Mouse Treg receptor-mediated IL-2 consumption kinetics are a reasonable proxy
  for human Treg consumption in the QSP model, with translation uncertainty
  accounted for by the source_relevance fields.
- The QSP model's w_IL2_Treg = 1.0 (default) maps to the CD25lo baseline
  condition; CD25hi represents activated Tregs with upregulated IL-2Rα.
key_study_limitations:
- Mouse Tregs, not human; receptor numbers and kinetics may differ.
- "In vitro well-mixed 150 µL culture, not the structured TME with diffusion\
  \ limitations and heterogeneous cell densities."
- Only endpoint data used; intermediate time points would better constrain kinetics.
- IL-2 ELISA sensitivity near detection limit (~0.1 pM) may affect accuracy
  of low-concentration measurements (80000 cd25hi endpoint).
- "The 10% FBS in culture medium may contain IL-2 binding proteins that affect\
  \ apparent depletion rate."
- "No direct measurement of IL-2Rα expression during the depletion assay;\
  \ CD25 upregulation by IL-2 exposure (EC50 ~60 fM) could dynamically change\
  \ consumption rates over the 28 h period."
primary_data_source:
  doi: 10.1038/msb.2010.90
  title: "Single-cell quantification of IL-2 response by effector and regulatory T\
    \ cells reveals critical plasticity in immune response"
  authors:
  - Ofer Feinerman
  - Garrit Jentsch
  - Karen E Tkach
  - Jesse W Coward
  - Matthew M Hathorn
  - Michael W Sneddon
  - Thierry Emonet
  - Kendall A Smith
  - "Gr\xE9goire Altan-Bonnet"
  year: 2010
  source_tag: Feinerman2010
  source_relevance:
    indication_match: proxy
    indication_match_justification: The study uses mouse Treg cells from B10.A mice
      in an immunology/autoimmunity context. IL-2 receptor-mediated consumption is a
      fundamental T cell property not specific to cancer type, but receptor expression
      levels and IL-2 availability differ between healthy mice and the PDAC TME.
    species_source: mouse
    species_target: human
    source_quality: primary_animal_in_vitro
    perturbation_type: physiological_baseline
    perturbation_relevance: Tregs were isolated and cultured with physiological IL-2
      concentrations (4 pM) without pharmacological perturbation. The depletion reflects
      endogenous receptor-mediated IL-2 consumption under controlled conditions.
    tme_compatibility: low
    tme_compatibility_notes: In vitro 96-well culture with purified Tregs in complete
      medium. Lacks the complex TME environment (hypoxia, cytokine milieu, stromal
      interactions) that may modulate IL-2R expression and consumption kinetics in vivo.
    measurement_directness: single_inversion
    temporal_resolution: endpoint_pair
    experimental_system: in_vitro_primary
