target_id: k_IL6_sec_iCAF_saga2018
tags:
- ai-generated
extraction_model: claude-opus-4-6
study_interpretation: 'Saga et al. (2018) measured IL-6 protein concentration by ELISA in

  supernatants of LX-2 human hepatic stellate cells cultured for 48h under

  control (DMEM + 2% FBS) or TNF-alpha (10 ng/mL) conditions. Control cells

  expressed GFAP (quiescent marker) with low alpha-SMA; TNF-alpha-treated cells

  showed high alpha-SMA expression (activated phenotype). The TNF-alpha-activated

  condition is the relevant proxy for iCAF-like inflammatory stellate cells

  (NF-kB-driven, IL-6-secreting).


  At steady state (48h >> IL-6 half-life ~1.7h), the supernatant concentration

  reflects the balance of secretion and degradation:

  C_ss = k_sec * N / (k_deg * V). Both conditions share k_deg, so the pair

  constrains k_sec for basal vs activated states and k_deg jointly.

  '
key_assumptions:
- 'LX-2 cells do not proliferate significantly over 48h at 2% FBS. Cell count

  is approximately constant at the seeding density of 1e5 cells/well.

  '
- 'IL-6 degradation in vitro follows first-order kinetics with rate k_IL6_deg.

  At 48h (>>28 half-lives at k_deg=10/day), the system is at steady state.

  '
- 'The TNF-alpha-activated LX-2 phenotype (high alpha-SMA, NF-kB activation,

  IL-6 secretion) is representative of the iCAF inflammatory program in PDAC.

  '
- 'Media volume in 24-well plate is approximately 0.5-1.0 mL. Treated as a

  nuisance parameter with informative prior.

  '
key_study_limitations:
- 'LX-2 is an immortalized human hepatic stellate cell line, not primary

  pancreatic stellate cells. HSC and PSC IL-6 secretion may differ quantitatively.

  '
- 'TNF-alpha activation is a proxy for the IL-1/NF-kB/JAK-STAT pathway that

  drives iCAF identity in PDAC. The actual iCAF program involves IL-1alpha from

  cancer cells, not TNF-alpha, though both converge on NF-kB.

  '
- 'Media volume is not reported. Standard 24-well plate volumes (0.5-1.0 mL)

  are assumed, introducing ~2-fold uncertainty in absolute secretion rate.

  '
- 'Sample size for the ELISA is not explicitly stated. The text reports data as

  mean +/- SD but does not specify n for the IL-6 ELISA specifically. Flow

  cytometry experiments used 5-7 separate experiments.

  '
experimental_context:
