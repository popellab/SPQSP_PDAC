  source_relevance:
    indication_match: proxy
    indication_match_justification: 'Human hepatic stellate cell line (LX-2) as proxy for PDAC pancreatic

      stellate cells / iCAFs. HSCs and PSCs share embryological origin

      (neural crest), stellate morphology, vitamin A storage, and

      activation biology (alpha-SMA, collagen, IL-6 secretion). The

      NF-kB-driven inflammatory program that produces IL-6 is conserved.

      '
    species_source: human
