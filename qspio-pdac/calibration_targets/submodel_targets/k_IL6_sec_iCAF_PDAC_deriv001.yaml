calibration:
  parameters:
  - name: k_IL6_sec_iCAF
    units: nanomolarity*liter/(cell*day)
  - name: k_IL6_deg
    units: 1/day
  - name: v_media_mL
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: -0.4
      sigma: 0.3
  - name: k_IL6_sec_basal
    units: nanomolarity*liter/(cell*day)
    nuisance: true
    prior:
      distribution: lognormal
      mu: -25.0
      sigma: 1.0
  forward_model:
    type: algebraic
    formula: 'C_ss (nM) = k_sec * N / (k_deg * V_L), then C_ss (pg/mL) = C_ss (nM) * MW_Da.

      Conversion: 1 nM = MW_Da pg/mL (since 1 nM × MW g/mol × 1e-9 mol/nmol × 1e12 pg/g × 1e-3 L/mL = MW pg/mL).

      '
    data_rationale: 'At 48h with k_IL6_deg=10/day (half-life ~1.7h), the system reaches steady

      state within ~8h. The ELISA measurement at 48h directly reads C_ss.

      Two conditions (control + TNF-alpha) with shared k_deg jointly constrain

      k_IL6_sec_iCAF (activated/iCAF rate) and k_IL6_sec_basal (quiescent rate).

      '
    submodel_rationale: 'Maps to the IL-6 secretion reaction in fibroblast_module_enhanced.m:

      null -> V_T.IL6 at rate k_IL6_sec_iCAF * V_T.iCAF. The QSP model uses

      k_IL6_sec_iCAF for iCAF secretion; the TNF-alpha-activated LX-2 condition

      is the proxy for this rate.

      '
    code: "def compute(params, inputs):\n    k_sec_iCAF = params['k_IL6_sec_iCAF']\n    k_sec_basal = params['k_IL6_sec_basal']\n\
      \    k_deg = params['k_IL6_deg']\n    v_mL = params['v_media_mL']\n    N = inputs['n_cells_e5'] * 1e5\n    MW_Da = inputs['IL6_MW_Da']\n\
      \n    # C_ss (nM) = k_sec * N / (k_deg * V_L)\n    # C_ss (pg/mL) = C_ss (nM) * MW_Da\n\
      \    # (1 nM * MW_Da g/mol * 1e-9 mol/nmol * 1e12 pg/g * 1e-3 L/mL = MW_Da pg/mL)\n\
      \    V_L = v_mL / 1000\n    C_ss_ctrl_nM = k_sec_basal * N / (k_deg * V_L)\n\
      \    C_ss_tnfa_nM = k_sec_iCAF * N / (k_deg * V_L)\n\n    return {\n\
      \        'ctrl': C_ss_ctrl_nM * MW_Da,\n        'tnfa': C_ss_tnfa_nM * MW_Da,\n    }\n"
  error_model:
  - name: IL6_control
    units: picogram / milliliter
    uses_inputs:
    - IL6_ctrl_mean
    - IL6_ctrl_sd
    - n_experiments
    sample_size_input: n_experiments
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['IL6_ctrl_mean']\n    sd = inputs['IL6_ctrl_sd']\n    cv = sd / mean\n    return rng.lognormal(np.log(mean),\
      \ cv / np.sqrt(sample_size), n_bootstrap)\n"
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['ctrl']\n"
  - name: IL6_TNFa
    units: picogram / milliliter
    uses_inputs:
    - IL6_TNFa_mean
    - IL6_TNFa_sd
    - n_experiments
    sample_size_input: n_experiments
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['IL6_TNFa_mean']\n    sd = inputs['IL6_TNFa_sd']\n    cv = sd / mean\n    return rng.lognormal(np.log(mean),\
      \ cv / np.sqrt(sample_size), n_bootstrap)\n"
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['tnfa']\n"
  identifiability_notes: 'Two observations (control + TNF-alpha) constraining four parameters

    (k_IL6_sec_iCAF, k_IL6_sec_basal, k_IL6_deg, v_media_mL). k_IL6_deg has

    a strong prior from the CSV (median=10/day, sigma=0.5). v_media_mL has a

    tight nuisance prior (0.5-1 mL). The ratio of TNF-alpha to control IL-6

    directly constrains the ratio k_sec_iCAF / k_sec_basal independently of

    k_deg and volume. The absolute values then constrain the product

    k_sec / (k_deg * V), with k_deg and V priors breaking the degeneracy.

    '
