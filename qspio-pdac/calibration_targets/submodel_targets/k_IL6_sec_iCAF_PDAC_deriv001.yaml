    source_quality: primary_human_in_vitro
    perturbation_type: pharmacological
    perturbation_relevance: 'TNF-alpha (10 ng/mL) activates NF-kB signaling, driving the inflammatory

      secretory phenotype analogous to iCAF identity. This provides an upper

      estimate for IL-6 secretion under inflammatory activation. The control

      condition provides the basal (quiescent) rate.

      '
