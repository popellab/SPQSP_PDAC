target_id: k_Treg_pro_tumor
inputs:
- name: Ki67_Treg_fraction_tumor_mean_percent
  value: 10.3
  units: percent
  input_type: direct_measurement
  source_ref: Szeponik2021
  source_location: Results, 'Mass cytometry identifies 13 clusters of intestinal Treg
    in colon cancer patients'
  value_snippet: Cluster 6 was one of the more numerous in the tumors, comprising
    on average 10.3% of intratumoral Treg, and was increased 3.6-fold compared to
    unaffected colon.
- name: n_patients_Treg_CyTOF
  value: 8.0
  units: dimensionless
  input_type: direct_measurement
  source_ref: Szeponik2021
  source_location: Results, 'Mass cytometry identifies 13 clusters of intestinal Treg
    in colon cancer patients'
  value_snippet: 'the CD45+ fraction of mucosal single cell suspensions from both
    unaffected colon tissue and tumors from 8 consecutive patients (Additional file
    1: Table S1) were analysed by mass cytometry.'
calibration:
  parameters:
  - name: k_Treg_pro_tumor
    units: 1/day
    nuisance: false
  - name: Treg_cell_cycle_duration
    units: day
    nuisance: true
    prior:
      distribution: lognormal
      mu: 0.0
      sigma: 0.5
  forward_model:
    data_rationale: Szeponik2021 used mass cytometry on colon tumors from 8 patients
      to define 13 intratumoral Treg clusters. Cluster 6 is described as Ki67+ effector/memory
      Treg and comprises on average 10.3% of all intratumoral Treg. We interpret this
      fraction as a direct estimate of the proportion of tumor-infiltrating Treg that
      are in active cell cycle (Ki67+). The study reports only the mean across patients,
      so we treat uncertainty in this mean via parametric bootstrap with no additional
      dispersion beyond translation uncertainty.
    submodel_rationale: In the full QSP PDAC model, k_Treg_pro_tumor is the per-day
      local proliferation rate of tumor Treg in a logistic growth term. For a population
      in which each Treg enters the cell cycle as a Poisson process with rate k_Treg_pro_tumor
      and remains Ki67+ for a characteristic duration Treg_cell_cycle_duration, the
      expected fraction of Ki67+ cells at dynamic steady state is approximately k_Treg_pro_tumor
      * Treg_cell_cycle_duration. This algebraic submodel captures that mechanistic
      interpretation while abstracting away explicit tumor volume and density dependence,
      which are not constrained by the Szeponik2021 data.
    type: algebraic
    formula: Ki67_Treg_fraction_percent = 100 * k_Treg_pro_tumor * Treg_cell_cycle_duration
    code: "def compute(params, inputs):\n    import numpy as np\n    k = params['k_Treg_pro_tumor']\
      \  # per-day tumor-local Treg proliferation rate\n    T_cycle = params['Treg_cell_cycle_duration']\
      \  # duration of Ki67+ cell cycle phase (days)\n    # Under a simple age-structured\
      \ approximation at dynamic steady state,\n    # the fraction of cells that are\
      \ Ki67+ is approximately k * T_cycle.\n    # We express the observable in percent\
      \ for comparison with the paper.\n    return 100.0 * k * T_cycle"
  error_model:
  - name: Ki67_Treg_fraction_tumor_Szeponik2021
    units: percent
    uses_inputs:
    - Ki67_Treg_fraction_tumor_mean_percent
    - n_patients_Treg_CyTOF
    sample_size_input: n_patients_Treg_CyTOF
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean_pct = inputs['Ki67_Treg_fraction_tumor_mean_percent']\n\
      \    # No dispersion is reported for this mean; we therefore treat it as a fixed\n\
      \    # point estimate and return a degenerate distribution at the mean.\n  \
      \  return np.full(n_bootstrap, mean_pct)"
    n_bootstrap: 10000
  identifiability_notes: This target provides a single snapshot measurement of the
    fraction of tumor-infiltrating Treg that are Ki67+ in human colon cancer. In the
    submodel, the observable Ki67 fraction depends on the product k_Treg_pro_tumor
    * Treg_cell_cycle_duration. With only one observable, k_Treg_pro_tumor is not
    fully identifiable without prior information on Treg_cell_cycle_duration. We therefore
    treat Treg_cell_cycle_duration as a nuisance parameter with a relatively tight
    lognormal prior centered at 1 day, reflecting typical activated T cell cycle lengths.
    The posterior for k_Treg_pro_tumor will be correlated with Treg_cell_cycle_duration
    and effectively scales as (Ki67_fraction / T_cycle). Additional time-course data
    on Treg expansion or independent measurements of Treg division times in tumors
    would be required to disentangle these parameters more robustly and to connect
    explicitly to the logistic carrying-capacity term used in the full QSP model.
experimental_context:
  species: human
  system: clinical_in_vivo
  cell_types:
  - name: CD4+FoxP3+ regulatory T cells
    phenotype: Tumor-infiltrating intestinal Treg, including Ki67+ effector subsets
    isolation_method: Enzymatic digestion of colon tumor lamina propria followed by
      CD45+ enrichment and manual gating on FoxP3+CD25highCD27low CD4+ T cells in
      mass cytometry
    source: Colon tumor resections from treatment-naive colon adenocarcinoma patients
      undergoing curative hemicolectomy
  indication: Colon adenocarcinoma (used as solid-tumor proxy for PDAC Treg proliferation)
study_interpretation: Szeponik2021 provides a high-dimensional mass cytometry characterization
  of tumor-infiltrating regulatory T cells in human colon cancer. Among 13 Treg metaclusters,
  cluster 6 is identified as a Ki67+ effector/memory Treg subset that expresses activation
  markers (CD45RO, ICOS, OX-40, CD39) and is enriched in tumors. The paper reports
  that cluster 6 constitutes on average 10.3% of intratumoral Treg across 8 patients.
  Since Ki67 is a standard marker of cells in active cell cycle, this fraction gives
  a direct estimate of the proportion of tumor Treg that are proliferating at the
  time of surgery. Under a simple age-structured approximation in which Treg enter
  the cell cycle at per-cell rate k_Treg_pro_tumor and remain Ki67+ for a characteristic
  duration Treg_cell_cycle_duration, the expected Ki67+ fraction is approximately
  k_Treg_pro_tumor * Treg_cell_cycle_duration. Mapping the observed ~10% Ki67+ fraction
  to this algebraic relationship yields an order-of-magnitude estimate of k_Treg_pro_tumor
  in human solid tumors, which we use as a proxy prior for PDAC tumor-local Treg proliferation.
key_assumptions:
- The Ki67+ effector Treg cluster 6 (10.3% of intratumoral Treg) is representative
  of the overall proliferating Treg fraction in colon tumors; additional Ki67+ Treg
  in cluster 8 are neglected, making this a conservative (lower-bound) estimate of
  the proliferating fraction.
- Ki67 expression marks the full duration of the actively cycling phase for proliferating
  Treg, so that the mean time a cell spends Ki67+ (Treg_cell_cycle_duration) is of
  order 1 day, consistent with typical activated human T cell cycle times.
- "The intratumoral Treg compartment is in a quasi-steady state on the timescale of\
  \ cell cycling, such that the simple relationship f_Ki67 \u2248 k_Treg_pro_tumor\
  \ * Treg_cell_cycle_duration holds without needing to account explicitly for net\
  \ population growth, death, or trafficking."
- The logistic carrying-capacity factor that modulates Treg proliferation in the full
  QSP model is approximately constant across the tumors studied and can be absorbed
  into the effective per-cell proliferation rate inferred from Ki67; thus the algebraic
  mapping is a reasonable approximation for calibrating k_Treg_pro_tumor.
- Colon cancer Treg proliferation kinetics (in terms of Ki67+ fraction) are similar
  in order of magnitude to those in PDAC, so that colon tumors can serve as a mechanistic
  proxy for setting a prior on PDAC tumor-local Treg proliferation.
key_study_limitations:
- The tumor type is colon adenocarcinoma rather than PDAC; differences in stromal
  architecture, antigen burden, and immune contexture may lead to systematically different
  Treg proliferation dynamics.
- Only the mean fraction of Treg in the Ki67+ effector cluster 6 is reported; no dispersion
  statistics (SD/SEM or per-patient values) are given, so the variability of the estimate
  must be captured via translation and model-level uncertainty rather than directly
  extracted measurement error.
- Cluster 8 is also described as Ki67+ and enriched in tumors, but its exact frequency
  is not reported numerically, so the total Ki67+ Treg fraction is likely >10.3%.
  Our estimate therefore probably underestimates the true proliferating fraction.
- The mapping from Ki67+ fraction to a per-day proliferation rate neglects explicit
  contributions from Treg death and trafficking, and assumes that the Ki67+ phase
  duration is reasonably approximated by a single nuisance parameter with a literature-based
  prior.
- Sample size for the mass cytometry analysis is modest (n=8 patients), which limits
  the precision with which inter-patient variability in proliferating Treg fractions
  can be characterized.
primary_data_source:
  doi: 10.1186/s12865-021-00449-1
  title: Intratumoral regulatory T cells from colon cancer patients comprise several
    activated effector populations
  authors:
  - Szeponik
  - Ahlmanner F
  - Sundstrom P
  - Rodin W
  - Gustavsson B
  - Bexe Lindskog E
  - Wettergren Y
  - Quiding-Jarbrink M
  year: 2021
  source_tag: Szeponik2021
  source_relevance:
    indication_match: proxy
    indication_match_justification: The source study analyzes tumor-infiltrating regulatory
      T cells in human colon adenocarcinoma, whereas the QSP model targets pancreatic
      ductal adenocarcinoma (PDAC). Both are solid epithelial tumors with significant
      immune infiltration, but PDAC typically has a more desmoplastic, T cell-excluded
      microenvironment. We therefore use colon cancer as a mechanistic proxy for estimating
      the order of magnitude of tumor-local Treg proliferation, recognizing that absolute
      rates may differ between indications.
    species_source: human
    species_target: human
    source_quality: primary_human_clinical
    perturbation_type: physiological_baseline
    perturbation_relevance: The data are collected from treatment-naive colon cancer
      patients at the time of curative surgery, without pharmacological or genetic
      perturbations specifically targeting Treg. Thus the measured Ki67+ Treg fractions
      reflect the physiological baseline of the tumor immune microenvironment in this
      indication, suitable for informing baseline proliferation rates in the QSP model.
    tme_compatibility: low
    tme_compatibility_notes: Colon adenocarcinomas, particularly those with high lymphocyte
      infiltration, typically have a more permissive immune microenvironment than
      PDAC, which is characterized by dense desmoplastic stroma, strong T cell exclusion,
      and layered myeloid and stromal immunosuppression. As a result, Treg trafficking
      and proliferation rates inferred from colon tumors may overestimate those in
      PDAC by up to an order of magnitude; this cross-indication uncertainty is captured
      via translation sigma in the calibration pipeline.
    measurement_directness: single_inversion
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: clinical_in_vivo
