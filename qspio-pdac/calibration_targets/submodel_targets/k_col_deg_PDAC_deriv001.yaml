calibration:
  parameters:
  - name: k_col_deg
    units: 1/day
  forward_model:
    type: algebraic
    formula: k_col_deg = FSR (at steady state, fractional synthesis = fractional degradation)
    data_rationale: 'In vivo stable isotope labeling directly measures the fraction of collagen

      that is newly synthesized. At steady state (constant total collagen pool),

      FSR = degradation rate constant. The F3-F4 fibrosis data is most relevant

      for PDAC desmoplasia.

      '
    submodel_rationale: 'The QSP model uses k_col_deg as a first-order degradation rate:

      d(collagen)/dt = ... - k_col_deg * collagen. At steady state, k_col_deg

      equals the fractional synthesis rate of the collagen pool.

      '
    code: "def compute(params, inputs):\n    # k_col_deg in 1/day; FSR is in %/day -> divide by 100\n    return params['k_col_deg']\
      \ * 100\n"
  error_model:
  - name: fsr_fibrotic_liver
    units: percent / day
    uses_inputs:
    - fsr_monthly_f3
    - fsr_monthly_f4
    - fsr_daily_low
    - fsr_daily_high
    - n_subjects
    sample_size_input: n_subjects
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    fsr_low\
      \ = inputs['fsr_daily_low']\n    fsr_high = inputs['fsr_daily_high']\n    # Lognormal bootstrap using reported range\
      \ 0.2-0.6 %/day\n    # Geometric mean of endpoints as central estimate\n    log_low = np.log(fsr_low)\n    log_high\
      \ = np.log(fsr_high)\n    log_mid = (log_low + log_high) / 2\n    # Estimate SD from range using order statistics for\
      \ n subjects\n    n = int(inputs['n_subjects'])\n    range_factor = 2 * np.sqrt(2 * np.log(n))\n    sd_log = (log_high\
      \ - log_low) / range_factor\n    return rng.lognormal(log_mid, sd_log, size=n_bootstrap)\n"
  identifiability_notes: 'k_col_deg is uniquely identified from the FSR at steady state. The main

    uncertainty is the translation from hepatic fibrosis to PDAC desmoplasia

    (captured by translation sigma) and the inter-patient variability within

    the fibrotic cohort.

    '
