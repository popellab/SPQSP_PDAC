extraction_reasoning_effort: high
study_interpretation: 'Decaris et al. 2015 measured in vivo collagen turnover in human liver tissue using

  stable isotope labeling (deuterium oxide) and mass spectrometry. Hepatic collagen I

  and III FSR ranged from 0.2-0.6% per day across 6 subjects with chronic liver disease

  (fibrosis scores F0-F4). FSR correlated with fibrosis severity (r2=0.79, p<0.05).

  At steady state, FSR equals the degradation rate constant k_col_deg. PDAC desmoplasia

  is comparable to F3-F4 hepatic fibrosis in terms of collagen density and remodeling

  activity, so the fibrotic-end FSR (~0.5-0.6%/day) is the most relevant range.

  '
key_assumptions:
- 'At steady state, fractional synthesis rate equals fractional degradation rate.

  FSR = k_col_deg when collagen pool is in dynamic equilibrium. The paper confirms

  active collagen remodeling even in advanced fibrosis (F3-F4 patients had the

  highest FSR, not the lowest).

  '
- 'PDAC desmoplasia is comparable to F3-F4 hepatic fibrosis for collagen turnover

  rates. Both involve dense collagen deposition by activated myofibroblasts with

  concurrent MMP-mediated remodeling.

  '
- 'FSR is reported as % new per day from the mono-exponential rise-to-plateau curve

  fit: FSR = -ln(1-F)/t where F is fraction newly synthesized and t is labeling time.

  The monthly values in Fig 3B (% new per 30 days) are converted to daily FSR.

  '
key_study_limitations:
- 'Hepatic tissue, not pancreatic. Liver has different ECM composition (more type III),

  different cellular sources (hepatic stellate cells vs pancreatic stellate cells),

  and different mechanical environment.

  '
- 'Chronic liver disease (HCV, autoimmune hepatitis), not cancer-associated fibrosis.

  Tumor-derived signals (PDGF, TGFb from cancer cells) may alter remodeling rates.

  '
- 'Small sample (n=6 with tissue proteomic data). Wide inter-patient variability.

  '
- 'Labeling duration 20-56 days. Very long-lived collagen may be underestimated

  (the three-compartment model may not fully capture the slowest turnover pool).

  '
