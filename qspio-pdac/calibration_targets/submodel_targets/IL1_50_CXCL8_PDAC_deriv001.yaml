calibration:
  parameters:
  - name: IL1_50
    units: nanomolarity
  - name: n_IL1
    units: dimensionless
  - name: CXCL8_fold_max
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 7.6
      sigma: 0.5
  forward_model:
    type: direct_fit
    curve: hill
    ec50: IL1_50
    n_hill: n_IL1
    baseline: '1.0'
    maximum: CXCL8_fold_max
    data_rationale: 'CXCL8 mRNA fold-change in MRC-5 lung fibroblasts shows a graded dose-response to IL-1beta across 0.01-1
      ng/mL (0.57-57 pM). Unlike IL-6 which saturates by 5.7 pM, CXCL8 still increases from 854 to 1250 fold between 0.1 and
      1 ng/mL, providing dose-response information in the transition region.

      '
    submodel_rationale: 'Same IL-1R1 signaling pathway as the IL-6 target. CXCL8 (IL-8) is also a direct NF-kB target gene.
      The shared IL1_50 and n_IL1 parameters are constrained by both targets jointly. The different apparent sensitivity between
      IL-6 and CXCL8 is absorbed by the gene-specific maximum (nuisance).

      '
  error_model:
  - name: CXCL8_at_low
    units: dimensionless
    x_input: IL1b_conc_low_nM
    uses_inputs:
    - CXCL8_fold_low_mean
    - CXCL8_fold_low_sd
    - n_replicates
    sample_size_input: n_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['CXCL8_fold_low_mean']\n    sd = inputs['CXCL8_fold_low_sd']\n    cv = sd / mean\n\
      \    sigma_ln = np.sqrt(np.log(1.0 + cv**2))\n    mu_ln = np.log(mean) - sigma_ln**2\
      \ / 2.0\n    return rng.lognormal(mu_ln, sigma_ln / np.sqrt(sample_size), n_bootstrap)\n"
  - name: CXCL8_at_mid
    units: dimensionless
    x_input: IL1b_conc_mid_nM
    uses_inputs:
    - CXCL8_fold_mid_mean
    - CXCL8_fold_mid_sd
    - n_replicates
    sample_size_input: n_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['CXCL8_fold_mid_mean']\n    sd = inputs['CXCL8_fold_mid_sd']\n    cv = sd / mean\n\
      \    sigma_ln = np.sqrt(np.log(1.0 + cv**2))\n    mu_ln = np.log(mean) - sigma_ln**2\
      \ / 2.0\n    return rng.lognormal(mu_ln, sigma_ln / np.sqrt(sample_size), n_bootstrap)\n"
  - name: CXCL8_at_high
    units: dimensionless
    x_input: IL1b_conc_high_nM
    uses_inputs:
    - CXCL8_fold_high_mean
    - CXCL8_fold_high_sd
    - n_replicates
    sample_size_input: n_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['CXCL8_fold_high_mean']\n    sd = inputs['CXCL8_fold_high_sd']\n    cv = sd / mean\n\
      \    sigma_ln = np.sqrt(np.log(1.0 + cv**2))\n    mu_ln = np.log(mean) - sigma_ln**2\
      \ / 2.0\n    return rng.lognormal(mu_ln, sigma_ln / np.sqrt(sample_size), n_bootstrap)\n"
  identifiability_notes: 'CXCL8 provides better dose-response information than IL-6 because the response is still increasing
    between 5.7 and 57 pM (854 to 1250 fold). This helps pin IL1_50 more precisely. Joint inference with the IL-6 target further
    constrains the shared IL1_50 and n_IL1 parameters.

    '
experimental_context:
  species: human
  system: in_vitro_cell_line
  cell_types:
  - name: MRC-5 human fetal lung fibroblasts
    source: Sigma Aldrich 05081101
    isolation_method: 'Human fetal lung fibroblast cell line. Cultured in 6-well plates.

      '
  culture_conditions:
    medium: Standard culture medium
    duration: 24 hours treatment with IL-1beta
  indication: COPD
study_interpretation: 'CXCL8 shows a graded dose-response to IL-1beta that is still rising at 57 pM, unlike IL-6 which saturates
  by 5.7 pM. This provides complementary constraint on IL1_50: IL-6 sets the lower bound (EC50 << 5.7 pM), while CXCL8 shows
  the response is not yet saturated at 57 pM for all downstream genes, providing transition-region data.

  '
key_assumptions:
- CXCL8 and IL-6 share the same receptor-level EC50 (IL1_50)
- Different apparent gene sensitivity absorbed by separate max parameters
- 0.01 ng/mL CXCL8 value estimated visually (~109 fold, similar to IL-6 at 0.1 ng/mL)
key_study_limitations:
- 0.01 ng/mL data point is estimated, not digitized
- MRC-5 lung fibroblasts, not PDAC CAFs
- Only 2 digitized dots per condition for 0.1 and 1 ng/mL
- Broken y-axis complicates digitization accuracy
