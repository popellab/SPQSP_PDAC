target_id: k_nCD8_death
inputs:
- name: naive_cd8_turnover_percent_per_day
  value: 0.03
  units: percent
  input_type: direct_measurement
  source_ref: denBraber2012
  source_location: Results, 'Turnover of Naive T Cells in Mice' & Discussion p.293
  value_snippet: In humans, only about 0.03% of the naive CD8+ T cell pool is replaced
    each day.
- name: treg_dstar_percent_per_day
  value: 6.58
  units: percent
  input_type: direct_measurement
  source_ref: VukmanovicStejic2006
  source_location: Table 1
  table_excerpt:
    table_id: Table 1
    column: d* (%/day)
    row: CD4+CD45RO+CD25hi Tregs (all subjects)
    value: '6.58'
    context: Disappearance rate (d*) of circulating CD4+CD45RO+CD25hi regulatory T
      cells expressed as percent of the pool lost per day.
- name: percent_to_fraction
  value: 0.01
  units: dimensionless
  input_type: unit_conversion
  rationale: Convert percent values reported in the papers to fraction units used
    for death/turnover rates in the QSP model (1% = 0.01).
  source_ref: denBraber2012
  source_location: Methods (percentages reported throughout text and figures)
  value_snippet: Percentages were used to express fractions of the T cell pool (e.g.,
    0.03% of naive CD8+ T cells replaced per day).
- name: effective_n_subjects_naive_cd8
  value: 1.0
  units: dimensionless
  input_type: reference_value
  rationale: denBraber2012 reports a single group-level estimate for human naive CD8+
    T cell turnover (0.03%/day) without an explicit SD. We therefore treat this as
    one effective observation and let model-level translation uncertainty dominate.
  source_ref: denBraber2012
  source_location: Discussion p.293
  value_snippet: Group-level turnover estimates are reported for humans; we treat
    this as one effective measurement (n_effective = 1).
- name: effective_n_subjects_treg
  value: 1.0
  units: dimensionless
  input_type: reference_value
  rationale: VukmanovicStejic2006 Table 1 reports pooled Treg disappearance rates
    across subjects. For this submodel we treat the pooled value as a single effective
    observation and represent additional uncertainty via translation/model assumptions
    rather than sampling error.
  source_ref: VukmanovicStejic2006
  source_location: Table 1 legend
  value_snippet: Pooled Treg turnover parameters across subjects are treated as a
    single effective measurement (n_effective = 1).
calibration:
  parameters:
  - name: k_nCD8_death
    units: 1/day
    nuisance: false
  - name: k_Treg_death
    units: 1/day
    nuisance: false
  forward_model:
    data_rationale: denBraber2012 reports the fraction of the human naive CD8+ T cell
      pool replaced per day (~0.03%/day). Under homeostatic steady state, this renewal
      fraction equals the net death rate of naive CD8+ cells. VukmanovicStejic2006
      reports the disappearance rate d* (%/day; half-life ~11 days) of circulating
      CD4+CD45RO+CD25hiFoxp3+ Tregs; under approximate steady state this effective
      disappearance rate can be mapped to the systemic Treg death rate.
    submodel_rationale: In the full QSP model, k_nCD8_death and k_Treg_death govern
      first-order loss of naive CD8+ T cells and Tregs, respectively, from blood,
      peripheral tissues, lymph nodes, and tumor. At homeostasis, these first-order
      death rates balance corresponding sources (thymic output, proliferation, activation)
      so that fractional loss per day equals fractional renewal per day. Thus the
      experimentally inferred disappearance/turnover rates can be identified with
      the death rates used in the QSP model.
    type: algebraic
    formula: 'Observed disappearance/turnover rates equal the corresponding death
      rates in steady state: d_star_Treg = k_Treg_death, p_naive_CD8 = k_nCD8_death.'
    code: "def compute(params, inputs):\n    k_treg = params['k_Treg_death']\n   \
      \ k_ncd8 = params['k_nCD8_death']\n    return {\n        'treg_disappearance_rate':\
      \ k_treg,\n        'naive_cd8_turnover_rate': k_ncd8,\n    }"
  error_model:
  - name: treg_disappearance_rate_measurement
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['treg_disappearance_rate']"
    units: 1/day
    uses_inputs:
    - treg_dstar_percent_per_day
    - percent_to_fraction
    - effective_n_subjects_treg
    sample_size_input: effective_n_subjects_treg
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    d_percent = inputs['treg_dstar_percent_per_day']\n\
      \    conv = inputs['percent_to_fraction']\n    d_per_day = d_percent * conv\n\
      \    # Use a broad coefficient of variation (~100%) to represent uncertainty\
      \ in the pooled estimate\n    cv = 1.0\n    sigma_ln = np.sqrt(np.log(1 + cv**2))\n\
      \    mu_ln = np.log(d_per_day) - sigma_ln**2 / 2\n    return rng.lognormal(mu_ln,\
      \ sigma_ln / np.sqrt(sample_size), n_bootstrap)"
    n_bootstrap: 10000
  - name: naive_cd8_turnover_rate_measurement
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['naive_cd8_turnover_rate']"
    units: 1/day
    uses_inputs:
    - naive_cd8_turnover_percent_per_day
    - percent_to_fraction
    - effective_n_subjects_naive_cd8
    sample_size_input: effective_n_subjects_naive_cd8
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    p_percent = inputs['naive_cd8_turnover_percent_per_day']\n\
      \    conv = inputs['percent_to_fraction']\n    p_per_day = p_percent * conv\n\
      \    # Use a broad coefficient of variation (~100%) to represent uncertainty\
      \ in the group-level estimate\n    cv = 1.0\n    sigma_ln = np.sqrt(np.log(1\
      \ + cv**2))\n    mu_ln = np.log(p_per_day) - sigma_ln**2 / 2\n    return rng.lognormal(mu_ln,\
      \ sigma_ln / np.sqrt(sample_size), n_bootstrap)"
    n_bootstrap: 10000
  identifiability_notes: Both k_Treg_death and k_nCD8_death enter the forward model
    linearly and are directly equated to observed disappearance/turnover rates under
    a homeostatic steady-state assumption. Within this submodel, each parameter is
    individually identifiable from its corresponding measurement. Uncertainty is dominated
    by biological and modeling translation (e.g., disappearance from blood vs true
    death, health vs PDAC, CD4 vs CD8 Tregs), which we approximately capture via a
    broad coefficient of variation in the bootstrap distributions rather than precise
    experimental SDs.
experimental_context:
  species: human
  system: clinical_in_vivo
  cell_types:
  - name: naive CD8+ T cells
    phenotype: CD45RO- CD27+ naive CD8+ T cells in peripheral blood
    isolation_method: Phenotypic gating of peripheral blood mononuclear cells
    source: Adult human volunteers in denBraber2012
  - name: regulatory CD4+ T cells
    phenotype: CD4+ CD45RO+ CD25hi Foxp3+ circulating memory-phenotype Tregs
    isolation_method: Phenotypic gating of peripheral blood mononuclear cells
    source: Adult human volunteers in VukmanovicStejic2006
  indication: systemic T cell homeostasis in adults (used as proxy for PDAC patients)
study_interpretation: "Human deuterium-labeling and TREC-based turnover studies indicate\
  \ that naive CD8+ T cells in adults are replaced very slowly (~0.03% of the pool\
  \ per day), implying a naive CD8 death rate on the order of 3e-4 1/day under homeostatic\
  \ conditions. Similarly, circulating memory-phenotype CD4+CD45RO+CD25hiFoxp3+ Tregs\
  \ turn over much faster, with an effective disappearance rate d* ~6.6%/day (half-life\
  \ ~11 days). Mapping these disappearance/renewal rates to the first-order death\
  \ processes for naive CD8+ T cells and Tregs in the QSP model under a near\u2013\
  steady-state assumption provides human-based estimates for k_nCD8_death and k_Treg_death\
  \ that are consistent with systemic T cell homeostasis and within the same order\
  \ of magnitude as the existing priors."
key_assumptions:
- Human adults in denBraber2012 and VukmanovicStejic2006 are representative of systemic
  T cell homeostasis in PDAC patients for the purposes of naive CD8 and Treg turnover.
- "Naive CD8+ T cell pools in adult humans are close to homeostatic steady state,\
  \ so the fraction of the pool renewed per day equals the fraction lost per day (p\
  \ \u2248 d)."
- The disappearance rate d* of labeled circulating Tregs primarily reflects true loss
  (death or long-term egress from the systemic circulation) rather than rapid reversible
  redistribution, allowing it to be approximated as an effective death rate for systemic
  Tregs.
- Differences between CD4+ memory-phenotype Tregs studied in VukmanovicStejic2006
  and the broader Treg compartments in the QSP model (including tumor Tregs) mainly
  affect local proliferation and trafficking rather than the baseline systemic death
  rate.
- Percent-per-day values reported in the papers can be converted to fraction-per-day
  rates without additional bias, and measurement uncertainty is approximated via a
  broad coefficient of variation in the bootstrap, with additional biological translation
  uncertainty handled at the model level.
key_study_limitations:
- denBraber2012 reports group-level turnover estimates for human naive T cells without
  detailed subject-level variability for naive CD8+ cells, limiting direct quantification
  of experimental SD and requiring us to approximate a coefficient of variation for
  bootstrap sampling.
- Both studies are performed in generally healthy adults rather than PDAC patients;
  chronic inflammation, cancer, age, or prior therapies in PDAC could alter naive
  T cell and Treg turnover.
- The disappearance rate d* for Tregs measures loss from the labeled circulating pool,
  which conflates true cell death with migration to tissues or phenotype changes;
  interpreting this as a pure death rate likely overestimates true apoptosis rates.
- denBraber2012 defines naive T cells phenotypically (CD45RO- CD27+) and does not
  distinguish anatomic compartments; mapping this global turnover to the multi-compartment
  naive CD8 populations in the QSP model assumes similar kinetics across blood, lymph
  nodes, and peripheral tissues.
- Tumor-infiltrating Tregs in PDAC experience a very different microenvironment from
  circulating memory-phenotype Tregs; extrapolating systemic death rates to the tumor
  compartment ignores local survival signals and may underestimate intratumoral Treg
  persistence.
primary_data_source:
  doi: 10.1016/j.immuni.2012.02.006
  title: Maintenance of peripheral naive T cells is sustained by thymus output in
    mice but not humans
  year: 2012
  source_tag: denBraber2012
  source_relevance:
    indication_match: proxy
    indication_match_justification: denBraber2012 studies naive T cell homeostasis
      in generally healthy adult humans, whereas the QSP model targets PDAC patients.
      We use human naive CD8+ turnover as a mechanistic proxy for systemic naive CD8+
      dynamics in PDAC, assuming that baseline homeostatic death rates are similar
      even though disease, age, and therapy may modulate them.
    species_source: human
    species_target: human
    source_quality: primary_human_clinical
    perturbation_type: physiological_baseline
    perturbation_relevance: Subjects are not exposed to pharmacological or genetic
      perturbations; heavy water labeling is a tracer technique that minimally perturbs
      physiology, so inferred turnover reflects near-physiological baseline naive
      T cell kinetics.
    tme_compatibility: moderate
    tme_compatibility_notes: The measurements concern systemic naive T cells in blood
      and lymphoid tissues, not tumor-infiltrating cells within a desmoplastic PDAC
      microenvironment. Systemic naive T cell turnover is expected to be similar between
      healthy individuals and PDAC patients, but local tumor microenvironment effects
      on T cell survival and activation are not captured.
    measurement_directness: steady_state_inversion
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: clinical_in_vivo
secondary_data_sources:
- doi: 10.1172/JCI28941
  title: Human CD4+CD25hi Foxp3+ regulatory T cells are derived predominantly from
    naive CD4+ T cells in vivo
  year: 2006
  source_tag: VukmanovicStejic2006
  contribution: "Provides deuterium-labeling\u2013based proliferation (p) and disappearance\
    \ (d*) rates for circulating memory-phenotype CD4+CD45RO+CD25hiFoxp3+ Tregs in\
    \ adult humans, including a pooled disappearance rate d* \u2248 6.58%/day (half-life\
    \ ~11 days) used here to constrain k_Treg_death."
  source_relevance:
    indication_match: proxy
    indication_match_justification: The study examines systemic circulating human
      Tregs in healthy adults, not PDAC patients or tumor-infiltrating Tregs. We use
      these systemic turnover measurements as a mechanistic proxy for the baseline
      death rate of Tregs in the QSP PDAC model, recognizing that tumor-local factors
      will modify Treg dynamics.
    species_source: human
    species_target: human
    source_quality: primary_human_clinical
    perturbation_type: physiological_baseline
    perturbation_relevance: Deuterium labeling is a minimally perturbative tracer
      allowing inference of in vivo proliferation and disappearance rates under near-physiological
      conditions, making the measured d* appropriate as a baseline systemic Treg turnover
      estimate.
    tme_compatibility: moderate
    tme_compatibility_notes: Circulating memory-phenotype Tregs experience a different
      environment from PDAC tumor-infiltrating Tregs, which are exposed to strong
      immunosuppressive and survival cues. Thus, the systemic disappearance rate likely
      overestimates intratumoral death, and we interpret it primarily as the baseline
      systemic k_Treg_death shared across compartments.
    measurement_directness: steady_state_inversion
    temporal_resolution: timecourse
    experimental_system: clinical_in_vivo
