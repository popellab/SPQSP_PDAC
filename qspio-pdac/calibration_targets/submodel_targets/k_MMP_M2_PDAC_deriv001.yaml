calibration:
  parameters:
  - name: k_MMP_M2
    units: milliliter/(cell*day)
    nuisance: false
  - name: k_col_deg
    units: 1/day
    nuisance: false
  - name: f_M2_eff
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: -1.2
      sigma: 0.7
  forward_model:
    data_rationale: "Zhu2001 quantified collagen degradation over 21 days in 3D type\
      \ I collagen gels (0.75 mg/ml) containing human fetal lung fibroblasts with\
      \ or without added blood monocytes at fixed densities (4\xD710^5 cells/ml each).\
      \ Hydroxyproline content was expressed as percent of initial collagen. By day\
      \ 21 fibroblast-only gels had lost 10.1% of collagen, while fibroblast+monocyte\
      \ co-cultures had lost 30.9%. Interpreting these as outcomes of first-order\
      \ collagen degradation with and without a monocyte-dependent term allows direct\
      \ inference of baseline and monocyte-driven degradation rates at known cell\
      \ density."
    submodel_rationale: In the full QSPIO-PDAC model, collagen degradation in the
      tumor compartment follows first-order kinetics with a baseline rate k_col_deg
      plus an additional term proportional to M2 macrophage density, k_MMP_M2 * (Mac_M2
      / V_T). The Zhu2001 3D collagen gels approximate a local tumor ECM volume with
      well-mixed collagen and a known monocyte/macrophage density. Modeling collagen
      loss over 21 days as exp(-(k_col_deg + k_MMP_M2 * effective_M2_density)*t) preserves
      the exact mechanistic structure of the QSP reaction while introducing a nuisance
      parameter f_M2_eff to map total monocytes in culture onto effective M2-like
      matrix-degrading macrophages.
    type: algebraic
    formula: Fractions of collagen remaining at day 21 in fibroblast-only vs fibroblast+monocyte
      gels under first-order degradation with baseline rate k_col_deg plus an M2 macrophage-dependent
      term k_MMP_M2 * (f_M2_eff * monocyte_density).
    code: "def compute(params, inputs):\n    import numpy as np\n    k_base = params['k_col_deg']\n\
      \    k_m2 = params['k_MMP_M2']\n    f_m2 = params['f_M2_eff']\n    t = inputs['t_day21']\n\
      \    monocyte_density = inputs['monocyte_density_factor_4x10e5_per_ml']\
      \ * 1e5\n    # Work in log-space to avoid exp underflow at large k*t\n\
      \    log_frac_fib = -k_base * t\n    eff_m2_density = f_m2 * monocyte_density\n\
      \    log_frac_coc = -(k_base + k_m2 * eff_m2_density) * t\n    return {\n\
      \        'log_fib_frac_remain_d21': log_frac_fib,\n        'log_coculture_frac_remain_d21':\
      \ log_frac_coc,\n    }\n"
  error_model:
  - name: fibroblast_only_d21
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['log_fib_frac_remain_d21']\n"
    units: dimensionless
    uses_inputs:
    - frac_remain_fib_d21
    - u_hydroxyproline_fraction
    - n_replicates_d21
    sample_size_input: n_replicates_d21
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['frac_remain_fib_d21']\n    cv =\
      \ inputs['u_hydroxyproline_fraction']\n    # Forward model returns log(fraction),\
      \ so observation is on log scale.\n    # n=3 are technical triplicates — do not\
      \ divide by sqrt(n).\n    sigma_ln = np.sqrt(np.log(1.0 + cv * cv))\n\
      \    mu = np.log(mean)\n    return rng.normal(mu, sigma_ln, n_bootstrap)\n"
    n_bootstrap: 10000
  - name: coculture_fib_monocyte_d21
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['log_coculture_frac_remain_d21']\n"
    units: dimensionless
    uses_inputs:
    - frac_remain_coc_d21
    - u_hydroxyproline_fraction
    - n_replicates_d21
    sample_size_input: n_replicates_d21
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['frac_remain_coc_d21']\n    cv =\
      \ inputs['u_hydroxyproline_fraction']\n    sigma_ln = np.sqrt(np.log(1.0 + cv\
      \ * cv))\n    mu = np.log(mean)\n    return rng.normal(mu, sigma_ln, n_bootstrap)\n"
    n_bootstrap: 10000
  identifiability_notes: 'The fibroblast-only and fibroblast+monocyte endpoints at
    21 days provide two independent constraints on the first-order collagen degradation
    rate: one on the baseline rate k_col_deg and one on the sum k_col_deg + k_MMP_M2
    * f_M2_eff * monocyte_density. The data thus identify k_col_deg reasonably well
    and constrain only the product k_MMP_M2 * f_M2_eff (given the known monocyte density).
    There is an inherent correlation between k_MMP_M2 and the nuisance parameter f_M2_eff
    representing the fraction of culture monocytes that behave as effective M2-like
    collagenolytic macrophages. Priors on f_M2_eff (centered below 1) are therefore
    important to map the effective rate onto k_MMP_M2. Additional time points, direct
    measurement of M2 polarization fraction, or conditions with different monocyte
    densities would help break this degeneracy. The supplementary 4-day data with
    and without neutrophil elastase support the first-order assumption and suggest
    that higher protease activity can achieve near-complete degradation within 4 days,
    but these data are not explicitly fit here and instead serve as a qualitative
    cross-check on the inferred timescale of collagen loss.'
