    tissue_origin: fetal lung
    cell_type: fibroblast
    source: American Type Culture Collection (ATCC)
    passage_range: P14-P16
  cell_types:
  - name: blood monocyte
    phenotype: circulating monocyte / monocyte-macrophage precursor
    isolation_method: counter flow centrifugal elutriation from peripheral blood
    source: peripheral blood from healthy donors
  culture_conditions:
    substrate: 3D type I collagen gel (rat tail tendon collagen)
    serum_concentration: 0.0
    serum_concentration_units: percent
    oxygen_level: "normoxic (5% CO2, 37\xB0C incubator)"
    culture_type: 3d_collagen_gel
    medium: serum-free DMEM (after gel casting)
    duration: up to 21 days of floating gel culture, medium changed every 5 days
