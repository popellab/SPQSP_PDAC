      \ cells/ml of HFL-1 fibroblasts with or without 4\xD710^5 cells/ml blood monocytes."
  indication: lung injury / generic wound repair (used as proxy for PDAC desmoplastic
    matrix turnover)
study_interpretation: "Zhu2001 demonstrates that co-culture of human fetal lung fibroblasts\
  \ with blood monocytes in 3D type I collagen gels leads to substantially greater\
  \ collagen degradation over 21 days than fibroblasts alone (30.9% vs 10.1% loss\
  \ of initial collagen). Treating collagen loss as a first-order process driven by\
  \ a baseline degradation rate plus an additional term proportional to effective\
  \ M2-like macrophage density maps directly onto the QSPIO-PDAC collagen degradation\
  \ reaction, where k_col_deg represents baseline turnover and k_MMP_M2 captures M2\
  \ macrophage-mediated matrix remodeling. Using the known monocyte density (4\xD7\
  10^5 cells/ml) encoded via the monocyte_density_factor_4x10e5_per_ml input and the\
  \ differential degradation between fibroblast-only and co-culture conditions, this\
  \ submodel constrains k_col_deg and the product k_MMP_M2 * f_M2_eff such that, at\
  \ the culture cell density, the additional monocyte/M2-dependent term accounts for\
  \ roughly a threefold increase in the apparent first-order collagen loss rate compared\
  \ to fibroblasts alone. Supplementary 4-day data, particularly the near-complete\
  \ degradation in the presence of neutrophil elastase at high cell densities, support\
  \ the plausibility of a first-order description and indicate that under stronger\
  \ protease activation the effective rate can be an order of magnitude faster than\
  \ the baseline inferred from 21-day cultures."
key_assumptions:
- Collagen loss from the gels over 21 days can be approximated by first-order kinetics
  with a constant effective rate over time.
- All monocyte-derived cells contributing to collagen degradation in co-culture can
  be represented as an effective M2-like macrophage population whose density is f_M2_eff
  times the total monocyte density at seeding.
- Fibroblast-driven collagen degradation in this system corresponds to the baseline
  QSP parameter k_col_deg and is independent of monocyte/macrophage density.
- "The 3D lung fibroblast\u2013monocyte gel system is a reasonable biophysical proxy\
  \ for local collagen turnover in the PDAC desmoplastic stroma, after accounting\
  \ for substantial translation uncertainty."
- Using a fixed fractional uncertainty (10%) for collagen fraction measurements reasonably
  reflects assay and biological variability in the absence of explicit SD/SEM at day
  21.
- Monocyte and fibroblast densities remain approximately constant over the 21-day
  period with respect to their contribution to collagen degradation (net effects of
  proliferation and death are not modeled explicitly).
key_study_limitations:
- System uses fetal lung fibroblasts and peripheral blood monocytes rather than pancreatic
  stellate cells and intratumoral PDAC macrophages.
- Monocytes likely differentiate toward macrophages over time, but the exact fraction
  adopting an M2-like, collagenolytic phenotype is unknown and must be represented
  by a nuisance parameter.
- Collagen degradation reflects combined activity of fibroblast and myeloid proteases
  and may also be influenced by neutrophil elastase activation of matrix metalloproteases;
  specific MR/M2-dependent endocytic degradation cannot be separated experimentally
  in this study.
- "Only a single monocyte density (4\xD710^5 cells/ml) is used in the main 21-day\
  \ time course, limiting the ability to independently identify the monocyte-dependent\
  \ rate constant and effective M2 fraction."
- Day-21 hydroxyproline data are reported without explicit SD or SEM values at that
  time point, requiring an assumed coefficient of variation for uncertainty modeling.
- 3D in vitro gels lack many features of the PDAC tumor microenvironment, including
  cancer cells, heterogeneous CAF populations, vascular perfusion, and complex immune-stromal
  feedbacks, so inferred rates may not directly reflect in vivo values.
primary_data_source:
  pmid: '11686840'
  title: Fibroblasts and monocyte macrophages contract and degrade three-dimensional
    collagen gels in extended co-culture
  authors:
  - Yunkui Zhu
  - C Magnus Skold
  - Xiangde Liu
  - Hangjun Wang
  - Tadashi Kohyama
  - Fu-Qiang Wen
  - Ronald F Ertl
  - Stephen I Rennard
  year: 2001
  source_tag: Zhu2001
  source_relevance:
    indication_match: proxy
    indication_match_justification: The study uses human fetal lung fibroblasts and
      peripheral blood monocytes in 3D collagen gels to model generic tissue repair
      and remodeling, whereas the QSPIO-PDAC model focuses on pancreatic ductal adenocarcinoma
      stroma. Both contexts involve fibroblast/myofibroblast-driven collagen deposition
      and myeloid cell-mediated matrix remodeling, but the tissue of origin, stromal
      cell types, and inflammatory milieu differ substantially. The lung 3D gel system
      is therefore treated as a mechanistic proxy for desmoplastic matrix turnover
      in PDAC rather than a disease-matched system.
    species_source: human
    species_target: human
    source_quality: primary_human_in_vitro
    perturbation_type: physiological_baseline
    perturbation_relevance: Cultures were maintained under serum-free conditions without
      pharmacological inhibitors or genetic perturbations (aside from occasional neutrophil
      elastase or cytokine additions in specific experiments), so the measured collagen
      degradation primarily reflects endogenous fibroblast and monocyte/macrophage
      protease activity. This is interpreted as an approximate physiological upper-bound
      rate for matrix remodeling in a simplified inflammatory environment.
    tme_compatibility: low
    tme_compatibility_notes: The 3D collagen gel system lacks tumor cells, pancreatic
      stellate cells, complex CAF subtypes, vasculature, and the highly fibrotic,
      hypovascular microenvironment characteristic of PDAC. In vivo PDAC stroma is
      more densely cross-linked and experiences different cytokine and mechanical
      cues. As a result, monocyte/macrophage-driven collagen degradation rates in
      these gels may overestimate effective rates in PDAC tumors by an order of magnitude
      or more, and substantial translation uncertainty must be accounted for.
    measurement_directness: single_inversion
    temporal_resolution: endpoint_pair
    experimental_system: in_vitro_primary
