calibration:
  parameters:
  - name: k_CD8_T_pro
    units: 1/day
    nuisance: false
  - name: tau_Ki67_CD8
    units: day
    nuisance: true
    prior:
      distribution: lognormal
      mu: 0.0
      sigma: 0.5
  forward_model:
    data_rationale: Blessin2021_Prognostic reports the percentage of Ki67+CD8+ cells
      among all intratumoral CD8+ T cells in a large cohort of resected pancreatic
      cancers (n=451). Ki67 is a canonical proliferation marker expressed throughout
      G1, S, G2, and M phases, so the Ki67 labeling index directly reflects the fraction
      of CD8+ T cells in cycling phases at a given time.
    submodel_rationale: "In the full QSPIO-PDAC model, k_CD8_T_pro is the tumor-local
      CD8 proliferation rate. The Ki67 labelling index from a single cross-sectional
      snapshot of resected tumour cannot separately identify proliferation from death
      hazards (one observable, two rates), so this target follows the derivation-review
      Option-1 recommendation: interpret k_CD8_T_pro as the effective per-cell division
      rate in tumour and use the dimensionally-consistent steady-state mapping f_Ki67
      = 1 - exp(-k_CD8_T_pro * tau_Ki67_CD8). This is the small-tau approximation of
      a renewal process in which division events occur at hazard k_CD8_T_pro and
      Ki67 remains detectable for a mean duration tau_Ki67_CD8: for tau short on the
      timescale of pool turnover, the probability a randomly sampled cell is currently
      in the Ki67+ window equals 1-exp(-k_CD8_T_pro*tau_Ki67_CD8). For small k*tau,
      this reduces to f_Ki67 ≈ k_CD8_T_pro * tau_Ki67_CD8, matching the
      simpler index approximation. k_CD8_death is intentionally NOT a parameter of
      this target — it is constrained independently by k_CD8_death_PDAC_deriv001."
    type: algebraic
    formula: f_Ki67 = 1 - exp(-k_CD8_T_pro * tau_Ki67_CD8)
    code: "def compute(params, inputs):\n    import numpy as np\n    k_pro = params['k_CD8_T_pro']\n\
      \    tau = params['tau_Ki67_CD8']\n    # Predicted Ki67+ fraction at steady state under a renewal-process\n\
      \    # approximation; dimensionally consistent (k * tau is dimensionless).\n\
      \    return 1.0 - np.exp(-k_pro * tau)\n"
  error_model:
  - name: cd8_ki67_fraction_pancreas
    units: dimensionless
    uses_inputs:
    - cd8_ki67_fraction_pancreas_mean_percent
    - cd8_ki67_fraction_pancreas_sd_percent
    - n_pancreatic_cancer_cases
    - percent_to_fraction_factor
    sample_size_input: n_pancreatic_cancer_cases
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean_pct = inputs['cd8_ki67_fraction_pancreas_mean_percent']\n\
      \    sd_pct = inputs['cd8_ki67_fraction_pancreas_sd_percent']\n    factor =\
      \ inputs['percent_to_fraction_factor']\n    # Convert percent values from the\
      \ paper to fractions (0-1)\n    mean = mean_pct * factor\n    sd = sd_pct *\
      \ factor\n    # Lognormal bootstrap for positive fractions\n    cv = sd / mean\n\
      \    sigma_ln = np.sqrt(np.log(1.0 + cv**2))\n    mu_ln = np.log(mean) - sigma_ln**2\
      \ / 2.0\n    # sample_size is the number of tumors contributing to the mean\
      \ (n=451)\n    return rng.lognormal(mu_ln, sigma_ln / np.sqrt(sample_size),\
      \ n_bootstrap)\n"
    n_bootstrap: 10000
  identifiability_notes: "This target constrains the steady-state Ki67 fraction among
    intratumoral CD8+ T cells in untreated human pancreatic cancers via the dimensionally-consistent
    renewal-process mapping f_Ki67 = 1 - exp(-k_CD8_T_pro * tau_Ki67_CD8). Only the
    product k_CD8_T_pro * tau_Ki67_CD8 is directly identifiable from this single snapshot
    — k_CD8_T_pro is partially correlated with the nuisance tau_Ki67_CD8 (mean Ki67-visible
    duration). The lognormal(mu=0, sigma=0.5) prior on tau_Ki67_CD8 centred at 1 day
    (consistent with typical activated-T-cell G1-S-G2-M transit) is what allows k_CD8_T_pro
    to be inferred to within roughly the same fold-uncertainty as tau. k_CD8_death
    is deliberately not a parameter of this target (per derivation review) — it is
    constrained independently by k_CD8_death_PDAC_deriv001 and would otherwise create
    structural over-parameterisation against a single observable. Additional dynamic
    data (BrdU/EdU pulse-chase, longitudinal CD8 density tracking) would tighten the
    k_CD8_T_pro estimate further."
experimental_context:
  species: human
  system: clinical_in_vivo
  indication: PDAC
study_interpretation: "In a large tissue microarray of resected pancreatic cancers,
  approximately 12% of intratumoral CD8+ T cells were Ki67 positive on average, with
  substantial inter-tumor variability (SD 13.8%). Interpreted through the steady-state
  renewal-process mapping f_Ki67 = 1 - exp(-k_CD8_T_pro * tau_Ki67_CD8) with a Ki67-visible
  window of approximately one day, this implies a tumour-local CD8 proliferation rate
  on the order of 0.1 1/day. k_CD8_death is constrained separately by
  k_CD8_death_PDAC_deriv001 and is not a parameter of this target."
key_assumptions:
- The pancreatic cancer cohort in Blessin2021_Prognostic is dominated by conventional
  PDAC and is representative of the PDAC tumor microenvironment modeled in QSPIO-PDAC.
- Tumor samples were taken from the tumor center and reflect steady-state CD8 dynamics
  at the time of resection, so the Ki67 labeling index approximates a time-averaged
  proliferation fraction.
- Ki67 expression in human intratumoral CD8 T cells is visible for approximately one
  day (tau_Ki67_CD8 ~ 1 day), consistent with typical G1-S-G2-M transit times in activated
  T cells.
- The Ki67+ fraction measured in CD8+ T cells corresponds predominantly to the effector
  population represented by V_T.CD8 in the QSP model, with negligible contamination
  from non-effector or bystander CD8 subsets that would have very different kinetics.
- Inter-patient variability in Ki67+ fractions largely reflects biological variability
  rather than major technical differences in staining or image analysis, and the reported
  SD can be used to approximate population variability.
key_study_limitations:
- The pancreatic cohort aggregates all pancreatic cancers in the TMA and likely includes
  a small fraction of non-PDAC histologies, which may slightly broaden the apparent
  variability of CD8 proliferation indices.
- Measurements were made on single 0.6-mm cores from the tumor center and may not
  fully capture spatial heterogeneity of CD8 proliferation within individual PDAC
  tumors.
- Only a single timepoint per patient is available, so proliferation and death rates
  cannot be independently determined; the Ki67 index constrains only their steady-state
  balance.
- No systemic treatment status stratification is provided; while most cases are likely
  treatment-naive at resection, prior therapies in a subset of patients could modestly
  alter intratumoral CD8 proliferation.
- Ki67 detects all cycling cells but does not distinguish tumor antigen-specific from
  bystander CD8 T cells, so the inferred proliferation rate may mix both populations.
