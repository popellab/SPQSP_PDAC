calibration:
  parameters:
  - name: N_IL2_CD8
    units: dimensionless
  forward_model:
    type: algebraic
    formula: 'fold_increase = 2^N_IL2_CD8

      '
    code: "def compute(params, inputs):\n    \"\"\"\n    Predict fold-increase in CD8+ T cell numbers due to IL-2-driven\n\
      \    extra divisions.\n\n    fold = 2^N_IL2_CD8\n\n    The model predicts a single fold value; the observation_code\n\
      \    computes the empirical fold ratio from IL2-IC / control at each\n    time point.\n    \"\"\"\n    import numpy\
      \ as np\n    N = params['N_IL2_CD8']\n    return 2.0 ** N\n"
    data_rationale: 'Castro et al. report 40-fold (day 10) and 70-fold (day 30) increases

      in OT-I memory cell numbers with IL2-IC vs control. Digitized Figure

      2A data confirms: day 10 ratio = 39.7x, day 30 ratio = 70.2x. The

      fold-increase at post-contraction time points reflects the additional

      divisions driven by IL-2R signaling during priming.

      '
    submodel_rationale: 'In the QSP model, N_IL2_CD8 represents the number of additional

      CD8+ T cell divisions driven by IL-2 signaling. The total expansion

      from IL-2-driven divisions is 2^N_IL2_CD8. By comparing IL-2-

      enhanced vs control conditions, the fold ratio directly isolates the

      IL-2 contribution without needing to know the baseline division count.

      '
  error_model:
  - name: fold_day10
    units: dimensionless
    uses_inputs:
    - oti_il2ic_day10
    - oti_il2ic_day10_se
    - oti_ctrl_day10
    - oti_ctrl_day10_se
    sample_size_input: oti_ctrl_day10
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    \"\"\"\n    Bootstrap fold-ratio\
      \ at day 10 from IL2-IC and control means + SEs.\n    Both conditions have independent uncertainty; propagate via sampling.\n\
      \    \"\"\"\n    import numpy as np\n\n    il2_mean = inputs['oti_il2ic_day10']\n    il2_se = inputs['oti_il2ic_day10_se']\n\
      \    ctrl_mean = inputs['oti_ctrl_day10']\n    ctrl_se = inputs['oti_ctrl_day10_se']\n\n    # Sample from each condition\
      \ (lognormal, positive counts)\n    il2_cv = il2_se / il2_mean\n    ctrl_cv = ctrl_se / ctrl_mean\n\n    il2_samples\
      \ = rng.lognormal(np.log(il2_mean), il2_cv, n_bootstrap)\n    ctrl_samples = rng.lognormal(np.log(ctrl_mean), ctrl_cv,\
      \ n_bootstrap)\n\n    # Fold ratio\n    return il2_samples / ctrl_samples\n"
  - name: fold_day30
    units: dimensionless
    uses_inputs:
    - oti_il2ic_day30
    - oti_il2ic_day30_se
    - oti_ctrl_day30
    - oti_ctrl_day30_se
    sample_size_input: oti_ctrl_day30
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    \"\"\"\n    Bootstrap fold-ratio\
      \ at day 30.\n    \"\"\"\n    import numpy as np\n\n    il2_mean = inputs['oti_il2ic_day30']\n    il2_se = inputs['oti_il2ic_day30_se']\n\
      \    ctrl_mean = inputs['oti_ctrl_day30']\n    ctrl_se = inputs['oti_ctrl_day30_se']\n\n    il2_cv = il2_se / il2_mean\n\
      \    ctrl_cv = ctrl_se / ctrl_mean\n\n    il2_samples = rng.lognormal(np.log(il2_mean), il2_cv, n_bootstrap)\n    ctrl_samples\
      \ = rng.lognormal(np.log(ctrl_mean), ctrl_cv, n_bootstrap)\n\n    return il2_samples / ctrl_samples\n"
  identifiability_notes: 'N_IL2_CD8 is well-constrained by two independent fold-ratio

    measurements (day 10: ~40x, day 30: ~70x). The day 10 ratio

    implies N_IL2_CD8 ~ 5.3, day 30 implies ~ 6.1. The slight

    increase from day 10 to 30 may reflect continued slow expansion

    of IL-2-programmed memory cells or differential survival. The

    forward model predicts a single fold value; the two observations

    provide a consistency check and may pull N_IL2_CD8 toward ~5.5-6.'
