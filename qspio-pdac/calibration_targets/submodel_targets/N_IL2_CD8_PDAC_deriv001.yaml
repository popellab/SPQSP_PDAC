extraction_model: claude-opus-4-6
study_interpretation: 'Castro et al. (2012) showed that transient enhanced IL-2R signaling via

  IL-2/anti-IL-2 complexes (IL2-IC) during OVA/LPS priming of OT-I CD8+

  T cells resulted in 40- to 70-fold increased absolute numbers of OT-I

  memory cells at days 10 and 30 post-priming compared to OVA/LPS alone.

  Figure 2A shows the full time course of OT-I cell numbers in spleen for

  both conditions. The fold-increase at post-contraction time points (day

  10 and 30) reflects the additional IL-2-driven divisions during priming,

  directly constraining N_IL2_CD8 via fold = 2^N_IL2_CD8.

  '
key_assumptions:
- 'The fold-increase in OT-I memory cells (IL2-IC / control) at post-

  contraction time points (day 10, 30) reflects the number of additional

  cell divisions driven by enhanced IL-2R signaling during priming.

  Survival differences between conditions are secondary to division

  differences and are absorbed into the effective N_IL2_CD8.

  '
- 'The division destiny formalism applies: fold_increase = 2^N_IL2_CD8,

  where N_IL2_CD8 is the number of extra divisions attributable to IL-2.

  '
- 'Post-contraction (day 10-30) fold ratios are more stable and reliable

  than peak expansion ratios (day 4-5), which are confounded by

  differences in contraction timing between conditions.

  '
- 'Murine OT-I CD8+ T cells have similar IL-2-driven division potential

  to human tumor-reactive CD8+ T cells, with cross-species differences

  captured by translation uncertainty.

  '
key_study_limitations:
- 'IL-2/anti-IL-2 complexes (Jes-6.1A12) provide pharmacologically

  sustained high-affinity IL-2R signaling that may exceed endogenous

  IL-2 exposure during natural anti-tumor responses. N_IL2_CD8 from

  this experiment represents the maximal IL-2-driven division capacity.

  '
- 'In vivo experiment with multiple confounds: IL2-IC may affect survival,

  trafficking, and differentiation in addition to division. The 2^N

  model attributes all expansion to extra divisions.

  '
- 'OT-I monoclonal T cells with high precursor frequency and strong

  model antigen. Polyclonal anti-tumor responses have lower precursor

  frequencies and may respond differently to IL-2.

  '
- 'Error bars are mean +/- SE (not SD), from unpaired Student''s t-test.

  SE values are used directly in the bootstrap.

  '
