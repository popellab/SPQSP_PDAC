calibration:
  parameters:
  - name: k_iCAF_prolif
    units: 1/day
  - name: k_myCAF_prolif
    units: 1/day
  - name: k_qPSC_prolif
    units: 1/day
    nuisance: true
    prior:
      distribution: lognormal
      mu: -2.3
      sigma: 1.0
  - name: K_well
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 14.5
      sigma: 1.0
  - name: n_logistic
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 1.1
      sigma: 0.5
  forward_model:
    type: algebraic
    formula: 'Richards logistic: x(t) = K / (1 + ((K/x0)^n - 1) * exp(-k*n*(t-t0)))^(1/n)

      Three independent subtypes evaluated at days 2-5 (t0=1).

      '
    data_rationale: 'CellTiter-Glo proliferation time courses over 5 days for three distinct

      CAF phenotypes cultured in isolation. Each population grows independently

      under its own conditions with no interconversion between states. The

      logistic saturation visible in the myCAF curve at day 5 constrains the

      well carrying capacity. Analytical Richards logistic solution replaces ODE.

      '
    submodel_rationale: 'In the full QSP model, k_iCAF_prolif and k_myCAF_prolif are the maximal

      proliferation rate constants for each CAF subtype, gated by a shared

      logistic carrying capacity (f_stroma_max * C_total + K_stiff_niche *

      H_stiff_fib). In vitro, these gating terms are absent — proliferation is

      limited only by the physical well capacity. The measured in vitro rates

      thus represent upper bounds on the maximal rate constants. The ratio

      k_myCAF_prolif / k_iCAF_prolif (~2:1) is the primary constraint, as it

      determines steady-state CAF subtype composition independently of in vivo

      carrying capacity.

      '
    code: "def compute(params, inputs):\n    k_q = params['k_qPSC_prolif']\n    k_i = params['k_iCAF_prolif']\n    k_m = params['k_myCAF_prolif']\n\
      \    K = params['K_well']\n    n = params['n_logistic']\n    q0 = inputs['qPSC_day1_mean']\n    i0 = inputs['iCAF_day1_mean']\n\
      \    m0 = inputs['myCAF_day1_mean']\n\n    def richards(x0, k, t):\n        # x(t) = K / (1 + ((K/x0)^n - 1) * exp(-k*n*t))^(1/n)\n\
      \        ratio = (K / x0) ** n\n        return K / (1 + (ratio - 1) * np.exp(-k * n * t)) ** (1 / n)\n\n    # t is days\
      \ since day 1 (t0=1)\n    result = {}\n    for dt, day in [(1, 2), (2, 3), (3, 4), (4, 5)]:\n        result[f'q_{day}']\
      \ = richards(q0, k_q, dt)\n        result[f'i_{day}'] = richards(i0, k_i, dt)\n        result[f'm_{day}'] = richards(m0,\
      \ k_m, dt)\n    return result\n"
  error_model:
  - name: qPSC_day2
    units: dimensionless
    uses_inputs:
    - qPSC_day2_mean
    - qPSC_day2_sd
    - n_tech_replicates
    sample_size_input: n_tech_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['qPSC_day2_mean']\n    sd = inputs['qPSC_day2_sd']\n    return rng.lognormal(np.log(mean), sd / mean / np.sqrt(sample_size),\
      \ n_bootstrap)\n"
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['q_2']\n"
  - name: qPSC_day3
    units: dimensionless
    uses_inputs:
    - qPSC_day3_mean
    - qPSC_day3_sd
    - n_tech_replicates
    sample_size_input: n_tech_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['qPSC_day3_mean']\n    sd = inputs['qPSC_day3_sd']\n    return rng.lognormal(np.log(mean), sd / mean / np.sqrt(sample_size),\
      \ n_bootstrap)\n"
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['q_3']\n"
  - name: qPSC_day4
    units: dimensionless
    uses_inputs:
    - qPSC_day4_mean
    - qPSC_day4_sd
    - n_tech_replicates
    sample_size_input: n_tech_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['qPSC_day4_mean']\n    sd = inputs['qPSC_day4_sd']\n    return rng.lognormal(np.log(mean), sd / mean / np.sqrt(sample_size),\
      \ n_bootstrap)\n"
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['q_4']\n"
  - name: qPSC_day5
    units: dimensionless
    uses_inputs:
    - qPSC_day5_mean
    - qPSC_day5_sd
    - n_tech_replicates
    sample_size_input: n_tech_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['qPSC_day5_mean']\n    sd = inputs['qPSC_day5_sd']\n    return rng.lognormal(np.log(mean), sd / mean / np.sqrt(sample_size),\
