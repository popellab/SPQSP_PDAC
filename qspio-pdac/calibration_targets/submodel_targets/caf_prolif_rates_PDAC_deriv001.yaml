target_id: caf_prolif_rates_biffi2019
tags:
- ai-generated
- fibroblast-module
extraction_model: claude-opus-4-6
study_interpretation: 'Biffi et al. (2019) measured proliferation of mouse pancreatic stellate cells

  (PSCs) cultured under three conditions that enforce distinct CAF phenotypes:

  quiescent PSCs (Matrigel + control media), iCAFs (Matrigel + transwell with

  tumor organoids), and myCAFs (monolayer on plastic). Proliferation was tracked

  by CellTiter-Glo luminescence every 24 hours for 5 days (n=5 technical

  replicates per condition), starting from 6,000 cells seeded in 52 uL Matrigel

  (3D conditions) or on plastic (monolayer).


  myCAFs showed the fastest growth (~17x over 5 days, doubling time ~1.0 day),

  iCAFs grew moderately (~4x, doubling time ~2.0 days), and quiescent PSCs

  barely proliferated (~1.4x, doubling time ~7.5 days). The myCAF curve shows

  clear logistic saturation at day 5 (growth rate drops from ~0.9 to ~0.3/day),

  while iCAF and qPSC curves remain approximately exponential.


  These in vitro proliferation rates are expected to be upper bounds for in vivo

  rates due to optimal media, absence of immune suppression, and lack of spatial

  constraints. However, the RATIO of myCAF:iCAF proliferation (~2:1) is the key

  constraint for the QSP model, as it determines the steady-state CAF subtype

  composition independently of the carrying capacity.

  '
key_assumptions:
- 'Each culture condition maintains cells in a single phenotypic state (no

  interconversion). qPSCs in Matrigel + control media remain quiescent; iCAFs

  in transwell with organoids maintain the inflammatory phenotype via IL-1

  signaling; myCAFs in monolayer maintain the myofibroblastic phenotype. This

  is validated by the gene expression data in Ohlund 2017 and Biffi 2019.

  '
- 'CellTiter-Glo luminescence is proportional to cell number within each

  phenotype (constant ATP per cell). The proportionality constant may differ

  between phenotypes (different metabolic states), which is why the day 1

  values differ despite identical seeding density.

  '
- 'Growth is logistic with a shared physical carrying capacity K_well

  determined by the culture vessel, not by cancer cell signals. In the QSP

  model, carrying capacity depends on f_stroma_max * C_total, so K_well is

  a nuisance parameter.

  '
- 'The quiescent PSC proliferation rate (k_qPSC_prolif) is a nuisance

  parameter with no QSP model equivalent, since qPSCs in the model are

  recruited via encounter rather than proliferating.

  '
key_study_limitations:
- 'Technical replicates only (n=5 wells), not biological replicates.

  Well-to-well variation underestimates true biological variability of

  PSC proliferation rates across different PSC isolates.

  '
- 'Mouse PSCs, not human. Proliferation kinetics may differ between species,

  though the qualitative ordering (myCAF > iCAF >> qPSC) is expected to

  be conserved.

  '
- 'In vitro 2D (myCAF) vs 3D Matrigel (iCAF, qPSC) culture conditions

  differ in dimensionality. 2D monolayer may artificially enhance myCAF

  proliferation through substrate stiffness signaling.

  '
- 'CellTiter-Glo measures metabolic activity (ATP), not direct cell counts.

  Changes in per-cell metabolism during culture could bias apparent growth

  rates, though this effect is generally small over 5 days.

  '
experimental_context:
  species: mouse
  system: in_vitro_primary_cells
  cell_types:
  - name: quiescent PSCs
    source: mouse pancreas (KPC model)
    isolation_method: 'Previously described in Ohlund et al. 2017. PSCs embedded in Matrigel

      and cultured in DMEM with 5% FBS (control media).

      '
  - name: iCAFs
    source: mouse pancreas (KPC model)
    isolation_method: 'PSCs embedded in Matrigel and cultured in transwell with PDAC tumor

      organoids derived from KPC mice. Organoid-conditioned media provides

      IL-1alpha which drives the iCAF phenotype via JAK/STAT signaling.

      '
  - name: myCAFs
    source: mouse pancreas (KPC model)
    isolation_method: 'PSCs cultured in monolayer on plastic in DMEM with 5% FBS. Plastic

      substrate and lack of tumor organoid signals drives the myofibroblastic

      phenotype.

      '
  culture_conditions:
    medium: DMEM with 5% FBS
    duration: 5 days, measurements every 24 hours. 6,000 PSCs per well in 52 uL Matrigel (3D) or on plastic (2D), white 96-well
      plates (136101, Corning), readout by CellTiter-Glo (G7573, Promega).
  indication: PDAC
primary_data_source:
  doi: 10.1158/2159-8290.CD-18-0710
  title: 'IL-1-induced JAK/STAT signaling is antagonized by TGF-beta to shape CAF

    heterogeneity in pancreatic ductal adenocarcinoma

    '
  authors:
  - Biffi
  - Oni
  - Spielman
  - Hao
  - Elyada
  - Park
  - Preall
  - Tuveson
  year: 2019
  source_tag: Biffi2019
  source_relevance:
    indication_match: exact
    indication_match_justification: 'Mouse pancreatic stellate cells derived from KPC PDAC tumors, the standard

      genetically engineered mouse model for PDAC. Culture conditions that produce

      iCAF and myCAF phenotypes were validated by gene expression profiling

      against in vivo single-cell RNA-seq data from KPC tumors (Ohlund 2017,

      Biffi 2019). This is the closest possible in vitro model for PDAC CAF

      biology.

      '
    species_source: mouse
    species_target: human
    source_quality: primary_animal_in_vitro
    perturbation_type: physiological_baseline
    perturbation_relevance: 'Cells measured under standard culture conditions that enforce distinct

      phenotypes. No pharmacological perturbation — the three conditions

      (quiescent, iCAF, myCAF) represent the natural phenotypic states of

      pancreatic stellate cells in response to their microenvironment.

      '
    tme_compatibility: moderate
    tme_compatibility_notes: 'In vitro culture provides the correct phenotypic state (validated by

      transcriptomics) but lacks the 3D ECM, immune cell interactions, and

      spatial constraints of the PDAC TME. Proliferation rates in vitro are

      expected to be upper bounds for in vivo rates. The myCAF:iCAF proliferation

      ratio is the most translatable quantity.

      '
    measurement_directness: single_inversion
    temporal_resolution: timecourse
    experimental_system: in_vitro_primary
secondary_data_sources: []
