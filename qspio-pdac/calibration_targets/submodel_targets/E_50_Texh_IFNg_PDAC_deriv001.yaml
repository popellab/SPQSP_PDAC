calibration:
  parameters:
  - name: E_50_Texh
    units: dimensionless
  - name: n_Texh
    units: dimensionless
  - name: IFNg_max
    units: picogram/milliliter
    nuisance: true
    prior:
      distribution: lognormal
      mu: 8.29
      sigma: 0.7
  forward_model:
    type: direct_fit
    curve: hill
    ec50: E_50_Texh
    n_hill: n_Texh
    baseline: '0.0'
    maximum: IFNg_max
    data_rationale: 'IFNgamma production by TCR-stimulated CD4+ T cells increases with substrate stiffness in a graded dose-response
      across 0.5-100 kPa. This constrains the half-maximal stiffness (EC50) and Hill coefficient of the T cell mechanosensing
      response, which maps to H_stiff_Texh in the QSP model.

      '
    submodel_rationale: 'The QSP model uses H_stiff_Texh = stiffness^n / (E_50_Texh^n + stiffness^n) to gate stiffness-mediated
      T cell exhaustion. The model stiffness is dimensionless but kPa-scaled (E_ref ~ 1.0 kPa), so the experimental kPa values
      map directly to the model units. The mechanosensor EC50 is the same regardless of whether the downstream effect is acute
      activation (this experiment) or chronic exhaustion (the model), because the mechanotransduction apparatus (TCR/integrin)
      is shared.

      '
  error_model:
  - name: IFNg_at_0p5_kPa
    units: picogram/milliliter
    x_input: stiffness_0p5_kPa
    uses_inputs:
    - IFNg_mean_0p5
    - IFNg_sd_0p5
    - n_donors_0p5
    sample_size_input: n_donors_0p5
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['IFNg_mean_0p5']\n    sd = inputs['IFNg_sd_0p5']\n    return rng.normal(mean, sd / np.sqrt(sample_size), n_bootstrap)\n"
  - name: IFNg_at_6p4_kPa
    units: picogram/milliliter
    x_input: stiffness_6p4_kPa
    uses_inputs:
    - IFNg_mean_6p4
    - IFNg_sd_6p4
    - n_donors_6p4
    sample_size_input: n_donors_6p4
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['IFNg_mean_6p4']\n    sd = inputs['IFNg_sd_6p4']\n    return rng.normal(mean, sd / np.sqrt(sample_size), n_bootstrap)\n"
  - name: IFNg_at_100_kPa
    units: picogram/milliliter
    x_input: stiffness_100_kPa
    uses_inputs:
    - IFNg_mean_100
    - IFNg_sd_100
    - n_donors_100
    sample_size_input: n_donors_100
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['IFNg_mean_100']\n    sd = inputs['IFNg_sd_100']\n    return rng.normal(mean, sd / np.sqrt(sample_size), n_bootstrap)\n"
  identifiability_notes: 'E_50_Texh and n_Texh are jointly constrained by 3 stiffness conditions spanning a 200-fold range
    (0.5-100 kPa). With n=1 (standard Hill), EC50 is well-identified. With free n, EC50 and n are correlated but the wide
    dynamic range helps separate them. IFNg_max (nuisance) absorbs the absolute cytokine scale. The TNFalpha target (E_50_Texh_TNFa_saitakis2017)
    provides a second independent observable sharing E_50_Texh and n_Texh for additional constraint.

    '
experimental_context:
  species: human
  system: in_vitro_primary_cells
  cell_types:
  - name: CD4+ T lymphoblasts
    source: human peripheral blood
    isolation_method: 'CD4+ isolation kit (Miltenyi), expanded as lymphoblastoid effector T cells

      with aCD3/aCD28 + IL-2 (20 U/mL) for 6 days on plastic.

      '
  culture_conditions:
    medium: RPMI with 10% FCS, IL-2 (20 U/mL)
    duration: 24 hour culture on PA-gels
study_interpretation: 'Substrate stiffness potentiates TCR-induced IFNgamma production by human CD4+ T cells in a graded manner
  across 0.5-100 kPa. The response is sub-linear (most gain from 0.5 to 6.4 kPa, with continued increase to 100 kPa) and requires
  direct TCR engagement with the stiff substrate. This constrains the half-maximal stiffness for T cell mechanosensing, applicable
  to both activation and exhaustion Hill functions in the QSP model.

  '
key_assumptions:
- Mechanosensing EC50 is the same for acute activation and chronic exhaustion
- Model dimensionless stiffness maps approximately to kPa (E_ref ~ 1.0)
- CD4 T cell mechanosensing EC50 is similar to CD8 T cell EC50
- Donor-to-donor variability in IFNgamma reflects true biological variability in mechanosensing threshold
key_study_limitations:
- Only 3 stiffness values tested (sparse for 2-parameter Hill fit)
- CD4 T lymphoblasts, not CD8 TILs (the primary exhaustion-susceptible population in the model)
- Acute 24h activation readout, not chronic exhaustion phenotype
- In vitro PA-gel substrate, not 3D ECM environment
- High donor variability (CV 0.6-0.9) limits precision of mean estimates
primary_data_source:
  doi: 10.7554/eLife.23190
  source_tag: Saitakis2017
  title: Different TCR-induced T lymphocyte responses are potentiated by stiffness with variable sensitivity
  authors:
  - Saitakis
  - Dogniaux
  - Goudot
  - Bufi
  - Asnacios
  - Maurin
  - Randriamampita
  - Asnacios
  - Hivroz
  year: 2017
  source_relevance:
    indication_match: proxy
    indication_match_justification: 'Healthy donor CD4+ T cells used as mechanistic proxy for tumor-infiltrating T cells in
      PDAC. The TCR mechanosensing apparatus is conserved across T cell subsets and disease contexts, but tumor-specific factors
      (chronic antigen stimulation, immunosuppressive cytokines, hypoxia) are not captured. The EC50 of mechanosensing should
      be similar but downstream functional effects may differ.

      '
    species_source: human
    species_target: human
    source_quality: primary_human_in_vitro
    perturbation_type: physiological_baseline
    perturbation_relevance: 'Anti-CD3/CD28 stimulation on PA-gels mimics TCR engagement on substrates of defined stiffness.
      This isolates the mechanosensing component without confounding cytokine/checkpoint effects present in the TME.

      '
    tme_compatibility: low
    tme_compatibility_notes: 'In vitro PA-gel system lacks all TME components: no immunosuppressive cytokines (TGFbeta, IL-10),
      no checkpoint ligands (PD-L1), no stromal cells, no hypoxia. The mechanosensing EC50 should translate, but the functional
      consequence (activation vs exhaustion) differs between acute in vitro and chronic in vivo settings. The model applies
      this EC50 to exhaustion, not activation.

      '
    measurement_directness: single_inversion
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: in_vitro_primary
tags:
