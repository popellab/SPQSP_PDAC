target_id: k_col_myCAF_sec_illsley2000
tags:
- ai-generated
extraction_model: claude-opus-4-6
extraction_reasoning_effort: high
study_interpretation: 'Illsley et al. 2000 measured collagen production by human dermal fibroblasts using

  HPLC quantification of hydroxyproline. Unirradiated control fibroblasts (no exogenous

  TGFb, 0.5% FCS) produced 39.78 pmol OHpro/1e5 cells/hour (median across 5 patients,

  range 29.80-82.84). Production was linear over 48h. This rate represents basal collagen

  secretion (f_col_basal * k_col_myCAF_sec in the model).

  '
key_assumptions:
- 'Culture conditions (0.5% FCS, no exogenous TGFb) represent near-zero TGFb stimulation,

  so the measured rate reflects k_col_myCAF_sec * f_col_basal (basal secretion only).

  '
- 'Hydroxyproline constitutes ~13.5% of collagen mass. Collagen I MW ~300 kDa.

  '
- 'Human dermal fibroblasts at passage 4 are a proxy for activated myCAFs in terms of

  basal collagen secretion machinery.

  '
key_study_limitations:
- 'Human dermal fibroblasts, not pancreatic stellate cells or PDAC CAFs.

  '
- 'Passage 4 cells on plastic promote myofibroblast activation.

  '
- 'Only 5 patients with ~3-fold inter-patient variability (29.80-82.84 range).

  '
experimental_context:
  species: human
  system: in_vitro_primary_cells
  cell_types:
  - name: dermal fibroblasts
    source: skin biopsies from cancer patients (unirradiated contralateral sites)
    isolation_method: 'Explanted from 3mm punch biopsies, passaged to P4. Experiments in 12-well

      plates at 1e5/mL, DMEM + 0.5% FCS + 50 ug/mL ascorbic acid + 0.2 mM

      L-proline. 48h experimental incubation.

      '
  culture_conditions:
    medium: DMEM + 0.5% FCS
    supplements: 50 ug/mL ascorbic acid, 0.2 mM L-proline
    duration: 48h experimental incubation
  indication: general_fibrosis
primary_data_source:
  doi: 10.1054/bjoc.2000.1321
  title: 'Increased collagen production in fibroblasts cultured from irradiated

    skin and effect of TGF beta1 - clinical study

    '
  authors:
  - Illsley
  - Peacock
  - McAnulty
  - Yarnold
  year: 2000
  source_tag: Illsley2000
  source_relevance:
    indication_match: proxy
    indication_match_justification: 'Human dermal fibroblasts as proxy for PDAC myCAFs. Collagen secretion

      machinery is conserved but absolute rates may differ.

      '
    species_source: human
    species_target: human
    source_quality: primary_human_in_vitro
    perturbation_type: physiological_baseline
    perturbation_relevance: 'Unirradiated control fibroblasts in standard culture without exogenous TGFb.

