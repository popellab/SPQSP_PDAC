calibration:
  parameters:
  - name: k_col_myCAF_sec
    units: milligram/(cell*day)
  - name: f_col_basal
    units: dimensionless
  forward_model:
    type: algebraic
    formula: 'Predict pmol OHpro/1e5 cells/h from basal secretion rate:

      basal_rate_mg_per_cell_per_day = k_col_myCAF_sec * f_col_basal

      Convert: mg collagen -> mg OHpro -> pmol OHpro, then scale to 1e5 cells and per hour.

      '
    data_rationale: 'Illsley 2000 measures hydroxyproline production rate by HPLC without exogenous

      TGFb. The effective rate is k_col_myCAF_sec * f_col_basal. Converting to the

      assay units (pmol OHpro/1e5 cells/h) enables direct comparison.

      '
    submodel_rationale: 'The QSP model collagen secretion rate is:

      k_col_myCAF_sec * (f_col_basal + (1-f_col_basal)*H_TGFb) * (1-phi_collagen) * myCAF.

      At zero TGFb: effective per-cell rate = k_col_myCAF_sec * f_col_basal.

      '
    code: "def compute(params, inputs):\n    k_sec = params['k_col_myCAF_sec']\n    f_basal = params['f_col_basal']\n    ohpro_frac\
      \ = inputs['ohpro_mass_fraction']\n    ohpro_mw = inputs['ohpro_mw']\n    n_cells = inputs['cells_per_unit']\n    #\
      \ k_sec in mg/cell/day, f_basal dimensionless\n    basal_mg_per_cell_per_day = k_sec * f_basal\n    # mg collagen ->\
      \ mg OHpro\n    mg_ohpro_per_cell_per_day = basal_mg_per_cell_per_day * ohpro_frac\n    # mg -> g: /1000, g -> mol:\
      \ /MW, mol -> pmol: *1e12\n    # combined: mg * 1e12 / (1000 * MW) = mg * 1e9 / MW\n    pmol_per_cell_per_day = mg_ohpro_per_cell_per_day\
      \ * 1e9 / ohpro_mw\n    # per cell per day -> per 1e5 cells per hour\n    pmol_per_1e5_per_h = pmol_per_cell_per_day\
      \ * n_cells / 24\n    return pmol_per_1e5_per_h\n"
  error_model:
  - name: basal_ohpro_rate
    units: picomole / hour
    uses_inputs:
    - ohpro_rate_median
    - ohpro_rate_low
    - ohpro_rate_high
    - n_patients
    sample_size_input: n_patients
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    median_rate\
      \ = inputs['ohpro_rate_median']\n    low = inputs['ohpro_rate_low']\n    high = inputs['ohpro_rate_high']\n    log_median\
      \ = np.log(median_rate)\n    log_low = np.log(low)\n    log_high = np.log(high)\n    # Expected range of n normal samples\
      \ ~ 2*sqrt(2*ln(n)) * sigma\n    n = int(inputs['n_patients'])\n    range_factor = 2 * np.sqrt(2 * np.log(n))\n    sd_log\
      \ = (log_high - log_low) / range_factor\n    return rng.lognormal(log_median, sd_log, size=n_bootstrap)\n"
  identifiability_notes: 'This target constrains the product k_col_myCAF_sec * f_col_basal. The individual

    parameters are degenerate from this target alone. The companion target

    (f_col_basal from TGFb fold-change) breaks the degeneracy.

    '
