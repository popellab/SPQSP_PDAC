  formula: incubation_time_72h_hours / 24.0
- name: MiaPaCa2_cell_count_elisa
  value: 1000000.0
  units: cell
  input_type: reference_value
  rationale: "Approximate number of MiaPaCa-2 pancreatic cancer cells per well used\
    \ for 72 h serum-free conditioned medium collection in a standard 6-well plate.\
    \ Typical confluent seeding densities for such ELISA-based secretion assays are\
    \ on the order of 1\xD710^6 cells per well, consistent with similar PDAC cell\
