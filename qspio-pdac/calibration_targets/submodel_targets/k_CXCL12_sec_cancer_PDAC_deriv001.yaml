target_id: k_CXCL12_sec_cancer
inputs:
- name: CXCL12_MiaPaCa2_mean_pg_ml
  value: 129.84
  units: pg/mL
  input_type: direct_measurement
  source_ref: Xu2015
  source_location: Figure 4C, MiaPaCa-2 bar
  figure_excerpt:
    figure_id: Figure 4C
    value: ~130 pg/mL
    description: CXCL12 concentration in conditioned medium from MiaPaCa-2 pancreatic
      cancer cells after 72 h serum-free culture
    context: ELISA of CXCL12 levels in conditioned media from multiple pancreatic
