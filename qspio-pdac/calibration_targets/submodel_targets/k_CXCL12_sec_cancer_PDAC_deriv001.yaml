- name: CXCL12_MiaPaCa2_sd_pg_ml
  value: 14.52
  units: pg/mL
  input_type: direct_measurement
  source_ref: Xu2015
  source_location: Figure 4C, MiaPaCa-2 bar error
  figure_excerpt:
    figure_id: Figure 4C
    value: error bar height difference ~15 pg/mL
    description: Approximate spread of the MiaPaCa-2 bar from mean to error-bar tip,
