study_interpretation: 'Han2009 provides quantitative surface marker data for DC maturation using three clinical-grade

  LPS+IFNg protocols (n=6 donors). CD80 expression increases from 29±10% (immature) to 90±8%

  (24h stimulation), with all markers (CD80, CD83, CD86, HLA-DR) showing near-complete upregulation

  by 24h. Under first-order maturation kinetics, the CD80 trajectory from 29% to 90% at 24h

  implies k ≈ 2.0/day (t_half ≈ 8h). CD80 was chosen as the primary readout because it has the

  widest dynamic range (29→90%) among the four markers, providing the most informative constraint.

  Pozenel2024 provides complementary evidence that functional maturation (IL-12p70 secretion) peaks

  at 6h, consistent with a maturation rate of ~2-3/day. Lubin2024 provides in vivo cDC2

  proliferation rate of 0.75/day as a lower bound on turnover kinetics. For the GVAX injection

  site, GM-CSF-driven maturation is the relevant stimulus, but the intrinsic maturation program

  speed (receptor signaling → surface marker upregulation) is conserved across stimuli.

  '
key_assumptions:
- 'DC maturation follows approximately first-order kinetics, where k_APC_mature_ID represents the

  rate constant for the immature-to-mature transition in the presence of stimulus.

  '
- 'CD80 surface expression is a valid surrogate for the model''s maturation compartment transition.

  The QSP model treats "mature" as a single state; CD80 upregulation is one component of this

  transition.

  '
- 'The saturation ceiling for surface marker expression is approximated by the observed CD86

  percentage at 24h (97±2%), which is the highest marker measured and approaches 100%.

  '
- 'In vitro maturation kinetics with LPS/IFNg are a reasonable proxy for GM-CSF-driven maturation

  at an injection site, though GM-CSF acts through different receptors and may have somewhat

  different kinetics.

  '
key_study_limitations:
- 'Han2009 uses LPS+IFNg stimulation, not GM-CSF. Different TLR/cytokine stimuli may activate

  different kinetic programs.

  '
- 'Only two timepoints (0h and 24h) are available for CD80 quantification. Intermediate timepoints

  would better constrain the rate constant.

  '
- 'In vitro culture conditions (defined medium, controlled stimulus) differ from the injection site

  environment where multiple stimuli act simultaneously.

  '
