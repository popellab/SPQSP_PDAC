calibration:
  parameters:
  - name: k_APC_mature_ID
    units: 1/day
  forward_model:
    data_rationale: 'Han2009 provides quantitative CD80 surface marker expression at 0h and 24h of

      LPS+IFNg stimulation in n=6 healthy donors. Under first-order maturation kinetics,

      the rate of CD80 upregulation directly constrains k_APC_mature_ID.

      '
    submodel_rationale: 'The QSP model treats DC maturation at the injection site as a first-order transition

      gated by GM-CSF and antigen: J_mature_ID = k_APC_mature_ID * H_GMCSF_ID * V_ID.APC *

      f(antigen). The rate constant k_APC_mature_ID represents the intrinsic maturation rate

      when stimulus is present. CD80 upregulation under saturating stimulus (LPS+IFNg) isolates

      this intrinsic rate.

      '
    independent_variable: null
    state_variables: null
    type: algebraic
    formula: CD80_pct(t) = baseline + (max - baseline) * (1 - exp(-k * t))
    code: "def compute(params, inputs):\n    k = params['k_APC_mature_ID']  # 1/day\n    baseline = inputs['cd80_baseline_pct']\
      \ / inputs['cd86_24h_pct']\n    t_days = inputs['maturation_duration_h'] / 24.0\n    # First-order maturation: fraction\
      \ expressing CD80\n    fraction_mature = 1.0 - np.exp(-k * t_days)\n    # Map to CD80 percentage\n    cd80_predicted\
      \ = (baseline + (1.0 - baseline) * fraction_mature) * inputs['cd86_24h_pct']\n    return cd80_predicted\n"
  error_model:
  - name: cd80_maturation_han2009
    observable: null
    units: percent
    uses_inputs:
    - cd80_24h_pct
    - cd80_24h_sd
    - cd86_24h_pct
    evaluation_points: null
    sample_size_input: n_han2009_donors
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    cd80_24h\
      \ = inputs['cd80_24h_pct']  # 90%\n    sd = inputs['cd80_24h_sd']  # 8%\n    ceiling = inputs['cd86_24h_pct']  # 97%\
      \ (empirical saturation)\n    # Beta bootstrap: bounded [0, ceiling], matches mean and SD\n    # Reparametrize: mu =\
      \ mean/ceiling, var = (sd/ceiling)^2\n    mu = cd80_24h / ceiling\n    var = (sd / ceiling) ** 2\n    # Beta shape params\
      \ from method of moments\n    alpha = mu * (mu * (1 - mu) / var - 1)\n    beta_param = (1 - mu) * (mu * (1 - mu) / var\
      \ - 1)\n    return rng.beta(alpha, beta_param, size=n_bootstrap) * ceiling\n"
  identifiability_notes: 'k_APC_mature_ID is structurally identifiable from the CD80 maturation data: given the

    baseline (29%) and 24h value (90%), the first-order rate constant is uniquely determined.

    With only two timepoints (0h, 24h), the constraint is informative but cannot distinguish

    first-order from other kinetic models. In the full model, the effective maturation rate

    depends on the product k_APC_mature_ID * H_GMCSF_ID, so k_APC_mature_ID and EC50_GMCSF

    are partially correlated. Constraining EC50_GMCSF independently helps resolve this.

    '
