calibration:
  parameters:
  - name: IL6_50_M2
    units: nanomolarity
  - name: baseline_arginase
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: -1.5
      sigma: 0.5
  - name: max_arginase
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 0.2
      sigma: 0.5
  - name: n_IL6_M2
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 0.0
      sigma: 0.5
  forward_model:
    type: algebraic
    formula: arginase = baseline + (max - baseline) * IL6_nM^n / (EC50^n + IL6_nM^n)
    data_rationale: 'Five-point IL-6 dose-response on arginase activity in IL-4+IL-13-treated
      BMDMs. The steep transition between 0.1 and 1 ng/mL (0.287 to 0.703)
      requires a Hill coefficient n > 1 to capture the threshold-like response.
      The sigmoidal curve constrains EC50, and the Hill coefficient absorbs
      the steepness of the dose-response.
      '
    submodel_rationale: "The QSP model uses H_IL6_M2 = IL6/(IL6_50_M2 + IL6) (n=1) as one of three\nOR-gate factors in M1->M2 polarization:\n\
      \  rate = k_M2_pol * Mac_M1 * (1 - (1-H_TGFb)*(1-H_IL10)*(1-H_IL6_M2))\nThe in vitro arginase readout at fixed IL-4+IL-13\
      \ with varying IL-6 directly\nprobes the IL-6 Hill function component. The nuisance Hill coefficient\nn_IL6_M2 absorbs\
      \ the steepness difference between the in vitro dose-response\nand the n=1 QSP model; EC50 remains the primary constrained parameter.\n"
    code: "def compute(params, inputs):\n    import numpy as np\n    ec50 = params['IL6_50_M2']\n    baseline = params['baseline_arginase']\n\
      \    maximum = params['max_arginase']\n    n = params['n_IL6_M2']\n    mw = inputs['IL6_MW_Da']\n    doses = {\n        'dose_0':\
      \ inputs['IL6_dose_0'],\n        'dose_001': inputs['IL6_dose_001'],\n        'dose_01': inputs['IL6_dose_01'],\n       \
      \ 'dose_1': inputs['IL6_dose_1'],\n        'dose_10': inputs['IL6_dose_10'],\n    }\n    results = {}\n    for key, d_ng\
      \ in doses.items():\n        d_nM = d_ng / mw * 1e6\n        h = d_nM**n / (ec50**n + d_nM**n) if d_nM > 0 else 0.0\n\
      \        results[key] = baseline + (maximum - baseline) * h\n    return results\n"
  error_model:
  - name: arginase_at_0
    units: dimensionless
    uses_inputs:
    - arginase_dose0_mean
    - arginase_dose0_sem
    - n_replicates
    sample_size_input: n_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['arginase_dose0_mean']\n    sem = inputs['arginase_dose0_sem']\n    sd = sem * np.sqrt(inputs['n_replicates'])\n\
      \    return rng.lognormal(np.log(mean), sd / mean / np.sqrt(sample_size), n_bootstrap)\n"
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['dose_0']\n"
  - name: arginase_at_001
    units: dimensionless
    uses_inputs:
    - arginase_dose001_mean
    - arginase_dose001_sem
    - n_replicates
    sample_size_input: n_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['arginase_dose001_mean']\n    sem = inputs['arginase_dose001_sem']\n    sd = sem * np.sqrt(inputs['n_replicates'])\n\
      \    return rng.lognormal(np.log(mean), sd / mean / np.sqrt(sample_size), n_bootstrap)\n"
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['dose_001']\n"
  - name: arginase_at_01
    units: dimensionless
    uses_inputs:
    - arginase_dose01_mean
    - arginase_dose01_sem
    - n_replicates
    sample_size_input: n_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['arginase_dose01_mean']\n    sem = inputs['arginase_dose01_sem']\n    sd = sem * np.sqrt(inputs['n_replicates'])\n\
      \    return rng.lognormal(np.log(mean), sd / mean / np.sqrt(sample_size), n_bootstrap)\n"
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['dose_01']\n"
  - name: arginase_at_1
    units: dimensionless
    uses_inputs:
    - arginase_dose1_mean
    - arginase_dose1_sem
    - n_replicates
    sample_size_input: n_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['arginase_dose1_mean']\n    sem = inputs['arginase_dose1_sem']\n    sd = sem * np.sqrt(inputs['n_replicates'])\n\
      \    return rng.lognormal(np.log(mean), sd / mean / np.sqrt(sample_size), n_bootstrap)\n"
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['dose_1']\n"
  - name: arginase_at_10
    units: dimensionless
    uses_inputs:
    - arginase_dose10_mean
    - arginase_dose10_sem
    - n_replicates
    sample_size_input: n_replicates
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['arginase_dose10_mean']\n    sem = inputs['arginase_dose10_sem']\n    sd = sem * np.sqrt(inputs['n_replicates'])\n\
      \    return rng.lognormal(np.log(mean), sd / mean / np.sqrt(sample_size), n_bootstrap)\n"
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['dose_10']\n"
  identifiability_notes: 'IL6_50_M2 is well-constrained by the 5-point dose-response. The transition

    from no effect (0.01-0.1 ng/mL) to near-maximal (10 ng/mL) spans ~2 log

    units, pinning the EC50 between 0.1 and 1 ng/mL (~0.005-0.05 nM).


    baseline_arginase and max_arginase (nuisance) are constrained by the

    asymptotes: baseline by the 0 and 0.01 ng/mL points (~0.23), max by the

    10 ng/mL point (~1.17). All three parameters are identifiable from the

    5-point curve.

    '
