target_id: IL6_50_M2_fernando2014
tags:
- ai-generated
- macrophage-module
extraction_model: claude-opus-4-6
study_interpretation: 'Fernando et al. (2014) measured arginase activity as a function of IL-6

  concentration in mouse bone marrow-derived macrophages (BMDMs) co-treated with

  IL-4+IL-13 (20 ng/mL each) for 48h. Five IL-6 doses were tested: 0, 0.01, 0.1,

  1, and 10 ng/mL (n=4).


  Arginase activity showed a clear sigmoidal dose-response: no effect at 0.01

  ng/mL, marginal increase at 0.1 ng/mL, significant enhancement at 1 ng/mL

  (p<0.05), and maximal enhancement at 10 ng/mL (p<0.01). IL-6 alone (without

  IL-4+IL-13) had no effect on arginase at any dose.


  The threshold at ~1 ng/mL (0.048 nM) constrains the EC50 for IL-6 enhancement

  of M2 macrophage polarization. The model uses H_IL6_M2 = IL6/(IL6_50_M2 + IL6)

  in an OR-gate with TGFb and IL-10 for M1->M2 polarization, making this

  augmentation model a direct mapping.

  '
key_assumptions:
- 'Arginase activity is a valid functional readout for M2 macrophage polarization.

  Arginase-1 is a canonical M2/AAM marker that directly reflects the STAT3/STAT6-

  driven M2 program.

  '
- 'The IL-6 dose-response on arginase activity maps to the model''s H_IL6_M2 Hill

  function. In the model, IL-6 acts as one of three independent drivers of M2

  polarization (OR-gate with TGFb and IL-10). The experimental design (IL-6 added

  to IL-4+IL-13) tests IL-6 augmentation of an existing M2 signal, which is

  consistent with this OR-gate structure.

  '
- 'The n=1 Hill function in the QSP model is appropriate. The dose-response data

  shows a gradual transition between 0.1 and 10 ng/mL spanning ~2 log units,

  consistent with n~1 Hill coefficient.

  '
- 'IL-6 concentrations in ng/mL are converted to nM using MW of 21 kDa for mouse

  IL-6. The recombinant IL-6 used (Cedarlane) is mouse IL-6.

  '
key_study_limitations:
- 'Mouse BMDMs, not human macrophages. Mouse and human macrophage IL-6 signaling

  differs in receptor expression and downstream effectors. Human data (Figure 4)

  shows similar enhancement but at a single 10 ng/mL dose only.

  '
- 'IL-6 enhancement requires IL-4+IL-13 co-stimulation. IL-6 alone does not drive

  M2 polarization. The EC50 measured here is for augmentation of an existing M2

  program, not de novo polarization. However, the model''s OR-gate structure is

  consistent with this behavior.

  '
- 'Arginase activity (enzymatic assay) is a single readout. Other M2 markers

  (CD206, Ym1, RELMalpha) were measured only at single IL-6 doses (Figure 1),

  not as dose-response curves.

  '
experimental_context:
  species: mouse
  system: in_vitro_primary_cells
  cell_types:
  - name: bone marrow-derived macrophages (BMDMs)
    source: BALB/c and C57/Bl6 mice
    isolation_method: 'Bone marrow cultured in RPMI1640 + 20% FBS + M-CSF (20 ng/mL) for 7 days

      for BMDM differentiation. Stimulated with IL-4+IL-13 (20 ng/mL each) +/-

      IL-6 for 48h.

      '
  culture_conditions:
    medium: RPMI1640, 20% FBS, 1.2% GlutaMAX, 2.4% pen-strep, M-CSF 20 ng/mL
    duration: 7 days differentiation + 48h IL-4+IL-13+/-IL-6 treatment
  indication: general_immunology
primary_data_source:
  doi: 10.1371/journal.pone.0094188
  title: 'The Pro-Inflammatory Cytokine, Interleukin-6, Enhances the Polarization

    of Alternatively Activated Macrophages

    '
  authors:
  - Fernando
  - Reyes
  - Iannuzzi
  - Leung
  - McKay
  year: 2014
  source_tag: Fernando2014
  source_relevance:
    indication_match: proxy
    indication_match_justification: 'Mouse BMDMs from BALB/c and C57/Bl6 mice, not PDAC-specific. IL-6/STAT3

      signaling in macrophages is conserved across tissues, but the PDAC TME has

      additional immunosuppressive factors (TGFb, IL-10, hypoxia) that may modulate

      IL-6 sensitivity. The EC50 for IL-6 receptor signaling is a biophysical

      property of the IL-6/IL-6R/gp130 complex and should be relatively conserved.

      '
    species_source: mouse
    species_target: human
    source_quality: primary_animal_in_vitro
    perturbation_type: pharmacological
    perturbation_relevance: 'Recombinant IL-6 dose titration with IL-4+IL-13 co-stimulation. The

      co-stimulation provides the M2-permissive context; IL-6 dose varies.

      This maps to the model''s OR-gate where IL-6 augments M2 polarization

      driven by other signals.

      '
    tme_compatibility: moderate
    tme_compatibility_notes: 'In vitro BMDM culture lacks ECM stiffness, hypoxia, and cancer cell

      paracrine factors present in PDAC TME. Macrophage IL-6R expression may

      differ between BMDMs and tumor-associated macrophages. However, the

      IL-6/gp130 signaling axis is well-conserved.

      '
    measurement_directness: single_inversion
    temporal_resolution: endpoint_pair
    experimental_system: in_vitro_primary
