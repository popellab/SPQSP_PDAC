calibration:
  parameters:
  - name: IL2_50
    units: nanomolarity
  forward_model:
    type: algebraic
    formula: predicted EC50 = IL2_50
    code: "def compute(params, inputs):\n    ec50 = params['IL2_50']\n    return {\n        'ec50_cd3': ec50,\n        'ec50_unsorted':\
      \ ec50,\n        'ec50_healthy': ec50,\n    }\n"
    data_rationale: Paper reports fitted EC50 values from 3H-thymidine proliferation assays across multiple cell populations
      and activation states. CD3+ enriched cells are most relevant for the QSP T cell parameter. Unsorted post-IL-2 PBMCs
      provide n=18 statistical power. Healthy donor PBMCs provide a less-activated baseline.
    submodel_rationale: 'The QSP Hill function uses IL2_50 as the half-maximal IL-2 concentration for T cell proliferation.
      The paper''s EC50 from thymidine incorporation directly measures this quantity. Three cell populations provide differential
      information: CD3+ post-IL-2 (activated T cells, most model-relevant), unsorted post-IL-2 (higher n, includes NK), and
      healthy donors (resting state upper bound).'
  error_model:
  - name: ec50_cd3_enriched
    units: nanomolarity
    uses_inputs:
    - ec50_cd3_post_il2
    - se_cd3_post_il2
    - n_cd3_post_il2
    sample_size_input: n_cd3_post_il2
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['ec50_cd3']\n"
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['ec50_cd3_post_il2']\n    se = inputs['se_cd3_post_il2']\n    sd = se * np.sqrt(sample_size)\n    return rng.lognormal(np.log(mean),\
      \ sd / mean / np.sqrt(sample_size), n_bootstrap)\n"
  - name: ec50_unsorted_activated
    units: nanomolarity
    uses_inputs:
    - ec50_unsorted_post_il2
    - se_unsorted_post_il2
    - n_unsorted_post_il2
    sample_size_input: n_unsorted_post_il2
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['ec50_unsorted']\n"
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['ec50_unsorted_post_il2']\n    se = inputs['se_unsorted_post_il2']\n    sd = se * np.sqrt(sample_size)\n  \
      \  return rng.lognormal(np.log(mean), sd / mean / np.sqrt(sample_size), n_bootstrap)\n"
  - name: ec50_healthy_donors
    units: nanomolarity
    uses_inputs:
    - ec50_healthy_unsorted
    - se_healthy_unsorted
    - n_healthy_unsorted
    sample_size_input: n_healthy_unsorted
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['ec50_healthy']\n"
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['ec50_healthy_unsorted']\n    se = inputs['se_healthy_unsorted']\n    sd = se * np.sqrt(sample_size)\n    return\
      \ rng.lognormal(np.log(mean), sd / mean / np.sqrt(sample_size), n_bootstrap)\n"
  identifiability_notes: 'IL2_50 is directly constrained by three independent EC50 measurements from different cell populations.
    The CD3+ enriched (0.22 nM) and unsorted post-IL-2 (0.21 nM) are concordant and most model-relevant. The healthy donor
    value (0.54 nM) is higher, reflecting lower IL-2R expression on resting cells. The posterior will be pulled toward 0.2-0.3
    nM by the activated cell data.

    '
experimental_context:
  species: human
  system: in_vitro_primary_cells
  cell_lines:
  - name: PBMCs
    source: Melanoma patients receiving in vivo IL-2 therapy + healthy donors
  cell_types:
  - name: CD3+ T lymphocyte
    source: MACS-sorted from PBMCs (89% CD3+)
  - name: CD56+ NK cell
    source: MACS-sorted from PBMCs (92% CD56+)
  culture_conditions:
    medium: RPMI 1640 + 10% human serum
    notes: '1e5 responder cells per well in 96-well microtiter plates, 200 uL final volume.

      Incubated 48h at 37C with 5% CO2, followed by 12-16h pulse with 1 uCi

      3H-thymidine per well. EC50 calculated using ALLFIT program.

      '
study_interpretation: 'IL-2 EC50 for lymphocyte proliferation is 0.21-0.22 nM in activated cells (both unsorted and CD3+ enriched),
  rising to 0.54 nM in resting healthy donor cells. CD56+ NK cells have much lower EC50 (0.027 nM) due to high-affinity IL-2R.
  The model parameter IL2_50 = 0.32 nM sits between the activated and resting T cell values, suggesting it may be slightly
  high for activated effectors in the TME.

  '
key_assumptions:
- IL-2R expression on activated T cells in PDAC TME is comparable to post-IL-2 therapy cells
- 3H-thymidine incorporation is a valid proxy for the division destiny Hill function in the QSP model
- EC50 for proliferation is approximately equal across T cell subsets (CD4 vs CD8) at similar activation states
- Unsorted PBMC EC50 is representative despite NK cell contribution (CD3+ enriched gives concordant value)
key_study_limitations:
- Melanoma patients, not PDAC — activation state may differ
- Post-IL-2 therapy cells may have altered receptor expression not representative of antigen-activated T cells
- Thymidine incorporation measures DNA synthesis, not division number (model uses division destiny)
- CD3+ enriched n=3 gives large SE; relies on unsorted n=18 for statistical power
- Healthy donor EC50 (0.54 nM) may be more appropriate for naive T cells entering the TME
primary_data_source:
  pmid: '9607589'
  source_tag: deJong1998
  title: Differential quantitative effects of interleukin (IL)-2 and IL-15 on cytotoxic activity and proliferation by lymphocytes
    from patients receiving in vivo IL-2 therapy
  authors:
  - de Jong
  - Farner NL
  - Javorsky BR
  - Lindstrom MJ
  - Hank JA
  - Sondel PM
  year: 1998
  source_relevance:
    indication_match: proxy
    indication_match_justification: 'Melanoma patient PBMCs and healthy donor PBMCs used to measure IL-2 EC50 for proliferation.
      IL-2 receptor binding and signaling is conserved across indications — the IL-2/IL-2R interaction is an intrinsic receptor
      property independent of tumor type. The EC50 reflects IL-2R expression level (intermediate vs high affinity), which
      depends on activation state rather than indication. Post-IL-2 activated cells are most relevant to the PDAC model''s
      activated effector T cells in the TME.

      '
    species_source: human
    species_target: human
    source_quality: primary_human_in_vitro
    perturbation_type: pharmacological
    perturbation_relevance: 'Patients received in vivo IL-2 therapy which upregulates IL-2R expression

      and activates lymphocytes. The post-treatment activation state is analogous

      to antigen-activated T cells in the TME. Healthy donor cells provide a

      resting-state comparison. The EC50 difference (0.21 vs 0.54 nM) reflects

      IL-2Ralpha upregulation, not a pharmacological artifact.

      '
    tme_compatibility: moderate
    tme_compatibility_notes: 'In vitro thymidine incorporation assay in complete medium with human serum. Lacks TME immunosuppressive
      factors (TGFb, IL-10, PD-1) that may shift effective IL-2 sensitivity in vivo. However, the EC50 is a receptor-level
      property determined by IL-2R affinity and expression, which is set by activation state rather than TME context.

      '
    measurement_directness: direct
    temporal_resolution: endpoint_pair
    experimental_system: in_vitro_primary
