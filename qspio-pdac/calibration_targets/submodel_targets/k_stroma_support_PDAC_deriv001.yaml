calibration:
  parameters:
  - name: k_stroma_support
    units: dimensionless
    nuisance: false
  - name: rho_C1_baseline_density
    units: cell / millimeter ** 2
    nuisance: true
    prior:
      distribution: lognormal
      mu: 8.1
      sigma: 0.5
  forward_model:
    data_rationale: Xu2010 reports cytokeratin-positive cancer cell densities per
      mm^2 in orthotopic AsPC-1 tumors with and without co-injected human PSCs, plus
      the average number of activated PSCs per 100 cancer cells in primary tumors.
      At a fixed 6 week endpoint, these densities serve as proxies for effective carrying
      capacity under PSC-free and PSC-rich conditions.
    submodel_rationale: 'In the full QSP PDAC model, k_stroma_support scales the cancer
      carrying capacity contributed per CAF. The algebraic submodel implements this
      mechanistically: the cancer cell density in tumors containing PSCs equals the
      baseline density times (1 + k_stroma_support * PSCs-per-cancer-cell). The nuisance
      parameter rho_C1_baseline_density captures the baseline carrying capacity (cells/mm^2)
      without PSC support.'
    type: algebraic
    formula: density_with_PSC = density_without_PSC * (1 + k_stroma_support * psc_per_cancer)
    code: "def compute(params, inputs):\n    import numpy as np\n    k = params['k_stroma_support']\n\
      \    rho0 = params['rho_C1_baseline_density']\n    psc_per_cancer = inputs['psc_per_cancer']\n\
      \    density_no_psc = rho0\n    density_with_psc = rho0 * (1.0 + k * psc_per_cancer)\n\
      \    return {\n        'density_AsPC_only': density_no_psc,\n        'density_AsPC_plus_PSC':\
      \ density_with_psc,\n    }\n"
  error_model:
  - name: cancer_density_AsPC_only
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['density_AsPC_only']\n"
    units: cell / millimeter ** 2
    uses_inputs:
    - cancer_density_AsPC_only_mean
    - cancer_density_AsPC_only_sem
    - n_animals_density
    sample_size_input: n_animals_density
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['cancer_density_AsPC_only_mean']\n\
      \    sem = inputs['cancer_density_AsPC_only_sem']\n    n = int(inputs['n_animals_density'])\n\
      \    sd = sem * np.sqrt(n)\n    cv = sd / mean\n    sigma_ln = np.sqrt(np.log(1.0\
      \ + cv**2))\n    mu_ln = np.log(mean) - sigma_ln**2 / 2.0\n    return rng.lognormal(mu_ln,\
      \ sigma_ln / np.sqrt(sample_size), n_bootstrap)\n"
    n_bootstrap: 10000
  - name: cancer_density_AsPC_PSC
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['density_AsPC_plus_PSC']\n"
    units: cell / millimeter ** 2
    uses_inputs:
    - cancer_density_AsPC_PSC_mean
    - cancer_density_AsPC_PSC_sem
    - n_animals_density
    sample_size_input: n_animals_density
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['cancer_density_AsPC_PSC_mean']\n\
      \    sem = inputs['cancer_density_AsPC_PSC_sem']\n    n = int(inputs['n_animals_density'])\n\
      \    sd = sem * np.sqrt(n)\n    cv = sd / mean\n    sigma_ln = np.sqrt(np.log(1.0\
      \ + cv**2))\n    mu_ln = np.log(mean) - sigma_ln**2 / 2.0\n    return rng.lognormal(mu_ln,\
      \ sigma_ln / np.sqrt(sample_size), n_bootstrap)\n"
    n_bootstrap: 10000
  identifiability_notes: "The two cancer cell density measurements (with and without\
    \ PSCs) at a single time point constrain k_stroma_support through their ratio,\
    \ given the measured PSC-per-cancer-cell ratio from the same model. The nuisance\
    \ parameter rho_C1_baseline_density absorbs the unknown absolute baseline carrying\
    \ capacity (cells/mm^2). Because all measurements are at one endpoint and the\
    \ model is algebraic, k_stroma_support is identifiable primarily through the fold-change\
    \ 4143/3231 \u2248 1.28 and the PSC:cancer ratio 0.153. Uncertainty in the PSC:cancer\
    \ ratio is not explicitly modeled here and effectively propagates into k_stroma_support\
    \ as an unmodeled source of error; thus posterior uncertainty on k_stroma_support\
    \ should be interpreted as a lower bound. Additional time-course or multi-ratio\
    \ data (e.g., tumors with different PSC:cancer seeding ratios) would further constrain\
    \ this parameter and help disentangle potential changes in growth rate versus\
    \ carrying capacity."
experimental_context:
  species: mouse
  system: animal_in_vivo
  cell_lines:
  - name: AsPC-1
    species: human
    tissue_origin: pancreas
    cell_type: pancreatic ductal adenocarcinoma
    source: American Type Culture Collection (ATCC)
  cell_types:
  - name: pancreatic stellate cell
    phenotype: activated cancer-associated and normal human PSCs
    isolation_method: outgrowth method from resected pancreatic cancer tissue for
      CAhPSCs; density-gradient isolation from histologically normal pancreas for
      NhPSCs
    source: resected human pancreatic tissue from patients undergoing surgery
  indication: PDAC
study_interpretation: "Xu2010 uses an orthotopic AsPC-1 xenograft model in nude mice\
  \ to show that co-injected human pancreatic stellate cells (PSCs) increase primary\
  \ tumor size, desmoplasia, and cancer cell proliferation. Quantitative histology\
  \ demonstrates that tumors containing PSCs have \u224828% higher cytokeratin-positive\
  \ cancer cell density per mm^2 than tumors without PSCs, and that such tumors contain\
  \ on average 15.33 activated PSCs per 100 cancer cells. Interpreting cancer cell\
  \ density at the 6 week endpoint as a proxy for effective carrying capacity, these\
  \ measurements imply that each PSC contributes an additional k_stroma_support-fold\
  \ increase in carrying capacity per cancer cell. The algebraic submodel formalizes\
  \ this by relating the observed density increase to k_stroma_support and the measured\
  \ PSC:cancer ratio, while treating the absolute baseline density as a nuisance parameter."
key_assumptions:
- Cancer cell density per mm^2 at 6 weeks approximates an effective carrying capacity
  under the respective stromal conditions, even though tumors may not be fully at
  steady state.
- "The reported mean \xB1 error values for cancer cell densities and PSC:cancer ratios\
  \ are interpreted as mean \xB1 SEM, which are converted to SD using the stated sample\
  \ size (n = 6), consistent with typical reporting conventions in similar pathology\
  \ studies."
- The average ratio of activated PSCs to cancer cells (15.33 per 100 cancer cells)
  in AsPC-1 + hPSC tumors is representative of the PSC abundance driving the observed
  increase in cancer cell density and can be treated as fixed in the forward model.
- Stromal support primarily alters effective carrying capacity (supportive niche size)
  rather than intrinsic cancer cell proliferation or death rates over the 6 week period,
  so that differences in endpoint density can be attributed to carrying capacity modulation.
- Activated PSCs in this model are used as a surrogate for the broader CAF population
  (including myCAF, iCAF, and apCAF subtypes) that contributes to stromal support
  in human PDAC; k_stroma_support is therefore an effective per-CAF parameter.
key_study_limitations:
- The experiments are performed in athymic nude mice with human tumor cells and human
  PSCs, so the immune context and stromal-immune interactions of human PDAC are not
  fully recapitulated.
- Tumor measurements are taken at a single 6 week endpoint, and true steady-state
  tumor size is unknown; using endpoint cancer cell density as a proxy for carrying
  capacity introduces potential bias if growth has not saturated.
- The PSC:cancer cell ratio is measured only for tumors in the PSC-containing group
  and with limited sample size; variability in this ratio across tumors is not explicitly
  modeled and may broaden the true uncertainty on k_stroma_support.
- Activated PSCs are not subdivided into CAF phenotypic subtypes (myCAF, iCAF, apCAF),
  so the inferred k_stroma_support reflects an average effect per activated PSC rather
  than subtype-specific contributions.
- Host mouse stromal cells (eg, hepatic stellate cells at metastatic sites) may also
  contribute to desmoplasia and support but are not explicitly distinguished from
  injected human PSCs, making the per-PSC support estimate approximate.
