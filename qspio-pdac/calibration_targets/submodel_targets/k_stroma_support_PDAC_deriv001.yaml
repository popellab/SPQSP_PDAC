  source_relevance:
    indication_match: exact
    indication_match_justification: The study uses human pancreatic cancer cell line
      AsPC-1 implanted orthotopically into the mouse pancreas together with human
      pancreatic stellate cells, directly modeling pancreatic ductal adenocarcinoma
      (PDAC) tumor-stroma interactions. Thus the indication closely matches the PDAC
      QSP model, although the host is murine and immunodeficient.
    species_source: mouse
    species_target: human
    source_quality: primary_animal_in_vivo
    perturbation_type: pathological_state
    perturbation_relevance: Measurements are taken from untreated orthotopic PDAC
      xenografts formed by AsPC-1 cells with or without co-injected human PSCs, representing
      the pathological tumor-bearing state without pharmacologic or genetic perturbations
      of stromal function.
    tme_compatibility: moderate
    tme_compatibility_notes: The orthotopic xenografts recapitulate key features of
      PDAC stroma, including dense desmoplasia and activated pancreatic stellate cells.
      However, the mice are athymic and lack a fully functional adaptive immune system,
      and species differences in host vasculature and matrix may alter quantitative
      stromal support compared with human PDAC.
    measurement_directness: steady_state_inversion
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: animal_in_vivo
