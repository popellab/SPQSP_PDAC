target_id: p1_50
inputs:
- name: ql9_halfmax_peptide_conc
  value: 5.0e-12
  units: molar
  input_type: direct_measurement
  source_ref: Sykulev1996
  source_location: Figure 1 and Results text, section "Peptide Concentration Required
    for Half-Maximal Cytolysis"
  value_snippet: As shown in Figure 1, the SD50 value of I1-QL9-Y5, was about equal
    to that of peptide QL9, or around 5 pM.
- name: complexes_per_cell_mean
  value: 3.0
  units: molecule/cell
  input_type: direct_measurement
  source_ref: Sykulev1996
  source_location: Results text, section "Direct Measurement of Epitope Densities"
  value_snippet: "Hence, at the lowest peptide concentration (5 \xD7 10^-12 M), the\
    \ epitope density value in this system was 3 \xB1 1 pepMHC complexes per target\
    \ cell."
- name: complexes_per_cell_sd
  value: 1.0
  units: molecule/cell
  input_type: direct_measurement
  source_ref: Sykulev1996
  source_location: Results text, section "Direct Measurement of Epitope Densities"
  value_snippet: "Hence, at the lowest peptide concentration (5 \xD7 10^-12 M), the\
    \ epitope density value in this system was 3 \xB1 1 pepMHC complexes per target\
    \ cell."
- name: effective_sample_size
  value: 1.0
  units: dimensionless
  input_type: reference_value
  rationale: "Sykulev1996 reports a single mean \xB1 spread estimate (3 \xB1 1 complexes\
    \ per cell) for the epitope density at 5 \xD7 10^-12 M; we model this as one effective\
    \ observation whose SD captures combined experimental uncertainty."
  source_ref: Sykulev1996
  source_location: Not explicitly reported; treated as a single effective measurement
    summarizing multiple determinations.
calibration:
  parameters:
  - name: p1_50
    units: molecule/micrometer^2
    nuisance: false
  - name: A_Tcell_target_contact
    units: micrometer^2
    nuisance: true
    prior:
      distribution: lognormal
      mu: 4.317
      sigma: 0.3
  forward_model:
    data_rationale: "Sykulev1996 directly measured the average number of agonist QL9\u2013\
      Ld complexes per T2-Ld target cell at the peptide concentration (\u22485 pM)\
      \ that gives half-maximal lysis by 2C CD8 CTL. This provides a direct estimate\
      \ of the number of effective pepMHC per target cell at functional EC50 for killing."
    submodel_rationale: "In QSPIO-PDAC, p1_50 is defined as the epitope surface density\
      \ (molecules/um^2) that yields half-maximal T cell activation. Assuming an effective\
      \ T cell\u2013target contact area A_Tcell_target_contact, the expected number\
      \ of agonist pepMHC complexes sampled at EC50 is p1_50 * A. Equating this to\
      \ the experimentally observed complexes per cell from Sykulev1996 links the\
      \ QSP parameter p1_50 to the measured CTL sensitivity while explicitly representing\
      \ uncertainty in the synapse/contact area as a nuisance parameter."
    type: algebraic
    formula: complexes_per_cell_50 = p1_50 * A_Tcell_target_contact
    code: "def compute(params, inputs):\n    import numpy as np\n    # QSP parameter:\
      \ epitope surface density for half-maximal activation (molecules/um^2)\n   \
      \ p1_50 = params['p1_50']\n    # Nuisance parameter: effective T cell\u2013\
      target contact area (um^2)\n    A = params['A_Tcell_target_contact']\n    #\
      \ Predicted mean number of agonist pepMHC complexes engaged at EC50\n    return\
      \ p1_50 * A\n"
  error_model:
  - name: complexes_per_cell_EC50
    units: molecule/cell
    uses_inputs:
    - complexes_per_cell_mean
    - complexes_per_cell_sd
    - effective_sample_size
    sample_size_input: effective_sample_size
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['complexes_per_cell_mean']\n    sd\
      \ = inputs['complexes_per_cell_sd']\n    # Treat the reported \xB11 as an SD\
      \ on a positive quantity and use a lognormal bootstrap\n    cv = sd / mean\n\
      \    sigma_ln = np.sqrt(np.log(1.0 + cv**2))\n    mu_ln = np.log(mean) - (sigma_ln**2)\
      \ / 2.0\n    # Effective sample size is treated as the number of independent\
      \ measurements summarized by this mean\n    return rng.lognormal(mu_ln, sigma_ln\
      \ / np.sqrt(sample_size), n_bootstrap)\n"
    n_bootstrap: 10000
  identifiability_notes: "This target constrains the product p1_50 * A_Tcell_target_contact\
    \ to match the observed mean complexes per cell at half-maximal lysis (~3 \xB1\
    \ 1). With only a single scalar observable from this study, p1_50 and the nuisance\
    \ contact area A_Tcell_target_contact are not separately identifiable from this\
    \ target alone; their posterior will be strongly correlated, and the marginal\
    \ for p1_50 will largely reflect the prior on A. However, encoding A as a nuisance\
    \ parameter with an informative prior (based on independent estimates of synapse/contact\
    \ area in the broader model) correctly propagates uncertainty in geometric assumptions\
    \ into p1_50, and allows other submodels or hierarchical priors involving contact\
    \ geometry to help break the degeneracy in joint inference."
experimental_context:
  species: mouse
  system: in_vitro_cell_line
  cell_lines:
  - name: T2-Ld
    species: human
    tissue_origin: lymphoblastoid B cell hybridoma
    cell_type: antigen-presenting/target cell
    source: T2 hybridoma transfected with mouse Ld (Alexander et al., 1989)
  cell_types:
  - name: CD8 T cell clone 2C
    phenotype: "allo-reactive CD8+ CTL specific for QL9\u2013Ld"
    source: Mouse CTL clone 2C maintained in vitro (Kranz et al., 1984)
  culture_conditions:
    substrate: suspension culture in round-bottom microtiter wells
    serum_concentration: 10.0
    serum_concentration_units: percent
    oxygen_level: normoxic (5% CO2 incubator)
    culture_type: 2d_monolayer
    medium: RPMI-1640 + 10% heat-inactivated fetal calf serum
    supplements: HEPES, L-glutamine, penicillin/streptomycin, beta-mercaptoethanol
    duration: 4 hr CTL assay at 37 degC with peptide-pulsed T2-Ld targets and 2C CTL
    notes: "TAP-deficient T2-Ld targets were pulsed with synthetic QL9 or radioiodinated\
      \ analog I1-QL9-Y5 at 37 degC; cytolysis measured over 4 hr by 51Cr release,\
      \ and peptide\u2013Ld complex numbers measured at steady state by binding of\
      \ 125I1-QL9-Y5."
study_interpretation: "Sykulev1996 shows that the 2C CD8+ CTL clone can achieve half-maximal\
  \ cytolytic activity against TAP-deficient T2-Ld targets when, on average, only\
  \ about three agonist QL9\u2013Ld complexes are present per target cell at the peptide\
  \ concentration giving SD50 approximately 5 pM. This provides a direct quantitative\
  \ measure of the minimal number of high-affinity class I pepMHC complexes per target\
  \ required to elicit strong CTL effector function. By mapping the measured complexes-per-cell\
  \ at EC50 onto a surface density via an assumed effective T cell\u2013target contact\
  \ area, we obtain a constraint on the QSP parameter p1_50, interpreted as the pepMHC\
  \ surface density needed for half-maximal activation of highly sensitive CD8 effectors\
  \ by a potent foreign antigen. In the PDAC model, this represents a lower-bound\
  \ sensitivity benchmark relative to less immunogenic tumor/self antigens and more\
  \ suppressive microenvironments; deviations are captured through the joint prior\
  \ structure rather than by modifying this submodel."
key_assumptions:
- "The average number of QL9\u2013Ld complexes per target cell at 5 pM peptide (3\
  \ \xB1 1) accurately reflects the number of agonist complexes accessible within\
  \ the T cell\u2013target contact region relevant for triggering 2C CTL killing."
- "Effective T cell\u2013target contact area can be represented by a single parameter\
  \ A_Tcell_target_contact that is approximately constant across conjugates in this\
  \ in vitro system and is of order 50\u2013100 micrometer^2, consistent with typical\
  \ immunological synapse/contact sizes."
- The same number of agonist pepMHC complexes per synapse that elicits half-maximal
  cytolytic activity in 2C CTLs is mechanistically comparable to the epitope requirement
  for half-maximal activation in the QSPIO-PDAC model, so that p1_50 maps to complexes
  per contact area at EC50.
- Differences between foreign viral peptide recognition by an alloreactive CTL clone
  in vitro and tumor/self antigen recognition in PDAC (lower intrinsic TCR affinity,
  stronger suppression) are handled at the level of priors and other targets, not
  by rescaling the Sykulev1996 measurement itself.
- Spatial heterogeneity of pepMHC across the target cell surface and dynamic serial
  engagement of TCRs by a small number of agonist complexes do not materially alter
  the interpretation that effective EC50 corresponds to about 3 complexes sampled
  within the contact area.
key_study_limitations:
- The experimental system uses a mouse CD8 CTL clone recognizing a potent foreign
  peptide (QL9) presented by Ld on a human hybridoma line (T2-Ld) in vitro, which
  is biologically distant from human PDAC T cells recognizing tumor/self antigens
  in a desmoplastic tumor microenvironment.
- Measured complex numbers are per entire target cell and require an assumed effective
  contact/synapse area to convert to surface density, introducing geometric uncertainty
  captured only approximately by the nuisance parameter A_Tcell_target_contact.
- T2-Ld cells are TAP-deficient and rely on exogenous peptide loading, leading to
  atypically low background peptide repertoires and potentially different competitive
  binding context compared with physiological tumor cells.
- "The readout is short-term 4 hr cytolytic activity of pre-activated CTL, whereas\
  \ p1_50 is applied more broadly to T cell activation processes (including priming)\
  \ in the QSP model; we assume that the underlying TCR\u2013pepMHC sensitivity scale\
  \ is comparable."
- "The study reports a single aggregate estimate (3 \xB1 1 complexes per cell) without\
  \ detailed replicate statistics, so uncertainty structure is approximated using\
  \ a lognormal bootstrap based on this SD and an effective sample size of one."
primary_data_source:
  pmid: '8752061'
  title: "Evidence that a Single Peptide\u2013MHC Complex on a Target Cell Can Elicit\
    \ a Cytolytic T Cell Response"
  authors:
  - Sykulev
  - Joo
  - Vturina
  - Tsomides
  - Eisen
  year: 1996
  source_tag: Sykulev1996
  source_relevance:
    indication_match: proxy
    indication_match_justification: "The study examines activation thresholds of a\
      \ mouse CD8+ CTL clone recognizing a potent foreign peptide (QL9) on TAP-deficient\
      \ T2-Ld target cells, whereas the QSPIO-PDAC model focuses on human PDAC where\
      \ CD8 T cells typically recognize less immunogenic tumor/self antigens in a\
      \ highly suppressive stromal microenvironment. Nevertheless, the basic TCR\u2013\
      pepMHC triggering biophysics is conserved, so the complexes-per-cell threshold\
      \ in Sykulev1996 provides a mechanistic lower-bound benchmark for T cell sensitivity\
      \ that can be translated to PDAC with appropriate uncertainty."
    species_source: mouse
    species_target: human
    source_quality: primary_animal_in_vitro
    perturbation_type: physiological_baseline
    perturbation_relevance: CTLs are tested in vitro under peptide-pulsed target conditions
      without pharmacologic modulators; this represents near-maximal effector sensitivity
      to agonist pepMHC, likely providing an optimistic (lower-bound) estimate for
      p1_50 compared with in vivo PDAC.
    tme_compatibility: low
    tme_compatibility_notes: The T2-Ld/2C in vitro system lacks the dense collagenous
      stroma, myeloid-derived suppression, and chemokine-mediated exclusion present
      in PDAC tumors. As a result, T cell activation thresholds derived from this
      system likely underestimate the effective antigen density required for activation
      in PDAC by at least an order of magnitude, and we treat the resulting constraint
      on p1_50 as a high-sensitivity lower bound with substantial translation uncertainty.
    measurement_directness: direct
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: in_vitro_cell_line
