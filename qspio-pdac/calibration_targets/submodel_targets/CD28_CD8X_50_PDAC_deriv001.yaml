calibration:
  parameters:
  - name: CD28_CD8X_50
    units: molecule / micrometer ** 2
    nuisance: false
  - name: CD80_DC_density
    units: molecule / micrometer ** 2
    nuisance: true
    prior:
      distribution: lognormal
      mu: 4.5315
      sigma: 0.3
  - name: CD86_DC_density
    units: molecule / micrometer ** 2
    nuisance: true
    prior:
      distribution: lognormal
      mu: 4.9863
      sigma: 0.3
  forward_model:
    data_rationale: Unternaehrer2007 provides quantitative surface densities (molecules
      per square micron) for CD80 and CD86 on murine bone-marrow-derived DCs and B
      blasts. We treat the DC densities as near-saturating CD28 co-stimulation and
      the substantially lower B-blast densities as sub-saturating, which brackets
      a plausible EC50 range for CD28 ligation. The absolute DC CD80/CD86 densities
      are directly mapped to QSP parameters representing typical DC B7 densities.
    submodel_rationale: In the full QSPIO-PDAC model, CD28-mediated costimulation
      enters as a Hill function of an effective B7 (CD80+CD86) surface density, with
      CD28_CD8X_50 as the EC50 and CD80_DC_density/CD86_DC_density setting the scale
      of available ligands on dendritic cells. This algebraic submodel keeps that
      parameterization explicit by (i) directly inferring the DC B7 densities from
      the FACS-based molecule-per-area measurements and (ii) constraining CD28_CD8X_50
      to lie between the physiologic B-blast and DC B7 densities, consistent with
      DCs providing near-saturating costimulation while B blasts are sub-saturating.
    type: algebraic
    formula: Observable CD80 and CD86 DC surface densities equal their corresponding
      QSP parameters; CD28_CD8X_50 is the EC50 for total CD80+CD86 density needed
      for half-maximal CD28 costimulation.
    code: "def compute(params, inputs):\n    import numpy as np\n    # QSP parameters\n\
      \    cd80_dc = params['CD80_DC_density']\n    cd86_dc = params['CD86_DC_density']\n\
      \    ec50_cd8 = params['CD28_CD8X_50']\n    # Return observables as a dict\n\
      \    return {\n        'CD80_DC_density': cd80_dc,\n        'CD86_DC_density':\
      \ cd86_dc,\n        'CD28_CD8X_50': ec50_cd8,\n    }\n"
  error_model:
  - name: CD80_DC_density_measurement
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['CD80_DC_density']\n"
    units: molecule / micrometer ** 2
    uses_inputs:
    - CD80_DC_density_mean
    - CD80_DC_density_sd
    - n_experiments_CD80_CD86
    sample_size_input: n_experiments_CD80_CD86
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['CD80_DC_density_mean']\n    sd =\
      \ inputs['CD80_DC_density_sd']\n    cv = sd / mean\n    # Lognormal bootstrap\
      \ for positive densities; measurement SD over n experiments\n    return rng.lognormal(np.log(mean),\
      \ cv / np.sqrt(sample_size), n_bootstrap)\n"
    n_bootstrap: 10000
  - name: CD86_DC_density_measurement
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['CD86_DC_density']\n"
    units: molecule / micrometer ** 2
    uses_inputs:
    - CD86_DC_density_mean
    - CD86_DC_density_sd
    - n_experiments_CD80_CD86
    sample_size_input: n_experiments_CD80_CD86
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['CD86_DC_density_mean']\n    sd =\
      \ inputs['CD86_DC_density_sd']\n    cv = sd / mean\n    # Lognormal bootstrap\
      \ for positive densities; measurement SD over n experiments\n    return rng.lognormal(np.log(mean),\
      \ cv / np.sqrt(sample_size), n_bootstrap)\n"
    n_bootstrap: 10000
  - name: CD28_CD8X_50_bracket
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['CD28_CD8X_50']\n"
    units: molecule / micrometer ** 2
    uses_inputs:
    - DC_total_CD80_CD86_density
    - B_total_CD80_CD86_density
    - n_experiments_CD80_CD86
    sample_size_input: n_experiments_CD80_CD86
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    dc_total = inputs['DC_total_CD80_CD86_density']\n\
      \    b_total = inputs['B_total_CD80_CD86_density']\n    # Treat B-blast and\
      \ DC total B7 densities as approximate lower and upper bounds\n    # for the\
      \ CD28 EC50. Use a lognormal distribution whose 95% CI spans [b_total, dc_total].\n\
      \    log_b = np.log(b_total)\n    log_dc = np.log(dc_total)\n    mu = (log_b\
      \ + log_dc) / 2.0\n    sigma = (log_dc - log_b) / (2.0 * 1.96)\n    return rng.lognormal(mu,\
      \ sigma, n_bootstrap)\n"
    n_bootstrap: 10000
  identifiability_notes: "CD80_DC_density and CD86_DC_density are directly and fairly\
    \ tightly constrained by the FACS-based molecule-per-cell measurements and stereological\
    \ surface areas, yielding well-identified typical DC B7 densities. CD28_CD8X_50\
    \ is only indirectly constrained via the requirement that its value fall between\
    \ the lower B-blast and higher DC total B7 densities, implemented as a broad lognormal\
    \ prior centered at the geometric mean of these totals with a 95% interval spanning\
    \ the bracket. This yields a weak but biologically informed constraint that keeps\
    \ CD28_CD8X_50 on the order of 10^2 molecules/\xB5m^2, consistent with the QSP\
    \ prior, while allowing substantial uncertainty. Additional functional data relating\
    \ T cell activation to absolute B7 densities (e.g., dose\u2013response on supported\
    \ lipid bilayers) would be required to more sharply identify CD28_CD8X_50."
