study_interpretation: Unternaehrer2007 quantitatively establishes baseline surface
  densities of the costimulatory ligands CD80 and CD86 on murine bone-marrow-derived
  dendritic cells and on activated B-cell blasts, expressed as molecules per square
  micron of plasma membrane. In the PDAC QSP model, DCs are the dominant professional
  antigen-presenting cells responsible for priming naive CD8 T cells, whereas B cells
  are not explicitly modeled. The substantially higher CD80 and CD86 densities on
  DCs (relative to B blasts) are interpreted as reflecting near-saturating CD28 costimulation
  in physiological priming contexts, while the lower B-blast densities represent sub-saturating
  conditions. By (i) mapping the DC B7 densities directly to the QSP parameters CD80_DC_density
  and CD86_DC_density and (ii) constraining the CD28_CD8X_50 EC50 parameter to lie
  between the summed B-blast and DC B7 densities, this submodel provides a weak but
  mechanistically grounded calibration of the co-stimulatory EC50 consistent with
  the overall magnitude of physiological B7 expression.
key_assumptions:
- Murine bone-marrow-derived dendritic cells have CD80/CD86 surface densities in the
  same order of magnitude as human tumor-draining dendritic cells in PDAC, so mouse
  values can be used as proxies for human.
- The average surface densities reported for whole-cell plasma membranes approximate
  the effective B7 ligand density experienced by CD8 T cells at immunological synapses,
  ignoring potential synaptic enrichment or nanoscale clustering.
- Total effective CD28 ligand density for CD8 T cells can be approximated as the sum
  of CD80 and CD86 surface densities with equal weight, without distinguishing differences
  in CD28 affinity or kinetics between the two ligands.
- Mature DCs provide near-saturating CD28 costimulation for naive T cells, whereas
  B blasts with substantially lower CD80 (and somewhat lower CD86) are sub-saturating;
  thus the true EC50 for CD28 costimulation lies between the B-blast and DC total
  B7 densities.
- Measurement error in molecules-per-cell estimates and stereological surface area
  is modest relative to biological and cross-species translation uncertainty, so uncertainties
  derived from reported SDs are adequate for calibration.
- Differences between resting and inflammatory conditions, and between lymphoid and
  tumor-draining microenvironments, primarily shift B7 density within the same order
  of magnitude and do not radically alter the EC50 scale for CD28 ligation.
key_study_limitations:
- "The study quantifies surface densities of CD80 and CD86 but does not measure T\
  \ cell activation or proliferation as a function of these densities, so CD28 co-stimulatory\
  \ EC50 must be inferred indirectly from bracketing arguments rather than a true\
  \ dose\u2013response curve."
- Experiments were performed with murine bone-marrow-derived DCs and LPS-activated
  B blasts in vitro under non-tumor conditions; applying these densities to human
  PDAC tumor-draining DCs involves cross-species and context extrapolation.
- Surface densities are averaged over the entire plasma membrane and do not capture
  possible enrichment of CD80/CD86 at immunological synapses or within tetraspanin
  microdomains, which may increase local ligand density.
- "Only a small number of independent experiments (n\u22483) were used to estimate\
  \ molecules-per-cell, and the uncertainty in stereological surface area measurements\
  \ is not explicitly reported, so propagated density SDs may underestimate true variability."
- The PDAC QSP model does not explicitly include B cells, so using B-blast B7 densities
  to define a sub-saturating bracket for EC50 relies on the assumption that B-cell
  costimulation is representative of lower-efficiency professional APCs in vivo.
primary_data_source:
  doi: 10.1073/pnas.0609665104
  year: 2007
  source_tag: Unternaehrer2007
  source_relevance:
    indication_match: proxy
    indication_match_justification: "The study investigates antigen-presenting dendritic\
      \ cells and B blasts in healthy mice rather than tumor-draining dendritic cells\
      \ in pancreatic ductal adenocarcinoma. However, the biophysical quantity of\
      \ interest\u2014baseline CD80/CD86 molecule density on mature dendritic cells\u2014\
      is expected to be broadly conserved across tissues and disease contexts, so\
      \ these values can serve as a mechanistic proxy for B7 densities in PDAC-associated\
      \ dendritic cells, with added translation uncertainty."
    species_source: mouse
    species_target: human
    source_quality: primary_animal_in_vitro
    perturbation_type: physiological_baseline
    perturbation_relevance: Cells were examined at baseline or after standard maturation
      stimuli (e.g., LPS for DCs, LPS for B blasts) without pharmacologic checkpoint
      modulation. Thus measured CD80/CD86 densities reflect typical activation states
      for professional and non-professional APCs rather than drug-perturbed extremes,
      appropriate for constraining physiological B7 levels in the QSP model.
    tme_compatibility: moderate
    tme_compatibility_notes: Bone-marrow-derived DCs differentiated in vitro and their
      LPS-matured counterparts differ from tumor-infiltrating DCs in PDAC, which experience
      chronic exposure to tumor antigens, immunosuppressive cytokines, and dense stroma.
      Nonetheless, fundamental constraints on B7 surface expression and typical densities
      per unit area are likely similar, so the data are considered moderately compatible
      with the PDAC tumor microenvironment but subject to added uncertainty.
    measurement_directness: proxy_observable
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: in_vitro_primary
