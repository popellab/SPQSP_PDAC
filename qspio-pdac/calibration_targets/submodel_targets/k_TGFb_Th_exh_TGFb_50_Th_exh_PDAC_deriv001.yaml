      tumor microenvironment. The TGF-beta/Smad3/PD-1 signaling axis and basic exhaustion biology are conserved between these
      contexts, but PDAC-specific factors such as desmoplastic stroma, chronic tumor antigen exposure, and complex myeloid/CAF-mediated
      immunosuppression are absent, so the study serves as a mechanistic proxy rather than an indication-matched dataset.
