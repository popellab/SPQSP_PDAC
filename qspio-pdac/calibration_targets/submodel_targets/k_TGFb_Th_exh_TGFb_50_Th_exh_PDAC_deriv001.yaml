    - pd1_mfi_cd4_baseline_sd
    - n_donors_park2016
    sample_size_input: n_donors_park2016
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    baseline\
      \ = inputs['pd1_mfi_cd4_bar0']\n    maxv = inputs['pd1_mfi_cd4_bar5']\n    mfi  = inputs['pd1_mfi_cd4_bar5']\n    sd_mfi\
      \ = inputs['pd1_mfi_cd4_baseline_sd']\n    se = sd_mfi / np.sqrt(sample_size)\n    baseline_s = rng.normal(baseline,\
      \ se, n_bootstrap)\n    maxv_s     = rng.normal(maxv,     se, n_bootstrap)\n    mfi_s      = rng.normal(mfi,      se,\
      \ n_bootstrap)\n    return (mfi_s - baseline_s) / (maxv_s - baseline_s)\n"
    n_bootstrap: 10000
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['frac_exh_50000pg']"
  identifiability_notes: 'The Park2016 CD4+ PD-1 MFI dose-response provides five non-zero TGF-beta1 concentrations (5–50,000
    pg/mL) at a single endpoint (~3 days). After normalization to the baseline (0 pg/mL) and apparent saturation (50,000 pg/mL),
    these yield five effective exhaustion fractions on (0,1]. Jointly fitting the mechanistic mapping f_exh(c) = 1 - exp(-k_TGFb_Th_exh
    * t_exp * c/(c + TGFb_50_Th_exh)) constrains both k_TGFb_Th_exh and TGFb_50_Th_exh, but they remain correlated: larger
    k can be partially compensated by larger EC50. The nuisance parameter t_exp_days_Th_exh_invitro is tightly informed by
    the reported 72 h culture duration and mainly propagates timing uncertainty; scale_Park2016_PD1 allows modest deviation
    from the assumption that normalized PD-1 MFI directly equals exhausted fraction. Because all data come from a single experiment
    with polyclonal human CD4+ T cells in vitro, extrapolation to PDAC tumor-infiltrating Th cells adds translation uncertainty
    not captured by this single-target identifiability analysis.'
experimental_context:
  species: human
  system: in_vitro_primary_cells
  cell_lines: null
  cell_types:
  - name: CD3+ T cells (CD4+ and CD8+ subsets)
    phenotype: Polyclonal peripheral blood T cells from healthy donors
    isolation_method: Pan T cell negative selection from PBMCs using magnetic beads
    source: Leukapheresis products from healthy adult donors
  culture_conditions:
    substrate: Standard tissue culture plastic
    serum_concentration: 10.0
    serum_concentration_units: percent_fetal_bovine_serum
    oxygen_level: normoxic
    culture_type: 2d_monolayer
    medium: RPMI-1640 + 10% Fetal Bovine Serum with HEPES, penicillin/streptomycin, and L-glutamine
    supplements: alphaCD3/alphaCD28-conjugated Dynabeads (1:1 cell:bead ratio); graded recombinant human TGF-beta1 (5–50,000
      pg/mL)
    duration: 72 h activation with alphaCD3/alphaCD28 ± TGF-beta1
    notes: No tumor cells or stromal components present; experiment isolates direct TGF-beta1 effects on activated human T
      cells.
study_interpretation: Park2016 demonstrates that exogenous TGF-beta1 markedly enhances PD-1 expression on activated human
  CD4+ T cells in a graded, dose-dependent fashion over 72 h, with minimal effect on proliferation and limited impact on the
  activation marker HLA-DR. By normalizing PD-1 MFI to the alphaCD3/alphaCD28-only baseline and the apparent saturation response
  at the highest TGF-beta1 dose, the CD4+ PD-1 data in Figure 1e can be interpreted as an approximate exhausted Th fraction
  vs. TGF-beta1 concentration. Under the assumption of first-order Th -> Th_exh kinetics driven by a Hill function of TGF-beta1,
  these data inform both the maximal TGF-beta–driven exhaustion rate k_TGFb_Th_exh and the TGF-beta EC50 TGFb_50_Th_exh used
  in the QSPIO-PDAC model. Although measured in peripheral blood T cells from healthy donors rather than PDAC tumor-infiltrating
  lymphocytes, the signaling machinery (TGF-betaR, Smad3-dependent PD-1 transcription) is conserved and provides a mechanistic,
  human-based prior for TGF-beta–mediated CD4+ T cell exhaustion in the PDAC tumor microenvironment.
key_assumptions:
- Normalized PD-1 MFI on CD4+ T cells (after subtracting the alphaCD3/alphaCD28-only baseline and scaling to the highest TGF-beta1
  dose) is proportional to the fraction of Th cells that have entered a PD-1hi exhausted state.
- TGF-beta1 concentration in culture remains approximately constant over the 72 h activation period, so exhaustion can be
  treated as an integrated first-order process with fixed rate k_TGFb_Th_exh * H_TGFb(c).
- Other cytokines present in the culture (e.g., autocrine IL-2, IL-6) have secondary effects compared with the dominant Smad3-dependent
  TGF-beta1 signal and can be neglected when mapping PD-1 MFI to TGF-beta–driven exhaustion.
- The Hill coefficient for the TGF-beta1 effect on Th exhaustion is 1, consistent with a simple receptor occupancy-like dependence,
  so H_TGFb(c) = c/(c + TGFb_50_Th_exh).
- The alphaCD3/alphaCD28-only baseline PD-1 expression reflects TCR-driven but TGF-beta–independent activation; subtracting
  this baseline removes the influence of non–TGF-beta mechanisms (e.g., NFATc1 alone) on PD-1 levels.
- Differences between circulating CD4+ T cells from healthy donors and PDAC tumor-infiltrating Th cells (chronic antigen exposure,
  hypoxia, stromal cues) primarily affect the magnitude of exhaustion but not the fundamental TGF-beta–Smad3–PD-1 regulatory
  axis, allowing reuse of the inferred kinetic parameters with additional contextual uncertainty in the full QSP model.
key_study_limitations:
- The experiment uses polyclonal CD3+ T cells from healthy donors activated with strong alphaCD3/alphaCD28 stimulation rather
  than tumor-infiltrating Th cells from PDAC, so antigen load, co-inhibitory receptor landscape, and chronic exposure history
  differ from the in vivo tumor context.
- PD-1 MFI is a surrogate marker for exhaustion rather than a direct functional readout; the mapping from normalized PD-1
  intensity to exhausted fraction is approximate and may vary across T cell subsets and environments.
- Only a single time point (72 h) is available, so the separation of k_TGFb_Th_exh from the culture duration t_exp relies
  on the reported incubation time and an assumed first-order kinetic form; potential time-dependent saturation or feedback
  cannot be resolved.
- Figure-based digitization of PD-1 MFI introduces small uncertainties in the absolute values and does not capture experimental
  variance (SD/SEM) explicitly; bootstrap uncertainty is therefore dominated by between-dose differences rather than within-dose
  noise.
- The cultured T cells are exposed to relatively high TGF-beta1 concentrations compared with many physiological settings;
  the highest doses likely represent an upper bound on TGF-beta–driven exhaustion rates in vivo.
- The in vitro system lacks key PDAC tumor microenvironment components (myofibroblastic CAFs, dense collagen matrix, hypoxia,
  suppressive myeloid cells), which in the full QSPIO-PDAC model modulate both TGF-beta production and additional exhaustion
  pathways; thus the inferred parameters primarily characterize the intrinsic T cell sensitivity to TGF-beta rather than the
  net in-tumor exhaustion rate.
