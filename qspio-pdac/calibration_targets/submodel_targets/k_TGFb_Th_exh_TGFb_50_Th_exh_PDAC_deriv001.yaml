    perturbation_relevance: Recombinant human TGF-beta1 is added to activated T cell cultures over a wide concentration range,
      producing supraphysiologic exposure that isolates the intrinsic sensitivity of Th cells to TGF-beta–driven PD-1 upregulation
      via Smad3. These conditions likely represent an upper bound on TGF-beta–driven exhaustion rates in vivo but are appropriate
      for calibrating the kinetic parameters of the TGF-beta-dependent exhaustion module in the QSP model.
