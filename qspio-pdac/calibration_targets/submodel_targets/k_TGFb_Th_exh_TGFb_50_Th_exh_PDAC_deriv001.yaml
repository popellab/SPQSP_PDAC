      cells, hypoxia, and spatial heterogeneity characteristic of the PDAC tumor microenvironment. Consequently, many modifiers
      of Th exhaustion present in PDAC (e.g., collagen-dependent stiffness, CXCL12-mediated exclusion, NO and ArgI from MDSCs)
      are absent, and TGF-beta is the dominant extrinsic signal. The inferred parameters therefore capture intrinsic T cell
      responsiveness to TGF-beta but must be combined with additional uncertainty when applied to the PDAC TME.
