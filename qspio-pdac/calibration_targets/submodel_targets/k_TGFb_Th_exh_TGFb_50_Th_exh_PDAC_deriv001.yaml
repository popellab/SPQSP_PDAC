- name: pd1_mfi_cd4_baseline_sd
  value: 1.313
  units: dimensionless
  input_type: derived_arithmetic
  source_ref: Park2016
  source_location: Figure 1e — derived from spread of three low-dose bars (0, 5, 50 pg/mL TGFβ1)
  rationale: Park 2016 Figure 1e does not display error bars, but the three lowest-dose bars (0, 5, 50 pg/mL TGFβ1) span a
    TGFβ concentration range over which no biologically meaningful PD-1 induction is expected (well below any plausible EC50).
    Their spread (PD-1 MFI 25.75, 27.0, 28.375; sample SD = 1.313, CV ≈ 4.9% at the baseline mean of 27.04) therefore reflects
    measurement and inter-replicate noise rather than a TGFβ effect, and is used as a data-derived measurement-noise SD for
    all dose-response bars. This avoids fabricating a CV while still admitting a positive bootstrap spread.
  source_inputs:
  - pd1_mfi_cd4_bar0
  - pd1_mfi_cd4_bar1
  - pd1_mfi_cd4_bar2
  formula: sqrt(((pd1_mfi_cd4_bar0 - pd1_mfi_cd4_bar1) * (pd1_mfi_cd4_bar0 - pd1_mfi_cd4_bar1) + (pd1_mfi_cd4_bar0 - pd1_mfi_cd4_bar2)
    * (pd1_mfi_cd4_bar0 - pd1_mfi_cd4_bar2) + (pd1_mfi_cd4_bar1 - pd1_mfi_cd4_bar2) * (pd1_mfi_cd4_bar1 - pd1_mfi_cd4_bar2))
    / 6)
calibration:
  parameters:
  - name: k_TGFb_Th_exh
    units: 1/day
  - name: TGFb_50_Th_exh
    units: nanomolarity
  - name: t_exp_days_Th_exh_invitro
    units: day
    nuisance: true
    prior:
      distribution: lognormal
      mu: 1.098612288
      sigma: 0.1
  - name: scale_Park2016_PD1
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 0.0
      sigma: 0.5
  forward_model:
    type: algebraic
    formula: For each TGF-beta1 concentration c, the exhausted Th fraction after t_exp days is f_exh(c) = 1 - exp(-k_TGFb_Th_exh
      * t_exp * H_TGFb(c)), where H_TGFb(c) = c/(c + TGFb_50_Th_exh).
    code: "def compute(params, inputs):\n    import numpy as np\n    k = params['k_TGFb_Th_exh']\n    ec50 = params['TGFb_50_Th_exh']\n\
      \    t_exp = params['t_exp_days_Th_exh_invitro']\n    # TGF-beta1 concentrations in nM corresponding to Park2016 Figure\
      \ 1e doses\n    c_5 = inputs['tgfb_dose_5pg_nM']\n    c_50 = inputs['tgfb_dose_50pg_nM']\n    c_500 = inputs['tgfb_dose_500pg_nM']\n\
      \    c_5000 = inputs['tgfb_dose_5000pg_nM']\n    c_50000 = inputs['tgfb_dose_50000pg_nM']\n\n    def hill(c):\n    \
      \    return c / (ec50 + c)\n\n    f_5 = 1.0 - np.exp(-k * hill(c_5) * t_exp)\n    f_50 = 1.0 - np.exp(-k * hill(c_50)\
      \ * t_exp)\n    f_500 = 1.0 - np.exp(-k * hill(c_500) * t_exp)\n    f_5000 = 1.0 - np.exp(-k * hill(c_5000) * t_exp)\n\
      \    f_50000 = 1.0 - np.exp(-k * hill(c_50000) * t_exp)\n\n    return {\n        'frac_exh_5pg': f_5 * params['scale_Park2016_PD1'],\n\
      \        'frac_exh_50pg': f_50 * params['scale_Park2016_PD1'],\n        'frac_exh_500pg': f_500 * params['scale_Park2016_PD1'],\n\
      \        'frac_exh_5000pg': f_5000 * params['scale_Park2016_PD1'],\n        'frac_exh_50000pg': f_50000 * params['scale_Park2016_PD1'],\n\
      \    }"
    data_rationale: Park2016 reports a single 72 h endpoint measurement of PD-1 MFI on human CD4+ T cells across a graded
      TGF-beta1 dose range (5–50,000 pg/mL). Over this fixed culture duration, a simple first-order Th -> Th_exh process with
      TGF-beta1-dependent rate maps naturally to an exhaustion fraction f_exh(c) = 1 - exp(-k_TGFb_Th_exh * t_exp * H_TGFb(c)).
      The algebraic model directly encodes this mapping at the experimental endpoint for each dose, allowing simultaneous
      inference of the maximal TGF-beta-driven exhaustion rate and the TGF-beta EC50 from the dose-response.
    submodel_rationale: In the full QSPIO-PDAC model, TGF-beta-driven CD4 helper T cell exhaustion in the tumor is modeled
      as V_T.Th -> V_T.Th_exh with rate k_TGFb_Th_exh * V_T.Th * H_TGFb_Th_exh, where H_TGFb_Th_exh is a Hill function of
      TGF-beta with EC50 TGFb_50_Th_exh. Assuming a homogeneous Th pool and constant TGF-beta over the 72 h in vitro experiment,
      the fraction of Th that become exhausted obeys f_exh(c) = 1 - exp(-k_TGFb_Th_exh * H_TGFb_Th_exh(c) * t_exp). The algebraic
      forward model preserves this exact dependence on k_TGFb_Th_exh and TGFb_50_Th_exh, differing only in the absence of
      other tumor-specific modifiers (e.g., cancer-cell-driven basal exhaustion), which are minimal in this polyclonal activation
      context.
  error_model:
  - name: Park2016_CD4_frac_exh_5pg
    units: dimensionless
    uses_inputs:
    - pd1_mfi_cd4_bar0
    - pd1_mfi_cd4_bar1
    - pd1_mfi_cd4_bar5
    - pd1_mfi_cd4_baseline_sd
    - n_donors_park2016
    sample_size_input: n_donors_park2016
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    baseline\
      \ = inputs['pd1_mfi_cd4_bar0']\n    maxv = inputs['pd1_mfi_cd4_bar5']\n    mfi  = inputs['pd1_mfi_cd4_bar1']\n    sd_mfi\
      \ = inputs['pd1_mfi_cd4_baseline_sd']\n    se = sd_mfi / np.sqrt(sample_size)\n    baseline_s = rng.normal(baseline,\
      \ se, n_bootstrap)\n    maxv_s     = rng.normal(maxv,     se, n_bootstrap)\n    mfi_s      = rng.normal(mfi,      se,\
      \ n_bootstrap)\n    return (mfi_s - baseline_s) / (maxv_s - baseline_s)\n"
    n_bootstrap: 10000
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['frac_exh_5pg']"
  - name: Park2016_CD4_frac_exh_50pg
    units: dimensionless
    uses_inputs:
    - pd1_mfi_cd4_bar0
    - pd1_mfi_cd4_bar2
    - pd1_mfi_cd4_bar5
    - pd1_mfi_cd4_baseline_sd
    - n_donors_park2016
    sample_size_input: n_donors_park2016
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    baseline\
      \ = inputs['pd1_mfi_cd4_bar0']\n    maxv = inputs['pd1_mfi_cd4_bar5']\n    mfi  = inputs['pd1_mfi_cd4_bar2']\n    sd_mfi\
      \ = inputs['pd1_mfi_cd4_baseline_sd']\n    se = sd_mfi / np.sqrt(sample_size)\n    baseline_s = rng.normal(baseline,\
      \ se, n_bootstrap)\n    maxv_s     = rng.normal(maxv,     se, n_bootstrap)\n    mfi_s      = rng.normal(mfi,      se,\
      \ n_bootstrap)\n    return (mfi_s - baseline_s) / (maxv_s - baseline_s)\n"
    n_bootstrap: 10000
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['frac_exh_50pg']"
  - name: Park2016_CD4_frac_exh_500pg
    units: dimensionless
    uses_inputs:
