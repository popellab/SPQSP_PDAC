target_id: phi_col_ref_grizzi2019_PDAC_deriv001
study_interpretation: |
  Grizzi et al. 2019 quantified Sirius-red-stained collagen surface in
  human pancreatic tissue using computer-aided image analysis. They
  reported normal pancreas (n=5 cases, 50 ROIs) collagen surface
  fraction = 2.23 +/- 0.28% (Table 2, Sirius red, mean +/- SD per
  Methods 'Data are expressed as mean +/- standard deviation').

  In the QSP-IO PDAC model, phi_col_ref is the reference normal-pancreas
  collagen volume fraction used as the normalization point in two
  power-law rules: d_pore = d_pore_ref*(phi_col_ref/phi_collagen)^0.5
  (pore-size scaling) and stiffness = E_ref*(phi_collagen/phi_col_ref)^n_stiff
  (stiffness scaling). The picrosirius-red area fraction is the
  histological-convention reading of phi (collagen-stained area / total
  tissue area in tissue cross-sections), and Grizzi 2019 is the
  cleanest direct primary measurement in normal human pancreas
  available in the literature.

  Note: the model's current value phi_col_ref = 0.12 was attributed to
  Apte 2004 in parameters_PDAC.m, but (a) the PMID 15247571 listed is
  verifiably WRONG (intervertebral disc paper) and (b) the intended
  Apte 2004 paper PMID 15367883 is a review that does not actually
  report 0.10-0.15 for normal pancreas. The 0.12 anchor is more
  consistent with whole-stromal-area methods (Masson trichrome,
  Movat pentachrome) than with picrosirius-specific staining. This
  target adopts the picrosirius-specific convention, in line with
  the Wolf 2013 (d_pore_ref) and Rubiano 2018 (stiffness power law)
  submodel targets that already use Sirius-red-style fibrillar-
  collagen normalization.
key_assumptions:
- |
  Sirius-red staining specifically labels fibrillar collagen
  (types I and III); the resulting area fraction is the picrosirius
  collagen volume fraction in tissue cross-sections under the
  Delesse principle. This is the convention adopted by the Wolf 2013
  and Rubiano 2018 submodel targets that share phi_col_ref.
- |
  Normal pancreas surgical specimens are representative of in vivo
  reference state. Grizzi 2019 sampled tissue from non-tumorous
  resections; subclinical pathology near disease boundaries is
  unlikely to substantially shift the area fraction.
- |
  Reported uncertainty 0.28% is across all 50 ROIs (10 ROIs per case
  x 5 cases). The reported SD therefore mixes within-case and
  between-case variability. For the population-level reference value
  phi_col_ref, the standard error of the patient-level mean is more
  relevant; we treat sample_size = n_cases = 5 in the bootstrap to
  conservatively represent population uncertainty.
key_study_limitations:
- |
  Small biological replicate count (n=5 normal cases). Pilot study.
  Population-level uncertainty is therefore limited by patient
  count, not by within-case ROI count.
- |
  Sirius-red picrosirius staining is specific to fibrillar collagens
  (types I, III) and does not capture basement membrane collagen
  (type IV) or proteoglycans. Some downstream Hill functions
  (e.g., H_pore which gates immune cell migration) may respond to
  the broader matrix structure, not just fibrillar collagen.
  Translation sigma absorbs this directness mismatch.
- |
  RGB-based segmentation thresholds in Sirius red image analysis
  vary across labs. The Grizzi 2019 method (Image-Pro Plus
  computer-aided image analysis) is one common implementation;
  absolute values can shift +/- 30% across implementations.
