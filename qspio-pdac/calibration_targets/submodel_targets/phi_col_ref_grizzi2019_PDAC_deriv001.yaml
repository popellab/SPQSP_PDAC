calibration:
  parameters:
  - name: phi_col_ref
    units: dimensionless
  forward_model:
    type: algebraic
    formula: phi_col_ref = (Sirius-red collagen area fraction in normal pancreas)
    code: |
      def compute(params, inputs):
          # Convert percent (from data) to dimensionless fraction (the
          # model parameter convention).
          return 100.0 * params['phi_col_ref']
    data_rationale: |
      Sirius-red picrosirius collagen-area measurement in normal
      pancreas IS the empirical definition of phi_col_ref under
      the morphometric / Delesse convention. The forward model is
      a unit-conversion identity: prediction (in %) = 100 * phi_col_ref
      (which is dimensionless 0-1).
    submodel_rationale: |
      The QSP model uses phi_col_ref as the normal-pancreas reference
      collagen volume fraction in d_pore = d_pore_ref *
      (phi_col_ref/phi_collagen)^0.5 and stiffness = E_ref *
      (phi_collagen/phi_col_ref)^n_stiff. Anchoring it to the
      picrosirius area fraction matches the convention used by the
      Wolf 2013 and Rubiano 2018 submodel targets that share this
      parameter through joint inference.
  error_model:
  - name: collagen_area_normal_pct
    units: dimensionless
    uses_inputs:
    - collagen_area_normal_mean_pct
    - collagen_area_normal_sd_pct
    - n_normal_cases
    sample_size_input: n_normal_cases
    observation_code: |
      def derive_observation(inputs, sample_size, rng, n_bootstrap):
          import numpy as np
          mean = inputs['collagen_area_normal_mean_pct']
          sd = inputs['collagen_area_normal_sd_pct']
          # Population-level mean of Sirius-red collagen area in
          # normal pancreas. n=5 patient cases is the relevant
          # denominator for SE of the population mean (treating the
          # reported SD as across-ROI; SE_population_mean ~ SD/sqrt(n).
          # Lognormal bootstrap because area % is positive-bounded
          # and CV (~12%) puts mass safely above zero.
          cv = sd / mean
          sigma_ln = np.sqrt(np.log(1 + cv**2))
          mu_ln = np.log(mean) - sigma_ln**2 / 2
          return rng.lognormal(mu_ln, sigma_ln / np.sqrt(sample_size), n_bootstrap)
  identifiability_notes: |
    Single parameter (phi_col_ref), single measurement. Algebraic
    identity (modulo unit conversion %->fraction). Fully identified.
    Joint inference with Wolf 2013 (d_pore_ref + phi_col_ref) and
    Rubiano 2018 (E_ref + n_stiff + phi_col_ref) targets sharpens
    the joint posterior on phi_col_ref through three independent
    physical relationships (pore-size scaling, stiffness power law,
    direct Sirius-red area).
