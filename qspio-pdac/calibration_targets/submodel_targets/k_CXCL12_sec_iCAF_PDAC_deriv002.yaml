calibration:
  parameters:
  - name: k_CXCL12_sec_iCAF
    units: nanomolarity * liter / (cell * day)
  - name: k_CXCL12_deg
    units: 1 / day
  - name: n_cells_culture
    units: cell
    nuisance: true
    prior:
      distribution: lognormal
      mu: 11.51
      sigma: 0.7
  - name: v_media_mL
    units: milliliter
    nuisance: true
    prior:
      distribution: lognormal
      mu: 0.69
      sigma: 0.5
  forward_model:
    type: algebraic
    formula: C_ss = k_CXCL12_sec_iCAF * n_cells * MW * 1e3 / (k_CXCL12_deg * V_mL)
    data_rationale: PSC conditioned media was collected after standard culture period (likely 48-72h based on lab protocols).
      With CXCL12 half-life ~8-12h (k_deg ~1.3-2/day from deriv001), the system approaches steady state within 24-48h. Individual
      patient values represent biological variability in CXCL12 secretion across PDAC-derived PSC preparations.
    submodel_rationale: 'Maps to the CXCL12 secretion reaction in fibroblast_module_enhanced.m: null -> V_T.CXCL12 with rate
      k_CXCL12_sec_iCAF * iCAF. At steady state: C = k_sec * N / (k_deg * V). Cell count and volume are nuisance parameters
      because the paper does not specify the ELISA culture conditions (plate format, seeding density, conditioning time).'
    code: "def compute(params, inputs):\n    import numpy as np\n    k_sec = params['k_CXCL12_sec_iCAF']\n    k_deg = params['k_CXCL12_deg']\n\
      \    n_cells = params['n_cells_culture']\n    v_mL = params['v_media_mL']\n    MW = inputs['CXCL12_MW_Da']\n\n    #\
      \ k_sec in nmol/(cell*day) = nM*L/(cell*day)\n    # At steady state: C_nM = k_sec * n_cells / (k_deg * V_L)\n    V_L\
      \ = v_mL / 1e3\n    C_nM = k_sec * n_cells / (k_deg * V_L)\n\n    # Convert nM to pg/mL: 1 nM = MW_Da pg/mL\n    C_pgml\
      \ = C_nM * MW\n\n    return C_pgml\n"
  error_model:
  - name: aPSC_CXCL12_concentration
    units: picogram / milliliter
    uses_inputs:
    - aPSC_CXCL12_patient1
    - aPSC_CXCL12_patient2
    - aPSC_CXCL12_patient3
    - aPSC_CXCL12_patient4
    - aPSC_CXCL12_patient5
    - aPSC_CXCL12_patient6
    - aPSC_CXCL12_patient7
    - n_patients
    sample_size_input: n_patients
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    # Use individual\
      \ patient values as bootstrap population\n    patient_values = np.array([\n        inputs['aPSC_CXCL12_patient1'],\n\
      \        inputs['aPSC_CXCL12_patient2'],\n        inputs['aPSC_CXCL12_patient3'],\n        inputs['aPSC_CXCL12_patient4'],\n\
      \        inputs['aPSC_CXCL12_patient5'],\n        inputs['aPSC_CXCL12_patient6'],\n        inputs['aPSC_CXCL12_patient7'],\n\
      \    ])\n    # Bootstrap: resample patients and take mean\n    indices = rng.integers(0, len(patient_values), size=(n_bootstrap,\
      \ sample_size))\n    return np.mean(patient_values[indices], axis=1)\n"
  identifiability_notes: 'Single steady-state measurement constrains k_sec * n_cells / (k_deg * V).

    With n_cells and V as nuisance parameters (wide priors), the effective

    constraint is on the ratio k_sec / k_deg scaled by the nuisance geometry.

    Joint inference with deriv001 (Saiman 2013 time course with known cell

    count and volume) resolves the degeneracy: deriv001 pins the absolute

    scale while this target provides the PDAC-specific biological variability.

    '
experimental_context:
  species: human
  system: in_vitro_primary_cells
  cell_lines: null
  cell_types:
  - name: activated pancreatic stellate cell
    source: human PDAC tumor resection/biopsy
    isolation_method: Primary PSCs isolated from PDAC patients, cultured on plastic with vehicle (ethanol) to maintain activated
      phenotype
  culture_conditions:
    medium: Standard PSC culture media (not specified in paper; see Froeling 2011 for lab protocol)
    duration: Conditioned media collected (duration not specified)
  indication: pancreatic_ductal_adenocarcinoma
study_interpretation: 'Primary activated PSCs from 7 PDAC patients secrete CXCL12 at 428-585

  pg/mL in conditioned media (mean ~502 pg/mL). This is significantly

  higher than quiescent PSCs (186-397 pg/mL), confirming that activation

  upregulates CXCL12 secretion. The inter-patient variability (CV ~10%)

  is modest, suggesting CXCL12 secretion is a conserved feature of

  activated PSCs across PDAC patients. Combined with the Saiman 2013

  time course (deriv001), this provides a PDAC-specific anchor for

  k_CXCL12_sec_iCAF.

  '
key_assumptions:
- Conditioned media represents near-steady-state CXCL12 (conditioning time >> CXCL12 half-life)
- 'Cell count and volume are standard PSC culture conditions (nuisance priors: ~1e5 cells, ~2 mL)'
- Activated PSCs on plastic are representative of iCAFs in PDAC stroma
- Individual patient scatter points are independent biological replicates
- CXCL12 degradation in conditioned media follows first-order kinetics
key_study_limitations:
- Cell count, media volume, and conditioning time not reported — treated as nuisance parameters
- 2D culture on plastic — does not recapitulate 3D TME
- No distinction between iCAF and myCAF subtypes — activated PSCs on plastic may represent a mixed phenotype
- Small sample (n=7 patients) — may not capture full inter-patient variability
- PS1 cell line results (Figure 7A) not used due to immortalization concerns
