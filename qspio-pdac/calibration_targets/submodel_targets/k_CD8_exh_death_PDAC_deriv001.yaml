calibration:
  parameters:
  - name: k_CD8_exh_death
    units: 1/day
    nuisance: false
  - name: tau_CD8_exh_apop
    units: day
    nuisance: true
    prior:
      distribution: lognormal
      mu: -1.1
      sigma: 1.5
  forward_model:
    data_rationale: "Miller2019 quantified the fraction of Annexin-V+ cells among\
      \ progenitor (Slamf6+Tim-3\u2212) and terminally exhausted (Slamf6\u2212Tim-3+)\
      \ PD-1+ CD8+ tumor-infiltrating T cells from B16-OVA melanoma at a single late\
      \ time point (~day 20). For terminally exhausted cells, ~70% of the population\
      \ stained Annexin-V+, indicating a high apoptotic fraction at quasi\u2013steady\
      \ state in the tumor microenvironment. This snapshot fractional occupancy is\
      \ used as an observable linked to the underlying death rate."
    submodel_rationale: "In the full QSP PDAC model, exhausted CD8 T cells (CD8_exh)\
      \ undergo first-order loss with rate k_CD8_exh_death via V_T.CD8_exh -> null.\
      \ If we assume that exhausted cells pass through an Annexin-V+ apoptotic phase\
      \ of characteristic duration tau_CD8_exh_apop before being cleared, then at\
      \ steady state the fraction of exhausted cells that are Annexin-V+ is approximately\
      \ f_apop \u2248 k_CD8_exh_death * tau_CD8_exh_apop. This algebraic submodel\
      \ preserves the same first-order death-rate parameterization as the QSP reaction\
      \ while introducing a nuisance parameter for the apoptotic-phase duration reflecting\
      \ general T cell biology (on the order of 6\u201312 hours)."
    type: algebraic
    formula: f_apop = 1 - exp(-k_CD8_exh_death * tau_CD8_exh_apop)
    code: "def compute(params, inputs):\n    import numpy as np\n    k = params['k_CD8_exh_death']\
      \      # 1/day\n    tau = params['tau_CD8_exh_apop']  # day\n    # Fraction\
      \ of exhausted CD8 T cells in Annexin-V+ apoptotic state\n    # Saturating form:\
      \ approaches 1 as k*tau grows large\n    f_apop = 1.0 - np.exp(-k * tau)\n\
      \    return f_apop\n"
  error_model:
  - name: f_apop_terminal_melanoma
    units: dimensionless
    uses_inputs:
    - AnnexinV_terminal_mean_percent
    - AnnexinV_terminal_sd_percent
    - n_mice
    - percent_to_fraction
    sample_size_input: n_mice
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean_percent = inputs['AnnexinV_terminal_mean_percent']\n\
      \    sd_percent = inputs['AnnexinV_terminal_sd_percent']\n    scale = inputs['percent_to_fraction']\n\
      \    mean = mean_percent * scale\n    sd = sd_percent * scale\n    # Parametric\
      \ bootstrap assuming approximately normal variation of the mean fraction across\
      \ mice\n    return rng.normal(mean, sd / np.sqrt(sample_size), n_bootstrap)\n"
    n_bootstrap: 10000
  identifiability_notes: "This target constrains the product k_CD8_exh_death * tau_CD8_exh_apop\
    \ via the observed Annexin-V+ fraction in terminally exhausted CD8+ TILs. Because\
    \ only a single observable (f_apop) is available, k_CD8_exh_death and tau_CD8_exh_apop\
    \ are not fully identifiable from this dataset alone. Identifiability is restored\
    \ by using a strong prior on the nuisance parameter tau_CD8_exh_apop based on\
    \ general T cell apoptosis kinetics (6\u201312 h). The posterior for k_CD8_exh_death\
    \ mainly reflects uncertainty in both the measured apoptotic fraction and the\
    \ assumed apoptotic-phase duration; additional targets involving longitudinal\
    \ decay of exhausted cells or direct lifespan measurements would further constrain\
    \ this rate."
experimental_context:
  species: mouse
  system: animal_in_vivo
  cell_lines:
  - name: B16-OVA
    species: mouse
    tissue_origin: skin (melanoma)
    cell_type: melanoma
    source: B16.F10 melanoma engineered to express ovalbumin (B16-OVA)
  cell_types:
  - name: CD8+ tumor-infiltrating lymphocytes
    phenotype: "PD-1+ exhausted subsets (progenitor Slamf6+Tim-3\u2212 and terminally\
      \ exhausted Slamf6\u2212Tim-3+)"
    isolation_method: Enzymatic digestion of B16-OVA tumors followed by density gradient
      enrichment and flow cytometric sorting
    source: Subcutaneous B16-OVA tumors in C57BL/6 mice
  indication: B16-OVA melanoma (proxy for PDAC exhausted CD8+ T cell kinetics)
study_interpretation: "Miller2019 showed that within PD-1+ CD8+ tumor-infiltrating\
  \ lymphocytes from B16-OVA melanoma, terminally exhausted cells (Slamf6\u2212Tim-3+)\
  \ exhibit markedly higher Annexin-V positivity (~70%) than progenitor exhausted\
  \ cells (Slamf6+Tim-3\u2212, ~40%). This indicates that terminally exhausted CD8+\
  \ T cells are highly prone to apoptosis and have a much shorter functional lifespan\
  \ in the tumor microenvironment. Interpreting the Annexin-V+ fraction at a late\
  \ time point as a quasi\u2013steady-state occupancy of a short-lived apoptotic phase,\
  \ and combining it with a characteristic apoptotic-phase duration from general T\
  \ cell biology, allows us to infer an approximate first-order death rate for the\
  \ exhausted CD8_exh compartment in the PDAC QSP model. Although melanoma and PDAC\
  \ differ in stromal architecture and degree of T cell exclusion, the intrinsic fragility\
  \ of terminally exhausted CD8+ T cells is expected to be broadly similar across\
  \ solid tumors, making this dataset a reasonable proxy for k_CD8_exh_death."
key_assumptions:
- Annexin-V+ staining in Miller2019 reflects a well-defined apoptotic phase for exhausted
  CD8+ T cells rather than reversible activation-induced phosphatidylserine exposure.
- "The B16-OVA tumors analyzed on day 20 are in a quasi\u2013steady state with respect\
  \ to exhausted CD8+ T cell turnover, so the instantaneous Annexin-V+ fraction approximates\
  \ the steady-state occupancy of the apoptotic phase."
- "The apoptotic (Annexin-V+) phase for exhausted CD8+ T cells has a characteristic\
  \ duration on the order of 6\u201312 hours; this is encoded as a lognormal prior\
  \ on the nuisance parameter tau_CD8_exh_apop."
- "Terminally exhausted Slamf6\u2212Tim-3+ PD-1+ CD8+ T cells in B16-OVA melanoma\
  \ are a good mechanistic proxy for the CD8_exh compartment in PDAC, even though\
  \ the absolute death rate may differ across tumor types."
- First-order kinetics with a single effective death rate k_CD8_exh_death adequately
  captures the net loss of exhausted CD8+ T cells from the tumor compartment in the
  QSP model.
key_study_limitations:
- "The tumor model is B16-OVA melanoma in mice, not PDAC; melanomas are typically\
  \ more T cell\u2013permissive and less desmoplastic than PDAC tumors, so absolute\
  \ death rates of exhausted CD8+ T cells may differ between indications."
- Apoptosis is assessed at a single time point (~day 20) using Annexin-V staining;
  without longitudinal data, we rely on a steady-state assumption to relate the apoptotic
  fraction to a death rate.
- Annexin-V positivity may include some non-apoptotic or early apoptotic cells, and
  does not directly measure the completion of cell death or clearance, potentially
  biasing the inferred rate.
- The duration of the Annexin-V+ apoptotic phase is not measured in this study and
  must be taken from general T cell biology, introducing additional uncertainty captured
  only through a prior on the nuisance parameter tau_CD8_exh_apop.
- Sample size is modest (n=5 mice), and the analysis is limited to one melanoma model
  and one time point; inter-tumor variability across models and species is not captured.
primary_data_source:
  doi: 10.1038/s41590-019-0312-6
  title: Subsets of exhausted CD8+ T cells differentially mediate tumor control and
    respond to checkpoint blockade
  year: 2019
  source_tag: Miller2019
  source_relevance:
    indication_match: proxy
    indication_match_justification: The study uses the B16-OVA mouse melanoma model,
      which differs from pancreatic ductal adenocarcinoma (PDAC) in tissue of origin,
      mutational landscape, and stromal architecture. Nevertheless, the work carefully
      defines progenitor versus terminally exhausted PD-1+ CD8+ TIL subsets using
      Tcf1/Slamf6/Tim-3 markers and provides subset-specific apoptosis measurements.
      These intrinsic properties of exhausted CD8+ T cells (high apoptotic propensity
      of terminally exhausted cells) are expected to be broadly similar across solid
      tumors, so B16-OVA melanoma serves as a mechanistic proxy for PDAC with additional
      translation uncertainty.
    species_source: mouse
    species_target: human
    source_quality: primary_animal_in_vivo
    perturbation_type: physiological_baseline
    perturbation_relevance: Mice bear untreated B16-OVA tumors; exhausted CD8+ TIL
      subsets are analyzed under baseline tumor-bearing conditions without pharmacological
      manipulation, providing a physiological snapshot of exhaustion and apoptosis.
    tme_compatibility: low
    tme_compatibility_notes: "B16-OVA melanoma forms relatively T cell\u2013permissive,\
      \ non-desmoplastic tumors, whereas PDAC is characterized by a dense fibrotic\
      \ stroma, strong immune exclusion, and prominent myCAF/iCAF populations. These\
      \ microenvironmental differences likely affect both the frequency and turnover\
      \ of exhausted CD8+ T cells, so the absolute death rate inferred from melanoma\
      \ may over- or under-estimate the rate in PDAC by up to an order of magnitude."
    measurement_directness: single_inversion
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: animal_in_vivo
