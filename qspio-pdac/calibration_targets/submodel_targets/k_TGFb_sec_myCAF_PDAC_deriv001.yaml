calibration:
  parameters:
  - name: k_TGFb_sec_myCAF
    units: nanomolarity*liter/(cell*day)
  forward_model:
    type: algebraic
    formula: production_fmol = k_TGFb_sec_myCAF [nmol/(cell*day)] * 1e6 [fmol/nmol]
    data_rationale: 'Bachem et al. 1992 measured TGFbeta1 production rates directly in

      fmol/cell/d from conditioned media of MFBLC (fully activated HSC

      myofibroblasts). The forward model converts the model parameter

      k_TGFb_sec_myCAF from nmol/(cell*day) to fmol/(cell*day) for direct

      comparison with the experimental measurement.

      '
    submodel_rationale: 'In the full model, k_TGFb_sec_myCAF appears in the reaction

      null -> V_T.TGFb with rate k_TGFb_sec_myCAF * V_T.myCAF. The

      parameter units are nM*L/(cell*day) = nmol/(cell*day). The per-cell

      secretion rate is the quantity directly measured by Bachem.

      '
    code: "def compute(params, inputs):\n    # k_TGFb_sec_myCAF in nM*L/(cell*day) = nmol/(cell*day)\n    # Convert to fmol/(cell*day):\
      \ multiply by 1e6\n    k = params['k_TGFb_sec_myCAF']\n    return k * 1e6\n"
  error_model:
  - name: tgfb1_secretion_mfblc
    units: fmol/(cell*day)
    uses_inputs:
    - tgfb1_production_rate_mfblc
    - tgfb1_production_rate_tc10d
    - tgfb1_production_rate_pl6d
    - n_cultures
    sample_size_input: n_cultures
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    # Three\
      \ activation-state measurements spanning quiescent to fully\n    # activated. MFBLC (0.20) is the target for myCAFs,\
      \ but the spread\n    # across states captures real biological variability in secretion.\n    vals = np.array([\n  \
      \      inputs['tgfb1_production_rate_pl6d'],\n        inputs['tgfb1_production_rate_tc10d'],\n        inputs['tgfb1_production_rate_mfblc'],\n\
      \    ])\n    # Bootstrap: resample with replacement from the 3 measured values\n    idx = rng.integers(0, len(vals),\
      \ size=n_bootstrap)\n    return vals[idx]\n"
  identifiability_notes: 'Single parameter (k_TGFb_sec_myCAF) constrained by one primary measurement

    (MFBLC TGFbeta1 production rate = 0.20 fmol/cell/d). The TC-10d intermediate

    value (0.13) provides a consistency check and informs the spread. Main

    uncertainty is in vitro to in vivo translation and species/organ extrapolation.

    '
