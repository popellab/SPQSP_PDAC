extraction_model: claude-opus-4-6
extraction_reasoning_effort: high
study_interpretation: 'Bachem et al. (1992) measured TGFbeta1 protein concentration in media conditioned

  by rat liver perisinusoidal lipocytes (PL, equivalent to quiescent HSCs) and

  myofibroblast-like cells (MFBLC, equivalent to fully activated HSCs/myofibroblasts)

  using competitive radioligand binding assays. TGFbeta1 was measured in transiently

  acidified conditioned media (to activate latent TGFbeta1) collected over 24 hours.


  TGFbeta1 production was undetectable in early PL (day 3) and increased to

  0.02 fmol/cell/d in PL at day 6, 0.13 fmol/cell/d in transitional cells (TC, day

  10), and 0.20 fmol/cell/d in fully transformed MFBLC (secondary culture). This

  progressive increase with activation state confirms that activated myofibroblasts

  are the dominant source of TGFbeta1.

  '
key_assumptions:
- 'MFBLC (secondary culture, 100% alpha-SMA+) represent the fully activated

  myofibroblast phenotype equivalent to model myCAFs. The TGFbeta1 production

  rate of 0.20 fmol/cell/d reflects the maximal secretion capacity under

  standard culture conditions.

  '
- 'Rat hepatic stellate cell TGFbeta1 secretion rates are representative of

  human pancreatic stellate cell / CAF secretion rates. HSCs and PSCs share

  TGFbeta1-driven activation biology and autocrine TGFbeta1 production.

  '
- 'The measurement captures total active TGFbeta1 (acid-activated from latent

  form). In vivo, only a fraction of secreted TGFbeta1 may be activated.

  '
- 'The per-cell production rate in fmol/cell/d maps directly to the model

  parameter k_TGFb_sec_myCAF after unit conversion (fmol -> nmol).

  '
key_study_limitations:
- 'Rat hepatic stellate cells, not human pancreatic CAFs. Species and organ

  differences in TGFbeta1 production rates may exist.

  '
- 'In vitro 2D culture on plastic with 10% FCS. In vivo secretion rates in

  the 3D tumor microenvironment may differ due to ECM interactions, hypoxia,

  and paracrine signaling.

  '
- 'TGFbeta1 measured after transient acidification of conditioned media, which

  activates all latent TGFbeta1. In vivo, latent TGFbeta1 activation is

  regulated and only a fraction becomes active.

  '
- 'Table II reports values as "the mean of two different cultures" without SD.

  The spread across activation states (PL-6d: 0.02, TC: 0.13, MFBLC: 0.20)

  provides a measure of biological variability.

  '
