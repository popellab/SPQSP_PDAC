extraction_model: claude-opus-4-6
study_interpretation: 'Erkan et al. (2009) measured VEGF secretion by primary human pancreatic stellate

  cells (PSCs) under normoxic and hypoxic conditions using ELISA. PSCs were isolated

  from fibrotic areas of resected PDAC tissues and cultured in six-well plates at

  200,000 cells/well in serum-free stellate cell medium for 24h. VEGF concentrations

  in supernatants were normalized to 100,000 cells.


  Under normoxia, PSCs secreted 346.6 pg/mL per 100,000 cells. Under hypoxia,

  secretion increased to 946.0 pg/mL per 100,000 cells (175 +/- 124% increase,

  consistent with text-reported value). PSCs were identified as the most potent

  VEGF producers, secreting more than double the amount of the most potent cancer

  cell line tested.


  The normoxic condition is relevant for constraining the model parameter

  k_vas_myCAF_sec, as the QSP model does not include hypoxia-dependent VEGF

  enhancement by CAFs. The culture-activated PSCs (alpha-SMA+) are the closest

  in vitro proxy for myCAFs.

  '
key_assumptions:
- 'Culture-activated PSCs (passage-activated, alpha-SMA+) are representative of

  myCAFs in the PDAC tumor microenvironment. PSCs isolated by outgrowth method

  spontaneously activate during culture, acquiring a myofibroblastic phenotype.

  '
- 'VEGF degradation in serum-free culture medium over 24h is negligible. VEGF-A165

  is stable in conditioned medium at 37C for at least 24h. The measured

  concentration directly reflects cumulative secretion.

  '
- 'Six-well plate volume is approximately 2 mL. Standard six-well plates use

  1.5-3 mL; 2 mL is the most common volume for stellate cell culture. This is

  treated as a nuisance parameter with an informative prior.

  '
- 'The "per 100,000 cells" normalization accounts for any proliferation or death

  during the 24h collection. The effective cell count contributing to VEGF

  secretion is 100,000 cells by construction of the normalization.

  '
key_study_limitations:
- 'Culture-activated PSCs differ from in vivo myCAFs. In vitro activation lacks

  the spatial gradients, immune interactions, and ECM stiffness cues of the TME.

  However, alpha-SMA expression confirms myofibroblastic differentiation.

  '
- 'Serum-free conditions may alter VEGF secretion compared to physiological

  conditions. Serum withdrawal is standard for secretome studies to avoid

  background interference but may stress cells.

  '
- 'Only normoxic data is used. In vivo PDAC stroma is hypoxic, which would

  increase VEGF secretion further (175% increase observed). The normoxic rate

  represents a lower bound for in vivo myCAF VEGF production.

  '
- 'Data reported as mean +/- SEM with n >= 3 different PSC clones. Inter-patient

  variability in PSC VEGF secretion may be substantial (SEM is ~42% of mean).

  '
