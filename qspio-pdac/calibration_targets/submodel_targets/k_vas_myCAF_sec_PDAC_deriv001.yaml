calibration:
  parameters:
  - name: k_vas_myCAF_sec
    units: picogram / (cell * day)
  - name: V_well_mL
    units: milliliter
    nuisance: true
    prior:
      distribution: lognormal
      mu: 0.693
      sigma: 0.2
  forward_model:
    type: algebraic
    formula: VEGF_norm = k_sec * cells_norm * time_days / V_well
    data_rationale: 'PSCs cultured for 24h in serum-free medium. VEGF accumulates in the

      supernatant with negligible degradation (VEGF-A165 is stable in culture

      medium at 37C). The measured concentration, normalized to 100,000 cells,

      directly constrains the per-cell secretion rate.

      '
    submodel_rationale: 'The QSP model reaction is: null -> V_T.VEGF at rate k_vas_myCAF_sec * V_T.myCAF.

      This is simple linear secretion with no Hill functions or gating terms.

      The in vitro batch accumulation directly maps to this rate constant.

      '
    code: "def compute(params, inputs):\n    import numpy as np\n    k_sec = params['k_vas_myCAF_sec']\n    V_well = params['V_well_mL']\n\
      \    cells_norm = inputs['cells_per_normalization']\n    time_days = inputs['collection_time'] / 24\n    # predicted\
      \ VEGF concentration normalized to 100k cells\n    conc_norm = k_sec * cells_norm * time_days / V_well\n    return conc_norm\n"
  error_model:
  - name: PSC_normoxia_VEGF
    units: picogram / milliliter
    uses_inputs:
    - PSC_normoxia_VEGF_mean
    - PSC_normoxia_VEGF_SEM
    - n_experiments
    sample_size_input: n_experiments
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['PSC_normoxia_VEGF_mean']\n    sem = inputs['PSC_normoxia_VEGF_SEM']\n    n = int(inputs['n_experiments'])\n\
      \    sd = sem * np.sqrt(n)\n    # Lognormal bootstrap: VEGF concentrations are positive\n    cv = sd / mean\n    return\
      \ rng.lognormal(np.log(mean), cv / np.sqrt(sample_size), n_bootstrap)\n"
  identifiability_notes: 'k_vas_myCAF_sec is the sole QSP parameter and is directly identifiable from

    the VEGF concentration measurement. The only degeneracy is with V_well_mL

    (nuisance): k_sec and V_well appear as k_sec/V_well, so an informative prior

    on V_well (standard six-well plate) resolves this. The ratio k_sec/V_well is

    tightly constrained regardless.

    '
