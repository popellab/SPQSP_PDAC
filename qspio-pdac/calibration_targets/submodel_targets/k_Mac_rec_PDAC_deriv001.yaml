- name: cd68_periph_median
  value: 71.5
  units: dimensionless
  input_type: direct_measurement
  source_ref: Chen2015
  source_location: Results, Section 3.1
  value_snippet: '71.5 (range: 13.0-198.0) in group C

    '
- name: cd68_periph_range_low
  value: 13.0
  units: dimensionless
  input_type: direct_measurement
  source_ref: Chen2015
  source_location: Results, Section 3.1
  value_snippet: '71.5 (range: 13.0-198.0) in group C

    '
- name: cd68_periph_range_high
  value: 198.0
  units: dimensionless
  input_type: direct_measurement
  source_ref: Chen2015
  source_location: Results, Section 3.1
  value_snippet: '71.5 (range: 13.0-198.0) in group C

    '
- name: n_pdac_patients
  value: 70
  units: dimensionless
  input_type: direct_measurement
  source_ref: Chen2015
  source_location: Methods, Section 2.1
  value_snippet: 'Of the 70 remaining PDAC patients

    '
- name: section_thickness
  value: 3.0
  units: micrometer
  input_type: direct_measurement
  source_ref: Chen2015
  source_location: Methods, Section 2.2
  value_snippet: 'were cut to a thickness of 3 um

    '
- name: hpf_area
  value: 0.196
  units: millimeter**2
  input_type: reference_value
  source_ref: Chen2015
  source_location: Methods, Section 2.2
  rationale: 'Standard HPF area for 400x magnification with FN22 eyepiece

    (field diameter 0.50 mm, area = pi * 0.25^2 = 0.196 mm^2).

    The Olympus CX-40 microscope is reported but exact eyepiece FN

    is not stated; FN22 is the most common standard.

    '
  value_snippet: 'light microscopy (Olympus CX-40: Olympus, Tokyo, Japan)

    '
- name: cell_diameter
  value: 20.0
  units: micrometer
  input_type: reference_value
  source_ref: Chen2015
  source_location: Standard cell-biology reference (Krombach 1997 PMID 9400735);
    applied here because Chen2015 reports raw mIHC counts without Abercrombie
    or optical-disector correction.
  rationale: 'Tissue macrophage diameter ~20 micrometer (Krombach 1997). Used
    as the Abercrombie overcounting term `d` in the 2D->3D projection: a cell
    whose center lies anywhere within a slab of thickness (t + d) intersects
    the section, so the effective counting volume is HPF_area * (t + d), not
    HPF_area * t. Without this correction, MCMC infers k_Mac_rec/k_death roughly
    (t+d)/t ~6x larger than the true volumetric density, which then over-predicts
    TAM density in the full model after the density-observable formula adopted
    the Abercrombie convention (PR #96).'
  value_snippet: 'CD68+ macrophages were counted in 5 random HPFs at 400x'
calibration:
  parameters:
  - name: k_Mac_rec
    units: cell/(milliliter*day)
  - name: k_Mac_death
    units: 1/day
  - name: k_M1_pol
    units: 1/day
  - name: k_M2_pol
    units: 1/day
  - name: H_CCL2_eff
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: -0.22
      sigma: 0.4
  - name: H_anti_inflam_eff
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: -0.36
      sigma: 0.5
  - name: H_pro_inflam_eff
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: -2.3
      sigma: 0.7
  forward_model:
    type: algebraic
    formula: 'CD68_per_HPF = (k_Mac_rec * H_CCL2 / k_Mac_death) * HPF_area_cm2 *
      (section_thickness + cell_diameter)_cm. The (t + d) factor is the Abercrombie
      effective slab — every cell whose center is within (t + d) of the section
      intersects it and gets counted, so the effective counting volume is
      HPF_area * (t + d), not HPF_area * t. Matches the convention used by
      APC0_cDC1_T / APC0_cDC2_T submodel targets and the V_T-based density
      observables under PR #96.

      '
    code: "def compute(params, inputs):\n    \"\"\"\n    Predict CD68+ macrophages per HPF at steady state.\n\n    At steady\
      \ state, total macrophage equations:\n      dM1/dt = k_Mac_rec*V_T*H_CCL2 - k_M2_pol*H_anti*M1 + k_M1_pol*H_pro*M2 -\
      \ k_death*M1 = 0\n      dM2/dt = k_M2_pol*H_anti*M1 - k_M1_pol*H_pro*M2 - k_death*M2 = 0\n    Adding: k_Mac_rec*V_T*H_CCL2\
      \ = k_death*(M1+M2)\n    => Total_Mac_density = k_Mac_rec * H_CCL2 / k_death  (cells per cm^3)\n\n    Convert to cells\
      \ per HPF using the Abercrombie-corrected effective slab thickness\n    (t + d), where d is the macrophage diameter\
      \ (Krombach 1997). Chen2015\n    reports raw mIHC counts without Abercrombie correction, so the forward\n    model uses\
      \ the inflated (t + d) counting volume to match the observed counts:\n      cells_per_HPF = Total_Mac_density * HPF_volume\n\
      \      HPF_volume = HPF_area * (section_thickness + cell_diameter)\n\n    Note: k_Mac_rec units are cell/(mL*day) = cell/(cm^3*day)\n\
      \    So k_Mac_rec/k_death gives cells/cm^3 directly (when H_CCL2 ~ 1).\n    \"\"\"\n    import numpy as np\n\n    k_rec\
      \ = params['k_Mac_rec']       # cell/(cm^3*day)\n    k_death = params['k_Mac_death']   # 1/day\n    k_M1 = params['k_M1_pol']\
      \         # 1/day (accessed for correlation)\n    k_M2 = params['k_M2_pol']         # 1/day (accessed for correlation)\n\
      \    H_CCL2 = params['H_CCL2_eff']     # dimensionless\n    H_anti = params['H_anti_inflam_eff']\n    H_pro = params['H_pro_inflam_eff']\n\
      \n    # Access polarization params for correlation structure\n    # They don't change the total (M1+M2) at steady state\n\
      \    # but are included for joint inference with ratio targets\n    _ = k_M1 + k_M2 + H_anti + H_pro\n\n    # Total macrophage\
      \ 3D density (cells/cm^3)\n    rho_total = k_rec * H_CCL2 / k_death\n\n    # HPF volume in cm^3 — Abercrombie-corrected\
      \ effective slab\n    hpf_area_cm2 = inputs['hpf_area'] / 100  # mm^2 -> cm^2\n    effective_thickness_um = inputs['section_thickness']\
      \ + inputs['cell_diameter']\n    effective_thickness_cm = effective_thickness_um / 10000\n    hpf_vol_cm3 = hpf_area_cm2\
      \ * effective_thickness_cm\n\n    # Cells per HPF\n    cells_per_hpf = rho_total * hpf_vol_cm3\n\n    return cells_per_hpf\n"
    data_rationale: 'Chen et al. report CD68+ TAM counts per HPF in peripheral regions

      of 70 PDAC tumors (median 71.5, range 13.0-198.0). The total

      macrophage density at steady state directly constrains the ratio

      k_Mac_rec / k_Mac_death, providing the absolute recruitment scale

      that the M2:M1 ratio targets (Gu2023, DeSimoni2023) cannot.

      '
    submodel_rationale: "In the QSP model, macrophage recruitment is:\n  rate = k_Mac_rec * V_T * CCL2/(CCL2+CCL2_50)\nAt\
      \ steady state, recruitment = death for total macrophages:\n  k_Mac_rec * H_CCL2 = k_Mac_death * (M1+M2)/V_T\nSo total\
      \ density = k_Mac_rec * H_CCL2 / k_Mac_death.\nThe HPF-to-volume conversion maps this to the observable.\n"
  error_model:
  - name: cd68_per_hpf_peripheral
    units: dimensionless
    uses_inputs:
    - cd68_periph_median
    - cd68_periph_range_low
    - cd68_periph_range_high
    - n_pdac_patients
    sample_size_input: n_pdac_patients
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    \"\"\"\n    Bootstrap CD68+ per\
      \ HPF from median and range.\n    Triangular distribution approximation (same approach as Gu2023).\n    \"\"\"\n   \
      \ import numpy as np\n    lo = inputs['cd68_periph_range_low']\n    med = inputs['cd68_periph_median']\n    hi = inputs['cd68_periph_range_high']\n\
      \    n = int(inputs['n_pdac_patients'])\n\n    # Triangular distribution matching median and range\n    patient_samples\
      \ = rng.triangular(lo, med, hi, n_bootstrap)\n\n    # Scale to population mean precision\n    log_samples = np.log(patient_samples)\n\
      \    mean_log = np.mean(log_samples)\n    sd_log = np.std(log_samples)\n\n    return rng.lognormal(mean_log, sd_log\
      \ / np.sqrt(n), n_bootstrap)\n"
  identifiability_notes: 'The total CD68+ density constrains k_Mac_rec / k_Mac_death (their ratio).

    k_Mac_death is shared with the M2:M1 ratio targets (Gu2023, DeSimoni2023),

    so joint inference can separately identify k_Mac_rec and k_Mac_death.

    H_CCL2_eff (nuisance) absorbs uncertainty in CCL2 saturation level.

    The polarization parameters (k_M1_pol, k_M2_pol) are included for

    correlation structure but do not affect the total macrophage count

    (they only redistribute between M1 and M2).'
