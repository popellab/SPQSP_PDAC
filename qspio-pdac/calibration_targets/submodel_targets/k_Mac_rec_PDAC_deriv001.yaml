target_id: k_Mac_rec_Chen2015_CD68_PDAC_IHC
tags:
- ai-generated
- macrophage-module
extraction_model: claude-opus-4-6
study_interpretation: 'Chen et al. (2015) performed IHC for CD68 (pan-macrophage) and CD163

  (M2-specific) on 70 PDAC specimens and 13 chronic pancreatitis specimens.

  Macrophages were counted separately in central and peripheral tumor areas

  at 400x magnification (3 random HPFs per region). Peripheral CD68+ TAM

  counts in PDAC (median 71.5, range 13.0-198.0 per HPF) were significantly

  higher than central counts (median 30.5, range 5.7-93.0, p<0.001).


  The peripheral CD68+ density constrains k_Mac_rec (the macrophage

  recruitment rate) via a steady-state balance with k_Mac_death. At steady

  state: total macrophage 3D density = k_Mac_rec * H_CCL2 / k_Mac_death.

  Converting HPF counts to volumetric density requires the HPF area and

  section thickness.

  '
key_assumptions:
- 'CD68+ cells represent the total tumor-associated macrophage population

  (both M1 and M2 subtypes) in the QSP model. CD68 is a pan-macrophage

  marker expressed by both polarization states.

  '
- 'Peripheral tumor regions are more representative of the well-mixed QSP

  model tumor compartment than central necrotic regions where macrophage

  counts are lower due to poor vascularization.

  '
- 'At surgical resection, macrophage numbers are in quasi-steady state:

  recruitment approximately balances death. This gives the algebraic

  relationship Total_Mac = k_Mac_rec * H_CCL2 / k_Mac_death.

  '
- 'CCL2 in established PDAC is sufficiently high that the recruitment Hill

  term H_CCL2 = CCL2/(CCL2 + CCL2_50) is near saturation (treated as a

  nuisance parameter).

  '
- 'The HPF area for the Olympus CX-40 at 400x with a standard FN22 eyepiece

  is approximately 0.196 mm^2. This is a standard microscopy reference value.

  '
key_study_limitations:
- 'Only medians and ranges are reported (not means and SDs). The range-based

  bootstrap approximates but does not exactly recover the patient-level

  distribution.

  '
- 'Section thickness (3 um) is thinner than typical (5 um), which may

  slightly affect cell detection per section. This is handled by including

  section thickness explicitly in the forward model.

  '
- 'Single-center Chinese cohort. PDAC TAM density may vary across populations

  though the large sample size (n=70) provides good statistical power.

  '
- 'CD68 counts in 3 random HPFs per region may not capture full intra-tumoral

  heterogeneity. The peripheral region was selected as more representative

  of the vascularized, actively recruited tumor compartment.

  '
- 'HPF area depends on the specific eyepiece field number. The Olympus CX-40

  microscope''s exact eyepiece is not reported. A standard FN22 is assumed.

  '
experimental_context:
  species: human
  system: human_clinical_tissue
  cell_types:
  - name: tumor-associated macrophages
    phenotype: 'CD68+ macrophages (pan-macrophage marker) in peripheral tumor areas

      of resected PDAC, counted by IHC on FFPE sections.

      '
    isolation_method: 'IHC on 3 um FFPE sections. CD68 (clone PG-M1, Dako, 1:50).

      Counted in 3 random HPFs at 400x per tumor region. Olympus CX-40.

      '
  culture_conditions: null
  indication: pancreatic ductal adenocarcinoma
primary_data_source:
  doi: 10.3747/co.22.2150
  title: 'Distribution and clinical significance of tumour-associated macrophages

    in pancreatic ductal adenocarcinoma: a retrospective analysis in China

    '
  authors:
  - Chen
  - Zhang
  - Zeng
  - Lian
  - Li
  - Qian
  - Chen
  - Chen
  - Huang
  year: 2015
  source_tag: Chen2015
  source_relevance:
    indication_match: exact
    indication_match_justification: 'Direct IHC of resected human PDAC tissue (n=70). CD68+ counts reflect

      total TAM density in the native PDAC tumor microenvironment.

      '
    species_source: human
    species_target: human
    source_quality: primary_human_clinical
    perturbation_type: pathological_state
    perturbation_relevance: 'Untreated resectable PDAC at surgery. Macrophage counts reflect the

      pathological steady state of the PDAC TME.

      '
    tme_compatibility: high
    tme_compatibility_notes: 'Resected human PDAC tissue directly captures the desmoplastic,

      immunosuppressive TME. Peripheral tumor regions are well-vascularized

