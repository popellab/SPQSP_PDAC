study_interpretation: 'Bachem et al. (1992) measured BrdU incorporation (% BrdU+ cells after 24h

  labeling) in rat liver perisinusoidal lipocytes (PL, quiescent HSCs) at 3

  and 7 days of primary culture, and in myofibroblast-like cells (MFBLC,

  fully activated HSCs) at various fetal calf serum (FCS) concentrations.

  MFBLC at 10% FCS showed 60+/-15.0% BrdU+ cells, while PL at 3 days with

  10% FCS showed 46+/-6.2%. Even without serum (0% FCS), MFBLC maintained

  21+/-4.6% BrdU incorporation, demonstrating substantial autocrine-driven

  proliferation in fully activated myofibroblasts.


  The BrdU labeling fraction over 24 hours relates to the proliferation rate

  constant via f_BrdU = 1 - exp(-k_prolif * t_label). For MFBLC at 10% FCS,

  60% BrdU+ implies k_prolif ~ 0.92/day. At 0% FCS (no exogenous growth

  factors), 21% BrdU+ implies k_prolif ~ 0.24/day as a basal rate.


  In the PDAC model, myCAF proliferation is PDGF-gated via a Hill function.

  The 10% FCS condition provides saturating growth factors (including PDGF)

  and thus constrains the maximal proliferation rate k_myCAF_prolif. The

  0% FCS condition constrains the basal/autocrine proliferation component.

  '
key_assumptions:
- 'MFBLC (secondary culture, 100% alpha-SMA+) represent the fully activated

  myofibroblast phenotype equivalent to model myCAFs.

  '
- 'The relationship between BrdU labeling fraction and proliferation rate

  is f_BrdU = 1 - exp(-k_prolif * t_label), assuming exponential growth

  during the 24-hour labeling period and that all S-phase cells incorporate

  BrdU. This assumes the S-phase duration is short relative to the cell

  cycle, which is standard for BrdU assays.

  '
- 'The 10% FCS condition provides near-saturating levels of PDGF and other

  mitogens, so the measured proliferation rate approximates k_myCAF_prolif

  at maximal PDGF stimulation (Hill term ~ 1).

  '
- 'Rat hepatic stellate cell / myofibroblast proliferation rates are

  representative of human pancreatic CAF proliferation rates.

  '
key_study_limitations:
- 'Rat hepatic stellate cells on 2D plastic, not human PDAC CAFs in vivo.

  In vitro proliferation on rigid substrates with serum may be faster than

  in the 3D tumor microenvironment.

  '
- 'BrdU incorporation measures S-phase entry, not net proliferation (does

  not account for concurrent cell death). Net growth rate may be lower

  than the gross proliferation rate inferred from BrdU.

  '
- 'The 10% FCS condition contains multiple growth factors beyond PDGF.

  The measured rate reflects the combined mitogenic stimulus, not

  PDGF-specific proliferation.

  '
- 'MFBLC are passaged cells (secondary culture) which may have higher

  proliferative capacity than primary activated stellate cells in vivo.

  '
