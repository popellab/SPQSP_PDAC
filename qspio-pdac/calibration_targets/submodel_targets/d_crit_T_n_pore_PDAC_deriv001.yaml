target_id: d_crit_T_n_pore_PDAC_deriv001
study_interpretation: 'T cell transmigration through rigid polycarbonate filters decreases sharply between 5 um and 1 um pore
  diameter, with ~90% inhibition at 3 um. This constrains the critical pore diameter for T cell physical arrest at approximately
  3-4 um (consistent with the reported nuclear compression limit of ~10% of relaxed cross-section, i.e., 3 um^2 from 30 um^2).
  Both d_crit_T and n_pore are exposed for joint calibration with collagen gel migration data which will refine n_pore downward.

  '
key_assumptions:
- Concanavalin A-stimulated T blasts are representative of activated TILs
- Nuclear deformability is the rate-limiting physical constraint
- Filter pore arrest threshold transfers to collagen pore arrest threshold
- Hill function adequately captures the pore-size exclusion relationship
key_study_limitations:
- Rigid cylindrical pores vs irregular 3D collagen pore geometry
- CD4+ T blasts only; CD8+ TILs may have slightly different nuclear mechanics
- 2D transmigration vs 3D interstitial migration
- Short assay duration (5h for T blasts) may not capture slower migration modes
- n=3-5 per condition limits statistical power
experimental_context:
  species: human
  system: in_vitro_primary_cells
  cell_types:
  - name: CD4+ T blasts
    source: peripheral blood from healthy donors
    isolation_method: 'Positive immunomagnetic separation using anti-CD4+ mAb and Dynabeads. Purity >95% by flow cytometry.
      Stimulated with 1.25 ug/ml concanavalin A for 48h prior to transmigration assay.

      '
  culture_conditions:
    medium: T-cell medium (TCM; RPMI 1640 supplemented with Hepes, L-glutamine, 2-mercaptoethanol, nonessential amino acids)
    supplements: 100 U/ml IL-2, 10% FCS
    duration: 48h stimulation, then 5h transmigration assay
  indication: general_immunology
primary_data_source:
  doi: 10.1083/jcb.201210152
  source_tag: Wolf2013
  title: 'Physical limits of cell migration: Control by ECM space and nuclear deformation and tuning by proteolysis and traction
    force'
  year: 2013
  source_relevance:
    indication_match: proxy
    indication_match_justification: 'T cell physical migration limits are cell-intrinsic (nuclear size and deformability)
      and not disease-specific. The arrest threshold measured in healthy donor T blasts applies to tumor-infiltrating T cells
      in PDAC. The main uncertainty is whether chronic activation/exhaustion in the TME alters nuclear mechanics (limited
      evidence for this).

      '
    species_source: human
    species_target: human
    source_quality: primary_human_in_vitro
    perturbation_type: physiological_baseline
    perturbation_relevance: 'Spontaneous transmigration of concanavalin A-activated T blasts through polycarbonate filters.
      No pharmacological or genetic perturbation applied to the transmigration assay itself. Concanavalin A activation mimics
      TCR-stimulated T cell blasting which increases motility and deformability.

      '
    measurement_directness: direct
    temporal_resolution: endpoint_pair
    experimental_system: in_vitro_primary
    tme_compatibility: moderate
    tme_compatibility_notes: In vitro filter assay captures intrinsic cell physical limits but not TME-specific factors (chemokine
      gradients, ECM composition, stromal cell interactions). The physical arrest threshold is expected to be conserved but
      the effective transition sharpness in heterogeneous collagen may differ (n_pore lower in vivo than in filter assay).
secondary_data_sources: []
