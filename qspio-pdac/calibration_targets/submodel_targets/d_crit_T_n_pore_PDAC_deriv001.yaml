calibration:
  parameters:
  - name: d_crit_T
    units: micrometer
  - name: n_pore
    units: dimensionless
  forward_model:
    type: algebraic
    formula: transmigration = (d_pore / d_crit_T)^n_pore / (1 + (d_pore / d_crit_T)^n_pore)
    code: "def compute(params, inputs):\n    d_crit = params['d_crit_T']\n    n = params['n_pore']\n\
      \    norm = inputs['normalization_factor']\n    d_pore = inputs['_x']  # injected\
      \ per error model entry via x_input\n    # Numerically stable sigmoid: avoids overflow\
      \ in ratio**n for large n\n    log_ratio_n = n * np.log(d_pore / d_crit)\n    #\
      \ sigmoid(x) = 1/(1+exp(-x)), stable for all x\n    transmigration = 1.0 / (1.0\
      \ + np.exp(-log_ratio_n))\n    return transmigration * norm\n"
    data_rationale: 'Transwell filter transmigration assay with precisely manufactured polycarbonate pores (5, 3, 1, 0.45
      um diameter). CD4+ T blasts stimulated with concanavalin A. Transmigration normalized to 5 um pores as 100%. n=3-5 independent
      experiments per condition.

      '
    submodel_rationale: 'The full QSP model uses H_pore_T = 1/(1+(d_pore/d_crit_T)^n_pore). This submodel constrains both
      d_crit_T (physical arrest threshold) and n_pore (transition sharpness). The filter data has rigid uniform pores so it
      will favor high n_pore (~15); joint calibration with collagen gel data (Sapudom, Wolf Fig 6A) will pull n_pore toward
      lower values reflecting pore size heterogeneity in real tissue.

      '
  error_model:
  - name: transmigration_at_5um
    units: percent
    x_input: pore_diameter_5um
    uses_inputs:
    - transmigration_5um
    - transmigration_5um_sd
    - normalization_factor
    - n_experiments
    sample_size_input: n_experiments
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['transmigration_5um']\n    sd = inputs['transmigration_5um_sd']\n    n = int(inputs['n_experiments'])\n   \
      \ # Bootstrap: 5 um is the normalization reference (100 +/- 15%)\n    return rng.normal(mean, sd / np.sqrt(n), size=n_bootstrap)\n"
  - name: transmigration_at_3um
    units: percent
    x_input: pore_diameter_3um
    uses_inputs:
    - transmigration_3um
    - transmigration_3um_sd
    - transmigration_5um
    - transmigration_5um_sd
    - normalization_factor
    - detection_floor
    - n_experiments
    sample_size_input: n_experiments
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean_3um\
      \ = inputs['transmigration_3um']\n    sd_3um = inputs['transmigration_3um_sd']\n    mean_5um = inputs['transmigration_5um']\n\
      \    sd_5um = inputs['transmigration_5um_sd']\n    norm = inputs['normalization_factor']\n    floor = inputs['detection_floor']\n\
      \    n = int(inputs['n_experiments'])\n    # Bootstrap: resample normalized transmigration at 3 um\n    bootstrap =\
      \ np.zeros(n_bootstrap)\n    for i in range(n_bootstrap):\n        ref = rng.normal(mean_5um, sd_5um / np.sqrt(n))\n\
      \        obs = rng.normal(mean_3um, sd_3um / np.sqrt(n))\n        bootstrap[i] = max(obs / ref * norm, floor)\n    return\
      \ bootstrap\n"
  - name: transmigration_at_1um
    units: percent
    x_input: pore_diameter_1um
    uses_inputs:
    - transmigration_1um
    - censored_obs_sd_pct
    - n_experiments
    sample_size_input: n_experiments
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n\
      \    sd = inputs['censored_obs_sd_pct']\n\
      \    # Censored: signal at/below detection. Half-normal centered at 0\n\
      \    return np.abs(rng.normal(0, sd, size=n_bootstrap))\n"
  identifiability_notes: 'All 3 pore sizes (5, 3, 1 um) are used as error model entries. The 3 um point (transition region)
    is most informative for the d_crit_T/n_pore tradeoff. The 5 um point (100% reference) anchors the upper asymptote. The
    1 um point (~0%) constrains the lower tail and prevents n_pore from being too low. Together they over-determine the 2-parameter
    Hill function, breaking the d_crit/n_pore degeneracy that exists with a single point.

    '
