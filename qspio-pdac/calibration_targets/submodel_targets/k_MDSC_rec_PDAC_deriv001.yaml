    '
calibration:
  parameters:
  - name: k_MDSC_rec
    units: cell/(milliliter*day)
  - name: k_MDSC_death
    units: 1/day
  - name: H_CCL2_MDSC_eff
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: -0.22
      sigma: 0.4
  - name: H_IL6_MDSC_eff
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 0.0
      sigma: 0.5
  - name: total_cell_density
    units: cell/milliliter
    nuisance: true
    prior:
      distribution: lognormal
      mu: 20.72
      sigma: 0.7
  - name: r_LLC_B16
    units: dimensionless
    nuisance: true
    prior:
      distribution: lognormal
      mu: 0.55
      sigma: 0.3
  forward_model:
    type: algebraic
    formula: 'B16: MDSC_frac = k_rec * H_CCL2 * (1+H_IL6) / (k_death * rho) * 100;
      LLC: same * r_LLC_B16'
    code: "def compute(params, inputs):\n    k_rec = params['k_MDSC_rec']\n    k_death = params['k_MDSC_death']\n\
      \    H_CCL2 = params['H_CCL2_MDSC_eff']\n    H_IL6 = params['H_IL6_MDSC_eff']\n    rho_total = params['total_cell_density']\n\
      \    r_llc = params['r_LLC_B16']\n\n    mdsc_density = k_rec * H_CCL2 * (1 + H_IL6) / k_death\n    frac_b16 = mdsc_density\
      \ / rho_total * 100\n    return {'b16': frac_b16, 'llc': frac_b16 * r_llc}\n"
    data_rationale: 'Hong et al. report 8.1% +/- 2.4% Gr1+/CD11b+ MDSCs in control B16

      tumors (n=10-15, mean +/- SD by flow cytometry). LLC tumors show

      14.1% +/- 4.1%. Both conditions provide independent measurements

      of baseline MDSC fraction in established solid tumors.

      '
    submodel_rationale: "In the QSP model, MDSC recruitment is:\n  rate = k_MDSC_rec * V_T * (CCL2/(CCL2+CCL2_50)) * (1+H_IL6_MDSC)\n\
      At steady state: MDSC_density = k_MDSC_rec * H_CCL2 * (1+H_IL6) / k_MDSC_death.\nThe fraction observable (MDSC_density\
      \ / total_cell_density) constrains\nthe ratio k_MDSC_rec / (k_MDSC_death * total_cell_density).\n"
  error_model:
  - name: mdsc_fraction_b16
    units: percent
    uses_inputs:
    - mdsc_fraction_b16_control
    - mdsc_fraction_b16_sd
    - n_b16_control
    sample_size_input: n_b16_control
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    b16_mean\
      \ = inputs['mdsc_fraction_b16_control']\n    b16_sd = inputs['mdsc_fraction_b16_sd']\n    n = int(inputs['n_b16_control'])\n\
      \    cv = b16_sd / b16_mean\n    return rng.lognormal(\n        np.log(b16_mean),\n        cv / np.sqrt(n),\n        n_bootstrap\n\
      \    )\n"
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['b16']\n"
  - name: mdsc_fraction_llc
    units: percent
    uses_inputs:
    - mdsc_fraction_llc_control
    - mdsc_fraction_llc_sd
    - n_b16_control
    sample_size_input: n_b16_control
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    llc_mean\
      \ = inputs['mdsc_fraction_llc_control']\n    llc_sd = inputs['mdsc_fraction_llc_sd']\n    n = int(inputs['n_b16_control'])\n\
      \    cv = llc_sd / llc_mean\n    return rng.lognormal(\n        np.log(llc_mean),\n        cv / np.sqrt(n),\n        n_bootstrap\n\
      \    )\n"
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['llc']\n"
  identifiability_notes: 'The MDSC fraction constrains k_MDSC_rec / (k_MDSC_death *

    total_cell_density). With total_cell_density as nuisance (broad prior)

    and k_MDSC_death from the CSV prior, k_MDSC_rec is the primary

    parameter constrained. Two tumor models (B16 8.1%, LLC 14.1%) provide

    independent observations; the 1.7x difference reflects cross-tumor

    variability in MDSC recruitment. H_CCL2 and H_IL6 nuisance terms

    absorb uncertainty in the effective chemokine drive.

    '
