target_id: k_MDSC_rec_Hong2015_B16_MDSC_fraction
tags:
- ai-generated
- mdsc-module
extraction_model: claude-opus-4-6
study_interpretation: 'Hong et al. (2015) quantified Gr1+/CD11b+ myeloid-derived suppressor cells

  by flow cytometry in subcutaneous B16 melanoma and LLC tumors grown in

  control and pericyte-deficient (pdgfb-ret/ret) mice. In control B16 tumors,

  MDSCs comprised 8.1% +/- 2.4% of total viable tumor cells (n=10-15, mean

  +/- SD). In control LLC tumors, MDSCs were 14.1% +/- 4.1%. The control B16

  condition provides a baseline MDSC fraction in an established solid tumor

  that constrains the recruitment-death balance for MDSCs.

  '
key_assumptions:
- 'B16 melanoma tumors at 2-3 weeks post-inoculation are in quasi-steady

  state with respect to MDSC numbers, with recruitment approximately

  balancing death/egress.

  '
- 'Gr1+/CD11b+ cells identified by flow cytometry correspond to the MDSC

  population represented in the QSP model. Both granulocytic (Ly6G+) and

  monocytic (Ly6C+) subsets are included.

  '
- 'CCL2-driven recruitment in established B16 tumors is near saturation

  (H_CCL2 approximately 1), and IL-6 enhancement is moderate (H_IL6_MDSC

  treated as nuisance). At steady state: MDSC fraction =

  k_MDSC_rec * H_CCL2 * (1 + H_IL6) / (k_MDSC_death * total_cell_density).

  '
- 'The total viable cell density in B16 tumors can be approximated from

  standard oncology estimates (~10^8-10^9 cells/mL for solid tumors).

  This is treated as a nuisance parameter.

  '
key_study_limitations:
- 'B16 melanoma is highly immunogenic and T cell-permissive, unlike PDAC

  which has dense desmoplastic stroma. MDSC recruitment dynamics may differ

  due to different chemokine profiles and vascular architecture.

  '
- 'Flow cytometry measures % of viable cells, not absolute density. The

  conversion to absolute MDSC density (needed for k_MDSC_rec) requires

  an estimate of total cell density, introducing additional uncertainty.

  '
- 'Tumors were harvested at 2-3 weeks; the exact timing and tumor size at

  harvest are not reported, introducing variability in the steady-state

  assumption.

  '
- 'Only two tumor models (B16 melanoma and LLC lung carcinoma) were studied.

  Neither is PDAC, so cross-indication translation uncertainty is substantial.

  '
experimental_context:
  species: mouse
  system: in_vivo_syngeneic_tumor_model
  cell_lines:
  - name: B16
    species: mouse
    tissue_origin: skin
    cell_type: melanoma
  cell_types:
  - name: myeloid-derived suppressor cells
    phenotype: Gr1+/CD11b+ (includes granulocytic Ly6G+ and monocytic Ly6C+ subsets)
    isolation_method: 'Flow cytometry on single-cell suspensions from digested tumors.

      Anti-CD16/32 Fc block, then Gr1, CD45, CD11b antibodies.

      '
  culture_conditions: null
  indication: murine melanoma (solid tumor)
primary_data_source:
  doi: 10.1093/jnci/djv209
  title: 'Role of Tumor Pericytes in the Recruitment of Myeloid-Derived

    Suppressor Cells

    '
  authors:
  - Hong
  - Tobin
  - Rundqvist
  - Li
  - Lavergne
  - Garcia-Ibanez
  - Qin
  - Paulsson
  - Zeitelhofer
  - Adzemovic
  - Nilsson
  - Roswall
  - Hartman
  - Johnson
  - Ostman
  - Bergh
  - Poljakovic
  - Genove
  year: 2015
  source_tag: Hong2015
  source_relevance:
    indication_match: proxy
    indication_match_justification: 'B16 melanoma provides quantitative MDSC fraction data in an established

      solid tumor. While tumor type differs from PDAC, CCL2-driven MDSC

      recruitment is conserved across solid tumors. PDAC may have higher

      MDSC recruitment due to elevated IL-6 from iCAFs, but the baseline

      CCL2-dependent component is similar.

      '
    species_source: mouse
    species_target: human
    source_quality: primary_animal_in_vivo
    perturbation_type: pathological_state
    perturbation_relevance: 'Control (wild-type pericyte) B16 tumors at 2-3 weeks. The MDSC fraction

      reflects the pathological steady state of the tumor microenvironment

      without genetic perturbation.

      '
    tme_compatibility: low
    tme_compatibility_notes: 'B16 melanoma has different stromal architecture than PDAC. PDAC has

      dense desmoplastic stroma that may alter absolute MDSC recruitment

      rates. However, the MDSC fraction as % of viable cells provides a

      dimensionless constraint that partially cancels out absolute density

      differences.

      '
    measurement_directness: steady_state_inversion
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: animal_in_vivo
