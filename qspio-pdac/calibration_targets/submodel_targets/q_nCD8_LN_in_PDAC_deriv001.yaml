calibration:
  parameters:
    - name: q_nCD8_LN_in
      units: "1/day"

  forward_model:
    type: algebraic
    formula: "q_in = q_out * ratio"
    code: |
      def compute(params, inputs):
          return params['q_nCD8_LN_in']
    data_rationale: "At steady state, q_nCD8_LN_in = q_nCD8_LN_out × ratio_LN_blood. The parameter directly equals the derived entry rate."
    submodel_rationale: "The QSP model uses q_nCD8_LN_in as a first-order rate constant for V_C.nCD8 → V_LN.nCD8. At homeostasis this must balance exit."

  error_model:
    - name: naive_CD8_entry_rate
      units: "1/day"
      uses_inputs: [dwell_time_mean, dwell_time_sd, hours_per_day, ratio_LN_blood, ratio_LN_blood_sd]
      sample_size_input: n_experiments
      observation_code: |
        def derive_observation(inputs, sample_size, rng, n_bootstrap):
            import numpy as np
            dt_mean = inputs['dwell_time_mean']
            dt_sd = inputs['dwell_time_sd']
            hpd = inputs['hours_per_day']
            ratio_mu = inputs['ratio_LN_blood']
            ratio_sd = inputs['ratio_LN_blood_sd']
            # Dwell time: lognormal (positive)
            log_dt_mu = np.log(dt_mean**2 / np.sqrt(dt_sd**2 + dt_mean**2))
            log_dt_sigma = np.sqrt(np.log(1 + (dt_sd / dt_mean)**2)) / np.sqrt(sample_size)
            dt_samples = rng.lognormal(log_dt_mu, log_dt_sigma, n_bootstrap)
            exit_rates = hpd / dt_samples
            # Ratio: beta (bounded 0-1)
            nu = ratio_mu * (1 - ratio_mu) / ratio_sd**2 - 1
            a = ratio_mu * nu
            b = (1 - ratio_mu) * nu
            ratio_samples = rng.beta(a, b, n_bootstrap)
            return exit_rates * ratio_samples

  identifiability_notes: |
    This target constrains q_nCD8_LN_in via a steady-state balance equation.
    The parameter is directly equated to q_nCD8_LN_out × ratio_LN_blood.
    The exit rate contributes the larger uncertainty (mouse→human species gap),
    while the ratio uncertainty is smaller (human data, but model assumption).
    In the full QSP model, q_nCD8_LN_in interacts with q_nCD8_LN_out,
    k_nCD8_death, and k_nCD8_pro to determine steady-state naive CD8 counts
    in blood vs LN.

primary_data_source:
  doi: "10.1073/pnas.1211717109"
  title: "Quantification of lymph node transit times reveals differences in antigen surveillance strategies of naïve CD4+ and CD8+ T cells"
  authors:
    - "Jens N. Mandl"
    - "Reinhard Liber"
    - "Sunny H. Kim"
    - "Katelyn Joshi"
    - "Ronald N. Germain"
  year: 2012
  source_tag: Mandl2012
  source_relevance:
    indication_match: proxy
    indication_match_justification: "Mouse LN transit data used as proxy for human PDAC model. The fundamental biophysics of T cell trafficking through LN HEVs is conserved across species, though absolute rates may differ."
    species_source: mouse
    species_target: human
    source_quality: primary_animal_in_vivo
    perturbation_type: pharmacological
    perturbation_relevance: "Anti-L-selectin antibody blockade of LN entry was used to measure exit kinetics. The perturbation reveals the exit rate without affecting it, as it blocks new entry but does not alter egress of cells already in the LN."
    tme_compatibility: low
    tme_compatibility_notes: "Healthy mouse LNs, not tumor-draining. PDAC tumor-draining LNs may have altered HEV structure and trafficking. However, this parameter governs naive CD8 entry which occurs before tumor engagement."
    measurement_directness: single_inversion
    temporal_resolution: timecourse
    experimental_system: animal_in_vivo

