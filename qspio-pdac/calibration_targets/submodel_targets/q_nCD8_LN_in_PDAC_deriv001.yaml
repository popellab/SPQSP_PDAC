    source_relevance:
      indication_match: proxy
      indication_match_justification: "Healthy human blood counts as proxy for PDAC patients. Baseline naive CD8 counts are expected to be similar in untreated PDAC patients, as the naive compartment is maintained by thymic output and homeostatic proliferation independent of the tumor."
      species_source: human
      species_target: human
      source_quality: primary_human_clinical
      perturbation_type: physiological_baseline
      perturbation_relevance: "Unperturbed baseline counts from healthy donors, directly applicable to the model's homeostatic steady state."
      tme_compatibility: moderate
      tme_compatibility_notes: "Blood counts, not tumor-draining LN. The ratio of LN:blood naive CD8 is a model assumption (0.05), not directly measured from paired blood/LN samples."
      measurement_directness: direct
      temporal_resolution: snapshot_or_equilibrium
      experimental_system: clinical_in_vivo

