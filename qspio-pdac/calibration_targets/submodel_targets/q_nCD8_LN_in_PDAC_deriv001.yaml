target_id: q_nCD8_LN_in

study_interpretation: |
  The naive CD8 T cell entry rate into the lymph node (q_nCD8_LN_in) is derived from
  a steady-state balance between LN entry and exit fluxes. At homeostasis, the influx
  of naive CD8 T cells into the LN equals the efflux: q_nCD8_LN_in × nCD8_C =
  q_nCD8_LN_out × nCD8_LN. Rearranging: q_nCD8_LN_in = q_nCD8_LN_out × (nCD8_LN / nCD8_C).

  The exit rate q_nCD8_LN_out = 1.8/day comes from Mandl et al. (2012), who measured
  naive CD8 T cell lymph node transit times in mice (~13h mean dwell time after
  anti-L-selectin blockade of entry, giving k_exit = ln(2)/t_half ≈ 1.1/day, or
  1/mean_dwell ≈ 1.8/day). The LN:blood ratio of 0.05 comes from Autissier et al.
  (2010), who quantified naive CD8 T cell densities in human peripheral blood
  (median 505 cells/µL, range 410–825) and from the model's assumption that ~5%
  of circulating naive CD8 reside in the effective draining LN at any time.

  This derivation assumes: (1) homeostatic steady state with negligible net
  proliferation or death during a single transit cycle, (2) the mouse exit rate
  translates to humans, and (3) the single effective LN compartment in the QSP
  model captures the aggregate behavior of multiple physiologic LNs.

key_assumptions:
  - "Steady-state homeostasis: naive CD8 influx to LN equals efflux (no net accumulation)"
  - "Mouse LN exit rate (Mandl 2012) is applicable to human LN physiology"
  - "The 5% LN:blood ratio represents the fraction of circulating naive CD8 in the effective draining LN"
  - "Death and proliferation during a single LN transit are negligible compared to trafficking fluxes"

key_study_limitations:
  - "Exit rate measured in mice, not humans — species scaling uncertainty"
  - "LN:blood ratio is an assumption, not directly measured from paired blood/LN samples"
  - "Mandl used anti-L-selectin blockade which may perturb egress kinetics"
  - "Single effective LN compartment aggregates behavior of ~500 physiologic LNs"

