calibration:
  parameters:
  - name: k_IL1_sec
    units: nanomole / (cell * day)
  - name: k_IL1_deg
    units: 1 / day
  forward_model:
    type: algebraic
    formula: C_ss = k_IL1_sec * N_norm * pg_per_nmol / (k_IL1_deg * V_mL * hours_per_day / accumulation_time_h)
    data_rationale: With IL-1alpha half-life ~2.4h (k_deg=6.93/day) and 48h accumulation, the system is at steady state (~20
      half-lives). The ELISA measurement represents the steady-state balance of secretion and degradation, normalized to 10^5
      cells.
    submodel_rationale: 'Maps to the IL-1alpha secretion and degradation reactions in fibroblast_module_enhanced.m: secretion
      = k_IL1_sec * C_total, degradation = k_IL1_deg * IL1 * V_T. At steady state in the culture well: k_IL1_sec * N / V =
      k_IL1_deg * C, so C = k_IL1_sec * N * unit_conv / (k_IL1_deg * V).'
    code: "def compute(params, inputs):\n    import numpy as np\n    k_sec = params['k_IL1_sec']\n    k_deg = params['k_IL1_deg']\n\
      \    N_norm = inputs['normalization_cell_count']\n    V_mL = inputs['media_volume_mL']\n    MW = inputs['IL1alpha_MW_Da']\n\
      \n    # k_sec is in nmol/(cell*day), k_deg in 1/day\n    # At steady state: C = k_sec * N / (k_deg * V_L)\n    # where\
      \ C is in nmol/L = nM, V_L in liters\n    V_L = V_mL / 1e3\n\n    # C_nM = k_sec * N / (k_deg * V_L) in nM\n    C_nM\
      \ = k_sec * N_norm / (k_deg * V_L)\n\n    # Convert nM to pg/mL:\n    # 1 nM = MW_Da * 1e-9 g/L = MW_Da * 1e-9 * 1e12\
      \ pg / 1e3 mL = MW_Da pg/mL\n    C_pgml = C_nM * MW\n\n    return C_pgml\n"
  error_model:
  - name: IL1alpha_secretion_vehicle
    units: picogram / milliliter
    uses_inputs:
    - IL1alpha_vehicle_mean_pgml
    - IL1alpha_vehicle_sem_pgml
    - n_experiments
    sample_size_input: n_experiments
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean =\
      \ inputs['IL1alpha_vehicle_mean_pgml']\n    sem = inputs['IL1alpha_vehicle_sem_pgml']\n    n = int(inputs['n_experiments'])\n\
      \    sd = sem * np.sqrt(n)\n    cv = sd / mean\n    return rng.lognormal(np.log(mean), cv / np.sqrt(sample_size), n_bootstrap)\n"
  identifiability_notes: 'Single steady-state measurement constrains the ratio k_IL1_sec / k_IL1_deg.

    These parameters are not individually identifiable from this target alone.

    However, k_IL1_deg has an independent prior from literature half-life data

    (t1/2 ~2.4h = k_deg ~6.93/day), so the ratio constraint effectively pins

    k_IL1_sec given k_IL1_deg. Joint inference with other targets or the

    existing k_IL1_deg prior resolves the degeneracy.

    '
experimental_context:
  species: human
  system: in_vitro_primary_cells
  cell_lines:
  - name: PC013
    source: primary human PDAC cell line propagated from tumor tissue biopsy
    passage_range: null
  cell_types:
  - name: pancreatic ductal adenocarcinoma cell
    source: human PDAC tumor biopsy
    isolation_method: Propagated from PDAC tumor tissue biopsies as described in Tjomsland 2011
  culture_conditions:
    medium: RPMI 1640 + 1% FCS + 2 mM HEPES + 30 ug/mL Gentamycin (R10)
    duration: 72h pretreatment with vehicle, then 48h in fresh 2 mL R10
  indication: pancreatic_ductal_adenocarcinoma
study_interpretation: 'PC013 primary PDAC cells constitutively secrete IL-1alpha at ~30 pg/mL

  per 10^5 cells in 2 mL over 48h. Given the rapid IL-1alpha degradation

  (t1/2 ~2.4h), this represents a near-steady-state concentration balancing

  secretion and degradation. The ELISA kit measures precursor, secreted,

  and membrane-associated forms, so the measurement includes both active

  secretion and passive release from cell turnover.

  '
key_assumptions:
- 48h accumulation is sufficient for steady state given IL-1alpha t1/2 ~2.4h
- Cell count at harvest is approximately equal to the seeded 6e5 (slow proliferation in 1% FCS over 48h)
- ELISA normalization to 1e5 cells accounts for any cell number variation
- Conditioned media IL-1alpha represents ongoing secretion, not just initial burst from media change
- Error bars represent SEM (confirmed in Statistical Analysis section)
- k_IL1_deg in conditioned media is comparable to in vivo degradation rate
key_study_limitations:
- Single time point (48h) — cannot independently resolve secretion vs degradation rates
- ELISA measures total IL-1alpha (precursor + secreted + membrane-associated) — may overestimate soluble secretion
- 2D culture without CAFs — no paracrine feedback that may modulate IL-1alpha secretion in vivo
- PC013 is one PDAC cell line — IL-1alpha secretion varies across lines (PC077 is IL-1alpha-negative)
- 1% FCS culture — low serum may alter secretory phenotype vs physiological conditions
primary_data_source:
  doi: 10.1371/journal.pone.0070874
  source_tag: Tjomsland2013
  title: IL-1alpha Expression in Pancreatic Ductal Adenocarcinoma Affects the Tumor Cell Migration and Is Regulated by the
    p38MAPK Signaling Pathway
  authors:
  - Tjomsland
  - Bojmar
  - Sandstrom
  - Bratthall
  - Messmer
  - Spangeus
  - Larsson
  year: 2013
  source_relevance:
    indication_match: exact
    indication_match_justification: 'PC013 is a primary human PDAC cell line derived from tumor tissue biopsy.

      IL-1alpha secretion from PDAC cancer cells is the exact mechanism modeled

      by k_IL1_sec in the QSP model.

      '
    species_source: human
    species_target: human
    source_quality: primary_human_in_vitro
    perturbation_type: physiological_baseline
    perturbation_relevance: 'Vehicle-treated cells represent constitutive IL-1alpha secretion from

      PDAC cancer cells without pharmacological perturbation. The 72h vehicle

      pretreatment followed by media change ensures baseline secretion measurement.

      '
    tme_compatibility: moderate
    tme_compatibility_notes: '2D culture in 1% FCS does not recapitulate the PDAC TME (no stroma, no

      hypoxia, no paracrine signaling from CAFs). IL-1alpha secretion may be

      higher in vivo due to NF-kB activation by stromal signals. However, the

      constitutive K-Ras-driven IL-1alpha expression (the dominant driver in

      PDAC) is preserved in this primary cell line.

      '
    measurement_directness: single_inversion
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: in_vitro_primary
