    sample_size_input: n_experiments
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    m = inputs['asma_frac_day6_mean']\n\
      \    s = inputs['asma_frac_day6_sd']\n    return rng.normal(m, s, size=n_bootstrap)\n"
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    Q, A = y\n    total = Q + A\n    return A / total\n"
      state_variables:
