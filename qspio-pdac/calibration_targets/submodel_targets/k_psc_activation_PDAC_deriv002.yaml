calibration:
  parameters:
  - name: k_PSC_to_myCAF
    units: 1/day
  - name: k_myCAF_prolif
    units: 1/day
  - name: TGFb_50_CAF_act
    units: nanomolarity
  - name: tgfb_basal_culture
    units: nanomolarity
    nuisance: true
    prior:
      distribution: lognormal
      mu: -6.9
      sigma: 1.5
  forward_model:
    type: custom_ode
    data_rationale: 'Figure 4a provides a time course of both cell number and alpha-SMA+

      fraction during stellate cell activation in primary culture. The ODE

      system tracks quiescent cells activating into myofibroblasts with

      concurrent proliferation, matching both observables simultaneously.

      '
    submodel_rationale: 'Matches the full QSP model''s activation and proliferation reactions:

      activation = k_act * TGFb/(TGFb_50_CAF_act + TGFb)

      proliferation = k_pro * A * (1 - total/K)

      PDGF was removed from the model (matrix-bound, not freely diffusing;

      see DEVLOG 2026-03-20). Basal TGFb in 10% FCS culture is a nuisance parameter.

      '
    code: "def ode(t, y, params, inputs):\n    Q, A = y\n    k_act = params['k_PSC_to_myCAF']\n    k_pro = params['k_myCAF_prolif']\n\
      \    ec50_tgfb = params['TGFb_50_CAF_act']\n    tgfb = params['tgfb_basal_culture']\n    K = inputs['carrying_capacity']\n\
      \    h_tgfb = tgfb / (ec50_tgfb + tgfb)\n    total = Q + A\n    logistic = 1 - total / K\n    dQ = -k_act * h_tgfb *\
      \ Q\n    dA = k_act * h_tgfb * Q + k_pro * A * logistic\n    return [dQ, dA]\n"
    state_variables:
    - name: Q
      units: dimensionless
      initial_condition:
        input_ref: cell_count_day2_mean
        rationale: 'Initial quiescent cell count at day 2 (x10^3). Most cells are

          still quiescent at this early time point (~90% alpha-SMA negative).

          '
    - name: A
      units: dimensionless
      initial_condition:
        value: 0.0
        rationale: 'Activated cell count starts near 0. The small fraction already

          alpha-SMA+ at day 2 (~10%) is neglected for initial conditions;

          the ODE will produce activation from t=2 onward.

          '
    independent_variable:
      name: time
      units: day
      span:
      - 0
      - 16
  error_model:
  - name: asma_frac_day2
    units: dimensionless
    uses_inputs:
    - asma_frac_day2_mean
    - asma_frac_day2_sd
    - n_experiments
    evaluation_points:
    - 2
    sample_size_input: n_experiments
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    m = inputs['asma_frac_day2_mean']\n\
      \    s = inputs['asma_frac_day2_sd']\n    return rng.normal(m, s, size=n_bootstrap)\n"
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    Q, A = y\n    total = Q + A\n    return A / total\n"
      state_variables:
      - Q
      - A
  - name: asma_frac_day4
    units: dimensionless
    uses_inputs:
    - asma_frac_day4_mean
    - asma_frac_day4_sd
    - n_experiments
    evaluation_points:
    - 4
    sample_size_input: n_experiments
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    m = inputs['asma_frac_day4_mean']\n\
      \    s = inputs['asma_frac_day4_sd']\n    return rng.normal(m, s, size=n_bootstrap)\n"
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    Q, A = y\n    total = Q + A\n    return A / total\n"
      state_variables:
      - Q
      - A
  - name: asma_frac_day6
    units: dimensionless
