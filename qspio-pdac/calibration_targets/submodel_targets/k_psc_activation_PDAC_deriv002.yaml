      type: custom
      code: "def compute(t, y, y_start):\n    Q, A = y\n    return Q + A\n"
      state_variables:
      - Q
      - A
  identifiability_notes: 'Four parameters (3 QSP + 1 nuisance) from 10 observations. The intrinsic

    rates k_PSC_to_myCAF and k_myCAF_prolif are identified from the

    time course shapes, while TGFb_50_CAF_act modulates the effective

    activation rate via the nuisance basal TGFb concentration. TGFb_50_CAF_act

    is weakly identified from this single-condition experiment but is strongly

    constrained by its own dedicated target (Bachem 1992 Fig 7b). Joint

    inference across all targets resolves the degeneracies. The nuisance

    parameter tgfb_basal_culture is shared by name with the Bachem 1992

    TGFb_50_CAF_act target (same 10% FCS culture system).

    '
