target_id: k_psc_activation_myCAF_bachem1993
tags:
- ai-generated
extraction_model: claude-opus-4-6
extraction_reasoning_effort: high
study_interpretation: 'Bachem et al. (1993) characterized the transdifferentiation of rat liver

  perisinusoidal lipocytes (PL, equivalent to quiescent stellate cells) into

  myofibroblast-like cells (MFBLC) during primary culture on uncoated plastic.

  Figure 4a shows a dual-axis time course of cell count and alpha-SMA+ fraction

  over 16 days of primary culture (mean +/- SD, n=3). PL were seeded at 0.15 x

  10^5 cells/cm^2 (150 x 10^3 cells/well) on 6-well plates in DMEM with 10% FCS.


  The alpha-SMA+ fraction rose from ~10% at day 2 to ~30% at day 10 and ~48%

  by day 16. Cell counts were flat for the first 4 days (~120-150 x 10^3), then

  doubled by day 6 (~285 x 10^3), plateauing at ~320-330 x 10^3 from day 10

  onward at confluence.

  '
key_assumptions:
- 'alpha-SMA+ fraction at each time point reflects the cumulative proportion

  of cells that have transitioned from quiescent to activated state. The

  forward model treats this as a first-order transition (qPSC -> myCAF) with

  rate k_PSC_to_myCAF.

  '
- 'Cell number increase during days 4-7 is driven primarily by proliferation

  of activating/activated cells. The forward model includes logistic growth

  with rate k_myCAF_prolif, reaching carrying capacity at confluence.

  '
- 'Culture on rigid plastic with 10% FCS provides strong activation signals

  (TGFbeta, PDGF, mechanical cues) such that the Hill-type signaling terms

  in the full model are near-saturating. The observed rates approximate

  k_PSC_to_myCAF and k_myCAF_prolif at maximal stimulation.

  '
- 'Rat hepatic stellate cell activation kinetics are representative of

  pancreatic stellate cell activation in the PDAC tumor microenvironment.

  '
key_study_limitations:
- 'Rat liver stellate cells on 2D plastic, not human PDAC CAFs in vivo.

  Activation on rigid substrates with serum may be faster than in the

  3D tumor microenvironment due to maximal mechanotransduction.

  '
- 'The high seeding density (150 x 10^3 cells/well) means confluence is

  reached early (day 6-7), after which contact inhibition limits further

  proliferation and may slow activation.

  '
- 'alpha-SMA staining is binary (positive/negative) and may not capture

  intermediate activation states.

  '
- 'The confluence plateau (~330 x 10^3 cells/well) is a culture-specific

  physical constraint, not the biological carrying capacity parameter

  (f_stroma_max) used in the full model.

  '
experimental_context:
  species: rat
  system: in_vitro_primary_cells
  cell_types:
  - name: perisinusoidal lipocyte / hepatic stellate cell
    source: rat liver
    isolation_method: 'Nycodenz density gradient from rat liver, seeded on 6-well plates

      at 0.15 x 10^5 cells/cm^2 in DMEM with 10% FCS. Medium changed at

      2-day intervals. Plating efficiency 80%.

      '
  culture_conditions:
    medium: DMEM with 10% fetal calf serum
    duration: 16 days primary culture
  indication: liver_fibrosis
primary_data_source:
  doi: 10.1016/S0168-8278(05)80008-X
  title: 'The response of rat liver perisinusoidal lipocytes to polypeptide growth

    regulator changes with their transdifferentiation into myofibroblast-like

    cells in culture

    '
  authors:
  - Bachem
  - Meyer
  - Schafer
  - Riess
  - Melchior
  - Sell
  - Gressner
  year: 1993
  source_tag: Bachem1993
  source_relevance:
    indication_match: proxy
    indication_match_justification: 'Rat hepatic stellate cell activation kinetics as proxy for PDAC pancreatic

      stellate cell activation. HSCs and PSCs are functionally nearly identical

      (vitamin A storage, alpha-SMA expression, TGFbeta-driven activation).

      '
    species_source: rat
    species_target: human
    source_quality: primary_animal_in_vitro
    perturbation_type: pathological_state
    perturbation_relevance: 'Culture on rigid plastic with 10% FCS provides maximal activation stimulus.

      In vivo activation in PDAC may be slower due to 3D ECM constraints.

      '
    tme_compatibility: moderate
    tme_compatibility_notes: 'In vitro 2D plastic culture provides strong uniform activation but lacks

      the spatial heterogeneity, 3D ECM, and competing signals of PDAC stroma.

      '
    measurement_directness: direct
    temporal_resolution: timecourse
    experimental_system: in_vitro_primary
