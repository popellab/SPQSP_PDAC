  year: 2017
  source_tag: Akondy2017
  source_relevance:
    indication_match: proxy
    indication_match_justification: "The source study characterizes YFV-17D vaccine-elicited\
      \ memory CD8 T cells in healthy adults, whereas the QSPIO-PDAC model targets\
      \ effector CD8 T cells in pancreatic ductal adenocarcinoma. Although the disease\
      \ context and tissues differ, the basic birth\u2013death kinetics of long-lived\
      \ antigen-experienced human CD8 T cells provide a mechanistic lower bound for\
      \ CD8 death rates that is expected to be relatively conserved across indications.\
      \ We therefore treat this as a mechanistic proxy for intrinsic CD8 survival\
      \ rather than a direct measurement in PDAC."
    species_source: human
    species_target: human
    source_quality: primary_human_clinical
    perturbation_type: physiological_baseline
    perturbation_relevance: The key measurements are made months after vaccination
      during the antigen-free maintenance phase, when YFV-specific memory CD8 T cells
      are at or near homeostatic conditions; thus the inferred division and loss rates
      approximate physiological baseline behavior of long-lived memory CD8 T cells
      rather than an acute pharmacological perturbation.
    tme_compatibility: low
    tme_compatibility_notes: YFV-specific memory CD8 T cells measured in peripheral
      blood and lymphoid tissues reside in an essentially normal immune environment,
      whereas PDAC tumors are characterized by dense desmoplastic stroma, chronic
      antigen exposure, hypoxia, and strong immunosuppression. These factors are likely
      to increase the effective death or dysfunction of tumor-infiltrating CD8 T cells
      relative to circulating memory cells, so the Akondy2017-derived rate should
      be interpreted as a lower bound and inflated uncertainty is appropriate when
      translating to the PDAC tumor microenvironment.
    measurement_directness: single_inversion
    temporal_resolution: timecourse
    experimental_system: clinical_in_vivo
