calibration:
  parameters:
  - name: k_CAF_encounter
    units: cell/(milliliter*day)
    nuisance: false
  - name: k_CAF_const
    units: cell/milliliter
    nuisance: false
  - name: psc_frac_scale
    units: milliliter/cell
    nuisance: true
    prior:
      distribution: lognormal
      mu: -14.5
      sigma: 1.0
  forward_model:
    data_rationale: Apte1998 directly quantifies the density of stellate shaped cells
      (PSCs) per gram of normal rat pancreas, anchoring the constitutive PSC density
      k_CAF_const. Tansi2024 provides a time course of naive vitamin A positive PSC
      fractions within orthotopic Panc-1-fl PDAC tumors at 4, 8, and 10 weeks after
      implantation. Interpreting the rise of naive PSC fraction with tumor age as
      reflecting encounter and recruitment of resident quiescent PSCs, a first-order
      approach-to-plateau model for PSC density over time is appropriate.
    submodel_rationale: 'In the full QSP PDAC model, quiescent PSCs (qPSC) in the
      tumor compartment are created by a volumetric encounter term with surrounding
      pancreas: rate = k_CAF_encounter * V_T * (k_CAF_const - (qPSC/V_T)) / k_CAF_const.
      For a fixed tumor volume this implies that the qPSC density satisfies dq/dt
      = (k_CAF_encounter/k_CAF_const)*(k_CAF_const - q), a first-order approach to
      the constitutive density k_CAF_const. The algebraic solution used here preserves
      this mechanistic structure exactly by expressing qPSC density as a function
      of k_CAF_encounter, k_CAF_const, and tumor age, and mapping density to the experimentally
      reported naive PSC fraction via a nuisance scaling parameter.'
    type: algebraic
    formula: qPSC_density(t) = k_CAF_const * (1 - exp(-(k_CAF_encounter/k_CAF_const)
      * t)); naive PSC fraction(t) = psc_frac_scale * qPSC_density(t); normal pancreas
      PSC density (cells/g) = k_CAF_const / pancreas_density_g_per_mL
    code: "def compute(params, inputs):\n    import numpy as np\n    k_enc = params['k_CAF_encounter']\
      \  # cell/(mL*day)\n    k_const = params['k_CAF_const']    # cell/mL\n    scale\
      \ = params['psc_frac_scale']   # mL/cell, maps density to dimensionless fraction\n\
      \n    t4 = inputs['time_week4_days']\n    t8 = inputs['time_week8_days']\n \
      \   t10 = inputs['time_week10_days']\n\n    # Effective first-order approach\
      \ rate (1/day)\n    lam = k_enc / k_const\n\n    def q_density(t):\n       \
      \ # Density of quiescent PSCs (cells/mL) assuming negligible initial density\n\
      \        return k_const * (1.0 - np.exp(-lam * t))\n\n    q4 = q_density(t4)\n\
      \    q8 = q_density(t8)\n    q10 = q_density(t10)\n\n    # Predicted naive PSC\
      \ fractions (dimensionless, 0-1)\n    frac4 = scale * q4\n    frac8 = scale\
      \ * q8\n    frac10 = scale * q10\n\n    # Normal pancreas PSC density in cells\
      \ per gram (Apte1998)\n    dens_per_mL = k_const\n    dens_per_g = dens_per_mL\
      \ / inputs['pancreas_density_g_per_mL']\n\n    return {\n        'psc_frac_w4':\
      \ frac4,\n        'psc_frac_w8': frac8,\n        'psc_frac_w10': frac10,\n \
      \       'psc_density_normal': dens_per_g,\n    }\n"
  error_model:
  - name: psc_frac_week4
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['psc_frac_w4']\n"
    units: dimensionless
    uses_inputs:
    - psc_frac_w4_mean
    - psc_frac_w4_sd
    - n_psc_w4
    - time_week4_days
    - time_week8_days
    - time_week10_days
    - pancreas_density_g_per_mL
    sample_size_input: n_psc_w4
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['psc_frac_w4_mean']\n    sd = inputs['psc_frac_w4_sd']\n\
      \    # Use lognormal bootstrap for positive fractions; fall back to normal if\
      \ mean is extremely small\n    if mean <= 0.0:\n        sd_eff = sd / np.sqrt(sample_size)\n\
      \        return rng.normal(mean, sd_eff, n_bootstrap)\n    cv = sd / mean\n\
      \    sigma_ln = np.sqrt(np.log(1 + cv**2))\n    mu_ln = np.log(mean) - sigma_ln**2\
      \ / 2\n    return rng.lognormal(mu_ln, sigma_ln / np.sqrt(sample_size), n_bootstrap)\n"
    n_bootstrap: 10000
  - name: psc_frac_week8
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['psc_frac_w8']\n"
    units: dimensionless
    uses_inputs:
    - psc_frac_w8_mean
    - psc_frac_w8_sd
    - n_psc_w8
    - time_week4_days
    - time_week8_days
    - time_week10_days
    - pancreas_density_g_per_mL
    sample_size_input: n_psc_w8
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['psc_frac_w8_mean']\n    sd = inputs['psc_frac_w8_sd']\n\
      \    if mean <= 0.0:\n        sd_eff = sd / np.sqrt(sample_size)\n        return\
      \ rng.normal(mean, sd_eff, n_bootstrap)\n    cv = sd / mean\n    sigma_ln =\
      \ np.sqrt(np.log(1 + cv**2))\n    mu_ln = np.log(mean) - sigma_ln**2 / 2\n\
      \    return rng.lognormal(mu_ln, sigma_ln / np.sqrt(sample_size), n_bootstrap)\n"
    n_bootstrap: 10000
  - name: psc_frac_week10
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['psc_frac_w10']\n"
    units: dimensionless
    uses_inputs:
    - psc_frac_w10_mean
    - psc_frac_w10_sd
    - n_psc_w10
    - time_week4_days
    - time_week8_days
    - time_week10_days
    - pancreas_density_g_per_mL
    sample_size_input: n_psc_w10
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['psc_frac_w10_mean']\n    sd = inputs['psc_frac_w10_sd']\n\
      \    if mean <= 0.0:\n        sd_eff = sd / np.sqrt(sample_size)\n        return\
      \ rng.normal(mean, sd_eff, n_bootstrap)\n    cv = sd / mean\n    sigma_ln =\
      \ np.sqrt(np.log(1 + cv**2))\n    mu_ln = np.log(mean) - sigma_ln**2 / 2\n\
      \    return rng.lognormal(mu_ln, sigma_ln / np.sqrt(sample_size), n_bootstrap)\n"
    n_bootstrap: 10000
  - name: psc_density_normal_cells_per_g
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['psc_density_normal']\n"
    units: cell/gram
    uses_inputs:
    - psc_density_mean_per_g
    - psc_density_sem_per_g
    - n_psc_normal
    - pancreas_density_g_per_mL
    sample_size_input: n_psc_normal
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['psc_density_mean_per_g']\n    sem\
      \ = inputs['psc_density_sem_per_g']\n    # Convert SEM to SD using n\n    sd\
      \ = sem * np.sqrt(sample_size)\n    cv = sd / mean\n    sigma_ln = np.sqrt(np.log(1\
      \ + cv**2))\n    mu_ln = np.log(mean) - sigma_ln**2 / 2\n    return rng.lognormal(mu_ln,\
      \ sigma_ln / np.sqrt(sample_size), n_bootstrap)\n"
    n_bootstrap: 10000
  identifiability_notes: 'The submodel jointly constrains k_CAF_const (constitutive
    PSC density) and k_CAF_encounter (volumetric PSC encounter rate) using two kinds
    of measurements: (1) Apte1998 directly measures PSC yield per gram of normal rat
    pancreas, which maps almost one-to-one onto k_CAF_const after accounting for tissue
    density and incomplete recovery; (2) Tansi2024 provides three time points (4,
    8, 10 weeks) of naive PSC fraction within Panc-1-fl orthotopic PDAC tumors, which,
    under a first-order approach-to-plateau assumption, constrain primarily the ratio
    k_CAF_encounter/k_CAF_const (the effective first-order rate 1/tau). Because only
    three tumor-age points are available and absolute PSC density in tumors is not
    known, k_CAF_encounter and k_CAF_const are partially correlated: increases in
    k_CAF_const can be offset by proportionate increases in k_CAF_encounter to maintain
    the same time constant. The naive PSC fraction data determine the time scale tau
    reasonably well, while the Apte yield measurement anchors the absolute scale of
    k_CAF_const. The nuisance scale parameter psc_frac_scale absorbs differences in
    total cell density and staining efficiency between normal pancreas and tumor sections;
    it is expected to be highly correlated with k_CAF_const but does not affect the
    inferred time constant. The model does not explicitly represent PSC activation
    into myCAF or iCAF phenotypes, so parameters such as k_PSC_to_myCAF are not constrained
    by this target. Additional longitudinal data on absolute PSC and CAF densities
    per unit tumor volume, or more frequent time points, would further disentangle
    k_CAF_encounter from k_CAF_const.'
