study_interpretation: Apte1998 shows that normal rat pancreas contains a substantial
  resident population of periacinar stellate shaped cells (pancreatic stellate cells,
  PSCs), comprising about 4% of all pancreatic cells and yielding approximately 2
  x 10^5 stellate shaped cells per gram of pancreas by enzymatic isolation. This provides
  a direct quantitative anchor for the constitutive PSC density in pancreatic tissue
  (k_CAF_const) toward which the QSP model's volumetric PSC encounter term drives.
  Tansi2024 establishes orthotopic PDAC xenografts (Panc-1-fl, BxPC-3) in mouse pancreas
  and tracks tumor morphology and stromal composition over time. Their semiquantitative
  histology shows that naive vitamin A positive PSCs are initially rare within 4-week
  Panc-1-fl tumors, then increase at 8 weeks and more markedly by 10 weeks, while
  tumors are still growing locally. Interpreting this monotonic rise in naive PSC
  fraction as reflecting ongoing encounter and recruitment of resident PSCs as the
  tumor expands into surrounding pancreas, a first-order approach-to-plateau model
  for PSC density versus tumor age is biologically reasonable and consistent with
  the QSP implementation of k_CAF_encounter. By fitting this time course along with
  the absolute PSC yield per gram of pancreas, the submodel infers a plausible constitutive
  PSC density and the implied encounter rate required to reach that density on the
  observed time scale.
key_assumptions:
- Pancreatic tissue density is approximately 1 g/mL, so that 2 x 10^5 PSCs per g pancreas
  from Apte1998 can be treated as 2 x 10^5 PSCs per mL for calibrating k_CAF_const.
- The yield of 2 x 10^5 stellate shaped cells per g pancreas underestimates the true
  PSC density because of incomplete enzymatic recovery and purity <100%; using it
  as the target for k_CAF_const therefore yields a conservative (lower-bound) estimate
  of constitutive PSC density.
- Naive vitamin A positive PSC counts in Tansi2024 (percent of stained cells in tumor
  sections) scale linearly with underlying qPSC density per unit tumor volume, with
  all geometric and staining factors absorbed into a single nuisance scaling parameter.
- Tumor volume changes and heterogeneity are neglected in the PSC encounter dynamics;
  PSC accumulation is modeled as a function of tumor age only, consistent with a volumetric
  encounter rate acting on an effectively growing but unmeasured interface.
- Initial qPSC density within the nascent orthotopic tumor at the time of implantation
  is negligible relative to the constitutive density, so the solution of the first-order
  approach-to-plateau ODE can assume qPSC(0) ~ 0.
- Rat normal pancreas PSC density and mouse pancreas PSC density underlying the orthotopic
  xenografts are similar enough that Apte1998 can be used to anchor k_CAF_const for
  a human PDAC QSP model, acknowledging added translation uncertainty.
- The three available tumor age points (4, 8, 10 weeks) in Tansi2024 are sufficient
  to capture the dominant time scale of PSC accumulation, even though the true saturation
  may occur later than 10 weeks.
key_study_limitations:
- Apte1998 reports PSC yield after enzymatic digestion of normal rat pancreas with
  ~75% purity and >80% viability; the isolation efficiency is unknown, so the measured
  2 x 10^5 cells/g likely underestimates the true in situ PSC density.
- Both Apte1998 and Tansi2024 are based on rodent tissues (rat and mouse host pancreas),
  whereas the QSP model targets human PDAC; species differences in PSC abundance and
  behavior are not explicitly corrected beyond broader translation uncertainty.
- The naive PSC fractions in Tansi2024 are semiquantitative, based on immunohistochemical
  staining and image analysis on 1-3 animals per time point, and may be biased by
  field selection and staining efficiency.
- Absolute tumor volumes and interface geometry from Tansi2024 are not directly incorporated
  into the submodel; PSC encounter is inferred only as a function of tumor age, which
  may miss dependence on tumor size or local microenvironment.
- The submodel ignores downstream activation of qPSCs into myofibroblastic and inflammatory
  CAFs, even though these processes are important sinks for qPSC in the full QSP model,
  potentially leading to an effective encounter rate that absorbs some activation
  dynamics.
- The mapping from naive PSC fraction within tumor tissue assumes relatively constant
  total nuclear density across tumors and time points, which may not hold in late-stage,
  highly fibrotic tumors.
- Tansi2024 uses human PDAC cell lines implanted into immunodeficient nude mice; the
  stromal and immune microenvironment differs from that of human PDAC in patients,
  particularly regarding immune composition and chronic inflammation.
primary_data_source:
  doi: 10.1136/gut.43.1.128
  pmid: '9703476'
  title: 'Periacinar stellate shaped cells in rat pancreas: identification, isolation,
    and culture'
  authors:
  - Apte
  - Haber PS
  - Applegate TL
  - Norton ID
  - McCaughan GW
  - Korsten MA
  - Pirola RC
  - Wilson JS
  year: 1998
  source_tag: Apte1998
  source_relevance:
    indication_match: related
    indication_match_justification: The study characterizes stellate shaped cells
      in healthy rat pancreas, quantifying their abundance and yield. While it does
      not involve pancreatic ductal adenocarcinoma directly, it provides baseline
      PSC density in normal pancreatic tissue, which is mechanistically upstream of
      PDAC-associated CAFs and is used as the constitutive PSC density toward which
      the QSP PDAC model drives when tumors expand into adjacent normal pancreas.
    species_source: rat
    species_target: human
    source_quality: primary_animal_in_vivo
    perturbation_type: physiological_baseline
    perturbation_relevance: Rats were chow-fed without experimental fibrosis or cancer,
      so the measured PSC density reflects physiological baseline conditions in healthy
      pancreas. This is appropriate for calibrating the constitutive PSC density term
      representing resident PSCs in non-tumorous pancreatic tissue.
    tme_compatibility: moderate
    tme_compatibility_notes: The normal rat pancreas lacks the desmoplastic stroma
      and chronic inflammatory milieu of human PDAC, but the basic periacinar localization
      and vitamin A storing phenotype of PSCs are conserved. The main impact is that
      PSC density may differ from peri-tumoral human pancreas, and activation status
      is lower, introducing at least a 2-3x translation uncertainty.
    measurement_directness: direct
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: animal_in_vivo
