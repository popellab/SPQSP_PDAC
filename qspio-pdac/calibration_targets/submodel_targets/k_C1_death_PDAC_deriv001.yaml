    convert apoptosis index reported in percent to a unitless fraction for rate calculations.
  source_ref: Sarela2002
  source_location: Results (indices reported in %)
calibration:
  parameters:
  - name: k_C1_death
    units: 1/day
    nuisance: false
  - name: apoptosis_duration
    units: day
    nuisance: true
    prior:
      distribution: lognormal
      mu: 0.0
      sigma: 0.7
  forward_model:
    data_rationale: Sarela2002 reports a single-timepoint apoptotic index (AI, TUNEL-positive
      tumor cells as % of all tumor cells) in treatment-naive resected PDAC. Under
      a quasi-steady-state assumption for cell turnover and a fixed average duration
      over which apoptotic cells remain TUNEL-detectable, the fraction of apoptotic
      cells at any instant approximates the product of the per-cell death rate and
      the detectable-apoptosis duration.
    submodel_rationale: "In the full QSPIO-PDAC model, baseline cancer cell death\
      \ in the tumor compartment is represented by a first-order loss term k_C1_death\
      \ * C1. For small apoptotic fractions at steady state, the expected proportion\
      \ of cells in the apoptotic (TUNEL-positive) state is approximately f_apop \u2248\
      \ k_C1_death * t_apop, where t_apop is the mean time a dying cell spends in\
      \ a morphologically/biochemically detectable apoptotic state. This algebraic\
      \ submodel preserves the same linear dependence on k_C1_death as the full model\
      \ and introduces apoptosis_duration as a nuisance parameter representing microscopic\
      \ apoptosis kinetics not explicitly resolved in the QSP model."
    type: algebraic
    formula: f_apoptosis = k_C1_death * apoptosis_duration
    code: "def compute(params, inputs):\n    import numpy as np\n    k = params['k_C1_death']\n\
      \    t_apop = params['apoptosis_duration']\n    # Predicted steady-state fraction\
      \ of apoptotic cells\n    f_apop = k * t_apop\n    return f_apop\n"
  error_model:
  - name: AI_pancreas_TUNEL
    units: dimensionless
    uses_inputs:
    - AI_mean_pancreas_percent
    - AI_sd_pancreas_percent
    - percent_to_fraction
    - n_pancreas_tumors
    sample_size_input: n_pancreas_tumors
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    # Convert mean and SD from percent to fraction\n\
      \    pct_to_frac = inputs['percent_to_fraction']\n    mean_pct = inputs['AI_mean_pancreas_percent']\n\
      \    sd_pct = inputs['AI_sd_pancreas_percent']\n    mean = mean_pct * pct_to_frac\n\
      \    sd = sd_pct * pct_to_frac\n    # Lognormal bootstrap for positive fractions\n\
      \    cv = sd / mean\n    sigma_ln = np.sqrt(np.log(1 + cv**2))\n    mu_ln =\
      \ np.log(mean) - sigma_ln**2 / 2\n    return rng.lognormal(mu_ln, sigma_ln /\
      \ np.sqrt(sample_size), n_bootstrap)\n"
    n_bootstrap: 10000
  identifiability_notes: The apoptotic index provides a single algebraic constraint
    on the product k_C1_death * apoptosis_duration. As a result, k_C1_death is not
    uniquely identifiable without an external assumption or prior on apoptosis_duration.
    In this target, apoptosis_duration is treated as a nuisance parameter with a lognormal
    prior centered on ~3 hours (0.125 day) and broad uncertainty, reflecting general
    apoptosis literature rather than PDAC-specific measurements. The posterior for
    k_C1_death will therefore be strongly correlated with apoptosis_duration, and
    uncertainty in apoptosis_duration will propagate directly to k_C1_death. No independent
    information on k_C1_growth or net tumor growth is included here, so this target
    constrains only the absolute death rate, not the balance of growth vs death.
experimental_context:
  species: human
  system: clinical_resection_tissue
  cell_types:
  - name: pancreatic ductal adenocarcinoma cells
    phenotype: epithelial malignant cells in primary pancreatic tumors
    isolation_method: surgical resection (pancreaticoduodenectomy) followed by formalin
      fixation and paraffin embedding
    source: Primary PDAC tumors from patients undergoing pancreaticoduodenectomy at
      St James's University Hospital, Leeds, UK
  indication: pancreatic ductal adenocarcinoma (PDAC)
study_interpretation: Treatment-naive human PDACs resected by pancreaticoduodenectomy
  show a low but non-zero apoptotic index of roughly 1.4% TUNEL-positive tumor cells
  at a single timepoint. Interpreting this as a steady-state snapshot of cell turnover,
  and assuming that individual apoptotic cells remain TUNEL-detectable for a few hours,
  implies a baseline per-cell death rate on the order of several percent per day.
  This provides a direct clinical constraint on the baseline cancer cell death parameter
  k_C1_death in the QSPIO-PDAC model, independent of therapy-induced killing.
key_assumptions:
- The resected PDAC specimens represent a quasi-steady-state in which the fraction
  of TUNEL-positive tumor cells approximates k_C1_death multiplied by a characteristic
  detectable-apoptosis duration.
- TUNEL positivity in this context primarily reflects apoptotic cancer cells rather
  than necrotic debris or non-malignant cells, consistent with the scoring protocol
  used in Sarela2002.
- "An average detectable-apoptosis duration of order 2\u20134 hours (median ~3 hours)\
  \ is appropriate for human epithelial tumors and can be represented as a lognormal\
  \ nuisance parameter (apoptosis_duration)."
- Intratumoral spatial heterogeneity and inter-patient variability in apoptotic index
  are adequately summarized by the reported cohort mean and standard deviation.
- The baseline death rate inferred from surgically resectable PDACs is applicable,
  within uncertainty, to the PDAC tumors represented in the QSPIO-PDAC model, which
  may include somewhat more advanced disease stages.
key_study_limitations:
- Apoptotic index is measured at a single timepoint per tumor, so mapping to a death
  rate requires a steady-state assumption and an externally assumed apoptosis duration.
- The cohort consists of resectable PDACs from a single center between 1994 and 2000,
  which may not fully capture the biology of unresectable or metastatic PDAC.
- TUNEL detects DNA fragmentation and may miss very early apoptotic events or misclassify
  some forms of regulated necrosis, introducing modest systematic error in the effective
  apoptosis duration.
- No direct measurements of tumor growth rate, volumetric doubling time, or necrotic
  fraction are available in this study, limiting the ability to cross-validate k_C1_death
  against net tumor dynamics.
- Potential pre-analytic variables (fixation time, tissue handling) that can influence
  TUNEL sensitivity are not explicitly quantified, adding unmodeled variability to
  the apoptotic index.
primary_data_source:
  doi: 10.1038/sj.bjc.6600133
  title: Expression of survivin, a novel inhibitor of apoptosis and cell cycle regulatory
    protein, in pancreatic adenocarcinoma
  authors:
  - AI Sarela
  - CS Verbeke
  - J Ramsdale
  - CL Davies
  - AF Markham
  - PJ Guillou
  year: 2002
  source_tag: Sarela2002
  source_relevance:
    indication_match: exact
    indication_match_justification: The study analyzes primary pancreatic ductal adenocarcinomas
      resected by pancreaticoduodenectomy and reports apoptotic and proliferative
      indices specifically for PDAC, matching the indication of the QSPIO-PDAC model.
      Although a subset of periampullary tumors are also studied, the apoptotic index
      used here is restricted to the pancreatic ductal adenocarcinoma subgroup, providing
      a direct indication match.
    species_source: human
    species_target: human
    source_quality: primary_human_clinical
    perturbation_type: physiological_baseline
    perturbation_relevance: Tumor samples were obtained at the time of surgery from
      patients who had not yet received neoadjuvant chemoradiation, so the reported
      apoptotic and proliferative indices reflect the baseline, untreated PDAC state
      rather than pharmacologically perturbed conditions.
    tme_compatibility: high
    tme_compatibility_notes: The measurements are made in situ on human PDAC resection
      specimens with intact desmoplastic stroma, immune infiltrates, and vasculature,
      which closely resemble the tumor microenvironment represented in the QSPIO-PDAC
      model. Some differences from metastatic or very advanced unresectable PDAC (e.g.,
      degree of hypoxia or necrosis) may exist but are modest relative to cross-species
      or in vitro systems.
    measurement_directness: proxy_observable
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: clinical_in_vivo
