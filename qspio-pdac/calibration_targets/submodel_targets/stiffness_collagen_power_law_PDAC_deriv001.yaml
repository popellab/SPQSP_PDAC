calibration:
  parameters:
  - name: E_ref
    units: dimensionless
  - name: n_stiff
    units: dimensionless
  - name: phi_col_ref
    units: dimensionless
  forward_model:
    type: power_law
    coefficient: E_ref
    reference_x: phi_col_ref
    exponent: n_stiff
    data_rationale: 'Two data points constrain the power law: (1) normal pancreas SSM = 1.06 kPa

      at the reference collagen volume fraction, and (2) collagen-only gel SSM = 0.8 kPa

      at phi = 0.12. The power-law model predicts stiffness = E_ref * (phi/phi_col_ref)^n_stiff.

      '
    submodel_rationale: 'The QSP model uses stiffness = E_ref * (phi_collagen / phi_col_ref)^n_stiff as a

      repeated assignment rule. E_ref is the reference stiffness at phi_col_ref (normal

      pancreas), and n_stiff controls how rapidly stiffness increases with collagen

      accumulation. Stiffness feeds into H_stiff_Texh (T cell exhaustion) and H_stiff_fib

      (fibroblast mechanotransduction / YAP-TAZ activation).

      '
  error_model:
  - name: ssm_collagen_gel_3mgml
    units: kilopascal
    x_input: phi_gel
    uses_inputs:
    - ssm_collagen_gel
    - ssm_normal_sd
    - ssm_normal_mean
    - n_normal
    sample_size_input: n_normal
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    mean_ssm\
      \ = inputs['ssm_collagen_gel']\n    # No SD reported for collagen-only gels; use CV from normal tissue\n    # measurements\
      \ (0.25/1.06 = 24%) as proxy for measurement variability\n    cv = inputs['ssm_normal_sd'] / inputs['ssm_normal_mean']\n\
      \    sigma_ln = np.sqrt(np.log(1 + cv**2))\n    mu_ln = np.log(mean_ssm) - sigma_ln**2 / 2\n    return rng.lognormal(mu_ln,\
      \ sigma_ln, size=n_bootstrap)\n"
  identifiability_notes: '3 parameters (E_ref, n_stiff, phi_col_ref) from 2 error model entries. The system is

    underdetermined from this target alone: the collagen gel and normal tissue stiffness

    constrain the product E_ref * phi_col_ref^(-n_stiff), but the individual parameters

    are correlated along the power-law surface. Joint inference with d_pore_ref_phi_col_ref

    (which shares phi_col_ref through a different physical relationship) is essential to

    resolve the degeneracy. The normal pancreas data point anchors E_ref close to 1 kPa

    if phi_col_ref ~ 0.12 (the prior median).

    '
