study_interpretation: 'Rubiano et al. 2018 measured steady-state modulus (SSM) of human pancreatic tissue

  by mesoscale indentation: normal pancreas 1.06 +/- 0.25 kPa, pancreatitis 2.15 +/- 0.41 kPa,

  PDAC tumors 5.46 +/- 3.18 kPa (Fig 6A). They also fabricated TAS-embedded collagen hydrogels

  (LiMMEs) at 3 mg/mL rat tail collagen. Collagen-only gels (no cells) yielded SSM ~0.8 kPa

  (Fig 7A, "Col I Only" bar), while 7-day control LiMMEs reached 1.45 +/- 0.12 kPa (near normal

  pancreas) and conditioned-medium LiMMEs reached 3.38 +/- 0.146 kPa (near tumor range).


  The QSP model uses stiffness = E_ref * (phi_collagen / phi_col_ref)^n_stiff. This target

  constrains the power-law relationship using two data points: (1) normal pancreas tissue

  stiffness at the reference collagen volume fraction phi_col_ref, and (2) collagen-only gel

  stiffness at a known collagen concentration (3 mg/mL, phi = 0.12). Together these anchor

  both the reference point (E_ref) and the scaling exponent (n_stiff). Joint inference with

  the pore-size target (d_pore_ref_phi_col_ref) shares phi_col_ref, helping resolve the

  pore-size power-law degeneracy.

  '
key_assumptions:
- 'Collagen-only gel SSM (~0.8 kPa at 3 mg/mL) represents the passive collagen contribution

  to tissue stiffness without cellular remodeling or crosslinking. This is a lower bound on

  in vivo stiffness at the same collagen content.

  '
- 'Normal pancreas SSM (1.06 kPa) corresponds to the model''s reference state at phi_col_ref.

  The collagen volume fraction in normal pancreas is approximately 0.12 (from pdac_priors.csv),

  consistent with literature estimates of 5-15% collagen by volume in normal pancreas.

  '
- 'The power-law relationship E ~ phi^n_stiff holds across the range from in vitro gels to

  tissue. In reality, tissue stiffness depends on additional factors (crosslinking, HA,

  cellular contributions), so the in vitro gel data provides a lower bound on n_stiff.

  '
- 'rho_collagen = 25 mg/mL for converting collagen gel concentration to volume fraction

  (same value used in d_pore_ref_phi_col_ref target from Wolf 2013).

  '
key_study_limitations:
- 'Collagen-only gels use rat tail collagen type I at 3 mg/mL, which differs from the mixed

  collagen I/III matrix in human pancreas. Gel architecture (no crosslinking, no HA, no

  cellular contributions) means stiffness is lower than tissue at the same collagen content.

  '
- 'Normal pancreas SSM was measured from resected tissue adjacent to pathology. "Normal" tissue

  may have subclinical changes from proximity to disease.

  '
- 'SSM measurements use a custom cantilever-based indenter with Hertz contact model. Different

  indentation methods (AFM, rheology, elastography) yield systematically different moduli

  (Fig 1 shows 3 orders of magnitude variation across methods).

  '
- 'Sample sizes are limited: normal n=6-10, tumor n=6-10 (individual points visible in Fig 6A).

  '
