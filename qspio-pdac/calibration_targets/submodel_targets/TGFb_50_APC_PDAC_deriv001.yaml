calibration:
  parameters:
  - name: TGFb_50_APC
    units: nanomolarity
  forward_model:
    type: algebraic
    formula: IC50 = TGFb_50_APC (identity -- parameter is directly constrained by dose-response)
    data_rationale: 'TGFbeta1 dose-response on IL-12p70 production by human Mo-DCs provides a

      direct dose-response curve for TGFbeta-mediated maturation inhibition. Three

      concentrations span the full transition from no effect to complete suppression.

      Fitting a Hill function (n=1, matching the model) to the fractional inhibition

      at each concentration yields an IC50 estimate.

      '
    submodel_rationale: 'The QSP model uses H_TGFb_APC = TGFb/(TGFb + TGFb_50_APC) as a Hill function

      (n=1) gating APC maturation rate for both cDC1 and cDC2. TGFb_50_APC is the

      EC50 of this inhibitory function. The dose-response data directly constrains

      this parameter: at each known TGFb concentration, the fractional IL-12p70

      remaining is predicted by IC50/(c+IC50), allowing IC50 to be estimated from

      the observed fractions.

      '
    code: "def compute(params, inputs):\n    return params['TGFb_50_APC']\n"
  error_model:
  - name: il12p70_dose_response_ic50
    units: nanomolarity
    uses_inputs:
    - il12p70_control
    - il12p70_control_sem
    - il12p70_at_0p02_ngml
    - il12p70_0p02_sem
    - il12p70_at_0p2_ngml
    - il12p70_0p2_sem
    - il12p70_at_2_ngml
    - il12p70_2_sem
    - tgfb_conc_low_nM
    - tgfb_conc_mid_nM
    - tgfb_conc_high_nM
    - n_il12p70_experiments
    sample_size_input: n_il12p70_experiments
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n\n    # Digitized\
      \ IL-12p70 dose-response from Figure 3a\n    n = int(inputs['n_il12p70_experiments'])\n    ctrl_mean = inputs['il12p70_control']\n\
      \    ctrl_sd = inputs['il12p70_control_sem'] * np.sqrt(n)\n\n    means = np.array([\n        inputs['il12p70_at_0p02_ngml'],\n\
      \        inputs['il12p70_at_0p2_ngml'],\n        inputs['il12p70_at_2_ngml'],\n    ])\n    sds = np.array([\n      \
      \  inputs['il12p70_0p02_sem'],\n        inputs['il12p70_0p2_sem'],\n        inputs['il12p70_2_sem'],\n    ]) * np.sqrt(n)\n\
      \n    concs = np.array([\n        inputs['tgfb_conc_low_nM'],\n        inputs['tgfb_conc_mid_nM'],\n        inputs['tgfb_conc_high_nM'],\n\
      \    ])\n\n    # Compute per-point IC50 estimates from mean values\n    # Hill (n=1): fraction = IC50/(c+IC50) => IC50\
      \ = c*f/(1-f)\n    fracs = means / ctrl_mean\n    ic50_per_point = concs * fracs / (1 - fracs)\n    log_ic50 = np.log(ic50_per_point)\n\
      \n    # Bootstrap: resample the 3 log-IC50 estimates with replacement\n    # and add noise from SEM-derived uncertainty\n\
      \    log_ic50_sd = np.std(log_ic50, ddof=1)\n    bootstrap_ic50 = np.zeros(n_bootstrap)\n    for i in range(n_bootstrap):\n\
      \        idx = rng.choice(len(log_ic50), size=len(log_ic50), replace=True)\n        bootstrap_ic50[i] = np.exp(\n  \
      \          np.mean(log_ic50[idx]) + rng.normal(0, log_ic50_sd / np.sqrt(n))\n        )\n\n    return bootstrap_ic50\n"
  identifiability_notes: 'TGFb_50_APC is constrained by 3 dose-response points spanning no effect (0.0008 nM)

    to complete suppression (0.08 nM). The n=1 Hill assumption causes per-point IC50

    estimates to span ~10x (0.002-0.02 nM), reflecting model structure mismatch rather

    than data noise. The geometric mean (~0.004 nM) is robust. In the PDAC TME where

    active TGFbeta likely exceeds 0.1 nM, H_TGFb_APC is near saturation regardless of

    whether IC50 is 0.004 or 0.07 nM, limiting the parameter''s influence on model

    outputs at physiological concentrations. This may explain its moderate PRCC rank (46)

    despite high OBED rank (9).

    '
