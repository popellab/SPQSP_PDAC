study_interpretation: 'Guthridge2006 provides quantitative dose-response data for GM-CSF signaling in human myeloid cells,

  measuring EC50 for survival (0.44 pM) and proliferation (5.5 pM) via STAT5 phosphorylation. The study

  identifies a binary signaling switch at ~10 pM: below this threshold, GM-CSF activates only Ser585/PI3K

  (survival), while above it, Tyr577/JAK2/STAT5 signaling drives proliferation and activation. For DC

  maturation at a GVAX injection site, the relevant EC50 is the proliferation/activation threshold (~5-10 pM

  = 0.005-0.01 nM), not the survival EC50. However, the standard in vitro DC differentiation protocol uses

  10-20 ng/mL (0.7-1.4 nM), which is well above the signaling EC50, suggesting that additional factors

  (receptor density, cooperative signaling, or competing cytokines) raise the effective EC50 in tissue.

  The model EC50 should reflect the functional half-maximal response for APC recruitment and

  maturation, which is bounded below by the signaling EC50 (~10 pM) and above by standard

  culture concentrations (~1 nM).

  '
key_assumptions:
- 'The GM-CSF Hill function in the QSP model (H_GMCSF = GMCSF/(EC50_GMCSF + GMCSF)) represents

  a lumped EC50 for APC recruitment and maturation, not a single molecular binding event.

  '
- 'TF-1 myeloid cell EC50 values from Guthridge2006 are a reasonable proxy for DC/APC responsiveness

  to GM-CSF, given that both are myeloid lineage cells expressing the same GM-CSF receptor complex.

  '
- 'The effective EC50 in tissue is higher than the in vitro signaling EC50 due to receptor density,

  competing ligands, and tissue diffusion barriers.

  '
- 'Standard DC culture concentrations (0.7-1.4 nM) represent saturating conditions well above EC50.

  '
key_study_limitations:
- 'Guthridge2006 uses TF-1 erythroleukemia cells, not primary DCs. EC50 may differ for tissue-resident

  APCs at an intradermal injection site.

  '
- 'No direct measurement of GM-CSF EC50 for DC maturation specifically exists; the calibration

  relies on TF-1 cell signaling data as a proxy.

  '
