    state_variables: null
    type: algebraic
    formula: EC50_GMCSF ≈ EC50 for myeloid activation (proliferation/CD11b)
    code: "def compute(params, inputs):\n    return params['EC50_GMCSF']  # nM, compared to observed EC50\n"
