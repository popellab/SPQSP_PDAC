  forward_model:
    data_rationale: 'Guthridge2006 provides direct EC50 measurements for GM-CSF-stimulated proliferation (5.5 pM)

      and survival (0.44 pM) in TF-1 myeloid cells, and activation EC50 (1.6 pM) in primary

      neutrophils. The proliferation/activation EC50s are the most relevant functional readouts

      for DC maturation/activation.

      '
    submodel_rationale: 'The QSP model uses a simple Hill function H_GMCSF = GMCSF/(EC50_GMCSF + GMCSF) to gate

      APC recruitment and maturation at the GVAX injection site. EC50_GMCSF is a single lumped

      parameter that can be directly constrained by dose-response EC50 measurements.

      '
