  - name: ec50_gmcsf_guthridge2006
    observable: null
    units: nanomolarity
    uses_inputs:
    - ec50_proliferation_tf1
    - ec50_activation_neutrophil
    - pm_per_nM
    evaluation_points: null
    sample_size_input: n_guthridge2006_experiments
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    pm_per_nM\
      \ = inputs['pm_per_nM']  # 1000\n    # Two myeloid activation EC50s from Guthridge2006:\n    # TF-1 proliferation (5.5\
      \ pM) and neutrophil CD11b activation (1.6 pM)\n    ec50_tf1_nM = inputs['ec50_proliferation_tf1'] / pm_per_nM\n   \
      \ ec50_neut_nM = inputs['ec50_activation_neutrophil'] / pm_per_nM\n    # Lognormal parametric bootstrap from the two\
      \ point estimates\n    log_vals = np.log([ec50_tf1_nM, ec50_neut_nM])\n    mu = np.mean(log_vals)\n    sigma = np.std(log_vals,\
      \ ddof=1)\n    return rng.lognormal(mean=mu, sigma=sigma, size=n_bootstrap)\n"
