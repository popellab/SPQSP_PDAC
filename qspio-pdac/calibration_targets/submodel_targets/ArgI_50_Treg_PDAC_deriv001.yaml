calibration:
  parameters:
  - name: ArgI_50_Treg
    units: nanomolarity
    nuisance: false
  - name: f_IL10_Treg_baseline
    units: percent
    nuisance: true
    prior:
      distribution: lognormal
      mu: 3.4
      sigma: 0.3
  - name: f_IL10_Treg_max
    units: percent
    nuisance: true
    prior:
      distribution: lognormal
      mu: 3.97
      sigma: 0.3
  forward_model:
    data_rationale: Yu2017 cultured neonatal CBMCs in L-arginine-free medium supplemented
      with defined L-arginine concentrations (0-1150 µM) and measured the fraction
      of CD4+CD25+FoxP3+ Tregs producing IL-10 after 48h PHA stimulation. The dose-dependent
      increase in IL-10+ Tregs provides a quantitative arginine dose-response that
      constrains the half-maximal arginine concentration for Treg IL-10 function.
    submodel_rationale: 'In the QSP model, ArgI_50_Treg is the half-maximal arginase-I
      concentration (nM) for Treg suppression via arginine depletion. The two-step
      submodel composes: (1) ArgI depletes arginine via Michaelis-Menten kinetics
      [Arg] = Arg_basal / (1 + ArgI/Km), and (2) Treg IL-10 function depends on arginine
      via a Hill function. At the experimental arginine concentrations (directly controlled),
      we fit step 2 (Arg_50_Treg_uM). Then ArgI_50_Treg is derived analytically: ArgI_50
      = Km * (Arg_basal/Arg_50 - 1) * MW_ArgI, converting from enzyme activity units
      to nM.'
    type: algebraic
    formula: f_IL10 = f_max * [Arg] / (Arg_50 + [Arg])
    code: "def compute(params, inputs):\n    import numpy as np\n    ArgI_50 = params['ArgI_50_Treg']\
      \  # nM\n    f_base = params['f_IL10_Treg_baseline']\n    f_max = params['f_IL10_Treg_max']\n\
      \    Km = inputs['Km_arginase_uM']  # uM\n    Arg_basal = inputs['arg_basal_uM']\
      \  # uM\n    # Two-step: Arg_50 = Arg_basal / (1 + ArgI_50_uM / Km)\n    Arg_50\
      \ = Arg_basal / (1.0 + ArgI_50 / (Km * 1000.0))\n    arg_concs = [\n       \
      \ inputs['arg_conc_0'],\n        inputs['arg_conc_50'],\n        inputs['arg_conc_150'],\n\
      \        inputs['arg_conc_500'],\n        inputs['arg_conc_1150'],\n    ]\n\
      \    results = {}\n    for i, arg in enumerate(arg_concs):\n        H = arg\
      \ / np.maximum(Arg_50 + arg, 1e-30)\n        f = f_base + (f_max - f_base) *\
      \ H\n        results[f'log_foxp3_IL10_pct_{i}'] = np.log(np.maximum(f, 1e-10))\n\
      \    return results\n"
  error_model:
  - name: foxp3_IL10_at_0uM
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['log_foxp3_IL10_pct_0']"
    units: percent
    uses_inputs:
    - foxp3_IL10_pct_arg0_mean
    - foxp3_IL10_pct_arg0_sem
    - n_cb_donors
    sample_size_input: n_cb_donors
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['foxp3_IL10_pct_arg0_mean']\n   \
      \ sem = inputs['foxp3_IL10_pct_arg0_sem']\n    sd = sem * np.sqrt(sample_size)\n\
      \    cv = sd / mean\n    sigma_ln = np.sqrt(np.log(1 + cv**2))\n    mu = np.log(mean)\n\
      \    return rng.normal(mu, sigma_ln / np.sqrt(sample_size), n_bootstrap)\n"
    n_bootstrap: 10000
  - name: foxp3_IL10_at_50uM
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['log_foxp3_IL10_pct_1']"
    units: percent
