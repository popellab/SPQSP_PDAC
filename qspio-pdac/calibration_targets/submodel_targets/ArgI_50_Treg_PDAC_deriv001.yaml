      \    import numpy as np\n    mean = inputs['foxp3_IL10_pct_arg150_mean']\n \
      \   sem = inputs['foxp3_IL10_pct_arg150_sem']\n    sd = sem * np.sqrt(sample_size)\n\
      \    cv = sd / mean\n    sigma_ln = np.sqrt(np.log(1 + cv**2))\n    mu = np.log(mean)\n\
      \    return rng.normal(mu, sigma_ln / np.sqrt(sample_size), n_bootstrap)\n"
    n_bootstrap: 10000
  - name: foxp3_IL10_at_500uM
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['log_foxp3_IL10_pct_3']"
    units: percent
    uses_inputs:
    - foxp3_IL10_pct_arg500_mean
    - foxp3_IL10_pct_arg500_sem
    - n_cb_donors
    sample_size_input: n_cb_donors
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['foxp3_IL10_pct_arg500_mean']\n \
      \   sem = inputs['foxp3_IL10_pct_arg500_sem']\n    sd = sem * np.sqrt(sample_size)\n\
      \    cv = sd / mean\n    sigma_ln = np.sqrt(np.log(1 + cv**2))\n    mu = np.log(mean)\n\
      \    return rng.normal(mu, sigma_ln / np.sqrt(sample_size), n_bootstrap)\n"
    n_bootstrap: 10000
  - name: foxp3_IL10_at_1150uM
    observable:
      type: custom
      code: "def compute(t, y, y_start):\n    return y['log_foxp3_IL10_pct_4']"
    units: percent
    uses_inputs:
    - foxp3_IL10_pct_arg1150_mean
    - foxp3_IL10_pct_arg1150_sem
    - n_cb_donors
    sample_size_input: n_cb_donors
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n\
      \    import numpy as np\n    mean = inputs['foxp3_IL10_pct_arg1150_mean']\n\
      \    sem = inputs['foxp3_IL10_pct_arg1150_sem']\n    sd = sem * np.sqrt(sample_size)\n\
      \    cv = sd / mean\n    sigma_ln = np.sqrt(np.log(1 + cv**2))\n    mu = np.log(mean)\n\
      \    return rng.normal(mu, sigma_ln / np.sqrt(sample_size), n_bootstrap)\n"
    n_bootstrap: 10000
  identifiability_notes: Arg_50_Treg_uM is well-constrained by the 5-point dose-response
    spanning 0-1150 µM, with the inflection clearly between 0 and 50 µM. f_IL10_Treg_max
    is identified from the plateau at 150+ µM. ArgI_50_Treg is then derived analytically
    from Arg_50, Km_arginase, and basal arginine via ArgI_50 = Km * (Arg_basal/Arg_50
    - 1). The main uncertainty propagates from Km_arginase (literature range 2-5 mM)
    and Arg_basal (50-150 µM in vivo).
experimental_context:
  species: human
  system: in_vitro_primary_cells
  cell_types:
  - name: cord blood mononuclear cells
    phenotype: Neonatal CBMCs containing CD4+CD25+FoxP3+ Tregs
    isolation_method: Ficoll-Paque density gradient from umbilical cord blood
    source: Healthy neonates, elective cesarean or normal delivery
  culture_conditions:
    substrate: 24-well plates
    serum_concentration: 10.0
    serum_concentration_units: percent
    oxygen_level: normoxic (37C, 5% CO2)
    culture_type: suspension
    medium: L-arginine-free SILAC RPMI-1640 with 10% heat-inactivated FBS, 1 mM glutamine,
      1 mM sodium pyruvate, supplemented with indicated L-arginine
    duration: 48 hours with PHA stimulation
    notes: 2e6 cells/mL, stimulated with 10 µg/mL PHA
  indication: healthy neonates
study_interpretation: Yu2017 demonstrates that neonatal Tregs (CD4+CD25+FoxP3+) show
  a dose-dependent increase in IL-10 production when cultured with increasing L-arginine
  concentrations, saturating above ~150 µM. The half-maximal response occurs between
  0 and 50 µM arginine. This arginine dose-response on Treg IL-10 function is composed
  with arginase-I Michaelis-Menten kinetics (Km ~3 mM from Daghigh1994) to derive
  the effective ArgI_50_Treg — the arginase concentration at which arginine depletion
  halves Treg IL-10 production.
key_assumptions:
- The arginine dose-response of neonatal cord blood Tregs is representative of tumor-infiltrating
  Tregs in PDAC for the purpose of estimating the half-maximal arginine concentration.
- The Hill coefficient for arginine dependence of Treg IL-10 is approximately 1 (standard
  Michaelis-Menten).
- Arginase-I Km from rat liver (Daghigh1994, ~3 mM) is applicable to human tumor-associated
  arginase activity.
- Baseline L-arginine in the PDAC tumor microenvironment is approximately 100 µM (within
  the normal plasma range of 50-150 µM).
key_study_limitations:
- Neonatal CBMCs differ from adult tumor-infiltrating Tregs in activation state, epigenetic
  programming, and metabolic requirements.
- PHA is a non-specific mitogen that may not recapitulate tumor-antigen-driven Treg
  activation.
- The L-arginine-free base medium creates an artificial starting point; in vivo arginine
  is never zero but may be depleted to low µM levels by MDSC arginase.
- Only 5 arginine concentrations were tested; the inflection between 0 and 50 µM is
  under-sampled.
primary_data_source:
  doi: 10.3389/fimmu.2017.00487
  title: L-Arginine-Dependent Epigenetic Regulation of Interleukin-10, but Not Transforming
    Growth Factor-beta, Production by Neonatal Regulatory T Lymphocytes
  authors:
  - Hong-Ren Yu
  year: 2017
  source_tag: Yu2017
  source_relevance:
    indication_match: proxy
    indication_match_justification: Neonatal cord blood Tregs used as proxy for tumor-infiltrating
      Tregs. The arginine-dependent IL-10 regulatory mechanism is likely conserved,
      but quantitative thresholds may differ.
    species_source: human
    species_target: human
    source_quality: primary_human_in_vitro
    perturbation_type: pharmacological
    perturbation_relevance: L-arginine titration directly manipulates the substrate
      of arginase-I, mimicking the metabolic depletion caused by MDSC arginase in
      the tumor microenvironment.
    tme_compatibility: low
    tme_compatibility_notes: Cord blood mononuclear cells in vitro lack the full PDAC
      TME (stroma, hypoxia, other immunosuppressive signals). The arginine dose-response
      provides a mechanistic constraint on one axis of Treg modulation but does not
      capture multi-factor interactions.
    measurement_directness: direct
    temporal_resolution: endpoint_pair
    experimental_system: in_vitro_primary
secondary_data_sources:
- doi: 10.1006/bbrc.1994.1909
  title: Inhibition of rat liver arginase by an intermediate in NO biosynthesis, NG-hydroxy-L-arginine
  authors:
  - Fatemeh Daghigh
  year: 1994
  source_tag: Daghigh1994
  contribution: Provides the Michaelis-Menten Km of arginase-I for L-arginine (~3
    mM), used to compose the arginine dose-response with enzyme kinetics to derive
    the effective ArgI_50_Treg.
  source_relevance:
    indication_match: proxy
    indication_match_justification: Rat liver arginase Km used as proxy for human
      MDSC arginase-I. Arginase-I is highly conserved across mammals with similar
      Km values.
    species_source: rat
    species_target: human
    source_quality: primary_animal_in_vitro
    perturbation_type: physiological_baseline
    perturbation_relevance: Enzyme kinetics measured under standard in vitro conditions.
    tme_compatibility: moderate
    tme_compatibility_notes: Purified enzyme kinetics may differ from in situ arginase
      activity in MDSC within the TME due to cofactor availability and post-translational
      modifications.
    measurement_directness: direct
    temporal_resolution: snapshot_or_equilibrium
    experimental_system: ex_vivo
