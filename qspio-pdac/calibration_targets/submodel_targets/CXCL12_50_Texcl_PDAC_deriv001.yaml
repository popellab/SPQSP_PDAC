study_interpretation: 'Hesselgesser 1998 provides Scatchard analysis of 125I-SDF-1alpha competitive binding

  on three human T cell lines (Jurkat, CEM, HUT78), yielding direct Kd measurements for

  the CXCR4-CXCL12 interaction. SDF-1alpha Kd values: Jurkat 7.5 +/- 2.6 nM (n=2

  experiments), CEM 7.1 +/- 3.5 nM, HUT78 18 +/- 5.1 nM. SDF-1beta Kd on Jurkat was

  13.7 +/- 4.2 nM, confirming both isoforms bind the same receptor with similar affinity.


  The model uses H_CXCL12_Texcl = CXCL12/(CXCL12_50_Texcl + CXCL12), an n=1 Hill

  function identical in form to the receptor occupancy equation where EC50 = Kd. The

  three SDF-1alpha Kd values from different T cell lines directly constrain this

  parameter, with inter-cell-line spread (7-18 nM) capturing biological variability in

  CXCR4 receptor presentation across T cell types.


  The functional EC50 for CXCR4 signaling (microphysiometer metabolic acidification) was

  18 nM on Jurkat cells (Figure 5D), consistent with the binding Kd range and indicating

  minimal spare receptor amplification. The current prior median (2 nM) is 4-9x below

  the measured Kd range; this target will pull the posterior upward.

  '
key_assumptions:
- 'Hill function EC50 equals receptor binding Kd. This holds for a simple receptor

  occupancy model (n=1 Hill) without cooperativity or spare receptor effects. The

  functional EC50 of 18 nM being comparable to binding Kd (7-18 nM) supports this

  assumption for CXCR4 on T cells.

  '
- 'SDF-1alpha (CXCL12alpha) Kd is used, not SDF-1beta Kd (13.7 nM). CXCL12alpha is the

  predominant isoform secreted by CAFs in the PDAC stroma. Both isoforms bind CXCR4 with

  similar affinity and compete for the same binding sites (Figure 1).

  '
- 'CXCR4 binding affinity on immortalized T cell lines (Jurkat, CEM, HUT78) is

  representative of primary T cells infiltrating PDAC. CXCR4 is a broadly expressed

  receptor whose ligand-binding domain is conserved. Transformed cells may differ in

  receptor density (150,000 sites/cell here) but not intrinsic affinity.

  '
key_study_limitations:
- 'Transformed T cell lines may have different CXCR4 post-translational modifications

  (glycosylation, sulfation) that affect effective affinity compared to primary TILs.

  However, the consistent Kd across three independent cell lines (7-18 nM) argues

  against cell-line-specific artifacts dominating the measurement.

  '
- 'Binding assays at 4C may not fully reflect 37C in vivo conditions. However, Kd is

  weakly temperature-dependent for most protein-protein interactions, and the functional

  EC50 at 37C (18 nM from microphysiometer) falls within the 4C binding Kd range.

  '
- 'The +/- values on Kd are standard errors from Scatchard curve fitting (2 experiments

  for Jurkat, unspecified for CEM and HUT78), not SD across biological replicates. True

  inter-experiment variability may be larger.

  '
- 'The model''s (1-H) exclusion mechanism is a simplification of the biphasic CXCL12

  response (low dose = attraction, high dose = repulsion/desensitization). The binding

  Kd constrains the receptor sensitivity threshold but does not validate the monotonic

  exclusion assumption.

  '
