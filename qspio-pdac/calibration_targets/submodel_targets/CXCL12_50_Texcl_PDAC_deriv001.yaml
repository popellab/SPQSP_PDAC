calibration:
  parameters:
  - name: CXCL12_50_Texcl
    units: nanomolar
  forward_model:
    type: algebraic
    formula: 'predicted_Kd = CXCL12_50_Texcl (receptor occupancy model: EC50 = Kd)'
    data_rationale: 'Scatchard analysis of competitive 125I-SDF-1alpha binding provides direct Kd

      measurements for CXCR4 on three human T cell lines. The Kd represents the

      concentration at which half of receptors are occupied, directly corresponding

      to the EC50 in the model''s Hill function.

      '
    submodel_rationale: 'The QSP model uses H_CXCL12_Texcl = CXCL12/(CXCL12_50_Texcl + CXCL12),

      an n=1 Hill function identical to the receptor occupancy equation where

      EC50 = Kd. The identity mapping (predicted Kd = parameter value) is exact

      for this model structure.

      '
    code: "def compute(params, inputs):\n    return params['CXCL12_50_Texcl']\n"
  error_model:
  - name: CXCR4_binding_Kd
    units: nanomolar
    uses_inputs:
    - Kd_Jurkat_SDF1a
    - Kd_Jurkat_SDF1a_se
    - Kd_CEM_SDF1a
    - Kd_CEM_SDF1a_se
    - Kd_HUT78_SDF1a
    - Kd_HUT78_SDF1a_se
    - n_experiments
    sample_size_input: n_experiments
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n\n    # Three\
      \ T cell line Kd values from Scatchard analysis\n    kd_vals = np.array([\n        inputs['Kd_Jurkat_SDF1a'],\n    \
      \    inputs['Kd_CEM_SDF1a'],\n        inputs['Kd_HUT78_SDF1a'],\n    ])\n    se_vals = np.array([\n        inputs['Kd_Jurkat_SDF1a_se'],\n\
      \        inputs['Kd_CEM_SDF1a_se'],\n        inputs['Kd_HUT78_SDF1a_se'],\n    ])\n\n    # Two-level bootstrap:\n  \
      \  # 1. Sample cell line with replacement (captures inter-line variability)\n    # 2. Add within-line Scatchard fit\
      \ uncertainty (lognormal, Kd is positive)\n    idx = rng.integers(0, len(kd_vals), n_bootstrap)\n    means = kd_vals[idx]\n\
      \    ses = se_vals[idx]\n    cv = ses / means\n    return rng.lognormal(np.log(means), cv / np.sqrt(sample_size), n_bootstrap)\n"
  identifiability_notes: 'Single parameter (CXCL12_50_Texcl) directly measured as binding Kd on three

    independent T cell lines. Well-identified: identity mapping with no degeneracy.

    The inter-cell-line spread (7-18 nM) captures biological variability and will

    produce a posterior centered around ~8-10 nM (geometric mean of 7.5, 7.1, 18 nM).

    '
