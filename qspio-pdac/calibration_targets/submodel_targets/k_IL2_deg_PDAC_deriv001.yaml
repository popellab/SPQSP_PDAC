    units: 1/minute
  forward_model:
    data_rationale: 'IL-2 PK studies report serum half-life from bolus IV injection. The alpha-phase half-life

      reflects the initial clearance rate, which is dominated by renal filtration systemically.

      For the tumor compartment, we use the alpha-phase timescale as a proxy for local degradation

      rate, acknowledging that tissue degradation may be somewhat slower (no renal clearance)

      but faster than the beta phase (no redistribution to account for).

      '
    submodel_rationale: 'In the full QSP model, IL-2 degradation is modeled as first-order decay:

      d[IL2]/dt = ... - k_IL2_deg * IL2 - k_IL2_cons * [consumers] * IL2 + ...

      The k_IL2_deg term represents intrinsic proteolytic degradation independent of receptor

      binding. This maps directly to a first-order decay constant derivable from half-life data.

      '
    independent_variable: null
    state_variables: null
    type: algebraic
    formula: t_half = ln(2) / k_IL2_deg
    code: "def compute(params, inputs):\n    import numpy as np\n    k = params['k_IL2_deg']  # 1/minute\n    t_half_min =\
      \ np.log(2) / k\n    return t_half_min\n"
  error_model:
  - name: il2_halflife_lotze1985
    observable: null
    units: minute
    uses_inputs:
    - lotze_alpha_halflife_low
    - lotze_alpha_halflife_high
    - konrad_alpha_halflife_min
    evaluation_points: null
    sample_size_input: n_lotze1985_patients
    observation_code: "def derive_observation(inputs, sample_size, rng, n_bootstrap):\n    import numpy as np\n    # Three\
      \ alpha-phase half-life estimates from two studies\n    t_half_vals = [\n        inputs['lotze_alpha_halflife_low'],\
      \   # 5 min (Lotze1985 low)\n        inputs['lotze_alpha_halflife_high'],   # 7 min (Lotze1985 high)\n        inputs['konrad_alpha_halflife_min'],\
      \    # 12.9 min (Konrad1990)\n    ]\n    # Lognormal parametric bootstrap from cross-study estimates\n    log_vals =\
      \ np.log(t_half_vals)\n    mu = np.mean(log_vals)\n    sigma = np.std(log_vals, ddof=1)\n    return rng.lognormal(mean=mu,\
      \ sigma=sigma, size=n_bootstrap)\n"
  identifiability_notes: 'k_IL2_deg is structurally identifiable from half-life data under first-order decay kinetics.

    In the full model, k_IL2_deg and k_IL2_cons both contribute to IL-2 disappearance, but

    k_IL2_deg represents the cell-independent degradation rate and is separately identifiable

    from the consumption term (which depends on T cell/Treg density).

    '
