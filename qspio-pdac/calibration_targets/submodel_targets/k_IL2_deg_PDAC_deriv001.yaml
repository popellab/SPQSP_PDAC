study_interpretation: 'Lotze1985 and Konrad1990 provide human pharmacokinetic data for recombinant IL-2 administered

  intravenously to cancer patients. Both studies report a fast distribution phase (alpha half-life

  5-13 min) and a slower elimination phase (beta half-life 30-120 min). For the QSP model''s tumor

  compartment, the relevant half-life is the local tissue degradation rate, which excludes renal

  clearance (the dominant systemic elimination pathway). The alpha-phase half-life (5-13 min)

  reflects distribution and initial clearance, while receptor-mediated endocytosis by T cells

  (especially IL-2Ralpha-high Tregs) contributes to local consumption. The model separates

  receptor-mediated consumption (k_IL2_cons) from intrinsic degradation (k_IL2_deg), so k_IL2_deg

  should reflect proteolytic degradation in the tissue microenvironment, bounded by the alpha-phase

  half-life (lower, includes renal clearance) and the beta-phase half-life (upper, includes

  redistribution). A tissue half-life of 5-30 min is physiologically reasonable.

  '
key_assumptions:
- 'IL-2 degradation in the tumor compartment follows first-order kinetics with rate constant k_IL2_deg.

  '
- 'The model''s k_IL2_deg represents intrinsic proteolytic degradation, not receptor-mediated

  consumption (handled separately by k_IL2_cons) or renal clearance (not relevant in TME).

  '
- 'The effective tissue half-life is longer than the serum alpha phase (no renal filtration in tissue)

  but shorter than the beta phase (which includes tissue redistribution, not just local degradation).

  '
- 'Human PK data from cancer patients is directly applicable to the tumor microenvironment

  degradation rate, with adjustment for the absence of renal clearance.

  '
key_study_limitations:
- 'Both studies measure serum PK, not tissue concentrations. No direct tissue IL-2 degradation

  measurements exist.

  '
- 'Lotze1985 used Jurkat-derived IL-2, not recombinant; glycosylation differences may affect

  half-life. Konrad1990 used recombinant E. coli IL-2 (non-glycosylated).

  '
- 'Two-compartment PK models conflate distribution with degradation in the alpha phase.

  '
- 'Cancer patients may have altered IL-2 clearance compared to healthy subjects due to

  increased IL-2R expression on tumor-infiltrating lymphocytes.

  '
