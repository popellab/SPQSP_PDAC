# =============================================================================
# CELL GEOMETRY (human)
# =============================================================================

- name: pdac_cancer_cell_diameter
  display_name: PDAC cancer cell diameter
  value: 17.0
  units: micrometer
  category: geometry
  species: human
  source:
    description: |
      Average PDAC ductal adenocarcinoma cell diameter from histomorphometry.
      PDAC cells are moderately pleomorphic (15-20 um range).
  typical_range: [15.0, 20.0]
  notes: |
    Cross-sectional area = pi*(d/2)^2 = pi*(8.5 um)^2 = 227 um^2 = 2.27e-4 mm^2.
    Use for converting model cell counts to IHC areal densities.

- name: pdac_cancer_cell_cross_section
  display_name: PDAC cancer cell cross-sectional area
  value: 2.27e-4
  units: millimeter**2 / cell
  category: geometry
  species: human
  source:
    description: |
      pi * (8.5 um)^2 = 227 um^2 = 2.27e-4 mm^2 per cell.
      Derived from pdac_cancer_cell_diameter (17 um) assuming spherical cells.
  typical_range: [1.77e-4, 3.14e-4]
  notes: |
    Use as conversion factor in observable.constants for IHC density targets.
    This is a geometric approximation; actual tumor tissue has lumens,
    stroma, and variable packing, so true area per cell in a tissue
    section is larger.

- name: t_cell_diameter
  display_name: T cell diameter
  value: 7.0
  units: micrometer
  category: geometry
  species: human
  source:
    description: |
      Resting T lymphocyte diameter ~7 um (6-8 um range). Activated T cells
      are larger (~10-12 um). Bufi 2015 measured resting T cells at 6.8 ± 0.4 um
      by micropipette aspiration.
    pmid: "26775433"
    authors: Bufi et al.
    year: 2015
  typical_range: [6.0, 12.0]

- name: macrophage_diameter
  display_name: Macrophage diameter
  value: 20.0
  units: micrometer
  category: geometry
  species: human
  source:
    description: |
      Tissue macrophage diameter ~15-25 um depending on activation state.
      Krombach 1997 measured human alveolar macrophages at 21.2 ± 0.4 um
      by light microscopy. 20 um is a standard value for tissue macrophages.
    pmid: "9400735"
    authors: Krombach et al.
    year: 1997
  typical_range: [15.0, 25.0]

- name: dendritic_cell_diameter
  display_name: Dendritic cell diameter
  value: 13.0
  units: micrometer
  category: geometry
  species: human
  source:
    description: |
      Mature myeloid dendritic cell diameter ~12-15 um (immature ~10-12 um,
      activated/mature ~14-18 um with dendrites). 13 um is a midpoint used in
      mIHC overcounting (Abercrombie) corrections for FFPE sections of CLEC9A+
      cDC1 and CD1c+ cDC2 in PDAC tumor tissue (Plesca 2022).
    doi: 10.3390/cancers14051216
    authors: Plesca et al.
    year: 2022
  typical_range: [10.0, 15.0]
  notes: |
    Used as Abercrombie correction term `d` in 2D->3D conversion for cDC1/cDC2
    densities measured by mIHC: counted_cells/mm^2 = (cells/V_T) * (t + d).

- name: mdsc_diameter
  display_name: MDSC (myeloid-derived suppressor cell) diameter
  value: 12.0
  units: micrometer
  category: geometry
  species: human
  source:
    description: |
      MDSCs are heterogeneous: granulocytic/PMN-MDSCs ~10-13 um (neutrophil-like),
      monocytic/M-MDSCs ~13-18 um (monocyte-like). 12 um is a population-weighted
      midpoint reflecting the PDAC mix (PMN-dominant per Stromnes 2014). Bain
      2014 reports human peripheral blood neutrophils at 9.5-12.5 um.
    pmid: "24574412"
    authors: Bain et al.
    year: 2014
  typical_range: [10.0, 15.0]
  notes: |
    Used as Abercrombie correction term in 2D->3D conversion for MDSC density
    observables. Source data (Sivagnanam Neutrophil/Eosinophil mIHC) treats
    PMN-MDSCs as a subset of the neutrophil compartment.

- name: fibroblast_diameter
  display_name: Fibroblast/CAF diameter
  value: 15.0
  units: micrometer
  category: geometry
  species: human
  source:
    description: |
      Quiescent fibroblasts ~10-12 um; activated CAFs/PSCs in PDAC are
      larger (~15-20 um) with stellate morphology. 15 um represents
      an effective spherical diameter for volume estimation.
  typical_range: [10.0, 20.0]

- name: ecm_tissue_density
  display_name: Hydrated ECM tissue density in PDAC
  value: 150.0
  units: milligram / milliliter
  category: tissue_composition
  species: human
  source:
    description: |
      Effective density of hydrated desmoplastic ECM in PDAC. Dense collagen
      networks contain ~10-20% dry protein by weight (dry collagen density
      ~1300 mg/mL). With interstitial water and proteoglycans, effective
      tissue density is 100-200 mg/mL. Used to convert ECM mass (mg) to
      volume (mL) in stromal fraction calculations.
    reference: "Erkan 2012, PMID: 22710569"
    pmid: "22710569"
    authors: Erkan et al.
    year: 2012
  typical_range: [100.0, 200.0]
  notes: |
    This is the BULK density of hydrated ECM gel (mass per volume of gel),
    NOT the collagen protein concentration within extracellular space
    (~20 mg/mL, used as the model parameter ECM_density in parameters_PDAC.m).
    Higher values (200 mg/mL) for densely packed collagen; lower (100 mg/mL)
    for looser stroma.

# =============================================================================
# PDAC TISSUE COMPOSITION
# =============================================================================

- name: pdac_cellularity_fraction
  display_name: PDAC tumor cellularity fraction
  value: 0.15
  units: dimensionless
  category: tumor_properties
  species: human
  source:
    description: |
      PDAC is highly desmoplastic with typically 5-20% tumor cellularity.
      Raphael 2017 (TCGA PAAD) reports median neoplastic cellularity of 0.34
      but notes that pathologist-estimated cellularity is often ~0.15 for
      microdissected samples; values as low as 5% are common. Stroma
      constitutes 80-95% of tumor mass in most PDAC.
    pmid: "28810144"
    doi: 10.1158/2159-8290.CD-17-0140
    authors: Raphael et al.
    year: 2017
  typical_range: [0.05, 0.30]
  notes: |
    Use for converting whole-tumor measurements to cancer-cell-specific values.
    Lower cellularity (5-15%) in highly desmoplastic tumors (majority of PDAC);
    higher (20-30%) in cellular/"squamous" variants. The 0.15 value represents
    a typical resectable PDAC; use 0.10 for ultra-desmoplastic cases.

- name: pdac_stromal_fraction
  display_name: PDAC stromal fraction
  value: 0.85
  units: dimensionless
  category: tumor_properties
  species: human
  source:
    description: |
      Complement of cellularity (1 - 0.15 = 0.85). PDAC stroma includes
      fibroblasts/PSCs, ECM (collagen, hyaluronan), vasculature, and immune
      infiltrate. Consistent with Raphael 2017 and Erkan 2012.
    pmid: "28810144"
    authors: Raphael et al.
    year: 2017
  typical_range: [0.70, 0.95]

- name: normal_pancreas_lactate
  display_name: Normal pancreas tissue lactate concentration
  value: 11.0
  units: millimole / liter
  category: tissue_composition
  species: human
  source:
    description: |
      Normal pancreas total tissue lactate = 11.0 ± 2.5 nmol/mg (n=9)
      by HR-MAS 1H NMR on fresh-frozen surgical specimens.
      Assumes tissue density ~1 g/mL, so nmol/mg ≈ mmol/L.
    reference: "Battini 2017 PMID: 28298227"
    pmid: "28298227"
    doi: 10.1186/s12916-017-0810-z
    authors: Battini et al.
    year: 2017
  typical_range: [5.0, 16.0]
  notes: |
    Total tissue lactate (intracellular + extracellular), not blood/interstitial
    lactate (~1-2 mM). Use as denominator for tumor_lactate_fold_change targets.
    PDAC tissue lactate = 16.1 ± 4.7 nmol/mg (fold ~1.47x, same study).
    Note: PMID 28366159 was a duplicate entry deleted from PubMed; use 28298227.

- name: normal_pancreas_glucose
  display_name: Normal pancreas tissue glucose concentration
  value: 1.225
  units: millimole / liter
  category: tissue_composition
  species: human
  source:
    description: |
      Normal pancreas total tissue glucose = 1.2247 ± 0.6158 nmol/mg (n=9)
      by HR-MAS 1H NMR on fresh-frozen surgical specimens.
      Assumes tissue density ~1 g/mL, so nmol/mg ≈ mmol/L.
    reference: "Battini 2017 PMID: 28298227"
    pmid: "28298227"
    doi: 10.1186/s12916-017-0810-z
    authors: Battini et al.
    year: 2017
  typical_range: [0.3, 2.5]
  notes: |
    Total tissue glucose (intracellular + extracellular). Much lower than blood
    glucose (~5 mM) due to cellular uptake. PDAC tissue glucose = 1.31 ± 1.10
    nmol/mg (p=0.79 vs PP, not significant; same study).
    Note: PMID 28366159 was a duplicate entry deleted from PubMed; use 28298227.

- name: normal_pancreas_collagen
  display_name: Normal pancreas collagen content (dry weight)
  value: 5.0
  units: microgram / milligram
  category: tissue_composition
  species: human
  source:
    description: |
      Normal pancreas collagen content ~3-8 ug/mg tissue (dry weight).
      Imamura 1995 measured hydroxyproline in normal human pancreas and
      converted to collagen content (~5 ug/mg). PDAC desmoplasia increases
      this 5-20x.
    pmid: "8532652"
    authors: Imamura et al.
    year: 1995
  typical_range: [3.0, 8.0]
  notes: |
    Per mg DRY tissue. Multiply by pancreas_dry_weight_fraction (~0.22)
    to get per mg wet tissue (~1.1 ug/mg). Use as denominator for
    collagen1_protein_level fold-change targets.

- name: pancreas_dry_weight_fraction
  display_name: Pancreas dry weight fraction
  value: 0.22
  units: dimensionless
  category: tissue_composition
  species: human
  source:
    description: |
      Human pancreas water content ~75-80%, giving dry weight fraction
      ~0.20-0.25. Value of 0.22 from Noblet 2018 tissue composition data
      and consistent with ICRP Reference Man soft tissue values.
    doi: "10.1186/s13014-018-0971-8"
    authors: Noblet et al.
    year: 2018
  typical_range: [0.20, 0.25]
  notes: |
    Use to convert dry-weight collagen content (Imamura 1995) to wet-weight
    basis for comparison with model ECM concentrations (mg/mL).

# =============================================================================
# CIRCULATING CELL COUNTS (additional)
# =============================================================================

- name: circulating_nk_count
  display_name: Circulating NK cell count
  value: 2.0e+9
  units: cell
  uncertainty:
    sd: 1.0e+9
  category: cell_counts
  species: human
  source:
    description: |
      Median 432.7 cells/uL (range 175-716) in 9 healthy adults x 5L blood volume
      = 2.16e9. Autissier 2010 Table 2, CD56+CD3- gating. Clinical reference
      range ~100-700 cells/uL (Caligiuri 2008).
    pmid: "20099249"
    authors: Autissier et al.
    year: 2010
  typical_range: [5.0e+8, 3.5e+9]
  notes: |
    May be reduced in PDAC patients. NK cells are extremely rare in
    PDAC tumors (< 1% of TILs) despite adequate circulating numbers.

- name: circulating_dc_count
  display_name: Circulating dendritic cell count
  value: 3.0e+8
  units: cell
  uncertainty:
    sd: 1.5e+8
  category: cell_counts
  species: human
  source:
    description: |
      Median 60.3 cells/uL (range 30-112) in 9 healthy adults x 5L blood volume
      = 3.0e8. Autissier 2010 Table 2, Lin-HLA-DR+ gating. Collin 2018 review
      gives 10-20 x 10^6/L total blood DCs. cDC1 (BDCA-3+/CD141+) ~10% of
      total DCs; cDC2 (BDCA-1+/CD1c+) ~60%; pDC ~30%.
    pmid: "20099249"
    authors: Autissier et al.
    year: 2010
  typical_range: [1.5e+8, 5.6e+8]
- name: ffpe_section_thickness
  display_name: FFPE tissue section thickness for mIHC
  value: 4.0
  units: micrometer
  category: geometry
  species: human
  source:
    description: |
      Standard FFPE tissue section thickness for multiplex immunohistochemistry
      (typical 3-5 micrometer range across published studies). Set to 4 micrometer
      midpoint to match the Plesca 2022 submodel target convention used for
      APC0_cDC2_T calibration. Used in density observables to project the model's
      3D volumetric density (cells/mL) into a 2D mIHC-equivalent density
      (cells/mm^2 of section) via density_2D = (cells/V_T) * thickness.
    doi: 10.3390/cancers14051216
    authors: Plesca et al.
    year: 2022
  typical_range: [3.0, 5.0]
  notes: |
    Used as `section_thickness_um` in calibration_targets/baseline_no_treatment/
    *_density_*.yaml constants block. The 25% uncertainty across the typical
    range is dwarfed by other prior uncertainties on per-V_T cell densities;
    future refinement could extract per-paper thicknesses from each density
    target's source Methods section.
