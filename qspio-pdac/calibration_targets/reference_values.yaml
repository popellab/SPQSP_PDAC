# =============================================================================
# CYTOKINE / CHEMOKINE KINETICS
# =============================================================================

- name: ccl2_half_life
  display_name: CCL2 (MCP-1) effective tissue half-life
  value: 0.1
  units: day
  uncertainty:
    sd: 0.05
  category: kinetics
  species: human
  source:
    description: |
      Effective tissue half-life (~2.4 hr) used in QSP modeling to capture
      local chemokine turnover. No direct human PK data for free CCL2;
      plasma clearance in mice is <1 min (Deshmane 2009). The 2.4 hr value
      accounts for proteoglycan binding, local production, and receptor-mediated
      uptake in tissue, not just free plasma clearance.
    pmid: "36310035"
    authors: Quaranta et al.
    year: 2023
  typical_range: [0.02, 0.5]
  notes: |
    This is a modeling parameter, not a directly measured PK value.
    Free plasma CCL2 clears in seconds-to-minutes; tissue-bound CCL2
    has much longer effective residence times.

- name: il2_half_life
  display_name: IL-2 plasma half-life
  value: 0.007
  units: day
  category: kinetics
  species: human
  source:
    description: |
      Distribution half-life 6.9 min, terminal half-life 85 min in humans
      after IV bolus. The 10-min value (0.007 day) reflects initial
      distribution phase, appropriate for local tissue dynamics.
    pmid: "2317789"
    authors: Konrad et al.
    year: 1990
  typical_range: [0.003, 0.02]
  notes: |
    Konrad 1990 is the definitive human IL-2 PK study (IV rIL-2 in cancer patients).
    Terminal t1/2 ~85 min reflects renal clearance; distribution t1/2 ~7 min
    reflects tissue uptake. Use 0.007 day for rapid local clearance in QSP models.

- name: ifng_half_life
  display_name: IFN-gamma plasma half-life
  value: 0.02
  units: day
  category: kinetics
  species: human
  source:
    description: |
      Plasma half-life 25-35 min in humans after IV infusion.
      Kurzrock 1985 reported t1/2 ~25-30 min in cancer patients.
      Consistent with Rutenfranz 1988 (~35 min).
    pmid: "3921249"
    authors: Kurzrock et al.
    year: 1985
  typical_range: [0.01, 0.05]
  notes: |
    0.02 day = 28.8 min, consistent with clinical PK data.
    IFN-gamma clearance is primarily renal.

