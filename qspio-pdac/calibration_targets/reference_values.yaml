# =============================================================================
# CIRCULATING CELL COUNTS (human, healthy adult)
# =============================================================================

- name: circulating_cd8_count
  display_name: Circulating CD8+ T cell count
  value: 2.5e+9
  units: cell
  uncertainty:
    sd: 1.0e+9
  category: cell_counts
  species: human
  source:
    description: |
      Median 505 cells/uL (range 411-825) in 9 healthy adults x 5L blood volume.
      Autissier 2010 Table 2, 12-color flow cytometry panel.
    pmid: "20099249"
    authors: Autissier et al.
    year: 2010
  model_species: V_C.CD8
  typical_range: [2.0e+9, 4.1e+9]
  notes: |
    May be reduced by 30-50% in advanced cancer patients due to lymphopenia.

- name: circulating_cd4_count
  display_name: Circulating CD4+ T cell count
  value: 4.3e+9
  units: cell
  uncertainty:
    sd: 1.5e+9
  category: cell_counts
  species: human
  source:
    description: |
      Median 860.7 cells/uL (range 521-1173) in 9 healthy adults x 5L blood volume.
      Autissier 2010 Table 2, 12-color flow cytometry panel.
    pmid: "20099249"
    authors: Autissier et al.
    year: 2010
  model_species: V_C.CD4
  typical_range: [2.6e+9, 5.9e+9]

- name: circulating_treg_count
  display_name: Circulating Treg count
  value: 2.0e+8
  units: cell
  uncertainty:
    sd: 1.0e+8
  category: cell_counts
  species: human
  source:
    description: |
      Approximately 2-6% of circulating CD4+ T cells (FoxP3+ gating).
      Liyanage 2002 reports 8.6% CD4+CD25+ in normal donors (n=35);
      modern FoxP3+CD127lo gating yields lower fractions (2-6%).
    pmid: "12193750"
    doi: 10.4049/jimmunol.169.5.2756
    authors: Liyanage et al.
    year: 2002
  model_species: V_C.Treg
  typical_range: [0.9e+8, 4.3e+8]

- name: circulating_treg_count_pdac
  display_name: Circulating Treg count in PDAC patients
  value: 5.7e+8
  units: cell
  uncertainty:
    sd: 3.0e+8
  category: cell_counts
  species: human
  source:
    description: |
      Derived from CD4+ absolute count (860.7 cells/uL, Autissier 2010) *
      blood volume (5e6 uL) * Treg fraction in pancreas cancer patients
      (0.132, Liyanage 2002): 860.7 * 5e6 * 0.132 = 5.68e8 cells.
    doi: 10.4049/jimmunol.169.5.2756
    authors: Liyanage et al.
    year: 2002
  model_species: V_C.Treg
  typical_range: [2.0e+8, 1.5e+9]
  notes: |
    PDAC-specific estimate using elevated Treg fraction (13.2% of CD4+)
    reported in pancreas cancer patients (Liyanage 2002, PMID 12193750),
    combined with healthy adult CD4+ counts (Autissier 2010, PMID 20099249)
    and standard blood volume. Higher than healthy circulating_treg_count
    (~2e8) due to cancer-associated Treg expansion. Use this as source_pool
    for steady_state_density models of Treg trafficking into PDAC tumors.

- name: circulating_monocyte_count
  display_name: Circulating monocyte count
  value: 2.3e+9
  units: cell
  uncertainty:
    sd: 0.7e+9
  category: cell_counts
  species: human
  source:
    description: |
      Median 455.7 cells/uL (range 310-605) in 9 healthy adults x 5L blood volume.
      Autissier 2010 Table 2, 12-color flow cytometry panel. Clinical range
      200-800 cells/uL (StatPearls NBK604207).
    pmid: "20099249"
    authors: Autissier et al.
    year: 2010
  typical_range: [1.0e+9, 3.0e+9]

# =============================================================================
# TISSUE CELL DENSITIES (human PDAC)
# =============================================================================

- name: pdac_cd45_density_mm2
  display_name: Total CD45+ leukocyte density in PDAC (IHC)
  value: 1000.0
  units: cell / millimeter**2
  uncertainty:
    sd: 500.0
  category: cell_counts
  species: human
  source:
    description: |
      Estimated from sum of immune subset densities. Tahkola 2019 reports
      CD3+ ~396 cells/mm^2 and CD8+ ~120 cells/mm^2 in PDAC whole sections.
      Porembka 2012 reports myeloid cells are ~66% of CD45+ cells in
      PDAC peripheral blood (not tumor tissue); used here as rough proxy
      for tumor myeloid:lymphoid ratio. Total CD45+ estimated as ~3x T cell density.
    doi: 10.1007/s00428-019-02549-1
    authors: Tahkola et al.
    year: 2019
  typical_range: [500.0, 2000.0]
  notes: |
    Highly variable across patients and tumor regions. PDAC stroma is
    myeloid-dominated (Porembka 2012). Tumor center has lower density
    than invasive margin.

- name: pdac_cd45_density_volumetric
  display_name: Total CD45+ leukocyte volumetric density in PDAC
  value: 2.5e+8
  units: cell / milliliter
  uncertainty:
    sd: 2.0e+8
  category: cell_counts
  species: human
  source:
    description: |
      Derived from IHC density (~1000 cells/mm^2) divided by section
      volume (4e-6 cm^3/mm^2) with cell-counting correction factor ~2x.
      Consistent with Liudahl 2021 spatial profiling of 135 PDAC specimens.
    doi: 10.1158/2159-8290.CD-20-0841
    authors: Liudahl et al.
    year: 2021
  typical_range: [1.0e+8, 1.0e+9]
  notes: |
    Use this as parent_density in steady_state_fraction models when
    the observable is a fraction of CD45+ cells.

