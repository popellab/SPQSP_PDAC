- name: ihc_section_volume_3um
  display_name: IHC section volume per mm^2 (3 um)
  value: 3.0e-06
  units: centimeter**3 / millimeter**2
  category: geometry
  species: human
  source:
    description: Standard 3-um paraffin section; volume = 3e-4 cm * 0.01 cm^2 per mm^2
  notes: |
    Use this to convert IHC cell densities (cells/mm^2) to volumetric
    densities (cells/cm^3). Multiply cells/mm^2 by 1/section_volume.
    Used for Chen2015 PDAC TAM data (3-um sections).

- name: ihc_section_volume_4um
