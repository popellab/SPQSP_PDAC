study_interpretation: |
  Li et al. (Cancer Cell 2022) performed mIHC on resected PDAC tumors from patients treated with neoadjuvant GVAX in a randomized platform trial (NCT02451982). Figure S4D reports CD8+PD-1+ T cells (exhausted) as percentage of all nucleated cells in non-LA tumor ROIs. Data points were digitized from the Arm A (GVAX) columns (n=9), pooling OS <2y and OS >2y subgroups.
key_assumptions:
- |
  mIHC CD8+PD-1+ T cells (exhausted) classification corresponds to the model species V_T.CD8_exh.
- |
  OS <2y and OS >2y subgroups were pooled as the QSP model does not condition on survival outcome.
- |
  Non-LA tumor areas (~90% of tumor volume) better match the model's well-mixed V_T compartment than LA regions.
key_study_limitations:
- |
  Values digitized from published scatter plots, not tabulated data. Reading precision limited by axis scale and symbol size.
- |
  Small sample size (n=9) yields wide confidence intervals.
- |
  The denominator ('all nucleated cells') includes B cells and other populations not in the model, so model fractions will be slightly overestimated.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        numerator = species_dict['V_T.CD8_exh']
        return numerator / species_dict['nucleated_total_T']

  units: dimensionless
  species:
  - V_T.CD8_exh
  - nucleated_total_T
  constants: []
  support: unit_interval
  mapping_rationale: |
    CD8+PD-1+ T cells map to V_T.CD8_exh. PD-1 expression on CD8 T cells indicates antigen-experienced, functionally exhausted cells in the TME.
  experimental_denominator: All nucleated cells in non-LA tumor ROI (mIHC)
  model_denominator_species:
  - V_T.C1
  - V_T.C_x
  - V_T.CD8
  - V_T.CD8_exh
  - V_T.Th
  - V_T.Th_exh
  - V_T.Treg
  - V_T.Mac_M1
  - V_T.Mac_M2
  - V_T.MDSC
  - V_T.cDC1
