  - V_T.mcDC1
  - V_T.mcDC2
  - V_T.iCAF
  - V_T.myCAF
  - V_T.apCAF
  - V_T.qPSC
  unmodeled_denominator_components: |
    B cells, endothelial cells, pericytes, and other non-modeled stromal cells present in the tissue section.
