study_interpretation: 'Li et al. (Cancer Cell 2022) performed mIHC on paired pre-treatment EUS-FNB biopsies and post-treatment surgical resection specimens from patients with resectable PDAC treated with
  neoadjuvant GVAX monotherapy (Arm A of NCT02451982). Figure 2F right subpanel ("Pre vs. Post" for CD8+GZMB+ T cells) shows paired pre- and post-treatment CD8+GZMB+ effector T cell densities in non-LA
  tumor areas connected by lines for each patient. We pool OS<2y and OS>2y subgroups (3 + 3 = 6 patients) and compute the per-patient fold change (post/pre) as the paired observable. No zero pre-values;
  all 6 patients usable.

  '
key_assumptions:
- 'CD8+GZMB+ T cells (mIHC cytotoxic-effector marker) map to V_T.CD8 in the QSP model (the non-exhausted effector pool). V_T.CD8_exh represents the dysfunctional exhausted pool which we assume is GZMB-low/negative;
  this is a modeling simplification since in reality some exhausted cells still express GZMB (early exhaustion) and the V_T.CD8 pool includes naive-like memory cells that may be GZMB-low. Residual mismatch
  is absorbed by translation-sigma during inference.

  '
- 'The per-patient fold change of CD8+ as "% of all nucleated cells in ROI" approximates the fold change of CD8+ absolute density in V_T. This holds when the denominator (total nucleated cells per ROI,
  which includes cancer cells, stroma, and other immune cells) is approximately stable across the pre→post window of ~2 weeks. Short-term changes in total nucleated cellularity on this timescale are expected
  to be small relative to the large CD8 infiltration changes reported.

  '
- 'OS<2y and OS>2y subgroups were pooled (3 + 7 = 10 patients) as the QSP model does not condition on survival outcome. Pooled median fold change is used as the arm-level calibration target.

  '
- 'Non-LA tumor areas represent the bulk desmoplastic tumor compartment and map better to the model''s well-mixed V_T than LA-restricted measurements, since the model does not discretize tertiary lymphoid
  aggregates as a separate compartment.

  '
- 'Pre-treatment EUS-FNB biopsy cores and post-treatment surgical resections both sample the same compartment (primary tumor). We assume the biopsy core is representative of the bulk non-LA tumor state
  at diagnosis (model t=0 after evolve_to_diagnosis).

  '
key_study_limitations:
- 'Values digitized from scatter plots with pre->post lines (Figure 2F right subpanel); cross-panel patient identity (e.g., matching Fig 2F CD8 patient 1 to Fig 2F CD8+GZMB+ patient 1) is not recoverable,
  but within-panel pre/post pairing IS preserved for each patient.

  '
- 'Sample size n=10 is modest; bootstrap CI95 of the median fold change is wide ([~2.7, ~8.9]).

  '
- 'Reading precision from the scatter plot is limited by symbol size and axis scale (y-axis up to ~20%). Estimated digitization uncertainty ±0.1-0.5%.

  '
- 'Pre-treatment biopsies sampled limited tissue (EUS-FNB core) and may not fully capture tumor heterogeneity, introducing additional within-patient pre/post variance unrelated to treatment.

  '
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        """Fold change in CD8+GZMB+ effector T cell density in V_T relative to pre-treatment baseline.

        CD8+GZMB+ T cells are the cytotoxic effector subset expressing granzyme B. We map these
        to V_T.CD8 (the non-exhausted, effector-competent pool) in the QSP model, since V_T.CD8_exh
        represents functionally impaired exhausted cells that in the model are assumed to be
        GZMB-low/negative. The fold change is computed relative to t=0 (diagnosis/pre-treatment).
        """
        cd8_eff = species_dict['V_T.CD8']
        baseline = cd8_eff[0]
        fold_change = (cd8_eff / baseline)
        return fold_change

  units: dimensionless
  species:
  - V_T.CD8
  constants: []
  support: positive_unbounded
  mapping_rationale: 'CD8+GZMB+ T cells (cytotoxic-effector subset expressing granzyme B) maps to V_T.CD8 (the non-exhausted, effector-competent CD8 pool in the QSP model). V_T.CD8_exh represents the exhausted
    pool that is assumed GZMB-low/negative in the model abstraction. Computing the fold change at t=21d relative to t=0 targets treatment-induced effector infiltration/expansion dynamics under GVAX.

    '
  experimental_denominator: 'Per-patient ratio of CD8+ T cell density (% of all nucleated cells in non-LA tumor ROI, mIHC) at post-treatment resection divided by the same quantity in the matched pre-treatment
    biopsy. The "% of nucleated cells" denominator implicitly includes cancer cells, stromal cells, and other immune cells in the ROI.

    '
  model_denominator_species:
  - V_T.CD8
  unmodeled_denominator_components: 'The paper''s "% of nucleated cells" denominator implicitly includes cancer cells and non-modeled stromal cells. For a fold-change observable this denominator cancels
    to first order IF the total nucleated cell count per ROI is approximately stable across pre→post. Our model observable computes absolute-density fold change of CD8 directly rather than percentage fold
    change, accepting this first-order approximation. Residual bias (driven by nucleated-cell turnover under treatment) is absorbed by translation-sigma during inference.

    '
  aggregation: null
