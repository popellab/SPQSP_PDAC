      10,000 beta-distribution draws provide stable estimates of the median and 95% credible interval while keeping computation inexpensive.
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np
        rng = np.random.default_rng(42)

        mean = inputs['treg_fraction_mean']  # dimensionless fraction
        sd = inputs['treg_fraction_sd']      # dimensionless fraction
        n_mc = int(inputs['n_mc_samples'].magnitude)

        m = mean.magnitude
        s = sd.magnitude
        var = s ** 2

        # Convert mean and variance on [0,1] to beta distribution parameters
        # mean = a / (a + b); var = a*b / ((a + b)**2 * (a + b + 1))
        k = m * (1.0 - m) / var - 1.0
        alpha = m * k
        beta = (1.0 - m) * k

        samples = rng.beta(alpha, beta, n_mc) * mean.units

        median_obs = np.median(samples)
        ci95_lower = np.percentile(samples, 2.5)
        ci95_upper = np.percentile(samples, 97.5)

        return {
            'median_obs': median_obs,
            'ci95_lower': ci95_lower,
            'ci95_upper': ci95_upper,
        }
