study_interpretation: |
  Li et al. (Cancer Cell 2022) performed multi-omic profiling of tumor specimens from a platform trial in resectable PDAC in which patients received neoadjuvant GVAX alone (arm A) or GVAX plus nivolumab (arm B) followed by surgical resection. Multiplex IHC was used to quantify CD4+ and CD8+ T cell subsets, including FoxP3+ regulatory T cells (Tregs), in intratumoral tertiary lymphoid aggregate (LA) regions and non-LA tumor areas. Figure 2A reports post-treatment densities (percentage of all cells in the region of interest) of multiple immune cell subtypes in LAs for arm A and arm B. We extract the mean and standard deviation of the fraction of FoxP3+ Tregs among all cells in post-treatment LAs in arm B as a proxy for the regulatory T cell fraction in the tumor after neoadjuvant GVAX + nivolumab.
key_assumptions:
- |
  The visually estimated Treg mean (0.08) and SD (0.04) from Figure 2A reasonably approximate the true values; uncertainty from manual figure reading is smaller than biological between-patient variability.
- |
  Percentages reported as 'density of immune cell subtypes' in Figure 2A represent fractions of all nucleated cells in the mIHC regions of interest within intratumoral lymphoid aggregates, and these fractions are treated as dimensionless values on [0,1].
- |
  The experimental measurement (FoxP3+ Tregs as percentage of all cells in LA ROIs) is approximated by the fraction of Tregs among all modeled immune cells in V_T. This is a better match than T-cells-only because LAs contain macrophages, DCs, and other myeloid cells alongside lymphocytes. The main unmodeled component is B cells, which constitute 50-70% of tertiary lymphoid structure cellularity; their absence from the denominator makes the model prediction systematically higher than the experimental value by an estimated 2-3x.
- |
  A beta distribution is an appropriate approximation for the sampling distribution of a bounded fraction (Treg proportion), using parameters inferred from the mean and SD extracted from the figure.
key_study_limitations:
- |
  Treg fractions and other immune cell densities are estimated from figure panels rather than numeric tables, introducing additional measurement uncertainty beyond the reported SDs.
- |
  The mIHC regions of interest focus on intratumoral lymphoid aggregates and may not capture the full spatial heterogeneity of Tregs across the entire primary tumor mass.
- |
  The clinical trial sample size is small (n=10 for arm B with evaluable LAs in Figure 2A), so estimates of between-patient variability for Treg fractions are imprecise.
- |
  B cells, which constitute 50-70% of cells in tertiary lymphoid structures, are not modeled. Their absence from the observable denominator means the model-predicted Treg fraction will be systematically higher than the experimental value by an estimated 2-3x. This systematic bias should be considered when interpreting calibration fit.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        # Fraction of FoxP3+ Tregs among all modeled immune cells in V_T.
        # Approximates the experimental measurement: Tregs as % of all cells
        # in lymphoid aggregate ROIs (Li 2022, Figure 2A).
        # B cells (major LA component, 50-70%) are not modeled, so the
        # denominator is smaller than reality — see key_assumptions.
        treg = species_dict['V_T.Treg']
        cd8 = species_dict['V_T.CD8']
        th = species_dict['V_T.Th']
        cd8_exh = species_dict['V_T.CD8_exh']
        th_exh = species_dict['V_T.Th_exh']
        mac_m1 = species_dict['V_T.Mac_M1']
        mac_m2 = species_dict['V_T.Mac_M2']
        cdc1 = species_dict['V_T.cDC1']
        cdc2 = species_dict['V_T.cDC2']
        mcdc1 = species_dict['V_T.mcDC1']
        mcdc2 = species_dict['V_T.mcDC2']
        mdsc = species_dict['V_T.MDSC']

        total_immune = (treg + cd8 + th + cd8_exh + th_exh
                        + mac_m1 + mac_m2
                        + cdc1 + cdc2 + mcdc1 + mcdc2 + mdsc)
        frac = (treg / total_immune)
        return frac

  units: dimensionless
  species:
  - V_T.Treg
  - V_T.CD8
  - V_T.Th
  - V_T.CD8_exh
  - V_T.Th_exh
  - V_T.Mac_M1
  - V_T.Mac_M2
  - V_T.cDC1
  - V_T.cDC2
  - V_T.mcDC1
  - V_T.mcDC2
  - V_T.MDSC
  constants: []
  support: unit_interval
  mapping_rationale: |
    Multiplex IHC in Li et al. (Cancer Cell 2022) quantifies FoxP3+ CD4+ Tregs as a percentage of all cells in ROIs within intratumoral lymphoid aggregates (LAs) after neoadjuvant GVAX + nivolumab. The experimental denominator includes all nucleated cells in the ROI (T cells, B cells, macrophages, DCs, myeloid cells, and some stromal/tumor cells). To approximate this, the model observable uses Tregs divided by all modeled immune cells in V_T: T cell subsets (CD8, Th, Treg, and exhausted variants), macrophages (M1, M2), NK cells, DCs (cDC1, cDC2, mcDC1, mcDC2), and MDSCs. The principal unmodeled component is B cells, which are abundant in LAs (50-70% of cells in tertiary lymphoid structures). Their absence makes the model denominator smaller than the true experimental denominator, so the predicted Treg fraction will be systematically higher than the measured value.
  experimental_denominator: all cells in ROI within intratumoral lymphoid aggregates (all nucleated cells including T cells,
    B cells, macrophages, DCs, myeloid cells, stromal cells)
  model_denominator_species:
  - V_T.Treg
  - V_T.CD8
  - V_T.Th
  - V_T.CD8_exh
  - V_T.Th_exh
  - V_T.Mac_M1
  - V_T.Mac_M2
  - V_T.cDC1
  - V_T.cDC2
  - V_T.mcDC1
  - V_T.mcDC2
  - V_T.MDSC
  unmodeled_denominator_components: |
    B cells (50-70% of cells in tertiary lymphoid structures) are not modeled. Their absence makes the model denominator smaller than the true experimental denominator, so the predicted Treg fraction will be systematically ~2-3x higher than the measured value. Non-immune cells (endothelial, stromal) in LAs are also unmodeled but are a minor fraction.
