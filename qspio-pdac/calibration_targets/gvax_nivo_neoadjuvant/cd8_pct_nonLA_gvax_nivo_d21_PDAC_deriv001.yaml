  assumptions: []
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np
        rng = np.random.default_rng(42)
        values = np.array([inputs['val_01'].magnitude, inputs['val_02'].magnitude, inputs['val_03'].magnitude, inputs['val_04'].magnitude, inputs['val_05'].magnitude, inputs['val_06'].magnitude, inputs['val_07'].magnitude, inputs['val_08'].magnitude, inputs['val_09'].magnitude, inputs['val_10'].magnitude])
        n = len(values)
        boot_medians = [np.median(rng.choice(values, size=n, replace=True)) for _ in range(10000)]
        dl = ureg('dimensionless')
        return {
            'median_obs': np.median(values) * dl,
            'ci95_lower': np.percentile(boot_medians, 2.5) * dl,
            'ci95_upper': np.percentile(boot_medians, 97.5) * dl,
        }
