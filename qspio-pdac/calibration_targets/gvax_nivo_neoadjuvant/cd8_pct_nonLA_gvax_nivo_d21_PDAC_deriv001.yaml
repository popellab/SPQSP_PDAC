study_interpretation: |
  Li et al. (Cancer Cell 2022) performed mIHC on resected PDAC tumors from patients treated with neoadjuvant GVAX + nivolumab in a randomized platform trial (NCT02451982). Figure 2E reports CD8 T cells as percentage of all nucleated cells in non-LA tumor ROIs. Data points were digitized from the Arm B (GVAX+nivo) columns (n=10), pooling OS <2y and OS >2y subgroups.
key_assumptions:
- |
  mIHC CD8 T cells classification corresponds to the model species V_T.CD8, V_T.CD8_exh.
- |
  OS <2y and OS >2y subgroups were pooled as the QSP model does not condition on survival outcome.
- |
  Non-LA tumor areas (~90% of tumor volume) better match the model's well-mixed V_T compartment than LA regions.
key_study_limitations:
- |
  Values digitized from published scatter plots, not tabulated data. Reading precision limited by axis scale and symbol size.
- |
  Small sample size (n=10) yields wide confidence intervals.
- |
  The denominator ('all nucleated cells') includes B cells and other populations not in the model, so model fractions will be slightly overestimated.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        numerator = species_dict['V_T.CD8'] + species_dict['V_T.CD8_exh']
        return numerator / species_dict['nucleated_total_T']

  units: dimensionless
  species:
  - V_T.CD8
  - V_T.CD8_exh
  - nucleated_total_T
  constants: []
  support: unit_interval
  mapping_rationale: |
    Total CD8+ T cells (effector + exhausted) as fraction of all nucleated cells in non-LA tumor. mIHC pan-CD8 staining detects both active and exhausted CD8+ T cells.
  experimental_denominator: All nucleated cells in non-LA tumor ROI (mIHC)
  model_denominator_species:
