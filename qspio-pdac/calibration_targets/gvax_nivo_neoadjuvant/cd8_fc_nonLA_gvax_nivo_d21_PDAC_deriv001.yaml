  assumptions: []
  distribution_code: "def derive_distribution(inputs, ureg):\n    \"\"\"Bootstrap the median of the per-patient paired fold changes.\n\n    The fold changes are declared as derived_arithmetic inputs (fc_01\
    \ .. fc_10)\n    with formula post_ii / pre_ii. The schema validator has already verified each\n    fc_ii matches post_ii / pre_ii within 1%, so here we simply consume the values.\n    \"\"\"\n    import\
    \ numpy as np\n    rng = np.random.default_rng(42)\n    names = ['fc_01', 'fc_02', 'fc_03', 'fc_04', 'fc_05', 'fc_06', 'fc_07', 'fc_08', 'fc_09', 'fc_10']\n    fold_changes = np.array([inputs[name].magnitude\
    \ for name in names])\n    n = len(fold_changes)\n    boot_medians = np.array([\n        np.median(rng.choice(fold_changes, size=n, replace=True))\n        for _ in range(10000)\n    ])\n    dl = ureg('dimensionless')\n\
    \    return {\n        'median_obs': np.median(fold_changes) * dl,\n        'ci95_lower': np.percentile(boot_medians, 2.5) * dl,\n        'ci95_upper': np.percentile(boot_medians, 97.5) * dl,\n    }\n"
