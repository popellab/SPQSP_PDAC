    in both specimens.

    '
  assay_type: 'Sequential staining-stripping multiplex immunohistochemistry (mIHC) with digital image analysis, CD8+ T cells quantified as % of all nucleated cells in ROI. At least three ROIs per specimen.

    '
scenario:
  description: 'Neoadjuvant GVAX + nivolumab immunotherapy in patients with resectable PDAC (Arm B of NCT02451982), followed by surgical resection approximately two weeks after the first vaccine dose. The
    QSP scenario corresponds to gvax_nivo_neoadjuvant_zheng2022 with stop_time=21 days and evolve_to_diagnosis initialization.

    '
  interventions:
  - intervention_description: 'Irradiated GM-CSF-secreting allogeneic PDAC vaccine (GVAX) plus nivolumab (anti-PD-1 antibody) administered in the neoadjuvant setting ~2 weeks before surgery. Nivolumab given
      concurrently with GVAX.

      '
  - intervention_description: 'Pancreaticoduodenectomy (or equivalent resection) performed ~2 weeks after the first vaccine dose; post-treatment tissue from this resection is used for the day-21 mIHC readout.

      '
