      Number of Monte Carlo samples used in the parametric bootstrap to propagate uncertainty from mean ± SD estimates of CD8+ T cell fractions to the distribution of the fold-change observable.
    rationale: |
      200,000 samples provide stable estimates of the median and 95% uncertainty bounds for the fold-change distribution while keeping computation feasible.
  - name: lognormal_cd8_density_distribution
