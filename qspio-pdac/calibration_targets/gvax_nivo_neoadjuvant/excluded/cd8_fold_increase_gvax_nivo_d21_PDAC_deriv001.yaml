    units: dimensionless
    description: |
      Indicator flag that CD8+ T cell fractions (pre- and post-treatment) are modeled with lognormal, rather than normal, distributions when sampling across patients.
    rationale: |
      Immune cell fractions are positive and right-skewed; modeling them as lognormal avoids negative values and better reflects multiplicative biological variability.
  - name: ignore_pre_post_correlation
    value: 0.0
    units: dimensionless
    description: |
      Assumes independence between pre- and post-treatment CD8+ T cell fractions when sampling paired values for the fold-change calculation.
    rationale: |
      The paper provides group-level means and SDs but not the covariance between pre- and post-treatment CD8+ T cell fractions. Without access to patient-level data, we conservatively treat pre- and post-treatment measurements as independent when generating Monte Carlo samples, acknowledging that this likely overestimates the variance of the fold-change.
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np
        import math

        rng = np.random.default_rng(42)

        pre_mean = inputs['cd8_pre_mean']  # fraction of all cells (dimensionless)
        pre_sd = inputs['cd8_pre_sd']
        post_mean = inputs['cd8_post_mean']
        post_sd = inputs['cd8_post_sd']

        n_mc_samples = 200000  # Monte Carlo sample size

        def sample_lognormal(mean_q, sd_q):
            """Sample a lognormal distribution whose mean and SD match mean_q and sd_q.

            mean_q and sd_q are Pint Quantities with the same (dimensionless) units.
            """
            m = float(mean_q.magnitude)
            s = float(sd_q.magnitude)
            # Avoid division by zero or negative values
            if m <= 0.0:
                raise ValueError('Mean for lognormal sampling must be positive.')
            if s <= 0.0:
                # Degenerate case: no variability
                samples = np.full(n_mc_samples, m) * mean_q.units
                return samples
            sigma2 = math.log(1.0 + (s ** 2) / (m ** 2))
            sigma = math.sqrt(sigma2)
            mu = math.log(m) - 0.5 * sigma2
            raw_samples = rng.lognormal(mu, sigma, n_mc_samples)
            samples = raw_samples * mean_q.units
            return samples

        pre_samples = sample_lognormal(pre_mean, pre_sd)
        post_samples = sample_lognormal(post_mean, post_sd)

        # Fold-change in CD8+ T cell fraction (post / pre) per virtual patient
        fold_samples = (post_samples / pre_samples).to('dimensionless')

        median_obs = np.median(fold_samples)
        ci95_lower = np.percentile(fold_samples, 2.5)
        ci95_upper = np.percentile(fold_samples, 97.5)

        return {
            'median_obs': median_obs,
            'ci95_lower': ci95_lower,
            'ci95_upper': ci95_upper,
        }
