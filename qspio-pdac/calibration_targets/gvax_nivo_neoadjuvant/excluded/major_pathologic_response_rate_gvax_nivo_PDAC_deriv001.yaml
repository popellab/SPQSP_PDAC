  - name: n_mc_samples
    value: 100000.0
    units: dimensionless
    description: |
      Number of Monte Carlo samples used to propagate binomial sampling uncertainty in the major pathologic response rate.
    rationale: |
      100,000 samples provide stable estimates of the median and 95% CI of the response-rate distribution with Monte Carlo error much smaller than the sampling uncertainty from n=14 patients.
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np

        rng = np.random.default_rng(42)

        # Reported MPR rate in percent (e.g., 35 %) and number of resected patients
        mpr_pct = inputs['mpr_rate_percent']  # Quantity with 'percent' units
        n_resected = inputs['n_resected']     # dimensionless Quantity
        n_mc_samples = int(inputs['n_mc_samples'].magnitude)

        # Convert percent to dimensionless proportion (e.g., 0.35)
        p_hat = mpr_pct.to('dimensionless').magnitude
        n = int(n_resected.magnitude)

        # Infer integer responder count k from p_hat and n
        k = int(round(p_hat * n))

        # Beta posterior with uniform prior: Beta(k+1, n-k+1)
        a = k + 1
        b = n - k + 1

        samples = rng.beta(a, b, n_mc_samples) * ureg.dimensionless

        median_obs = np.median(samples)
        ci95_lower = np.percentile(samples, 2.5)
        ci95_upper = np.percentile(samples, 97.5)

        return {
            'median_obs': median_obs,
            'ci95_lower': ci95_lower,
            'ci95_upper': ci95_upper,
        }
