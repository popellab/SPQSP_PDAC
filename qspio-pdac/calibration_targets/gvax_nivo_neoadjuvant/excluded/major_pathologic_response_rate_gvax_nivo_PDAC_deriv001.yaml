study_interpretation: |
  This calibration target captures the major pathologic response (MPR) rate in patients with borderline resectable pancreatic ductal adenocarcinoma (PDAC) treated with neoadjuvant chemotherapy followed by GVAX pancreas vaccine with low-dose cyclophosphamide, nivolumab, and stereotactic body radiation therapy (SBRT), as reported for the phase II trial NCT03161379. The Clin Cancer Research article by Agarwal et al. reports that 31 patients with borderline resectable PDAC were enrolled, 18 received at least one dose of combined immunotherapy, and 14 underwent definitive surgical resection after neoadjuvant therapy. A subsequent review article summarizing this trial reports a 35% major pathologic response rate, defined as <10% residual viable tumor, with a median overall survival of 20.4 months. We interpret this as approximately 5 of 14 resected patients achieving MPR. In the QSP model, we represent MPR at the individual-patient level as the condition that the viable tumor burden in the primary tumor compartment (V_T.C1) at the time of resection is ≤10% of the baseline viable tumor burden before neoadjuvant therapy; aggregating across virtual patients yields a response rate directly comparable to the clinical MPR rate.
key_assumptions:
- |
  Major pathologic response (MPR) is assumed to correspond to <10% residual viable tumor cells in the resected primary PDAC specimen, consistent with contemporary definitions of MPR for neoadjuvant-treated pancreatic cancer. We map this to the model as a final viable tumor burden in the primary tumor compartment (V_T.C1) that is less than or equal to 10% of the baseline pre-treatment viable tumor burden.
- |
  The reported 35% major pathologic response rate for NCT03161379 is interpreted as applying to the 14 patients who underwent definitive surgical resection, yielding an inferred responder count of approximately 5 (5/14 ≈ 35.7%). Because the publication accessible in this environment does not tabulate the exact MPR numerator, we infer k = 5 responders by rounding p_hat × n and propagate this minor rounding uncertainty through the Beta distribution used in the Monte Carlo sampling.
- |
  The sample size for the MPR endpoint is taken as n = 14 (resected patients with pathologic assessment), even though 31 patients were enrolled in the trial; patients who did not undergo resection are not included in the denominator for MPR because pathologic response could not be assessed without surgical specimens.
- |
  Uncertainty in the true MPR proportion is modeled using a Beta(k+1, n−k+1) posterior distribution with a uniform prior, which is a standard conjugate-binomial approach. This assumes independent Bernoulli outcomes across patients and does not account for potential center-level clustering or other sources of overdispersion beyond binomial sampling error.
- |
  We assume that the residual viable tumor fraction measured histologically at resection reflects the minimum tumor burden achieved during neoadjuvant therapy (i.e., there is no substantial regrowth between end of therapy and surgery), so that comparing the final simulated viable tumor burden in V_T.C1 to baseline is a reasonable approximation of the clinical MPR definition.
key_study_limitations:
- |
  The exact number of patients achieving major pathologic response (numerator for the 35% rate) is not explicitly tabulated in the accessible summaries of the primary trial publication; we infer the numerator from the reported percentage (35%) and the known number of resected patients (n = 14), introducing small rounding uncertainty.
- |
  The 35% major pathologic response rate is extracted from a secondary review article that summarizes the results of the NCT03161379 trial rather than directly from the Clin Cancer Research full text, which is not accessible in this environment. Nonetheless, both sources describe the same patient cohort and treatment regimen.
- |
  The trial population consists of borderline resectable PDAC patients treated at specialized centers under a specific neoadjuvant chemo-immunoradiotherapy protocol; generalizability of the MPR rate to other PDAC stages, institutions, or treatment regimens (e.g., chemotherapy-only neoadjuvant approaches) is limited.
- |
  Pathologic assessment of residual viable tumor percentage is subject to inter-observer variability and potential sampling bias within the resected specimen; these sources of measurement error are not explicitly modeled in the current calibration target.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        """Compute per-patient residual viable tumor fraction over time.

        Major pathologic response (MPR) is defined as <10% residual viable tumor
        at resection. We approximate this by the ratio of viable tumor cells at
        resection to the baseline viable tumor cell count in the primary tumor
        compartment (V_T.C1).
        """
        tumor = species_dict['V_T.C1']  # viable cancer cells over time
        baseline = tumor[0]
        # Fraction of baseline viable tumor remaining at each time point
        fraction = (tumor / baseline)
        return fraction

  units: dimensionless
  species:
  - V_T.C1
  constants: []
  support: unit_interval
  mapping_rationale: |
    Clinical major pathologic response (MPR) after neoadjuvant therapy is defined as <10% residual viable tumor in the resected primary PDAC specimen. In the QSP model, we map this to the fraction of viable cancer cells remaining in the primary tumor compartment (V_T.C1) at the time of surgical resection relative to the baseline viable tumor burden before neoadjuvant therapy.
  experimental_denominator: |
    Baseline viable tumor burden in the primary pancreatic tumor (pre-treatment viable tumor cells).
  model_denominator_species:
  - V_T.C1
  unmodeled_denominator_components: |
    None. Both baseline and residual tumor viability are represented by the modeled viable cancer-cell population V_T.C1 in the primary tumor compartment.
  aggregation:
    type: response_rate
    threshold_code: |
      def classify_patient(time, species_dict, constants, ureg):
          """Classify a virtual patient as achieving major pathologic response (MPR).

          MPR is defined as <10% residual viable tumor at resection. We approximate
          resection as occurring at the final simulated time point and compare the
          viable tumor cell count at that time to the baseline value.
          """
          tumor = species_dict['V_T.C1']
          baseline = tumor[0]
          fraction = (tumor / baseline).to('dimensionless')
          residual_fraction = fraction[-1]
          return residual_fraction.magnitude <= 0.10
    time_point: null
    time_unit: null
    rationale: |
      Major pathologic response is a population-level endpoint defined as the proportion of patients whose resected primary tumor shows <10% residual viable tumor after neoadjuvant therapy. To connect this to the QSP model, we evaluate for each virtual patient whether the final simulated viable tumor burden in the primary tumor compartment (V_T.C1) is less than or equal to 0.10 times the baseline viable tumor burden, and then aggregate across patients as a response rate.
