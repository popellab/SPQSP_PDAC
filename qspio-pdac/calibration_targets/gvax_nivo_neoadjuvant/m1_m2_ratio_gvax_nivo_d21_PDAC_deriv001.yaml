  assumptions:
  - name: n_mc_samples
    value: 100000.0
    units: dimensionless
    description: |
      Number of Monte Carlo samples used to propagate uncertainty from the lognormal parameterization to the M1/M2 ratio distribution.
    rationale: |
      100,000 samples provide stable estimates of the median and 95% interval for the ratio distribution.
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np

        # Extract inputs as Pint Quantities
        ratio_med = inputs['m1_m2_ratio_median']
        ratio_q1 = inputs['m1_m2_ratio_q1']
        ratio_q3 = inputs['m1_m2_ratio_q3']
        n_samples = int(inputs['n_mc_samples'].magnitude)

        # z-score for first and third quartiles of a standard normal
        z_q = 0.67448975

        # Derive lognormal parameters from median and IQR
        sigma = np.log(ratio_q3.magnitude / ratio_q1.magnitude) / (2.0 * z_q)
        mu = np.log(ratio_med.magnitude)

        rng = np.random.default_rng(42)

        # Sample from lognormal distribution; ratio is dimensionless
        samples = rng.lognormal(mu, sigma, n_samples) * ureg('dimensionless')

        median_obs = np.median(samples)
        ci95_lower = np.percentile(samples, 2.5)
        ci95_upper = np.percentile(samples, 97.5)

        return {
            'median_obs': median_obs,
            'ci95_lower': ci95_lower,
            'ci95_upper': ci95_upper,
        }
