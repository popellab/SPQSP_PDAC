study_interpretation: |
  Li et al. (Cancer Cell 2022) performed multiplex immunohistochemistry (mIHC) on resected PDAC tumors from patients treated with neoadjuvant GVAX ± nivolumab in a randomized platform trial (NCT02451982). Figure 3B reports the M1 TAM/M2 TAM ratio in non-LA (non-lymphoid aggregate) tumor areas stratified by treatment arm (GVAX alone vs GVAX+nivolumab) and overall survival (OS <2y vs OS >2y). We digitized data points from the GVAX+nivolumab arm (Arm B, n=10) in the non-LA tumor region, pooling OS subgroups, to derive the post-treatment intratumoral M1/M2 macrophage ratio. Non-LA tumor area was chosen over LA because it represents ~90% of the tumor volume and better matches the model's well-mixed V_T compartment. The M1/M2 ratio in the LA region was higher (median ~2.0 vs ~0.3), reflecting concentrated immune activation in lymphoid aggregates.
key_assumptions:
- |
  M1 and M2 TAM classification by mIHC markers in Li et al. corresponds to the model's V_T.Mac_M1 and V_T.Mac_M2 populations. Specific marker panels are described in Table S3 of the supplementary material.
- |
  Data points were digitized from scatter plots in Figure 3B (non-LA tumor area, M1 TAM/M2 TAM panel). Values near zero on the y-axis (0–8 scale) were read as 0.1 rather than exactly 0, reflecting the resolution limit of figure digitization.
- |
  OS <2y and OS >2y subgroups within the GVAX+nivolumab arm were pooled to produce a single population-level calibration target (n=10), as the QSP model does not currently condition on survival outcome.
- |
  Patient-to-patient variability in the M1/M2 ratio is approximated by a lognormal distribution parameterized from the sample median and interquartile range, consistent with the positive-valued, right-skewed nature of the data.
key_study_limitations:
- |
  Values were digitized from published scatter plots (Figure 3B), not extracted from tabulated data. Reading precision is limited by the y-axis scale (0–8) and symbol size, estimated at ±0.1–0.2.
- |
  Small sample size (n=10 for GVAX+nivolumab arm) yields wide confidence intervals for the population distribution.
- |
  The non-LA tumor area M1/M2 ratio distribution appears bimodal, with most patients showing M2 dominance (ratio 0.1–0.3) and a minority showing M1 enrichment (ratio 2–4). The lognormal parametric fit smooths over this bimodality.
- |
  LA region data (median M1/M2 ~2.0, n=10) is not used in the primary target but provides an upper-bound validation check for models that resolve spatial immune heterogeneity.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        """Compute the ratio of M1 to M2 macrophages in the tumor compartment.

        species_dict contains tumor-compartment macrophage counts:
        - V_T.Mac_M1: number of M1 macrophages (cells)
        - V_T.Mac_M2: number of M2 macrophages (cells)

        The observable is the instantaneous ratio Mac_M1 / Mac_M2, which is
        dimensionless and strictly positive.
        """
        M1 = species_dict['V_T.Mac_M1']
        M2 = species_dict['V_T.Mac_M2']
        ratio = (M1 / M2)
        return ratio

  units: dimensionless
  species:
  - V_T.Mac_M1
  - V_T.Mac_M2
  constants: []
  support: positive_unbounded
  mapping_rationale: |
    Li et al. quantified M1 and M2 tumor-associated macrophages by mIHC in resected PDAC tumors. The M1 TAM/M2 TAM ratio in the non-LA tumor area (Figure 3B) represents the bulk-tumor macrophage polarization balance post-treatment. This maps directly to V_T.Mac_M1 / V_T.Mac_M2 in the model, as the tumor compartment is well-mixed and tissue area cancels in the ratio. Non-LA regions (representing ~90% of tumor area) provide the best match to the model's whole-tumor compartment.
  experimental_denominator: |
    Shared non-LA tumor region in which both M1-like and M2-like TAMs were quantified on the same resection sections by mIHC; tissue area cancels in the ratio.
  model_denominator_species:
  - V_T.Mac_M2
  unmodeled_denominator_components: |
    None for the ratio itself, assuming experimental M1 and M2 TAM classifications correspond directly to V_T.Mac_M1 and V_T.Mac_M2. Intermediate-polarization macrophages (neither clearly M1 nor M2) may exist experimentally but are not represented in the binary model.
  aggregation: null
