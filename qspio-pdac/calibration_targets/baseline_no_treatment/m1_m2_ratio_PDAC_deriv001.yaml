study_interpretation: |
  Costa et al. (Clin Cancer Res 2022) used multiplex immunofluorescence panels including CD68, CD163, IRF5, CD86, and CD206 to classify tumor-associated macrophages along an M1–M2 polarization spectrum in primary PDAC. In a comparative cohort of up-front surgery (treatment-naive) and FOLFIRINOX-treated patients, they quantified immune cell densities per square millimeter separately in tumor epithelium and stroma. Table 2 reports stromal macrophage densities as medians with interquartile ranges in cells/mm^2 for M1- and M2-polarized macrophages in the up-front surgery group (n=30). Because macrophages in PDAC are predominantly stromal and both M1 and M2 densities are measured per unit stromal area in the same tumors, the stromal M1/M2 density ratio is interpreted as a good proxy for the overall intratumoral ratio of M1 to M2 macrophage numbers. We therefore use this stromal M1/M2 ratio to calibrate the model observable V_T.Mac_M1 / V_T.Mac_M2 at the time of surgical resection in resectable, treatment-naive human PDAC.
key_assumptions:
- |
  Stromal M1 and M2 macrophage densities (cells/mm^2) are representative of the overall intratumoral macrophage compartment and can be used to approximate the ratio of total M1 to M2 macrophage numbers in the tumor.
- |
  The multiplex immunofluorescence marker combinations used by Costa et al. (CD68, CD163, IRF5, CD86, CD206) reliably distinguish functionally M1- versus M2-polarized macrophages and correspond closely to the model populations V_T.Mac_M1 and V_T.Mac_M2.
- |
  Patient-to-patient variability in stromal M1 and M2 macrophage densities can be reasonably approximated by independent lognormal distributions parameterized by the reported medians and interquartile ranges.
- |
  Correlation between M1 and M2 stromal densities across patients is not reported and is ignored in the Monte Carlo sampling for the M1/M2 ratio, which may overestimate the uncertainty of the ratio.
- |
  Immune measurements from 4 μm FFPE sections are assumed to reflect the average composition of the whole primary tumor used in the QSP model, without major bias from sampling location.
key_study_limitations:
- |
  The M1/M2 macrophage density ratio is not reported directly; it is derived here from marginal stromal M1 and M2 density distributions, ignoring within-patient correlation between these quantities.
- |
  Densities are measured in 4 μm-thick histologic sections and may not fully capture three-dimensional heterogeneity of macrophage distribution within the tumor mass.
- |
  The detailed stromal density data used for this target are from the 30-patient up-front surgery subset in the comparative cohort, rather than from the full 299-patient primary resection cohort, which may limit generalizability.
- |
  Macrophage polarization is inferred from a limited marker panel and may not capture the full continuum of TAM phenotypes in PDAC.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        """Compute the ratio of M1 to M2 macrophages in the tumor compartment.

        species_dict contains tumor-compartment macrophage counts:
        - V_T.Mac_M1: number of M1 macrophages (cells)
        - V_T.Mac_M2: number of M2 macrophages (cells)

        The observable is the instantaneous ratio Mac_M1 / Mac_M2, which is
        dimensionless and strictly positive.
        """
        M1 = species_dict['V_T.Mac_M1']  # cells
        M2 = species_dict['V_T.Mac_M2']  # cells

        # Avoid division by zero by assuming Mac_M2 > 0 in physiologic tumors.
        ratio = (M1 / M2)
        return ratio

  units: dimensionless
  species:
  - V_T.Mac_M1
  - V_T.Mac_M2
  constants: []
  support: positive_unbounded
  mapping_rationale: |
    Costa et al. quantified M1- and M2-polarized macrophage densities (cells/mm^2) in stromal regions of primary resected, previously untreated PDAC using multiplex immunofluorescence. Because both M1 and M2 densities are measured per unit stromal area in the same tumor regions, their ratio approximates the ratio of total intratumoral M1 to M2 macrophage numbers. We therefore map the experimental M1/M2 density ratio to the model state ratio V_T.Mac_M1 / V_T.Mac_M2, assuming that stromal macrophages dominate total tumor-associated macrophage populations in PDAC.
  aggregation: null
