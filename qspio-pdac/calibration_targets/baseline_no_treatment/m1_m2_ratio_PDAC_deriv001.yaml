  assumptions:
  - name: n_mc_samples
    value: 100000.0
    units: dimensionless
    description: |
      Number of Monte Carlo samples used to propagate uncertainty from M1 and M2 stromal densities to the M1/M2 ratio.
    rationale: |
      100,000 samples provide stable estimates of the median and 95% interval (<1% Monte Carlo error) for the ratio distribution.
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np

        # Extract inputs as Pint Quantities
        M1_med = inputs['M1_stromal_median']
        M1_q1 = inputs['M1_stromal_q1']
        M1_q3 = inputs['M1_stromal_q3']
        M2_med = inputs['M2_stromal_median']
        M2_q1 = inputs['M2_stromal_q1']
        M2_q3 = inputs['M2_stromal_q3']
        n_samples = int(inputs['n_mc_samples'].magnitude)

        # z-score for first and third quartiles of a standard normal
        z_q = 0.67448975

        def lognormal_params(median_q, q1_q, q3_q):
            """Derive lognormal mu, sigma from median and IQR (all Pint)."""
            m = median_q.magnitude
            q1 = q1_q.magnitude
            q3 = q3_q.magnitude
            sigma = np.log(q3 / q1) / (2.0 * z_q)
            mu = np.log(m)
            return mu, sigma

        # Derive lognormal parameters for M1 and M2 stromal densities
        mu_M1, sigma_M1 = lognormal_params(M1_med, M1_q1, M1_q3)
        mu_M2, sigma_M2 = lognormal_params(M2_med, M2_q1, M2_q3)

        rng = np.random.default_rng(42)

        # Sample from lognormal distributions and immediately reattach units
        M1_samples = rng.lognormal(mu_M1, sigma_M1, n_samples) * M1_med.units
        M2_samples = rng.lognormal(mu_M2, sigma_M2, n_samples) * M2_med.units

        # Compute M1/M2 ratio; units cancel to dimensionless
        ratio_samples = (M1_samples / M2_samples).to('dimensionless')

        median_obs = np.median(ratio_samples)
        ci95_lower = np.percentile(ratio_samples, 2.5)
        ci95_upper = np.percentile(ratio_samples, 97.5)

        return {
            'median_obs': median_obs,
            'ci95_lower': ci95_lower,
            'ci95_upper': ci95_upper,
        }
