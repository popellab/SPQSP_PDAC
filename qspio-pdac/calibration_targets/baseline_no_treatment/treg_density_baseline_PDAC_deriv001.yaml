study_interpretation: |
  Sivagnanam et al. (Cancer Discovery 2021) quantified immune cell densities by mIHC in 113 treatment-naive primary PDAC resection specimens. Supplementary Table S5 reports median Treg density (Foxp3+ cells) in the Tumor region as 14 cells/mm^2 (IQR 5-26). This provides a direct baseline constraint for V_T.Treg density in the model.
key_assumptions:
- Foxp3+ cells detected by mIHC correspond to the model's V_T.Treg population.
- |
  Patient-level Treg density follows a lognormal distribution parameterized from the reported median and IQR.
key_study_limitations:
- |
  Densities from FFPE tissue sections (2D) may not fully capture 3D spatial heterogeneity.
- |
  Foxp3 can be transiently expressed by activated conventional T cells, potentially overestimating true Treg counts.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        """mIHC-equivalent Treg density via V_T-based 3D->2D projection."""
        treg = species_dict['V_T.Treg']
        V_T = species_dict['V_T']
        thickness = constants['section_thickness_um']
        cell_diameter = constants['cell_diameter_um']  # Abercrombie correction term
        density = treg / V_T * (thickness + cell_diameter)
        # cells/mL * um -> cells/mm^2: (1 mL = 1000 mm^3, 1 um = 1e-3 mm) -> 1e-6
        return (density) * 1e-06

  units: cell / millimeter**2
  species:
  - V_T.Treg
  - V_T
  constants:
  - name: section_thickness_um
    value: 4.0
    units: micrometer
    biological_basis: |
      Standard FFPE tissue section thickness for mIHC quantification (typical 3-5 micrometer).
      Set to 4 micrometer to match the Plesca2022 submodel target convention used for APC0 calibration.
    source_type: reference_db
    reference_db_name: ffpe_section_thickness
    reference_db_names: null
    source_tag: null
  - name: cell_diameter_um
    value: 7.0
    units: micrometer
    biological_basis: |
      Resting T lymphocyte diameter ~7 micrometer (Bufi 2015). Used as Abercrombie overcounting term `d` in the 2D->3D projection: counted_cells/mm^2 = (cells/V_T) * (t + d).
    source_type: reference_db
    reference_db_name: t_cell_diameter
    reference_db_names: null
    source_tag: null
  support: positive
  mapping_rationale: |
    Foxp3+ Treg density from mIHC maps to V_T.Treg / V_T * thickness, projecting
    3D volumetric density into a 2D mIHC section. Matches Sivagnanam2021's
    cells/mm^2 of tumor area reporting.
  experimental_denominator: mm^2 of tumor tissue section
  model_denominator_species:
  - V_T
  unmodeled_denominator_components: null
  aggregation: null
