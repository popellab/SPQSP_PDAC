study_interpretation: |
  Golesworthy et al. (2022) performed multiplex IHC on resected PDAC specimens and
  directly computed the per-patient CD8+:FOXP3+ ratio by dividing CD8+ T cell count
  by FOXP3+ Treg count in each TMA core and averaging across replicates. For the
  HR/MMR-intact subgroup (n=166), the mean ± SD ratio was 9.8 ± 23.8. This is the
  directly reported per-patient ratio, avoiding the ratio-of-means bias that would
  arise from dividing aggregate CD8 density (40.5 cells/mm²) by aggregate Treg
  density (13.6 cells/mm²). The high CV (243%) reflects both biological heterogeneity
  and the mathematical amplification of variance when dividing two right-skewed
  quantities. This provides an independent constraint from a different cohort and
  assay platform than the existing deriv001 target (Liudahl/Sivagnanam 2021, n=113).
key_assumptions:
- |
  CD8+ T cells from mIHC include both effector and exhausted phenotypes,
  corresponding to V_T.CD8 + V_T.CD8_exh.
- |
  FOXP3+ cells identified by IHC correspond to V_T.Treg. Transient FOXP3
  expression in activated conventional CD4+ T cells may cause mild overestimation.
- |
  The directly reported per-patient ratio (mean 9.8 ± SD 23.8) is modeled as
  lognormal, which is appropriate for a strictly positive, highly right-skewed
  ratio variable (CV = 2.43).
- |
  Only the HR/MMR-intact subgroup (n=166) is used; the HR-deficient subgroup
  (n=25, higher ratio of 23.9 ± 52.7) is excluded as atypical of PDAC.
key_study_limitations:
- |
  Single-center cohort from a Canadian institution; may not generalize to
  other populations.
- |
  Very high inter-patient variability (CV 243%) means the lognormal
  parameterization is sensitive to the assumed distribution shape. The true
  distribution may have heavier tails or be multimodal.
- |
  TMA cores may not fully capture intra-tumoral heterogeneity in immune cell
  distributions, though averaging across replicates mitigates this.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        cd8 = species_dict['V_T.CD8']
        cd8_exh = species_dict['V_T.CD8_exh']
        treg = species_dict['V_T.Treg']
        ratio = ((cd8 + cd8_exh) / treg)
        return ratio

  units: dimensionless
  species:
  - V_T.CD8
  - V_T.CD8_exh
  - V_T.Treg
  constants: []
  support: positive_unbounded
  mapping_rationale: |
    Golesworthy et al. computed CD8+:FOXP3+ ratio per patient by dividing CD8+ count
    by FOXP3+ count in each TMA core. In the QSP model, CD8+ T cells include both
    effector (V_T.CD8) and exhausted (V_T.CD8_exh) populations, both of which express
    CD8 and would be counted by IHC. The observable maps to
    (V_T.CD8 + V_T.CD8_exh) / V_T.Treg.
  experimental_denominator: FOXP3+ Treg count per TMA core
  model_denominator_species:
  - V_T.Treg
  unmodeled_denominator_components: null
  aggregation: null
