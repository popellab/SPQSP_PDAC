  assumptions:
  - name: n_mc_samples
    value: 100000.0
    units: dimensionless
    description: Number of Monte Carlo samples for uncertainty propagation.
    rationale: 100,000 samples provide stable median and 95% CI estimates.
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np
        rng = np.random.default_rng(42)

        mean = inputs['cd8_foxp3_ratio_mean'].magnitude
        sd = inputs['cd8_foxp3_ratio_sd'].magnitude

        # Lognormal parameterization from mean and SD
        var = sd ** 2
        sigma2 = np.log(1.0 + var / mean ** 2)
        sigma = np.sqrt(sigma2)
        mu = np.log(mean) - 0.5 * sigma2

        n = int(inputs['n_mc_samples'].magnitude)
        samples = rng.lognormal(mu, sigma, n)

        return {
            'median_obs': np.median(samples) * ureg.dimensionless,
            'ci95_lower': np.percentile(samples, 2.5) * ureg.dimensionless,
            'ci95_upper': np.percentile(samples, 97.5) * ureg.dimensionless,
        }
