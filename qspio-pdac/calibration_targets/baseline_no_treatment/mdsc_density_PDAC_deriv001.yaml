study_interpretation: |
  Sivagnanam et al. Table S5 reports Neutrophil/Eosinophil density of 49 (17-149) cells/mm^2 in the Tumor region. This provides an approximate upper bound for PMN-MDSC density, as tumor-infiltrating neutrophils in PDAC include both conventional neutrophils and PMN-MDSCs that share surface markers.
key_assumptions:
- |
  Neutrophil/Eosinophil density provides an approximate proxy for V_T.MDSC, acknowledging that not all tumor-infiltrating neutrophils are MDSCs.
- |
  This mapping likely overestimates true MDSC density and should be treated as a soft upper bound.
key_study_limitations:
- |
  The mIHC panel cannot distinguish PMN-MDSCs from conventional neutrophils or eosinophils.
- |
  MDSC density may be substantially lower than the reported neutrophil/eosinophil density.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        """mIHC-equivalent MDSC density via V_T-based 3D->2D projection."""
        mdsc = species_dict['V_T.MDSC']
        V_T = species_dict['V_T']
        thickness = constants['section_thickness_um']
        cell_diameter = constants['cell_diameter_um']  # Abercrombie correction term
        density = mdsc / V_T * (thickness + cell_diameter)
        return (density) * 1e-06

  units: cell / millimeter**2
  species:
  - V_T.MDSC
  - V_T
  constants:
  - name: section_thickness_um
    value: 4.0
    units: micrometer
    biological_basis: |
      Standard FFPE tissue section thickness for mIHC quantification (typical 3-5 micrometer).
      Set to 4 micrometer to match the Plesca2022 submodel target convention used for APC0 calibration.
    source_type: reference_db
    reference_db_name: ffpe_section_thickness
    reference_db_names: null
    source_tag: null
  - name: cell_diameter_um
    value: 12.0
    units: micrometer
    biological_basis: |
      MDSC diameter ~12 micrometer (granulocytic ~10-13, monocytic ~13-18; PMN-dominant in PDAC). Used as Abercrombie overcounting term `d` in the 2D->3D projection: counted_cells/mm^2 = (cells/V_T) * (t + d).
    source_type: reference_db
    reference_db_name: mdsc_diameter
    reference_db_names: null
    source_tag: null
  support: positive
  mapping_rationale: |
    V_T.MDSC / V_T * thickness projects 3D MDSC density into 2D mIHC section.
    Neutrophil/eosinophil mIHC counts are an approximate upper bound (PMN-MDSCs
    share markers with conventional neutrophils).
  experimental_denominator: mm^2 of tumor tissue section
  model_denominator_species:
  - V_T
  unmodeled_denominator_components: Conventional neutrophils and eosinophils that are not MDSCs.
