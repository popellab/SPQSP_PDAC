study_interpretation: |
  Delitto et al. quantified a panel of 41 cytokines, chemokines and growth factors, including VEGF-A, in freshly homogenized pancreatic surgical specimens (normal pancreas, chronic pancreatitis, and pancreatic adenocarcinoma). For each sample, soluble mediators were measured in pg/mL and normalized to total protein content to yield concentrations in pg/mg protein. We use the VEGF row for the pancreatic adenocarcinoma group (n = 36) as an estimate of baseline intratumoral VEGF-A protein concentration in resectable human PDAC at the time of surgery. This provides a direct constraint on tumor VEGF-A levels in untreated or gemcitabine/abraxane-pretreated PDAC.
key_assumptions:
- |
  VEGF-A concentrations reported for the pancreatic adenocarcinoma group (n = 36) are treated as representative of resectable PDAC tumors, even though 10 of 36 patients received gemcitabine/abraxane-based neoadjuvant chemotherapy before resection.
- |
  Values reported as mean (SE) in Table 1 are interpreted as mean and standard error of the mean, and we derive the standard deviation as SD = SE × sqrt(n) for use in Monte Carlo sampling.
- |
  Intratumoral VEGF-A concentrations are modeled as approximately lognormally distributed, which is appropriate for positive, right-skewed biochemical concentration data; this replaces potentially biased truncated normal approximations.
- |
  We approximate total protein content in PDAC tumor tissue as 100 micrograms of protein per mg wet tissue, extrapolating from optimized brain protein extraction protocols, and assume soft-tissue density is close to 1 g/mL when converting pg/mL to pg/mg protein via the ml_per_mg_protein_tissue constant.
- |
  We assume that normalizing VEGF-A by total protein (pg/mg protein) does not substantially change relative variability compared with normalizing by tumor volume, so that the same observable can constrain VEGF-related parameters in the QSP model.
key_study_limitations:
- |
  Patient cohort includes a mixture of treatment-naive tumors and tumors exposed to gemcitabine/abraxane neoadjuvant chemotherapy, which may alter the inflammatory milieu and VEGF-A levels relative to strictly treatment-naive resectable PDAC.
- |
  VEGF-A is measured in bulk tumor homogenates normalized to total protein, integrating contributions from cancer cells, stroma, vasculature, and infiltrating immune cells; the model species V_T.VEGF represents compartment-average VEGF-A and cannot distinguish cellular sources.
- |
  The sample size for the pancreatic adenocarcinoma group (n = 36) is modest and derived from a single academic center, which may limit generalizability across PDAC populations.
- |
  The protein-per-tissue conversion used to relate pg/mL to pg/mg protein is derived from brain tissue and generic soft-tissue density rather than PDAC-specific measurements, introducing additional systematic uncertainty in the observable mapping.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        """Compute intratumoral VEGF-A concentration normalized per mg total protein.

        Model species V_T.VEGF is VEGF-A concentration in tumor interstitial fluid
        (pg/mL). Experimental measurements report VEGF-A as pg per mg total protein
        in tumor homogenate. We convert pg/mL to pg/mg protein using an assumed
        protein concentration of ~100 mg protein per mL tissue, encoded as the
        constant 'ml_per_mg_protein_tissue'.
        """
        vegf = species_dict['V_T.VEGF']
        ml_per_mg_protein = constants['ml_per_mg_protein_tissue']
        return (vegf * ml_per_mg_protein)

  units: picogram/milligram
  species:
  - V_T.VEGF
  constants:
  - name: ml_per_mg_protein_tissue
    value: 0.01
    units: milliliter/milligram
    biological_basis: |
      Ericsson and Nister (2011) report that optimized extraction and solubilization of brain tissue yields about 100 micrograms of protein per mg tissue wet weight, i.e., approximately 0.1 mg protein per mg tissue. Assuming soft tissues (including PDAC) have density close to 1 g/mL, this corresponds to roughly 100 mg protein per mL of tissue. The reciprocal gives ~0.01 mL tissue per mg protein, which we use as an approximate protein concentration for PDAC tumor homogenates when converting model VEGF-A concentration from pg/mL to pg/mg protein.
    source_type: literature
    reference_db_name: null
    reference_db_names: null
    source_tag: Ericsson2007_ProteinExtraction
  support: positive
  mapping_rationale: |
    Delitto et al. measure VEGF-A in freshly resected PDAC tumor homogenates as picograms per milligram of total protein using a Luminex multiplex immunoassay normalized to total protein. The model species V_T.VEGF represents VEGF-A concentration in the tumor compartment in pg/mL. Assuming approximately 100 micrograms protein per mg wet tissue and soft-tissue density near 1 g/mL, we convert pg/mL to pg/mg protein via a single proportionality constant (ml_per_mg_protein_tissue), so the observable directly matches the experimental normalization.
  experimental_denominator: milligram of total protein in tumor tissue homogenate
  model_denominator_species:
  - V_T.VEGF
  unmodeled_denominator_components: |
    Total protein includes structural, stromal, and immune-cell proteins not modeled explicitly; V_T.VEGF tracks only soluble VEGF-A in the tumor compartment, so the mapping assumes that VEGF-A per mg total protein scales with VEGF-A per unit tumor volume.
  aggregation: null
