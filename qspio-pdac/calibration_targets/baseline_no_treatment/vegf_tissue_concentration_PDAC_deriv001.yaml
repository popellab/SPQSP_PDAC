  - name: n_mc_samples
    value: 100000.0
    units: dimensionless
    description: |
      Number of Monte Carlo samples used to approximate the sampling distribution of intratumoral VEGF-A concentration.
    rationale: |
      100,000 samples provide stable estimates of the median and 95% CI for a lognormal distribution with moderate skew without excessive computation.
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np
        import math

        mean = inputs['vegf_mean_pg_per_mg']  # pg/mg
        se = inputs['vegf_se_pg_per_mg']      # pg/mg, standard error of the mean
        n_group = int(inputs['group_sample_size'].magnitude)

        # Convert SEM to SD
        sd = se * math.sqrt(n_group)

        # Lognormal parameterization from mean and SD (both positive-valued)
        mean_mag = mean.magnitude
        sd_mag = sd.magnitude
        mu_log = math.log(mean_mag ** 2 / math.sqrt(mean_mag ** 2 + sd_mag ** 2))
        sigma_log = math.sqrt(math.log(1.0 + (sd_mag ** 2) / (mean_mag ** 2)))

        n_mc = int(inputs['n_mc_samples'].magnitude)
        rng = np.random.default_rng(42)

        # Sampling strips units; reattach mean.units immediately after sampling
        samples = rng.lognormal(mu_log, sigma_log, n_mc) * mean.units

        median_obs = np.median(samples)
        ci95_lower = np.percentile(samples, 2.5)
        ci95_upper = np.percentile(samples, 97.5)

        return {
            'median_obs': median_obs,
            'ci95_lower': ci95_lower,
            'ci95_upper': ci95_upper,
        }
