  assumptions: []
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np
        rng = np.random.default_rng(42)
        mean = inputs['mean_treg_fraction'].magnitude
        sd = inputs['sd_treg_fraction'].magnitude

        # Beta distribution parameters from mean and SD on [0,1]
        var = sd ** 2
        common = mean * (1.0 - mean) / var - 1.0
        alpha = max(mean * common, 1e-3)
        beta_param = max((1.0 - mean) * common, 1e-3)

        samples = rng.beta(alpha, beta_param, 10000) * ureg.dimensionless
        return {
            'median_obs': np.median(samples),
            'ci95_lower': np.percentile(samples, 2.5),
            'ci95_upper': np.percentile(samples, 97.5),
        }
