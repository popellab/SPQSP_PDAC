    source_ref: Hiraoka2006
    value_location: Results section, text.
    value_snippet: |
      the prevalence of tumor-infiltrating TR in CD4+ T cells in pancreatic
      ductal adenocarcinoma (34.6 +/- 10.9%) was significantly higher
    input_type: direct_parameter
    conversion_formula: null
