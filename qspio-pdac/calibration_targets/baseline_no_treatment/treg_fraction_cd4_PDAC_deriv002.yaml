study_interpretation: |
  Hiraoka et al. (2006) quantified FOXP3+ regulatory T cell (TR) prevalence in
  CD4+ T cells in the tumor stroma of 198 resected pancreatic ductal adenocarcinomas
  using immunohistochemistry with a custom anti-FOXP3 monoclonal antibody. The mean
  TR prevalence in CD4+ T cells across all PDAC cases was 34.6 +/- 10.9% (mean +/- SD).
  This complements the Sivagnanam/Liudahl 2021 data (deriv001, n=113, multiplex IHC,
  derived from 5 CD4 subtype densities) with a direct measurement from a larger cohort
  using a simpler, targeted assay.
key_assumptions:
- |
  FOXP3+ cells identified by IHC are assumed to represent the functional Treg
  population (V_T.Treg). FOXP3 is the standard Treg marker, though transient
  FOXP3 expression can occur in activated conventional T cells.
- |
  The mean +/- SD (34.6 +/- 10.9%) is modeled as a Beta distribution on [0, 1],
  matching the bounded fraction support. The moderate CV (~0.32) supports this
  approximation.
- |
  All 198 patients had resectable PDAC. The paper does not specify neoadjuvant
  therapy status; patients are treated as representative of the PDAC TME at
  surgical resection (consistent with 2006 standard of care, pre-neoadjuvant era).
key_study_limitations:
- |
  Single-center Japanese cohort (n=198); ethnic and treatment practice differences
  may affect generalizability to Western populations.
- |
  Conventional IHC with a single marker (FOXP3) on FFPE sections, without multiplex
  phenotyping. Cannot distinguish FOXP3+ Treg subtypes (e.g., effector Treg vs
  resting Treg) or exclude transiently activated FOXP3+ conventional T cells.
- |
  The denominator (CD4+ T cells) was identified morphologically and by CD4 staining
  on adjacent sections, not by co-staining on the same section, which may introduce
  minor counting discrepancies.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        import numpy as np
        treg = species_dict['V_T.Treg']
        th = species_dict['V_T.Th']
        th_exh = species_dict['V_T.Th_exh']
        total_cd4 = treg + th + th_exh
        frac_array = np.where(total_cd4 > 0.0,
                              (treg / total_cd4),
                              0.0)
        return frac_array

  units: dimensionless
  species:
  - V_T.Treg
  - V_T.Th
  - V_T.Th_exh
  constants: []
  support: unit_interval
  mapping_rationale: |
    Hiraoka et al. measured FOXP3+ fraction of CD4+ T cells by IHC.
    In the QSP model, Tregs are V_T.Treg and total CD4+ T cells are
    V_T.Treg + V_T.Th + V_T.Th_exh. The observable maps to
    V_T.Treg / (V_T.Treg + V_T.Th + V_T.Th_exh).
  experimental_denominator: |
    CD4+ tumor-infiltrating T lymphocytes in the stroma of resected PDAC,
    identified by CD4 immunohistochemistry on adjacent sections (n=198).
  model_denominator_species:
  - V_T.Treg
  - V_T.Th
  - V_T.Th_exh
  unmodeled_denominator_components: |
    Experimental CD4+ denominator includes undifferentiated/bystander CD4+ T cells
    (Th0-like) that have no model equivalent. Sivagnanam data suggests Th0 comprises
    ~75% of CD4+ T cells in PDAC TME. The model denominator (V_T.Treg + V_T.Th +
    V_T.Th_exh) only includes activated/functional CD4+ subsets, so the model's Treg
    fraction will be systematically higher than this target. This target serves as a
    soft lower bound rather than an exact calibration point.
  aggregation: null
