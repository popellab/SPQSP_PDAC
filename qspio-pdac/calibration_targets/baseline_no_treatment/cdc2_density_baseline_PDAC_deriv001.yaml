    value_snippet: |
      Mean densities of PDAC-infiltrating (A) conventional DCs type 1 (cDC1s) (n = 40), (B) type 2 (cDC2s) (n = 40), and (C) plasmacytoid DCs (pDCs) (n = 58) were calculated for the whole tumor area (WTA), intraepithelial tumor area (IET), and tumor stroma (TS).
