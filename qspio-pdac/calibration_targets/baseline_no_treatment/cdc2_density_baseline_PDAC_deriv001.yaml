study_interpretation: |
  Plesca et al. analyzed tumor-infiltrating dendritic cell subsets in primary PDAC resections from 58 patients (40 with multiplex IHC data for cDC1/cDC2). Using multiplex immunohistochemistry and automated image analysis, they identified CD1c+CLEC10A+ cells as human cDC2s and quantified their density (cells/mm^2) within the whole tumor area (intraepithelial tumor plus tumor stroma) on formalin-fixed, paraffin-embedded sections. For calibration, we use the mean CD1c+CLEC10A+ cDC2 density in the whole tumor area (2.98 ± 0.597 cells/mm^2, n = 40), interpreted as the density of all CD4-priming cDC2s (immature + mature) in resectable human PDAC. In the QSP model this maps to the sum of immature and mature cDC2s in the tumor compartment (V_T.cDC2 + V_T.mcDC2), normalized by whole tumor area derived from modeled cancer cell counts and a fixed PDAC cellularity fraction.
key_assumptions:
- |
  CD1c+CLEC10A+ tumor-infiltrating cells in human PDAC correspond predominantly to the cDC2 subset and are appropriately mapped to V_T.cDC2 + V_T.mcDC2 in the model. CD1c can also label monocyte-derived DCs (moDCs); the CLEC10A co-staining partially mitigates this but may not fully exclude moDCs.
- |
  The reported 2.98 ± 0.597 cDC2s/mm^2 values in the WTA are treated as mean ± SEM across 40 patients, as explicitly stated in the Statistical Analysis section; we convert SEM to SD using SD = SEM·sqrt(n) and assume an underlying lognormal distribution for positive cell densities.
- |
  Densities measured on 25–50% of tumor-containing regions per slide (as defined by a pathologist) are assumed to be representative of the entire primary tumor immune microenvironment for each patient.
- |
  Although 36% of patients received neoadjuvant chemotherapy before resection and 64% underwent primary resection without neoadjuvant therapy, we treat the pooled cDC2 density as characteristic of resectable PDAC at surgery, based on the authors' finding that neoadjuvant chemotherapy did not significantly change DC frequencies.
- |
  Tumor cellularity is approximated as a fixed 15% across patients (pdac_cellularity_fraction) when converting model cancer cell counts to whole tumor area; inter-patient variability in cellularity and stromal content is not explicitly propagated into the uncertainty of the observable.
key_study_limitations:
- |
  Retrospective single-center cohort of 58 PDAC patients (40 with multiplex IHC data for cDC1/cDC2) treated between 2008 and 2015; results may not generalize to other institutions, ethnicities, or treatment eras.
- |
  Approximately 36% of patients received neoadjuvant chemotherapy, whereas 64% underwent primary resection; although the authors report no significant impact of neoadjuvant therapy on DC frequencies, subtle therapy-induced shifts cannot be excluded.
- |
  CD1c (BDCA-1) can also label monocyte-derived DCs (moDCs) which are abundant in PDAC. The CLEC10A co-staining helps but may not fully exclude moDCs, potentially inflating the measured cDC2 density relative to bona fide conventional cDC2s.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        """mIHC-equivalent cDC2 density via V_T-based 3D->2D projection.

        Returns total (immature + mature) cDC2 cells per mm^2 of section through
        whole tumor area, matching Plesca2022's CD1c+CLEC10A+ cDC2 reporting and
        the submodel target forward model convention.
        """
        cdc2_imm = species_dict['V_T.cDC2']
        cdc2_mat = species_dict['V_T.mcDC2']
        V_T = species_dict['V_T']
        thickness = constants['section_thickness_um']
        cell_diameter = constants['cell_diameter_um']  # Abercrombie correction term
        density = (cdc2_imm + cdc2_mat) / V_T * (thickness + cell_diameter)
        # cells/mL * um -> cells/mm^2: (1 mL = 1000 mm^3, 1 um = 1e-3 mm) -> 1e-6
        return (density) * 1e-06

  units: cell / millimeter**2
  species:
  - V_T.cDC2
  - V_T.mcDC2
  - V_T
  constants:
  - name: section_thickness_um
    value: 4.0
    units: micrometer
    biological_basis: |
      FFPE tissue section thickness reported by Plesca2022 (range 3-5 micrometer, midpoint 4).
      Matches the standard mIHC cell-density convention used in cDC1/cDC2 reporting.
    source_type: reference_db
    reference_db_name: ffpe_section_thickness
    reference_db_names: null
    source_tag: null
  - name: cell_diameter_um
    value: 13.0
    units: micrometer
    biological_basis: |
      Mature myeloid dendritic cell diameter (~12-15 micrometer; midpoint 13). Used as Abercrombie overcounting term `d` in the 2D->3D projection: counted_cells/mm^2 = (cells/V_T) * (t + d), correcting for FFPE sections (t ~ 4 micrometer) thinner than the cell diameter.
    source_type: reference_db
    reference_db_name: dendritic_cell_diameter
    reference_db_names: null
    source_tag: null
  support: positive
  mapping_rationale: |
    cDC2 density = (V_T.cDC2 + V_T.mcDC2) / V_T * thickness, projecting 3D
    volumetric density into a 2D mIHC section. Matches Plesca's cells/mm^2 of
    whole tumor area reporting. Note: this realized-density observable is the
    correct anchor for cDC2_recruit_target_T (renamed from APC0_cDC2_T 2026-05-02);
    do NOT use a direct submodel-target prior on the recruit-target parameter
    via Plesca tissue density — see notes/model/cdc1_homeostasis_vs_recruitment.md.
  experimental_denominator: |
    mm^2 of whole tumor tissue cross-section (intraepithelial tumor area plus tumor stroma) on resected PDAC specimens.
  model_denominator_species:
  - V_T
  unmodeled_denominator_components: null
  aggregation: null
