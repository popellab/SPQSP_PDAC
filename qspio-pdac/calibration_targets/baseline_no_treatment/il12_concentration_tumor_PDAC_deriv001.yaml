  assumptions: []
  distribution_code: "def derive_distribution(inputs, ureg):\n    # One-sided / censored\
    \ upper-bound encoding for IL-12p70 sub-LLOQ data.\n    # Dorman 2022 reports\
    \ >95% of pretreatment serum IL-12p70 values below\n    # the assay LLOQ; the\
    \ only quantitatively defensible target is an\n    # upper-bound likelihood. We\
    \ encode that here as a wide weak-interval\n    # target rather than a resolved\
    \ concentration distribution: median is\n    # placed at the LLOQ (the one-sided\
    \ bound the data informs) and the\n    # ci95 is widened to span [0.05*LLOQ, 2*LLOQ]\
    \ to reflect (a) the\n    # unresolved within-censoring distribution and (b) the\
    \ up-to-5% of\n    # subjects whose true concentration may exceed LLOQ.\n    lloq\
    \ = inputs['il12p70_lloq']\n    return {\n        'median_obs': lloq,\n      \
    \  'ci95_lower': lloq * 0.05,\n        'ci95_upper': lloq * 2.0,\n    }\n"
