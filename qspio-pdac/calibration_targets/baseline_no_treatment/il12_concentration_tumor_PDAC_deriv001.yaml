- IL-12p70
- cytokine
- censored
- serum_to_tumor
epistemic_basis: literature
study_interpretation: Dorman et al. measured a serum biomarker panel in 162 human
  patients with histologically confirmed PDAC before initiation of chemotherapy, including
  resected, locally advanced, and metastatic disease. IL-12p70 was directly assayed
  in pretreatment serum using the Meso Scale Discovery V-PLEX Plus Proinflammatory
  Panel 1 Human Kit, but the analyte was not quantitatively resolved in this cohort
  because more than 95% of values were below the assay lower limit of quantification.
  This target therefore encodes a low, left-censored baseline serum IL-12p70 observation
  for human PDAC rather than a fully resolved concentration distribution. The QSP
  model species V_T.IL12 represents tumor-compartment IL-12 concentration in nanomolar
  units, so the observable converts tumor IL-12p70 to mass concentration using the
  p70 molecular mass and maps it to serum through the declared serum:tumor auxiliary
  parameter f_serum_to_tumor_IL12.
key_assumptions:
- Because the primary paper reports that more than 95% of IL-12p70 values were below
  assay quantification and does not provide a resolved distribution in the main text,
  the empirical target is encoded as a censored low-concentration constraint rather
  than a precise population mean.
- The numerical assay LLOQ is taken from manufacturer assay documentation for the
  Meso Scale Discovery V-PLEX Plus Proinflammatory Panel 1 Human Kit; the paper identifies
  this kit as the assay used for IL-12p70.
- For Monte Carlo derivation, true serum IL-12p70 values in censored samples are approximated
  as uniformly distributed between 0 and the LLOQ. This deliberately broad interval
  avoids over-interpreting below-quantification measurements.
- Serum IL-12p70 is used as a compartment-bridged surrogate for tumor-compartment
  IL-12 through f_serum_to_tumor_IL12; the bridge is inferred jointly rather than
  fixed.
- The molecular mass of IL-12p70 is represented as 70 kDa, consistent with the p70
  heterodimer designation, to convert model molarity to pg/mL.
- The reported ci95 is a reconstructed inter-patient population interval (under a
  lognormal fit to the digitized summary statistics), not a confidence interval on
  the group mean.
- 'Dorman et al. report that >95% of pretreatment serum IL-12p70 values are below
  the assay LLOQ; only an upper bound is therefore informative. This target is encoded
  as a one-sided / censored constraint: median = LLOQ and ci95 widened to span [~0,
  2*LLOQ] to reflect (a) the unresolved within-censoring distribution and (b) the
  up-to-5% of subjects whose true value may exceed LLOQ. This is a deliberate weak
  interval target, not a resolved concentration distribution.'
- The numerical LLOQ is taken from manufacturer documentation for the MSD V-PLEX Plus
  Proinflammatory Panel 1 Human Kit rather than Dorman's Table S1/supplement. If the
  kit version, dilution protocol, or LLOQ definition differs, the encoded upper bound
  may be off by a factor of a few. Translation_sigma should reflect this added measurement-protocol
  uncertainty in addition to the f_serum_to_tumor_IL12 bridge.
key_study_limitations:
- The main article reports only that more than 95% of IL-12p70 values were below the
  lower level of quantification; it does not tabulate a resolved IL-12p70 median,
  IQR, or SD.
- The cohort combines resected, locally advanced, and metastatic PDAC, whereas the
  target model context is treatment-naive resectable PDAC.
- Serum cytokine concentration may differ substantially from tumor-compartment IL-12
  because of local production, clearance, and dilution in blood.
- The numerical LLOQ is sourced from assay documentation rather than being printed
  in the main article text supplied here.
- Cohort is mixed (resected, locally advanced, and metastatic PDAC); the extracted
  statistic is not a clean treatment-naive resectable baseline. experimental_context.stage
  retains 'metastatic' for worst-case TME compatibility flagging.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        il12_tumor = species_dict['V_T.IL12']
        f_serum_to_tumor = constants['f_serum_to_tumor_IL12']
        molecular_weight = constants['il12p70_molecular_weight']
        predicted_serum_molar = il12_tumor * f_serum_to_tumor
        predicted_serum_mass = predicted_serum_molar * molecular_weight
        return predicted_serum_mass

  units: picogram / milliliter
  species:
  - V_T.IL12
  constants:
  - name: il12p70_molecular_weight
    value: 70000.0
    units: gram / mole
    biological_basis: IL-12p70 is the approximately 70 kDa heterodimeric form of IL-12;
      70 kDa equals 70000 g/mol for molarity-to-mass concentration conversion.
    source_type: literature
    source_tag: Dorman2022
  auxiliary_parameters:
  - name: f_serum_to_tumor_IL12
    group: serum_to_tumor_local
    units: dimensionless
    biological_basis: Serum:tumor concentration ratio for IL-12p70. The literature
      reports human serum IL-12p70, while the QSP species V_T.IL12 is tumor-compartment
      IL-12; observable.code multiplies V_T.IL12 by this auxiliary factor to predict
      the serum concentration.
  support: non_negative
  mapping_rationale: The experimental measurement is circulating serum IL-12p70 mass
    concentration. The model species is a tumor-compartment IL-12 molar concentration,
    so the observable first converts molarity to mass concentration using the IL-12p70
    molecular weight and then uses the serum:tumor auxiliary factor to bridge compartmental
    gradients during inference.
  experimental_denominator: milliliter of patient serum
  model_denominator_species:
  - V_T.IL12
  unmodeled_denominator_components: Serum concentration reflects systemic dilution,
    clearance, and release from non-tumor tissues; these are not mechanistically represented
    in the tumor-compartment species and are absorbed by the serum:tumor auxiliary
    parameter.
  aggregation: null
