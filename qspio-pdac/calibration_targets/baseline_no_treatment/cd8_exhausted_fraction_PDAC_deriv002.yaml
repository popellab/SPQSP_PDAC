study_interpretation: |
  Shen et al. (2017) quantified PD-1 expression on CD8+ T lymphocytes in resected
  human PDAC (n=94) by double immunofluorescence staining. The mean PD-1+ fraction
  of CD8+ TILs was 30.62 ± 16.80% in tumor tissues vs 9.35 ± 6.60% in adjacent
  non-tumor tissues. This provides a direct measurement of the exhausted CD8 fraction
  in the PDAC TME, complementing the Shibuya 2014 flow cytometry data (deriv001)
  with a larger cohort and a different assay methodology (IF vs flow cytometry).
  The lower mean (31% vs 70%) likely reflects differences in PD-1 detection
  sensitivity between IF on FFPE sections and flow cytometry on fresh tissue.
key_assumptions:
- |
  PD-1 expression on CD8+ TILs measured by double immunofluorescence is used as a
  proxy for the exhausted/dysfunctional CD8 subset (V_T.CD8_exh). PD-1 alone is an
  imperfect marker; some PD-1+ cells retain effector function.
- |
  The mean ± SD (30.62 ± 16.80%) is assumed to represent a normal distribution on
  the fraction, truncated to [0, 1]. Given the moderate CV (~0.55), this is a
  reasonable approximation.
- |
  All 94 patients had resectable PDAC and underwent surgical resection. The study
  does not report neoadjuvant therapy status, so these are treated as representative
  of the PDAC TME at diagnosis.
key_study_limitations:
- |
  Single-center Chinese cohort (n=94); ethnic and treatment practice differences may
  limit generalizability.
- |
  Double immunofluorescence on FFPE sections may have lower sensitivity for PD-1
  detection compared to flow cytometry on fresh tissue, potentially explaining the
  lower PD-1+ fraction vs Shibuya 2014.
- |
  PD-1 alone does not fully define the exhausted T cell state; co-expression of
  multiple inhibitory receptors (TIM-3, LAG-3) better delineates terminal exhaustion.
- |
  Large inter-patient variability (CV ~55%) reflects genuine biological heterogeneity
  across 94 resected PDAC tumors, spanning a wide range of immune infiltration states.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        import numpy as np
        cd8_eff = species_dict['V_T.CD8']
        cd8_exh = species_dict['V_T.CD8_exh']
        total_cd8 = cd8_eff + cd8_exh
        frac_array = np.where(total_cd8 > 0.0,
                              (cd8_exh / total_cd8),
                              0.0)
        return frac_array

  units: dimensionless
  species:
  - V_T.CD8
  - V_T.CD8_exh
  constants: []
  support: unit_interval
  mapping_rationale: |
    Shen et al. measured PD-1+ fraction of CD8+ TILs by double immunofluorescence.
    In the QSP model, exhausted CD8 T cells are V_T.CD8_exh and functional CD8 T
    cells are V_T.CD8. The observable maps to V_T.CD8_exh / (V_T.CD8 + V_T.CD8_exh).
  experimental_denominator: |
    CD8+ tumor-infiltrating T lymphocytes identified by double immunofluorescence
    on FFPE tumor sections (n=94 resected PDAC).
  model_denominator_species:
  - V_T.CD8
  - V_T.CD8_exh
  unmodeled_denominator_components: |
    None; experimental denominator is all CD8+ T cells in tumor, represented by
    V_T.CD8 + V_T.CD8_exh.
  aggregation: null
