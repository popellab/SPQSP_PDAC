scenario:
  description: |
    Baseline immune composition of primary PDAC tumors at the time of surgical resection. A subset of patients received neoadjuvant GTX chemotherapy (gemcitabine 750 mg/m^2 IV, docetaxel 30 mg/m^2 IV, capecitabine 750 mg/m^2 PO for three cycles) followed by chemoradiotherapy (300 centigray over 10 fractions with concurrent oxaliplatin 60 mg/m^2 IV and capecitabine 650 mg/m^2 PO) before resection; the remaining patients underwent upfront surgery without neoadjuvant therapy. All tumors were sampled at resection for flow cytometric analysis of tumor-infiltrating lymphocytes, including PD-1 expression on CD4+ and CD8+ T cells.
  interventions:
  - intervention_description: |
      Neoadjuvant cohort: three cycles of gemcitabine 750 mg/m^2 IV, docetaxel 30 mg/m^2 IV and capecitabine 750 mg/m^2 orally (GTX regimen), followed within 14 days by chemoradiotherapy consisting of 300 centigray per fraction over 10 fractions (intensity-modulated radiotherapy) with concurrent oxaliplatin 60 mg/m^2 IV and capecitabine 650 mg/m^2 orally, then surgical resection of primary PDAC approximately 2 to 6 weeks later.
  - intervention_description: |
      Upfront-surgery cohort: no neoadjuvant systemic therapy; primary PDAC tumor resected surgically, with blood and tumor collected at the time of resection for immune profiling.
