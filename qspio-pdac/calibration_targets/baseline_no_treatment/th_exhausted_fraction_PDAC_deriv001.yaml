  assumptions:
  - name: n_mc_samples
    value: 100000.0
    units: dimensionless
    description: |
      Number of Monte Carlo samples drawn from the beta distribution for the PD-1+ CD4+ fraction to estimate median and 95% CI.
    rationale: |
      100,000 samples provide stable estimates of median and quantiles for the beta distribution while remaining computationally inexpensive.
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np
        rng = np.random.default_rng(42)
        mean_frac = inputs['mean_frac_pd1_cd4_tumor']
        sem_frac = inputs['sem_frac_pd1_cd4_tumor']
        n_patients = inputs['n_patients_pd1_flow']
        # Convert SEM to SD using n
        sd_frac = sem_frac * np.sqrt(n_patients.magnitude)
        mean_mag = mean_frac.magnitude
        sd_mag = sd_frac.magnitude
        var_mag = sd_mag ** 2
        # Fit a beta distribution matching mean and variance on [0, 1]
        mean_var_ratio = mean_mag * (1.0 - mean_mag) / var_mag
        alpha = mean_mag * (mean_var_ratio - 1.0)
        beta_param = (1.0 - mean_mag) * (mean_var_ratio - 1.0)
        samples_np = rng.beta(alpha, beta_param, 100000)
        samples = samples_np * ureg.dimensionless
        return {
            'median_obs': np.median(samples),
            'ci95_lower': np.percentile(samples, 2.5),
            'ci95_upper': np.percentile(samples, 97.5),
        }
