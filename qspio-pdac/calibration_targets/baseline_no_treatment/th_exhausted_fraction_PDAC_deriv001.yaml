study_interpretation: |
  This calibration target quantifies the fraction of tumor-infiltrating CD4+ T cells that express the inhibitory receptor PD-1 in primary resected human PDAC. Shibuya et al. used multiparameter flow cytometry on fresh tumor digests from resected PDAC specimens to compare immune cell phenotypes in tumor versus matched peripheral blood, including PD-1 expression on CD4+ and CD8+ T cells. The high fraction of PD-1+ CD4+ T cells in tumors reflects a dysfunctional/exhausted helper T cell compartment in the PDAC tumor microenvironment. In the QSP model, this is mapped to the fraction of exhausted conventional Th cells (V_T.Th_exh) among all conventional CD4+FOXP3- Th cells (V_T.Th + V_T.Th_exh) at the time of tumor resection.
key_assumptions:
- |
  The PD-1+ fraction among bulk CD4+ tumor-infiltrating T cells (which includes FOXP3+ Tregs) is used as a proxy for the PD-1+ fraction among conventional CD4+FOXP3− helper T cells; this assumes that Tregs constitute a minority of total CD4+ T cells and that their inclusion has a modest effect on the overall PD-1+ fraction.
- |
  Mean and SEM for the intratumoral PD-1+ CD4+ fraction were manually extracted from Figure 5C by visual estimation of the group mean and error bar relative to the y-axis scale; exact numeric values are not tabulated, so the central value and SEM should be considered approximate.
- |
  The flow cytometry subset includes both treatment-naive patients and patients who received multimodal neoadjuvant GTX chemotherapy plus chemoradiotherapy before resection; we assume that the combined PD-1+ CD4+ fraction at resection is a reasonable approximation to the exhausted Th fraction in untreated resectable PDAC, but acknowledge that prior therapy may modestly alter the immune infiltrate.
- |
  A beta distribution is assumed for the PD-1+ CD4+ fraction on [0,1], parameterized to match the extracted mean and variance; this ignores any skewness or multimodality beyond that captured by the beta family.
key_study_limitations:
- |
  PD-1 expression on CD4+ T cells was quantified in a relatively small flow cytometry subset (approximately 11 patients), which may limit the precision and generalizability of the estimated PD-1+ fraction.
- |
  The cohort combines patients who underwent upfront surgery with those treated with neoadjuvant chemotherapy and chemoradiotherapy; neoadjuvant treatment has been shown to alter Treg and myeloid cell numbers and may also influence PD-1 expression levels, introducing heterogeneity relative to strictly treatment-naive tumors.
- |
  The PD-1 flow cytometry panel gated on CD4+ T cells but did not explicitly resolve PD-1 expression separately on FOXP3+ Tregs versus FOXP3− conventional Th cells; thus the experimental PD-1+ CD4+ fraction includes regulatory T cells that are represented as a separate model species (V_T.Treg).
- |
  Tumor samples were obtained from resectable primary PDAC; the immune infiltrate and PD-1 expression profile in unresectable, metastatic, or recurrent PDAC may differ from this surgical cohort.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        import numpy as np
        th = species_dict['V_T.Th']
        th_exh = species_dict['V_T.Th_exh']
        total_th = th + th_exh
        # Avoid division by zero at time points with no conventional Th cells
        frac_vals = np.where(total_th > 0.0,
                             (th_exh / total_th),
                             0.0)
        return frac_vals

  units: dimensionless
  species:
  - V_T.Th
  - V_T.Th_exh
  constants: []
  support: unit_interval
  mapping_rationale: |
    Shibuya et al. measured the fraction of CD4+ T cells expressing PD-1 in single-cell suspensions of resected primary PDAC tumors using multiparameter flow cytometry. In the QSP model, exhausted/dysfunctional conventional CD4+ helper T cells are represented by V_T.Th_exh, and all conventional CD4+FOXP3- helper T cells are V_T.Th + V_T.Th_exh. The observable therefore computes the fraction of exhausted Th cells among all conventional Th cells, which is used as a proxy for the experimentally measured PD-1+ fraction among bulk CD4+ T cells (which includes both FOXP3- Th and FOXP3+ Tregs).
  experimental_denominator: |
    CD4+ T cells in the tumor (including both FOXP3- conventional Th and FOXP3+ Tregs; all PD-1- and PD-1+ subsets).
  model_denominator_species:
  - V_T.Th
  - V_T.Th_exh
  unmodeled_denominator_components: |
    The experimental PD-1 measurement gated on total CD4+ T cells and did not explicitly exclude FOXP3+ regulatory T cells; thus the experimental denominator includes PD-1+ Tregs, whereas the model denominator includes only conventional CD4+FOXP3- helper T cells (V_T.Th + V_T.Th_exh), excluding Tregs. This may cause a slight mismatch: the experimental PD-1+ fraction is computed over all CD4+ T cells, while the model fraction is computed only over conventional Th cells.
  aggregation: null
