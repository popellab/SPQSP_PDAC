  support: positive
  mapping_rationale: |
    Clinical tumor volume is the total tissue volume of the resected mass, including cancer cells, stroma (CAFs, ECM), and immune infiltrate. The observable reconstructs this total tissue volume from all modeled species using the same cell-volume and ECM-density constants as the stromal_fraction target. This ensures the two targets are internally consistent: if the model predicts the right stromal fraction AND the right total volume, it necessarily has the right cancer cell count. Unmodeled components (endothelial cells, nerves, vascular lumen) are excluded, making the computed volume a slight underestimate.
