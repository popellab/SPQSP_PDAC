study_interpretation: |
  Tran et al. measured tumor size (largest macroscopic diameter) on resection specimens from 315 consecutive treatment-naive patients with surgically resected PDAC at Oslo University Hospital (2015–2020). Neoadjuvantly treated tumors were excluded. Using the standard 2D-macro pathology approach, the cohort had a mean diameter of 30 ± 10 mm (median 30 mm, IQR 23–35 mm, range 9–110 mm). T-stage distribution was T1 12%, T2 73%, T3 15% (AJCC 8th edition). We model the diameter distribution as lognormal (matching reported mean and SD) and convert to tumor volume assuming spherical geometry, yielding a median volume of ~12 cm³ (95% CI ~1.8–82 cm³). The observable computes total tumor tissue volume from all modeled species (cancer cells, CAFs, immune cells, ECM) using the same cell volumes and ECM density as the stromal_fraction target, ensuring internal consistency between the two targets.
key_assumptions:
- |
  Tumor diameter reported as the largest macroscopic dimension on the resection specimen (2D-macro approach) is used as the primary measurement. The study also reports a more comprehensive 3D-micro approach (median 36 mm) but we use 2D-macro as it reflects standard clinical pathology practice.
- |
  Tumors are approximated as spheres for converting diameter to volume (V = pi/6 · D^3). While PDACs are infiltrative and irregular, spherical approximation is adequate for order-of-magnitude volume estimation for calibration.
- |
  The distribution of tumor diameters across patients is modeled as lognormal, consistent with strictly positive, right-skewed size data. Lognormal parameters are derived from the reported mean and SD.
- |
  The reported ±10 mm is a standard deviation based on the study's reporting conventions for continuous variables (mean ± SD).
key_study_limitations:
- |
  Single-center study from Oslo University Hospital. While the cohort is large (n=315) and consecutive, generalizability to other populations or institutions may vary.
- |
  The 2D-macro approach may underestimate true tumor extent compared to the 3D-micro approach (which yielded median 36 mm vs 30 mm). T-stage was reclassified upward in 45% of cases when using the comprehensive approach. The calibration target reflects standard pathology reporting, not the maximum possible tumor size.
- |
  Tumor shape is assumed spherical for volume conversion, whereas PDAC tumors are often irregular and infiltrative within a desmoplastic stroma, introducing systematic uncertainty in absolute volume estimates.
- |
  The total tumor tissue volume is computed from the same cell-volume and ECM-density constants as the stromal_fraction target. The same geometric assumptions (spherical cells, 150 mg/mL ECM density) apply. Unmodeled stromal components (endothelial cells, pericytes, nerves, vascular lumen) are excluded, so the computed volume is a lower bound on true tissue volume.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        """Compute total tumor tissue volume from all modeled species.

        Total volume = cancer cell volume + CAF volume + immune cell volume + ECM volume

        Uses the same cell volumes and ECM density as the stromal_fraction target,
        ensuring internal consistency between tumor volume and stromal fraction.
        """
        import numpy as np

        # Cancer cells
        C1 = species_dict['V_T.C1']

        # CAF subtypes
        iCAF = species_dict['V_T.iCAF']
        myCAF = species_dict['V_T.myCAF']
        apCAF = species_dict['V_T.apCAF']

        # Lymphocyte-sized immune cells
        CD8 = species_dict['V_T.CD8']
        Th = species_dict['V_T.Th']
        Treg = species_dict['V_T.Treg']
        MDSC = species_dict['V_T.MDSC']
        cDC1 = species_dict['V_T.cDC1']
        cDC2 = species_dict['V_T.cDC2']

        # Macrophages (larger)
        Mac_M1 = species_dict['V_T.Mac_M1']
        Mac_M2 = species_dict['V_T.Mac_M2']

        # ECM mass
        ECM = species_dict['V_T.ECM']

        # Cell volumes in mL (from constants)
        vol_cancer = constants['vol_cancer_cell']
        vol_caf = constants['vol_CAF']
        vol_lymph = constants['vol_lymphocyte']
        vol_mac = constants['vol_macrophage']
        ecm_density = constants['ecm_tissue_density']

        # Volume contributions (mL = cm³)
        cancer_vol = C1 * vol_cancer
        caf_vol = (iCAF + myCAF + apCAF) * vol_caf
        lymph_vol = (CD8 + Th + Treg + MDSC + cDC1 + cDC2) * vol_lymph
        mac_vol = (Mac_M1 + Mac_M2) * vol_mac
        ecm_vol = ECM / ecm_density

        total_vol = cancer_vol + caf_vol + lymph_vol + mac_vol + ecm_vol
        return total_vol

  units: centimeter**3
  species:
  - V_T.C1
  - V_T.iCAF
  - V_T.myCAF
  - V_T.apCAF
  - V_T.CD8
  - V_T.Th
  - V_T.Treg
  - V_T.MDSC
  - V_T.cDC1
  - V_T.cDC2
  - V_T.Mac_M1
  - V_T.Mac_M2
  - V_T.ECM
