    value: 100000.0
    units: dimensionless
    description: |
      Number of Monte Carlo samples used to approximate the distribution of tumor volume from the reported mean and SD of diameter.
    rationale: |
      100,000 samples provide stable estimates of the median and 95% confidence interval (<1% Monte Carlo error) while keeping computation inexpensive.
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np
        import math

        # Extract inputs as Pint quantities
        mean_d = inputs['mean_tumor_diameter'].to('millimeter')
        sd_d = inputs['sd_tumor_diameter'].to('millimeter')
        n_samples = int(inputs['n_mc_samples'].magnitude)

        # Work in magnitudes (dimensionless) to compute lognormal parameters
        mean_mag = mean_d.magnitude
        sd_mag = sd_d.magnitude

        # Lognormal parameterization that matches mean and SD of diameter
        mu_log = np.log(mean_mag ** 2 / np.sqrt(mean_mag ** 2 + sd_mag ** 2))
        sigma_log = np.sqrt(np.log(1.0 + (sd_mag ** 2) / (mean_mag ** 2)))

        rng = np.random.default_rng(42)

        # Sample diameters in mm and immediately reattach units
        diameters = rng.lognormal(mu_log, sigma_log, n_samples) * ureg('millimeter')

        # Convert diameter -> volume assuming spherical tumors:
        # V = (pi / 6) * D^3
        volumes_mm3 = (math.pi / 6.0) * (diameters ** 3)

        # Convert mm^3 -> cm^3; 1 cm^3 = 1000 mm^3, handled by Pint conversion
        volumes_cm3 = volumes_mm3.to('centimeter**3')

        median_obs = np.median(volumes_cm3)
        ci95_lower = np.percentile(volumes_cm3, 2.5)
        ci95_upper = np.percentile(volumes_cm3, 97.5)

        return {
            'median_obs': median_obs,
            'ci95_lower': ci95_lower,
            'ci95_upper': ci95_upper,
        }
