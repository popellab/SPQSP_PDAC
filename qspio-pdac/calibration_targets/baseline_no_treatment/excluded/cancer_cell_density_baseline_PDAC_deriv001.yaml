study_interpretation: |
  Sivagnanam et al. Table S5 reports PanCK+ cell density of 995 (660-1526) cells/mm^2 in the Tumor region of 113 treatment-naive PDAC specimens. PanCK marks epithelial cells, which in the tumor region are predominantly cancer cells.
key_assumptions:
- PanCK+ cells in the tumor region correspond to cancer cells (V_T.C1).
- Patient-level PanCK+ density follows a lognormal distribution.
- |
  Tumor tissue area for the density denominator is derived from the total tissue
  volume of all modeled species using dynamic cellularity (cancer_vol / total_vol),
  rather than a fixed cellularity constant. This makes the observable sensitive to
  the cancer-to-stroma ratio rather than being a trivial constant.
key_study_limitations:
- |
  PanCK may also stain non-malignant ductal epithelial cells entrapped in the tumor.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        """Compute cancer cell density (cells/mm^2) using the model's own V_T.

        Uses V_T directly as the total tumor volume rather than reconstructing
        it from individual species. This ensures the observable and model agree
        on tumor volume. Cancer cell density = cellularity / area_per_cell,
        where cellularity = cancer_vol / V_T.
        """
        C1 = species_dict['V_T.C1']
        V_T = species_dict['V_T']

        vol_cancer = constants['vol_cancer_cell']
        area_per_cell = constants['pdac_cancer_cell_cross_section']

        cancer_vol = C1 * vol_cancer
        cellularity = (cancer_vol / V_T)

        density = cellularity / area_per_cell
        return density

  units: cell / millimeter**2
  species:
  - V_T.C1
  - V_T
  constants:
  - name: pdac_cancer_cell_cross_section
    value: 0.000227
    units: millimeter**2 / cell
    biological_basis: |
      Cross-sectional area of a typical PDAC cancer cell (~17 um diameter, area ~2.27e-4 mm^2).
    source_type: reference_db
    reference_db_name: pdac_cancer_cell_cross_section
    reference_db_names: null
    source_tag: null
  - name: vol_cancer_cell
    value: 2.572e-09
    units: milliliter / cell
    biological_basis: |
      Spherical volume from pdac_cancer_cell_diameter = 17 um: V = pi/6 * (17e-4 cm)^3 = 2.572e-9 mL.
    source_type: derived_from_reference_db
    reference_db_name: null
    reference_db_names:
    - pdac_cancer_cell_diameter
    source_tag: null
  support: positive
  mapping_rationale: |
    PanCK+ density maps to C1 / tumor_area. Uses the model's V_T directly as
    total tumor volume, ensuring perfect consistency between model dynamics and
    observable calculation. Cellularity = C1 * vol_cancer / V_T. Cancer cell
    density = cellularity / area_per_cell. Desmoplastic PDACs have lower cancer
    cell density because V_T includes substantial stromal volume (CAFs, ECM
    scaffold + interstitium), diluting the cancer cell fraction.
  experimental_denominator: mm^2 of tumor tissue section
  model_denominator_species:
  - V_T
  - V_T.iCAF
  - V_T.myCAF
  - V_T.apCAF
  - V_T.CD8
  - V_T.Th
  - V_T.Treg
  - V_T.MDSC
  - V_T.cDC1
  - V_T.cDC2
  - V_T.Mac_M1
  - V_T.Mac_M2
  - V_T.ECM
  unmodeled_denominator_components: |
    Endothelial cells, pericytes, neural elements, and vascular lumen volume are
    not modeled. Their exclusion means total_vol is a lower bound, so dynamic
    cellularity is an upper bound, and cancer cell density may be slightly
    overestimated.
  aggregation: null
