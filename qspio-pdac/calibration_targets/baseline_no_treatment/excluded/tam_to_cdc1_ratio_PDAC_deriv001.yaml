  assumptions:
  - name: sigma_log_ratio
    value: 0.5
    units: dimensionless
    description: |
      Log-scale standard deviation for the TAM/DC ratio, defining a lognormal distribution with median equal to the ratio implied by the macrophage and dendritic fractions (20% / 5% = 4). sigma_log = 0.5 corresponds to a coefficient of variation of approximately 50%, representing substantial biological heterogeneity in TAM/DC balance across immunotype A tumors.
    rationale: |
      Breaza et al. do not provide dispersion estimates for the reported immune-cell fractions. For tumor-infiltrating myeloid and dendritic cells, cohort-level CVs of 50–100% are typical in solid tumors. We therefore adopt sigma_log = 0.5 as a moderate, biologically plausible level of variability for the TAM/DC ratio.
  - name: n_mc_samples
    value: 100000.0
    units: dimensionless
    description: Number of Monte Carlo samples used to derive median and 95% CI.
    rationale: |
      100,000 samples provide stable estimates of the median and 2.5/97.5 percentiles for the lognormal ratio distribution while keeping computational cost reasonable.
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np

        rng = np.random.default_rng(42)

        # Fractions of immune infiltrate (as dimensionless fractions)
        mac_frac = inputs['mac_fraction_immunotype_A'].to('dimensionless')
        dc_frac = inputs['dc_fraction_immunotype_A'].to('dimensionless')

        # Median TAM/DC ratio implied by composition: 20% / 5% = 4
        ratio_median = (mac_frac / dc_frac).to('dimensionless')

        sigma_log = inputs['sigma_log_ratio']          # dimensionless
        n_mc = int(inputs['n_mc_samples'].magnitude)   # integer

        # For a lognormal distribution, median = exp(mu_log).
        mu_log = np.log(ratio_median.magnitude)

        # Sample lognormal in unitless space, then reattach units
        samples = rng.lognormal(mu_log, sigma_log.magnitude, n_mc) * ratio_median.units

        median_obs = np.median(samples)
        ci_lower = np.percentile(samples, 2.5)
        ci_upper = np.percentile(samples, 97.5)

        return {
            'median_obs': median_obs,
            'ci95_lower': ci_lower,
            'ci95_upper': ci_upper,
        }
