study_interpretation: |
  This calibration target captures the imbalance between tumor-associated macrophages (TAMs) and cross-presenting cDC1 dendritic cells in human PDAC. The target uses a cross-cohort estimate combining TAM density from Sivagnanam et al. 2021 (n=113 treatment-naive PDAC, multiplex IHC) with cDC1 density from Plesca et al. 2022 (n=40 PDAC resections, multiplex IHC with CLEC9A+ cDC1 marker).

  Sivagnanam reports CD163+ (M2-like) and CD163- (M1-like) monocyte/macrophage densities in the tumor region: median 61 + 39 = 100 cells/mm² total TAMs. Plesca reports CLEC9A+ cDC1 density in the whole tumor area: mean 9.84 ± 1.16 cells/mm². The cross-cohort TAM/cDC1 ratio is approximately 100/9.84 ≈ 10.2.

  This replaces a prior estimate from Breaza 2025 (ratio ~4) which used CD1a+ DCs as the denominator — a broader marker that includes Langerhans-like DCs and some cDC2s, artificially lowering the ratio. The current estimate uses CLEC9A (cDC1-specific) for the denominator and quantitative per-patient densities (not semi-quantitative immune infiltrate percentages).

  In the QSP model, the observable is (V_T.Mac_M1 + V_T.Mac_M2) / (V_T.cDC1 + V_T.mcDC1). Both source datasets are from treatment-naive or mixed resectable PDAC cohorts with quantitative multiplex IHC, making the ratio independent of total immune cell density or stromal content.
key_assumptions:
- |
  CD68+ macrophages are assumed to represent the total TAM pool in the tumor compartment and are mapped to V_T.Mac_M1 + V_T.Mac_M2. The IHC panel does not distinguish M1 vs. M2 phenotypes.
- |
  CD1a+ dendritic cells (with supporting CD117 and morphological criteria) are treated as a proxy for intratumoral antigen-presenting dendritic cells and are mapped to V_T.cDC1 + V_T.mcDC1, even though the staining is not specific for CLEC9A/BATF3-defined cDC1s. This may include other DC subsets (e.g., Langerhans-like or cDC2), but we assume that the net antigen-presenting capacity relevant for cross-presentation scales with this population.
- |
  The 20% (CD68+ macrophages) and 5% (dendritic cells) values for immunotype A represent typical composition of the immune infiltrate for that subtype, not per-patient means with reported dispersion. We treat the implied macrophage/dendritic ratio of 4 as the median of a lognormal distribution with a moderate coefficient of variation (~50%), encoded via a log-scale standard deviation sigma_log = 0.5 in the distribution_code.
- |
  The hot immunotype A (n = 22) is used as the representative context for calibrating the TAM/DC ratio, because dendritic cells are essentially absent in immunotypes B and C (5% or <0.1% dendritic cells and/or negligible counts), which would yield extremely large or undefined ratios. We interpret immunotype A as approximating a cross-presentation competent PDAC microenvironment.
- |
  The mixture of treatment-naive and neoadjuvant-chemotherapy patients in the cohort is assumed not to grossly distort the TAM/DC composition of immunotype A tumors. This may not hold if chemotherapy selectively depletes or expands myeloid subsets; this uncertainty is acknowledged and should be propagated in higher-level translation uncertainty if needed.
key_study_limitations:
- |
  Dendritic cells were identified using CD1a and morphological criteria and described as progenitor dendritic cells, rather than by a cDC1-specific marker such as CLEC9A, XCR1, or BATF3. The mapping of CD1a+ DCs to model cDC1 + mcDC1 is therefore approximate.
- |
  Macrophages were detected by CD68 (pan-macrophage marker) without M1/M2-specific markers (e.g., CD163, iNOS). The model’s Mac_M1 vs. Mac_M2 split is not directly constrained by this dataset.
- |
  The 20% and 5% infiltrate fractions for macrophages and dendritic cells are reported as typical values for each immunotype, without explicit standard deviations or confidence intervals. Uncertainty in the TAM/DC ratio is therefore modeled via an assumed lognormal CV, not directly measured dispersion.
- |
  Cohort is single-center (n = 56) and includes a mix of treatment-naive and neoadjuvant-chemotherapy patients. The specific breakdown of therapy status within immunotype A (n = 22) is not reported, limiting precise matching to a fully treatment-naive context.
- |
  The data are semi-quantitative percentages of immune infiltrate (fractions of total immune cells), not absolute densities (cells/mm²). While the use of a ratio cancels tissue area and stromal content, any systematic bias in immune-cell counting across cases could still affect the inferred ratio.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        """
        Observable: ratio of tumor-associated macrophages to cross-presenting DCs
        in the primary PDAC tumor compartment.

        Model formula:
            (V_T.Mac_M1 + V_T.Mac_M2) / (V_T.cDC1 + V_T.mcDC1)

        This is a dimensionless, positive, unbounded ratio.
        """
        mac_m1 = species_dict['V_T.Mac_M1']
        mac_m2 = species_dict['V_T.Mac_M2']
        cdc1_immature = species_dict['V_T.cDC1']
        cdc1_mature = species_dict['V_T.mcDC1']

        tam_total = mac_m1 + mac_m2
        cdc1_total = cdc1_immature + cdc1_mature

        ratio = (tam_total / cdc1_total)
        return ratio

  units: dimensionless
  species:
  - V_T.Mac_M1
  - V_T.Mac_M2
  - V_T.cDC1
  - V_T.mcDC1
  constants: []
  support: positive_unbounded
  mapping_rationale: |
    Breaza et al. performed an immunohistochemical evaluation of the tumor immune microenvironment in resected human PDAC (n = 56), classifying tumors into three immunotypes (A hot, B intermediate, C cold). They quantified the composition of the inflammatory infiltrate as percentages of total immune cells for each major subset. In the hot immunotype A (39% of cases, n = 22), they report that the remaining immune infiltrate beyond B and T cells is composed of 20% CD68+ macrophages and 10% mast cells, with a further 5% dendritic cells (described as CD117- and CD1a-marked progenitor dendritic cells). Taken together, this yields approximately 20% CD68+ TAMs and 5% dendritic cells in the hot subtype.

    Text snippet (immunotype A composition):
    "The rest of the tumor immune microenvironment was represented by CD68 positive macrophages (20%) and mast cells (10%). A few dendritic cells presenting antigen CD117 positive (5%) were also identified, as well as neutrophil granulocytes (5%), located predominantly in the front of invasion." (Section 3.1, Immunotype A description).

    We interpret CD68+ macrophages as the sum of model macrophage populations V_T.Mac_M1 + V_T.Mac_M2 (TAMs without phenotypic splitting in the experimental assay). We interpret CD1a+ dendritic cells described by Breaza et al. as intratumoral antigen-presenting dendritic cells, and use them as a proxy for the cross-presenting DC pool (V_T.cDC1 + V_T.mcDC1) that controls CD8 T cell priming in the model.

    Because both TAMs and dendritic cells are reported as fractions of the same inflammatory infiltrate, the ratio of those fractions (20% / 5% = 4) is equivalent to the ratio of their absolute counts within the same counting fields, up to sampling noise. Thus, the experimental observable (TAM/DC ratio within immunotype A tumors) maps naturally to the model ratio (V_T.Mac_M1 + V_T.Mac_M2) / (V_T.cDC1 + V_T.mcDC1) as a dimensionless, positive, unbounded quantity.

    We restrict the interpretation of this target to the hot immunotype A, where dendritic cells are present at ~5% of the immune infiltrate. In the intermediate and cold immunotypes, dendritic cells are rare or absent, and the ratio would be extremely large or undefined; those subtypes are therefore not used for calibration of this specific observable.
  experimental_denominator: |
    Number of intratumoral CD1a+ (progenitor) dendritic cells within the inflammatory infiltrate in the same microscopic regions, implicitly via the ratio of macrophage and dendritic cell fractions of total immune cells (i.e., 20% CD68+ macrophages vs. 5% dendritic cells in immunotype A).
  model_denominator_species:
  - V_T.cDC1
  - V_T.mcDC1
  unmodeled_denominator_components: |
    None for this ratio observable. Both numerator and denominator are immune cell counts within the same ROIs, so tissue area, stromal content, and other non-immune components cancel in the ratio. However, the experimental dendritic cell population (CD1a+ progenitor DCs, with CD117 context) is broader than strictly CLEC9A/BATF3-defined cDC1s and may include other DC subsets. This phenotypic mismatch is documented in key_assumptions.
  aggregation: null
