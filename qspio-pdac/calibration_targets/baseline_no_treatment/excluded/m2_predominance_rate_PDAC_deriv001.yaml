empirical_data:
  median:
  - 0.7767
  ci95:
  - - 0.7176
    - 0.8289
  units: dimensionless
  sample_size: 212
  sample_size_rationale: |
    n=212 resected pancreatic ductal carcinomas from Ino et al. 2013, with
    macrophage polarization assessed by IHC.
  index_values: null
  index_unit: null
  index_type: null
  inputs:
  - name: n_m2_predominant
    value: 165.0
    units: dimensionless
    description: |
      Number of tumors classified as M2-predominant (M2 > M1). Inferred from
      78% of 212 cases = 165.4, rounded to 165.
    source_ref: Ino2013_MacrophagePDAC
    value_location: Results section.
    value_snippet: |
      In 78% of the cases, M2 were predominant among tumour-infiltrating
      macrophages.
    input_type: inferred_estimate
    conversion_formula: round(0.78 * 212) = 165
    source_type: text
    figure_id: null
    extraction_method: manual
    extraction_notes: |
      Exact count not stated; derived from reported percentage (78%) and
      sample size (212).
    dispersion_type: null
    dispersion_type_rationale: null
  - name: n_total
    value: 212.0
    units: dimensionless
    description: |
      Total number of resected PDAC tumors evaluated for macrophage polarization.
    source_ref: Ino2013_MacrophagePDAC
    value_location: Methods section.
    value_snippet: |
      tumour-infiltrating immune/inflammatory cells in 212 cases
    input_type: direct_parameter
    conversion_formula: null
    source_type: text
    figure_id: null
    extraction_method: manual
    extraction_notes: null
    dispersion_type: null
    dispersion_type_rationale: null
  assumptions: []
  distribution_code: |
    def derive_distribution(inputs, ureg):
        from scipy import stats
        n_pos = int(inputs['n_m2_predominant'].magnitude)
        n_tot = int(inputs['n_total'].magnitude)
        # Beta posterior with uniform prior
        a = n_pos + 1
        b = (n_tot - n_pos) + 1
        median_obs = stats.beta.median(a, b)
        ci95_lower = stats.beta.ppf(0.025, a, b)
        ci95_upper = stats.beta.ppf(0.975, a, b)
        return {
            'median_obs': median_obs * ureg.dimensionless,
            'ci95_lower': ci95_lower * ureg.dimensionless,
            'ci95_upper': ci95_upper * ureg.dimensionless,
        }
