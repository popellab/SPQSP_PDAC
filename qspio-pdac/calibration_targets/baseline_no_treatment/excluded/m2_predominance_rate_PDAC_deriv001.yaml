study_interpretation: |
  Ino et al. (2013) performed IHC on 212 resected pancreatic ductal carcinomas
  using CD68 (pan-macrophage), HLA-DR+CD68+ (M1), CD163 and CD204 (M2) markers.
  M2 macrophages were predominant among tumor-infiltrating macrophages in 78% of
  cases. Higher M2 infiltration was significantly associated with shorter survival.
  This provides a population-level constraint on the M2:M1 balance complementary
  to the continuous M1/M2 ratio target from Dias Costa 2022 (deriv001).
key_assumptions:
- |
  "M2 predominant" is interpreted as M2 count > M1 count per tumor, corresponding
  to a model threshold of Mac_M2 / (Mac_M1 + Mac_M2) > 0.5.
- |
  The 78% figure implies approximately 165 of 212 patients had M2 > M1. The exact
  count is not specified; we use round(0.78 * 212) = 165.
- |
  IHC markers HLA-DR+CD68+ (M1) and CD163/CD204+ (M2) map to model species
  V_T.Mac_M1 and V_T.Mac_M2 respectively.
- |
  The response rate is modeled as a Beta posterior with uniform prior:
  Beta(166, 48), yielding median 0.777, CI95 [0.718, 0.829].
key_study_limitations:
- |
  Single-center Japanese cohort (n=212); generalizability to other populations
  may be limited.
- |
  The paper reports only the proportion of M2-predominant cases, not the
  distribution of M2/M1 ratios. This limits constraining power to a binary
  classification.
- |
  Macrophage polarization assessed by limited IHC markers may not capture the
  full continuum of TAM phenotypes.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        M1 = species_dict['V_T.Mac_M1']
        M2 = species_dict['V_T.Mac_M2']
        total = M1 + M2
        frac_m2 = (M2 / total)
        return frac_m2

  units: dimensionless
  species:
  - V_T.Mac_M1
  - V_T.Mac_M2
  constants:
  - name: m2_predominance_threshold
    value: 0.5
    units: dimensionless
    biological_basis: |
      M2 predominance defined as M2 fraction of total macrophages > 50%, i.e.,
      more M2 than M1 macrophages in the tumor.
    source_type: literature
    reference_db_name: null
    reference_db_names: null
    source_tag: Ino2013_MacrophagePDAC
  support: unit_interval
  mapping_rationale: |
    Ino et al. classified tumors as M2-predominant when M2 macrophages outnumbered
    M1. The observable computes M2 fraction of total macrophages, and the
    aggregation classifies virtual patients as M2-predominant when this fraction
    exceeds 0.5. The population-level response rate (fraction of M2-predominant
    virtual patients) is compared to the observed 78%.
  experimental_denominator: Total tumor-infiltrating macrophages (CD68+)
  model_denominator_species:
  - V_T.Mac_M1
  - V_T.Mac_M2
  unmodeled_denominator_components: null
  aggregation:
    type: response_rate
    threshold_code: |
      def classify_patient(time, species_dict, constants, ureg):
          """Classify a virtual patient as M2-predominant.

          Returns True if M2 macrophages outnumber M1 at the end of simulation
          (representing resection), matching the IHC-based classification.
          """
          M1 = species_dict['V_T.Mac_M1']
          M2 = species_dict['V_T.Mac_M2']

          if hasattr(M1, '__len__'):
              M1_val = M1[-1]
              M2_val = M2[-1]
          else:
              M1_val = M1
              M2_val = M2

          total = M1_val + M2_val
          frac_m2 = (M2_val / total).to('dimensionless')
          threshold = constants['m2_predominance_threshold']
          return bool(frac_m2 >= threshold)
    time_point: null
    time_unit: null
    rationale: |
      The clinical observable is the proportion of PDAC tumors with M2-predominant
      macrophage infiltration (78% of 212 cases). This is a population summary
      requiring response-rate aggregation across virtual patients.
