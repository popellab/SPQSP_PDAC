  assumptions: []
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np
        import math

        # Extract Pint Quantities from inputs
        mean_cdc1 = inputs['mean_cdc1_wta']
        sem_cdc1 = inputs['sem_cdc1_wta']
        mean_cdc2 = inputs['mean_cdc2_wta']
        sem_cdc2 = inputs['sem_cdc2_wta']
        n_pat = int(inputs['n_patients_cdc_mihc'].magnitude)

        # Convert SEM to SD using SD = SEM * sqrt(n)
        sd_cdc1 = sem_cdc1 * math.sqrt(n_pat)
        sd_cdc2 = sem_cdc2 * math.sqrt(n_pat)

        # Helper to compute lognormal parameters (mu, sigma) from mean and SD of the
        # underlying positive-valued variable.
        def lognormal_params(mean_q, sd_q):
            mean = mean_q.magnitude
            sd = sd_q.magnitude
            mu = math.log(mean ** 2 / math.sqrt(sd ** 2 + mean ** 2))
            sigma = math.sqrt(math.log(1.0 + (sd ** 2) / (mean ** 2)))
            return mu, sigma

        mu1, sigma1 = lognormal_params(mean_cdc1, sd_cdc1)
        mu2, sigma2 = lognormal_params(mean_cdc2, sd_cdc2)

        rng = np.random.default_rng(42)
        n_mc_samples = 100000

        # Sampling strips units; sample in floats and then reattach units
        cdc1_samples = rng.lognormal(mu1, sigma1, n_mc_samples) * mean_cdc1.units
        cdc2_samples = rng.lognormal(mu2, sigma2, n_mc_samples) * mean_cdc2.units

        # Fraction of cDC1 among conventional DCs (cDC1 + cDC2), dimensionless
        total_cdc = cdc1_samples + cdc2_samples
        frac_cdc1 = cdc1_samples / total_cdc

        median_obs = np.median(frac_cdc1)
        ci95_lower = np.percentile(frac_cdc1, 2.5)
        ci95_upper = np.percentile(frac_cdc1, 97.5)

        return {
            'median_obs': median_obs.to('dimensionless'),
            'ci95_lower': ci95_lower.to('dimensionless'),
            'ci95_upper': ci95_upper.to('dimensionless'),
        }
