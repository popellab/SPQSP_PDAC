study_interpretation: |
  This study quantifies the densities and spatial distribution of cDC1, cDC2, and pDC subsets in primary human PDAC resections using multiplex immunohistochemistry. For calibration, we use the reported mean densities of cDC1 and cDC2 in the whole tumor area (WTA) to derive the fraction of cDC1 among all conventional DCs, cDC1 / (cDC1 + cDC2). This fraction reflects the balance between cross-presenting cDC1s and CD4-priming cDC2s in the PDAC tumor immune microenvironment at the time of surgical resection. Because both subsets are measured on the same FFPE sections and reported in the same units (cells/mm^2), the ratio maps directly to the model species V_T.cDC1 and V_T.cDC2 as a dimensionless fraction.
key_assumptions:
- |
  The ± values reported for cDC1 and cDC2 densities represent standard errors of the mean (SEM), not standard deviations, based on the explicit statement in the Methods that all results are presented as mean value ± standard error of the mean.
- |
  The distribution of cDC1 and cDC2 densities across patients is approximated as lognormal, which is appropriate for strictly positive, right-skewed cell density data and avoids non-physical negative values implied by a normal distribution with the same mean and SD.
- |
  The fraction of cDC1 among conventional DCs is computed from independent lognormal samples for cDC1 and cDC2 using cohort-level means and SEMs; the lack of patient-level covariance data is absorbed into the resulting wide uncertainty (95% CI) of the ratio.
- |
  Whole tumor area (WTA) densities, which average over intraepithelial tumor and tumor stroma, are taken as representative of the bulk primary tumor compartment in the QSP model.
- |
  The mixture of patients with and without neoadjuvant chemotherapy is treated as representative of a generalized resectable PDAC population; this is supported by the authors' finding that neoadjuvant chemotherapy did not significantly change DC densities in the WTA, but it still introduces some heterogeneity relative to a purely treatment-naive cohort.
key_study_limitations:
- |
  Single-center retrospective cohort with 58 PDAC patients and 40 tumors analyzed by multiplex IHC for cDC1/cDC2, which may limit generalizability.
- |
  The calibration target is based on cohort-level means and SEMs rather than patient-level distributions, so within-patient correlations between cDC1 and cDC2 are not captured explicitly.
- |
  Approximately 36% of patients received neoadjuvant chemotherapy prior to resection; although the authors report no significant effect of neoadjuvant therapy on DC densities, this remains a source of heterogeneity relative to a strictly treatment-naive population.
- |
  Dendritic cell subsets are defined by specific marker panels (CLEC9A for cDC1; CD1c+CLEC10A for cDC2), which may not perfectly align with the functional definitions of cDC1 and cDC2 used in the QSP model but are the current clinical standard for human DC phenotyping.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        # Fraction of cDC1-lineage cells among total conventional DCs
        # in the primary tumor compartment.
        # Includes both immature and mature DCs of each subtype because
        # CLEC9A (cDC1) and CD1c/CLEC10A (cDC2) are lineage markers that
        # label both maturation states.
        cdc1 = species_dict['V_T.cDC1']    # immature cDC1
        mcdc1 = species_dict['V_T.mcDC1']  # mature cDC1
        cdc2 = species_dict['V_T.cDC2']    # immature cDC2
        mcdc2 = species_dict['V_T.mcDC2']  # mature cDC2
        total_cdc1 = cdc1 + mcdc1
        total_cdc2 = cdc2 + mcdc2
        frac = (total_cdc1 / (total_cdc1 + total_cdc2))
        return frac

  units: dimensionless
  species:
  - V_T.cDC1
  - V_T.mcDC1
  - V_T.cDC2
  - V_T.mcDC2
  constants: []
  support: unit_interval
  mapping_rationale: |
    The paper reports absolute area densities (cells/mm^2) of tumor-infiltrating cDC1s and cDC2s in the whole tumor area (WTA) of primary PDAC resections. CLEC9A (cDC1 marker) and CD1c/CLEC10A (cDC2 markers) are lineage markers that label both immature and mature cells of each subtype, so the observable must include both maturation states: (V_T.cDC1 + V_T.mcDC1) / (V_T.cDC1 + V_T.mcDC1 + V_T.cDC2 + V_T.mcDC2). The ratio is independent of tumor area and matches the experimental quantity after canceling the common area factor.
  aggregation: null
