    Retrospective cohort of 58 patients with resected, non-metastatic PDAC (UICC stage I–II). Tumor tissues were obtained at pancreatectomy after either primary resection or neoadjuvant chemotherapy followed by surgery. Multiplex immunohistochemistry was performed on 40 tumors to quantify cDC1 and cDC2 densities in the whole tumor area (WTA), defined as intraepithelial tumor plus tumor stroma. The calibration target uses the baseline (pre-immunotherapy) cDC1 fraction among conventional DCs at the time of surgical resection.
