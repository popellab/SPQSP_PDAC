  assumptions:
  - name: alpha_sma_core_cv_prior
    value: 0.2
    units: dimensionless
    description: |
      Prior coefficient of variation for stromal α-SMA-positive area fraction in tumor core when only a mean value is reported.
    rationale: |
      Drifka et al. 2016 provide point estimates (e.g., 0.572 in tumor core) but no dispersion. We assume a moderate CV≈0.2, consistent with variability seen for other stromal marker quantifications in PDAC, to avoid an unrealistically narrow calibration target.
  - name: n_mc_samples_internal
    value: 100000.0
    units: dimensionless
    description: |
      Monte Carlo sample size for parametric bootstrap used to derive empirical median and 95% CI.
    rationale: |
      100000 samples provide stable percentile estimates (<1% Monte Carlo error on median) while keeping computation inexpensive.
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np
        mean_q = inputs['alpha_sma_core_mean']
        cv_q = inputs['alpha_sma_core_cv']
        n_mc_q = inputs['n_mc_samples']
        # Convert to dimensionless scalars
        m = mean_q.to('dimensionless').magnitude
        cv = cv_q.to('dimensionless').magnitude
        n_mc = int(n_mc_q.to('dimensionless').magnitude)
        # Compute Beta distribution parameters from mean and coefficient of variation
        var = (cv * m)**2
        phi = m * (1.0 - m) / var - 1.0
        a = m * phi
        b = (1.0 - m) * phi
        rng = np.random.default_rng(42)
        samples = rng.beta(a, b, n_mc) * ureg.dimensionless
        median_obs = np.median(samples)
        ci95_lower = np.percentile(samples, 2.5)
        ci95_upper = np.percentile(samples, 97.5)
        return {
            'median_obs': median_obs,
            'ci95_lower': ci95_lower,
            'ci95_upper': ci95_upper,
        }
