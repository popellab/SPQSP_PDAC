study_interpretation: |
  Drifka et al. analyzed 114 human PDAC resection specimens (no neoadjuvant therapy) using a tissue microarray. For each patient, multiple pathology-confirmed regions of interest in the tumor core and infiltrating edge were cored, and adjacent sections were stained for α-SMA by immunohistochemistry. Stromal α-SMA positivity was quantified by color deconvolution as DAB pixels divided by total (DAB + hematoxylin) pixels in periductal stromal regions. They report mean stromal α-SMA fractions of 0.572 in tumor core regions versus 0.503 at the tumor edge, and 0.599 versus 0.499 in low- versus high-grade tumors.

  REMAPPED as myCAF fraction of total fibroblasts: The periductal stromal ROIs are dominated by fibroblasts/PSCs. The DAB/(DAB+hematoxylin) denominator captures stained cellular area (acellular ECM contributes to neither channel), so the α-SMA fraction approximates the fraction of stromal cells that are α-SMA-positive. α-SMA (ACTA2) is the defining marker of myofibroblastic CAFs (myCAFs). iCAFs are FAP+/α-SMA-low (Öhlund 2017, Biffi 2019) and would not stain strongly in this assay. Therefore the numerator maps to V_T.myCAF, not (iCAF + myCAF). The denominator maps to all fibroblast lineage cells: V_T.myCAF / (V_T.iCAF + V_T.myCAF + V_T.apCAF + V_T.qPSC). Non-fibroblast cells (immune cells, endothelium) in the ROI dilute the denominator slightly, making 0.572 a modest underestimate of the true myCAF fraction among fibroblasts; conversely, myCAFs are large cells with abundant α-SMA+ cytoplasm, which inflates their area contribution relative to cell counts. These biases partially cancel.
key_assumptions:
- |
  α-SMA-positive stromal area in PDAC periductal regions primarily reflects myofibroblastic CAFs (myCAFs), which are ACTA2-high. iCAFs are FAP+/α-SMA-low (Öhlund 2017, Biffi 2019) and contribute minimally to α-SMA staining. We therefore map α-SMA positivity to V_T.myCAF only.
- |
  The DAB/(DAB+hematoxylin) denominator in Drifka's color deconvolution captures stained cellular area. Acellular ECM stains with neither DAB nor hematoxylin and is thus excluded, making the denominator approximately "all cells in the stromal ROI."
- |
  Periductal stromal ROIs are dominated by fibroblasts/PSCs, so the α-SMA-positive cell fraction approximates the fibroblast activation ratio. Non-fibroblast cells (immune infiltrates, endothelial cells) dilute the denominator modestly but do not stain for α-SMA; their effect on the measured fraction is partially offset by the larger area-per-cell of activated myofibroblasts.
- |
  Drifka et al. report only point estimates (e.g., 0.572 for tumor core stromal α-SMA fraction) without dispersion metrics, so we approximate inter-sample variability by assuming a moderate coefficient of variation (CV ≈ 0.2) and modeling the distribution as Beta-distributed on [0,1].
- |
  We treat the 356 PDAC tissue cores as independent replicates for estimating the distribution of stromal α-SMA positivity, even though multiple cores originate from the same patient; this likely underestimates patient-level variability but is acceptable for a first-pass calibration target.
key_study_limitations:
- |
  Measurements are derived from a single-center retrospective tissue microarray with selected inclusion criteria (curative-intent surgery, no neoadjuvant therapy, inclusion of long-term survivors), which may limit generalizability to all resectable PDAC.
- |
  Stromal α-SMA positivity is quantified on periductal regions of 1 mm tissue cores rather than whole-tumor sections; spatial heterogeneity beyond core locations is not captured.
- |
  Multiple cores per patient are analyzed, but core-level measurements are not explicitly aggregated to per-patient statistics for α-SMA; treating all 356 cores as independent replicates may underestimate between-patient variance.
- |
  Only central values (e.g., 0.572 in tumor core) are reported for α-SMA fractions; dispersion (SD/SEM/IQR) must be approximated, making the uncertainty on this calibration target more assumption-driven than data-driven.
- |
  The experimental denominator includes non-fibroblast stromal cells (immune infiltrates, endothelial cells) in addition to fibroblasts/PSCs. This dilutes the measured α-SMA fraction relative to a pure fibroblast activation ratio, but the bias is modest because fibroblasts dominate PDAC periductal stroma.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        import numpy as np
        iCAF = species_dict['V_T.iCAF']
        myCAF = species_dict['V_T.myCAF']
        apCAF = species_dict['V_T.apCAF']
        qPSC = species_dict['V_T.qPSC']

        # Numerator: myCAF only. The Drifka 2016 measurement uses alpha-SMA
        # staining, which marks myCAFs (ACTA2-high). iCAFs are FAP+/alpha-SMA-low
        # and would not stain strongly for alpha-SMA.
        total_fibroblasts = iCAF + myCAF + apCAF + qPSC

        # Avoid division by zero
        zero_mask = total_fibroblasts == 0
        ratio = myCAF / total_fibroblasts
        if np.any(zero_mask):
            ratio_mag = ratio.copy()
            ratio_mag[zero_mask] = 0.0
            ratio = ratio_mag

        return ratio

  units: dimensionless
  species:
  - V_T.iCAF
  - V_T.myCAF
  - V_T.apCAF
  - V_T.qPSC
  constants: []
  support: unit_interval
  mapping_rationale: |
    Drifka et al. quantify α-SMA positivity as DAB/(DAB+hematoxylin) pixels in periductal stromal ROIs. The denominator captures stained cellular area (acellular ECM is excluded from both channels), and the stromal ROI is dominated by fibroblasts/PSCs. α-SMA (ACTA2) is the defining marker of myCAFs; iCAFs are FAP+/α-SMA-low (Öhlund 2017, Biffi 2019) and do not stain strongly. Therefore, the α-SMA-positive fraction approximates the myCAF fraction of total fibroblasts: V_T.myCAF / (V_T.iCAF + V_T.myCAF + V_T.apCAF + V_T.qPSC). This is consistent with Ogawa 2021 (n=215), which reports ACTA2-dominant fibroblasts as 71.7% of total CAFs (median 30.6% of desmoplastic area), providing cross-validation for this mapping.
  experimental_denominator: |
    All stained cells within periductal stromal ROIs in resected PDAC tissue cores, quantified as total cellular area (hematoxylin + DAB pixels). Dominated by fibroblasts/PSCs, with minor contributions from immune infiltrates and endothelial cells.
  model_denominator_species:
  - V_T.iCAF
  - V_T.myCAF
  - V_T.apCAF
  - V_T.qPSC
  unmodeled_denominator_components: |
    Non-fibroblast stromal cells (immune infiltrates, endothelial cells, pericytes) also contribute to the experimental denominator. These dilute the measured α-SMA fraction relative to a pure fibroblast activation ratio. In PDAC periductal stroma, fibroblasts are the dominant cell type, so the bias is modest (~10-20%). Partially offset by the larger area-per-cell of activated myofibroblasts compared to small quiescent PSCs and lymphocytes.
  aggregation: null
