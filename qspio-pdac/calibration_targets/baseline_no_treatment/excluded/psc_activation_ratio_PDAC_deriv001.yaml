exclusion_reason: |
  Denominator mismatch: Drifka's DAB/(DAB+hematoxylin) color deconvolution measures α-SMA
  fraction of ALL nucleated cells in periductal stromal ROIs (immune cells, endothelium included),
  but the observable maps to fibroblast-only denominator (iCAF+myCAF+apCAF+qPSC). The ~20%
  dilution gap vs Ogawa's marker-classified mycaf_fraction_of_caf (0.575 vs 0.716) cannot be
  decomposed without spatial immune data we lack. Additionally, no dispersion is reported (CV=0.2
  is assumed). Redundant with mycaf_fraction_of_caf (Ogawa 2021, n=215, real IQR, explicit
  marker-classified denominator). Excluded 2026-03-09.
