  - name: icaf_fraction_sd
    value: 0.039
    units: dimensionless
    description: |
      Standard deviation of iCAF fraction across 20 KPC tumors.
    source_ref: Elyada2019_apCAF
    value_location: Results section.
    value_snippet: |
      iCAFs 44.4 +/- 3.9%
    input_type: direct_parameter
    conversion_formula: null
    source_type: text
    figure_id: null
    extraction_method: manual
    extraction_notes: |
      The ± value could be SD or SEM; with n=20 the distinction matters
      (SEM would imply SD ≈ 17.4%). Treated as SD here, consistent with
      the tight inter-tumor reproducibility expected in isogenic KPC mice.
    dispersion_type: sd
    dispersion_type_rationale: |
      Assumed SD based on the tight reproducibility typical of isogenic
      GEMMs. If SEM, the true SD would be ~4.4x larger.
  assumptions: []
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np
        rng = np.random.default_rng(42)
        mean = inputs['icaf_fraction_mean'].magnitude
        sd = inputs['icaf_fraction_sd'].magnitude

        # Beta distribution from mean and SD on [0, 1]
        var = sd ** 2
        common = mean * (1.0 - mean) / var - 1.0
        alpha = max(mean * common, 1e-3)
        beta_p = max((1.0 - mean) * common, 1e-3)

        samples = rng.beta(alpha, beta_p, 100000) * ureg.dimensionless
        return {
            'median_obs': np.median(samples),
            'ci95_lower': np.percentile(samples, 2.5),
            'ci95_upper': np.percentile(samples, 97.5),
        }
