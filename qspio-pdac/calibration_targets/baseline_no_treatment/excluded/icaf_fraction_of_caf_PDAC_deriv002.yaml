study_interpretation: |
  Elyada et al. (2019) quantified CAF subtype proportions by flow cytometry in
  KPC (LSL-KrasG12D/+; LSL-Trp53R172H/+; Pdx1-Cre) pancreatic tumors (n=20).
  PDPN+ CAFs were sorted into iCAF, myCAF, and apCAF subpopulations. iCAFs
  comprised 44.4 ± 3.9% of PDPN+ CAFs. This provides an independent constraint
  from a different species (mouse KPC model) and assay (flow cytometry) compared
  to the existing deriv001 target (Ogawa 2021, human mIHC, n=215).
key_assumptions:
- |
  PDPN+ CAFs in the KPC mouse model map to the total activated CAF population
  in the QSP model (iCAF + myCAF + apCAF). PDPN is broadly expressed on CAFs
  and is a reasonable pan-CAF marker for flow cytometry.
- |
  iCAF proportions from the KPC mouse model are assumed to be translatable to
  human PDAC. KPC recapitulates key features of human PDAC stroma, but
  species-specific differences in CAF biology may exist.
- |
  The mean ± SD (44.4 ± 3.9%) from n=20 tumors is modeled as a Beta distribution
  on [0, 1], which is appropriate for a fraction with low CV (~8.8%).
key_study_limitations:
- |
  Mouse (KPC) data, not human. CAF subtype proportions may differ between
  autochthonous mouse tumors and human PDAC, though the overall CAF
  heterogeneity pattern is conserved.
- |
  Flow cytometry on enzymatically dissociated tumors may introduce cell-type
  biases (e.g., myCAFs in dense ECM may be harder to dissociate).
- |
  Single mouse model (KPC); other PDAC GEMMs may show different CAF proportions.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        icaf = species_dict['V_T.iCAF']
        total_caf = species_dict['V_T.iCAF'] + species_dict['V_T.myCAF'] + species_dict['V_T.apCAF']
        return (icaf / total_caf)

  units: dimensionless
  species:
  - V_T.iCAF
  - V_T.myCAF
  - V_T.apCAF
  constants: []
  support: unit_interval
  mapping_rationale: |
    Elyada et al. measured iCAF fraction of PDPN+ CAFs by flow cytometry. In the
    QSP model, the total CAF population is V_T.iCAF + V_T.myCAF + V_T.apCAF. The
    observable maps to V_T.iCAF / (V_T.iCAF + V_T.myCAF + V_T.apCAF).
  experimental_denominator: PDPN+ CAFs from flow cytometry of dissociated KPC tumors (n=20)
  model_denominator_species:
  - V_T.iCAF
  - V_T.myCAF
  - V_T.apCAF
  unmodeled_denominator_components: null
  aggregation: null
