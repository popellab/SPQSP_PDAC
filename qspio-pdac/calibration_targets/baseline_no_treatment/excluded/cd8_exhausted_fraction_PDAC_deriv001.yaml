scenario:
  description: |
    Baseline immune state in primary PDAC tumors at the time of surgical resection. Patients had resectable or borderline/locally advanced pancreatic ductal adenocarcinoma; approximately half received multimodal neoadjuvant therapy (GTX chemotherapy plus chemoradiotherapy) prior to surgery, while the remainder underwent upfront resection without prior systemic therapy. Tumor tissue and peripheral blood were collected intraoperatively at resection, single-cell suspensions prepared from tumors, and multiparameter flow cytometry performed to quantify PD-1 expression on tumor-infiltrating CD4+ and CD8+ T cells.
  interventions:
  - intervention_description: |
      For the neoadjuvant-therapy subgroup: three cycles of gemcitabine 750 mg/m^2 IV, docetaxel 30 mg/m^2 IV, and capecitabine 750 mg/m^2 orally (GTX regimen), followed within 14 days by chemoradiotherapy consisting of 300 cGy × 10 fractions of intensity-modulated radiation therapy with concurrent oxaliplatin 60 mg/m^2 IV and capecitabine 650 mg/m^2 orally; primary tumor resection performed 2–6 weeks after completion of chemoradiotherapy, with blood and tumor collected at surgery.
  - intervention_description: |
      For the no-therapy subgroup: no systemic anticancer therapy prior to surgery (treatment-naive at the time of resection); patients underwent primary pancreatic resection (pancreaticoduodenectomy, distal pancreatectomy, or total pancreatectomy), and blood plus tumor tissue were collected intraoperatively.
