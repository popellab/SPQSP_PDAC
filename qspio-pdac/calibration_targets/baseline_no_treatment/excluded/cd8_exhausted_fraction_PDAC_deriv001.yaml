  assumptions:
  - name: n_mc_samples
    value: 10000.0
    units: dimensionless
    description: |
      Number of Monte Carlo samples used to approximate the sampling distribution of the PD-1+ CD8+ fraction from the reported mean and SEM.
    rationale: |
      10,000 samples is a standard choice that provides stable estimates of median and 95% confidence intervals for a single-parameter distribution without excessive computational cost.
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np
        rng = np.random.default_rng(42)
        mean = inputs['mean_pd1_pos_cd8_tumor']  # dimensionless fraction
        sem = inputs['sem_pd1_pos_cd8_tumor']
        n_patients = int(inputs['n_patients_flow_pd1'].magnitude)

        # Convert SEM to SD
        sd = sem * np.sqrt(n_patients)

        # Infer Beta distribution parameters from mean and SD for a fraction on [0,1]
        m = mean.magnitude
        s = sd.magnitude
        var = s ** 2
        # Avoid division by zero or invalid variance
        if var <= 0.0:
            alpha = m * 100.0
            beta = (1.0 - m) * 100.0
        else:
            common = m * (1.0 - m) / var - 1.0
            alpha = m * common
            beta = (1.0 - m) * common
            alpha = max(alpha, 1e-3)
            beta = max(beta, 1e-3)

        samples = rng.beta(alpha, beta, 10000) * mean.units
        median_obs = np.median(samples)
        ci95_lower = np.percentile(samples, 2.5)
        ci95_upper = np.percentile(samples, 97.5)
        return {
            'median_obs': median_obs,
            'ci95_lower': ci95_lower,
            'ci95_upper': ci95_upper,
        }
