study_interpretation: |
  Elyada et al. (2019) quantified CAF subtype proportions by flow cytometry in
  KPC pancreatic tumors (n=20). apCAFs comprised 10.3 ± 1.25% of PDPN+ CAFs,
  the smallest subtype. This provides an independent constraint from a different
  species (mouse KPC model) and assay (flow cytometry) compared to the existing
  deriv001 target (Elyada 2019 human scRNA-seq + Ogawa 2021 protein-level IHC).
  The flow cytometry measurement on intact cells is more quantitative than
  transcriptomic co-expression analysis used in deriv001.
key_assumptions:
- |
  PDPN+ CAFs in the KPC mouse model map to the total activated CAF population
  in the QSP model (iCAF + myCAF + apCAF).
- |
  apCAF proportions from the KPC mouse model are assumed to be translatable to
  human PDAC. Cross-species validation in the same paper shows apCAFs exist in
  both mouse and human PDAC.
- |
  The mean ± SD (10.3 ± 1.25%) from n=20 tumors is modeled as a Beta distribution
  on [0, 1], appropriate for a fraction with low CV (~12%).
key_study_limitations:
- |
  Mouse (KPC) data, not human. The deriv001 target (human scRNA-seq) found 20.9%
  apCAFs by transcriptomic markers, suggesting species or assay differences.
- |
  Flow cytometry on enzymatically dissociated tumors may under-represent apCAFs
  if they are preferentially lost during tissue processing.
- |
  Dispersion (±1.25%) may be SEM rather than SD; with n=20 isogenic mice, tight
  reproducibility is plausible but true inter-patient variability in humans would
  be wider.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        import numpy as np
        apcaf = species_dict['V_T.apCAF']
        icaf = species_dict['V_T.iCAF']
        mycaf = species_dict['V_T.myCAF']
        total_caf = apcaf + icaf + mycaf
        zero_mask = total_caf == 0
        frac = apcaf / total_caf
        if np.any(zero_mask):
            frac = frac
            frac[zero_mask] = 0.0
            frac = frac
        return frac

  units: dimensionless
  species:
  - V_T.apCAF
  - V_T.iCAF
  - V_T.myCAF
  constants: []
  support: unit_interval
  mapping_rationale: |
    Elyada et al. measured apCAF fraction of PDPN+ CAFs by flow cytometry. The
    observable maps to V_T.apCAF / (V_T.apCAF + V_T.iCAF + V_T.myCAF).
  experimental_denominator: PDPN+ CAFs from flow cytometry of dissociated KPC tumors (n=20)
  model_denominator_species:
  - V_T.apCAF
  - V_T.iCAF
  - V_T.myCAF
  unmodeled_denominator_components: null
  aggregation: null
