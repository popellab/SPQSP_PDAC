    value: 0.0125
    units: dimensionless
    description: |
      Standard deviation of apCAF fraction across 20 KPC tumors.
    source_ref: Elyada2019_apCAF
    value_location: Results section.
    value_snippet: |
      apCAFs 10.3 +/- 1.25%
    input_type: direct_parameter
    conversion_formula: null
    source_type: text
    figure_id: null
    extraction_method: manual
    extraction_notes: null
    dispersion_type: sd
    dispersion_type_rationale: |
      Assumed SD. If SEM, true SD would be ~5.6%.
  assumptions: []
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np
        rng = np.random.default_rng(42)
        mean = inputs['apcaf_fraction_mean'].magnitude
        sd = inputs['apcaf_fraction_sd'].magnitude

        var = sd ** 2
        common = mean * (1.0 - mean) / var - 1.0
        alpha = max(mean * common, 1e-3)
        beta_p = max((1.0 - mean) * common, 1e-3)

        samples = rng.beta(alpha, beta_p, 100000) * ureg.dimensionless
        return {
            'median_obs': np.median(samples),
            'ci95_lower': np.percentile(samples, 2.5),
            'ci95_upper': np.percentile(samples, 97.5),
        }
