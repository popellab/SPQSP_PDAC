exclusion_reason: |
  Redundant with apcaf_fraction_of_caf (deriv001, human scRNA-seq). Mouse KPC data with
  potentially-SEM-as-SD tight CI [0.08, 0.13] gives false precision that may not translate
  across species. deriv001 uses human data with honest transcript-vs-protein uncertainty
  [0.02, 0.21]. Both agree model apCAF fraction (0.7%) is ~10x too low. Excluded 2026-03-09.
