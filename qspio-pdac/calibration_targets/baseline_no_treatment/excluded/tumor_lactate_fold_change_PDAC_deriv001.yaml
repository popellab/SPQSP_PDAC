  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np

        rng = np.random.default_rng(123)

        lactate_pp_mean = inputs['lactate_pp_mean']
        lactate_pp_sd = inputs['lactate_pp_sd']
        lactate_pa_mean = inputs['lactate_pa_mean']
        lactate_pa_sd = inputs['lactate_pa_sd']

        def lognormal_params(mean_q, sd_q):
            m = mean_q.magnitude
            s = sd_q.magnitude
            sigma2 = np.log(1.0 + (s**2) / (m**2))
            sigma = np.sqrt(sigma2)
            mu = np.log(m) - 0.5 * sigma2
            return mu, sigma

        mu_pp, sigma_pp = lognormal_params(lactate_pp_mean, lactate_pp_sd)
        mu_pa, sigma_pa = lognormal_params(lactate_pa_mean, lactate_pa_sd)

        n_samples = 100000
        pp_samples = rng.lognormal(mu_pp, sigma_pp, n_samples) * lactate_pp_mean.units
        pa_samples = rng.lognormal(mu_pa, sigma_pa, n_samples) * lactate_pa_mean.units

        ratio_samples = (pa_samples / pp_samples).to('dimensionless')

        median_obs = np.median(ratio_samples)
        ci95_lower = np.percentile(ratio_samples, 2.5)
        ci95_upper = np.percentile(ratio_samples, 97.5)

        return {
            'median_obs': median_obs,
            'ci95_lower': ci95_lower,
            'ci95_upper': ci95_upper,
        }
