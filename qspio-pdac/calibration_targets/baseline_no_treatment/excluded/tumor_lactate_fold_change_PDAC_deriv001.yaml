study_interpretation: |
  Battini et al. 2017 used 1H HRMAS NMR spectroscopy on intact tissue samples from patients undergoing surgical resection for pancreatic adenocarcinoma to quantify metabolite concentrations in pancreatic parenchyma (PP, healthy tissue) and pancreatic adenocarcinoma (PA). For the subset of samples without neoadjuvant chemotherapy (9 PP and 44 PA), Table 2 reports mean ± SD metabolite levels in nmol/mg, including lactate. Lactate is significantly higher in PA than in PP, reflecting elevated glycolysis in tumor tissue. For QSP calibration, we construct a dimensionless observable equal to the fold-change of tumor lactate relative to normal pancreas. The empirical distribution of this fold-change is derived from the ratio of lognormal distributions for PA and PP lactate (using their reported means and SDs), while the model observable computes V_T.lactate divided by a normal pancreas lactate reference converted to micromolarity from the same HRMAS PP data.
key_assumptions:
- |
  HRMAS NMR measurements of lactate (nmol/mg) in 15-20 mg cores of pancreatic parenchyma and tumor are representative of average lactate concentrations in the respective whole tissues and can be mapped to the model tumor compartment lactate species (V_T.lactate).
- |
  Positive metabolite concentrations (lactate in nmol/mg) are better approximated by lognormal than normal distributions; therefore, uncertainty in PA and PP lactate levels is propagated using lognormal sampling derived from mean and SD.
- |
  Conversion of 11.0040 nmol/mg PP lactate to a concentration in micromolarity assumes pancreatic tissue density of approximately 1 g/mL (1 mg tissue ~ 1 uL), so that nmol per mg wet weight corresponds to umol per mL.
- |
  The fold-change calibration target uses the ratio of independent group-level distributions for PA and PP lactate (ratio of lognormal random variables) rather than paired within-patient tumor/normal ratios; potential within-patient correlations are ignored.
- |
  The subgroup without neoadjuvant chemotherapy (44 PA, 9 PP) is considered the best match to a treatment-naive, resectable PDAC population, even though all patients later receive adjuvant gemcitabine postoperatively.
key_study_limitations:
- |
  Single-center retrospective cohort with a limited number of untreated PP samples (n=9) and PA samples (n=44) underlying the PP vs PA comparison; generalizability to broader PDAC populations may be limited.
- |
  Metabolite quantification by HRMAS NMR under the chosen acquisition conditions underestimates total metabolite content by approximately 20% compared with tissue extraction methods, as noted by the authors; this introduces a systematic scaling uncertainty that is not explicitly modeled.
- |
  Lactate levels are measured on small biopsy cores taken at resection and may not fully capture intratumoral spatial heterogeneity in metabolite distributions.
- |
  The PP and PA groups compared in Table 2 are not strictly patient-matched pairs (n=9 PP vs n=44 PA), so the fold-change derived here is a ratio of group means rather than a within-patient paired fold-change.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        """Compute fold-change of tumor lactate relative to normal pancreas reference.

        Observable = V_T.lactate / lactate_normal_reference (dimensionless).
        """
        lactate_tumor = species_dict['V_T.lactate']  # micromolarity
        lactate_normal = constants['lactate_normal_reference']  # micromolarity
        ratio = lactate_tumor / lactate_normal
        return ratio

  units: dimensionless
  species:
  - V_T.lactate
  constants:
  - name: lactate_normal_reference
    value: 11004.0
    units: micromolarity
    biological_basis: |
      Derived from Battini et al. 2017 Table 2: lactate in pancreatic parenchyma (PP) without neoadjuvant chemotherapy is reported as 11.0040 nmol/mg. Assuming pancreatic tissue density approximately 1 g/mL (1 mg tissue ~ 1 uL), this corresponds to 11.0040 umol/mL = 11.004 mM = 1.1004e4 uM. This value is used as the normal pancreas lactate reference concentration for the fold-change observable.
    source_type: literature
    reference_db_name: null
    reference_db_names: null
    source_tag: Battini2017_HRMAS
  support: positive_unbounded
  mapping_rationale: |
    HRMAS NMR quantifies total lactate content in small cores of pancreatic parenchyma (PP) and pancreatic adenocarcinoma (PA) as nmol per mg of wet tissue (Table 2). We interpret these values as proportional to average tissue lactate concentrations in the primary tumor and normal pancreas. The calibration target uses the dimensionless fold-change of tumor lactate relative to normal pancreas. The model observable computes V_T.lactate (tumor lactate concentration in micromolarity) divided by a literature-derived normal pancreas lactate reference (lactate_normal_reference), so that model output is directly comparable to the PA/PP fold-change estimated from HRMAS data.
