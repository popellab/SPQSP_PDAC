exclusion_reason: |
  Redundant with cd8_treg_ratio_golesworthy2022 (deriv002), which computes per-patient ratios
  directly (avoiding ratio-of-means bias from independently sampled medians), has larger n (166
  vs 113), and tighter CI. Both targets agree (model produces 2.39 vs obs 5.39/3.69) — keeping
  both double-counts a single biological signal in D². Excluded 2026-03-09.
