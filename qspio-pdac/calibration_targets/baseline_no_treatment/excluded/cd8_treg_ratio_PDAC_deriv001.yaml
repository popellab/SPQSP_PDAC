study_interpretation: |
  From Sivagnanam et al. Table S5, CD8+ T cell density (76 cells/mm^2) and Treg density (14 cells/mm^2) in the Tumor region give a CD8/Treg ratio of ~5.4. This ratio is a prognostic biomarker reflecting the effector-to-suppressor balance in the TME.
key_assumptions:
- |
  CD8+ T cells from mIHC include both effector and exhausted phenotypes, corresponding to V_T.CD8 + V_T.CD8_exh.
- Foxp3+ cells correspond to V_T.Treg.
- CD8 and Treg densities sampled independently, which widens the CI of the ratio.
key_study_limitations:
- |
  Within-patient correlation between CD8 and Treg densities is unknown, leading to wider CI.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        cd8 = species_dict['V_T.CD8']
        cd8_exh = species_dict['V_T.CD8_exh']
        treg = species_dict['V_T.Treg']
        ratio = ((cd8 + cd8_exh) / treg)
        return ratio

  units: dimensionless
  species:
  - V_T.CD8
  - V_T.CD8_exh
  - V_T.Treg
  constants: []
  support: positive_unbounded
  mapping_rationale: |
    CD8/Treg density ratio maps to (V_T.CD8 + V_T.CD8_exh) / V_T.Treg. Tumor area cancels.
  experimental_denominator: Treg (Foxp3+) density in tumor region
  model_denominator_species:
