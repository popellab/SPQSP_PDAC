  assumptions:
  - name: n_mc_samples
    value: 100000.0
    units: dimensionless
    description: |
      Number of Monte Carlo samples for stable beta distribution quantile estimates.
    rationale: |
      100,000 samples provide <1% Monte Carlo error on median and 95% CI for a beta distribution.
  - name: n_patients
    value: 142.0
    units: dimensionless
    description: |
      Sample size used to interpret the reported range as approximate extreme-order-statistic quantiles.
    rationale: |
      For n=142, the expected min and max correspond to approximately the 0.7th and 99.3rd percentiles.
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np

        # Extract reported statistics as dimensionless fractions
        median_frac = inputs['tsp_median_percent'].to('dimensionless').magnitude
        min_frac = inputs['tsp_min_percent'].to('dimensionless').magnitude
        max_frac = inputs['tsp_max_percent'].to('dimensionless').magnitude
        n_mc = int(inputs['n_mc_samples'].magnitude)
        n_pat = int(inputs['n_patients'].magnitude)

        # Estimate SD from the observed range using expected range of
        # order statistics: for n observations, range ≈ 2 * d_n * SD
        # where d_n ≈ sqrt(2 * ln(n)) for moderate n.
        # For n=142: d_n ≈ sqrt(2*ln(142)) ≈ 3.15, so range ≈ 6.3 * SD
        obs_range = max_frac - min_frac
        d_n = np.sqrt(2.0 * np.log(n_pat))
        sd_est = obs_range / (2.0 * d_n)

        # Method of moments for beta(a, b):
        #   mean = a/(a+b),  var = ab/((a+b)^2*(a+b+1))
        # Approximate mean ≈ median (slight bias for skewed beta, acceptable)
        mean_est = median_frac
        var_est = sd_est ** 2

        # Solve for a and b
        # From mean: a = mean*(a+b) => a/b = mean/(1-mean)
        # Let r = mean/(1-mean), so a = r*b
        # Substituting into variance equation:
        #   r*b^2 / ((r*b+b)^2*(r*b+b+1)) = var
        #   r / ((r+1)^2 * ((r+1)*b + 1)) = var
        #   (r+1)*b + 1 = r / (var * (r+1)^2)
        #   b = (r / (var * (r+1)^2) - 1) / (r+1)
        r = mean_est / (1.0 - mean_est)
        b_param = (r / (var_est * (r + 1.0) ** 2) - 1.0) / (r + 1.0)
        a_param = r * b_param

        # Safety: ensure valid beta parameters
        a_param = max(a_param, 1.01)
        b_param = max(b_param, 1.01)

        rng = np.random.default_rng(42)
        samples = rng.beta(a_param, b_param, n_mc)

        median_obs = float(np.median(samples))
        ci95_lower = float(np.percentile(samples, 2.5))
        ci95_upper = float(np.percentile(samples, 97.5))

        return {
            'median_obs': median_obs * ureg.dimensionless,
            'ci95_lower': ci95_lower * ureg.dimensionless,
            'ci95_upper': ci95_upper * ureg.dimensionless,
        }
