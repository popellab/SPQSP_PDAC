study_interpretation: |
  Sivagnanam et al. Table S5 reports DC-LAMP+ DC density (1 cells/mm^2, mature DCs) and DC-LAMP- DC density (69 cells/mm^2, immature DCs) in the Tumor region. The maturation ratio DC-LAMP+ / total DC ≈ 1.4% indicates that the vast majority of intratumoral DCs are immature, consistent with the immunosuppressive PDAC TME.
key_assumptions:
- |
  DC-LAMP+ DCs correspond to mature DCs (V_T.mcDC1 + V_T.mcDC2) and DC-LAMP- to immature DCs (V_T.cDC1 + V_T.cDC2).
- |
  DC-LAMP (CD208/LAMP3) is a specific maturation marker that does not overlap with other cell types in the mIHC panel.
key_study_limitations:
- |
  DC-LAMP+ median and Q1 are both 1 cell/mm^2, making lognormal parameterization imprecise at the lower bound.
- DC-LAMP does not distinguish cDC1 from cDC2 subtypes.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        mcdc1 = species_dict['V_T.mcDC1']
        mcdc2 = species_dict['V_T.mcDC2']
        cdc1 = species_dict['V_T.cDC1']
        cdc2 = species_dict['V_T.cDC2']
        mature = mcdc1 + mcdc2
        total = cdc1 + cdc2 + mcdc1 + mcdc2
        ratio = (mature / total)
        return ratio

  units: dimensionless
  species:
  - V_T.mcDC1
  - V_T.mcDC2
  - V_T.cDC1
  - V_T.cDC2
  constants: []
  support: unit_interval
  mapping_rationale: |
    DC-LAMP+ / total DC maps to (mcDC1 + mcDC2) / (cDC1 + cDC2 + mcDC1 + mcDC2). Tumor area cancels.
