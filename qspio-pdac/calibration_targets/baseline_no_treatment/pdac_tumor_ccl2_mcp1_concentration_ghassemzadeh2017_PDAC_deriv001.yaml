epistemic_basis: literature
study_interpretation: Ghassem-Zadeh et al. quantified MCP-1/CCL2 protein in human pancreatic tissue homogenates from pathologically confirmed pancreatic ductal adenocarcinoma (PDAC) patients using multiplex cytokine analysis, normalizing cytokine abundance to total tissue protein. The calibration target uses the reported PDAC tissue MCP-1/CCL2 concentration (pg per mg total protein) as a direct human PDAC tumor-tissue absolute cytokine measurement, converted to nM tumor concentration using an explicit in-tissue soluble-protein-density assumption. This matches the conversion approach used by the IL-1 and IL-6 targets extracted from the same paper.
key_assumptions:
- MCP-1 and CCL2 are treated as synonymous measurements of the model species V_T.CCL2.
- The PDAC pancreatic tissue homogenates are treated as representative of resectable untreated tumor tissue.
- Conversion from pg/mg total protein to pg/mL tumor assumes 50-100 mg soluble protein per mL wet tumor tissue (uniform), matching the IL-1 and IL-6 sibling targets from the same paper. The ratio of cytokine to total protein in the tissue is invariant under post-extraction dilution to the assay input concentration of 600 ug/mL — that dilution scales both quantities equally and cannot enter the conversion.
- MCP-1/CCL2 molecular weight is approximated as 8.6 kDa for conversion from mass concentration to molarity.
- The reported median and IQR are modeled with a lognormal distribution because chemokine concentrations are positive and right-skewed; the lognormal closure recovers sigma_log analytically from the IQR (sigma = arcsinh(IQR/(2*median))/z, z=0.6745).
key_study_limitations:
- Small PDAC tissue cohort (n=12) limits precision of the population distribution.
- The measurement is normalized to total extracted protein rather than directly per tumor volume, so comparison to a tumor-compartment molar concentration requires a tissue protein density assumption.
- The tissue homogenate includes bulk tumor microenvironment and adjacent stromal/immune components; it does not identify the cellular source of MCP-1.
- A previous version of this target erroneously used the assay-input dilution buffer protein concentration (600 ug/mL) as the divisor in the model-side observable code, inflating the effective "expected pg/mg" by 75/0.6 = 125x and inverting the misspec verdict. Documented here so the conversion rationale stays intact across re-extractions.
