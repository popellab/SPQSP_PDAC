epistemic_basis: literature
study_interpretation: Ghassem-Zadeh et al. measured inflammatory cytokines in homogenates of human pancreatic tissue, including pancreatic ductal adenocarcinoma resection specimens, using multiplex cytokine analysis normalized to total protein. The calibration target uses the reported PDAC tissue IL-6 concentration (Table 4, pancreatic tissue lysates) as a direct human PDAC tumor-tissue absolute IL-6 measurement, converted from pg/mg total protein to nM tumor concentration using an explicit soluble-protein-density assumption (U(50, 100) mg/mL). The same Table 4 cohort (n=12 treatment-naive PDAC patients) supplies the IL-1 and CCL2 calibration targets; the three observables are from the same patients and are not independent across patients, only across cytokines.
key_assumptions:
- IL-6 mature secreted form molecular weight is approximated as 26 kDa for mass-to-molar conversion.
- Conversion from pg/mg total protein to pg/mL tumor assumes 75 mg soluble protein per mL wet tumor tissue, with uncertainty represented by sampling protein density uniformly from 50 to 100 mg/mL.
- The reported IQR width is interpreted as Q3-Q1 of a lognormal distribution; sigma_log is recovered analytically via sigma = arcsinh(IQR/(2*median))/z (z=0.6745).
- Cohort overlap with IL-1 and CCL2 targets (same n=12 PDAC patients in Ghassem-Zadeh 2017 Table 4); treat with a cohort-RE assumption when combined.
key_study_limitations:
- Cytokines are reported normalized to total protein rather than directly per tumor volume, requiring an assumed tissue protein density conversion.
- Small PDAC cohort (n=12) limits population precision.
- Homogenate measurement loses spatial information; pericellular gradients and intracellular pools are not separable from extracellular tumor IL-6.
