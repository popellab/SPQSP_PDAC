  assumptions:
  - name: protein_density_low
    value: 50
    units: milligram / milliliter
    description: Lower bound for soluble protein content per wet tumor volume used to convert pg/mg protein to pg/mL tissue.
    rationale: Tissue cytokines are normalized to total protein; PDAC tumor soluble-protein recovery varies by sample and lysis protocol. A broad 50-100 mg/mL range is used so conversion uncertainty dominates appropriately.
  - name: protein_density_high
    value: 100
    units: milligram / milliliter
    description: Upper bound for soluble protein content per wet tumor volume used to convert pg/mg protein to pg/mL tissue.
    rationale: The range brackets plausible wet-tissue protein densities and avoids overconfidence in converting protein-normalized homogenate data to tissue-volume concentration.
  - name: il6_molecular_weight
    value: 26000
    units: gram / mole
    description: Mature human IL-6 molecular weight for mass-to-molar conversion.
    rationale: Mature secreted IL-6 is approximately 26 kDa; this is used only for unit conversion from pg/mL to nM.
  - name: n_mc_samples
    value: 100000
    units: dimensionless
    description: Monte Carlo sample count for propagating lognormal cytokine and protein-density uncertainty.
    rationale: Large sample count provides stable percentiles for the derived calibration distribution.
  distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n    rng = np.random.default_rng(42)\n    median = inputs['il6_median_pg_per_mg_protein']\n    iqr = inputs['il6_iqr_pg_per_mg_protein']\n    n_samples = int(inputs['n_mc_samples'].magnitude)\n    # Lognormal closure: for a lognormal with median m and log-SD sigma,\n    # IQR = m * (exp(z*sigma) - exp(-z*sigma)) = 2*m*sinh(z*sigma).\n    # So sigma = arcsinh(IQR / (2*m)) / z.  This is the same closure used\n    # by the CCL2 target derivation; the previous subtract-half-IQR + clamp\n    # parameterization mathematically forced sigma_log ~ 2.76 (CV ~216%)\n    # because IQR > 2*median pushed Q1 negative and triggered the 5% clamp.\n    z = 0.6744897501960817\n    ratio = (iqr / median).to('dimensionless').magnitude\n    sigma_log = np.arcsinh(ratio / 2.0) / z\n    mu_log = np.log(median.magnitude)\n    pg_per_mg = rng.lognormal(mu_log, sigma_log, n_samples) * median.units\n    protein_low = inputs['protein_density_low'].to('milligram / milliliter')\n    protein_high = inputs['protein_density_high'].to('milligram / milliliter')\n    protein_density = rng.uniform(protein_low.magnitude, protein_high.magnitude, n_samples) * protein_low.units\n    mw = inputs['il6_molecular_weight'].to('gram / mole')\n    mass_conc = (pg_per_mg * protein_density).to('picogram / milliliter')\n    molar = (mass_conc.to('gram / liter') / mw).to('nanomolar')\n    return {\n        'median_obs': np.median(molar),\n        'ci95_lower': np.percentile(molar, 2.5),\n        'ci95_upper': np.percentile(molar, 97.5),\n    }\n"
