  assumptions:
  - name: n_mc_samples
    value: 10000.0
    units: dimensionless
    description: Number of Monte Carlo samples for log-normal sampling of the apCAF fraction.
    rationale: |
      Standard sample size for stable percentile estimates of median and 95% CI while keeping computation lightweight.
  - name: transcript_protein_gap
    value: 1.0
    units: dimensionless
    description: |
      Flag indicating that the CI spans transcript-level (Elyada 2019, ~21%) to protein-level (Ogawa 2021, ~2%) estimates. The log-normal is parametrized so that the 2.5th percentile ≈ 0.02 and the 97.5th percentile ≈ 0.21.
    rationale: |
      MHC-II transcript co-expression (HLA-DRA + CD74) in scRNA-seq does not guarantee functional protein-level antigen presentation. Ogawa 2021 (n=215 PDAC, multiplex IHC) found protein-level apCAFs "extremely limited in number," consistent with the literature consensus of ~2-5% functional apCAFs. The wide CI reflects this genuine transcript-vs-protein uncertainty.
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np

        # Log-normal parametrized so that:
        #   2.5th percentile ≈ 0.02 (protein-level lower bound, Ogawa 2021)
        #   97.5th percentile ≈ 0.21 (transcriptomic upper bound, Elyada 2019)
        # => mu = (ln(0.02) + ln(0.21)) / 2 = -2.736
        # => sigma = (ln(0.21) - ln(0.02)) / (2 * 1.96) = 0.600
        # => median = exp(-2.736) ≈ 0.065
        mu = (np.log(0.02) + np.log(0.21)) / 2.0
        sigma = (np.log(0.21) - np.log(0.02)) / (2.0 * 1.96)

        n_mc = int(inputs['n_mc_samples'].magnitude)
        rng = np.random.default_rng(42)
        samples = rng.lognormal(mu, sigma, n_mc) * ureg.dimensionless

        median_obs = np.median(samples)
        ci95_lower = np.percentile(samples, 2.5)
        ci95_upper = np.percentile(samples, 97.5)

        return {
            'median_obs': median_obs,
            'ci95_lower': ci95_lower,
            'ci95_upper': ci95_upper,
        }
