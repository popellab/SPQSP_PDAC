scenario:
  description: |
    Untreated primary PDAC tumors were surgically resected from six patients. Tumor specimens were enzymatically dissociated, and viable cells were sorted by FACS to enrich for fibroblasts (CD45−, CD31−, EpCAM−). Single cells were captured using a droplet-based 10x Genomics protocol and subjected to scRNA-seq. Fibroblasts were identified bioinformatically, and the fraction of CAFs co-expressing HLA-DRA and CD74 (apCAF signature) among all CAFs was computed.
  interventions:
  - intervention_description: |
      No systemic anti-cancer therapy prior to surgery (untreated/treatment-naive PDAC). Surgical resection of the primary pancreatic tumor was performed for standard-of-care management, and tumor tissue at resection was used for downstream single-cell RNA sequencing and CAF subtype analysis.
