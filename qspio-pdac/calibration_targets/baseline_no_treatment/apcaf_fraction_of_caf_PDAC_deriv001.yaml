study_interpretation: |
  This study used single-cell RNA sequencing of dissociated cells from six resected, untreated human PDAC tumors to characterize the composition and transcriptional states of tumor and stromal cell populations. Within the CAF compartment, cells expressing pan-fibroblast markers were clustered into myCAF and iCAF subpopulations, analogous to previous work, and a subset of CAFs co-expressing MHC class II genes (HLA-DRA, HLA-DPA1, HLA-DQA1) and CD74 was identified. These MHC-II+ CD74+ CAFs correspond to antigen-presenting CAFs (apCAFs). Quantification of the human CAF dataset showed that 20.9% of CAFs co-expressed HLA-DRA and CD74 at the transcript level.

  IMPORTANT: This 20.9% is a transcriptomic (mRNA) upper bound, not a protein-level measurement. Ogawa et al. (CCR 2021, n=215 treatment-naive PDACs) found protein-level apCAFs to be "extremely limited in number" using multiplex IHC, consistent with the broader literature consensus of ~2-5% functional apCAFs. MHC-II transcript expression does not guarantee functional protein assembly and surface presentation. The calibration target therefore uses 20.9% as an upper bound and ~2% (protein-level) as a lower bound, with a log-normal distribution spanning this range (median ~6.5%).
key_assumptions:
- |
  The fraction of CAFs that co-express HLA-DRA and CD74 in the single-cell RNA-seq dataset is representative of the in vivo fraction of apCAFs among all CAFs in untreated primary PDAC at the time of resection.
- |
  Cells co-expressing HLA-DRA and CD74 in human CAF scRNA-seq data correspond directly to the model species V_T.apCAF, while CAFs lacking this signature are represented by V_T.iCAF and V_T.myCAF.
- |
  The set of 962 fibroblasts analyzed (COL1A1+ CAFs enriched by FACS) adequately samples the CAF compartment across the six PDAC resections, so that the estimated 20.9% fraction is generalizable to typical resectable, treatment-naive PDAC tumors.
- |
  Fibroblast-like populations not captured in the CAF gate (e.g., perivascular fibroblasts or lipofibroblasts) make a negligible contribution to the overall CAF count relevant for apCAF fraction, and therefore can be ignored in the denominator of the observable.
- |
  The 20.9% transcriptomic estimate represents an upper bound on functional apCAF fraction. Protein-level IHC data (Ogawa 2021) and literature consensus place functional apCAFs at ~2-5% of CAFs. Uncertainty is modeled as a log-normal spanning from the protein-level lower bound (~2%) to the transcriptomic upper bound (~21%), reflecting genuine biological uncertainty about what fraction of MHC-II-transcribing CAFs are functionally antigen-presenting.
key_study_limitations:
- |
  The CAF measurement is based on transcriptomic markers (HLA-DRA and CD74 co-expression) from dissociated single cells rather than direct protein quantification by flow cytometry or imaging, so it may not perfectly reflect functional MHC-II protein expression at the protein level.
- |
  Single-cell dissociation and FACS enrichment can introduce sampling bias, potentially under-representing fragile or spatially constrained CAF populations, which may slightly distort the estimated apCAF fraction.
- |
  The cohort size (six untreated PDAC resections, 962 CAFs) is modest and may not capture inter-patient heterogeneity in CAF subtype composition across the broader PDAC population.
- |
  Clinical staging information beyond being resected, untreated primary PDAC is not fully specified, so residual heterogeneity in disease stage and tumor burden may influence CAF composition.
- |
  The analysis does not explicitly segregate CAFs originating from tumor core versus invasive front or peritumoral stroma, so spatial heterogeneity in apCAF distribution is not captured.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        import numpy as np
        apcaf = species_dict['V_T.apCAF']  # cells
        icaf = species_dict['V_T.iCAF']    # cells
        mycaf = species_dict['V_T.myCAF']  # cells

        total_caf = apcaf + icaf + mycaf
        # Avoid division by zero: if total CAF count is zero, define fraction as zero
        zero_mask = total_caf == 0
        frac = apcaf / total_caf
        if np.any(zero_mask):
            frac = frac
            frac[zero_mask] = 0.0
            frac = frac

        return frac

  units: dimensionless
  species:
  - V_T.apCAF
  - V_T.iCAF
  - V_T.myCAF
  constants: []
  support: unit_interval
  mapping_rationale: |
    The observable is defined as the fraction of antigen-presenting CAFs (apCAFs) among all CAFs in the primary PDAC tumor. In the model, V_T.apCAF represents apCAFs, whereas V_T.iCAF and V_T.myCAF represent inflammatory CAFs and myofibroblastic CAFs, respectively. The experimental measurement is the proportion of CAFs co-expressing HLA-DRA and CD74 (apCAF marker genes) among all COL1A1+ CAFs in single-cell RNA-seq data from resected human PDAC tumors. Therefore, the model observable computes V_T.apCAF / (V_T.apCAF + V_T.iCAF + V_T.myCAF), which directly mirrors the experimentally measured proportion of apCAFs among all CAFs.
  experimental_denominator: |
    All COL1A1+ CAFs in human PDAC single-cell dataset (including myCAFs, iCAFs and apCAF-like cells).
  model_denominator_species:
  - V_T.apCAF
  - V_T.iCAF
  - V_T.myCAF
  unmodeled_denominator_components: |
    Other rare fibroblast-like stromal populations (e.g., lipofibroblasts) are not explicitly represented in the model and are assumed to contribute negligibly to the total CAF count for this observable.
  aggregation: null
