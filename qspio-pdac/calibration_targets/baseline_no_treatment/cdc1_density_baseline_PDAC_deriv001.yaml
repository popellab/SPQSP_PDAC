study_interpretation: |
  Plesca et al. analyzed tumor-infiltrating dendritic cell subsets in primary PDAC resections from 58 patients (40 with multiplex IHC data for cDC1/cDC2). Using multiplex immunohistochemistry and automated image analysis, they identified CLEC9A+ cells as human cDC1s and quantified their density (cells/mm^2) within the whole tumor area (intraepithelial tumor plus tumor stroma) on formalin-fixed, paraffin-embedded sections. They reported mean ± SEM densities for cDC1s, cDC2s, and pDCs in distinct tumor regions and correlated these with clinicopathologic parameters and survival. For calibration, we use the mean CLEC9A+ cDC1 density in the whole tumor area (9.84 ± 1.16 cells/mm^2, n = 40), interpreted as the density of all cross-presenting cDC1s (immature + mature) in resectable human PDAC. In the QSP model this maps to the sum of immature and mature cross-presenting dendritic cells in the tumor compartment (V_T.cDC1 + V_T.mcDC1), normalized by whole tumor area derived from modeled cancer cell counts and a fixed PDAC cellularity fraction.
key_assumptions:
- |
  CLEC9A+ tumor-infiltrating cells in human PDAC correspond predominantly to the cDC1 subset (co-expressing CD141/BDCA-3 and XCR1) and are appropriately mapped to the total cross-presenting dendritic cell population represented by V_T.cDC1 + V_T.mcDC1 in the model.
- |
  The reported 9.84 ± 1.16 cDC1s/mm^2 values in the WTA are treated as mean ± SEM across 40 patients, as explicitly stated in the Statistical Analysis section; we convert SEM to SD using SD = SEM·sqrt(n) and assume an underlying lognormal distribution for positive cell densities.
- |
  Densities measured on 25–50% of tumor-containing regions per slide (as defined by a pathologist) are assumed to be representative of the entire primary tumor immune microenvironment for each patient.
- |
  Although 36% of patients received neoadjuvant chemotherapy before resection and 64% underwent primary resection without neoadjuvant therapy, we treat the pooled cDC1 density as characteristic of resectable, untreated PDAC at surgery, based on the authors’ finding that neoadjuvant chemotherapy did not significantly change cDC1 frequencies.
- |
  Tumor cellularity is approximated as a fixed 25% across patients (pdac_cellularity_fraction) when converting model cancer cell counts to whole tumor area; inter-patient variability in cellularity and stromal content is not explicitly propagated into the uncertainty of the observable.
key_study_limitations:
- |
  Retrospective single-center cohort of 58 PDAC patients (40 with multiplex IHC data for cDC1/cDC2) treated between 2008 and 2015; results may not generalize to other institutions, ethnicities, or treatment eras.
- |
  Approximately 36% of patients received neoadjuvant chemotherapy, whereas 64% underwent primary resection; although the authors report no significant impact of neoadjuvant therapy on cDC1, cDC2, or pDC frequencies, subtle therapy-induced shifts in dendritic cell density or function cannot be excluded.
- |
  Dendritic cell densities were quantified on 25–50% of tumor-containing regions per slide rather than on the entire tumor, which may introduce sampling bias, especially in tumors with heterogeneous immune infiltration or patchy stromal architecture.
- |
  CLEC9A staining identifies human cDC1s but may also detect a small subset of other myeloid cells; rare misclassification or marker expression heterogeneity could affect absolute cDC1 counts and their spatial distribution.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        """mIHC-equivalent cDC1 density via V_T-based 3D->2D projection.

        Returns total (immature + mature) cDC1 cells per mm^2 of section through
        whole tumor area, matching Plesca2022's CLEC9A+ cDC1 reporting and the
        submodel target forward model convention.
        """
        cdc1_imm = species_dict['V_T.cDC1']
        cdc1_mat = species_dict['V_T.mcDC1']
        V_T = species_dict['V_T']
        thickness = constants['section_thickness_um']
        cell_diameter = constants['cell_diameter_um']  # Abercrombie correction term
        density = (cdc1_imm + cdc1_mat) / V_T * (thickness + cell_diameter)
        # cells/mL * um -> cells/mm^2: (1 mL = 1000 mm^3, 1 um = 1e-3 mm) -> 1e-6
        return (density) * 1e-06

  units: cell / millimeter**2
  species:
  - V_T.cDC1
  - V_T.mcDC1
  - V_T
  constants:
  - name: section_thickness_um
    value: 4.0
    units: micrometer
    biological_basis: |
      FFPE tissue section thickness reported by Plesca2022 (range 3-5 micrometer, midpoint 4).
      Matches the standard mIHC cell-density convention used in cDC1/cDC2 reporting.
    source_type: reference_db
    reference_db_name: ffpe_section_thickness
    reference_db_names: null
    source_tag: null
  - name: cell_diameter_um
    value: 13.0
    units: micrometer
    biological_basis: |
      Mature myeloid dendritic cell diameter (~12-15 micrometer; midpoint 13). Used as Abercrombie overcounting term `d` in the 2D->3D projection: counted_cells/mm^2 = (cells/V_T) * (t + d), correcting for FFPE sections (t ~ 4 micrometer) thinner than the cell diameter.
    source_type: reference_db
    reference_db_name: dendritic_cell_diameter
    reference_db_names: null
    source_tag: null
  support: positive
  mapping_rationale: |
    Plesca et al. quantified tumor-infiltrating cDC1s in resected human PDAC using multiplex IHC for CLEC9A (a canonical human cDC1 marker, co-expressed with CD141/BDCA-3 and XCR1). They reported mean densities of CLEC9A+ cDC1s per mm^2 of the whole tumor area (WTA), defined as intraepithelial tumor plus tumor stroma. In the QSP model, immature and mature cross-presenting dendritic cells are represented by V_T.cDC1 and V_T.mcDC1 in the tumor compartment. We map the experimental CLEC9A+ cDC1 counts to the sum V_T.cDC1 + V_T.mcDC1, and convert model cancer cell counts (V_T.C1) to whole tumor area using the PDAC cancer cell cross-sectional area and a fixed 25% tumor cellularity fraction, so that the observable returns total cDC1 density (cells/mm^2 of WTA) comparable to the mIHC measurement.
  experimental_denominator: |
    mm^2 of whole tumor tissue cross-section (intraepithelial tumor area plus tumor stroma) on resected PDAC specimens, as defined in the multiplex IHC analysis.
  model_denominator_species:
  - V_T
  unmodeled_denominator_components: |
    The experimental denominator (whole tumor area) includes stromal fibroblasts, vasculature, extracellular matrix, and non-malignant cells that are not explicitly modeled as area-contributing species. We approximate their contribution via a fixed PDAC cellularity fraction (0.25), but residual heterogeneity in stromal content and non-cancer cellularity may introduce systematic error in the absolute density.
  aggregation: null
