study_interpretation: |
  PASS-01 (Pancreatic Adenocarcinoma Signature Stratification for Treatment, NCT04098432)
  multiplex immunohistochemistry (mIHC) data from 95 treatment-naive resected PDAC patients.
  Per-core cell type fractions computed from single-cell phenotyping with denominator restricted
  to 8 QSP-mappable cell types (cancer, macrophage, fibroblast, CD4 T, CD8 T, B cell, dendritic,
  MDSC), excluding artifact, unclassified, endothelial, NK, neutrophil, and other_immune cells
  to match the QSP model's modeled cell population. Cancer cells (C1) fraction = cancer count /
  sum of 8 mappable types.
key_assumptions:
- |
  The denominator is restricted to 8 cell types that have direct QSP model species equivalents.
  Unmodeled cell types (endothelial, NK, neutrophil, other_immune, t_other) are excluded from
  both numerator and denominator to ensure the IMC and QSP fractions are computed over the
  same cell population.
- |
  Each TMA core is treated as an independent patient sample (n=95, one core per patient).
  Intra-tumor spatial heterogeneity is not captured by the single-core sampling.
- |
  The IMC cell type classification maps to QSP species as follows: Cancer cells (C1).
key_study_limitations:
- |
  Single TMA core per patient may not capture intra-tumor heterogeneity in cell composition.
- |
  Cell phenotyping accuracy depends on marker panel and gating strategy; some cell types
  (especially rare populations like CD8 T cells) may be under- or over-counted.
- |
  The PASS-01 cohort is enriched for resectable PDAC; fractions may not generalize to
  unresectable or metastatic disease.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        """Fraction of cancer among QSP-modeled nucleated tumor cells.

        Numerator: Cancer cells (C1)
        Denominator: all 8 QSP-mappable cell populations (cancer + macrophage +
        fibroblast + CD4 T + CD8 T + B cell + dendritic + MDSC).
        """
        numerator = species_dict['V_T.C1']
        denominator = species_dict['V_T.C1'] + species_dict['V_T.Mac_M1'] + species_dict['V_T.Mac_M2'] + species_dict['V_T.iCAF'] + species_dict['V_T.myCAF'] + species_dict['V_T.apCAF'] + species_dict['V_T.Th'] + species_dict['V_T.Th_exh'] + species_dict['V_T.Treg'] + species_dict['V_T.CD8'] + species_dict['V_T.CD8_exh'] + species_dict['V_T.nB'] + species_dict['V_T.aB'] + species_dict['V_T.cDC1'] + species_dict['V_T.cDC2'] + species_dict['V_T.mcDC1'] + species_dict['V_T.mcDC2'] + species_dict['V_T.MDSC'] + species_dict['V_T.nCD8'] + species_dict['V_T.nCD4']
        return numerator / denominator

