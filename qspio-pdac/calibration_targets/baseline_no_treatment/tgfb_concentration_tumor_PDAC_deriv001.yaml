calibration_target_id: pdac_plasma_tgfb1_vizio2012
cancer_type: PDAC
tags:
- PDAC
- TGFb
- plasma
- ELISA
- treatment_naive
- serum_to_tumor_bridge
epistemic_basis: literature
study_interpretation: Vizio et al. measured circulating plasma TGF-beta1 in human
  patients with locally advanced or metastatic pancreatic adenocarcinoma before any
  anticancer therapy, using ELISA after transient acidification of plasma samples.
  The extracted observable is the pretreatment plasma total TGF-beta1 concentration,
  reported as a median and range for the full patient cohort. This is a clinical liquid-biopsy
  measurement rather than a tumor-interstitial measurement, so it is mapped to the
  QSP model tumor-compartment species V_T.TGFb through the declared serum-to-tumor
  auxiliary parameter f_serum_to_tumor_TGFb; the observable code converts tumor-compartment
  molar TGF-beta to mass concentration in plasma-equivalent units using the mature
  TGF-beta1 dimer molecular weight.
key_assumptions:
- The ELISA after acidification is interpreted as measuring total TGF-beta1 (latent
  plus active after activation), and the model species V_T.TGFb is treated as assay-comparable
  total TGF-beta for this calibration target.
- The reported sample range for n=62 is modeled as the expected minimum and maximum
  order statistics of a lognormal population; the reported median anchors the lognormal
  median.
- A lognormal distribution is used because cytokine concentrations are positive and
  commonly right-skewed.
- The serum-to-tumor concentration mismatch is represented by the auxiliary parameter
  f_serum_to_tumor_TGFb rather than by a fixed conversion factor.
- The reported ci95 is a reconstructed inter-patient population interval (under a
  lognormal fit to the digitized summary statistics), not a confidence interval on
  the group mean.
- Vizio acidifies plasma before ELISA, so the reported value is total (latent + active)
  TGF-beta1. The QSP species V_T.TGFb represents the bioactive pool. Rather than imposing
  a hard active_fraction = 0.1 conversion (which lacks a citable PDAC-specific quantification),
  the f_serum_to_tumor_TGFb auxiliary parameter is interpreted as bridging serum-total
  to tumor-active concurrently. Its lognormal prior absorbs the compounded uncertainty
  (compartment ratio x active fraction).
- Plasma TGF-beta1 is pre-analytically sensitive to platelet activation, which can
  elevate measured total TGF-beta1 above tumor-derived levels. This contributes to
  the bridging uncertainty already absorbed by the serum_to_tumor auxiliary prior.
key_study_limitations:
- The cohort is locally advanced/metastatic rather than resectable PDAC, so disease
  burden likely differs from the target model context.
- The measurement is plasma, not tumor interstitial fluid or tumor tissue lysate;
  calibration therefore depends on the serum-to-tumor auxiliary bridge.
- Only the median and range are reported for the overall cohort, not SD, SEM, IQR,
  or individual patient values; uncertainty is reconstructed from an order-statistic
  approximation.
- Pancreatic adenocarcinoma is reported clinically; the paper does not repeatedly
  use the term PDAC in every section.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        tgfb_tumor = species_dict['V_T.TGFb']
        f_serum_to_tumor = constants['f_serum_to_tumor_TGFb']
        mw = constants['tgfb1_molecular_weight']
        predicted_plasma_molar = tgfb_tumor * f_serum_to_tumor
        predicted_plasma_mass = predicted_plasma_molar * mw
        return (predicted_plasma_mass) * 0.001

  units: nanogram / milliliter
  species:
  - V_T.TGFb
  constants:
  - name: tgfb1_molecular_weight
    value: 25000.0
    units: gram / mole
    biological_basis: Mature human TGF-beta1 is a disulfide-linked homodimer of approximately
      25 kDa = 25000 g/mol (= 25000 Da). Used in the nM × MW_Da = pg/mL identity;
      the trailing ×0.001 in compute_observable converts pg/mL → ng/mL to match the
      target's declared units. Earlier revisions stored this as 25 kg/mol with a raw
      numeric value of 25, which underestimated the result by 1000× because the code
      multiplies the raw numeric value rather than honoring the declared units.
    source_type: literature
    source_tag: UniProt_TGFB1
  auxiliary_parameters:
  - name: f_serum_to_tumor_TGFb
    group: serum_to_tumor
    units: dimensionless
    biological_basis: 'Bridges human serum/plasma TOTAL TGF-beta1 (acid-activated
      ELISA, Vizio 2024) to the QSP tumor-compartment ACTIVE TGF-beta species V_T.TGFb.
      The auxiliary therefore absorbs both (a) the serum:tumor compartment concentration
      ratio and (b) the total:active fraction. This is the reviewer''s preferred alternative
      to a hard active_fraction=0.1 constant: the lognormal serum_to_tumor prior (mu=0,
      sigma=0.7 in log space) already provides ~factor-of-two uncertainty band, and
      the joint posterior absorbs the residual active-fraction uncertainty without
      a fabricated point estimate. observable.code multiplies V_T.TGFb (active, nM)
      by this factor to predict total serum TGF-beta1 in ng/mL.'
  support: positive
  mapping_rationale: The model species V_T.TGFb is a tumor-compartment molar concentration.
    The source reports plasma TGF-beta1 as a mass concentration. The observable first
    applies the inferred serum:tumor bridge and then converts molar TGF-beta1 to ng/mL
    using the mature dimer molecular weight.
  experimental_denominator: milliliter of peripheral blood plasma
  model_denominator_species:
  - V_T.TGFb
  unmodeled_denominator_components: The model does not explicitly represent a plasma
    TGF-beta compartment for this observable; the serum:tumor auxiliary parameter
    maps tumor-compartment concentration to the plasma-equivalent concentration per
    milliliter.
  aggregation: null
