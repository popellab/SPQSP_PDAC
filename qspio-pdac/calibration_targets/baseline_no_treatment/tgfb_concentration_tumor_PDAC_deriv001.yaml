  assumptions:
  - name: range_order_statistic_quantile
    value: 0.9841269841269841
    units: dimensionless
    description: Approximate quantile represented by the sample maximum for n=62 under
      the expected order-statistic rule n/(n+1); the lower range end is treated symmetrically
      as 1/(n+1).
    rationale: Only median and range were reported. Treating the min and max as expected
      order statistics provides a conservative way to estimate lognormal spread without
      individual patient values.
  distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as\
    \ np\n    from statistics import NormalDist\n    median = inputs['median_tgfb1_plasma']\n\
    \    lower = inputs['range_lower_tgfb1_plasma']\n    upper = inputs['range_upper_tgfb1_plasma']\n\
    \    n = int(inputs['cohort_size'].magnitude)\n    z_order = NormalDist().inv_cdf(n\
    \ / (n + 1.0))\n    sigma_log = np.log(upper.magnitude / lower.magnitude) / (2.0\
    \ * z_order)\n    z95 = NormalDist().inv_cdf(0.975)\n    median_obs = median.to('nanogram\
    \ / milliliter')\n    ci95_lower = (median.magnitude * np.exp(-z95 * sigma_log)\
    \ * median.units).to('nanogram / milliliter')\n    ci95_upper = (median.magnitude\
    \ * np.exp(z95 * sigma_log) * median.units).to('nanogram / milliliter')\n    return\
    \ {\n        'median_obs': median_obs,\n        'ci95_lower': ci95_lower,\n  \
    \      'ci95_upper': ci95_upper,\n    }\n"
