study_interpretation: |
  Ogawa et al. (CCR 2021) performed whole-tissue multiplex fluorescence IHC (ACTA2 + FAP + h-caldesmon) on 215 treatment-naive PDACs from Keio University Hospital. Pixel-by-pixel Naive Bayes classification quantified desmoplastic element proportions. ACTA2-dominant fibroblast proportion was median 30.6% (IQR 24.2-41.1%) and FAP-dominant fibroblast proportion was median 12.1% (IQR 8.2-17.4%) of desmoplastic area. The myCAF fraction is derived as ACTA2-fib / (ACTA2-fib + FAP-fib), ignoring the negligible ACTA2/FAP overlap (median 0.1%).
key_assumptions:
- |
  ACTA2-dominant fibroblasts (alphaSMA-high, h-caldesmon-negative) correspond to model myCAFs. h-caldesmon exclusion removes smooth muscle cell contamination.
- |
  FAP-dominant fibroblasts correspond to model iCAFs (inflammatory, paracrine phenotype).
- |
  The small ACTA2/FAP overlap population (median 0.1% of desmoplastic area) is negligible and excluded from the denominator.
- |
  apCAF (CD74+) is described as "extremely limited in number" and is not included in the denominator. This is consistent with the model where apCAF is a very small fraction of total CAFs.
key_study_limitations:
- |
  Pixel-based classification (Naive Bayes) assigns each pixel to a dominant marker; some FAP-expressing myCAFs may be classified as FAP-dominant and vice versa.
- |
  Proportions are of desmoplastic area, not cell counts. Area-per-cell cancels in the fraction, but cell size differences between ACTA2-dominant and FAP-dominant fibroblasts could introduce mild bias.
- |
  Single-institution cohort (Keio University Hospital, 1991-2016), though n=215 is large.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        mycaf = species_dict['V_T.myCAF']
        total_caf = species_dict['V_T.iCAF'] + species_dict['V_T.myCAF'] + species_dict['V_T.apCAF']
        return (mycaf / total_caf)

  units: dimensionless
  species:
  - V_T.iCAF
  - V_T.myCAF
  - V_T.apCAF
  constants: []
  support: unit_interval
  mapping_rationale: |
    ACTA2-dominant fibroblast fraction of total fibroblasts maps to V_T.myCAF / (V_T.iCAF + V_T.myCAF + V_T.apCAF). alphaSMA is the canonical myCAF marker (Ohlund 2017, Elyada 2019). Paper confirms ACTA2-dominant fibroblasts are juxtacrine to well-differentiated glands and ECM-producing, consistent with myCAF biology. Area cancels in the fraction.
  experimental_denominator: ACTA2-dominant + FAP-dominant fibroblast area (pixel-classified desmoplastic compartment, excluding
    collagen)
  model_denominator_species:
  - V_T.iCAF
  - V_T.myCAF
  - V_T.apCAF
  unmodeled_denominator_components: |
    apCAF (CD74+) fibroblasts not quantified in this paper but described as "extremely limited." Smooth muscle cells excluded by h-caldesmon gating. ACTA2/FAP overlap population (median 0.1%) excluded.
  aggregation: null
