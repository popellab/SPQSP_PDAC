  assumptions:
  - name: n_mc_samples
    value: 100000.0
    units: dimensionless
    description: Number of Monte Carlo samples for uncertainty propagation.
    rationale: 100,000 samples provide stable median and 95% CI estimates.
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np
        rng = np.random.default_rng(42)
        z_q = 0.67448975
        def sample_ln(med, q1, q3, n=100000):
            sigma = np.log(q3.magnitude / max(q1.magnitude, 0.5)) / (2.0 * z_q)
            mu = np.log(med.magnitude)
            return rng.lognormal(mu, sigma, n) * med.units
        acta2 = sample_ln(inputs['acta2_fib_proportion_median'], inputs['acta2_fib_proportion_q1'], inputs['acta2_fib_proportion_q3'])
        fap = sample_ln(inputs['fap_fib_proportion_median'], inputs['fap_fib_proportion_q1'], inputs['fap_fib_proportion_q3'])
        frac = (acta2 / (acta2 + fap)).to('dimensionless')
        return {
            'median_obs': np.median(frac),
            'ci95_lower': np.percentile(frac, 2.5),
            'ci95_upper': np.percentile(frac, 97.5),
        }
