  assumptions:
  - name: n_mc_samples
    value: 200000
    units: dimensionless
    description: Number of Monte Carlo samples used to propagate the digitized mean
      and SEM-derived SD into a lognormal population distribution.
    rationale: Large fixed sample count gives stable percentiles while keeping validation
      execution fast.
  distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as\
    \ np\n    rng = np.random.default_rng(42)\n    mean = inputs['arg1_mean_pdac']\n\
    \    sem = inputs['sem_arg1_pdac']\n    n = inputs['n_pdac'].to('dimensionless').magnitude\n\
    \    n_mc = int(inputs['n_mc_samples'].to('dimensionless').magnitude)\n    sd\
    \ = sem * np.sqrt(n)\n    cv2 = (sd.magnitude / mean.magnitude) ** 2\n    mu_log\
    \ = np.log(mean.magnitude) - 0.5 * np.log(1.0 + cv2)\n    sigma_log = np.sqrt(np.log(1.0\
    \ + cv2))\n    samples = rng.lognormal(mu_log, sigma_log, n_mc) * mean.units\n\
    \    return {\n        'median_obs': np.median(samples),\n        'ci95_lower':\
    \ np.percentile(samples, 2.5),\n        'ci95_upper': np.percentile(samples, 97.5),\n\
    \    }\n"
