      ductal adenocarcinoma patients and reports serum ARG1 for the PDAC group.
    species_source: human
    species_target: human
    source_quality: primary_human_clinical
    perturbation_type: pathological_state
    perturbation_relevance: The serum samples were collected from patients with PDAC
      who were not undergoing therapy at sample collection; the measured ARG1 reflects
