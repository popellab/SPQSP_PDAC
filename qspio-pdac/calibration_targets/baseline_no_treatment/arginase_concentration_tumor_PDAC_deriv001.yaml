- auxiliary_serum_to_tumor
epistemic_basis: literature
study_interpretation: "Can\xE8 et al. measured circulating arginase-1 (ARG1) protein\
  \ in pretreatment serum from patients with pancreatic ductal adenocarcinoma by ELISA\
  \ and compared it with healthy donors. The extracted observable is the PDAC serum\
  \ ARG1 concentration in absolute mass units (ng/mL), which is mapped to the QSP\
  \ model tumor-compartment species V_T.ArgI using the declared serum-to-tumor auxiliary\
  \ parameter f_serum_to_tumor_ArgI. This target therefore constrains the combination\
  \ of tumor ArgI abundance and the inferred systemic/tumor soluble-mediator gradient\
  \ rather than assuming serum and tumor concentrations are identical."
key_assumptions:
- The digitized Fig. 1H PDAC bar height represents the group mean serum ARG1 concentration
  and the upper error-bar tip represents mean plus SEM, as described in the figure
  and extraction notes.
- The reported/digitized SEM was converted to an inter-patient SD using SD = SEM *
  sqrt(n), with n=26 PDAC sera.
- Because ARG1 concentrations are positive and likely right-skewed, the population
  distribution was modeled as lognormal with the digitized mean and SEM-derived SD
  matched on the arithmetic scale.
- Human ARG1 was treated as monomeric ARG1 for mass-to-molar conversion in observable.code;
  the empirical target remains in ng/mL, and molecular weight is used only to convert
  model V_T.ArgI from molarity to mass concentration.
- Serum ARG1 is a compartment-mismatched proxy for tumor-compartment V_T.ArgI and
  is only used because the serum_to_tumor auxiliary parameter group is available and
  explicitly declared.
- The reported ci95 is a reconstructed inter-patient population interval (under a
  lognormal fit to the digitized summary statistics), not a confidence interval on
  the group mean.
- The molecular weight constant (~34.7 kDa) treats V_T.ArgI as monomer-equivalent
  ARG1 protein. If V_T.ArgI is later redefined as catalytically active trimer concentration,
  the conversion changes by ~3x and observable.code must be revisited.
key_study_limitations:
- ARG1 values are digitized from Fig. 1H rather than tabulated, so small graphical
  extraction errors are possible.
- The clinical cohort includes stages IIA/IIB, III, and IV PDAC rather than a purely
  resectable baseline cohort, which may elevate serum ARG1 relative to resectable-only
  disease.
- Serum ARG1 may reflect systemic inflammation and NET-associated ARG1 in addition
  to tumor-compartment MDSC-derived ARG1, so the auxiliary bridge is biologically
  important.
- Only group-level mean and SEM were extracted; individual patient serum ARG1 values
  were not available from the supplied digitization.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        arg1_tumor = species_dict['V_T.ArgI']
        f_serum_to_tumor = constants['f_serum_to_tumor_ArgI']
        mw_arg1 = constants['arg1_molecular_weight']
        predicted_serum_molar = arg1_tumor * f_serum_to_tumor
        predicted_serum_mass = predicted_serum_molar * mw_arg1
        return (predicted_serum_mass) * 0.001

  units: nanogram / milliliter
  species:
  - V_T.ArgI
  constants:
  - name: arg1_molecular_weight
    value: 34735.0
    units: gram / mole
    biological_basis: Human arginase-1 (UniProt P05089 / ARGI1_HUMAN) lists a protein
      mass of 34,735 Da; this is used as 34,735 g/mol to convert molar ARG1 to ng/mL.
    source_type: literature
    source_tag: UniProt_ARG1
  auxiliary_parameters:
  - name: f_serum_to_tumor_ArgI
    group: serum_to_tumor
    units: dimensionless
    biological_basis: Serum:tumor concentration bridge for ARG1. The paper reports
      ARG1 in human serum, whereas the QSP species V_T.ArgI is a tumor-compartment
      concentration; observable.code multiplies V_T.ArgI by this auxiliary factor
      before conversion to ng/mL so inference absorbs the compartment-gradient uncertainty.
  support: positive
  mapping_rationale: The literature measurement is serum ARG1 protein by ELISA. The
    model species is tumor-compartment ArgI concentration in nanomolar units, so the
    observable first applies the inferred serum-to-tumor bridge and then converts
    molar ARG1 to ng/mL using human ARG1 molecular weight.
  experimental_denominator: milliliter of patient serum
  model_denominator_species:
  - V_T.ArgI
  unmodeled_denominator_components: The experimental concentration is normalized by
    serum volume, whereas V_T.ArgI is a tumor-compartment concentration; the f_serum_to_tumor_ArgI
    auxiliary parameter represents this compartment-volume and gradient mismatch.
