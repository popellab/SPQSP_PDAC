epistemic_basis: literature
study_interpretation: Ghassem-Zadeh et al. measured inflammatory cytokines in homogenates of human pancreatic tissue, including pancreatic ductal adenocarcinoma resection specimens, using multiplex cytokine analysis normalized to total protein. The calibration target uses the reported PDAC tissue IL-1β concentration as a direct human PDAC tumor-tissue absolute cytokine measurement, converted from pg/mg total protein to nM tumor concentration using an explicit soluble-protein-density assumption. This is not an ideal isoform match for the model species V_T.IL1, which is annotated as IL-1α, but it provides a human, in vivo, PDAC, resection-based absolute IL-1-family concentration when no primary diagnostic human PDAC IL-1α molarity dataset is available.
key_assumptions:
- IL-1β in human PDAC tissue homogenate is used as a surrogate lower-bound calibration target for V_T.IL1 (model IL-1α); this is a biological isoform mismatch and should be interpreted as an IL-1-family tissue concentration constraint rather than a precise IL-1α measurement.
- Whole-tissue ELISA on homogenized lysate captures the total IL-1 pool (pro-form + intracellular + extracellular secreted), while V_T.IL1 represents only the bioactive extracellular pool. The active/total mismatch is bridged at inference time by the active_fraction_IL1 auxiliary parameter (lognormal, centered on 0.1, σ=0.5), which also absorbs the residual α/β isoform mismatch noted above.
- Conversion from pg/mg total protein to pg/mL tumor assumes 75 mg soluble protein per mL wet tumor tissue, with uncertainty represented by sampling protein density uniformly from 50 to 100 mg/mL.
- IL-1β molecular weight is approximated as 17.5 kDa for conversion from mass concentration to molarity.
- The paper reports median and IQR; a lognormal distribution is assumed for positive cytokine concentrations, with parameters inferred from the median and IQR.
- The reported IQR width is interpreted as Q3-Q1 of a lognormal distribution; sigma_log is recovered analytically via sigma = arcsinh(IQR/(2*median))/z (z=0.6745). This closure is preferred over a subtract-half-IQR construction because the latter forces Q1 negative whenever IQR > 2*median and is then clamped, artificially inflating sigma_log.
key_study_limitations:
- The measured analyte is IL-1β, not IL-1α, whereas the model species V_T.IL1 is described as tumor-derived IL-1α.
- Cytokines are reported normalized to total protein rather than directly per tumor volume, requiring an assumed tissue protein density conversion.
- Small PDAC cohort (n=12) and retrospective tissue-bank context limit population precision.
- Homogenate recovery may underestimate membrane-associated or pericellular IL-1α/IL-1-family activity in the tumor microenvironment.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        # V_T.IL1 is the bioactive extracellular IL-1α pool. The empirical
        # observable is whole-tissue ELISA on homogenized lysate, which
        # captures total IL-1β (pro-form + intracellular + extracellular
        # secreted). Bridge the active/total mismatch through the
        # active_fraction_IL1 auxiliary so the observable comparison is
        # apples-to-apples with the QSP species pool.
        il1_active = species_dict['V_T.IL1']
        active_fraction = constants['active_fraction_IL1']
        return il1_active / active_fraction

  units: nanomolar
  species:
  - V_T.IL1
  constants: []
  support: positive
  auxiliary_parameters:
  - name: active_fraction_IL1
    group: active_fraction
    units: dimensionless
    biological_basis: >
      Bridges total IL-1β measured by tissue-lysate ELISA (pro-IL-1β +
      intracellular + extracellular secreted; Ghassem-Zadeh 2017) to the
      QSP species V_T.IL1, which represents the bioactive extracellular
      IL-1α pool. The active fraction of total IL-1 family in tissue
      lysates is typically 0.05–0.2 depending on assay; the auxiliary
      absorbs this active/total ratio plus any residual α/β isoform
      mismatch. Lognormal prior centered on 0.1 with σ=0.5 covers the
      reported active-fraction range.
  mapping_rationale: The QSP model species V_T.IL1 is already represented as a tumor-compartment molar concentration. The observable scales V_T.IL1 by 1/active_fraction_IL1 to convert the bioactive pool to a total-protein equivalent matching the tissue-lysate ELISA convention. The empirical datum is converted externally from tissue homogenate pg/mg protein to nM tumor concentration.
