epistemic_basis: literature
study_interpretation: Herremans et al. measured IL-10 protein in freshly resected, treatment-naive human PDAC tumor specimens using a 41-plex Millipore/Luminex immunology multiplex assay on tumor homogenates,
  with concentrations normalized to total protein as pg/mg protein. The figure-reported IL-10 distributions for the two machine-learning inflammatory phenotypes were digitized and combined using their reported
  group sizes (immunomodulating N=32, immunostimulating N=27) to represent baseline resectable PDAC tumor IL-10. Because the QSP model state V_T.IL10 is a tumor-compartment concentration in nanomolar, the
  pg/mg-protein homogenate measurement is converted using an assumed effective soluble protein concentration of 10 mg/mL and an IL-10 molecular mass of 18.6 kDa; this maps protein-normalized bulk tumor
  homogenate IL-10 to an approximate molar tissue concentration.
key_assumptions:
- Digitized box-and-whisker values from Figure 2 are treated as five-number summaries for each subtype.
- The two subtype distributions are combined according to their reported sample sizes (N=32 and N=27) to estimate the overall treatment-naive PDAC tumor IL-10 value.
- The bulk tumor homogenate IL-10 signal is assumed to approximate the tumor-compartment IL-10 concentration represented by V_T.IL10; bound/intracellular cytokine and extracellular free cytokine are not
  separated.
- Conversion from pg/mg total protein to concentration uses an assumed effective soluble protein concentration of 10 mg/mL in tumor homogenate. This assumption dominates absolute nM scaling because the
  paper reports normalized protein units but not absolute protein yield per tissue volume.
- Human IL-10 molecular mass is approximated as 18.6 kDa for converting pg/mL to nanomolar.
key_study_limitations:
- IL-10 numerical values were not tabulated and were manually digitized from a box-and-whisker figure, limiting precision.
- The reported unit is pg/mg total protein, not a direct molar concentration in tumor interstitial fluid; conversion to nM depends strongly on assumed protein recovery/homogenate concentration.
- Single-center cohort with 59 resectable, treatment-naive PDAC tumors; results may not generalize to unresectable or metastatic PDAC.
- Bulk homogenate measurements do not identify the cellular source of IL-10 and may include intracellular, stromal, immune, and tumor-cell-associated cytokine pools.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        il10 = species_dict['V_T.IL10']
        return il10

  units: nanomolar
  species:
  - V_T.IL10
  constants: []
  support: positive
  mapping_rationale: The model contains V_T.IL10 as the IL-10 concentration in the tumor compartment. The experimental bulk tumor homogenate IL-10 protein concentration is converted to nanomolar and compared
    directly to this tumor-compartment cytokine concentration.
  experimental_denominator: null
  model_denominator_species: null
  unmodeled_denominator_components: The experimental normalization is per mg total extracted protein from bulk tumor homogenate; the model state has no explicit total-protein denominator. Conversion therefore
    uses an assumed effective protein concentration rather than a modeled denominator.
  aggregation: null
