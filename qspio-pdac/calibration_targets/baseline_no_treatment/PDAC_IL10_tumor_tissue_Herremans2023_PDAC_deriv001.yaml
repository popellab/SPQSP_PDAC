  assumptions:
  - name: protein_density_low
    value: 50
    units: milligram / milliliter
    description: Lower bound for soluble protein content per wet tumor volume used to convert pg/mg protein to pg/mL tissue.
    rationale: PDAC tumor soluble-protein recovery varies by sample and lysis protocol. A 50-100 mg/mL uniform range is used so conversion uncertainty dominates appropriately and matches the Ghassem-Zadeh sibling cytokine targets (IL-1, IL-6, CCL2). Replaces a prior fixed 10 mg/mL assumption that under-shifted the empirical molar median by ~7.5x.
  - name: protein_density_high
    value: 100
    units: milligram / milliliter
    description: Upper bound for soluble protein content per wet tumor volume used to convert pg/mg protein to pg/mL tissue.
    rationale: Brackets plausible wet-tissue protein densities and avoids overconfidence in converting protein-normalized homogenate data to tissue-volume concentration.
  - name: il10_molecular_weight
    value: 18600
    units: g / mol
    description: Approximate molecular mass of human IL-10 monomer used to convert mass concentration to molar concentration.
    rationale: Human IL-10 is approximately 18.6 kDa per monomer.
  - name: n_mc_samples
    value: 100000
    units: dimensionless
    description: Monte Carlo sample count for propagating lognormal cytokine and protein-density uncertainty.
    rationale: Large sample count provides stable percentiles for the derived calibration distribution.
  distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n    rng = np.random.default_rng(42)\n    n_mod = inputs['n_mod'].magnitude\n    n_stim = inputs['n_stim'].magnitude\n    n_total = n_mod + n_stim\n    median_pg_per_mg = ((inputs['mod_median_il10'] * n_mod) + (inputs['stim_median_il10'] * n_stim)) / n_total\n    lower_pg_per_mg = min(inputs['mod_min_il10'], inputs['stim_min_il10'])\n    upper_pg_per_mg = max(inputs['mod_max_il10'], inputs['stim_max_il10'])\n    # Lognormal closure: derive sigma_log from the boxplot range\n    # (treated as approximate 95% span) so the empirical CI95 reflects\n    # both within-cohort spread and the protein-density uncertainty.\n    z95 = 1.959963984540054\n    log_span = np.log(upper_pg_per_mg.to('pg/mg').magnitude) - np.log(lower_pg_per_mg.to('pg/mg').magnitude)\n    sigma_log = log_span / (2.0 * z95)\n    mu_log = np.log(median_pg_per_mg.to('pg/mg').magnitude)\n    n_samples = int(inputs['n_mc_samples'].magnitude)\n    pg_per_mg = rng.lognormal(mu_log, sigma_log, n_samples) * inputs['mod_median_il10'].units\n    protein_low = inputs['protein_density_low'].to('milligram / milliliter')\n    protein_high = inputs['protein_density_high'].to('milligram / milliliter')\n    protein_density = rng.uniform(protein_low.magnitude, protein_high.magnitude, n_samples) * protein_low.units\n    mw = inputs['il10_molecular_weight'].to('gram / mole')\n    mass_conc = (pg_per_mg * protein_density).to('picogram / milliliter')\n    molar = (mass_conc.to('gram / liter') / mw).to('nanomolar')\n    return {\n        'median_obs': np.median(molar),\n        'ci95_lower': np.percentile(molar, 2.5),\n        'ci95_upper': np.percentile(molar, 97.5),\n    }\n"
