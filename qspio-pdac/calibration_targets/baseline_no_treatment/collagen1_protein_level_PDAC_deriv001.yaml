study_interpretation: |
  Xu et al. (2017) used label-free multiphoton microscopy on fresh frozen pancreatic neck margin specimens from 8 patients undergoing pancreaticoduodenectomy for ductal adenocarcinoma in the pancreatic head. Second harmonic generation (SHG) and two-photon excited fluorescence (TPEF) signals were used to visualize collagen fibers and tissue architecture. They quantified the pixel density of collagen (D_collagen = A_collagen / A_total) in regions classified as normal pancreatic tissue versus ductal adenocarcinoma. The mean pixel density was 2.09 ± 0.26 in normal pancreas and 20.85 ± 4.50 in PDAC (n = 8 for each), indicating a roughly 10-fold increase in collagen content in tumor relative to normal tissue. We interpret D_collagen as proportional to collagen (and thus ECM) volume and mass fraction, and use the tumor-to-normal ratio as a calibration target for ECM accumulation in human PDAC. The observable maps model ECM concentration (ECM_level = V_T.ECM/V_T, mg/mL) to an ECM fold-change relative to normal pancreas collagen concentration, using curated reference values for normal collagen content (dry weight, converted to wet-tissue concentration) and pancreatic tissue density.
key_assumptions:
- |
  Collagen pixel density measured by SHG/TPEF (area fraction of collagen in optical sections) is proportional to the 3D collagen volume fraction and, via approximately constant tissue density, to collagen mass fraction in tissue.
- |
  Because collagen I dominates the PDAC desmoplastic stroma, the tumor-to-normal collagen fraction is used as a proxy for total ECM protein fold-change, consistent with the model variable V_T.ECM representing total ECM mass.
- |
  The same 8 resected pancreatic neck margin specimens provide both normal and tumor measurements, so the reported group means (2.09 ± 0.26 vs 20.85 ± 4.50) are treated as paired within-patient summaries, but the Monte Carlo derivation assumes independent normal and tumor distributions due to lack of reported correlation; this slightly overestimates uncertainty in the ratio.
- |
  Reported values are interpreted as mean ± SD based on the Methods statement that all quantitative results are presented as "mean ± SD"; no SEM values are used.
- |
  Both normal and tumor collagen pixel densities are modeled as lognormally distributed positive quantities, which is appropriate for positive, right-skewed structural measurements; using a normal distribution would permit non-physical negative values, even if rare.
- |
  Pancreas tissue density (1.04 g/cm^3) from ICRU soft-tissue data is assumed to apply to normal pancreas when converting collagen mass fraction to volumetric concentration; differences between normal and tumor tissue density are neglected.
- |
  Pancreas dry weight fraction (0.22) is used to convert Imamura 1995 dry-weight collagen content (5 µg/mg dry) to wet-tissue basis (~1.1 µg/mg wet) for comparison with model ECM concentration. This assumes typical pancreas water content of ~78%.
- |
  We assume that neoadjuvant therapy was not systematically applied in this small cohort or that any such treatment did not dramatically alter collagen content at the pancreatic neck margin; the paper does not provide detailed neoadjuvant treatment information, so potential heterogeneity is acknowledged as a limitation.
key_study_limitations:
- |
  Small, single-center cohort (n = 8 patients), limiting generalizability and precision of the ECM fold-change estimate.
- |
  Collagen content is quantified via pixel density in 2D multiphoton images rather than direct biochemical measurement of collagen mass; while proportional, the relationship between pixel density and absolute protein concentration is not explicitly calibrated.
- |
  Normal pancreatic tissue measurements are taken from regions within resected specimens (adjacent normal tissue) rather than from truly disease-free pancreas in healthy donors, so they may partially reflect field effects or early stromal changes.
- |
  Measurements are from pancreatic neck margin tissue in tumors of the pancreatic head; ECM content in other regions of the primary tumor (body/tail, central vs peripheral areas) may differ.
- |
  Neoadjuvant therapy status, fat content, and other clinical characteristics that could affect stromal composition are mentioned as potential modifiers but not detailed for individual specimens, introducing unquantified variability.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        # Collagen volume-fraction fold-change in PDAC tumor relative to normal pancreas
        # phi_collagen = V_T.collagen / (V_T * rho_collagen), dimensionless 0-1
        phi_collagen = species_dict['phi_collagen']  # tumor collagen volume fraction
        rho_collagen = species_dict['rho_collagen']  # collagen packing density (g/mL)

        normal_collagen_dry = constants['normal_pancreas_collagen']  # 5 µg/mg dry = 5e-3 g/g dry
        dry_fraction = constants['pancreas_dry_weight_fraction']  # dry/wet mass ratio
        tissue_density = constants['pancreas_tissue_density']  # g/cm³ = g/mL

        # Normal pancreas collagen concentration (wet tissue basis, g/mL):
        # (µg/mg → g/g) × (g_dry/g_wet) × (g_wet/mL) = g_collagen/mL_wet
        normal_conc = (normal_collagen_dry * 1e-3 * dry_fraction * tissue_density)

        # Normal collagen volume fraction: concentration / packing density
        phi_normal = (normal_conc / rho_collagen)

        fold_change = (phi_collagen / phi_normal)

        return fold_change

  units: dimensionless
  species:
  - phi_collagen
  - rho_collagen
  constants:
  - name: normal_pancreas_collagen
    value: 5.0
    units: microgram / milligram
    biological_basis: |
      From curated reference DB entry 'normal_pancreas_collagen': collagen content of normal human pancreas is 5 micrograms of collagen per milligram of DRY tissue (5 µg/mg dry wt). Imamura 1995 measured hydroxyproline in lyophilized pancreas and converted to collagen. Must be multiplied by dry weight fraction to get wet-tissue basis.
    source_type: reference_db
    reference_db_name: normal_pancreas_collagen
    reference_db_names: null
    source_tag: null
  - name: pancreas_dry_weight_fraction
    value: 0.22
    units: dimensionless
    biological_basis: |
      From curated reference DB entry 'pancreas_dry_weight_fraction': human pancreas is ~75-80% water, giving dry weight fraction ~0.20-0.25. Value of 0.22 from ICRP/Noblet 2018 tissue composition data. Converts dry-weight collagen content to wet-weight basis.
    source_type: reference_db
    reference_db_name: pancreas_dry_weight_fraction
    reference_db_names: null
    source_tag: null
  - name: pancreas_tissue_density
    value: 1.04
    units: gram / centimeter**3
    biological_basis: |
      Pancreas physical density reported as 1.04 g/cm^3 in ICRU soft-tissue data, as summarized in Table 1 of Noblet et al., "A new tissue segmentation method to calculate 3D dose in small animal radiation therapy" (Radiat Oncol 13:32, 2018). Converts collagen mass fraction to volumetric concentration (mg/mL) for comparison with model ECM_level.
    source_type: literature
    reference_db_name: null
    reference_db_names: null
    source_tag: Noblet2018_TissueSegmentation
  support: positive_unbounded
  mapping_rationale: |
    The observable computes the ratio of modeled ECM concentration (ECM_level = V_T.ECM/V_T, mg/mL) to the collagen concentration in normal pancreas. This matches the Xu et al. measurement, which is a ratio of collagen pixel densities (area fractions) — a concentration fold-change, not a total mass fold-change. The previous version incorrectly (1) treated Imamura 1995 dry-weight collagen as wet-weight (5x denominator inflation) and (2) compared total ECM mass to a fixed 10 mL reference volume instead of using concentration.
  experimental_denominator: null
  model_denominator_species: null
  unmodeled_denominator_components: |
    The experimental measurement is based on collagen area fraction (pixel density) in 2D optical sections, whereas the model tracks total ECM mass (collagen plus other ECM components) in a 3D tumor volume. We assume collagen fraction is proportional to total ECM fraction and that section thickness and cellularity are comparable between tumor and normal pancreas, but residual geometric differences are not explicitly modeled.
  aggregation: null
