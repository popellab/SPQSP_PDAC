study_interpretation: |
  From Sivagnanam et al. Table S5, Treg density (14 cells/mm^2) divided by
  functional/differentiated CD4+ T cells (Treg + Th1 + Th2 + Th17 = 25 cells/mm^2)
  gives a Treg fraction of ~56%. Th0 (77 cells/mm^2) is excluded from the denominator
  because the QSP model has no equivalent species for undifferentiated bystander CD4+
  T cells in the tumor — V_T.Th represents antigen-activated effector helpers only.
  Including Th0 would create a systematic denominator mismatch between data and model.
key_assumptions:
- |
  Th0 cells (undifferentiated CD4+) are excluded from the denominator. They represent
  bystander naive/memory CD4+ cells in the tissue with no model equivalent (V_T.Th is
  activated effector Th only). This is a denominator-matching choice, not a biological claim.
- All densities sampled independently from lognormal distributions.
key_study_limitations:
- Independent sampling of 4 densities widens the CI of the derived fraction.
- |
  Excluding Th0 from the denominator is a modeling choice. Alternative interpretations
  (e.g., Th0 as resting but previously activated cells) could justify inclusion.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        treg = species_dict['V_T.Treg']
        th = species_dict['V_T.Th']
        th_exh = species_dict['V_T.Th_exh']
        fraction = (treg / (treg + th + th_exh))
        return fraction

  units: dimensionless
  species:
  - V_T.Treg
  - V_T.Th
  - V_T.Th_exh
  constants: []
  support: unit_interval
  mapping_rationale: |
    Treg / functional CD4+ maps to V_T.Treg / (V_T.Treg + V_T.Th + V_T.Th_exh).
    Th0 excluded from experimental denominator because the model has no bystander CD4+ species.
  experimental_denominator: Functional/differentiated CD4+ T cell density (Treg + Th1 + Th2 + Th17), excluding Th0 bystanders
  model_denominator_species:
  - V_T.Treg
  - V_T.Th
  - V_T.Th_exh
  unmodeled_denominator_components: null
  aggregation: null
