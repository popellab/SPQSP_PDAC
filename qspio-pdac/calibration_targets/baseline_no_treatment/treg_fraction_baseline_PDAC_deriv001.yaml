  assumptions:
  - name: assumed_cv_fraction
    value: 1.0
    units: dimensionless
    description: |
      Assumed coefficient of variation for the Foxp3+/CD3+ ratio used to construct a lognormal distribution around the derived central value.
    rationale: |
      The study reports only median cell densities without any dispersion measure. Published immune cell fractions in solid tumors commonly show coefficients of variation on the order of 50-200%. We assume CV=1.0 (100%) as a conservative estimate. The true CV of the ratio may be lower than for individual densities since both are measured on the same tissue sections (positive covariance reduces ratio variance).
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import math

        foxp3 = inputs['foxp3_density_median']
        cd3 = inputs['cd3_density_median']
        cv = inputs['assumed_cv_fraction']

        # Derive the Foxp3+/CD3+ fraction as point estimate
        ratio = (foxp3 / cd3).to('dimensionless')
        m = ratio.magnitude

        # Lognormal parameters from median and CV
        # CV^2 = exp(sigma^2) - 1  =>  sigma = sqrt(log(1 + CV^2))
        sigma = math.sqrt(math.log(1.0 + cv.magnitude**2))

        # 95% CI for lognormal with given median and sigma
        z = 1.96
        lower = m * math.exp(-z * sigma)
        upper = m * math.exp(z * sigma)

        return {
            'median_obs': ratio,
            'ci95_lower': lower * ureg.dimensionless,
            'ci95_upper': upper * ureg.dimensionless,
        }
