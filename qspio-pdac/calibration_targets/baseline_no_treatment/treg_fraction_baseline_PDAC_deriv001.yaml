study_interpretation: |
  Kiryu et al. (BMC Cancer 2021) analyzed immune-cell infiltrates in the tumor microenvironment of 85 patients with pancreatic ductal adenocarcinoma who underwent R0 surgical resection. Formalin-fixed, paraffin-embedded primary tumor specimens were sectioned at 4 micrometers and stained by single-plex chromogenic immunohistochemistry for CD3, CD4, CD8, PD-1, and Foxp3. The authors report median densities from 10 random tumor fields at 400x: CD3+ = 942.5 cells/mm^2, CD4+ = 153.1 cells/mm^2, CD8+ = 111.2 cells/mm^2, and Foxp3+ = 48.5 cells/mm^2. For calibration, we derive the Foxp3+ fraction among all T cells as Foxp3+/CD3+ = 48.5/942.5 = 0.0515. Using this ratio rather than absolute density avoids the need to estimate tumor tissue area (and its dominant stromal component in PDAC), since the area factor cancels in the ratio. Both densities come from the same cohort and tissue sections, ensuring internal consistency.
key_assumptions:
- |
  The Foxp3+/CD3+ ratio (48.5/942.5 = 0.0515) is derived from paper-reported median densities measured on serial sections from the same cohort. Because both numerator and denominator are expressed as cells/mm^2 of tumor area, the tissue area cancels, eliminating any dependence on stromal fraction or cellularity.
- |
  Foxp3+ cells identified by single-marker IHC are interpreted as regulatory T cells (Tregs), acknowledging that transient Foxp3 expression in activated conventional CD4+ T cells may introduce some contamination but is standard for Treg quantification in FFPE tissues.
- |
  CD3+ cells are taken as a proxy for all T cells in the tumor, mapping to the sum of all T cell species in the model (CD8, Th, Treg, and their exhausted counterparts). CD3 is a pan-T-cell marker expressed on virtually all T cell subsets regardless of functional state.
- |
  Because the study reports only median densities without any dispersion metric (no SD, SEM, or IQR), a coefficient of variation of 1.0 (100%) is assumed for the ratio to construct a lognormal uncertainty distribution. This is a conservative estimate; the true CV of the ratio may be lower since both numerator and denominator are measured on the same sections (positive correlation reduces ratio variance).
- |
  Patients are treated as systemically treatment-naive at the time of tissue sampling because the study does not report any neoadjuvant chemotherapy or radiotherapy; chemotherapy was administered to 80% of patients only upon recurrence after surgery.
key_study_limitations:
- |
  Single-center retrospective cohort from a Japanese institution (n=85), which may limit generalizability to broader PDAC populations and different treatment settings.
- |
  Foxp3+ and CD3+ T cell densities were measured on separate serial sections with single-marker chromogenic IHC, which may introduce section-to-section variability compared to multiplex staining on a single slide.
- |
  The paper reports only median densities without any dispersion measure (no SD, SEM, or IQR for any marker), requiring an assumed coefficient of variation for uncertainty quantification.
- |
  Single-marker Foxp3 IHC cannot fully distinguish suppressive Tregs from transiently Foxp3-expressing effector CD4+ T cells, potentially biasing the estimated Treg fraction upward.
- |
  CD4+ (153.1) + CD8+ (111.2) = 264.3 cells/mm^2 is substantially less than CD3+ (942.5 cells/mm^2), suggesting that single-marker CD4/CD8 IHC underdetects T cell subsets relative to the pan-T-cell CD3 marker. This discrepancy does not affect the Foxp3+/CD3+ ratio but indicates variable staining sensitivity across markers.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        # Fraction of Foxp3+ regulatory T cells among all T cells
        # in the primary tumor compartment (analogous to Foxp3+/CD3+ from IHC).
        treg = species_dict['V_T.Treg']
        cd8 = species_dict['V_T.CD8']
        th = species_dict['V_T.Th']
        cd8_exh = species_dict['V_T.CD8_exh']
        th_exh = species_dict['V_T.Th_exh']

        total_t = treg + cd8 + th + cd8_exh + th_exh
        frac = (treg / total_t)
        return frac

  units: dimensionless
  species:
  - V_T.Treg
  - V_T.CD8
  - V_T.Th
  - V_T.CD8_exh
  - V_T.Th_exh
  constants: []
  support: unit_interval
  mapping_rationale: |
    The paper reports median IHC densities (cells/mm^2) for Foxp3+ and CD3+ T cells on serial 4-um FFPE sections from the same PDAC cohort. Taking the ratio Foxp3+/CD3+ = 48.5/942.5 yields the fraction of Foxp3+ T cells among all T cells, independent of tissue area and stromal fraction. In the QSP model, CD3+ maps to the sum of all T cell species in V_T (CD8, Th, Treg, and exhausted counterparts), so the observable is V_T.Treg / (V_T.Treg + V_T.CD8 + V_T.Th + V_T.CD8_exh + V_T.Th_exh).
  experimental_denominator: CD3+ T cells (pan-T-cell marker, 942.5 cells/mm^2 from same cohort/sections)
  model_denominator_species:
  - V_T.Treg
  - V_T.CD8
  - V_T.Th
  - V_T.CD8_exh
  - V_T.Th_exh
  aggregation: null
