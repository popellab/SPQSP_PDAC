study_interpretation: |
  Liu et al. (2015, Cancer Immunol Immunother) quantified CD8+ T-cell infiltration in
  resected PDAC after pancreatectomy using IHC on whole-section specimens, counting cells
  in at least five independent 400x high-power fields (HPFs) per case. The authors found
  intratumoral CD8 density (mean 16.07 cells/HPF, SD 6.25, median 10.23, range 0-95;
  n=92) was significantly lower than peritumoral CD8 density (36.68 cells/HPF), and that
  high peritumoral CD8 was associated with longer survival. This serves as an independent
  multi-source anchor for cd8_density_baseline alongside Jansen 2021 (TMA, 0.6-mm cores)
  and Golesworthy 2022 (TMA, 1.5-mm cores). Liu's whole-section methodology samples a
  larger and more representative tumor area but reports counts per HPF rather than per
  mm^2, requiring a microscope-field-area conversion to interface with the model.
key_assumptions:
- |
  CD8 IHC detects all CD8+ T cells (effector and exhausted) equivalently; in the QSP
  model this is represented by summing V_T.CD8 and V_T.CD8_exh before converting to
  surface density.
- |
  The +/- value reported (16.07 +/- 6.25 cells/HPF) is treated as a standard deviation,
  not a standard error. Rationale: SD/mean = 6.25/16.07 = 0.39 is biologically plausible
  for HPF counts (typical CV 30-60% for immune cell density at this magnification);
  treating as SEM would imply SD = 6.25*sqrt(92) = 60, giving CV = 3.7, which is
  implausibly high and inconsistent with the reported median (10.23) being only 36%
  below the mean. The paper does not explicitly distinguish SD vs SEM.
- |
  A standard 400x HPF area of 0.2375 mm^2 (Nikon/Olympus field number 22 eyepiece,
  most common modern microscope configuration) is used to convert cells/HPF to cells/mm^2.
  The paper does not specify the field number, introducing a systematic uncertainty of
  approximately +/- 20% in the conversion factor (range 0.196-0.237 mm^2 across common
  field numbers). This conversion uncertainty is small relative to the case-level
  dispersion captured by the SD.
- |
  The intratumoral compartment as defined by Liu 2015 corresponds to the model's V_T;
  the peritumoral compartment (much higher CD8 density) is excluded from this target
  because the QSP model represents a single bulk tumor compartment without explicit
  peri/intra spatial decomposition.
key_study_limitations:
- |
  HPF-based counting introduces a microscope-field-area conversion uncertainty
  (~+/-20%) that whole-area mm^2 measurements (Jansen, Golesworthy) avoid; the field
  number used by Liu et al. is not reported in the methods.
- |
  Counts averaged over "at least five HPFs per case" may under-sample tumor
  heterogeneity compared to whole-section quantification.
- |
  Only group-wise summary statistics (mean, SD, median, range) are reported; the
  patient-level distribution is reconstructed via lognormal Monte Carlo from the mean
  and SD, with the reported median (10.23) used as a sanity check.
- |
  CD8+ T-cell density is measured in 2D histologic sections (cells/mm^2 after
  conversion), whereas the model represents a 3D tumor compartment; Abercrombie
  correction (cell_diameter_um = 7) is applied identically to other cd8_density targets.
- |
  Cohort patients underwent pancreatectomy with no neoadjuvant therapy reported;
  treatment-naive baseline status is assumed but not explicitly verified.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        """mIHC-equivalent CD8 density via V_T-based 3D->2D projection.

        Identical to cd8_density_baseline_PDAC_deriv001 (Jansen 2021): sums effector
        and exhausted CD8 T cells, divides by V_T, and scales by section thickness
        plus cell diameter (Abercrombie correction).
        """
        cd8_eff = species_dict['V_T.CD8']
        cd8_exh = species_dict['V_T.CD8_exh']
        V_T = species_dict['V_T']
        thickness = constants['section_thickness_um']
        cell_diameter = constants['cell_diameter_um']
        density = (cd8_eff + cd8_exh) / V_T * (thickness + cell_diameter)
        return (density) * 1e-06

  units: cell / millimeter**2
  species:
  - V_T.CD8
  - V_T.CD8_exh
  - V_T
  constants:
  - name: section_thickness_um
    value: 4.0
    units: micrometer
    biological_basis: |
      Standard FFPE tissue section thickness for IHC (typical 3-5 micrometer); 4 micrometer
      matches the convention used for cd8_density_baseline_PDAC_deriv001.
    source_type: reference_db
    reference_db_name: ffpe_section_thickness
    reference_db_names: null
    source_tag: null
  - name: cell_diameter_um
    value: 7.0
    units: micrometer
    biological_basis: |
      Resting T lymphocyte diameter ~7 micrometer (Bufi 2015). Abercrombie overcounting
      term in 2D->3D projection.
    source_type: reference_db
    reference_db_name: t_cell_diameter
    reference_db_names: null
    source_tag: null
  support: positive
  mapping_rationale: |
    CD8 IHC detects all CD8+ T cells regardless of functional or exhaustion state. The
    observable sums (V_T.CD8 + V_T.CD8_exh) and uses V_T-based projection to match the
    cells/mm^2 of section convention used in Jansen 2021 and Golesworthy 2022; Liu 2015's
    cells/HPF measurements are converted to cells/mm^2 in distribution_code via the standard
    400x HPF area.
  experimental_denominator: mm^2 of intratumoral whole-section area (after HPF->mm^2 conversion)
  model_denominator_species:
  - V_T
  aggregation: null
