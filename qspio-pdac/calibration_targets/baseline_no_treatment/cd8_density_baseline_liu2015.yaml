  assumptions:
  - name: n_mc_samples
    value: 100000.0
    units: dimensionless
    description: |
      Number of Monte Carlo samples used to derive the patient-level distribution.
    rationale: |
      100,000 samples provide stable estimates of the median and 95% CI while remaining
      computationally inexpensive.
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np

        rng = np.random.default_rng(44)

        mean_hpf = inputs['mean_cd8_per_hpf'].magnitude  # cells/HPF
        sd_hpf = inputs['sd_cd8_per_hpf'].magnitude      # cells/HPF (SD, not SEM)
        hpf_area = inputs['hpf_area_mm2'].magnitude      # mm^2 per HPF
        out_units = ureg('cell / millimeter**2')
        n_mc = 100000

        # Lognormal moment matching for cells/HPF
        mu2 = mean_hpf**2
        s2 = sd_hpf**2
        mu_log = np.log(mu2 / np.sqrt(mu2 + s2))
        sigma_log = np.sqrt(np.log(1 + s2 / mu2))

        samples_hpf = rng.lognormal(mu_log, sigma_log, n_mc)

        # Convert cells/HPF -> cells/mm^2 (linear scaling preserves lognormal shape)
        samples = (samples_hpf / hpf_area) * out_units

        median_obs = np.median(samples)
        ci95_lower = np.percentile(samples, 2.5)
        ci95_upper = np.percentile(samples, 97.5)

        return {
            'median_obs': median_obs,
            'ci95_lower': ci95_lower,
            'ci95_upper': ci95_upper,
        }
