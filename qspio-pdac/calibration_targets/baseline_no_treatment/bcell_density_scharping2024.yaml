study_interpretation: |
  Scharping et al. (2024, Frontiers in Immunology) analyzed 58 resected PDAC tumors
  using a 7-color multiplex immunohistochemistry (mIHC) panel that included CD20 to
  quantify B cell infiltration. Intratumoral stromal CD20+ B cell density (cells/mm^2),
  excluding tertiary lymphoid structures (TLS), was reported as a median across the
  full cohort (n=58, mixed treatment-naive and neoadjuvant-treated). The treatment-naive
  subgroup (primary resection, n=28) showed higher whole-tissue CD20+ density (median
  54.8 cells/mm^2) than the neoadjuvant-treated subgroup (17.84 cells/mm^2), but the
  intratumoral stromal breakdown by treatment status was not separately reported.
  The intratumoral stromal (excl TLS) compartment is the closest match to the QSP model's
  dispersed B cell population, which does not represent organized lymphoid aggregates.
key_assumptions:
- |
  CD20 marks all non-plasma B cells (naive, activated, memory, regulatory) equivalently.
  In the QSP model this maps to V_T.nB + V_T.aB + V_T.nBreg + V_T.aBreg. Plasma cells
  (CD20-negative) are excluded from both the IHC measurement and the model readout.
- |
  The intratumoral stromal compartment (excluding TLS) best matches the QSP model's
  dispersed B cell population. TLS-associated B cells are organized lymphoid structures
  not represented in the current model.
- |
  The 95% CI was estimated from the reported median (10.8 cells/mm^2) using the
  inter-patient variability pattern observed in comparable immune cell density targets
  (cd8_density, treg_density, cd4_helper_density), which span approximately 2 log-decades
  from 2.5th to 97.5th percentile. B cells are known to be highly variable across
  PDAC patients, supporting a similar spread.
- |
  The full-cohort intratumoral value (n=58) is used rather than the treatment-naive
  subgroup because the intratumoral stromal density was not reported by treatment status.
  The treatment-naive subgroup likely has higher intratumoral density.
key_study_limitations:
- |
  Only median values were reported (no IQR, SD, or individual patient data in the main
  text). The 95% CI is estimated from comparable immune density distributions, not
  directly measured.
- |
  The cohort includes both treatment-naive (n=28) and neoadjuvant-treated (n=30) patients.
  Neoadjuvant chemotherapy significantly suppresses B cell density (NeoTx whole-tissue
  median 17.84 vs PR 54.8 cells/mm^2), so the combined-cohort intratumoral value
  underestimates treatment-naive B cell density.
- |
  Supplementary data (DataSheet_1.zip) may contain individual patient values but was
  not accessible for this extraction.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        """mIHC-equivalent CD20+ B cell density via V_T-based 3D->2D projection.

        Sums naive and activated B cells (including Breg-switched), divides
        by V_T, and scales by section thickness to project the 3D volumetric
        density into a 2D mIHC density (cells/mm^2 of section).
        """
        nB = species_dict['V_T.nB']
        aB = species_dict['V_T.aB']
        nBreg = species_dict['V_T.nBreg']
        aBreg = species_dict['V_T.aBreg']
        V_T = species_dict['V_T']
        thickness = constants['section_thickness_um']
        cell_diameter = constants['cell_diameter_um']
        density = (nB + aB + nBreg + aBreg) / V_T * (thickness + cell_diameter)
        return density * 1e-06

  units: cell / millimeter**2
  species:
  - V_T.nB
  - V_T.aB
  - V_T.nBreg
  - V_T.aBreg
  - V_T
  constants:
  - name: section_thickness_um
    value: 4.0
    units: micrometer
    biological_basis: |
      Standard FFPE tissue section thickness for mIHC quantification (typical 3-5 micrometer).
    source_type: reference_db
    reference_db_name: ffpe_section_thickness
    reference_db_names: null
    source_tag: null
  - name: cell_diameter_um
    value: 8.0
    units: micrometer
    biological_basis: |
      Resting B lymphocyte diameter ~7-10 micrometer. Slightly larger than T cells (7 um)
      due to higher cytoplasm:nucleus ratio. Used as Abercrombie overcounting correction
      term in the 2D->3D projection.
    source_type: reference_db
    reference_db_name: b_cell_diameter
    reference_db_names: null
    source_tag: null
  support: positive
  mapping_rationale: |
    CD20 IHC detects all non-plasma B cells regardless of activation or regulatory state.
    The observable sums (V_T.nB + V_T.aB + V_T.nBreg + V_T.aBreg) and uses V_T-based
    projection (cells / V_T * (thickness + diameter)) to match the cells/mm^2 convention
    used in Scharping 2024. Plasma cells are excluded from both measurement and readout.
  experimental_denominator: mm^2 of tumor tissue section (intratumoral stromal, excluding TLS)
  model_denominator_species:
  - V_T
  aggregation: null
