    description: |
      The 95% CI (1.5 - 80.0 cells/mm^2) was estimated from the median using the
      inter-patient variability pattern observed in comparable PDAC immune cell density
      targets. The spread (~2 log-decades from 2.5th to 97.5th percentile) is consistent
      with cd4_helper_density (2.44 - 193.85), treg_density (1.26 - 155.43), and
      tam_density (27.57 - 635.56) distributions. No IQR or SD was reported in the paper.
    rationale: |
      Without individual-patient data or reported dispersion metrics, the spread was
      estimated by analogy to comparable immune cell density distributions in the corpus.
