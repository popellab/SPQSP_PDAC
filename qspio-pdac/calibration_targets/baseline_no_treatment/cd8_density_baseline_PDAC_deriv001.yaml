  assumptions:
  - name: n_mc_samples
    value: 100000.0
    units: dimensionless
    description: |
      Number of Monte Carlo samples used to approximate the distribution of intratumoral CD8+ T-cell density from groupwise mean and dispersion values in Table 4.
    rationale: |
      100,000 samples provide stable estimates of the median and 95% confidence interval while remaining computationally inexpensive.
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np

        rng = np.random.default_rng(42)

        # Means and SEMs for CD8+ T-cell density (cells/mm^2)
        # in ductal adenocarcinomas, stratified by DOG1 expression in stromal cells.
        mean_neg = inputs['mean_cd8_stroma_neg']      # Quantity
        sem_neg = inputs['sem_cd8_stroma_neg']        # Quantity (SEM, not SD)
        n_neg = int(inputs['n_stroma_neg'].magnitude)

        mean_pos = inputs['mean_cd8_stroma_pos']      # Quantity
        sem_pos = inputs['sem_cd8_stroma_pos']        # Quantity (SEM, not SD)
        n_pos = int(inputs['n_stroma_pos'].magnitude)

        # Convert SEM to SD: SD = SEM * sqrt(n)
        sd_neg = sem_neg * np.sqrt(n_neg)
        sd_pos = sem_pos * np.sqrt(n_pos)

        total_n = n_neg + n_pos
        units = mean_neg.units

        # Monte Carlo sample size (dimensionless modeling choice)
        n_mc = 100000

        # Allocate samples across groups according to their sample size
        n_mc_neg = int(round(n_mc * n_neg / total_n))
        n_mc_pos = n_mc - n_mc_neg

        # Use lognormal sampling (CD8 density is strictly positive and right-skewed).
        # Convert normal(mean, sd) to lognormal parameters for each group.
        def normal_to_lognormal_params(mean_val, sd_val):
            mu2 = mean_val**2
            s2 = sd_val**2
            mu_log = np.log(mu2 / np.sqrt(mu2 + s2))
            sigma_log = np.sqrt(np.log(1 + s2 / mu2))
            return mu_log, sigma_log

        mu_log_neg, sigma_log_neg = normal_to_lognormal_params(
            mean_neg.magnitude, sd_neg.magnitude
        )
        mu_log_pos, sigma_log_pos = normal_to_lognormal_params(
            mean_pos.magnitude, sd_pos.magnitude
        )

        # Sample from lognormal distributions, reattach units immediately.
        samples_neg = rng.lognormal(mu_log_neg, sigma_log_neg, n_mc_neg) * units
        samples_pos = rng.lognormal(mu_log_pos, sigma_log_pos, n_mc_pos) * units

        # Combine groups into a single patient-level distribution
        samples = np.concatenate([samples_neg.magnitude, samples_pos.magnitude]) * units

        # np.median and np.percentile preserve Pint units
        median_obs = np.median(samples)
        ci95_lower = np.percentile(samples, 2.5)
        ci95_upper = np.percentile(samples, 97.5)

        return {
            'median_obs': median_obs,
            'ci95_lower': ci95_lower,
            'ci95_upper': ci95_upper,
        }
