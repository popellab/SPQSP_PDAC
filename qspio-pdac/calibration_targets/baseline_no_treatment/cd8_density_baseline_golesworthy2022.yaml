study_interpretation: |
  Golesworthy et al. (2022, Front Oncol) compared CD8+ T-cell intratumoral density between
  homologous-recombination-deficient (HR-d) and HR/MMR-intact pancreatic ductal adenocarcinomas
  using multiplex immunofluorescence on tissue microarrays. The HR/MMR-intact cohort (n=166)
  represents the standard PDAC immune phenotype (HR-d cases comprise ~5-15% of PDAC and have
  distinct, higher CD8 infiltration; they are excluded here). Each case was represented by
  multiple 1.5-mm tumor cores (QPCS series: three cores; PanCuRx series: at least two cores),
  with immune cells normalized to total area of tumor clusters (cells/mm^2). This serves as
  an independent multi-source anchor for cd8_density_baseline alongside Jansen 2021 (which
  uses smaller 0.6-mm TMA cores) and Liu 2015 (HPF-based whole-section counting).
key_assumptions:
- |
  CD8 multiplex IF detects all CD8+ T cells (effector and exhausted) equivalently; in the
  QSP model this is represented by summing V_T.CD8 and V_T.CD8_exh before converting to
  surface density.
- |
  The +/- value reported (40.5 +/- 50.9 cells/mm^2) is treated as a standard deviation,
  consistent with how the paper reports between-case dispersion. SD/mean = 50.9/40.5 = 1.26,
  matching the high-CV pattern of immune cell densities in PDAC (CV ~50-200% typical).
- |
  HR/MMR-intact cases (n=166) represent standard PDAC and are the appropriate cohort for
  the baseline_no_treatment scenario; the HR-deficient subset (n=25) is a rare biology with
  enhanced CD8 infiltration and is excluded from this target.
- |
  1.5-mm cores capture more tumor heterogeneity than 0.6-mm cores (Jansen 2021), reducing
  hot-region bias; results from this cohort are expected to track the true tumor-wide
  central tendency more faithfully.
key_study_limitations:
- |
  CD8+ T-cell densities are derived from 1.5-mm tissue microarray cores rather than
  whole-slide sections; spatial heterogeneity within individual tumors may not be fully
  captured even at this larger core size.
- |
  Only group-wise summary statistics (mean +/- SD and sample size) are available; the
  patient-level distribution is reconstructed via lognormal Monte Carlo from these
  summary statistics rather than from individual-patient raw data.
- |
  CD8+ T-cell density is measured in 2D histologic sections (cells/mm^2), whereas the
  model represents a 3D tumor compartment; conversion using cross-sectional area and
  cellularity assumes approximate spherical cells and homogeneous packing.
- |
  Cohort details (treatment status, neoadjuvant exposure, stage distribution) are not
  fully reported for the HR/MMR-intact subset; assumed treatment-naive surgical resections
  consistent with PDAC clinical norms in the QPCS/PanCuRx programs.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        """mIHC-equivalent CD8 density via V_T-based 3D->2D projection.

        Identical to cd8_density_baseline_PDAC_deriv001 (Jansen 2021): sums effector
        and exhausted CD8 T cells, divides by V_T, and scales by section thickness
        plus cell diameter (Abercrombie correction).
        """
        cd8_eff = species_dict['V_T.CD8']
        cd8_exh = species_dict['V_T.CD8_exh']
        V_T = species_dict['V_T']
        thickness = constants['section_thickness_um']
        cell_diameter = constants['cell_diameter_um']
        density = (cd8_eff + cd8_exh) / V_T * (thickness + cell_diameter)
        return (density) * 1e-06

  units: cell / millimeter**2
  species:
  - V_T.CD8
  - V_T.CD8_exh
  - V_T
  constants:
  - name: section_thickness_um
    value: 4.0
    units: micrometer
    biological_basis: |
      Standard FFPE tissue section thickness for IHC quantification (typical 3-5 micrometer);
      4 micrometer matches the convention used for cd8_density_baseline_PDAC_deriv001.
    source_type: reference_db
    reference_db_name: ffpe_section_thickness
    reference_db_names: null
    source_tag: null
  - name: cell_diameter_um
    value: 7.0
    units: micrometer
    biological_basis: |
      Resting T lymphocyte diameter ~7 micrometer (Bufi 2015). Abercrombie overcounting
      term in 2D->3D projection; matches convention used for cd8_density_baseline_PDAC_deriv001.
    source_type: reference_db
    reference_db_name: t_cell_diameter
    reference_db_names: null
    source_tag: null
  support: positive
  mapping_rationale: |
    CD8 multiplex IF detects all CD8+ T cells regardless of functional or exhaustion state.
    The observable sums (V_T.CD8 + V_T.CD8_exh) and uses V_T-based projection
    (cells / V_T * (thickness + cell_diameter)) to match the cells/mm^2 of section
    convention used in Golesworthy 2022 and the existing Jansen 2021 target.
  experimental_denominator: mm^2 of tumor clusters within 1.5-mm TMA cores
  model_denominator_species:
  - V_T
  aggregation: null
