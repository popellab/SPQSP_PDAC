scenario:
  description: |
    Baseline primary PDAC tumors resected by pancreatectomy without modeled prior systemic
    or radiation therapy; tissue collected from QPCS/PanCuRx programs and processed into
    tissue microarrays for multiplex immunofluorescence.
  interventions:
  - intervention_description: |
      No experimental therapeutic intervention modeled prior to surgical resection; tumors
      progress under natural disease course until pancreatectomy, after which resected tumor
      tissue is analyzed by multiplex immunofluorescence.
