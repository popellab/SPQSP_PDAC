      via PMC/Frontiers HTML access.
  - name: sd_cd8_intratumoral
    value: 50.9
    units: cell / millimeter**2
    description: |
      Standard deviation of intratumoral CD8+ T-cell density in HR/MMR-intact PDAC cases.
      Treated as SD (not SEM) because the SD/mean ratio of 1.26 is characteristic of
      between-case heterogeneity in immune infiltrate measurements (typical CV 50-200%).
    source_ref: Golesworthy2022_HRD_PDAC
    value_location: |
      Results section, same sentence as mean.
    value_snippet: |
      HR-d tumors had a higher CD8+ T-cell intra-tumoral density compared to the HR/MMR-intact
      group (131.1 +/- 154.9 cells/mm^2 versus 40.5 +/- 50.9 cells/mm^2, p<0.0001).
    input_type: direct_parameter
    conversion_formula: null
    source_type: text
    figure_id: null
    extraction_method: manual
    extraction_notes: null
    dispersion_type: sd
    dispersion_type_rationale: |
      Treated as SD because (a) reported as case-level dispersion in HR-d vs HR-intact comparison
      where between-case spread is the natural metric, and (b) SD/mean = 1.26 is consistent with
      typical CV (50-200%) for immune cell density measurements in heterogeneous tumor cohorts;
      treating it as SEM would imply CV = SEM*sqrt(n)/mean = 50.9*sqrt(166)/40.5 ≈ 16, which is
      implausibly high and would invert the comparison with the HR-d group's dispersion pattern.
  - name: n_cases
    value: 166.0
    units: dimensionless
    description: |
      Number of HR/MMR-intact PDAC cases contributing to the intratumoral CD8 density estimate.
    source_ref: Golesworthy2022_HRD_PDAC
    value_location: |
      Results section, sample size context for HR/MMR-intact cohort.
    value_snippet: |
      n=166 HR/MMR-intact cases
    input_type: direct_parameter
    conversion_formula: null
    source_type: text
    figure_id: null
    extraction_method: manual
    extraction_notes: null
  assumptions:
  - name: n_mc_samples
    value: 100000.0
    units: dimensionless
    description: |
      Number of Monte Carlo samples used to derive the patient-level distribution from the
      reported mean and SD via lognormal moment matching.
    rationale: |
      100,000 samples provide stable estimates of the median and 95% CI while remaining
      computationally inexpensive.
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np

        rng = np.random.default_rng(43)

        mean_val = inputs['mean_cd8_intratumoral']  # Quantity, cell/mm^2
        sd_val = inputs['sd_cd8_intratumoral']      # Quantity, cell/mm^2 (SD, not SEM)

        units = mean_val.units
        n_mc = 100000

        # Lognormal moment matching for strictly positive, right-skewed cell density
        mu2 = mean_val.magnitude**2
        s2 = sd_val.magnitude**2
        mu_log = np.log(mu2 / np.sqrt(mu2 + s2))
        sigma_log = np.sqrt(np.log(1 + s2 / mu2))

        samples = rng.lognormal(mu_log, sigma_log, n_mc) * units

        median_obs = np.median(samples)
        ci95_lower = np.percentile(samples, 2.5)
        ci95_upper = np.percentile(samples, 97.5)

        return {
            'median_obs': median_obs,
            'ci95_lower': ci95_lower,
            'ci95_upper': ci95_upper,
        }
