study_interpretation: |
  Sivagnanam et al. (Cancer Discovery 2021) reported CD163+ and CD163- monocyte/macrophage densities in Tumor regions of 113 treatment-naive PDAC resections (Table S5). CD163+ (61 cells/mm^2) maps to M2-polarized and CD163- (39 cells/mm^2) to M1-like macrophages. Total TAM density is their sum.
key_assumptions:
- CD163+ monocyte/macrophages correspond to V_T.Mac_M2 and CD163- to V_T.Mac_M1.
- |
  CD163+ and CD163- densities are sampled independently due to lack of within-patient correlation data, which may widen the CI of the sum.
key_study_limitations:
- |
  CD163-negative monocyte/macrophages include monocytes and unpolarized macrophages, not just M1.
- Independent sampling of CD163+ and CD163- ignores within-patient correlation.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        """mIHC-equivalent TAM density via V_T-based 3D->2D projection.

        Matches the submodel target convention: (cells / V_T) * section_thickness.
        """
        m1 = species_dict['V_T.Mac_M1']
        m2 = species_dict['V_T.Mac_M2']
        V_T = species_dict['V_T']
        thickness = constants['section_thickness_um']
        cell_diameter = constants['cell_diameter_um']  # Abercrombie correction term
        density = (m1 + m2) / V_T * (thickness + cell_diameter)
        return (density) * 1e-06

  units: cell / millimeter**2
  species:
  - V_T.Mac_M1
  - V_T.Mac_M2
  - V_T
  constants:
  - name: section_thickness_um
    value: 4.0
    units: micrometer
    biological_basis: |
      Standard FFPE tissue section thickness for mIHC quantification (typical 3-5 micrometer).
      Set to 4 micrometer to match the Plesca2022 submodel target convention used for APC0 calibration.
    source_type: reference_db
    reference_db_name: ffpe_section_thickness
    reference_db_names: null
    source_tag: null
  - name: cell_diameter_um
    value: 20.0
    units: micrometer
    biological_basis: |
      Tissue macrophage diameter ~20 micrometer (Krombach 1997). Used as Abercrombie overcounting term `d` in the 2D->3D projection: counted_cells/mm^2 = (cells/V_T) * (t + d). For TAMs (M1+M2) the diameter is large relative to FFPE thickness, making this correction sizable (~6x).
    source_type: reference_db
    reference_db_name: macrophage_diameter
    reference_db_names: null
    source_tag: null
  support: positive
  mapping_rationale: |
    Total TAM density = (V_T.Mac_M1 + V_T.Mac_M2) / V_T * thickness, projecting the
    3D volumetric density into a 2D mIHC section. Matches Sivagnanam's reporting of
    cells/mm^2 of whole tumor area and is consistent with the submodel target
    forward model convention. CD163+ maps to M2, CD163- to M1.
  experimental_denominator: mm^2 of tumor tissue section
  model_denominator_species:
  - V_T
  unmodeled_denominator_components: null
  aggregation: null
