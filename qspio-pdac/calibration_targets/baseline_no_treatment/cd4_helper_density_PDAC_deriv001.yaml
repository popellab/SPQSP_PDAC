  assumptions:
  - name: n_mc_samples
    value: 100000.0
    units: dimensionless
    description: Number of Monte Carlo samples for uncertainty propagation.
    rationale: 100,000 samples provide stable median and 95% CI estimates.
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np
        rng = np.random.default_rng(42)
        z_q = 0.67448975
        def sample_ln(med, q1, q3, n=100000):
            sigma = np.log(q3.magnitude / max(q1.magnitude, 0.5)) / (2.0 * z_q)
            mu = np.log(med.magnitude)
            return rng.lognormal(mu, sigma, n) * med.units
        # Th0 excluded: bystander CD4+ with no model equivalent (V_T.Th = activated effectors only)
        th1 = sample_ln(inputs['th1_density_median'], inputs['th1_density_q1'], inputs['th1_density_q3'])
        th2 = sample_ln(inputs['th2_density_median'], inputs['th2_density_q1'], inputs['th2_density_q3'])
        th17 = sample_ln(inputs['th17_density_median'], inputs['th17_density_q1'], inputs['th17_density_q3'])
        total = th1 + th2 + th17
        return {
            'median_obs': np.median(total),
            'ci95_lower': np.percentile(total, 2.5),
            'ci95_upper': np.percentile(total, 97.5),
        }
