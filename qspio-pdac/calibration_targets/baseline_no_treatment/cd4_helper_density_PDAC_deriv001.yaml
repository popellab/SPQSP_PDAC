study_interpretation: |
  Sivagnanam et al. Table S5 reports densities of T helper subtypes separately. Th0
  (77 cells/mm^2) is excluded because it represents undifferentiated bystander CD4+ cells
  with no model equivalent — V_T.Th represents antigen-activated effector helpers only.
  Functional Th density = Th1 (3) + Th2 (7) + Th17 (1) ≈ 11 cells/mm^2.
key_assumptions:
- |
  Th0 excluded from sum. V_T.Th + V_T.Th_exh maps to functional/differentiated Th subtypes
  (Th1 + Th2 + Th17), not the undifferentiated Th0 bystander pool.
- Th subtypes are sampled independently from lognormal distributions and summed.
key_study_limitations:
- |
  Th17 has Q1=0 in Table S5; a floor of 0.5 cells/mm^2 was used for lognormal parameterization.
- Some CD4+ T cells may not fit cleanly into Th0/1/2/17 categories.
- |
  Excluding Th0 is a modeling choice based on the absence of a bystander CD4+ species.
  Alternative model structures with a Th0 pool would include it.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        """mIHC-equivalent CD4 helper density via V_T-based 3D->2D projection."""
        th = species_dict['V_T.Th']
        th_exh = species_dict['V_T.Th_exh']
        V_T = species_dict['V_T']
        thickness = constants['section_thickness_um']
        cell_diameter = constants['cell_diameter_um']  # Abercrombie correction term
        density = (th + th_exh) / V_T * (thickness + cell_diameter)
        return (density) * 1e-06

  units: cell / millimeter**2
  species:
  - V_T.Th
  - V_T.Th_exh
  - V_T
  constants:
  - name: section_thickness_um
    value: 4.0
    units: micrometer
    biological_basis: |
      Standard FFPE tissue section thickness for mIHC quantification (typical 3-5 micrometer).
      Set to 4 micrometer to match the Plesca2022 submodel target convention used for APC0 calibration.
    source_type: reference_db
    reference_db_name: ffpe_section_thickness
    reference_db_names: null
    source_tag: null
  - name: cell_diameter_um
    value: 7.0
    units: micrometer
    biological_basis: |
      Resting T lymphocyte diameter ~7 micrometer (Bufi 2015). Used as Abercrombie overcounting term `d` in the 2D->3D projection: counted_cells/mm^2 = (cells/V_T) * (t + d).
    source_type: reference_db
    reference_db_name: t_cell_diameter
    reference_db_names: null
    source_tag: null
  support: positive
  mapping_rationale: |
    Sum of functional Th subtypes (Th1+Th2+Th17, excluding Th0 bystanders) projected
    from 3D V_T density to 2D mIHC section via section_thickness scaling.
    Maps experimental Th1+Th2+Th17 sum to (V_T.Th + V_T.Th_exh) / V_T * thickness.
  experimental_denominator: mm^2 of tumor tissue section
  model_denominator_species:
  - V_T
  unmodeled_denominator_components: null
  aggregation: null
