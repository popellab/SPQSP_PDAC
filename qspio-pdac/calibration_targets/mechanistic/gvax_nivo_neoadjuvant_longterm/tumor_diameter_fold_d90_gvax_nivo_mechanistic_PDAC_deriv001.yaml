study_interpretation: "Mechanistic-prior cal target on the continuous diameter fold-change\
  \ at d90 for the GVAX+nivolumab combination long-horizon scenario gvax_nivo_neoadjuvant_longterm.\
  \ Directional sibling of tumor_diameter_fold_d90_untreated and ..._gvax_mechanistic:\
  \ checkpoint blockade adds incremental T-cell activity on top of GVAX priming,\
  \ so treated d90 fold should be at most comparable to GVAX monotherapy and may\
  \ admit modest regression in responders. PDAC's cold TME limits the magnitude\
  \ of expected benefit; CI95 deliberately wide to admit both responder and non-responder\
  \ realizations. Replaces the deferred treated-RECIST-ORR cal targets per the qual→cal\
  \ migration plan."
key_assumptions:
- 'Mechanistic prior: no PDAC trial reports neoadjuvant GVAX+nivo d90 RECIST in a
  population matching the simulator scenario (resectable, treatment-naive, no chemo
  backbone). Heumann 2023 reports DFS/OS for GVAX+nivo arms but with surgery + adjuvant
  FFX confounders; Le 2015 GVAX-CRS-207 with metastatic disease has reported ORR
  ~0%.'
- 'Median 1.00 chosen mildly below GVAX-only 1.05 to encode the directional claim
  "checkpoint blockade adds incremental benefit beyond GVAX priming". CI95 [0.75,
  1.30] is wider than untreated to admit responder realizations (PR-equivalent
  ratios down to 0.75) while preserving most of the non-responder mass that PDAC''s
  cold TME makes the modal outcome.'
- 'Distribution: lognormal on the ratio d(90)/d(0), dimensionless. Geometric mean
  ≈ 0.99. CI95 width chosen to dominate over upstream-target propagation uncertainty
  so this target acts as a sanity rail rather than a likelihood driver.'
- This target encodes a directional within-scenario invariant rather than a population
  estimate. Audit outputs should be read as "is the treated trajectory mechanistically
  in the right neighborhood?" not "does the model match a specific cohort?".
key_study_limitations:
- 'No primary literature anchor for the simulator scenario (resectable + GVAX+nivo
  + no chemo backbone) at d90. Available trial data has surgery / chemo confounders
  (Heumann 2023) or population mismatch (Le 2015 metastatic).'
- "Death/censoring (V_T.C1 ≥ 1e11) returns NaN; for d90 in this scenario this\
  \ is rare (death threshold typically fires later) but the cal target is only evaluated\
  \ on surviving simulations."
- The CI95 width is deliberately wide (±~30% multiplicative) so this target acts
  as a directional sanity rail, not a tight likelihood driver.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        import math
        from typing import Mapping

        import numpy as np
        import pint

        N_C_LETHAL_DEFAULT = 100000000000.0

        def _get_magnitude(qty: pint.Quantity, target_unit: str) -> np.ndarray:
            return np.asarray(qty.to(target_unit), dtype=float)

        def _tumor_diameter_cm(tumor_volume_uL: np.ndarray) -> np.ndarray:
            v_cm3 = np.clip(tumor_volume_uL, 0.0, None) * 1e-3
            return 2.0 * np.cbrt(3.0 * v_cm3 / (4.0 * math.pi))

        def _compartment_volume_uL(
            species_dict: Mapping[str, pint.Quantity],
            ureg: pint.UnitRegistry,
        ) -> np.ndarray | None:
            vol = species_dict.get("V_T")
            if vol is None:
                return None
            return _get_magnitude(vol, "microliter")

        def _diameter_from_species(
            species_dict: Mapping[str, pint.Quantity],
            ureg: pint.UnitRegistry,
            cells_per_cm3: float = 1.0e9,
        ) -> np.ndarray:
            v_uL = _compartment_volume_uL(species_dict, ureg)
            if v_uL is not None:
                return _tumor_diameter_cm(v_uL)
            c1 = _get_magnitude(species_dict["V_T.C1"], "cell")
            v_cm3 = np.clip(c1, 0.0, None) / cells_per_cm3
            return 2.0 * np.cbrt(3.0 * v_cm3 / (4.0 * math.pi))

        def _interp_at(
            time_days: np.ndarray,
            values: np.ndarray,
            landmark_days: float,
        ) -> float:
            if time_days.size == 0:
                return float("nan")
            if landmark_days < time_days[0] or landmark_days > time_days[-1]:
                return float("nan")
            return float(np.interp(landmark_days, time_days, values))

        def diameter_fold_at_day(
            time: pint.Quantity,
            species_dict: Mapping[str, pint.Quantity],
            ureg: pint.UnitRegistry,
            *,
            landmark_days: float,
            baseline_day: float = 0.0,
            n_c_lethal: float = N_C_LETHAL_DEFAULT,
        ) -> pint.Quantity:
            t = _get_magnitude(time, "day")
            diameter = _diameter_from_species(species_dict, ureg)
            if t.size == 0 or landmark_days > float(t[-1]):
                value = float("nan")
            else:
                c1 = _get_magnitude(species_dict["V_T.C1"], "cell")
                mask = t <= landmark_days
                dead_before = bool(mask.any() and c1[mask].max() >= n_c_lethal)
                if dead_before:
                    value = float("nan")
                else:
                    d_base = _interp_at(t, diameter, baseline_day)
                    d_land = _interp_at(t, diameter, landmark_days)
                    if (
                        np.isnan(d_base)
                        or np.isnan(d_land)
                        or d_base <= 0.0
                    ):
                        value = float("nan")
                    else:
                        value = d_land / d_base
            return np.full_like(t, value)

        return diameter_fold_at_day(
            time,
            species_dict,
            ureg,
            landmark_days=90.0,
            baseline_day=0.0,
            n_c_lethal=100000000000.0,
        )

