study_interpretation: Mechanistic-prior conversion of the prediction-only target time_to_progression for
  the untreated natural-history scenario clinical_progression_longterm. Untreated PDAC mTTP ~3-5 months
  from diagnosis based on natural-history and placebo-equivalent arms across the literature. CI95 [30,
  365] day is deliberately wide because progression definition (RECIST 1.1 implementation, imaging cadence)
  varies across reports. Lognormal prior anchored at 120 d median admits the bulk of reported PDAC TTP
  realizations.
key_assumptions:
- 'Mechanistic prior: no PDAC trial reports this observable in an untreated cohort with matched timing,
  so the distribution is derived from upstream literature-anchored targets (Ahn 2017 VDT, Tran 2022 initial
  diameter) rather than a direct measurement.'
- No single canonical untreated-PDAC TTP source; the value is consistent with the Ahn 2017 VDT distribution
  (a tumor with VDT ~93 d crosses 20% diameter increase around d80-130, within the lognormal CI95).
- 'Distribution: lognormal with CI95 [30.0, 365.0] day. Geometric mean ~105. Width chosen to dominate
  over upstream-target propagation uncertainty so this target acts as a sanity rail rather than a likelihood
  driver.'
key_study_limitations:
- 'No primary literature anchor: this target is a forward consequence of upstream calibration choices,
  not an independent measurement. PPC inspection at this target should be interpreted as ''is the natural-history
  trajectory mechanistically sane?'', not ''does the model match a specific cohort?''.'
- "Death/censoring (V_T.C1 \u2265 1e11) returns NaN; the cal target is only evaluated on surviving simulations,\
  \ biasing toward slow-growing subsets."
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        import math
        from typing import Mapping

        import numpy as np

        N_C_LETHAL_DEFAULT = 100000000000.0
        PROGRESSION_INCREASE_DEFAULT = 0.2
        RESPONSE_DECREASE_DEFAULT = 0.3
        CR_DIAMETER_CM_DEFAULT = 0.1

        def _as_float_array(value) -> np.ndarray:
            """Coerce a raw-float scalar / array into a 1-D numpy array."""
            return np.asarray(value, dtype=float)

        def _tumor_diameter_cm(tumor_volume_uL: np.ndarray) -> np.ndarray:
            v_cm3 = np.clip(tumor_volume_uL, 0.0, None) * 1e-3
            return 2.0 * np.cbrt(3.0 * v_cm3 / (4.0 * math.pi))

        def _compartment_volume_uL(species_dict: Mapping[str, np.ndarray]) -> np.ndarray | None:
            # V_T canonical unit is milliliter; convert to microliter (×1000).
            vol = species_dict.get("V_T")
            if vol is None:
                return None
            return _as_float_array(vol) * 1000.0

        def _diameter_from_species(
            species_dict: Mapping[str, np.ndarray],
            cells_per_cm3: float = 1.0e9,
        ) -> np.ndarray:
            v_uL = _compartment_volume_uL(species_dict)
            if v_uL is not None:
                return _tumor_diameter_cm(v_uL)
            c1 = _as_float_array(species_dict["V_T.C1"])
            v_cm3 = np.clip(c1, 0.0, None) / cells_per_cm3
            return 2.0 * np.cbrt(3.0 * v_cm3 / (4.0 * math.pi))

        def _interp_at(time_days: np.ndarray, values: np.ndarray, landmark_days: float) -> float:
            if time_days.size == 0:
                return float("nan")
            if landmark_days < time_days[0] or landmark_days > time_days[-1]:
                return float("nan")
            return float(np.interp(landmark_days, time_days, values))

        def time_to_progression(
            time,
            species_dict,
            *,
            baseline_day: float = 0.0,
            progression_increase: float = PROGRESSION_INCREASE_DEFAULT,
            min_absolute_increase_cm: float = 0.5,
            censoring_day: float = 1095.0,
            n_c_lethal: float = N_C_LETHAL_DEFAULT,
        ) -> np.ndarray:
            t = _as_float_array(time)
            if t.size == 0:
                return np.full_like(t, float("nan"))
            diameter = _diameter_from_species(species_dict)
            d_base = _interp_at(t, diameter, baseline_day)
            if not np.isfinite(d_base) or d_base <= 0:
                return np.full_like(t, float("nan"))
            threshold = max(d_base * (1.0 + progression_increase),
                            d_base + min_absolute_increase_cm)
            c1 = _as_float_array(species_dict["V_T.C1"])
            # progression: diameter exceeds threshold
            prog_mask = (t <= censoring_day) & (diameter >= threshold)
            # death also counts as event
            death_mask = (t <= censoring_day) & (c1 >= n_c_lethal)
            event_mask = prog_mask | death_mask
            if event_mask.any():
                ttp = float(t[event_mask][0])
            else:
                ttp = float(min(censoring_day, t[-1]))
            return np.full_like(t, ttp)

        return time_to_progression(time, species_dict, baseline_day=0.0, progression_increase=0.2, min_absolute_increase_cm=0.5, censoring_day=1095.0)

