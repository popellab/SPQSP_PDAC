  distribution_code: "def derive_distribution(inputs, ureg):\n    import numpy as np\n    rng = np.random.default_rng(42)\n\
    \    lo, hi = 30.0, 365.0\n    mu = 0.5 * (np.log(lo) + np.log(hi))\n    sigma = (np.log(hi) - np.log(lo))\
    \ / (2.0 * 1.96)\n    samples = rng.lognormal(mu, sigma, 100000) * ureg('day')\n    return {\n   \
    \     'median_obs': np.median(samples),\n        'ci95_lower': np.percentile(samples, 2.5),\n    \
    \    'ci95_upper': np.percentile(samples, 97.5),\n    }\n"
