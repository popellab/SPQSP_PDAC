study_interpretation: |
  PD-1 blockade (nivolumab) should measurably increase the model's effective
  T-cell-mediated cancer killing rate (k_C_Tcell_eff) in the GVAX+nivo
  treatment cascade. The mechanistic logic: PD-1 ligation reduces TCR/CD28
  costimulation (Hui 2017 reports ~63% IL-2 suppression in vitro, implying
  ~2.7× downregulation), so blocking PD-1 should restore at least 2× of
  that function. In vivo magnitudes are likely larger via compound
  proliferative effects but rarely exceed ~10× for the checkpoint axis
  alone.

  This target encodes that expectation as a soft prior on the observable
  k_C_Tcell_eff(d14)/k_C_Tcell_eff(d0) under the GVAX+nivo regimen, with
  CI95 [2, 10] giving a wide-but-bounded credible interval. It is a
  mechanistic prior because no published cohort directly reports this
  ratio in PDAC immunotherapy trials — the in vitro Hui 2017 source
  doesn't translate cleanly to a per-patient in vivo k_C_Tcell_eff
  fold-change distribution.
key_assumptions:
- |
  Mechanistic prior: PD-1 blockade by nivolumab releases checkpoint
  suppression on T-cell-mediated killing. The model expresses this via
  the k_C_Tcell_eff repeated-assignment rule (which scales the killing
  reaction rate by 1/(1 + PD1·PDL1_eff/Kd) in the macrophage_module
  assembly modification). Nivolumab binding PD-1 reduces PDL1_eff,
  raising k_C_Tcell_eff.
- |
  Distribution width: lognormal with [2.0, 10.0] as the 95% credible
  interval. Lower endpoint 2.0 anchors on Hui 2017's in vitro 2.7×
  IL-2 modulation as a conservative floor; upper endpoint 10.0 gives
  generous headroom for proliferative compounding without admitting
  implausible >10× single-axis effects. Geometric mean ~4.47.
- |
  Timing: ratio measured at tx_d14 vs prog_d0. d14 is sufficiently
  post-nivo administration (single dose at d7) for the PD-1 occupancy
  to plateau and downstream killing-rate effects to express. This
  matches the Zheng 2022 Fig 2F treatment window the existing
  cd8_fc / cd8gzmb_fc d21 cal targets are anchored to.
- |
  No primary literature on k_C_Tcell_eff distributions: the ratio is
  internal to the model (a derived rate constant from a Hill-cascade
  product). In vitro PD-1 blockade dose-response (Hui 2017, Latchman
  2001) reports cytokine and cytotoxicity changes, not the model's
  specific k_C_Tcell_eff observable. So this is a mechanistic
  translation of in vitro biology to the model's parameterization,
  not a direct measurement.
key_study_limitations:
- |
  In vitro → in vivo translation: Hui 2017's 2.7× IL-2 modulation is
  in a Jurkat/Raji co-culture, not the desmoplastic PDAC TME. The
  in vivo magnitude could be smaller (TGFb/IL-10/Treg suppression
  competing) or larger (proliferative compounding via expanded CD8s).
  The wide CI95 is intended to absorb this uncertainty.
- |
  Single-axis effect: this target asserts the checkpoint-release
  contribution alone. The total k_C_Tcell_eff fold-change at d14 may
  exceed 10× due to GVAX-driven priming on top of PD-1 release,
  which is captured by the CD8 expansion targets, not here.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        import numpy as np
        # k_C_Tcell_eff is exposed as a repeated assignment in the model;
        # _cpp_helper.py emits it under the same key.
        k = species_dict['k_C_Tcell_eff']
        if k.size == 0 or k[0] <= 0:
            return np.full_like(k, np.nan, dtype=float)
        return (k / k[0])

  units: dimensionless
  species:
  - k_C_Tcell_eff
  constants: []
  support: positive_unbounded
  mapping_rationale: |
    k_C_Tcell_eff(t) / k_C_Tcell_eff(0) — fold-change of the model's
    effective killing rate vs treatment baseline. Mechanistic prior
    asserts this rises >=2× by d14 under GVAX+nivo.
