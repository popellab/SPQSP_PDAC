    the NaN filter drops this θ from the timing-target loss; the
    magnitude target tumor_fold_d21_gvax_nivo_mechanistic carries the
    "should the tumor shrink" claim separately. Mechanistic prior
    asserts the delta is positive when shrinkage occurs — tumor minimum
    follows CD8 peak, completing the priming → killing cascade.
