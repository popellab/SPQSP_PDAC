study_interpretation: |
  Mechanistic prior on the third link of the priming cascade: under
  effective T-cell-mediated killing, tumor cell mass should reach its
  minimum AFTER the CD8 effector population peaks, not before. The
  causal chain is mAPC peak → CD8 peak → cumulative killing → tumor
  minimum, with each step lagging the previous on a days-scale
  timescale.

  Encoded as t_center(C1 fall below baseline) - t_center(CD8 rise above
  baseline) over the post-GVAX/nivo window (t >= 7 d), CI95 [1, 14]
  days lognormal. This is a *timing-only* claim — the magnitude claim
  ("tumor should shrink at all") is carried separately by the companion
  cal target tumor_fold_d21_gvax_nivo_mechanistic, so the timing
  observable returns NaN when C1 never falls below its window-start
  value (no shrinkage to time) and the NaN filter drops it from the
  loss for that θ instead of feeding a sentinel into NPE training.

  Earlier versions used argmin/argmax (t_min(C1) - t_peak(CD8)), which
  returned -14 sentinel values when C1 was monotonically increasing —
  treated by NPE as a real measurement at log-infinite distance from
  the target, distorting posteriors of unrelated parameters (the
  post-#180 audit had cDC1_recruit_target_T as the top driver
  spuriously). Excursion mass-center is smooth in θ when shrinkage
  occurs and NaN-gated when it doesn't.
key_assumptions:
- |
  Mechanistic prior: tumor regression in immunotherapy is driven by
  cumulative kill rate integrated over the effector phase. The
  centroid of C1's excursion below baseline therefore lags the
  centroid of CD8's excursion above baseline by however long it
  takes for accumulated killing to overtake regrowth, typically days
  under GVAX+nivo.
- |
  Observable: excursion mass-center lag,
  t_center(C1 below C1(t=7d)) - t_center(CD8 above CD8(t=7d))
  via trapezoidal integration over t in [7, 21] d. If C1 never
  falls below baseline the excursion integral is zero and the
  observable returns NaN — the qsp-hpc-tools NaN filter then drops
  this target from this θ's loss. The companion target
  tumor_fold_d21_gvax_nivo_mechanistic carries the magnitude
  signal ("should there BE shrinkage").
- |
  Window: t >= 7 d (post-GVAX/nivo administration). Pre-treatment
  dynamics include the diagnosis-state evolution which is unrelated
  to the cascade.
- |
  C1 species: V_T.C1 (cancer cell count). CD8: V_T.CD8 + V_T.CD8_exh.
  Same mapping as the upstream cascade target.
- |
  Distribution width: lognormal CI95 [1.0, 14.0] day, geometric mean
  ~3.74 d. Identical to mapc_peak_precedes_cd8_peak_gvax_nivo so the
  cascade-of-three targets are coherent.
key_study_limitations:
- |
  NaN-gating on no shrinkage: when the model produces monotone-rising
  C1 (the current post-#180 state), this target contributes zero loss
  signal. The magnitude target tumor_fold_d21_gvax_nivo_mechanistic
  is what drives SBI toward producing shrinkage in the first place;
  this timing target only kicks in once shrinkage exists.
- |
  Excursion mass-center is a smooth functional rather than a literal
  time-of-minimum. For a model that controls then loses control, the
  C1-below-baseline centroid sits between the regression and regrowth
  phases, which may be later than the literal minimum — biologically
  faithful for "when was killing dominant" but not the same as the
  argmin point estimate.
- |
  No literature anchor; this is a structural ordering claim
  translated from cumulative-killing kinetics, not measured in any
  human PDAC immunotherapy trial.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        """ε-relaxed excursion-mass-center: t_center(C1 fall) - t_center(CD8 rise).
    
        Replaces the prior NaN-on-no-shrinkage gate with an ε floor on each
        excursion integral so the mass-center is *always* defined (never NaN).
        Reason: qsp-hpc-tools applies a JOINT NaN filter — any NaN in any
        target drops the entire θ row from training. When no shrinkage exists
        (~99.6% of prior draws in the multi_v3_mass_center run), pure NaN
        here wiped out the joint training pool (2/20000 survived).
    
        With the ε floor, when C1 never falls below baseline the floor
        dominates the C1-fall mass-center, pushing it toward the window
        midpoint and producing a small (often negative) delta. The output is
        then clipped to a strictly-positive ε_output so the cal target's
        lognormal log-transform stays finite — SBI sees a strong but bounded
        soft-prior gradient pushing for shrinkage timing, instead of a row
        drop.
    
        The companion target tumor_fold_d21_*_mechanistic carries the
        magnitude claim ("should there BE shrinkage"); this target only
        constrains timing, smoothly degrading to "wrong direction" rather
        than going silent when shrinkage is absent.
        """
        import numpy as np
    
        t = np.asarray(time, dtype=float)
        cd8 = species_dict['V_T.CD8'] + species_dict['V_T.CD8_exh']
        c1 = species_dict['V_T.C1']
        if t.size < 2 or cd8.size != t.size or c1.size != t.size:
            return np.full_like(t, np.nan, dtype=float)
    
        mask = t >= 7.0
        if mask.sum() < 2:
            return np.full_like(t, np.nan, dtype=float)
        tw, cd8_w, c1_w = t[mask], cd8[mask], c1[mask]
        if not (np.all(np.isfinite(cd8_w)) and np.all(np.isfinite(c1_w))):
            return np.full_like(t, np.nan, dtype=float)
    
        trapz = np.trapezoid if hasattr(np, 'trapezoid') else np.trapz
        EPS_FLOOR = 1e-4    # fraction of species scale; ε floor for denom
        EPS_OUTPUT = 0.01   # day; min positive clip for lognormal compatibility
    
        def _mass_center(values, scale):
            weights = values + EPS_FLOOR * max(scale, 1.0)
            denom = trapz(weights, tw)
            if not np.isfinite(denom) or denom <= 0:
                return float('nan')
            return float(trapz(tw * weights, tw) / denom)
    
        t_center_cd8_rise = _mass_center(np.clip(cd8_w - cd8_w[0], 0.0, None), float(np.max(cd8_w)))
        t_center_c1_fall = _mass_center(np.clip(c1_w[0] - c1_w, 0.0, None), float(np.max(c1_w)))
        if not (np.isfinite(t_center_cd8_rise) and np.isfinite(t_center_c1_fall)):
            return np.full_like(t, np.nan, dtype=float)
    
        delta = t_center_c1_fall - t_center_cd8_rise
        delta_clipped = max(delta, EPS_OUTPUT)
        return np.full_like(t, delta_clipped, dtype=float)

