  mapping_rationale: |
    Excursion mass-center lag,
    t_center(CD8 above baseline) - t_center(mAPC above baseline), over
    t in [7, 21] d. Continuous (smooth in θ) replacement for the old
    argmax-based lag, which produced sentinel values when species were
    monotonic. Mechanistic prior asserts this is positive — APC
    dynamics lead CD8 dynamics under combined vaccination + checkpoint
    blockade.
