empirical_data:
  median:
  - 0.8374
  ci95:
  - - 0.5
    - 1.4
  units: dimensionless
  sample_size: 1
  sample_size_rationale: |
    Mechanistic prior; sample size 1 denotes a single soft-prior
    assertion. The CI95 [0.5, 1.4] carries the directional uncertainty
    about per-patient d21 C1 fold-change under GVAX + nivolumab.
  index_values:
  - 21.0
  index_unit: day
  index_type: time
  inputs: []
  assumptions: []
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np
        rng = np.random.default_rng(42)
        lo, hi = 0.5, 1.4
        mu = 0.5 * (np.log(lo) + np.log(hi))
        sigma = (np.log(hi) - np.log(lo)) / (2.0 * 1.96)
        samples = rng.lognormal(mu, sigma, 100000) * ureg.dimensionless
        return {
            'median_obs': np.median(samples),
            'ci95_lower': np.percentile(samples, 2.5),
            'ci95_upper': np.percentile(samples, 97.5),
        }
