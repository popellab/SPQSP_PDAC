    21-day neoadjuvant GVAX + nivolumab scenario (gvax_nivo_neoadjuvant_zheng2022);
    mechanistic-prior directional cal target on the continuous d21 C1
    fold-change. Companion to the mass-center timing target
    tumor_min_follows_cd8_peak_gvax_nivo_mechanistic.
