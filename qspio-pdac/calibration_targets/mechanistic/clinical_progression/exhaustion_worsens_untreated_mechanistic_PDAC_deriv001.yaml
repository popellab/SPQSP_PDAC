study_interpretation: |
  Chronic antigen exposure in untreated PDAC drives progressive, hierarchical
  CD8 T-cell exhaustion (Wherry 2011, conceptual review). Across 90 days of
  clinical progression with no immunotherapy intervention, the CD8 exhaustion
  fraction frac_exh = V_T.CD8_exh / (V_T.CD8 + V_T.CD8_exh) should not
  decrease — exhaustion can plateau or worsen, but a spontaneous improvement
  in T-cell function would be inconsistent with PDAC's known
  immunosuppressive trajectory.

  This target encodes that mechanistic invariant as a soft prior on the
  observable frac_exh(d90) / frac_exh(d0) over the 90-day untreated
  progression window. It is a mechanistic prior, not a literature
  measurement: Wherry 2011 is conceptual, and no per-patient longitudinal
  PDAC cohort directly publishes the d0→d90 exhaustion-fraction ratio.
  The distribution is intentionally wide so the prior nudges away from
  spontaneous improvement without dominating posterior mass.
key_assumptions:
- |
  Mechanistic prior: untreated PDAC's CD8 compartment is under chronic
  antigen exposure with persistent TGFb / IL-10 / Treg suppression. Net
  flow of CD8 cells favors transition into the exhausted state (CD8_exh),
  not back to effector. So frac_exh(t) is monotone non-decreasing in
  the untreated window — an improvement (frac_exh(d90) < frac_exh(d0))
  would indicate either (a) spontaneous immune control phase the model
  is not parameterized for, or (b) cell-death or trafficking dynamics
  preferentially clearing exhausted CD8s, which would be a structural
  failure to flag.
- |
  Distribution width: lognormal with [1.0, 3.0] as the 95% credible
  interval. Lower endpoint 1.0 = no-improvement floor (the assertion
  itself); upper endpoint 3.0 = ~3x worsening ceiling consistent with
  Wherry's hierarchical-progression description over chronic timescales
  (effector → progenitor-exhausted → terminal-exhausted within months).
  Geometric mean ~1.73.
- |
  Observable scaling: frac_exh is bounded in [0, 1]; the ratio
  frac_exh(d90)/frac_exh(d0) is well-defined when frac_exh(d0) > 0
  (any nontrivial baseline exhaustion). At very low baseline exhaustion
  (frac_exh(d0) → 0) the ratio is unstable; we return NaN in that
  edge case so the likelihood ignores those draws rather than blowing up.
key_study_limitations:
- |
  No primary source: Wherry 2011 reviews exhaustion biology
  conceptually; no published cohort tracks per-patient PDAC CD8
  exhaustion fractions across 90 days untreated. The mechanistic prior
  is inferred from the chronic-antigen biology, not measured.
- |
  The model's CD8/CD8_exh compartments are simplified vs the
  hierarchical PD-1+ / TIM-3+ / LAG-3+ progressive-exhaustion states
  Wherry describes. The mechanistic prior asserts directionality, not
  the specific exhaustion subtype kinetics.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        import numpy as np
        cd8 = species_dict['V_T.CD8']
        cd8_exh = species_dict['V_T.CD8_exh']
        total = cd8 + cd8_exh
        if total.size == 0:
            return np.full_like(total, np.nan, dtype=float)
        frac = np.where(total > 0, cd8_exh / total, np.nan)
        if not np.isfinite(frac[0]) or frac[0] <= 0:
            return np.full_like(frac, np.nan, dtype=float)
        return (frac / frac[0])

  units: dimensionless
  species:
  - V_T.CD8
  - V_T.CD8_exh
  constants: []
  support: positive_unbounded
  mapping_rationale: |
    frac_exh(t) / frac_exh(0) over the simulated trajectory. Mechanistic
    prior asserts the observable stays >=1 across the untreated 90-day
    window.
