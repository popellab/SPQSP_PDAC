study_interpretation: |
  PDAC's desmoplastic phenotype starts at premalignant lesions and persists
  through clinical progression (Erkan 2012, conceptual review). The model's
  ECM concentration (V_T.collagen / V_T volume) should remain roughly
  stable over a 90-day untreated window: collagen mass scales with tumor
  growth so the volume fraction holds steady. Dramatic change in either
  direction (collapse or runaway accumulation) over 90 days would
  contradict PDAC's known persistent-fibrotic-stroma biology.

  This target encodes that mechanistic invariant as a soft prior on the
  observable conc(d90) / conc(d0), where conc = collagen / V_T. It is a
  mechanistic prior, not a literature measurement: no published cohort
  tracks per-tumor longitudinal ECM concentration over 90 days untreated.
  The distribution is wide ([0.5, 1.5]) so the prior catches model bugs
  (ECM blowing up or collapsing) without overconstraining moderate
  remodeling dynamics.
key_assumptions:
- |
  Mechanistic prior: in untreated PDAC, collagen deposition by myCAFs
  and degradation by M2 macrophages reach a quasi-steady ratio with
  tumor growth. The collagen volume fraction (phi_collagen) is therefore
  approximately scale-invariant during the observed 90-day window.
- |
  Distribution width: lognormal anchored at the asserted center
  conc(d90)/conc(0) = 1.0 (mu = 0 in log space), with sigma chosen
  so 1.5 sits at the 97.5th percentile. CI95 = [0.667, 1.5]
  (symmetric in log space). Earlier versions set the median to
  geomean(0.5, 1.5) = 0.866 — that miscentering penalized models
  for being correctly stable around 1.0. The lower 0.667 / upper
  1.5 tails still encode moderate compression / expansion as soft
  bounds; values outside indicate collapse or runaway accumulation,
  both inconsistent with PDAC histology.
- |
  Observable scaling: conc = collagen_mg / V_T_mL gives a mass density
  in mg/mL; the ratio is unitless. We use V_T as the denominator
  (the tumor compartment volume rule already includes the collagen
  contribution per fibroblast_module_enhanced.m).
key_study_limitations:
- |
  No primary source: Erkan 2012 reviews PDAC stroma biology
  qualitatively. No published cohort tracks per-tumor longitudinal
  ECM concentration across 90 days untreated; cross-sectional cohorts
  (Tian 2019, Imamura 1995) measure once at resection.
- |
  The wide [0.5, 1.5] CI is a structural sanity bound, not a tight
  fit target. Tighter constraint requires direct longitudinal mass-
  basis ECM measurements that don't exist in PDAC literature.
observable:
  code: |
    def compute_observable(time, species_dict, constants):
        import numpy as np
        ecm = species_dict['V_T.collagen']
        v_t = species_dict['V_T']
        if ecm.size == 0:
            return np.full_like(ecm, np.nan, dtype=float)
        conc = np.where(v_t > 0, ecm / v_t, np.nan)
        if not np.isfinite(conc[0]) or conc[0] <= 0:
            return np.full_like(conc, np.nan, dtype=float)
        return (conc / conc[0])

  units: dimensionless
  species:
  - V_T.collagen
  - V_T
  constants: []
  support: positive_unbounded
  mapping_rationale: |
    conc(t) / conc(0) where conc = V_T.collagen / V_T volume. Mechanistic
    prior asserts the observable stays in [0.5, 1.5] across the
    untreated 90-day window — neither collapse nor runaway accumulation.
  experimental_denominator: null
  model_denominator_species: null
  unmodeled_denominator_components: null
  aggregation: null
