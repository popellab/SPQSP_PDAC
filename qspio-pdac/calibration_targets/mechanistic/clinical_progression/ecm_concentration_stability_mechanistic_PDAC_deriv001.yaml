empirical_data:
  median:
  - 1.0
  ci95:
  - - 0.667
    - 1.5
  units: dimensionless
  sample_size: 1
  sample_size_rationale: |
    Mechanistic prior; sample size set to 1 to denote a single
    soft-prior assertion. CI95 [0.667, 1.5] is symmetric in log
    space around the asserted "stable" center of 1.0; tails
    correspond to ~50pct expansion / ~33pct compression.
  index_values:
  - 90.0
  index_unit: day
  index_type: time
  inputs: []
  assumptions: []
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np
        rng = np.random.default_rng(42)
        # Stability prior: anchored at conc(d90)/conc(0) = 1.0 (the
        # asserted "roughly stable" center), with the upper tail
        # carrying the user-specified ~50pct expansion ceiling. Sigma
        # chosen so 1.5 sits at the 97.5th percentile in log space;
        # the lower tail mirrors symmetrically (~0.667 at 2.5th).
        # Earlier versions set the median to geomean(0.5, 1.5) = 0.866,
        # which penalized models for being correctly stable.
        mu = 0.0
        sigma = np.log(1.5) / 1.96
        samples = rng.lognormal(mu, sigma, 100000) * ureg.dimensionless
        return {
            'median_obs': np.median(samples),
            'ci95_lower': np.percentile(samples, 2.5),
            'ci95_upper': np.percentile(samples, 97.5),
        }
