cross_scenario_target_id: tumor_diameter_fold_d90_gvax_vs_untreated
cancer_type: PDAC
tags:
  - mechanistic_prior
  - cross_scenario
  - phase_d2
observable:
  code: |
    def compute(inputs, ureg):
        # Both inputs are within-scenario d(90)/d(0) fold-changes
        # (dimensionless Pint Quantities). The ratio gvax_fold /
        # untreated_fold tests whether GVAX produces a smaller fold
        # growth than the untreated counterfactual at the same theta.
        # Direction: ratio < 1 = GVAX suppresses growth more than no
        # therapy. Ratio = 1 = no benefit. Ratio > 1 = GVAX is worse
        # than no therapy (mechanistically implausible — would flag a
        # forward-model bug).
        return inputs['gvax'] / inputs['untreated']
  units: dimensionless
  inputs:
    - role: untreated
      scenario: clinical_progression_longterm
      input_kind: test_statistic
      test_statistic_id: tumor_diameter_fold_d90_untreated
    - role: gvax
      scenario: gvax_neoadjuvant_longterm
      input_kind: test_statistic
      test_statistic_id: tumor_diameter_fold_d90_gvax_mechanistic
empirical_data:
  median:
    - 0.9154
  ci95:
    - - 0.6992
      - 1.2016
  units: dimensionless
  sample_size: 1
  sample_size_rationale: >
    Mechanistic prior; sample_size=1 denotes a single soft-prior
    assertion. The CI95 [0.70, 1.20] dimensionless carries directional
    uncertainty about the GVAX-vs-untreated d90 fold-ratio.
  index_values:
    - 90.0
  index_unit: day
  index_type: time
  inputs: []
  assumptions: []
  distribution_code: |
    def derive_distribution(inputs, ureg):
        import numpy as np
        rng = np.random.default_rng(42)
        lo, hi = 0.70, 1.20
        mu = 0.5 * (np.log(lo) + np.log(hi))
        sigma = (np.log(hi) - np.log(lo)) / (2.0 * 1.96)
        samples = rng.lognormal(mu, sigma, 100000) * ureg('dimensionless')
        return {
            'median_obs': np.median(samples),
            'ci95_lower': np.percentile(samples, 2.5),
            'ci95_upper': np.percentile(samples, 97.5),
        }
study_interpretation: >
  Cross-scenario mechanistic-prior cal target on the ratio of d90 tumor-
  diameter fold-changes between gvax_neoadjuvant_longterm and
  clinical_progression_longterm. Composes the two within-scenario
  mechanistic targets shipped in Phase E1
  (tumor_diameter_fold_d90_gvax_mechanistic and
  tumor_diameter_fold_d90_untreated) into a single directional invariant.
  Single-agent GVAX in PDAC has low published ORR (Lutz 2011, Le 2015
  for closely related GVAX variants), so the treated d90 fold should be
  roughly comparable to or mildly below the untreated fold — ratio
  median 0.95 with wide CI95 [0.70, 1.20] admits both modest growth
  suppression and no-effect baselines without requiring a tight
  population-mismatched literature anchor. The cross-scenario form
  removes the shared baseline-growth nuisance that affects both
  scenarios identically and isolates the treatment effect.
key_assumptions:
  - >
    Mechanistic prior; ratio is a within-θ fold-of-fold so it cancels
    the baseline growth rate that both scenarios share. CI95 width
    [0.70, 1.20] chosen to admit both PR-equivalent ratios (≤0.80) and
    no-effect baselines (≈1.00–1.10), wider than either constituent
    target so this cross-scenario observable acts as a directional rail
    rather than a tight likelihood driver.
  - >
    Distribution: lognormal on the ratio, dimensionless. Geometric mean
    ≈ 0.92. Both inputs are mechanistic-prior cal targets in Phase E1;
    composing two priors into one ratio expands the effective uncertainty
    consistent with the wider CI95 here.
  - >
    Direction-only: this is a within-θ structural invariant (not a
    population estimate). Audit outputs should be read as "is the
    treatment-effect direction mechanistically plausible?" rather than
    "does the model match a specific cohort?". A median ratio above
    1.10 in the posterior predictive would flag a forward-model bug
    (treatment producing more growth than no treatment).
key_study_limitations:
  - >
    Both upstream mechanistic priors (tumor_diameter_fold_d90_gvax_mechanistic,
    tumor_diameter_fold_d90_untreated) lack primary-literature anchors
    matching the simulator scenarios (resectable + monotherapy vs untreated,
    no surgery / chemo backbone). The cross-scenario ratio inherits that
    epistemic position — useful as a directional rail, not a population fit.
  - >
    Death/censoring (V_T.C1 ≥ 1e11) returns NaN for either upstream input;
    the cross-scenario value is NaN whenever either constituent is NaN,
    which is the desired joint-NaN semantic.
epistemic_basis: mechanistic
primary_data_source: null
secondary_data_sources: []
