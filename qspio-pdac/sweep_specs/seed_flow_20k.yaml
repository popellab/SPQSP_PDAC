# 3×3 SBI sweep at the full 20k sim budget
# (follow-up to seed_flow_nsims.yaml's 3×3×3 grid with smaller budgets)
sweep_name: seed_flow_20k_9cell
output_dir: sweep_runs

fixed:
  prcc_tier: null
  run_posterior_predictive: false
  cache_sampling_seed: 2025
  num_total_simulations: 20000

axes:
  - name: seed
    values: [2025, 2029, 2033]

  - name: flow
    values:
      - {npe_hidden_features: 128, npe_num_transforms: 7}
      - {npe_hidden_features: 192, npe_num_transforms: 9}
      - {npe_hidden_features: 256, npe_num_transforms: 11}

# At 5k sims, 256×11 trained ~116 epochs in ~10 min. n_train ≈ 7× larger at
# 20k, so per-epoch wall ~70s × 100 epochs ≈ 70 min. 2h gives comfortable
# margin without burning queue time.
sbatch:
  partition: shared
  time: "02:00:00"
  cpus_per_task: 4
  mem: "32G"