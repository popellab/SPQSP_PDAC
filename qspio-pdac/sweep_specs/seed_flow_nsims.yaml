# 3x3x3 SBI sweep: seed x flow capacity x simulation budget
# 27 cells total. All 217 parameters, multi-scenario default.
sweep_name: seed_flow_nsims_27cell
output_dir: sweep_runs

fixed:
  prcc_tier: null
  run_posterior_predictive: false
  # Fixed seed for cache sampling so all cells draw the same theta pool.
  cache_sampling_seed: 2025

axes:
  - name: seed
    values: [2025, 2029, 2033]

  - name: flow
    values:
      - {npe_hidden_features: 128, npe_num_transforms: 7}
      - {npe_hidden_features: 192, npe_num_transforms: 9}
      - {npe_hidden_features: 256, npe_num_transforms: 11}

  - name: num_total_simulations
    values: [2000, 3500, 5000]

# Rockfish sbatch parameters (override DEFAULT_SBATCH in sweep_submit.py).
sbatch:
  partition: shared
  time: "03:00:00"
  cpus_per_task: 4
  mem: "32G"