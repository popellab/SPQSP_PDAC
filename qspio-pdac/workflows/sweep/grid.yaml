sweep_id: npe_subsample_restricted_2026-04
description: |
  Single-axis sweep over training-set size only. NN capacity fixed at
  reasonable mid-range values (Sweep-1 showed hidden_features / num_transforms
  barely move identifiability). Runs against the restriction-classifier-gated
  theta pool so effective survivor count is ~101k instead of ~49k.

# Fixed across all cells
fixed:
  hidden_features: 256
  num_transforms: 5
  num_bins: 10
  batch_size: 2048
  max_epochs: 80

# 1D grid axis
axes:
  n_train_subsample: [10000, 25000, 50000, 75000, 100000]

# Suffix convention for tag names:
#   s{n_train_subsample_shortened}
# e.g. s10k, s25k, s100k
# Configs live in configs/ with matching filenames (auto-generated).
