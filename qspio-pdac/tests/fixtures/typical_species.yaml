# Typical species / param values for the calibration-target OOM smoke test.
#
# These are medians of the LAST timepoint across the 460 status=0 prior-draw
# PPC sims from the 20k SBI run in pdac-build-verify-density-fix
# (baseline_no_treatment, May 2026). They represent "what the model
# typically produces under the current prior" — not literature truth.
#
# Purpose: feed each calibration target's compute_observable a realistic
# species_dict so the function's output can be compared to the target's
# empirical_data.median for a 2-order-of-magnitude sanity check. The test
# is calibrated to catch unit-conversion bugs (the 1000x collagen / TGFb
# class), not to validate biological accuracy.
#
# When adding a new calibration target that references a species not
# listed here, add a typical value (a single-trace simulation median or a
# textbook estimate is fine). The test will skip targets with missing
# species rather than fail, but those skips should be temporary.

species:
  # cell counts (cells), tumor compartment
  V_T.C1: 9.34e+08
  V_T.C_x: 6.82e+07
  V_T.CD8: 5.46e+07
  V_T.CD8_exh: 2.07e+07
  V_T.Th: 3.82e+05
  V_T.Th_exh: 1.53e+06
  V_T.Treg: 1.94e+07
  V_T.mcDC1: 1.85e+04
  V_T.mcDC2: 5.42e+03
  V_T.cDC1: 3.76e+06
  V_T.cDC2: 1.84e+06
  V_T.Mac_M1: 3.19e+07
  V_T.Mac_M2: 1.58e+08
  V_T.MDSC: 1.02e+08
  V_T.apCAF: 1.20e+08
  V_T.iCAF: 7.96e+08
  V_T.myCAF: 2.12e+09
  V_T.qPSC: 9.73e+06

  # cytokines / chemokines (nM unless noted in model_structure.json)
  V_T.IL1: 0.102
  V_T.IL6: 0.234
  V_T.IL10: 0.0597
  V_T.IL12: 2.12e-04
  V_T.TGFb: 6.22
  V_T.CCL2: 3.28
  V_T.ArgI: 1.95
  V_T.VEGF: 2.39e+04

  # ECM
  V_T.collagen: 3.44e+03   # mg
  phi_collagen: 0.392      # dimensionless volume fraction

  # compartment volumes (mL)
  V_T: 36.6

# Parameters / rule values referenced from compute_observable through
# species_dict (the runtime loader merges params + species before
# invoking the function).
params:
  rho_collagen: 0.244      # g/mL packing density (prior median)
  k_C_Tcell_eff: 7.12e-09  # cell-killing rate constant
  Ve_T: 0.55               # tumor compartment effective volume fraction (dimensionless)

# Auxiliary parameter defaults (lognormal mu=0 medians = 1.0). Override
# when an aux's prior median is known to be far from 1.
aux:
  f_serum_to_tumor_IL12: 1.0
  f_serum_to_tumor_TGFb: 1.0
  f_serum_to_tumor_ArgI: 1.0
