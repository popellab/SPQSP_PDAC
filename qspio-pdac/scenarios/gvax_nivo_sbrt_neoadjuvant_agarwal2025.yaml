scenario_id: "gvax_nivo_sbrt_neoadjuvant_agarwal2025"

scenario_context: |
  Neoadjuvant GVAX + cyclophosphamide + nivolumab + SBRT in borderline resectable PDAC
  (NCT03161379, Agarwal et al. Clin Cancer Res 2025). Two cycles of immunotherapy
  3 weeks apart, with SBRT (33 Gy / 5 fractions) during cycle 2, followed by surgical
  resection. Key endpoint: major pathologic response rate (35%, ~5/14 resected patients).

# Simulation configuration
sim_config:
  start_time: 0
  stop_time: 49  # ~7 weeks: 2 cycles (3 weeks apart) + SBRT + surgery
  time_units: "day"
  solver: "sundials"
  abs_tolerance: 1.0e-9
  rel_tolerance: 1.0e-6
  # Initialization: evolve from healthy state to diagnosis (target diameter from variant)
  initialization_function: 'evolve_to_diagnosis'

# Dosing configuration - passed to schedule_dosing()
dosing:
  drugs: ["GVAX", "nivolumab", "cyclophosphamide"]
  # Cycle 1: day 0 (Cy day -1, nivo day 0, GVAX day 1 — approximate as day 0)
  # Cycle 2: day 21
  GVAX_dose: 5.0e+8  # cells (same as Zheng 2022 protocol)
  GVAX_schedule: [0, 21, 2]  # [start, interval, repeat] - 2 doses, 3 weeks apart
  nivolumab_dose: 3.43  # mg/kg (240mg / 70kg)
  nivolumab_schedule: [0, 21, 2]  # 2 doses, 3 weeks apart
  cyclophosphamide_dose: 200  # mg (low-dose immunomodulatory)
  cyclophosphamide_schedule: [0, 21, 2]  # day before each vaccination
  patientWeight: 70
  patientBSA: 1.9

# Cancer type
indication: "PDAC"

# Notes
notes: |
  Borderline resectable setting — differs from Zheng 2022 (resectable).
  Treatment sequence: neoadjuvant chemo (mFOLFIRINOX or gem/nab-paclitaxel) →
  2 cycles GVAX/Cy/nivo (3 weeks apart) → SBRT 6.6 Gy × 5 during cycle 2 → surgery.

  LIMITATION: SBRT (33 Gy total) is NOT modeled. The model attributes all tumor
  reduction to chemotherapy and immunotherapy. The observed 35% MPR rate reflects
  combined chemo+immunotherapy+SBRT effects, so immunotherapy parameters calibrated
  against this target may absorb some radiation-attributable tumor kill.

  MPR verification: The Hill 2025 review reports 35% MPR rate. The primary paper
  (Agarwal 2025) confirms 14 resected patients and 1 pCR, but does not tabulate the
  exact MPR numerator in the abstract. Inferred k = round(0.35 × 14) = 5. This
  should be verified against the full text when accessible.

  DOI: 10.1158/1078-0432.CCR-24-3403