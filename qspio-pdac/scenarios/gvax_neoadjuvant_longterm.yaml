scenario_id: "gvax_neoadjuvant_longterm"

scenario_context: |
  Long-horizon variant of gvax_neoadjuvant_zheng2022 (NCT02451982 Arm A) — GVAX
  alone, single dose at day 7, simulated to 1095 days. Intended strictly for
  long-horizon prediction endpoints (OS/DFS landmarks at 12/24/36 mo, RECIST
  at day 90) via the ``calibration_targets/predictions/<this scenario>/``
  YAMLs.

  **Important: surgery (resection at day 21) and adjuvant chemotherapy
  (FOLFIRINOX) are NOT modeled.** Long-horizon predictions therefore capture
  the pharmacodynamic effect of GVAX alone over three years — not the clinical
  OS/DFS of the Zheng 2021 treatment-plus-surgery-plus-adjuvant cohort.
  Day-21 immune-composition calibration still belongs on
  ``gvax_neoadjuvant_zheng2022`` (stop_time=21), which is the scenario matched
  to the published measurements.

  Separate from the short-horizon scenario because: (1) existing qualitative-
  behavior tests compare d21 treatment state against d30 untreated state and
  depend on the solver tolerance being correct at that horizon, and (2)
  surgery is the right fix later (tracked separately as a follow-up issue).

# Simulation configuration
sim_config:
  start_time: 0
  stop_time: 1095  # 3y horizon for prediction endpoints
  time_units: "day"
  solver: "sundials"
  abs_tolerance: 1.0e-9
  rel_tolerance: 1.0e-6
  # Initialization: evolve from healthy state to diagnosis (target diameter from variant)
  initialization_function: 'evolve_to_diagnosis'

# Dosing configuration - passed to schedule_dosing()
dosing:
  drugs: ["GVAX"]
  # Override defaults from schedule_dosing.m (match the short-horizon arm)
  GVAX_dose: 5.0e+8  # cells
  GVAX_schedule: [7, 0, 1]  # [start, interval, repeat] - single dose
  patientWeight: 70
  patientBSA: 1.9

# Cancer type
indication: "PDAC"

# Notes
notes: |
  Prediction-only scenario (no calibration targets attached). Prediction
  endpoints live in ``calibration_targets/predictions/gvax_neoadjuvant_longterm/``.
