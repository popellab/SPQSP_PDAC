scenario_id: "clinical_progression"

scenario_context: |
  Clinical progression scenario for PDAC - simulates one year of disease progression
  to capture clinical endpoints (RECIST response, PFS, biomarkers). No therapeutic
  intervention. Patient parameters: 70 kg body weight, 1.9 m² body surface area.

# Simulation configuration
sim_config:
  start_time: 0
  stop_time: 365  # 1 year to capture full natural history trajectory
  time_units: "day"
  solver: "sundials"
  abs_tolerance: 1.0e-9
  rel_tolerance: 1.0e-6
  # Initialization: evolve from healthy state to diagnosis (target diameter from variant)
  initialization_function: 'evolve_to_diagnosis'

# Dosing configuration - passed to schedule_dosing()
dosing:
  drugs: []  # No drugs in baseline progression scenario

# Cancer type
indication: "PDAC"

# Test statistics file
test_statistics: "scenarios/test_statistics/clinical_outcomes.csv"

# Notes
notes: |
  Clinical progression scenario designed for DKL surrogate training and SBI.
  Simulates 365 days to capture:
  - RECIST-style response metrics (best % change, time to progression)
  - Tumor volume at multiple timepoints (d30, d60, d90)
  - Progression-free survival / tumor doubling time
  - Immune biomarkers (CD8 infiltration, CD8/Treg ratio, exhaustion)
  - Stromal barrier dynamics

  Use with clinical_outcomes.csv test statistics.
