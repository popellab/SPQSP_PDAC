scenario_id: "mFOLFIRINOX"

scenario_context: |
  PASS-01 arm A: modified FOLFIRINOX for de novo metastatic PDAC — oxaliplatin
  85 mg/m2 (2-h IV), irinotecan 150 mg/m2 (90-min IV), 5-FU 2400 mg/m2 (46-h
  continuous IV, bolus dropped), leucovorin not modeled (5-FU potentiator), q14d.
  Evolve to diagnosis, then treat. For chemo PK-PD network validation and the
  longitudinal tumor-burden (SLD + CA19-9) calibration.

# Simulation configuration
sim_config:
  start_time: 0
  stop_time: 168        # ~8 cycles q14d + follow-up
  time_units: "day"
  solver: "sundials"
  abs_tolerance: 1.0e-9
  rel_tolerance: 1.0e-6
  initialization_function: 'evolve_to_diagnosis'

# Dosing (schedule = [start, interval, repeat] in days)
dosing:
  drugs: ["oxaliplatin", "irinotecan", "fluorouracil"]
  oxaliplatin_dose: 85          # mg/m2
  oxaliplatin_schedule: [0, 14, 8]
  irinotecan_dose: 150          # mg/m2
  irinotecan_schedule: [0, 14, 8]
  fluorouracil_dose: 2400       # mg/m2 (46-h infusion in MATLAB path)
  fluorouracil_schedule: [0, 14, 8]
  patientWeight: 70
  patientBSA: 1.9

indication: "PDAC"

notes: |
  C++ qsp_sim applies each dose as a BOLUS at [start + r*interval]; the MATLAB
  schedule_dosing.m infuses (oxaliplatin 2 h, irinotecan 90 min, 5-FU 46 h).
  AUC/dose is preserved for linear PK, so PD exposure matches. Irinotecan is
  dosed as parent; SN-38 (the cytotoxic species) is formed in-model.
