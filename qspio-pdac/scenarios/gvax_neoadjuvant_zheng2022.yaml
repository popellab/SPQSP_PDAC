scenario_id: "gvax_neoadjuvant_zheng2022"

scenario_context: |
  Neoadjuvant GVAX + low-dose cyclophosphamide in resectable PDAC
  (NCT02451982 Arm A, Zheng/Li et al. Cancer Cell 2022; platform-trial write-up
  Nat Commun 2023 PMID: 37316592). Cy day 6, GVAX day 7, surgical resection
  day 21. Same trial as gvax_nivo_neoadjuvant but without nivolumab. Cy is
  part of every arm of NCT02451982, not optional.

# Simulation configuration
sim_config:
  start_time: 0
  stop_time: 21  # Surgery at day 21
  time_units: "day"
  solver: "sundials"
  abs_tolerance: 1.0e-9
  rel_tolerance: 1.0e-6
  # Initialization: evolve from healthy state to diagnosis (target diameter from variant)
  initialization_function: 'evolve_to_diagnosis'

# Dosing configuration - passed to schedule_dosing()
dosing:
  drugs: ["GVAX", "cyclophosphamide"]
  # Override defaults from schedule_dosing.m
  GVAX_dose: 5.0e+8  # cells
  GVAX_schedule: [7, 0, 1]  # [start, interval, repeat] - single dose
  cyclophosphamide_dose: 380  # mg (200 mg/m^2 × 1.9 m^2 BSA; low-dose immunomodulatory)
  cyclophosphamide_schedule: [6, 0, 1]  # day 6 — one day before GVAX
  patientWeight: 70
  patientBSA: 1.9

# Cancer type
indication: "PDAC"

# Notes
notes: |
  GVAX-alone arm (Arm A) from the same neoadjuvant platform trial as gvax_nivo_neoadjuvant.
  Calibration targets are immune cell fractions in non-LA tumor areas at day 21 (resection).
  Comparison of GVAX-alone vs GVAX+nivo arms tests whether the model correctly predicts
  the additive effect of checkpoint blockade on top of vaccine priming.

  Cy added 2026-04-21: matches NCT02451982 protocol (Cy is in every arm, Arms A/B/C).
