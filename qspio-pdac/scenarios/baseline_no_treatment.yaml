scenario_id: "baseline_no_treatment"

scenario_context: |
  Baseline tumor progression with no therapeutic intervention in pancreatic ductal adenocarcinoma (PDAC) patients. No drugs administered, representing natural disease progression. Patient parameters: 70 kg body weight, 1.9 m² body surface area.

# Simulation configuration
sim_config:
  start_time: 0
  stop_time: 1  # Only need t=0 (diagnosis) for baseline calibration targets
  time_units: "day"
  solver: "sundials"
  abs_tolerance: 1.0e-9
  rel_tolerance: 1.0e-6
  # Initialization: evolve from healthy state to diagnosis (target diameter from variant)
  initialization_function: 'evolve_to_diagnosis'

# Dosing configuration - passed to schedule_dosing()
dosing:
  drugs: []  # No drugs in baseline scenario

# Cancer type
indication: "PDAC"

# Notes
notes: |
  Baseline scenario with no treatment intervention. Used to establish natural disease
  progression and baseline immune dynamics for comparison against treatment scenarios.
  All test statistics derived from this scenario represent untreated disease course.
