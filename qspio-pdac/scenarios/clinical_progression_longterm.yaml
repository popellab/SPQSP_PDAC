scenario_id: "clinical_progression_longterm"

scenario_context: |
  Clinical progression scenario for PDAC — simulates 3 years of untreated
  disease progression to capture long-horizon clinical endpoints (OS/DFS
  landmarks at 12/24/36 mo, RECIST response, PFS, tumor diameter trajectory,
  biomarkers). No therapeutic intervention. Patient parameters: 70 kg body
  weight, 1.9 m² body surface area.

# Simulation configuration
sim_config:
  start_time: 0
  stop_time: 1095  # 3 years — supports 12/24/36 mo OS + 24 mo DFS landmarks
  time_units: "day"
  solver: "sundials"
  abs_tolerance: 1.0e-9
  rel_tolerance: 1.0e-6
  # Initialization: evolve from healthy state to diagnosis (target diameter from variant)
  initialization_function: 'evolve_to_diagnosis'

# Dosing configuration - passed to schedule_dosing()
dosing:
  drugs: []  # No drugs in baseline progression scenario

# Cancer type
indication: "PDAC"

# Test statistics file
test_statistics: "scenarios/test_statistics/clinical_outcomes.csv"

# Notes
notes: |
  Clinical progression scenario designed for SBI and OBED posterior-predictive
  analysis. Simulates 1095 days (3 years) to capture:
  - OS landmarks at 12 / 24 / 36 months (alive = V_T.C1 < N_C_lethal)
  - DFS landmarks at 12 / 24 months (alive + no RECIST PD from nadir)
  - Tumor diameter trajectory at day 365 / 730
  - Time to progression (RECIST 1.1 PD)
  - Tumor volume doubling time

  Prediction-only endpoints are defined in
  ``calibration_targets/predictions/clinical_progression_longterm/*.yaml``; calibration-fit targets live in
  ``calibration_targets/clinical_progression/*.yaml``. The ``test_statistics``
  CSV reference below is legacy and ignored by the C++ backend — targets are
  discovered from the calibration_targets directory.