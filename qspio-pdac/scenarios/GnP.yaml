scenario_id: "GnP"

scenario_context: |
  PASS-01 arm B: gemcitabine 1000 mg/m2 (30-min IV) + nab-paclitaxel 125 mg/m2,
  days 1/8/15 of a 28-day cycle. Evolve to diagnosis, then treat. For chemo PK-PD
  network validation and the longitudinal tumor-burden (SLD + CA19-9) calibration.

# Simulation configuration
sim_config:
  start_time: 0
  stop_time: 168
  time_units: "day"
  solver: "sundials"
  abs_tolerance: 1.0e-9
  rel_tolerance: 1.0e-6
  initialization_function: 'evolve_to_diagnosis'

# Dosing (schedule = [start, interval, repeat] in days)
dosing:
  drugs: ["gemcitabine", "nab-paclitaxel"]
  # NOTE: the C++ [start,interval,repeat] plan cannot express d1/8/15 q28d (it
  # can't skip week 4), so this WEEKLY-APPROXIMATES the schedule for C++ qsp_sim
  # validation. The MATLAB schedule_dosing.m renders the exact d1/8/15 q28d via
  # 3 dose objects. Refine per-patient from treatment-window data for the fits.
  gemcitabine_dose: 1000        # mg/m2
  gemcitabine_schedule: [0, 7, 12]
  nab-paclitaxel_dose: 125      # mg/m2
  nab-paclitaxel_schedule: [0, 7, 12]
  patientWeight: 70
  patientBSA: 1.9

indication: "PDAC"

notes: |
  C++ qsp_sim applies each dose as a BOLUS; the MATLAB path infuses (both 30-min).
  Drug name 'nab-paclitaxel' matches drug_metadata.yaml; the MATLAB switch uses
  'nabPaclitaxel' (add an alias there if running the MATLAB path with this file).
