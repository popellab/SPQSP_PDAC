calibration:
  parameters:
    - name: PARAM_ANTIBODY_DIFFUSIVITY
      units: centimeter^2 / second

  forward_model:
    type: algebraic
    formula: "D = PARAM_ANTIBODY_DIFFUSIVITY"
    data_rationale: "Review paper reports consensus IgG diffusivity in tumor tissue from multiple primary studies, supported by independent dextran diffusion measurements in brain ECS"
    submodel_rationale: "Parameter is used directly as diffusion coefficient D in PDE solver dC/dt = D*nabla^2(C) - lambda*C + S"
    code: |
      def compute(params, inputs):
          return params['PARAM_ANTIBODY_DIFFUSIVITY']

  error_model:
    - name: D_IgG_observation
      units: centimeter^2 / second
      uses_inputs: [D_IgG_tumor_typical, um2s_to_cm2s, D_dex3_free, D_dex3_cortex, D_dex70_free, D_dex70_cortex, n_dex3_cortex, n_dex70_cortex]
      sample_size_input: n_dex70_cortex
      observation_code: |
        def derive_observation(inputs, sample_size, rng, n_bootstrap):
            import numpy as np
            # Primary estimate: IgG D ~ 10 um2/s = 1e-6 cm2/s from Thurber review
            D_IgG_cm2s = inputs['D_IgG_tumor_typical'] * inputs['um2s_to_cm2s']
            # Cross-check with tortuosity from dextran data
            # lambda_3kDa = sqrt(D_free/D_cortex) for 3 kDa probe
            lam_3 = np.sqrt(inputs['D_dex3_free'] / inputs['D_dex3_cortex'])
            # lambda_70kDa for 70 kDa probe
            lam_70 = np.sqrt(inputs['D_dex70_free'] / inputs['D_dex70_cortex'])
            # IgG (150 kDa) will have tortuosity >= dex70
            # Bootstrap over the two tortuosity estimates
            lam_samples = rng.uniform(lam_70, lam_70 * 1, n_bootstrap)
            # Use lognormal around IgG consensus value
            cv = (lam_70 - lam_3) / (lam_3 + lam_70) * 2
            return rng.lognormal(np.log(D_IgG_cm2s), cv / np.sqrt(sample_size), n_bootstrap)

  identifiability_notes: >
    IgG diffusivity in tumor tissue is constrained by multiple primary studies
    cited in Thurber2008 review, plus independent dextran diffusion measurements
    from Thorne2006 providing a size-dependent framework. The value 10 um2/s
    (1e-7 cm2/s) is the field consensus for IgG in solid tumors.

experimental_context:
  species: human
  indication: cancer
  system: ex_vivo

source_relevance:
  indication_match: related
  indication_match_justification: >
    Thurber2008 reviews IgG diffusion in various tumor xenograft models.
    IgG diffusivity depends on tumor interstitial structure (void fraction,
    ECM density) which varies between tumor types but is broadly similar
    across solid tumors. PDAC desmoplastic stroma may reduce D somewhat.
  species_source: human
  species_target: human
  source_quality: review_article
  perturbation_type: physiological_baseline
  perturbation_relevance: >
    Baseline biophysical measurements of antibody diffusion in tumor tissue.
    No drug perturbation; values reflect native tumor interstitial transport.
  tme_compatibility: moderate
  tme_compatibility_notes: >
    Review covers various tumor types. PDAC has denser desmoplastic stroma
    than many tumors studied, which could reduce effective IgG diffusivity
    by 2-3x relative to the consensus 10 um2/s value.
  measurement_directness: direct
  temporal_resolution: snapshot_or_equilibrium
  experimental_system: ex_vivo

study_interpretation: >
  Thurber et al. 2008 is the definitive review of antibody transport in
  solid tumors. The consensus value of D ~ 10 um2/s (1e-7 cm2/s) for IgG
  is supported by FRAP, photobleaching, and radiolabel diffusion experiments
  across multiple tumor types. This is approximately 4x lower than free
  solution, consistent with Thorne2006 tortuosity measurements for similar-
  sized macromolecules in brain ECS.

key_assumptions:
  - IgG diffusivity is broadly similar across solid tumor types
  - Review consensus value is representative of the field
  - PDAC desmoplastic stroma may reduce effective D vs average tumor

key_study_limitations:
  - Review article (not primary data), though citing 5+ primary studies
  - Most primary data from xenograft models, not human tumors
  - PDAC-specific data not available

primary_data_source:
  doi: "10.1016/j.addr.2008.04.012"
  source_tag: Thurber2008
  title: "Antibody tumor penetration: Transport opposed by systemic and antigen-mediated clearance"
  authors:
    - "Thurber"
    - "Schmidt"
    - "Wittrup"
  year: 2008

secondary_data_sources:
  - doi: "10.1073/pnas.0509425103"
    source_tag: Thorne2006
    title: "In vivo diffusion analysis with quantum dots and dextrans predicts the width of brain extracellular space"
    authors:
      - "Thorne"
      - "Nicholson"
    year: 2006

tags: [molecular, diffusivity, antibody, IgG, macromolecule, tumor]
