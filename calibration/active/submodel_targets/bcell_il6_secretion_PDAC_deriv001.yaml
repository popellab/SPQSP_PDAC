target_id: bcell_il6_secretion

inputs:
  - name: cells_per_mL_mantissa_low
    value: 2
    units: dimensionless
    input_type: direct_measurement
    source_ref: Hanten2008
    source_location: "Methods, Cell preparation and stimulation (p.13 of PDF)"
    value_snippet: "resuspended in X-vivo 20 medium (BioWhitaker serum free medium, Cambrex Bio Science Walkersville Inc., Walkersville, MD) at 2–3 × 106"
    rationale: "Lower bound mantissa of the paper's cells/mL range (2–3 × 10^6). Split from the 10^6 scale factor to allow snippet substring matching."

  - name: cells_per_mL_mantissa_high
    value: 3
    units: dimensionless
    input_type: direct_measurement
    source_ref: Hanten2008
    source_location: "Methods, Cell preparation and stimulation (p.13 of PDF)"
    value_snippet: "X-vivo 20 medium (BioWhitaker serum free medium, Cambrex Bio Science Walkersville Inc., Walkersville, MD) at 2–3 × 106"
    rationale: "Upper bound mantissa of the paper's cells/mL range (2–3 × 10^6)."

  - name: cells_per_mL_scale
    value: 1000000
    units: cell / milliliter
    input_type: unit_conversion
    source_ref: Hanten2008
    source_location: "Methods, Cell preparation and stimulation"
    rationale: "Decimal expansion of the 10^6 scale factor in the paper's '2–3 × 10^6 cells/mL' notation."

  - name: cells_per_mL_mantissa_midpoint
    value: 2.5
    units: dimensionless
    input_type: derived_arithmetic
    source_inputs: [cells_per_mL_mantissa_low, cells_per_mL_mantissa_high]
    formula: "(cells_per_mL_mantissa_low + cells_per_mL_mantissa_high) / 2"
    source_ref: Hanten2008
    source_location: "Derived midpoint of the 2-3 × 10^6 cells/mL stated range"
    rationale: "Take the arithmetic midpoint of the paper's seeding-density range. The forward-model per-cell rate is approximately invariant to seeding density within this 1.5× span (cells/mL × volume cancels into a per-cell quantity), so the midpoint is a defensible point estimate; the range is captured implicitly in the translation_uncertainty downstream."

  - name: cells_per_mL_suspension
    value: 2500000
    units: cell / milliliter
    input_type: derived_arithmetic
    source_inputs: [cells_per_mL_mantissa_midpoint, cells_per_mL_scale]
    formula: "cells_per_mL_mantissa_midpoint * cells_per_mL_scale"
    source_ref: Hanten2008
    source_location: "Derived working suspension density"
    rationale: "2.5 × 1e6 = 2.5e6 cells/mL, the working B cell density adjusted for stimulation."

  - name: per_mL_basis_volume
    value: 1.0
    units: milliliter
    input_type: unit_conversion
    source_ref: Hanten2008
    source_location: "Forward-model normalization basis"
    rationale: "Hanten's Methods state cells/mL but do not specify the per-well working volume. Because the batch_accumulation forward model is mathematically invariant to well volume when cells_per_well = cells_per_mL × volume (the volume terms cancel: [conc] = sec_rate · cells/V · time · MW = sec_rate · cells_per_mL · time · MW), we adopt a 1-mL normalization basis and let cells_per_well = cells_per_mL_suspension × 1 mL = 2.5e6 cells. This produces a per-cell rate identical to using any other well volume × cells_per_well combination."

  - name: cells_per_well
    value: 2500000
    units: cell
    input_type: derived_arithmetic
    source_inputs: [cells_per_mL_suspension, per_mL_basis_volume]
    formula: "cells_per_mL_suspension * per_mL_basis_volume"
    source_ref: Hanten2008
    source_location: "Derived from cells/mL × 1-mL normalization basis"
    rationale: "Effective cells per 'well' under the 1-mL normalization basis. The actual per-well count in Hanten depends on the (unstated) plate format, but the per-cell rate is invariant — see per_mL_basis_volume rationale."

  - name: incubation_time_h
    value: 24
    units: hour
    input_type: direct_measurement
    source_ref: Hanten2008
    source_location: "Fig 3 caption (p.7 of PDF)"
    value_snippet: "stimulated with the indicated IRM or with CpG2006 for 2, 8 or 24 hours"

  - name: seconds_per_hour
    value: 3600
    units: second / hour
    input_type: unit_conversion
    source_ref: Hanten2008
    source_location: "Forward-model unit convention"
    rationale: "SI conversion. PARAM_BCELL_IL6_RELEASE has units pmol/(cell*s) so the incubation duration must be supplied in seconds."

  - name: incubation_time_s
    value: 86400
    units: second
    input_type: derived_arithmetic
    source_inputs: [incubation_time_h, seconds_per_hour]
    formula: "incubation_time_h * seconds_per_hour"
    source_ref: Hanten2008
    source_location: "Derived from Methods (24-h supernatant collection)"
    rationale: "Convert 24 h to seconds for the batch_accumulation forward model whose secretion rate is per second."

  - name: IL6_MW
    value: 21000
    units: gram / mole
    input_type: unit_conversion
    source_ref: Hanten2008
    source_location: "Forward-model unit convention (UniProt P05231 mature human IL-6)"
    rationale: "Mature secreted human IL-6 is the 184-aa cleaved monomer (UniProt P05231 residues 29-212, MW ~20.8 kDa for unglycosylated form). Native IL-6 from primary cells is partially N-/O-glycosylated to 21-26 kDa; Luminex xMAP human IL-6 standards are calibrated to a recombinant E. coli-expressed standard around 20.8 kDa. 21,000 g/mol used as the representative MW for the batch_accumulation conversion between molar secretion rate and mass concentration."

  - name: n_donors
    value: 3
    units: dimensionless
    input_type: direct_measurement
    source_ref: Hanten2008
    source_location: "Fig 3 caption, Abstract"
    figure_excerpt:
      figure_id: "Figure 3 caption"
      value: "3 different donors"
      description: "Sample size for Fig 3 — 'Purified B cells from 3 different donors were stimulated'. n=3 biological donor replicates."
      context: "Hanten studied B cells from 3 different healthy human donors and reported mean+SEM across the donors in Fig 3B. This is biological (not technical) replication, which is a stronger sampling unit than the n=3 triplicate in Iwata2011 Fig 5F (T5b)."

  - name: fig3b_cpg2006_24h_mean
    value: 1500
    units: picogram / milliliter
    input_type: direct_measurement
    source_ref: Hanten2008
    source_location: "Figure 3B (Page 7 of PDF), CpG 2006 condition, 24 hr bar"
    figure_excerpt:
      figure_id: "Figure 3B"
      value: "~1500 pg/mL"
      description: "Bar height for the CpG 2006 condition at 24 hr on a log-scale y-axis (10, 100, 1000, 10000, 100000 pg/mL). Visual readout: the bar reaches approximately 18-25% of the way from the 1000 gridline to the 10000 gridline, corresponding visually to ~1500-1800 pg/mL on a log scale. Conservative midpoint 1500 pg/mL adopted."
      context: "Fig 3B shows secreted IL-6 in pg/mL on a log y-axis (10 → 100000) for Vehicle, 3M-006 (inactive analog control), 3M-003 (TLR7/8), 852A (TLR7), 3M-002 (TLR8), and CpG 2006 (TLR9), with paired 8 hr and 24 hr bars. CpG 2006 is the TLR9 agonist and is the canonical human B cell activator most analogous to in vivo unmethylated CpG-DNA encountered by activated B cells. Vehicle baseline at 24 hr is ~300-500 pg/mL, so the CpG-induced IL-6 is ~3-5× over baseline."

  - name: fig3b_cpg2006_24h_sem
    value: 500
    units: picogram / milliliter
    input_type: direct_measurement
    source_ref: Hanten2008
    source_location: "Figure 3B (Page 7 of PDF), CpG 2006 24 hr error bar"
    figure_excerpt:
      figure_id: "Figure 3B"
      value: "~500 pg/mL SEM"
      description: "Upper error bar of the CpG 2006 24 hr bar; visual offset of the cap above the bar top measured against the log gridlines. Bars in Fig 3B show modest absolute-scale error bars typical of 3-donor Luminex multiplex; SEM estimated at ~500 pg/mL on the mean of 1500. SD ≈ SEM × √n = 866 pg/mL."
      context: "n=3 biological donor replicates per figure caption."

calibration:
  parameters:
    - name: PARAM_BCELL_IL6_RELEASE
      units: picomole / (cell * second)

  forward_model:
    type: batch_accumulation
    secretion_rate: PARAM_BCELL_IL6_RELEASE
    cell_count: {input_ref: cells_per_well}
    incubation_time: {input_ref: incubation_time_s}
    molecular_weight: {input_ref: IL6_MW}
    medium_volume: {input_ref: per_mL_basis_volume}
    unit_conversion_factor: "1.0"
    data_rationale: |
      Hanten 2008 Fig 3B is a standard in vitro batch-accumulation Luminex
      multiplex readout: 2.5e6 purified human peripheral CD19+ B cells per mL
      in X-vivo 20 serum-free medium + 3 μM CpG 2006 (ODN, TLR9 agonist) for
      24 h; Luminex xMAP IL-6 multiplex on the supernatant. Predicted
      accumulation: [IL-6] (pg/mL) = sec_rate (pmol/cell/s) * 2.5e6 (cells) *
      86400 (s) * 21000 (g/mol = pg/pmol) / 1 (mL) = sec_rate * 4.536e15
      (pg/mL per pmol/cell/s). At the measured ~1500 pg/mL this gives
      sec_rate ≈ 3.3e-13 pmol/cell/s. This directly constrains the per-cell
      IL-6 secretion rate that the PDAC ABM applies to all BCELL_ACTIVATED
      cells (whether or not is_breg-flagged; the IL-6 production pathway is
      separate from the IL-10/Breg pathway at b_cell.cuh:304-306).
    submodel_rationale: |
      In the PDAC ABM, every living B cell in state BCELL_ACTIVATED atomically
      adds PARAM_BCELL_IL6_RELEASE / voxel_volume to the local IL-6 PDE source
      array each ABM step (b_cell.cuh:304-306), independent of the is_breg
      flag. Naive B cells (BCELL_NAIVE) and plasma cells (BCELL_PLASMA)
      secrete zero IL-6 in this pathway. The Hanten 2008 CpG 2006-stimulated
      bulk CD19+ B cell rate is a direct in vitro proxy for the activated-B
      cell IL-6 output. Caveats: (1) Hanten studied bulk B cells (naive +
      memory + plasma) but only the activated fraction is actively secreting;
      the measured supernatant rate is an aggregate that includes non-
      activated cells contributing ~0 pg/cell/s. The per-activated-cell rate
      may therefore be modestly higher than the bulk per-cell rate computed
      here. (2) The PDAC TLS in vivo activator is Tfh-derived IL-21 + BAFF
      from FDCs, not CpG-DNA, so the stimulus-pathway translation contributes
      uncertainty. Both gaps are absorbed via the source_relevance
      translation_uncertainty rather than corrected pre-inference.

  error_model:
    - name: cpg_b_cell_il6_supernatant_pg_per_mL
      units: picogram / milliliter
      uses_inputs: [fig3b_cpg2006_24h_mean, fig3b_cpg2006_24h_sem, n_donors]
      sample_size_input: n_donors
      observation_code: |
        def derive_observation(inputs, sample_size, rng, n_bootstrap):
            import numpy as np
            mean = inputs['fig3b_cpg2006_24h_mean']
            sem = inputs['fig3b_cpg2006_24h_sem']
            return rng.normal(mean, sem, n_bootstrap)

  identifiability_notes: |
    Single parameter PARAM_BCELL_IL6_RELEASE constrained by one direct
    observation (the Fig 3B CpG 2006 24-h IL-6 supernatant). The
    batch_accumulation forward model is bijective between sec_rate and
    supernatant concentration given fixed cells/time/MW/volume — no
    identifiability ambiguity within the assay. Inference quality is limited
    by (a) the n=3 donor SEM uncertainty (~33% relative on the mean), (b)
    the bulk-CD19 vs activated-B-only translation gap (only the activated
    fraction is secreting, so per-bulk-cell rate is a weighted average),
    (c) the ex-vivo CpG vs in-vivo PDAC TLS activator (IL-21 + BAFF) stimulus
    translation, and (d) the log-scale visual readout uncertainty in Fig 3B
    (bar position estimable to ~±0.2 log units). The legacy 2e-7 pmol/cell/s
    XML default is a unit-conversion error (1e-7 × 2.5e6 × 24h × 3600 ×
    21,000 / 1 = 1.81e15 pg/mL = 1.8 kg/mL IL-6, physically impossible);
    prior re-anchored to Hanten-implied 3e-13 with σ broadened to 1.0 ahead
    of MAPLE.

experimental_context:
  species: human
  indication: healthy_immune_cells
  system: in_vitro_primary
  cell_lines:
    - name: human_purified_CD19_pos_B_cells_bulk
      species: human
      tissue_origin: peripheral_blood
      cell_type: B_cell_CD19_pos_mixed_naive_memory_plasma
      source: "Healthy human donor peripheral blood, Ficoll-Paque, immunomagnetic depletion (anti-non-B microbeads via AutoMACS), then flow sort to remove pDC contaminants. Final purity ≥99% CD19+, mixture of naive and memory B cells."
  culture_conditions:
    medium: "X-vivo 20 (BioWhittaker, serum-free)"
    serum_concentration: 0
    serum_concentration_units: "% FBS"
    culture_type: "suspension_short_term"
    duration: "24 h"
    oxygen_level: "normoxic"
    notes: "2-3 × 10^6 cells/mL suspension; stimulated with 3 μM CpG 2006 (TLR9 selective synthetic ODN). Conditioned media collected at 24 h. Luminex xMAP / Luminex 100 System (Biosource / Luminex Corp) for IL-6 quantification. Per-well volume not stated by the paper."

source_relevance:
  indication_match: proxy
  indication_match_justification: >
    Data are from healthy-donor peripheral blood purified CD19+ B cells, not
    PDAC TLS-resident activated B cells. The cellular target (CD19+ B cell
    under TLR/activation signal) maps directly to the ABM's BCELL_ACTIVATED
    state at the gene-program level. The proxy distance is primarily the
    blood-to-tissue and healthy-to-PDAC TME translation rather than a
    cell-type misidentification. The CpG2006 stimulus also activates a
    broader cytokine program (IL-1β, IL-2, IL-6, IL-8, CCL3, CCL4) consistent
    with the ABM's coarse "activated B cell secretes IL-6" abstraction.
  species_source: human
  species_target: human
  source_quality: primary_human_in_vitro
  perturbation_type: pharmacological
  perturbation_relevance: >
    CpG 2006 (synthetic ODN, TLR9 agonist) is the canonical ex vivo human B
    cell activator and the standard in B cell IL-6 secretion studies. The
    in vivo PDAC TLS B cell activators are inferred to include Tfh-derived
    IL-21, FDC-derived BAFF/APRIL, and CD40L from cognate Tfh contact —
    different signaling pathways than CpG-TLR9. Both pathways converge on
    NF-κB / STAT3-driven IL-6 transcription, so the per-cell rate is
    expected to be of the same order of magnitude under saturating
    activation, but pathway-specific magnitude differences are captured in
    translation_uncertainty.
  tme_compatibility: low
  tme_compatibility_notes: >
    Three translation gaps: (1) cell-type purity — Hanten studied bulk
    purified CD19+ B cells (naive + memory) under CpG; only a fraction of
    cells is actively activated and contributing to the supernatant pool.
    The ABM specifically models BCELL_ACTIVATED as the secreting cells, so
    the per-bulk-B-cell rate is a lower bound on the per-activated-cell
    rate (the difference is captured by the BCELL_ACTIVATED-vs-NAIVE state
    transition logic in the ABM, not by the per-cell rate parameter itself).
    (2) Stimulus — ex vivo CpG2006 (3 μM, TLR9-selective) vs in vivo PDAC
    TLS cognate Tfh-B interaction (IL-21 + CD40L + BAFF). (3) Tissue
    context — suspension X-vivo 20 culture (serum-free) without surrounding
    stroma, hypoxia, or chronic TGF-β suppression characteristic of PDAC
    tumor microenvironment. translation_uncertainty in the inference is
    expected to dominate posterior variance.
  measurement_directness: proxy_observable
  temporal_resolution: endpoint_pair
  experimental_system: in_vitro_primary

study_interpretation: >
  Hanten et al. 2008 was the first comprehensive comparison of TLR7 vs TLR9
  agonist effects on human B cell gene-expression and cytokine secretion
  programs. CpG 2006 (TLR9 agonist) emerged as the strongest IL-6 inducer
  among the agonists tested. Figure 3B is the quantitative anchor for the
  per-activated-B-cell IL-6 secretion rate: 2.5 × 10^6 purified CD19+ B
  cells per mL (range 2-3 × 10^6), 3 μM CpG 2006 in X-vivo 20 serum-free
  medium, 24 h conditioning, Luminex xMAP IL-6 multiplex on the supernatant
  produces a mean of approximately 1500 pg/mL (SEM ~500 pg/mL, n=3 donors).
  Converting via the batch_accumulation forward model with mature IL-6 MW =
  21 kDa yields a per-cell rate of approximately 3.3e-13 pmol/cell/s. The
  legacy XML default of 2e-7 pmol/cell/s is a unit-conversion error
  (implies 1.8 kg/mL of IL-6 supernatant under Hanten's protocol — exceeds
  total cell mass by ~9 orders of magnitude). The CSV/ledger prior was
  therefore re-anchored to median 3e-13 with σ broadened from 0.7 to 1.0
  ahead of inference. This is the THIRD consecutive BCELL_*_RELEASE
  parameter in the T5 series to surface a unit-conversion error (T5a
  antibody was 1296× off, T5b IL10 was 2.05M× off, T5c IL6 is 6.05e5× off);
  the systematic miscalibration of B-cell secretion-rate defaults in the
  legacy XML strongly suggests they were never independently spot-checked
  against literature data. The posterior is expected to land near the
  Hanten-implied 3e-13 with modest spread driven by translation uncertainty.

key_assumptions:
  - "Hanten's stated cells/mL range (2-3 × 10^6) is well-approximated by its midpoint 2.5 × 10^6 cells/mL. The 1.5× range maps to ≤0.18 nat-log units of additional uncertainty on the inferred per-cell rate, which is small relative to the translation_uncertainty contribution from the bulk-B vs activated-B-only translation."
  - "The unspecified per-well volume normalizes out of the per-cell rate calculation. We adopt a 1-mL basis for the forward model; any other consistent volume×cells_per_well combination gives identical results."
  - "Mature secreted human IL-6 MW is 21 kDa (UniProt P05231 monomer ~20.8 kDa + native glycosylation to 21-26 kDa). Luminex IL-6 standards are calibrated to recombinant E. coli IL-6 around 20.8 kDa; the 21 kDa choice is within calibration tolerance."
  - "B cell number is approximately constant over the 24 h CpG incubation. Hanten reports IL6 mRNA induction at 24 h with sustained protein secretion, consistent with a viable proliferating population; no extensive cell death observed."
  - "The 24 h timepoint represents a near-saturating output for the CpG2006 stimulus (Hanten shows comparable IL-6 levels at 8 h and 24 h in Fig 3B). The per-cell rate computed via batch_accumulation is therefore the time-averaged secretion rate at the activated-B cell peak-output phase, which matches the ABM's flat-rate continuous-secretion abstraction."
  - "Bulk CD19+ B cell rate is a lower bound on per-activated-B-cell rate. The bulk-vs-activated translation is captured implicitly in translation_uncertainty; the BCELL_NAIVE→BCELL_ACTIVATED transition logic in the ABM handles which cells actually secrete."

key_study_limitations:
  - "n=3 donors is a small biological replicate count. Cross-donor IL-6 secretion variability in healthy adults is moderate (10-fold range per Hanten's own observations); the SEM may underestimate population variability."
  - "Log-scale visual figure readout. Fig 3B values were read directly from the printed bars against a log-scale y-axis (10, 100, 1000, 10000, 100000 pg/mL). Reading position ~±0.2 log-units (~±60% on the mean) — comparable to but coarser than linear-axis figure readouts."
  - "Per-well volume not stated by the paper. The cells/mL and time are sufficient to compute the per-cell rate via the V-cancels argument, but rigorous interpretation requires assuming Hanten followed standard 96-well or 24-well protocols. No volume-dependent kinetic effects (e.g., autocrine IL-6 feedback at high cell density) are correctable from the available data."
  - "Bulk CD19+ B cell purity: Hanten's protocol gives ≥99% CD19+ but includes both naive (CD27-) and memory (CD27+) cells. The per-cell IL-6 rate may differ substantially between these subsets; Agrawal 2011 (DOI 10.1007/s10875-010-9456-8) reports memory cells secrete more IL-6 per cell than naive under TLR9 stimulation, though absolute pg/mL not extracted from Agrawal."
  - "Luminex multiplex readouts can be ~2× less accurate than ELISA at the low end of the dynamic range (10-100 pg/mL). The CpG2006 1500 pg/mL value is well within the linear range and not expected to suffer from this; vehicle baseline (~300-500 pg/mL) is in the upper tail of the limit-of-quantitation range and is not used directly here."
  - "Stimulus-pathway mismatch: CpG2006 is TLR9; in vivo PDAC TLS B cells activated by Tfh use TLR-independent BCR + CD40 + IL-21 signaling. Both converge on NF-κB / STAT3, but the per-cell IL-6 magnitudes from the two pathways have not been compared head-to-head in published human data."

primary_data_source:
  doi: "10.1186/1471-2172-9-39"
  source_tag: Hanten2008
  title: "Comparison of human B cell activation by TLR7 and TLR9 agonists"
  authors:
    - "Hanten"
    - "Vasilakos"
    - "Riter"
    - "Neys"
    - "Lipson"
    - "Alkan"
    - "Birmachu"
  year: 2008

tags: [IL6, IL-6, B_cell, activated_B_cell, secretion, batch_accumulation, CpG, TLR9, Luminex, PDAC, TLS]
