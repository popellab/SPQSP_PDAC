target_id: bcell_breg_il10_secretion

inputs:
  - name: cells_per_well_mantissa
    value: 4
    units: dimensionless
    input_type: direct_measurement
    source_ref: Iwata2011
    source_location: "Methods, Analysis of IL-10 production (p. cited as page 7 of Iwata2011 PMC version)"
    value_snippet: "Purified B cells (4 x 105) were cultured in 0.2 ml of"
    rationale: "Mantissa of the paper's scientific-notation cells/well count (4 × 10^5). Split from the 10^5 scale factor to allow snippet substring matching against the PDF's plain-text rendering of the superscripted value."

  - name: cells_per_well_scale
    value: 100000
    units: cell
    input_type: unit_conversion
    source_ref: Iwata2011
    source_location: "Methods, Analysis of IL-10 production"
    rationale: "Decimal expansion of the 10^5 scale factor in the paper's '4 × 10^5' notation. Combined with the mantissa to yield the per-well cell count used in the batch_accumulation forward model."

  - name: cells_per_well
    value: 400000
    units: cell
    input_type: derived_arithmetic
    source_inputs: [cells_per_well_mantissa, cells_per_well_scale]
    formula: "cells_per_well_mantissa * cells_per_well_scale"
    source_ref: Iwata2011
    source_location: "Derived from mantissa × scale factor of the paper's stated cells/well"
    rationale: "4 × 1e5 = 4e5 sorted CD24hiCD27+ B cells per well. Note: although the Methods state '4 × 10^5' as the bulk-B-cell starting count for ELISA, Fig 5F caption confirms the sorted-subset cultures used the same protocol; we adopt 4e5 as the working sorted-subset count."

  - name: well_volume_mL
    value: 0.2
    units: milliliter
    input_type: direct_measurement
    source_ref: Iwata2011
    source_location: "Methods, Analysis of IL-10 production"
    value_snippet: "Purified B cells (4 x 105) were cultured in 0.2 ml of"
    rationale: "Working medium volume per 96-well flat-bottom well. ELISA is performed on the supernatant of this 200 μL volume after 72 h."

  - name: incubation_time_h
    value: 72
    units: hour
    input_type: direct_measurement
    source_ref: Iwata2011
    source_location: "Figure 5F caption (Results, B10/B10pro phenotyping)"
    value_snippet: "cell subsets as in (E) and cultured with the indicated stimuli for 72 h"

  - name: seconds_per_hour
    value: 3600
    units: second / hour
    input_type: unit_conversion
    source_ref: Iwata2011
    source_location: "Forward-model unit convention"
    rationale: "SI conversion. PARAM_BCELL_IL10_RELEASE has units pmol/(cell*s) so the incubation duration must be supplied in seconds."

  - name: incubation_time_s
    value: 259200
    units: second
    input_type: derived_arithmetic
    source_inputs: [incubation_time_h, seconds_per_hour]
    formula: "incubation_time_h * seconds_per_hour"
    source_ref: Iwata2011
    source_location: "Derived from Fig 5F caption (72 h)"
    rationale: "Convert 72 h to seconds for the batch_accumulation forward model whose secretion rate is per second."

  - name: IL10_MW
    value: 18500
    units: gram / mole
    input_type: unit_conversion
    source_ref: Iwata2011
    source_location: "Forward-model unit convention (UniProt P22301 mature human IL-10)"
    rationale: "Mature secreted human IL-10 is the 160-aa cleaved monomer (UniProt P22301 residues 19-178, MW ~18.5 kDa). The BD OptEIA Human IL-10 ELISA detects mature IL-10 (homodimer in solution but quantified as per-mature-monomer mass equivalents). 18,500 g/mol converts between molar secretion rate (pmol/cell/s) and mass concentration (pg/mL). The 36-kDa homodimer form is the bioactive species but the assay calibration standard is monomer-mass-equivalent so 18.5 kDa is the correct MW for the forward model."

  - name: n_triplicate
    value: 3
    units: dimensionless
    input_type: direct_measurement
    source_ref: Iwata2011
    source_location: "Figure 5F caption"
    figure_excerpt:
      figure_id: "Figure 5F caption"
      value: "triplicate ELISA determinations"
      description: "Sample size for Fig 5F bars — 'triplicate' = n=3 technical replicates per cell-type × stim condition combination."
      context: "Iwata's caption states 'Bar graphs indicate mean IL-10 (±SEM) concentrations from triplicate ELISA determinations' without specifying whether triplicates are technical or biological replicates. We adopt n=3 as the conservative interpretation; whether these are 3 technical wells of a single donor or 3 biological donors is unresolved by the caption alone, addressed in key_study_limitations."

  - name: fig5f_cd24hi_cd40l_cpg_mean
    value: 450
    units: picogram / milliliter
    input_type: direct_measurement
    source_ref: Iwata2011
    source_location: "Figure 5F (right panel, 0-500 pg/mL y-axis), CD24hiCD27+ bar under CD40L+CpG condition"
    figure_excerpt:
      figure_id: "Figure 5F"
      value: "~450 pg/mL"
      description: "Bar height for the open (CD24hiCD27+) bar in the right-hand panel of Fig 5F under the rightmost x-axis condition (CD40L+, LPS-, CpG+). Visual readout against the 0/100/200/300/400/500 pg/mL gridlines, value rounded to nearest 25 pg/mL. The ## significance markers indicate p<0.01 vs media."
      context: "Fig 5F shows IL-10 ELISA on 72-h supernatants from sorted CD24hiCD27+ (open) vs CD24lowCD27- (filled) blood B cells under combinations of CD40L, LPS, CpG. Right panel zooms the two high-magnitude CpG-containing conditions on a separate 0-500 pg/mL y-axis (left panel is 0-40 pg/mL for non-CpG conditions). CD40L+CpG is the most potent stimulus per the paper's discussion (Results §'Regulation of B10 cell IL-10 production and secretion in vitro')."

  - name: fig5f_cd24hi_cd40l_cpg_sem
    value: 25
    units: picogram / milliliter
    input_type: direct_measurement
    source_ref: Iwata2011
    source_location: "Figure 5F (right panel), CD24hiCD27+ CD40L+CpG error bar"
    figure_excerpt:
      figure_id: "Figure 5F"
      value: "~25 pg/mL SEM"
      description: "Upper error bar of the CD24hiCD27+ bar under CD40L+CpG in the right panel; visual offset of the cap above the bar top against the y-axis gridlines, ~20-30 pg/mL, midpoint 25 pg/mL."
      context: "n=3 triplicate ELISA determinations per figure caption. SEM converted to SD via SD = SEM*sqrt(n) ≈ 43 pg/mL in the observation_code derivation step."

calibration:
  parameters:
    - name: PARAM_BCELL_IL10_RELEASE
      units: picomole / (cell * second)

  forward_model:
    type: batch_accumulation
    secretion_rate: PARAM_BCELL_IL10_RELEASE
    cell_count: {input_ref: cells_per_well}
    incubation_time: {input_ref: incubation_time_s}
    molecular_weight: {input_ref: IL10_MW}
    medium_volume: {input_ref: well_volume_mL}
    unit_conversion_factor: "1.0"
    data_rationale: |
      Iwata 2011 Fig 5F right panel is a standard in vitro batch-accumulation
      ELISA: 4e5 sorted CD24hiCD27+ blood B cells per well in 0.2 mL complete
      medium + CpG (ODN 2006, 10 μg/mL) + sCD40L (1 μg/mL) for 72 h; BD OptEIA
      Human IL-10 ELISA on the 200 μL supernatant. Predicted accumulation:
      [IL-10] (pg/mL) = sec_rate (pmol/cell/s) * 4e5 (cells) * 259200 (s) *
      18500 (g/mol = pg/pmol) / 0.2 (mL) = sec_rate * 9.59e15 (pg/mL per
      pmol/cell/s). At the measured 450 pg/mL this gives sec_rate ≈ 4.7e-14
      pmol/cell/s. This directly constrains the per-Breg-cell continuous IL-10
      secretion rate that the PDAC ABM applies to is_breg-flagged B cells in
      both ACTIVATED and PLASMA states.
    submodel_rationale: |
      In the PDAC ABM, every living B cell carrying the is_breg flag (set at
      naive→activated transition with probability PARAM_BCELL_BREG_FRACTION =
      0.05) atomically adds PARAM_BCELL_IL10_RELEASE / voxel_volume to the
      local IL-10 PDE source array each ABM step, in both the BCELL_ACTIVATED
      and BCELL_PLASMA states (b_cell.cuh:292 plasma branch and b_cell.cuh:310
      activated branch). Non-Breg-flagged cells secrete zero IL-10 in this
      pathway (M2 macrophages cover the dominant TME IL-10 source via a
      separate parameter). The Iwata 2011 CD24hiCD27+ B10-equivalent subset is
      the human ex vivo cellular counterpart of the ABM's is_breg flag —
      Iwata's Fig 5F-G demonstrates that this CD24hiCD27+CD48hiCD148hi subset
      is the predominant source of IL-10 among human peripheral B cells, with
      ~5-9% prevalence (Pylayeva-Gupta 2019 SciRep PDAC-specific Breg estimate
      that anchors PARAM_BCELL_BREG_FRACTION = 0.05). CD40L+CpG is the most
      potent stimulus combination in the Iwata data, giving a "maximum
      sustained-secretion" rate for fully activated B10 cells, which matches
      the ABM's no-gating continuous-secretion abstraction for is_breg cells.

  error_model:
    - name: cd24hi_cd27_pos_il10_supernatant_pg_per_mL
      units: picogram / milliliter
      uses_inputs: [fig5f_cd24hi_cd40l_cpg_mean, fig5f_cd24hi_cd40l_cpg_sem, n_triplicate]
      sample_size_input: n_triplicate
      observation_code: |
        def derive_observation(inputs, sample_size, rng, n_bootstrap):
            import numpy as np
            mean = inputs['fig5f_cd24hi_cd40l_cpg_mean']
            sem = inputs['fig5f_cd24hi_cd40l_cpg_sem']
            return rng.normal(mean, sem, n_bootstrap)

  identifiability_notes: |
    Single parameter PARAM_BCELL_IL10_RELEASE constrained by one direct
    observation (the Fig 5F CD40L+CpG CD24hiCD27+ supernatant at 72 h). The
    batch_accumulation forward model is bijective between sec_rate and
    supernatant concentration given fixed cells/time/MW/volume — no
    identifiability ambiguity within the assay. Inference quality is limited
    by (a) the n=3 triplicate SEM uncertainty, (b) the cell-type translation
    from sorted blood CD24hiCD27+ B10 cells to PDAC-tumor-infiltrated
    is_breg-flagged B cells, (c) the stimulation translation from CpG+sCD40L
    ex vivo to the in vivo PDAC TLS cytokine milieu (IL-21, IL-6, BAFF,
    APRIL), and (d) the well-documented dose-response shape in Fig 5F (CpG
    alone gives ~270 pg/mL; CpG+CD40L gives ~450 pg/mL) suggesting the
    saturating max may sit somewhat higher than the chosen anchor. The legacy
    1e-7 pmol/cell/s XML default is a unit-conversion error (1e-7 × 4e5 × 72h
    × 3600 × 18,500 / 0.2 = 1.92e11 pg/mL = 192 g/mL supernatant, physically
    impossible); prior re-anchored to Iwata-implied 5e-14 with σ broadened to
    1.0 ahead of MAPLE.

experimental_context:
  species: human
  indication: healthy_immune_cells
  system: in_vitro_primary
  cell_lines:
    - name: human_sorted_CD24hi_CD27pos_B10_cells
      species: human
      tissue_origin: peripheral_blood
      cell_type: regulatory_B10_CD24hi_CD27pos
      source: "Freshly isolated from healthy donor PBMC by Ficoll-Paque, CD19+ B cell positive selection, then FACS sort on CD24hiCD27+ phenotype (purity >90% per Methods)."
  culture_conditions:
    medium: "Complete medium (RPMI 1640 + 10% FBS + L-glutamine + penicillin/streptomycin per the paper's general B cell culture protocol)"
    serum_concentration: 10
    serum_concentration_units: "% FBS"
    culture_type: "suspension_short_term"
    duration: "72 h"
    oxygen_level: "normoxic"
    notes: "4e5 sorted CD24hiCD27+ B cells per 0.2 mL well in 96-well flat-bottom plates. Stimuli: ODN 2006 CpG 10 μg/mL + soluble CD40L 1 μg/mL (BioLegend). BD OptEIA Human IL-10 ELISA on 72-h supernatants, triplicate determinations."

source_relevance:
  indication_match: proxy
  indication_match_justification: >
    Data are from healthy-donor peripheral blood sorted CD24hiCD27+ B cells, not
    PDAC TLS-resident regulatory B cells. The cellular phenotype (CD24hiCD27+)
    overlaps with the canonical human Breg / B10 markers used to define
    PDAC-relevant tumor-infiltrating Bregs (Pylayeva-Gupta 2019 SciRep
    PDAC-specific CD19+CD24hiCD38hi Breg). Iwata explicitly demonstrates this
    subset is the predominant IL-10 secretor among human blood B cells; the
    proxy distance is primarily the blood-to-tissue and healthy-to-PDAC TME
    translation rather than a cell-type misidentification.
  species_source: human
  species_target: human
  source_quality: primary_human_in_vitro
  perturbation_type: pharmacological
  perturbation_relevance: >
    CpG (TLR9 agonist) + soluble CD40L is the canonical ex vivo B10 stimulus
    cocktail and is established in the paper as the most potent IL-10
    inducer among single and combined TLR/CD40 signals. The in vivo PDAC TLS
    drivers of IL-10-competent B cells are inferred to include CXCL13-driven
    follicular organization, IL-21 from Tfh cells, BAFF/APRIL signaling, and
    paracrine IL-10/TGF-β from M2 macrophages — none directly mimicked by
    CpG+CD40L. The stimulus translation is therefore a known mechanism gap;
    however, the CD40L axis is in vivo-relevant (Tfh-B cell interaction in
    TLS) and CpG provides a non-specific innate-immune push that broadly
    activates B cell IL-10 machinery similar to in vivo TLR engagement.
  tme_compatibility: low
  tme_compatibility_notes: >
    Three translation gaps: (1) cell type — sorted blood CD24hiCD27+ B10
    (B10 cells) vs PDAC TLS-resident is_breg-flagged B cell. CD24hiCD27+ is
    the human peripheral B10 phenotype; the PDAC-specific Breg phenotype is
    CD19+CD24hiCD38hi (Pylayeva-Gupta 2019). Both subsets share CD24hi but
    differ on CD27/CD38, suggesting the Iwata blood Bregs are a closely
    related but not identical population. (2) Stimulation — ex vivo
    CpG+sCD40L vs in vivo PDAC TLS cytokine milieu (Tfh-derived IL-21, M2
    paracrine IL-10/TGF-β, BAFF/APRIL). (3) Tissue context — suspension
    culture without surrounding stroma, hypoxia, or chronic TGF-β
    suppression characteristic of PDAC tumor microenvironment. The ABM
    abstracts is_breg cells as continuous flat-rate IL-10 secretors; the
    Iwata Fig 5F CD40L+CpG saturating-stimulus rate represents the maximum
    sustained-output of a fully activated B10 cell, which best matches the
    ABM's no-gating abstraction. translation_uncertainty in the inference
    is expected to dominate posterior variance.
  measurement_directness: proxy_observable
  temporal_resolution: endpoint_pair
  experimental_system: in_vitro_primary

study_interpretation: >
  Iwata et al. 2011 is the foundational characterization of human B10 cells,
  establishing that the CD24hiCD27+ blood B cell subset is the predominant
  source of IL-10 among peripheral B cells and that this subset parallels the
  mouse B10 regulatory B cell population. Figure 5F is the quantitative
  anchor for the per-Breg IL-10 secretion rate: 4e5 sorted CD24hiCD27+ B cells
  per 0.2 mL well, stimulated with CpG (10 μg/mL) + soluble CD40L (1 μg/mL)
  for 72 h, produce a mean of ~450 pg/mL of secreted IL-10 in the supernatant
  (SEM ~25 pg/mL, n=3 triplicate ELISA determinations, BD OptEIA Human IL-10
  kit). Converting via the batch_accumulation forward model with mature IL-10
  MW = 18.5 kDa yields a per-cell rate of approximately 4.7e-14 pmol/cell/s.
  The legacy XML default of 1e-7 pmol/cell/s is a unit-conversion error
  (implies 1.92e11 pg/mL = 192 g/mL of IL-10 supernatant under Iwata's
  protocol, exceeding total cell mass by orders of magnitude). The CSV/ledger
  prior was therefore re-anchored to median 5e-14 with σ broadened from 0.7
  to 1.0 ahead of inference to absorb the B10-subset vs is_breg-agent mapping
  uncertainty and the ex-vivo stim vs PDAC TLS cytokine milieu gap. The
  posterior is expected to land near the Iwata-implied 5e-14 with modest
  spread driven by translation uncertainty. The PDAC-specific in vivo per-
  Breg IL-10 output is not separately quantified in any published source —
  Pylayeva-Gupta 2019 SciRep provides the PDAC Breg prevalence anchor (5-9%
  of B cells) but not per-cell secretion rate — so this represents the best
  available primary calibration target for PARAM_BCELL_IL10_RELEASE.

key_assumptions:
  - "Sorted CD24hiCD27+ B cells in Fig 5F follow the same per-well protocol as the Methods-section bulk-CD19+ B cell ELISA (4 × 10^5 cells / 0.2 mL); Methods do not separately re-state cells/volume for the sorted-subset cultures, so we adopt the bulk protocol values as the working assumption."
  - "Mature secreted human IL-10 MW is 18.5 kDa (UniProt P22301 monomer mass-equivalent); BD OptEIA Human IL-10 ELISA standard calibration is per-monomer-mass equivalents regardless of the dimer-state in solution."
  - "B cell number is approximately constant over the 72 h incubation in complete medium + CpG + sCD40L (no extensive proliferation observed in Fig 5G CFSE traces for the CpG arm at 72 h)."
  - "CpG + sCD40L stimulation saturates IL-10 secretion in CD24hiCD27+ cells. Fig 5F right panel shows CpG alone gives ~270 pg/mL and CpG+CD40L gives ~450 pg/mL — the CD40L addition produces ~1.7x increase, suggesting the chosen CpG+CD40L anchor sits near the saturating maximum rather than the dose-response midpoint."
  - "The translation from sorted CD24hiCD27+ blood B10 cells to PDAC TLS-resident is_breg-flagged B cells is captured in source_relevance.translation_uncertainty rather than corrected pre-inference, because no published per-cell IL-10 rate from primary PDAC-infiltrating Bregs exists."

key_study_limitations:
  - "n=3 triplicate ELISA determinations is a small effective sample size. Iwata describes 'triplicate' without specifying whether triplicates are technical replicates of a single biological donor or three independent biological donors. Conservative interpretation (technical replicates) means cross-donor biological variability is not captured in the SEM."
  - "Visual figure readout. Fig 5F values were read directly from the printed bars against the y-axis gridlines (0/100/200/300/400/500 pg/mL on the right panel) rather than WebPlotDigitizer extraction. Resolution ~±25 pg/mL on mean and ~±10 pg/mL on SEM."
  - "Blood B10 vs PDAC TLS Breg phenotype mismatch. Iwata defines B10 cells by CD24hiCD27+ in peripheral blood; PDAC TLS Bregs are defined by CD24hiCD38hi (Pylayeva-Gupta 2019, SciRep, DOI 10.1038/s41598-019-49581-4). Both subsets are CD24hi but differ on the second marker (CD27 = memory, CD38 = transitional/early activation). Tissue-context driven phenotype shifts are not characterized at the per-cell secretion-rate level."
  - "Ex vivo stim (CpG+sCD40L) is not the in vivo PDAC TLS B cell trigger. Tfh-derived IL-21 + BAFF/APRIL signaling + chronic TGF-β from CAFs would more closely mimic the in vivo milieu but are not used here. Stimulation-pathway differences could yield order-of-magnitude differences in per-cell rate that are captured only via wide translation uncertainty."
  - "Single endpoint timepoint (72 h). The per-cell rate computed via batch_accumulation is the time-averaged rate over the full 72 h. The instantaneous rate may peak earlier (line ~488 of the paper notes peak Il10 transcript induction at 24 h) and decline by 72 h, but the ABM treats secretion as flat-rate so the time-average is the matching observable."

