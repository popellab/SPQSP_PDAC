target_id: frc_cxcl12_secretion

inputs:
  - name: cxcl12_baseline_mean_pg_mL
    value: 67
    units: picogram / milliliter
    input_type: direct_measurement
    source_ref: Severino2017
    source_location: "Results, Cytokine and Chemokine Expression Was Induced by Inflammatory Factors (p.7-8)"
    value_snippet: "There was a moderate secretion of CXCL12 in untreated DNCs (44 ± 33 pg/mL) and in FRCs (67 ± 81 pg/mL), which was not altered by inflammatory stimulation (Figure 4C), while CCL19 was undetectable in every condition."

  - name: cxcl12_baseline_sd_pg_mL
    value: 81
    units: picogram / milliliter
    input_type: direct_measurement
    source_ref: Severino2017
    source_location: "Results, Cytokine and Chemokine Expression Was Induced by Inflammatory Factors (p.7-8) + Figure 4 caption (p.10)"
    value_snippet: "There was a moderate secretion of CXCL12 in untreated DNCs (44 ± 33 pg/mL) and in FRCs (67 ± 81 pg/mL)"
    rationale: "Standard deviation of CXCL12 across the n=4 LN donor FRC isolates under untreated baseline conditions. Figure 4 caption confirms: 'results presented are the average and standard deviation' — so 67 ± 81 is mean ± SD, not mean ± SEM."

  - name: n_LN_donors
    value: 4
    units: dimensionless
    input_type: direct_measurement
    source_ref: Severino2017
    source_location: "Figure 4 caption (p.10) and Materials and Methods, Human LNs (p.2)"
    value_snippet: "Lymph node stromal cells (derived from LN04, LN12, LN15, and LN16) cultured during 7 days and treated with TNF-α + IL-1β (light gray bar) or IFN-γ (dark gray bar) for 24 h."
    rationale: "Four LN donors: LN04 + LN15 from cancer patients, LN12 from a diverticulitis patient, LN16 from a healthy liver donor (organ donor). Each contributed one FRC isolate to the ELISA, n=4 biological replicates at the donor level."

  - name: total_culture_days
    value: 7
    units: day
    input_type: direct_measurement
    source_ref: Severino2017
    source_location: "Figure 4 caption (p.10)"
    value_snippet: "Lymph node stromal cells (derived from LN04, LN12, LN15, and LN16) cultured during 7 days and treated with TNF-α + IL-1β (light gray bar) or IFN-γ (dark gray bar) for 24 h."
    rationale: "Total culture duration before supernatant collection. The 24-h stimulus is applied at the end of this 7-day window. For batch_accumulation modeling we use the 24-h endpoint window because supernatant was collected 24 h after the stimulus addition (cells at confluence over earlier 6 days)."

  - name: ELISA_incubation_time_h
    value: 24
    units: hour
    input_type: direct_measurement
    source_ref: Severino2017
    source_location: "Materials and Methods, ELISA (p.4)"
    value_snippet: "The culture supernatantt was obtained 24 h after stimulation and frozen for ELISA assays."
    rationale: "Supernatant collection window over which secreted CXCL12 accumulates. We use this 24-h endpoint as the batch_accumulation integration time."

  - name: seconds_per_hour
    value: 3600
    units: second / hour
    input_type: unit_conversion
    source_ref: Severino2017
    source_location: "Forward-model unit convention"
    rationale: "SI conversion. PARAM_FIB_FRC_CXCL12_RELEASE has units pmol/(cell*s); incubation duration must be in seconds for the batch_accumulation forward model."

  - name: ELISA_incubation_time_s
    value: 86400
    units: second
    input_type: derived_arithmetic
    source_inputs: [ELISA_incubation_time_h, seconds_per_hour]
    formula: "ELISA_incubation_time_h * seconds_per_hour"
    source_ref: Severino2017
    source_location: "Derived from Methods, ELISA section"
    rationale: "Convert 24 h to seconds."

  - name: CXCL12_MW
    value: 8000
    units: gram / mole
    input_type: unit_conversion
    source_ref: Severino2017
    source_location: "Forward-model unit convention; standard biophysical reference"
    rationale: "Mature secreted CXCL12 (SDF-1α isoform; UniProt P48061 amino acids 22-89, MW ~7960 Da). R&D Systems Quantikine kit standard curve is calibrated against recombinant mature CXCL12. 8000 g/mol used to convert between molar secretion rate (pmol/cell/s) and mass concentration (pg/mL)."

  - name: cells_per_well_at_endpoint
    value: 100000
    units: cell
    input_type: unit_conversion
    source_ref: Severino2017
    source_location: "FRC-field convention value applied because Severino 2017 methods do not state the assay seeding density or endpoint cell count"
    rationale: "Standard FRC ELISA protocols (Fletcher 2011 Front Immunol primary-FRC isolation reference, Acton 2014 Nature contractile-FRC paper) seed primary FRCs at ~5e4 cells per well of a 24-well plate (~2 cm² growth area) and culture to ~80-90% confluence by day 7, reaching ~1e5 cells/well at endpoint. Plausible range 5e4 to 2e5; the inferred secretion rate scales inversely so true unit-conversion uncertainty is ~2-4x. Documented in key_study_limitations as the dominant load-bearing convention used to invert the pg/mL ELISA observation to a per-cell rate."

  - name: well_working_volume_mL
    value: 1.0
    units: milliliter
    input_type: unit_conversion
    source_ref: Severino2017
    source_location: "FRC-field convention value applied because Severino 2017 methods do not state the assay working volume"
    rationale: "Standard 24-well-plate working volume for primary FRC chemokine ELISA at ~1e5 cells per well is 0.5-1.0 mL; the higher end (1 mL) is the most common for 24-h chemokine ELISA assays to dilute secreted chemokines within the Quantikine kit detection range (CXCL12 sensitivity ~18 pg/mL per R&D Systems datasheet, linear range up to ~2000 pg/mL). Documented in key_study_limitations and folded into translation uncertainty."

calibration:
  parameters:
    - name: PARAM_FIB_FRC_CXCL12_RELEASE
      units: picomole / (cell * second)

  forward_model:
    type: batch_accumulation
    secretion_rate: PARAM_FIB_FRC_CXCL12_RELEASE
    cell_count: {input_ref: cells_per_well_at_endpoint}
    incubation_time: {input_ref: ELISA_incubation_time_s}
    molecular_weight: {input_ref: CXCL12_MW}
    medium_volume: {input_ref: well_working_volume_mL}
    unit_conversion_factor: "1.0"
    data_rationale: |
      Severino 2017 cultured 4 independent primary human LN-derived FRC isolates
      for 7 d (DMEM-LG, 10% FBS, no LTβR stimulation) and assayed CXCL12 in the
      24-h endpoint supernatant via R&D Quantikine ELISA. Mean ± SD across donors
      under the untreated baseline condition (Fig 4C control bar) is 67 ± 81 pg/mL.
      Predicted accumulation under batch_accumulation:
      [CXCL12] (pg/mL) = sec_rate (pmol/cell/s) * cells_per_well * incubation_s
      * MW (g/mol = pg/pmol) / volume_mL
      = sec_rate * 1e5 * 86400 * 8000 / 1 = sec_rate * 6.912e13 (pg/mL per pmol/cell/s).
    submodel_rationale: |
      In the PDAC ABM, every living fibroblast in state FIB_FRC atomically adds
      PARAM_FIB_FRC_CXCL12_RELEASE / voxel_volume to the local CXCL12 PDE source
      array each ABM step (fibroblast.cuh:192-194). No upstream regulation, no
      LTβR or BAFF gating, a flat per-cell rate while in the FRC state. Severino's
      human primary FRCs are the closest published cell-type match: gp38+ podoplanin+
      CD31- LN-derived stromal cells maintained for 3+ passages on plastic in DMEM —
      a 2D dedifferentiated state per the Tomei2009 paradigm. The measured 67 pg/mL
      baseline very likely UNDERESTIMATES the in vivo per-cell rate of FRCs within
      a 3D TLS scaffold under physiological lymphotoxin signaling. The translation
      uncertainty in source_relevance captures this directional bias.

  error_model:
    - name: cxcl12_baseline_supernatant_pg_per_mL
      units: picogram / milliliter
      uses_inputs: [cxcl12_baseline_mean_pg_mL, cxcl12_baseline_sd_pg_mL, n_LN_donors]
      sample_size_input: n_LN_donors
      observation_code: |
        def derive_observation(inputs, sample_size, rng, n_bootstrap):
            import numpy as np
            mean = inputs['cxcl12_baseline_mean_pg_mL']
            sd = inputs['cxcl12_baseline_sd_pg_mL']
            sem = sd / np.sqrt(sample_size)
            return rng.normal(mean, sem, n_bootstrap)

  identifiability_notes: |
    Single parameter PARAM_FIB_FRC_CXCL12_RELEASE constrained by one direct
    ELISA observation (Severino 2017 Fig 4C control FRC bar). The batch_accumulation
    forward model is bijective between sec_rate and supernatant concentration,
    but two key non-published inputs (cells_per_well, well_volume_mL) inject a
    multiplicative bias that the inference cannot resolve from this datum alone.
    The chosen assumption (1e5 cells in 1 mL = 1e5 cells/mL effective density at
    endpoint) is the field-convention midpoint; a true 5e4 or 2e5 would shift the
    inferred rate by 2x in either direction. This bias is absorbed into the
    translation_uncertainty rather than carried as a separate identifiability
    issue. The high SD/mean ratio (~1.2) in Severino's n=4 donor pool also flags
    real donor-to-donor variability in primary human FRC CXCL12 output, which
    inflates the bootstrap SEM and broadens the posterior naturally.

experimental_context:
  species: human
  indication: healthy_immune_cells
  system: in_vitro_primary
  cell_lines:
    - name: human_LN_primary_FRC
      species: human
      tissue_origin: lymph_node
      cell_type: fibroblastic_reticular_cell_gp38pos_CD31neg
      source: "Freshly isolated from 4 human LN donors (LN04 larynx cancer, LN12 diverticulitis, LN15 breast cancer, LN16 healthy organ donor). Enzymatic digestion (HBSS + Accutase + collagenase II + DNase), plastic adherent expansion in DMEM-LG + 10% FBS through 3 passages, FACSARIA sort gp38+CD31- to >97% purity."
  culture_conditions:
    medium: "DMEM-LG + 10% FBS"
    serum_concentration: 10
    serum_concentration_units: "% FBS"
    culture_type: "2d_monolayer"
    duration: "7 d total (cells at confluence by day 6); 24 h supernatant collection window"
    oxygen_level: "normoxic"
    notes: "Primary FRC isolates after 3+ passages on plastic. Untreated baseline condition (white bar in Fig 4C) — no LTβR, no TNFα, no IL-1β, no IFN-γ. Suspension was passaged 3 times before assay (Methods, p.2-3)."

source_relevance:
  indication_match: proxy
  indication_match_justification: >
    Healthy / inflamed human LN-derived FRCs vs PDAC-tumor-infiltrating FRCs in TLS.
    The ABM models FIB_FRC as the TLS T-zone scaffold cell in PDAC tertiary lymphoid
    structures (Cabrita2020, Helmink2020), which arise from local stromal differentiation
    rather than direct LN FRC infiltration. The cell type is the same lineage
    (gp38+CD31- reticular stroma) but the in vivo niche differs: PDAC TLS FRCs sit in
    a dense desmoplastic ECM rich in collagen I and HA, with chronic inflammatory
    cytokine exposure (TNFα, IL-6, TGF-β). LN-derived primary FRCs measured ex vivo
    under static 2D conditions are the only quantitative source available; cross-
    indication translation must be absorbed in the translation_uncertainty.
  species_source: human
  species_target: human
  source_quality: primary_human_in_vitro
  perturbation_type: physiological_baseline
  perturbation_relevance: >
    The 'untreated control' condition in Fig 4C is the relevant readout for the
    baseline per-cell CXCL12 secretion rate. No exogenous LTβR agonist, no
    inflammatory stimulus, no anti-TNFα block. Importantly, the paper explicitly
    shows TNFα + IL-1β does NOT alter CXCL12 output (Fig 4C: bars are within
    error of one another across conditions). This suggests the rate we are
    estimating is not strongly cytokine-modulated under their assay conditions,
    making the assumption of a constant flat rate in the ABM defensible
    (modulo in vivo LTβR effects).
  tme_compatibility: low
  tme_compatibility_notes: >
    Five translation gaps stack: (1) cell-type — primary LN FRC ex vivo vs in
    vivo PDAC TLS FRC differentiated locally; (2) tissue context — LN paracortex
    vs PDAC desmoplastic tumor; (3) 2D-vs-3D — the Tomei 2009 effect: FRC
    chemokine output in 2D plastic culture is systematically reduced vs in vivo
    3D + flow context; (4) LTβ signaling — in vivo FRCs receive constitutive
    LTβR engagement from lymphotoxin-expressing lymphocytes that sustains
    chemokine production; in vitro culture lacks this; (5) chronic inflammation —
    PDAC TLS exists in a TNF/IL-6-saturated niche but Severino's data show
    CXCL12 is NOT TNF/IL-1β-responsive, so this gap may be neutral. Net direction
    of all gaps points toward in vitro UNDERestimating the in vivo per-cell rate
    by 10-1000x. Prior was broadened from σ=0.7 to σ=1.5 ahead of MAPLE to
    absorb this.
  measurement_directness: direct
  temporal_resolution: endpoint_pair
  experimental_system: in_vitro_primary

study_interpretation: >
  Severino et al. 2017 isolated primary fibroblastic reticular cells from four
  human lymph node donors (3 disease-affected, 1 healthy organ donor) via
  enzymatic digestion + FACSARIA sort for gp38+ podoplanin / CD31-negative,
  expanded for 3 passages on plastic in DMEM-LG + 10% FBS, then conditioned for
  7 days with a final 24-h stimulation/control window. CXCL12 in the 24-h
  supernatant was measured by R&D Quantikine ELISA. The untreated baseline value
  is 67 ± 81 pg/mL (mean ± SD, n=4 donors). Notably, the same paper found that
  CCL21 was UNDETECTABLE under all conditions tested (a key negative finding
  consistent with the Tomei 2009 paradigm that 2D primary FRCs dedifferentiate
  and lose CCL21 expression entirely). Converting the CXCL12 baseline via
  batch_accumulation with the field-standard assumption of 1e5 cells per well
  in 1 mL volume and CXCL12 MW = 8 kDa yields a per-cell rate of approximately
  9.7e-13 pmol/cell/s. This is about 2000x below the legacy XML default of
  2e-9 pmol/cell/s. The CSV prior was broadened from lognormal(median=2e-9,
  σ=0.7) to lognormal(median=4.5e-11, σ=1.5) ahead of MAPLE — geometric mean
  of the legacy default and the Severino-implied rate, σ=1.5 brackets both at
  ±2.5σ. The large discrepancy reflects multiple stacked translation gaps
  (cell-type, niche, 2D vs 3D, LTβR signaling absence in vitro) rather than a
  systematic error; the in vivo PDAC TLS FRC rate likely sits between the two
  anchors. The companion parameter PARAM_FIB_FRC_CCL21_RELEASE is NOT addressed
  in this target — Severino reports CCL21 as undetectable, and a parallel
  literature search (2026-05-27) confirmed that NO published absolute pg/mL
  CCL21 secretion rate exists for any FRC-equivalent cell type. CCL21 is
  deferred to MANUAL_PRIOR with σ broadened from 0.7 to 1.5 and median kept at
  the legacy 5e-9; see v3 ledger row PARAM_FIB_FRC_CCL21_RELEASE for the
  decision note.

key_assumptions:
  - "Cell number per well at the 24-h endpoint is 1e5. Severino does NOT state seeding density or final cell count for the ELISA assay. The field-convention assumption for primary FRCs cultured to confluence over 7 days in a 24-well plate (~2 cm² growth area) is ~1e5 cells/well. Plausible range 5e4 to 2e5; inferred rate scales inversely so true uncertainty ~2x in either direction."
  - "Well working volume is 1 mL. Severino does NOT state volume. Standard 24-well plate working volume for chemokine ELISA conditioning is 0.5-1.0 mL; 1 mL is the most common for assays requiring kit detection range (Quantikine CXCL12 sensitivity is ~18 pg/mL per R&D datasheet)."
  - "CXCL12 mature secreted form has MW ~8 kDa (UniProt P48061 SDF-1α mature peptide 67 aa). R&D Quantikine ELISA detects mature secreted CXCL12 (both α and β isoforms, calibrated to mature α)."
  - "FRC cell number is approximately constant over the 24-h ELISA window (post-confluence, no proliferation; primary FRCs have a ~3-5 d doubling time in early passage, slowing to near-quiescent at confluence). Effective rate is therefore well-approximated by a flat per-cell rate over the 24-h integration."
  - "The 'untreated control' condition is the appropriate match for the ABM's no-gating FIB_FRC state. The same paper shows TNFα + IL-1β does NOT alter CXCL12 output (Fig 4C), so the baseline is not artificially low due to absent cytokine stimulation — it represents the dedifferentiated 2D state's intrinsic output."
  - "Cross-indication translation from healthy/inflamed LN FRC to PDAC TLS FRC is encoded in the high translation σ. The PDAC ABM is not directly calibrated to LN FRC behavior; in vivo PDAC TLS FRC rate is likely between this in vitro value and the legacy XML default, both encompassed within the broadened prior."

key_study_limitations:
  - "Cells per well + volume per well NOT in the published methods. This is the dominant identifiability gap — Severino documents stimulation concentrations, time, donor count, and ELISA kit thoroughly but is silent on the assay's cell density and volume. Standard FRC-field convention applied for the forward model."
  - "n=4 donor pool with high variability (SD/mean ~1.2). Real donor heterogeneity in primary FRC CXCL12 output is substantial; the bootstrap SEM (40.5 pg/mL) inflates the posterior naturally but the sample is too small to confidently fit a non-Gaussian distribution."
  - "2D dedifferentiation effect (Tomei 2009 paradigm): primary FRCs cultured on plastic lose CCL21 expression entirely and likely under-secrete CXCL12 vs the 3D + LTβR-signaled in vivo state. The single in vitro measurement systematically underestimates the in vivo per-cell rate."
  - "Mixed disease etiology in the donor pool (2 cancer-adjacent LN, 1 diverticulitis, 1 healthy). No subgroup analysis was reported, so we cannot separate disease-state effects on baseline CXCL12 output."
  - "Mature CXCL12 isoform-specificity not separated in the ELISA (kit detects α + β at relative affinities; α is the dominant secreted form). Minor systematic measurement bias possible."

