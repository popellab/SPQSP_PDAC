target_id: bcell_antibody_secretion

inputs:
  - name: bASC_secretion_mean_pg_per_cell_day
    value: 37
    units: picogram / (cell * day)
    input_type: direct_measurement
    source_ref: Nguyen2025
    source_location: "Results, Mature ASC have higher IgG secretion rates (p.3) + Figure 1a (p.4)"
    value_snippet: "We first interrogated production of total IgG in healthy human ASC ex vivo from the blood and the BM. In one-day bulk cultures of blood ASC, the average IgG secretion rate is 37 ± 19 pg/c/d, which is similar to PopA (34 ± 17 pg/c/d) but significantly lower than PopB (55 ± 26 pg/c/d) or PopD (63 ± 30 pg/c/d) (Figure 1a)."

  - name: bASC_secretion_sd_pg_per_cell_day
    value: 19
    units: picogram / (cell * day)
    input_type: direct_measurement
    source_ref: Nguyen2025
    source_location: "Results, Mature ASC have higher IgG secretion rates (p.3) + Figure 1a (p.4)"
    value_snippet: "the average IgG secretion rate is 37 ± 19 pg/c/d, which is similar to PopA (34 ± 17 pg/c/d)"
    rationale: "Standard deviation across the n=13 donor pool of blood ASC IgG secretion rates. Figure 1a caption confirms each symbol represents one experiment (donor)."

  - name: n_bASC_donors
    value: 13
    units: dimensionless
    input_type: direct_measurement
    source_ref: Nguyen2025
    source_location: "Figure 1a (p.4) annotation above bASC scatter cluster"
    figure_excerpt:
      figure_id: "Figure 1a"
      value: "n=13"
      description: "The annotation 'n=13' is printed above the bASC scatter column in Fig 1a, indicating that 13 independent biological experiments (one per healthy donor) contributed to the blood ASC bar. Companion subset annotations on the same panel: PopA n=9, PopB n=12, PopD n=12."
      context: "Figure 1 caption defines: 'Each symbol represents one experiment. Numbers (n) indicate the quantity of independent biological experiments.' The bASC-specific value 13 is read directly from the figure annotation above the leftmost (bASC) scatter cluster."

  - name: IgG_MW_g_per_mol
    value: 150000
    units: gram / mole
    input_type: unit_conversion
    source_ref: Nguyen2025
    source_location: "Forward-model unit convention; standard biophysical reference"
    rationale: "Total human IgG molecular weight ~150 kDa (two heavy chains ~50 kDa each, two light chains ~25 kDa each, glycosylated). All IgG subclasses (IgG1, IgG2, IgG3, IgG4) have MW within ±5 kDa of this value. Used to convert between molar secretion rate (pmol/cell/s) and mass concentration (pg). The Nguyen 2025 ELISA uses ChromePure human IgG standard (JacksonImmuno Research) calibrated against intact IgG molecules."

  - name: seconds_per_day
    value: 86400
    units: second / day
    input_type: unit_conversion
    source_ref: Nguyen2025
    source_location: "Forward-model unit convention"
    rationale: "SI conversion (60 sec/min × 60 min/hr × 24 hr/day = 86400 s/day). PARAM_BCELL_ANTIBODY_RELEASE is in pmol/(cell*s) but Nguyen reports rates in pg/(cell*day), so we convert seconds to days for the algebraic forward model."

calibration:
  parameters:
    - name: PARAM_BCELL_ANTIBODY_RELEASE
      units: picomole / (cell * second)

  forward_model:
    type: algebraic
    formula: "pg_per_cell_day = PARAM_BCELL_ANTIBODY_RELEASE * seconds_per_day * IgG_MW"
    data_rationale: |
      Nguyen 2025 directly reports the per-cell IgG secretion rate in
      pg/(cell·day) units, computed via their Methods formula:
      Secretion rates (pg/cell/day) = Amount (pg) of IgG secreted in
      culture supernatants / (Quantity of IgG spots × Number of days
      in culture).
      The ELISpot-determined "Quantity of IgG spots" represents the
      number of cells that actually secreted IgG over the 1-day window,
      and the ELISA-measured supernatant IgG is divided by this to give
      a true per-cell rate. The forward model converts the ABM's
      pmol/(cell*s) into pg/(cell*day) for direct comparison:
      pg/(cell*day) = sec_rate (pmol/cell/s) * 86400 (s/day) * MW (g/mol = pg/pmol)
      = sec_rate * 1.296e10.
    submodel_rationale: |
      In the PDAC ABM, every living non-Breg B cell in state BCELL_PLASMA
      atomically adds PARAM_BCELL_ANTIBODY_RELEASE / voxel_volume to the
      local antibody PDE source array each ABM step (b_cell.cuh:295-297).
      Breg-flagged plasma cells secrete IL-10 instead (gate at b_cell.cuh:289-298),
      so this parameter represents the canonical IgG-secreting plasma-cell
      output ONLY. A flat per-cell rate while in the PLASMA state — no
      maturation kinetics, no antigen-specific gating. Nguyen 2025 bASC
      is the closest in vitro proxy: freshly isolated, early-minted blood
      antibody-secreting cells, which Helmink 2020 and Cabrita 2020 identify
      as the dominant plasma-cell phenotype in PDAC tumor TLS (early-minted,
      short-lived, not BM-resident LLPC). Mature BM PopD long-lived plasma
      cells secrete ~2× higher (63 pg/cell/day) but are not the
      tumor-infiltrating subset modeled here.
    code: |
      def compute(params, inputs):
          sec_rate = params['PARAM_BCELL_ANTIBODY_RELEASE']
          seconds_per_day = inputs['seconds_per_day']
          mw = inputs['IgG_MW_g_per_mol']
          return sec_rate * seconds_per_day * mw

  error_model:
    - name: bASC_total_IgG_secretion_pg_per_cell_day
      units: picogram / (cell * day)
      uses_inputs: [bASC_secretion_mean_pg_per_cell_day, bASC_secretion_sd_pg_per_cell_day, n_bASC_donors]
      sample_size_input: n_bASC_donors
      observation_code: |
        def derive_observation(inputs, sample_size, rng, n_bootstrap):
            import numpy as np
            mean = inputs['bASC_secretion_mean_pg_per_cell_day']
            sd = inputs['bASC_secretion_sd_pg_per_cell_day']
            sem = sd / np.sqrt(sample_size)
            return rng.normal(mean, sem, n_bootstrap)

  identifiability_notes: |
    Single parameter PARAM_BCELL_ANTIBODY_RELEASE constrained by one
    direct per-cell-per-day observation (Nguyen 2025 Fig 1a bASC bar).
    The algebraic forward model is bijective: sec_rate scales linearly
    with the predicted pg/(cell*day), so there is no identifiability
    ambiguity within the assay. The bootstrap uses the n=13 donor SEM
    (SD/sqrt(13) = 5.27 pg/cell/day), tightening the posterior relative
    to a naive SD-based bootstrap. Translation uncertainty (cell-type and
    indication translation from healthy blood ASC to PDAC TLS plasma
    cells) is captured in source_relevance and inflates the posterior
    spread appropriately.

experimental_context:
  species: human
  indication: healthy_immune_cells
  system: in_vitro_primary
  cell_lines:
    - name: human_blood_ASC_early_minted
      species: human
      tissue_origin: peripheral_blood
      cell_type: antibody_secreting_cell_IgD_neg_CD27_hi_CD38_hi
      source: "Freshly isolated PBMC from 13 healthy adults (age 23-65, vaccinated 6-7 days prior with influenza/Tdap/HepA/HepB/shingles/HPV/COVID-19), Ficoll-gradient PBMC enrichment, FACSARIA II sort to IgD-CD27hiCD38hi to >97% purity. Cells immediately placed in 1-day BM mimetic culture."
  culture_conditions:
    medium: "MSC survival medium (defined in cited reference Nguyen 2018 Nat Comm)"
    serum_concentration: 0
    serum_concentration_units: "% FBS"
    culture_type: "suspension_microwell"
    duration: "1 day for primary bulk culture readout (7 d for kinetics, not used here)"
    oxygen_level: "hypoxia 2.5% O2, 5% CO2"
    notes: "BM mimetic system with hypoxia + 200 ng/mL APRIL added to recapitulate the BM survival niche. ELISpot + ELISA paired readout: cells are seeded at 480-1080 per well (visible on Fig 1a ELISpot image numbers), IgG spots counted, supernatant ELISA quantified, secretion rate computed as pg_IgG_total / (spot_count × days)."

source_relevance:
  indication_match: proxy
  indication_match_justification: >
    Healthy human blood ASC (early-minted, post-vaccination) as proxy for
    PDAC tumor-infiltrating plasma cells. Cabrita 2020 Nature and Helmink
    2020 Nature both identify PDAC TLS plasma cells as predominantly
    early-minted phenotype (CD19+CD27+CD38hi, freshly differentiated from
    germinal center B cells in the TLS) rather than long-lived BM-resident
    LLPC. The cell-type lineage is identical; the maturation state matches.
    The major translation gap is the in vivo PDAC TME (hypoxia, chronic
    inflammation, IL-6/IL-21 paracrine support) vs ex vivo BM mimetic
    monoculture, which Nguyen's hypoxia + APRIL conditions partially
    replicate but do not include T-cell help or Th1/Tfh paracrine signals.
  species_source: human
  species_target: human
  source_quality: primary_human_in_vitro
  perturbation_type: physiological_baseline
  perturbation_relevance: >
    Cells were sorted from post-vaccination donors (6-7 d after Tdap/flu/etc.)
    but the bulk total-IgG assay measures total constitutive IgG output
    (not vaccine-specific), capturing the "all-comer" plasma-cell secretion
    profile that matches the ABM's flat per-cell rate. Post-vaccination
    timing ensures a meaningful pool of circulating ASC (rather than
    near-zero baseline blood ASC frequency) without artificially boosting
    per-cell secretion rates. No drug, no cytokine perturbation beyond the
    BM mimetic APRIL.
  tme_compatibility: moderate
  tme_compatibility_notes: >
    Three translation factors: (1) cell maturation — bASC is early-minted
    (just exited GC), PDAC TLS plasma cells are similar early-minted
    phenotype, so this gap is small (≤2× expected); (2) culture system —
    BM mimetic monoculture with APRIL is a reasonable proxy for the
    TLS plasma cell niche (TLS contain APRIL- and IL-6-secreting stromal
    cells per Pikor 2017), so moderate match; (3) TME — chronic
    inflammation, hypoxia, paracrine TGF-β/IL-6 in PDAC TME could either
    increase or decrease secretion vs the assay. Net direction probably
    neutral or slightly DOWN (immunosuppressive TME suppresses plasma cell
    output). Translation σ should be moderate (0.5-0.7), not extreme.
  measurement_directness: direct
  temporal_resolution: endpoint_pair
  experimental_system: in_vitro_primary

study_interpretation: >
  Nguyen et al. 2025 directly measured per-cell IgG secretion rates from
  freshly sorted human ASC subsets (early-minted blood ASC and three
  bone-marrow plasma cell populations PopA/PopB/PopD) using a paired
  ELISpot + ELISA approach in a BM mimetic culture (MSC stromal medium
  + hypoxia + APRIL). The blood-ASC value (37 ± 19 pg/cell/day, n=13
  donors) is the appropriate anchor for PDAC TLS plasma cells, which
  Helmink 2020 and Cabrita 2020 establish are early-minted-phenotype
  cells differentiated locally in tumor TLS rather than long-lived
  BM-resident LLPC. Converting via the algebraic forward model
  (sec_rate · 86400 · 150,000) yields a per-cell rate of approximately
  2.86e-9 pmol/cell/s. This is roughly 3500x BELOW the legacy XML default
  of 1e-5 pmol/cell/s — but the legacy default is a unit-conversion
  ERROR. The ledger comment "1e-5 pmol/cell/s ≈ 100 pg/cell/day" is
  arithmetically wrong: 100 pg/cell/day at IgG MW 150 kDa is actually
  7.7e-9 pmol/cell/s, NOT 1e-5. The 1e-5 value implies 130 ng of IgG
  secreted per cell per day, which exceeds the entire cell mass and is
  physiologically impossible. The classical Helmreich 1961 measurement
  on myeloma cells (~2000-10000 IgG molecules/cell/sec ≈ 1.7-8.3e-9
  pmol/cell/s) and the BioNumbers consensus (BNID 110221: 50-340 pg/cell/day
  ≈ 4e-9 to 2.6e-8 pmol/cell/s, Bromage 2009) both confirm the order of
  magnitude. The CSV prior was reanchored from lognormal(median=1e-5,
  σ=0.7) to lognormal(median=4e-9, σ=0.7) ahead of MAPLE; the unverifiable
  "McMillan2025" and "Cheng2023" tags in the original ledger comment were
  dropped. The corrected XML default should be updated to ~3-4e-9
  pmol/cell/s at the joint-inference CSV sync step.

key_assumptions:
  - "IgG MW is 150 kDa for the unit conversion. All major human IgG subclasses (IgG1-IgG4) have MW within ±5 kDa of this value; ELISA capture is calibrated against ChromePure intact IgG, which matches this MW."
  - "Blood ASC is the appropriate proxy for PDAC TLS plasma cells. Helmink 2020 and Cabrita 2020 both characterize tumor TLS plasma cells as early-minted phenotype (CD27+CD38hi, recently differentiated from local GC B cells), matching the bASC profile rather than the BM PopD LLPC phenotype."
  - "Per-cell secretion rate is uniform across the 1-day window (constant rate, not pulse-like). Nguyen's Methods formula divides total supernatant IgG by IgG spot count × days, which implicitly assumes constant rate per spot-positive cell over the integration window."
  - "ELISpot spots count secreting cells accurately (1 spot = 1 secreting cell). Standard ELISpot biology; well-validated."
  - "Healthy adult donor variability (n=13) bounds the cross-patient variability in PDAC. Plausibly inflates inferred posterior CV vs a homogeneous patient population, which is conservative for the ABM."

key_study_limitations:
  - "Blood ASC vs tumor TLS plasma cell translation: ABM models plasma cells in PDAC TLS that arise locally; Nguyen measures blood plasmablasts post-vaccination. Both are early-minted phenotype but the local niche differs. Translation uncertainty absorbed in source_relevance."
  - "BM mimetic culture conditions (MSC stroma + hypoxia + APRIL) may overestimate the in vivo PDAC TLS rate, since PDAC TLS lack the full BM survival cocktail. Direction of bias unclear without additional data."
  - "Donor pool is healthy adults; PDAC patients may have different baseline plasma cell function due to age, immunosuppression from chemo, or chronic inflammation. Cross-disease translation not directly tested."
  - "ELISpot/ELISA paired readout is the highest-quality method for per-cell secretion (better than supernatant-only ELISA which requires assuming cell density), but assumes 1:1 correspondence between ELISpot spots and secreting cells, which can break down with very high-frequency producers."
  - "Total IgG measurement does not distinguish antigen-specific vs polyclonal output. ABM models total IgG so this matches; tumor IgG that recognizes tumor antigens is a downstream concern not addressed at this parameter level."

