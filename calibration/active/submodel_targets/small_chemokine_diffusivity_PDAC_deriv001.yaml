  identifiability_notes: >
    Small chemokine diffusivities are constrained by FRAP measurements of
    size-matched probes (dextrans, proteins) in 1% collagen I gels.
    The power law D = A*Rh^(-n) with n=1.294 captures gel hindrance.
    Tortuosity correction (lambda^2 ~ 2) adds ~50% uncertainty.
    All 5 parameters share the same D(Rh) curve but at different Rh values.

experimental_context:
  species: in_vitro
  indication: general_biophysics
  system: in_vitro

source_relevance:
  indication_match: proxy
  indication_match_justification: >
    FRAP measurements in reconstituted 1% type I collagen gels serve as proxy
    for tumor interstitial diffusion. Collagen I is the dominant ECM component
    in PDAC desmoplastic stroma. Gel concentration (1%) is representative of
    tumor interstitial matrix. Tortuosity correction accounts for additional
    tissue complexity (cells, heterogeneous ECM).
  species_source: in_vitro
  species_target: human
  source_quality: primary_human_in_vitro
  perturbation_type: physiological_baseline
  perturbation_relevance: >
    Baseline biophysical measurement of diffusion in collagen matrix at 37C.
    No drug or disease perturbation.
  tme_compatibility: moderate
  tme_compatibility_notes: >
    1% collagen gel captures ECM hindrance but not cellular obstacles,
    heterogeneous ECM composition, or binding interactions. PDAC stroma
    is denser than average tumors (more collagen, more crosslinking),
    which may further reduce effective D by 2-3x.
  measurement_directness: proxy_observable
  temporal_resolution: snapshot_or_equilibrium
  experimental_system: in_vitro_cell_line

study_interpretation: >
  Ramanujan et al. 2002 measured diffusion coefficients of various size probes
  (dextrans, proteins, viral particles) in reconstituted type I collagen gels
  using FRAP. The D(Rh) relationship follows a power law with exponent steeper
  than Stokes-Einstein (n=1.294 vs 1.0), indicating size-dependent gel
  hindrance. We digitized Figure 2a (16 points in 1% collagen) and fit a
  power law, then apply tortuosity correction lambda^2=2 to estimate tumor
  tissue diffusivity for cytokines based on their hydrodynamic radius.

key_assumptions:
  - Hydrodynamic radius from MW scaling (Rh = 0.066 * MW^0.395) is applicable to these chemokines
  - 1% collagen gel is representative of tumor interstitial matrix
  - Tortuosity lambda^2 = 2 accounts for cellular obstacles and matrix heterogeneity
  - Chemokines diffuse as monomers in the interstitium (no significant binding retardation)
  - Power law fit interpolation valid within measured Rh range (2-52 nm)

key_study_limitations:
  - In vitro gel, not tumor tissue
  - Probes are dextrans/proteins, not the actual cytokines
  - No ECM binding or receptor-mediated retardation captured
  - Single collagen concentration (1%)
  - Tortuosity correction is an estimate, not directly measured

primary_data_source:
  doi: "10.1016/S0006-3495(02)73933-7"
  source_tag: Ramanujan2002
  title: "Diffusion and convection in collagen gels: implications for transport in the tumor interstitium"
  authors:
