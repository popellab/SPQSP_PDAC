  identifiability_notes: >
    Medium cytokine diffusivities constrained by FRAP measurements of
    size-matched probes in 1% collagen I gels. IL-2 and IL-1 are monomers
    in the 15-18 kDa range; TGF-beta and IFN-gamma are functional dimers
    (25 and 34 kDa respectively). The Rh-dependent power law captures
    size-dependent hindrance. Tortuosity correction adds ~50% uncertainty.

experimental_context:
  species: in_vitro
  indication: general_biophysics
  system: in_vitro

source_relevance:
  indication_match: proxy
  indication_match_justification: >
    FRAP in reconstituted collagen gel as proxy for tumor tissue diffusion.
    Collagen I is dominant ECM in PDAC stroma. Tortuosity correction
    accounts for additional tissue complexity.
  species_source: in_vitro
  species_target: human
  source_quality: primary_human_in_vitro
  perturbation_type: physiological_baseline
  perturbation_relevance: >
    Baseline biophysical diffusion measurement in collagen matrix at 37C.
  tme_compatibility: moderate
  tme_compatibility_notes: >
    1% collagen gel approximates ECM hindrance. PDAC has denser stroma
    than many tumors. TGF-beta may have significant ECM binding (latent
    form binds LAP/LTBP in matrix), which would reduce effective D
    beyond what the gel measurement captures.
  measurement_directness: proxy_observable
  temporal_resolution: snapshot_or_equilibrium
  experimental_system: in_vitro_cell_line

study_interpretation: >
  Ramanujan et al. 2002 FRAP measurements in 1% collagen gels provide
  the D(Rh) relationship for macromolecules in ECM-like environments.
  The power law exponent (1.294) exceeds Stokes-Einstein (1.0), reflecting
  size-dependent gel hindrance. For medium cytokines (15-34 kDa), this
  predicts D_tumor in the 2.5-3.8e-7 cm2/s range. Current model values
  for IL-2 (4e-8) and IFN-gamma (1e-7) are significantly lower than
  predicted; TGF-beta (2.6e-7) and IL-6 (1e-7) are closer to predictions.

key_assumptions:
  - Cytokines diffuse as their functional form (monomer or dimer)
  - MW-based Rh estimate applicable to globular cytokines
  - TGF-beta diffuses as active dimer (not latent complex, which would be larger)
  - IFN-gamma diffuses as homodimer (34 kDa, not monomer)
  - No significant ECM binding retardation for these species

key_study_limitations:
  - In vitro gel, not tumor tissue
  - No cytokine-specific binding to ECM components captured
  - TGF-beta has known ECM binding (latent form) not modeled here
  - Single collagen concentration (1%)

primary_data_source:
  doi: "10.1016/S0006-3495(02)73933-7"
  source_tag: Ramanujan2002
  title: "Diffusion and convection in collagen gels: implications for transport in the tumor interstitium"
  authors:
    - "Ramanujan"
    - "Pluen"
    - "McKee"
    - "Brown"
    - "Boucher"
    - "Jain"
  year: 2002

tags: [molecular, diffusivity, cytokine, FRAP, collagen, power_law, IL2, IL1, IL6, TGFB, IFNG]
