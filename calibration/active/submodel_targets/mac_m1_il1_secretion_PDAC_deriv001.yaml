target_id: mac_m1_il1_secretion

inputs:
  - name: cells_per_mL_mantissa
    value: 5
    units: dimensionless
    input_type: direct_measurement
    source_ref: Netea2009
    source_location: "Methods, Isolation of mononuclear cells and stimulation of cytokine production (p.2325)"
    value_snippet: "Cells were adjusted to 5 × 10^6 cells/mL and incubated in culture medium (RPMI 1640) supplemented with gentamicin 10 μg/mL, L-glutamine 10 mM, and pyruvate 10 mM"
    rationale: "Mantissa of the paper's scientific-notation cell density (5 × 10^6 cells/mL). Split from the 10^6 scale factor for snippet-value matching in the validator."

  - name: cells_per_mL_scale
    value: 1000000
    units: cell / milliliter
    input_type: unit_conversion
    source_ref: Netea2009
    source_location: "Methods, Isolation of mononuclear cells and stimulation of cytokine production (p.2325)"
    rationale: "Decimal expansion of the 10^6 (one million) scale factor in the paper's '5 × 10^6 cells/mL' notation. Combined with the mantissa to yield the final suspension density."

  - name: cells_per_mL_suspension
    value: 5000000
    units: cell / milliliter
    input_type: derived_arithmetic
    source_inputs: [cells_per_mL_mantissa, cells_per_mL_scale]
    formula: "cells_per_mL_mantissa * cells_per_mL_scale"
    source_ref: Netea2009
    source_location: "Derived from mantissa × scale factor of the paper's stated cell density"
    rationale: "5 × 1e6 = 5e6 cells/mL, the working suspension density used to dispense the 100 μL cell aliquot per well."

  - name: cell_aliquot_volume_uL
    value: 100
    units: microliter
    input_type: direct_measurement
    source_ref: Netea2009
    source_location: "Methods, Isolation of mononuclear cells and stimulation of cytokine production (p.2325)"
    value_snippet: "100-μL cells were incubated with either 100 μL of culture medium (negative control) or purified LPS"
    rationale: "Volume of cell suspension dispensed per well; combined with 5e6 cells/mL gives 5e5 cells per well."

  - name: stim_addition_volume_uL
    value: 100
    units: microliter
    input_type: direct_measurement
    source_ref: Netea2009
    source_location: "Methods, Isolation of mononuclear cells and stimulation of cytokine production (p.2325)"
    value_snippet: "100-μL cells were incubated with either 100 μL of culture medium (negative control) or purified LPS"
    rationale: "Volume of stimulus solution added to each well, doubling working volume to 200 μL total."

  - name: microliters_per_mL
    value: 1000
    units: microliter / milliliter
    input_type: unit_conversion
    source_ref: Netea2009
    source_location: "SI unit conversion"
    rationale: "SI conversion factor 1 mL = 1000 μL, required to combine the microliter-scaled aliquot volumes with the cells/mL suspension concentration."

  - name: cell_aliquot_volume_mL
    value: 0.1
    units: milliliter
    input_type: derived_arithmetic
    source_inputs: [cell_aliquot_volume_uL, microliters_per_mL]
    formula: "cell_aliquot_volume_uL / microliters_per_mL"
    source_ref: Netea2009
    source_location: "Derived unit conversion of cell aliquot volume"
    rationale: "Convert 100 μL cell aliquot to mL for combination with the cells/mL suspension to yield cells per well."

  - name: cells_per_well
    value: 500000
    units: cell
    input_type: derived_arithmetic
    source_inputs: [cells_per_mL_suspension, cell_aliquot_volume_mL]
    formula: "cells_per_mL_suspension * cell_aliquot_volume_mL"
    source_ref: Netea2009
    source_location: "Derived from cell suspension concentration and aliquot volume"
    rationale: "5e6 cells/mL × 0.1 mL = 5e5 cells per well (the value used by the batch_accumulation forward model)."

  - name: well_volume_mL
    value: 0.2
    units: milliliter
    input_type: derived_arithmetic
    source_inputs: [cell_aliquot_volume_uL, stim_addition_volume_uL, microliters_per_mL]
    formula: "(cell_aliquot_volume_uL + stim_addition_volume_uL) / microliters_per_mL"
    source_ref: Netea2009
    source_location: "Methods, Isolation of mononuclear cells and stimulation of cytokine production (p.2325)"
    rationale: "Total well working volume is the sum of the 100 μL cell aliquot and 100 μL stimulus addition (200 μL), converted to mL for the batch_accumulation forward model. The ELISA is performed on this combined supernatant after 24 h, so the secreted IL-1β is diluted into the full 200 μL volume."

  - name: incubation_time_h
    value: 24
    units: hour
    input_type: direct_measurement
    source_ref: Netea2009
    source_location: "Methods, Isolation of mononuclear cells and stimulation of cytokine production (p.2325)"
    value_snippet: "After 24 hours, the supernatants were collected and stored at -70°C until assayed."

  - name: seconds_per_hour
    value: 3600
    units: second / hour
    input_type: unit_conversion
    source_ref: Netea2009
    source_location: "Forward-model unit convention"
    rationale: "SI conversion. PARAM_MAC_M1_IL1_RELEASE has units pmol/(cell*s) so the batch incubation duration must be supplied in seconds."

  - name: incubation_time_s
    value: 86400
    units: second
    input_type: derived_arithmetic
    source_inputs: [incubation_time_h, seconds_per_hour]
    formula: "incubation_time_h * seconds_per_hour"
    source_ref: Netea2009
    source_location: "Derived from Methods (24-h supernatant collection)"
    rationale: "Convert 24 h to seconds for the batch_accumulation forward model whose secretion rate is 1/s."

  - name: IL1b_MW
    value: 17000
    units: gram / mole
    input_type: unit_conversion
    source_ref: Netea2009
    source_location: "Introduction (p.2324)"
    value_snippet: "the processing of the 31-kDa inactive IL-1β precursor form into the bioactive 17-kDa IL-1β"
    rationale: "Mature secreted IL-1β is the 17-kDa cleaved form (UniProt P01584 amino acids 117-269, MW ~17.4 kDa). R&D Systems specific ELISA detects the mature form. 17,000 g/mol used to convert between molar secretion rate (pmol/cell/s) and mass concentration (pg/mL). Pro-IL-1β (31 kDa) is intracellular and not in the secreted-supernatant pool measured here."

  - name: n_biological_replicates
    value: 6
    units: dimensionless
    input_type: direct_measurement
    source_ref: Netea2009
    source_location: "Figure 2 caption (p.2327)"
    value_snippet: "Data from all 4 panels are presented as mean plus or minus SEM of cells harvested from 6 volunteers."

  - name: wpd_fig2a_cd14_lps_mean
    value: 900
    units: picogram / milliliter
    input_type: direct_measurement
    source_ref: Netea2009
    source_location: "Figure 2A (p.2327), CD14+ monocytes bar"
    figure_excerpt:
      figure_id: "Figure 2A"
      value: "0.9 ng/mL"
      description: "Bar height for the 'CD14+' condition under 10 ng/mL LPS stimulation, 24 h supernatant, ELISA. Visual readout from the printed bar against the gridded y-axis (0, 0.5, 1.0, 1.5, 2.0, 2.5 ng/mL) — no digitization tool, value rounded to nearest 0.05 ng/mL."
      context: "Fig 2A compares the IL-1β response of total PBMC, purified CD14+ monocytes, and CD14- lymphocytes to 10 ng/mL LPS after 24 h. The CD14+ bar (purified monocytes at 5e6 cells/mL in 100 μL + 100 μL LPS) is the cleanest per-monocyte readout. CD14- lymphocyte control is essentially baseline (~0.05 ng/mL), confirming the signal comes from monocytes."

  - name: wpd_fig2a_cd14_lps_sem
    value: 300
    units: picogram / milliliter
    input_type: direct_measurement
    source_ref: Netea2009
    source_location: "Figure 2A (p.2327), CD14+ monocytes error bar"
    figure_excerpt:
      figure_id: "Figure 2A"
      value: "0.30 ng/mL SEM"
      description: "Upper error bar of the CD14+ bar in Fig 2A; SEM measured as the visual offset of the cap above the bar top, ~0.25-0.35 ng/mL, midpoint 0.30 ng/mL."
      context: "n=6 volunteers per figure caption. SEM converted to SD via SD = SEM*sqrt(n) = 0.735 ng/mL in the observation_code derivation step."

calibration:
  parameters:
    - name: PARAM_MAC_M1_IL1_RELEASE
      units: picomole / (cell * second)

  forward_model:
    type: batch_accumulation
    secretion_rate: PARAM_MAC_M1_IL1_RELEASE
    cell_count: {input_ref: cells_per_well}
    incubation_time: {input_ref: incubation_time_s}
    molecular_weight: {input_ref: IL1b_MW}
    medium_volume: {input_ref: well_volume_mL}
    unit_conversion_factor: "1.0"
    data_rationale: |
      Netea 2009 Fig 2A is a standard in vitro batch-accumulation ELISA: 5e5 purified
      CD14+ monocytes per well (5e6 cells/mL x 100 μL cell aliquot) plus 100 μL of
      LPS stimulus (10 ng/mL final) in RPMI, 24 h conditioning, R&D Systems specific
      IL-1β ELISA on the 200 μL supernatant. Predicted accumulation:
      [IL-1β] (pg/mL) = sec_rate (pmol/cell/s) * 5e5 (cells) * 86400 (s) * 17000
      (g/mol = pg/pmol) / 0.2 (mL) = sec_rate * 3.672e15 (pg/mL per pmol/cell/s).
      This directly constrains the per-cell continuous IL-1β secretion rate that the
      PDAC ABM applies to M1-polarized macrophages.
    submodel_rationale: |
      In the PDAC ABM, every living macrophage in state MAC_M1 atomically adds
      PARAM_MAC_M1_IL1_RELEASE / voxel_volume to the local IL-1 PDE source array
      each ABM step (macrophage.cuh:192-196). M2 and dead macrophages secrete zero.
      There is no inflammasome gating, no ATP-trigger requirement, no Hill modulation
      by IL-10 or TGF-β — a flat per-cell rate while M1 and alive. Netea 2009 measures
      monocytes (not M1-polarized macrophages) under LPS-only stimulation, which is
      the closest in vitro analog to the ABM's no-gating M1 abstraction because
      monocytes have CONSTITUTIVELY ACTIVE caspase-1 (the paper's central finding,
      Fig 4D) and therefore release mature IL-1β without an ATP second signal. The
      classic in-vitro LPS+ATP burst on MDMs (Fig 6, Fig 7) gives a similar 24-h-
      averaged rate but is mechanistically a peak-pulse model that does not map to
      the ABM's continuous-secretion structure. PDAC M1/IL-1β+ TAMs in vivo are
      driven by PGE2 + TNF (Caronni 2023 Nature) rather than LPS, and act as
      sustained secretors; the in vivo per-cell rate is therefore expected to be of
      the same order of magnitude as the monocyte LPS rate, with the cell-type and
      stimulus translation absorbed in the source_relevance.translation_uncertainty.

  error_model:
    - name: cd14_monocyte_il1b_supernatant_pg_per_mL
      units: picogram / milliliter
      uses_inputs: [wpd_fig2a_cd14_lps_mean, wpd_fig2a_cd14_lps_sem, n_biological_replicates]
      sample_size_input: n_biological_replicates
      observation_code: |
        def derive_observation(inputs, sample_size, rng, n_bootstrap):
            import numpy as np
            mean = inputs['wpd_fig2a_cd14_lps_mean']
            sem = inputs['wpd_fig2a_cd14_lps_sem']
            return rng.normal(mean, sem, n_bootstrap)

  identifiability_notes: |
    Single parameter PARAM_MAC_M1_IL1_RELEASE constrained by one direct observation
    (the Fig 2A CD14+ monocyte LPS supernatant at 24 h). The batch_accumulation
    forward model is bijective between sec_rate and supernatant concentration given
    fixed cells/time/MW/volume — no identifiability ambiguity within the assay.
    Inference quality is limited by (a) the n=6 SEM uncertainty (~33% relative on
    the mean), (b) the cell-type translation from primary CD14+ monocytes to
    PDAC-tumor-infiltrating M1 macrophages, and (c) the stimulus translation from
    LPS to PGE2+TNF (the in vivo PDAC TAM IL-1β driver per Caronni 2023). The
    monocyte vs MDM finding in this paper (Fig 3A: monocytes secrete ~1.6 ng/mL,
    MDMs essentially zero under identical LPS) is a major mechanism-level caveat,
    addressed by setting source_relevance.tme_compatibility = low and treating the
    monocyte LPS rate as a proxy for the "constitutively-active-caspase-1" cell
    state that the ABM's no-gating M1 represents.

experimental_context:
  species: human
  indication: healthy_immune_cells
  system: in_vitro_primary
  cell_lines:
    - name: human_PBMC_CD14_monocytes
      species: human
      tissue_origin: peripheral_blood
      cell_type: monocyte_CD14_positive
      source: "Freshly isolated from healthy volunteers, Ficoll-Paque PBMC then anti-CD14 magnetic bead positive selection (Miltenyi Biotec)"
  culture_conditions:
    medium: "RPMI 1640 + gentamicin 10 μg/mL + L-glutamine 10 mM + pyruvate 10 mM"
    serum_concentration: 0
    serum_concentration_units: "% FBS"
    culture_type: "suspension_short_term"
    duration: "24 h"
    oxygen_level: "normoxic"
    notes: "5e6 cells/mL adjusted suspension; 100 μL cells + 100 μL stim per well; 10 ng/mL LPS (E. coli O55:B5, double-purified per Hirschfeld2000 to exclude lipoprotein contamination). Freshly isolated CD14+ monocytes — no extended differentiation step. Suspension culture rather than adherent monolayer."

source_relevance:
  indication_match: proxy
  indication_match_justification: >
    The data are from healthy-donor peripheral blood monocytes stimulated with bacterial
    LPS, not from PDAC tumor-associated macrophages. The PDAC-relevant connection is
    that IL-1β+ macrophages are a major effector population in pancreatic cancer
    (Caronni 2023 Nature) and that the ABM models an "M1" state that constitutively
    secretes IL-1β. Monocyte LPS provides the only well-quantified single-cell-type
    rate in the published literature for an inflammasome-active myeloid cell — the
    most direct surrogate available, but with documented cell-type and stimulus
    translation distance.
  species_source: human
  species_target: human
  source_quality: primary_human_in_vitro
  perturbation_type: pharmacological
  perturbation_relevance: >
    LPS (TLR4 agonist) is not the in vivo driver of IL-1β secretion in PDAC tumors
    — Caronni 2023 identifies PGE2 + TNF as the canonical PDAC TAM trigger. However,
    the Netea 2009 finding that monocytes have constitutively active caspase-1 means
    that any TLR-priming signal (LPS, Pam3Cys, S. epidermidis lipopeptide) drives a
    similar magnitude of IL-1β release without a second-signal requirement. The
    24-h LPS-stimulated rate is therefore a reasonable proxy for the maximum-output
    rate of a continuously-active inflammasome-primed myeloid cell, which is how
    the PDAC ABM parameterizes the M1 state.
  tme_compatibility: low
  tme_compatibility_notes: >
    Three major translation gaps: (1) cell type — primary CD14+ blood monocytes vs
    tumor-infiltrated M1-polarized macrophages; the same paper (Fig 3A) shows that
    monocyte-derived macrophages differentiated for 5 days in 10% plasma lose the
    capacity to release IL-1β under LPS alone (require ATP costimulation), so the
    tissue-resident counterpart of a blood monocyte may not produce IL-1β at the
    same rate without an inflammasome trigger. (2) Stimulus — bacterial LPS vs the
    PDAC tumor microenvironment drivers PGE2 + TNF (Caronni 2023). (3) Context —
    isolated suspension culture without surrounding stroma, hypoxia, or paracrine
    immunosuppression. The ABM compensates by modeling M1 as a polarized, sustained
    secretor whose per-cell rate represents the "primed and triggered" output —
    Netea monocyte LPS captures roughly this magnitude. translation_uncertainty in
    the inference is expected to dominate the posterior variance.
  measurement_directness: proxy_observable
  temporal_resolution: endpoint_pair
  experimental_system: in_vitro_primary

study_interpretation: >
  Netea et al. 2009 established that monocytes and macrophages differ fundamentally
  in IL-1β release machinery: freshly isolated human blood monocytes have constitutively
  active caspase-1 and release mature 17-kDa IL-1β upon TLR ligation alone, while
  monocyte-derived macrophages (5-day differentiation in 10% human plasma + GM-CSF)
  require a second inflammasome-activating signal (ATP) on top of LPS priming.
  Figure 2A is the quantitative anchor: 5e5 purified CD14+ monocytes incubated with
  10 ng/mL LPS for 24 h in 200 μL produce a mean of ~0.9 ng/mL of bioactive IL-1β
  in the supernatant (SEM ~0.30 ng/mL, n=6 volunteers). Converting via the
  batch_accumulation forward model with mature IL-1β MW = 17 kDa yields a per-cell
  rate of approximately 2.5e-13 pmol/cell/s. The legacy XML default of 4.7e-13
  pmol/cell/s (annotated "MAPLE posterior ~10000x down. Netea2009" in inline
  comment — the 10000x note is incorrect and predates the current MAPLE workflow)
  sits about 2x above this implied rate, well within the prior 95% CI of
  lognormal(median=4.7e-13, σ=0.7) so no prior broadening is required ahead of
  inference. The data will pull the posterior median modestly downward (~2x). The
  large literature gap between this in vitro monocyte rate and any PDAC-tumor in
  vivo per-cell IL-1β output is acknowledged via the high indirect_proxy and low
  tme_compatibility flags, and will be captured in the translation_uncertainty.
  Caronni 2023 (Nature) provides the in vivo PDAC TAM IL-1β phenotype context —
  PGE2+TNF-driven IL-1β+ TAM cluster as a major pathogenic population — but the
  quantitative single-cell rate is not directly extracted in that paper's main
  figures and is not used as primary data here.

key_assumptions:
  - "Well working volume is 200 μL: methods explicitly describe 100 μL of 5e6 cells/mL suspension plus 100 μL of stimulus medium per well; this sums to 200 μL of supernatant volume into which secreted IL-1β diffuses for ELISA quantification."
  - "Mature secreted IL-1β MW is 17 kDa (paper states '31-kDa inactive IL-1β precursor form into the bioactive 17-kDa IL-1β'); R&D Systems IL-1β ELISA detects the mature form."
  - "Monocyte cell number is approximately constant over the 24 h incubation under serum-free RPMI (no proliferation; minor cell loss from apoptosis < 20% per typical 24 h monocyte protocols). Effective rate is therefore close to the assumed flat rate."
  - "Monocyte LPS response saturates between 10 ng/mL (Fig 2A) and 100 ng/mL (Fig 3A) — at saturating LPS, the observed per-cell rate represents the maximum continuous secretion of the inflammasome-active myeloid cell, which the ABM's M1 state abstracts."
  - "Cell-type translation from primary CD14+ blood monocyte to PDAC-infiltrated M1 macrophage is folded into the source_relevance.translation_uncertainty rather than corrected pre-inference, because there is no published single-cell IL-1β rate from primary human PDAC TAMs."

key_study_limitations:
  - "Monocyte vs macrophage cell-type mismatch is the central caveat — same paper (Fig 3A) explicitly demonstrates that MDMs differentiated for 5 days in 10% plasma do not release IL-1β under LPS alone (require ATP). The ABM's M1 macrophage state may be biologically closer to the MDM than to a blood monocyte; however, no quantitative monocyte→TAM differentiation IL-1β rate is published, so the monocyte LPS rate is used as the available proxy."
  - "LPS stimulation is not the in vivo PDAC TAM trigger. Caronni 2023 (Nature, DOI 10.1038/s41586-023-06685-2) identifies tumor-derived PGE2 + TNF as the canonical IL-1β+ TAM driver. Trigger-pathway differences could yield order-of-magnitude differences in per-cell rate that are captured only via wide translation uncertainty."
  - "Visual bar-graph readout. The Fig 2A CD14+ value was read directly from the printed bar against the y-axis gridlines (0, 0.5, 1.0, 1.5, 2.0, 2.5 ng/mL) rather than WebPlotDigitizer extraction. Resolution ~±0.05 ng/mL on the mean and ~±0.05 ng/mL on the SEM."
  - "Suspension-culture artifact: monocytes are normally adherent. The 200-μL suspension protocol may modestly underestimate the in situ adherent rate. Surface area / shear effects on IL-1β secretion are not characterized in this paper."
  - "n=6 healthy donors. Cross-donor variability (NLRP3 SNPs, age, autoinflammatory predispositions) is folded into the SEM but may be lower than the variability across PDAC patients in vivo."

