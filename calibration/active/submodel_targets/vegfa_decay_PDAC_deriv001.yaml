      context: "Summary of parameter optimization (n=20 trials with different random initial conditions). Min is the smallest value found across the 20 trials."
    rationale: "Lower-bound lymphatic drainage from 20 parameter-optimization trials. Many trials converged to this lower bound, suggesting weak data constraint on the lower side."

  - name: lymphatic_drainage_max_cm3_per_s
    value: 2.73e-4
    units: centimeter^3 / second
    input_type: direct_measurement
    source_ref: Stefanini2011
    source_location: "Table 6"
    table_excerpt:
      table_id: "Table 6"
