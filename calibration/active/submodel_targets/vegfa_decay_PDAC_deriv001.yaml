    value: 7.0e-6
    units: centimeter^3 / second
    input_type: direct_measurement
    source_ref: Stefanini2011
    source_location: "Table 4 Lymphatic drainage row"
    table_excerpt:
      table_id: "Table 4"
      column: "Value"
