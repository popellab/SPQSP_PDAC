      value: "7.00 10^-6"
      context: "Transport parameters of the VEGF two-compartment mouse model. Lymphatic drainage rate measured in mouse muscle. Asterisk indicates optimized parameter."
    rationale: "Mouse muscle lymphatic drainage rate, optimal value from parameter fitting against PK data of VEGF Trap. Represents the dominant non-receptor-mediated mechanism removing free VEGF from interstitium back to blood."

  - name: lymphatic_drainage_min_cm3_per_s
    value: 7.0e-6
