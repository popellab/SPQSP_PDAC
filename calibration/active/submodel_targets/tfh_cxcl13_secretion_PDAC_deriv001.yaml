target_id: tfh_cxcl13_secretion

inputs:
  - name: cells_per_mL_field_convention
    value: 500000
    units: cell / milliliter
    input_type: unit_conversion
    source_ref: Ukita2022
    source_location: "Methods, Cell culture (field-convention value applied because Ukita2022 Methods do not state cells/mL for the in vitro differentiation)"
    rationale: "Ukita2022 Methods specify naive CD4+ T cell differentiation under plate-bound αCD3 (5 μg/mL) + αCD28 (10 μg/mL) + 10 ng/mL TGF-β1 for 6-7 days in IMDM + 10% FBS, but do not state seeding cells/mL. We apply the standard human primary CD4+ T cell differentiation field convention of 5×10⁵ cells/mL (= 1×10⁵ cells per 200 μL 96-well, the typical workflow for plate-bound CD3/CD28 stimulation). The per-cell rate is V-cancellation-invariant: cells/mL × per_mL_volume_basis = cells_per_well, and [conc] = sec_rate · cells_per_well · time · MW / volume cancels volume out (T5c Hanten2008 precedent)."

  - name: per_mL_basis_volume
    value: 1.0
    units: milliliter
    input_type: unit_conversion
    source_ref: Ukita2022
    source_location: "Forward-model normalization basis"
    rationale: "V-cancellation basis: cells_per_well = cells_per_mL × 1 mL and per_mL_basis_volume = 1.0 mL gives an identical per-cell rate to any other consistent volume × cells_per_well combination. Used because Ukita does not state the per-well volume (T5c Hanten2008 precedent)."

  - name: total_cd4_cells_per_well
    value: 500000
    units: cell
    input_type: derived_arithmetic
    source_inputs: [cells_per_mL_field_convention, per_mL_basis_volume]
    formula: "cells_per_mL_field_convention * per_mL_basis_volume"
    source_ref: Ukita2022
    source_location: "Derived from field-convention cells/mL × 1-mL normalization basis"
    rationale: "Total bulk CD4+ T cell count per 'well' under the 1-mL normalization basis. Comprises both CXCL13-producing PD-1+CXCR5- Tfh/Tph-like cells and non-producing CD4+ T cells."

  - name: cxcl13_producer_fraction_pct
    value: 4
    units: dimensionless
    input_type: direct_measurement
    source_ref: Ukita2022
    source_location: "Figure 5E (Page 9 of PDF), CD4 panel, TGF-β bar"
    figure_excerpt:
      figure_id: "Figure 5E"
      value: "~4% CXCL13+ cells"
      description: "CD4 panel of Fig 5E: y-axis 'CXCL13+ cells (%)', linear scale 0-10. TGF-β bar height visually reads at approximately 4%. Adjacent conditions for context: Medium ~2%, TGF+IL-12 ~4.5%, IL-12 ~1.5%."
      context: "Fig 5E reports the fraction of CD4+ T cells expressing intracellular CXCL13 after 6-7 day differentiation under each condition, measured by flow cytometry with anti-CXCL13 mAb (clone 53610, R&D Systems APC-conjugated). The 4% value under TGF-β1 represents the canonical Tfh-like CXCL13-producer subset that the ABM models as TCD4_TFH."

  - name: cxcl13_producer_fraction
    value: 0.04
    units: dimensionless
    input_type: derived_arithmetic
    source_inputs: [cxcl13_producer_fraction_pct]
    formula: "cxcl13_producer_fraction_pct / 100"
    source_ref: Ukita2022
    source_location: "Derived unit conversion (percentage to fraction)"
    rationale: "Convert 4% to 0.04 fraction for multiplication with total cell count."

  - name: producer_cells_per_well
    value: 20000
    units: cell
    input_type: derived_arithmetic
    source_inputs: [total_cd4_cells_per_well, cxcl13_producer_fraction]
    formula: "total_cd4_cells_per_well * cxcl13_producer_fraction"
    source_ref: Ukita2022
    source_location: "Derived from total CD4 cells × CXCL13+ producer fraction"
    rationale: "Effective CXCL13-producing Tfh-like cell count in the differentiation well: 5e5 × 0.04 = 2e4 producers. This is the cell-population on which the per-cell secretion rate operates; the ABM's BCELL_ACTIVATED-Breg state similarly represents the producer subset, not bulk cells. Forward model cell_count uses this producer-corrected value."

  - name: incubation_time_days
    value: 7
    units: day
    input_type: direct_measurement
    source_ref: Ukita2022
    source_location: "Methods, Cell culture (line 533 of PDF)"
    value_snippet: "Human T cells were differentiated for 6–7 days in a humidified 5% CO2 incubator"

  - name: seconds_per_day
    value: 86400
    units: second / day
    input_type: unit_conversion
    source_ref: Ukita2022
    source_location: "Forward-model unit convention"
    rationale: "SI conversion. PARAM_TFH_CXCL13_RELEASE has units pmol/(cell*s) so duration must be supplied in seconds."

  - name: incubation_time_s
    value: 604800
    units: second
    input_type: derived_arithmetic
    source_inputs: [incubation_time_days, seconds_per_day]
    formula: "incubation_time_days * seconds_per_day"
    source_ref: Ukita2022
    source_location: "Derived from Methods (6-7 day differentiation; we use 7-day upper bound matching Tfh-commitment peak)"
    rationale: "Convert 7 days to seconds. Used the 7-day upper bound of Ukita's stated 6-7 day range because (a) Tfh differentiation peaks at d6-7 per Gu-Trantien2017 timecourse and (b) the Fig 5F ELISA was likely collected at the protocol endpoint."

  - name: CXCL13_MW
    value: 10300
    units: gram / mole
    input_type: unit_conversion
    source_ref: Ukita2022
    source_location: "Forward-model unit convention (UniProt O43927 mature human CXCL13)"
    rationale: "Mature secreted human CXCL13 (B-lymphocyte chemoattractant, BCA-1, BLC) is the 87-aa mature cleaved monomer (UniProt O43927 residues 23-109, MW ~10.3 kDa). R&D Quantikine Human CXCL13/BLC/BCA-1 ELISA used by Ukita2022 is calibrated to a recombinant E. coli-expressed standard at ~10.3 kDa. Used to convert between molar secretion rate and mass concentration."

  - name: n_replicates
    value: 3
    units: dimensionless
    input_type: direct_measurement
    source_ref: Ukita2022
    source_location: "Figure 5 caption (lower-right of Page 9 of PDF), SEM (n = 3-4)"
    figure_excerpt:
      figure_id: "Figure 5 caption"
      value: "n = 3-4 replicates"
      description: "Caption reports 'Data are shown as the mean ± SEM (n = 3–4)' for Fig 5 panels. We adopt the lower bound n=3 as the conservative interpretation for the Fig 5F bars."
      context: "Multiple healthy human donors / experimental replicates. Whether 'n=3-4' counts technical or biological replicates is not specified in the caption; conservative interpretation as donor-level biological replicates."

  - name: fig5f_cd4_tgf_mean
    value: 5000
    units: picogram / milliliter
    input_type: direct_measurement
    source_ref: Ukita2022
    source_location: "Figure 5F (Page 9 of PDF), CD4 panel TGF-β bar"
    figure_excerpt:
      figure_id: "Figure 5F"
      value: "~5000 pg/mL"
      description: "CD4 panel of Fig 5F: y-axis 'CXCL13 (pg/ml)', linear scale 0-30000 with gridlines at 10000/20000/30000 pg/mL. TGF-β bar height visually reads at approximately 5000 pg/mL (about 1/6 of the way to 30000), with *** significance vs Medium control."
      context: "Fig 5F reports CXCL13 supernatant concentration after 6-7 day differentiation under each condition, measured by R&D Quantikine Human CXCL13/BLC/BCA-1 ELISA. The TGF-β condition (10 ng/mL TGF-β1, no IL-2 deprivation) represents canonical Tfh differentiation. Higher conditions in the same panel: TGF+α-IL-2 Ab ~24000 pg/mL (peak; not used because IL-2 deprivation is a non-standard test condition); TGF+IL-12 ~5000 pg/mL (similar to TGF alone)."

  - name: fig5f_cd4_tgf_sem
    value: 1500
    units: picogram / milliliter
    input_type: direct_measurement
    source_ref: Ukita2022
    source_location: "Figure 5F (Page 9 of PDF), CD4 panel TGF-β error bar"
    figure_excerpt:
      figure_id: "Figure 5F"
      value: "~1500 pg/mL SEM"
      description: "Upper error bar of the CD4 TGF-β bar in Fig 5F; visual offset of the cap above the bar top, ~1000-2000 pg/mL, midpoint 1500 pg/mL."
      context: "SEM at n=3 replicates per Fig 5 caption. SD = SEM × sqrt(n) ≈ 2598 pg/mL in observation_code derivation. Larger SEM relative to mean reflects donor-to-donor variability typical of primary CD4+ T cell differentiation."

calibration:
  parameters:
    - name: PARAM_TFH_CXCL13_RELEASE
      units: picomole / (cell * second)

  forward_model:
    type: batch_accumulation
    secretion_rate: PARAM_TFH_CXCL13_RELEASE
    cell_count: {input_ref: producer_cells_per_well}
    incubation_time: {input_ref: incubation_time_s}
    molecular_weight: {input_ref: CXCL13_MW}
    medium_volume: {input_ref: per_mL_basis_volume}
    unit_conversion_factor: "1.0"
    data_rationale: |
      Ukita 2022 Fig 5F is a standard in vitro batch-accumulation ELISA: 5×10⁵
      bulk human naive CD4+ T cells per mL (field-convention seeding density)
      stimulated with plate-bound αCD3 (5 μg/mL) + αCD28 (10 μg/mL) + 10
      ng/mL TGF-β1 in IMDM + 10% FBS for 7 days; R&D Quantikine Human CXCL13
      ELISA on the supernatant. Predicted accumulation under the producer-
      fraction correction: only ~4% of bulk CD4+ cells become CXCL13+
      PD-1+CXCR5- Tph-like cells per Fig 5E, so effective producers = 2e4 /
      mL. Forward model: [CXCL13] (pg/mL) = sec_rate (pmol/cell/s) * 2e4
      (producer cells) * 604800 (s) * 10300 (pg/pmol) / 1 (mL) = sec_rate *
      1.246e14 (pg/mL per pmol/cell/s). At the measured ~5000 pg/mL this
      gives sec_rate ≈ 4.01e-11 pmol/cell/s. This directly constrains the
      per-Tfh-cell continuous CXCL13 secretion rate that the PDAC ABM
      applies to TCD4_TFH-state cells.
    submodel_rationale: |
      In the PDAC ABM, every living CD4+ T cell in state TCD4_TFH atomically
      adds PARAM_TFH_CXCL13_RELEASE / voxel_volume to the local CXCL13 PDE
      source array each ABM step (t_reg.cuh:531-532). Other CD4 states
      (TCD4_NAIVE, TCD4_TH, TCD4_TREG) secrete zero CXCL13 in this pathway.
      Tfh cells are the canonical TLS CXCL13 source per the T5d biology
      finding (B cells are CXCR5+ sinks, FDCs not modeled). The Ukita2022
      TGF-β-induced CXCL13+ CD4+ subset has PD-1+CXCR5- phenotype (Fig 5G),
      which maps to the ABM's TCD4_TFH commitment state via the IL-6 +
      TGF-β + CD3/CD28 differentiation logic. CXCL13 is the master B cell
      attractant chemokine (CXCR5 ligand) and the primary TLS organizing
      signal; the per-Tfh-cell continuous rate represents the maximum
      sustained-output of a fully committed Tfh-like cell, which matches
      the ABM's no-gating flat-rate abstraction.

  error_model:
    - name: cd4_tgfb_cxcl13_supernatant_pg_per_mL
      units: picogram / milliliter
      uses_inputs: [fig5f_cd4_tgf_mean, fig5f_cd4_tgf_sem, n_replicates]
      sample_size_input: n_replicates
      observation_code: |
        def derive_observation(inputs, sample_size, rng, n_bootstrap):
            import numpy as np
            mean = inputs['fig5f_cd4_tgf_mean']
            sem = inputs['fig5f_cd4_tgf_sem']
            return rng.normal(mean, sem, n_bootstrap)

  identifiability_notes: |
    Single parameter PARAM_TFH_CXCL13_RELEASE constrained by one direct
    observation (Fig 5F CD4 TGF-β supernatant at 7 d) with producer-
    fraction correction from Fig 5E. The batch_accumulation forward model
    is bijective between sec_rate and supernatant concentration given fixed
    cells/time/MW/volume — no identifiability ambiguity. Inference quality
    limited by (a) the n=3 SEM uncertainty (~30% relative on the mean),
    (b) cell-density field-convention assumption (5e5 cells/mL is standard
    but unstated by Ukita), (c) producer-fraction visual readout from Fig
    5E (~4% with ±1% visual uncertainty), and (d) ovarian-cancer source
    vs PDAC indication translation (both have TLS; cytokine milieu may
    differ). The current XML 4.97e-11 sits near the Ukita-implied 4.01e-11
    — this YAML formalizes the producer-fraction-corrected anchor rather
    than introducing a major shift in the prior.

experimental_context:
  species: human
  indication: healthy_immune_cells
  system: in_vitro_primary
  cell_lines:
    - name: human_naive_CD4_pos_T_cells
      species: human
      tissue_origin: peripheral_blood
      cell_type: T_cell_CD4_naive
      source: "Healthy donor peripheral blood, Ficoll-Paque mononuclear cell isolation, then Miltenyi naive CD4+ T cell isolation kit II magnetic depletion (negative selection)."
  culture_conditions:
    medium: "IMDM + 10% FBS + penicillin/streptomycin 100 U/mL"
    serum_concentration: 10
    serum_concentration_units: "% FBS"
    culture_type: "adherent_short_term"
    duration: "6-7 days"
    oxygen_level: "normoxic"
    notes: "Plate-bound CD3 (clone OKT3, 5 μg/mL) + CD28 (clone CD28.2, 10 μg/mL) coating; 10 ng/mL TGF-β1 (Cell Signaling Technology) supplemented in medium. Cells/mL not stated in Methods — field-convention 5e5 cells/mL assumed. Fig 5F supernatant collected at protocol endpoint (day 7) and quantified by R&D Quantikine Human CXCL13/BLC/BCA-1 ELISA."

source_relevance:
  indication_match: proxy
  indication_match_justification: >
    Ukita2022 derived their CXCL13-producing CD4+ T cell observations in the
    context of ovarian cancer (high-grade serous ovarian cancer TLS), not
    PDAC. Both ovarian and pancreatic cancer share TGF-β-rich tumor
    microenvironments and TLS-supporting niches, so the in vitro
    TGF-β-driven CD4+ Tfh-like differentiation is a defensible cross-
    indication proxy. The cellular phenotype (PD-1+CXCR5- TGF-β-induced
    CD4+ CXCL13+) directly maps to the ABM's TCD4_TFH commitment state at
    the gene-program level.
  species_source: human
  species_target: human
  source_quality: primary_human_in_vitro
  perturbation_type: pharmacological
  perturbation_relevance: >
    Ukita uses plate-bound αCD3 (TCR ligation) + αCD28 (costimulation) +
    TGF-β1 (10 ng/mL) — the canonical in vitro Tfh-like differentiation
    cocktail. In vivo PDAC TLS Tfh activators include cognate Tfh-B
    interaction (CD40L), Tfh-specific cytokines (IL-6, IL-21, IL-23), and
    TGF-β from CAFs/Tregs/macrophages. The TGF-β driver is shared between
    in vitro and in vivo, supporting cross-system applicability; missing
    IL-21 amplification loop may make the in vitro CXCL13 output somewhat
    lower than in vivo peak rates.
  tme_compatibility: low
  tme_compatibility_notes: >
    Three translation gaps: (1) ovarian cancer-derived CD4+ TIL phenotype
    vs PDAC TLS-resident Tfh cell. Both cancer types share TGF-β-rich TME
    and TLS biology; the producer-CD4 subset (PD-1+CXCR5- Tph-like) is
    well-conserved across cancer indications. (2) In vitro CD4+
    differentiation vs in vivo TLS-resident Tfh cell. The 7-day protocol
    captures terminal Tfh commitment but lacks the chronic in vivo
    cytokine milieu (BAFF, APRIL, IL-21, persistent antigen). (3) Tissue
    context — suspension/adherent culture without surrounding stroma,
    hypoxia, or chronic Treg-derived TGF-β suppression. The ABM abstracts
    TCD4_TFH as a continuous flat-rate CXCL13 secretor; the Ukita-derived
    rate represents the saturating-stimulus output of a fully differentiated
    Tfh-like cell, which best matches the ABM's no-gating abstraction.
  measurement_directness: proxy_observable
  temporal_resolution: endpoint_pair
  experimental_system: in_vitro_primary

study_interpretation: >
  Ukita et al. 2022 was the first detailed characterization of the
  CXCL13-producing CD4+ T cell subset in ovarian cancer TLS, establishing
  that the PD-1+CXCR5- (Tph-like) phenotype is the predominant Tfh-cell
  source of CXCL13 in early/transitional TLS, and that TGF-β1 is the
  primary cytokine driver of CXCL13+ CD4 differentiation from naive
  precursors. Figure 5F is the quantitative anchor for the per-Tfh-cell
  CXCL13 secretion rate: 5×10⁵ naive CD4+ T cells per mL (field-convention
  seeding) stimulated with plate-bound αCD3/αCD28 + 10 ng/mL TGF-β1 for 7
  days produces a mean of approximately 5000 pg/mL CXCL13 in supernatant
  (SEM ~1500 pg/mL, n=3 donors, R&D Quantikine ELISA). Figure 5E confirms
  ~4% of bulk CD4+ cells are CXCL13+ producers, so the effective producer
  cell count is 2×10⁴/mL. Converting via the batch_accumulation forward
  model with mature CXCL13 MW = 10.3 kDa yields a per-Tfh-cell rate of
  approximately 4.0e-11 pmol/cell/s. This is consistent with the current
  XML default 4.97e-11 pmol/cell/s, which was set by a prior MAPLE pass
  cited as "~100x down. Ukita2022" — confirming the prior calibration
  correctly captured the Ukita data within a small margin. This R4-T6
  re-validation reaffirms the XML value under the current MAPLE schema
  and provides a producer-fraction-corrected formalization of the forward
  model. **Note for cross-cutting BCELL_*_RELEASE context (T5a/b/c):
  Unlike the B-cell secretion family, TFH_CXCL13_RELEASE was NOT a
  unit-conversion error — the prior MAPLE pass correctly identified and
  fixed the order of magnitude. The "~100x down" XML comment reflects a
  legitimate biological correction, not a unit bug.**

key_assumptions:
  - "Cell density 5×10⁵ cells/mL is the standard human primary CD4+ T cell differentiation seeding density for plate-bound αCD3/αCD28 protocols. Ukita does not state this number but the protocol is conventional; the per-cell rate is V-cancellation-invariant so absolute volume choice does not matter."
  - "The 6-7 day differentiation range is treated as 7 days (upper bound), corresponding to peak Tfh commitment per Gu-Trantien 2017 timecourse."
  - "CXCL13+ producer fraction is 4% of bulk CD4 cells under TGF-β stimulation (Fig 5E TGF-β bar visual readout). The forward model applies the per-Tfh-cell rate to the producer subset only; the 4% number is a load-bearing assumption."
  - "Mature secreted human CXCL13 MW is 10.3 kDa (UniProt O43927). R&D Quantikine CXCL13/BLC/BCA-1 ELISA standards are calibrated at this MW."
  - "CD4 cell number is approximately constant over the 7-day differentiation (minor proliferation expected with αCD3/αCD28; minor cell loss from apoptosis < 20% typical)."
  - "Ovarian cancer Tfh-like cells are a defensible cross-indication proxy for PDAC TLS Tfh cells. Both cancer types share TGF-β-rich TMEs and TLS biology; the underlying T cell program (TGF-β-driven PD-1+CXCR5- differentiation) is conserved."

key_study_limitations:
  - "Cells/mL not stated in Ukita Methods — field-convention 5×10⁵ assumed. This is V-cancellation invariant for the per-cell rate but adds uncertainty if the actual seeding was unusual (e.g., 1×10⁶ would shift per-cell rate 2× down). The producer-fraction correction is the dominant unknown rather than the seeding density."
  - "Producer-fraction visual readout. Fig 5E CD4 TGF-β bar was read at ~4% with ±1% visual uncertainty (gridlines at 5% and 10% — bar between 3% and 5%). This adds ±25% uncertainty to the implied per-Tfh rate."
  - "Visual figure readout of Fig 5F supernatant value. Linear 0-30000 axis with gridlines at 10000/20000/30000 — TGF-β bar reads at ~5000 ± ~500 pg/mL by eye."
  - "Indication translation from ovarian cancer to PDAC. Although both share TGF-β-rich TLS biology, IL-6 / IL-21 / IL-23 / BAFF balance may differ between the two cancers, affecting Tfh commitment kinetics and CXCL13 output."
  - "In vitro differentiation captures terminal Tfh commitment in 7 days, but in vivo TLS Tfh cells maintain CXCL13 production over weeks-months under chronic antigen + cytokine milieu. The rate may underestimate sustained in vivo output."
  - "TGF-β stimulation is one of multiple Tfh-licensing pathways. The TGF + α-IL-2 Ab condition in Fig 5F (peak 24000 pg/mL) suggests IL-2 deprivation in TLS would push CXCL13 output ~5× higher; the chosen TGF-only condition is a conservative anchor."

