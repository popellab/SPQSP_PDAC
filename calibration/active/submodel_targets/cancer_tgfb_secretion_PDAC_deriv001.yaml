target_id: cancer_tgfb_secretion

inputs:
  - name: cells_per_well
    value: 300000
    units: cell
    input_type: direct_measurement
    source_ref: Roger2019
    source_location: "Material and methods, Conditioned medium production (p.2)"
    value_snippet: "For CM production of Capan-2 and sNF96.2 cells cultured alone, 300,000 cells of each cellular type were seeded onto a six-well tissue culture plate in complete DMEM."

  - name: incubation_time_h
    value: 24
    units: hour
    input_type: direct_measurement
    source_ref: Roger2019
    source_location: "Material and methods, Conditioned medium production (p.2)"
    value_snippet: "In all experiments, except for Fig. S5 (in which conditioned medium was harvested at 72 h), conditioned media were collected after 24 h of culture"

  - name: seconds_per_hour
    value: 3600
    units: second / hour
    input_type: unit_conversion
    source_ref: Roger2019
    source_location: "Forward-model unit convention"
    rationale: "SI unit conversion. Roger reports incubation in hours; PARAM_STEM_TGFB_RELEASE has units of pmol/(cell*s) so time must be supplied in seconds to the batch_accumulation forward model."

  - name: incubation_time_s
    value: 86400
    units: second
    input_type: derived_arithmetic
    source_inputs: [incubation_time_h, seconds_per_hour]
    formula: "incubation_time_h * seconds_per_hour"
    source_ref: Roger2019
    source_location: "Derived from Conditioned medium production methods"
    rationale: "Convert the 24 h incubation to seconds for the batch_accumulation forward model whose secretion rate parameter is in 1/s."

  - name: well_volume_mL
    value: 2.0
    units: milliliter
    input_type: unit_conversion
    source_ref: Roger2019
    source_location: "Material and methods, Conditioned medium production (p.2)"
    rationale: "Roger 2019 Methods specifies '300,000 cells of each cellular type were seeded onto a six-well tissue culture plate' and that 'medium was replaced by DMEM containing 0.5% FBS' but does not explicitly state CM volume per well. 2.0 mL is the standard working volume for a six-well tissue-culture plate per Corning and ATCC protocols (Corning Cat #3516 product specification: recommended working volume 1.9-2.9 mL, typical 2 mL). Roger's later proteomics methods describe pooling '12 mL CM aliquots' which is consistent with 6 wells x 2 mL/well."

  - name: TGFb1_MW
    value: 25000
    units: gram / mole
    input_type: unit_conversion
    source_ref: Roger2019
    source_location: "Material and methods, ELISA (p.4)"
    rationale: "R&D Systems Quantikine human TGFb1 ELISA detects the mature, biologically active TGFb1 homodimer (UniProt P01137, mature peptide 112 aa per monomer x 2, ~25 kDa total) after acid activation of latent complexes. The kit's standard curve is calibrated in pg/mL of mature TGFb1 dimer. 25,000 g/mol used to convert between molar secretion rate (pmol/cell/s) and mass concentration (pg/mL)."

  - name: n_biological_replicates
    value: 3
    units: dimensionless
    input_type: direct_measurement
    source_ref: Roger2019
    source_location: "Figure 2a caption (p.9)"
    value_snippet: "Quantification of soluble TGFb1 concentration is represented as mean +/- SD (n = 3 independent biological replicates, **P < 0.01)."

  - name: wpd_capan2_pt1
    value: -1.923076923
    units: picogram / milliliter
    input_type: direct_measurement
    source_ref: Roger2019
    source_location: "Figure 2a (p.9), Capan-2 CM bar"
    figure_excerpt:
      figure_id: "Figure 2a"
      value: "-1.92 pg/mL"
      description: "Digitized open-circle data point on the Capan-2 CM bar, WebPlotDigitizer extraction"
      context: "Mean +/- SD with n=3 individual replicates plotted as open circles. The lowest replicate sits at or just below the zero baseline of the linear y-axis, likely reflecting background subtraction below the kit LOD (Quantikine TGFb1 sensitivity ~7 pg/mL)."

  - name: wpd_capan2_pt2
    value: 34.61538462
    units: picogram / milliliter
    input_type: direct_measurement
    source_ref: Roger2019
    source_location: "Figure 2a (p.9), Capan-2 CM bar"
    figure_excerpt:
      figure_id: "Figure 2a"
      value: "34.6 pg/mL"
      description: "Digitized open-circle data point on the Capan-2 CM bar, WebPlotDigitizer extraction"
      context: "Middle of the three n=3 replicates"

  - name: wpd_capan2_pt3
    value: 48.07692308
    units: picogram / milliliter
    input_type: direct_measurement
    source_ref: Roger2019
    source_location: "Figure 2a (p.9), Capan-2 CM bar"
    figure_excerpt:
      figure_id: "Figure 2a"
      value: "48.1 pg/mL"
      description: "Digitized open-circle data point on the Capan-2 CM bar, WebPlotDigitizer extraction"
      context: "Top of the three n=3 replicates; closest to the text's ~50 pg/mL textual approximation"

calibration:
  parameters:
    - name: PARAM_STEM_TGFB_RELEASE
      units: picomole / (cell * second)

  forward_model:
    type: batch_accumulation
    secretion_rate: PARAM_STEM_TGFB_RELEASE
    cell_count: {input_ref: cells_per_well}
    incubation_time: {input_ref: incubation_time_s}
    molecular_weight: {input_ref: TGFb1_MW}
    medium_volume: {input_ref: well_volume_mL}
    unit_conversion_factor: "1.0"
    data_rationale: |
      Roger 2019 Fig 2a is a canonical in vitro batch accumulation assay: 3e5 Capan-2 PDAC cells
      seeded per well of a 6-well plate, conditioned in 0.5% FBS DMEM for 24 h, supernatant TGFb1
      quantified by R&D Quantikine ELISA (acid-activated total TGFb1, MW ~25 kDa homodimer).
      Predicted accumulation: [TGFb1] (pg/mL) = sec_rate (pmol/cell/s) * 3e5 (cells) * 86400 (s)
      * 25000 (g/mol = pg/pmol) / 2 (mL) = sec_rate * 3.24e14 (pg/mL per pmol/cell/s). This
      directly constrains the per-cell continuous TGFb1 secretion rate that the ABM applies to
      living STEM and PROG cancer cells.
    submodel_rationale: |
      In the PDAC ABM, every living cancer cell of state CANCER_STEM or CANCER_PROGENITOR
      atomically adds (PARAM_STEM_TGFB_RELEASE or PARAM_PROG_TGFB_RELEASE) / voxel_volume
      to the local TGFb PDE source array each ABM step (cancer_cell.cuh:599, 607, 648).
      The PDE solver then integrates the source over the operator-splitting substeps. No
      Hill gating, no hypoxia boost, no neighbor-density modulation -- a flat per-cell rate
      while alive. Senescent and dead cancer cells secrete zero. The Roger 2019 assay
      maps cleanly: Capan-2 is a continuous PDAC line dominated by progenitor-like cells
      (long-passaged, weakly CD133-enriched), so the observed supernatant accumulation
      reflects predominantly the PROG rate. Per the user's pooling decision (informed
      by Lonardo 2011's finding that TGFb mRNA is unchanged between CD133+ pancreatic
      cancer stem cells and bulk), STEM_TGFB_RELEASE is inferred from this target and
      PROG_TGFB_RELEASE is mirrored to the same posterior in the ledger sync step.

  error_model:
    - name: capan2_tgfb1_supernatant_pg_per_mL
      units: picogram / milliliter
      uses_inputs: [wpd_capan2_pt1, wpd_capan2_pt2, wpd_capan2_pt3, n_biological_replicates]
      sample_size_input: n_biological_replicates
      observation_code: |
        def derive_observation(inputs, sample_size, rng, n_bootstrap):
            import numpy as np
            pts = np.array([
                inputs['wpd_capan2_pt1'],
                inputs['wpd_capan2_pt2'],
                inputs['wpd_capan2_pt3'],
            ])
            mean = pts.mean()
            sd = pts.std(ddof=1)
            sem = sd / np.sqrt(sample_size)
            return rng.normal(mean, sem, n_bootstrap)

  identifiability_notes: |
    Single parameter PARAM_STEM_TGFB_RELEASE constrained by one direct observation
    (the Capan-2 CM TGFb1 supernatant accumulation at 24 h). The batch_accumulation
    forward model is bijective between sec_rate and supernatant concentration given
    fixed cells/time/MW/vol -- no identifiability ambiguity within the assay. The
    inference quality is limited by (a) the n=3 replicate spread (CV ~96% near LOD),
    (b) the implicit assumption that the standard 6-well volume is 2 mL (not stated
    in the paper; varies +/-25% across labs), and (c) the cross-cell-line translation
    to in vivo PDAC tumors (Capan-2 is well-differentiated; PANC-1 / MIA PaCa-2 may
    secrete more). PARAM_PROG_TGFB_RELEASE is intentionally not in this target's
    parameter list -- it will be mirrored to PARAM_STEM's posterior in the ledger
    sync (see Lonardo 2011 pooling justification in study_interpretation).

experimental_context:
  species: human
  indication: PDAC
  system: in_vitro_immortalized
  cell_lines:
    - name: Capan-2
      species: human
      tissue_origin: pancreas
      cell_type: pancreatic_ductal_adenocarcinoma
      source: "ATCC HTB-80"
  culture_conditions:
    medium: "DMEM"
    serum_concentration: 0.5
    serum_concentration_units: "% FBS"
    culture_type: "2d_monolayer"
    duration: "24 h"
    oxygen_level: "normoxic"
    notes: "300,000 cells/well in a 6-well tissue culture plate, mycoplasma-negative. Cells attached overnight in complete DMEM (10% FBS), then medium swapped to DMEM + 0.5% FBS for the 24 h conditioning window."

source_relevance:
  indication_match: exact
  indication_match_justification: >
    Capan-2 is a well-differentiated human PDAC cell line (ATCC HTB-80) derived from
    a 56-year-old female with primary pancreatic adenocarcinoma. Direct match to the
    target indication. Some risk that long-passaged cell lines drift from primary
    tumor secretion profiles; documented in tme_compatibility_notes.
  species_source: human
  species_target: human
  source_quality: primary_human_in_vitro
  perturbation_type: physiological_baseline
  perturbation_relevance: >
    No pharmacological perturbation in the data point used. The 0.5% FBS reduces
    serum-borne latent TGFb carry-in but does not actively stimulate or inhibit
    endogenous secretion. SB-431542 (TGFb-receptor inhibitor) conditions in other
    panels of Fig 2 are downstream signaling readouts and not used for this target.
  tme_compatibility: moderate
  tme_compatibility_notes: >
    Capan-2 in vitro under static, monolayer, partially-serum-deprived conditions vs
    in vivo PDAC tumor: the tumor TME has chronic hypoxia, dense desmoplastic ECM,
    cytokine-driven activation feedback, and PSC/CAF paracrine inputs that the
    in vitro assay does not capture. Endogenous TGFb secretion is known to be
    upregulated by hypoxia (HIF1a target) and by autocrine SMAD signaling, so the
    Capan-2 in vitro value likely underestimates the in vivo per-cell rate by some
    factor (model translation_uncertainty captures this). Capan-2 also belongs to
    the well-differentiated PDAC subtype; mesenchymal-shifted lines like PANC-1
    and MIA PaCa-2 may secrete more TGFb per cell.
  measurement_directness: direct
  temporal_resolution: endpoint_pair
  experimental_system: in_vitro_cell_line

study_interpretation: >
  Roger et al. 2019 measured the soluble TGFb1 secreted by Capan-2 pancreatic cancer
  cells into conditioned medium over a 24 h batch culture, in the course of demonstrating
  that Schwann cells (sNF96.2) are a much stronger TGFb source than the cancer cells
  themselves in their co-culture model. The Capan-2 endogenous baseline value (mean
  ~27 pg/mL with high relative variability across the n=3 replicates, one of which
  sat at or below the kit limit-of-detection) directly constrains the per-cell TGFb1
  secretion rate that the PDAC ABM applies to STEM and PROG cancer cells. Conversion
  via the batch_accumulation forward model with the stated cell count, incubation
  time, well volume (standard 6-well), and TGFb1 MW (25 kDa mature dimer) implies
  a per-cell rate of ~8.3e-14 pmol/cell/s, about 60x below the legacy XML default
  of 5e-12 pmol/cell/s. The CSV prior was broadened to lognormal(median=6.3e-13,
  sigma=1.5) ahead of this target's MCMC to bracket both Roger's implied rate and
  the legacy default (each ~1.4 sigmas from the new median), allowing the joint
  inference to pull the posterior toward the data. PARAM_PROG_TGFB_RELEASE is
  intentionally pooled to share the inferred PARAM_STEM rate, justified by the
  Lonardo et al. 2011 finding that TGFb mRNA is unchanged between CD133+ pancreatic
  cancer stem cells and the differentiated bulk -- pooling avoids over-splitting
  two parameters with no quantitative differentiation evidence.

key_assumptions:
  - "Conditioned medium volume per 6-well is 2.0 mL (standard Corning/ATCC protocol; Roger does not state explicitly)."
  - "R&D Quantikine TGFb1 ELISA following the manufacturer protocol measures total (acid-activated) TGFb1, consistent with the per-cell secretion rate concept (total cumulative production from latent + active forms)."
  - "Mature TGFb1 homodimer MW is 25 kDa (UniProt P01137 mature peptide x2); R&D kit standard curve is calibrated in pg/mL of this dimer."
  - "Capan-2 cell number is constant over the 24 h incubation (no significant proliferation under 0.5% FBS conditions). Mild departure from this would shift the effective per-cell rate by <20% over the integration window."
  - "Capan-2 in this assay is a continuous-passage line whose stem-cell fraction is small (typical <5% for non-enriched PDAC lines per Hermann 2007), so the observed bulk supernatant value approximates the progenitor-state secretion rate. Together with the Lonardo 2011 finding (STEM TGFb ~= bulk TGFb), this supports pooling STEM and PROG."
  - "Per-cell TGFb secretion in the ABM is a flat rate when cells are alive (no Hill gating); the in vitro 24 h endpoint thus integrates a flat rate, matching the model structure."

key_study_limitations:
  - "Single cell line (Capan-2). Bellone 2006 reports five-line panel data but figure digitization was not feasible in this round; mesenchymal-shifted PDAC lines may secrete more TGFb. Cross-line variability is folded into the translation uncertainty."
  - "Well volume per Roger 2019 Methods is implied (six-well plate, 300,000 cells, 0.5% FBS DMEM) but not numerically stated; 2 mL standard assumed."
  - "One of three n=3 replicates is at or below the kit LOD (~7 pg/mL Quantikine sensitivity). The digitized value (-1.92 pg/mL) is a baseline-subtraction artifact, not a true negative concentration. The bootstrap uses the empirical mean and SD across all three replicates, which is conservative."
  - "In vitro static monolayer underestimates in vivo TGFb secretion driven by hypoxia, autocrine SMAD feedback, and PSC paracrine inputs. The TME translation uncertainty for this target is moderate, captured in source_relevance.tme_compatibility = moderate."
  - "Mature TGFb1 dimer assumption: the kit detects 25 kDa active form after acid activation. If the secreted pool is predominantly LAP-bound latent (true for many epithelial cells), the acid-activation step recovers near-total TGFb1, but residual measurement efficiency <100% would systematically underestimate the per-cell rate."

